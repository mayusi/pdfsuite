    <style>
:root {
  color-scheme: dark;
  --bg: #09090b;
  --card: #131316;
  --border: #27272a;
  --text: #f4f4f5;
  --dim: #a1a1aa;
  --faint: #71717b;
  --accent: #34d399;
  --accent-hover: #6ee7b7;
  --danger: #f87171;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
::selection { background: rgba(52, 211, 153, 0.3); }

#app { max-width: 960px; margin: 0 auto; padding: 0 16px 64px; min-height: 100vh; display: flex; flex-direction: column; }

/* header */
header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--border); }
.brand { text-decoration: none; color: var(--text); display: flex; align-items: baseline; gap: 10px; }
.brand b { font-size: 20px; letter-spacing: -0.02em; font-weight: 700; }
.accent { color: var(--accent); }
.tagline { font-size: 12px; color: var(--faint); }
.gh { color: var(--dim); }
.gh:hover { color: var(--text); }
.icon { width: 20px; height: 20px; }
.icon-lg { width: 28px; height: 28px; }
.icon-sm { width: 14px; height: 14px; }
.dim { color: var(--faint); }

/* home */
main { padding-top: 36px; }
h1 { font-size: 30px; line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 10px; max-width: 640px; }
.sub { color: var(--dim); display: flex; align-items: center; gap: 8px; margin: 0 0 30px; font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.toolcard {
  display: block; padding: 20px; border: 1px solid var(--border); border-radius: 12px;
  background: var(--card); text-decoration: none; color: var(--text); transition: border-color 0.15s;
}
.toolcard:hover { border-color: var(--accent); }
.toolcard h2 { font-size: 16px; margin: 12px 0 4px; }
.toolcard p { font-size: 13px; color: var(--dim); margin: 0; }

/* tool view */
.back { color: var(--dim); font-size: 13px; text-decoration: none; }
.back:hover { color: var(--text); }
main h1 { font-size: 24px; margin-top: 14px; }
.tool { display: flex; flex-direction: column; gap: 14px; }

/* dropzone */
.dropzone {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 36px; border: 2px dashed var(--border); border-radius: 12px;
  background: rgba(19, 19, 22, 0.5); color: var(--dim); cursor: pointer; transition: all 0.15s;
  text-align: center;
}
.dropzone:hover { border-color: var(--faint); }
.dropzone:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dropzone.over { border-color: var(--accent); background: rgba(52, 211, 153, 0.08); }
.dz-text em { color: var(--accent); font-style: normal; }
.hidden-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* cards + lists */
.card { border: 1px solid var(--border); border-radius: 12px; background: var(--card); padding: 14px 16px; }
.filelist { list-style: none; margin: 0; padding: 0; }
.filelist li { display: flex; align-items: center; gap: 8px; padding: 7px 4px; border-bottom: 1px solid var(--border); }
.filelist li:last-child { border-bottom: 0; }
.idx { width: 20px; text-align: center; color: var(--faint); font-size: 12px; }
.fname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.fsize { color: var(--faint); font-size: 12px; }
.iconbtn { background: none; border: 0; color: var(--dim); padding: 4px; border-radius: 6px; cursor: pointer; }
.iconbtn:hover { background: #2e2e33; color: var(--text); }
.iconbtn:disabled { opacity: 0.3; cursor: default; }

/* inputs */
.lbl { display: block; font-size: 12px; color: var(--faint); margin-bottom: 4px; }
.textin {
  width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); font: inherit; outline: none; margin-bottom: 10px;
}
.textin:focus { border-color: var(--accent); }
.radio-row { display: flex; gap: 18px; font-size: 14px; }
.radio { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.meta { color: var(--dim); font-size: 14px; margin: 0; }
.meta b { color: var(--text); }

/* buttons */
.btn {
  align-self: flex-start; padding: 10px 18px; border: 0; border-radius: 10px;
  background: var(--accent); color: #052e22; font-weight: 600; font-size: 14px; cursor: pointer;
}
.btn:hover { background: var(--accent-hover); }
.btn:disabled { opacity: 0.4; cursor: default; }
.error { color: var(--danger); font-size: 14px; margin: 0; }

/* page grids (organize + split picker) — cards proportioned to real MediaBox */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.pcard {
  position: relative; display: flex; flex-direction: column;
  border: 1px solid var(--border); border-radius: 10px; background: var(--card);
  padding: 8px; text-align: center; cursor: grab; transition: all 0.12s; user-select: none;
  max-height: 220px;
}
.pbody { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; }
.pcard.target { border-color: var(--accent); transform: scale(1.03); }
.pcard.deleted { opacity: 0.35; }
.pnum { font-size: 15px; font-weight: 600; }
.pdim { font-size: 11px; color: var(--faint); margin-top: 2px; }
.prot { font-size: 11px; color: var(--accent); margin-top: 2px; }
.pthumb { flex: 1; width: 100%; min-height: 0; object-fit: cover; border-radius: 6px; pointer-events: none; }
.ptext {
  flex: 1; min-height: 0; overflow: hidden; padding: 3px;
  font-size: 6.5px; line-height: 1.5; color: var(--faint); text-align: left;
  word-break: break-word; user-select: none;
}
.pops { display: flex; justify-content: center; gap: 4px; margin-top: 6px; opacity: 0; transition: opacity 0.15s; }
.pcard:hover .pops, .pcard.deleted .pops { opacity: 1; }

/* selectable cards (split) */
.pcard.pick { cursor: pointer; }
.pcard.pick:hover { border-color: var(--faint); }
.pcard.sel { border-color: var(--accent); background: rgba(52, 211, 153, 0.07); }
.pchk {
  position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border); color: transparent; background: var(--bg);
}
.pcard.sel .pchk { background: var(--accent); border-color: var(--accent); color: #052e22; }

/* toolbar */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.tbtn {
  padding: 5px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
  color: var(--dim); font-size: 12px; cursor: pointer;
}
.tbtn:hover { color: var(--text); border-color: var(--faint); }
.tbtn:disabled { opacity: 0.35; cursor: default; }

/* file list extras */
.filelist li { cursor: grab; }
.filelist li.target { background: rgba(52, 211, 153, 0.08); border-radius: 6px; }
.fmeta { color: var(--faint); font-size: 11px; margin-left: 8px; }
.ferr { color: var(--danger); font-size: 12px; }
.filelist.thumbs li { gap: 12px; }
.thumb { width: 34px; height: 34px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }

/* extracted image grid */
.igrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.icard { border: 1px solid var(--border); border-radius: 10px; background: var(--card); padding: 8px; position: relative; }
.icard img { width: 100%; max-height: 140px; object-fit: contain; border-radius: 6px; background: repeating-conic-gradient(#1a1a1e 0% 25%, #131316 0% 50%) 0 0 / 16px 16px; }
.imeta { display: flex; flex-direction: column; margin-top: 6px; }
.iname { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.idim { font-size: 11px; color: var(--faint); }
.isave {
  position: absolute; top: 12px; right: 12px; border: 1px solid var(--border); border-radius: 8px;
  background: rgba(9, 9, 11, 0.85); color: var(--dim); padding: 5px; cursor: pointer; opacity: 0; transition: opacity 0.15s;
}
.icard:hover .isave { opacity: 1; }
.isave:hover { color: var(--accent); border-color: var(--accent); }

/* metadata table (scrub) */
.mtable { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
.mtable td { padding: 5px 8px; border-top: 1px solid var(--border); vertical-align: top; }
.mtable tr:first-child td { border-top: 0; }
.mkey { color: var(--faint); width: 130px; font-family: ui-monospace, monospace; font-size: 12px; }
.mval { color: var(--danger); word-break: break-all; }

/* option rows (pagenum) */
.optrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 10px 0; align-items: end; }
.textin.sel, .textin.num { margin-bottom: 0; }
.optrow .lbl { margin-bottom: 4px; }
.slider { width: 100%; accent-color: var(--accent); }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }

/* rendered canvas thumbnails */
.pcanvas { flex: 1; width: 100%; min-height: 0; object-fit: contain; border-radius: 6px; background: #fff; pointer-events: none; }
.pcanvas-sm { width: 100%; height: auto; border-radius: 4px; background: #fff; display: block; }

/* drag insertion line */
.pcard.drop-before { box-shadow: inset 3px 0 0 var(--accent); }
.pcard.drop-after { box-shadow: inset -3px 0 0 var(--accent); }

/* zoom button on selectable cards */
.pzoom {
  position: absolute; top: 6px; left: 6px; width: 24px; height: 24px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border); background: rgba(9,9,11,0.8); color: var(--dim);
  cursor: zoom-in; opacity: 0; transition: opacity 0.15s; padding: 0;
}
.pcard:hover .pzoom { opacity: 1; }
.pzoom:hover { color: var(--accent); border-color: var(--accent); }

/* lightbox */
.lightbox {
  position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.75); backdrop-filter: blur(3px); padding: 24px;
}
.lb-box { max-width: 92vw; max-height: 92vh; display: flex; flex-direction: column; gap: 8px; }
.lb-box canvas { max-width: 92vw; max-height: 86vh; width: auto; height: auto; border-radius: 8px; background: #fff; box-shadow: 0 12px 48px rgba(0,0,0,0.6); }
.lb-cap { text-align: center; color: var(--dim); font-size: 12px; }

/* merge expandable page strip */
.fdetail { flex-basis: 100%; margin-top: 6px; }
.pstrip { display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 2px 2px; }
.pstrip-cell { width: 64px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.pstrip-n { font-size: 10px; color: var(--faint); }

/* extract selection */
.icard { cursor: pointer; transition: border-color 0.12s; }
.icard.sel { border-color: var(--accent); background: rgba(52, 211, 153, 0.07); }
.icard .pchk { background: var(--bg); }
.icard.sel .pchk { background: var(--accent); border-color: var(--accent); color: #052e22; }
.toolbar .lbl input[type='checkbox'] { accent-color: var(--accent); margin-right: 5px; vertical-align: -2px; }

/* footer */
footer { margin-top: auto; padding-top: 60px; }
footer p { border-top: 1px solid var(--border); padding-top: 20px; color: var(--faint); font-size: 12px; }
footer p + p { border-top: 0; padding-top: 6px; }
footer a { color: var(--accent); }
footer em { color: var(--dim); }

    <script>

// ---- src/pdf/types.js ----
// PDF value model — tagged constructors + predicates.
// dict = Map<string, value>, array = Array<value>, number/bool/null = raw JS.

const name = (v) => ({ k: 'n', v })
const ref = (n, g = 0) => ({ k: 'r', n, g })
const str = (bytes) => ({ k: 's', bytes }) // literal string, raw bytes
const hex = (bytes) => ({ k: 'x', bytes }) // hex string
const stream = (dict, data) => ({ k: 't', dict, data }) // dict: Map

const isName = (v) => v?.k === 'n'
const isRef = (v) => v?.k === 'r'
const isStr = (v) => v?.k === 's'
const isHex = (v) => v?.k === 'x'
const isStream = (v) => v?.k === 't'
const isDict = (v) => v instanceof Map

const te = new TextEncoder()
const td = new TextDecoder('latin1')
const enc = (s) => te.encode(s)
const dec = (b) => td.decode(b)

/** Get dict value by key name (with or without leading slash). */
function get(dict, key) {
  if (!(dict instanceof Map)) return undefined
  return dict.get(key.replace(/^\//, ''))
}

/** Set dict value; returns the dict for chaining. */
function set(dict, key, value) {
  dict.set(key.replace(/^\//, ''), value)
  return dict
}

/** Type check helper: dict entry /Type matches name. */
function typeIs(dict, typeName) {
  const t = get(dict, 'Type')
  return isName(t) && t.v === typeName
}

// ---------- serialization ----------

const NAME_SPECIAL = /[^A-Za-z0-9_+\-.]/
function serName(s) {
  let out = '/'
  for (const ch of s) {
    const c = ch.codePointAt(0)
    out += NAME_SPECIAL.test(ch) ? '#' + c.toString(16).toUpperCase().padStart(2, '0') : ch
  }
  return out
}

function serStr(bytes) {
  const parts = []
  for (const b of bytes) {
    if (b === 0x28 || b === 0x29 || b === 0x5c) parts.push(0x5c, b) // ( ) \
    else parts.push(b)
  }
  const out = new Uint8Array(parts.length + 2)
  out[0] = 0x28
  out.set(parts, 1)
  out[out.length - 1] = 0x29
  return out
}

const toHex = (bytes) => [...bytes].map((b) => b.toString(16).padStart(2, '0')).join('')

function serNum(n) {
  if (Number.isInteger(n)) return String(n)
  let s = n.toFixed(6)
  s = s.replace(/\.?0+$/, '')
  return s === '-0' || s === '' ? '0' : s
}

/** Serialize a value to PDF syntax. Returns Uint8Array[] chunks. */
function serialize(v) {
  if (v === null || v === undefined) return [enc('null')]
  if (typeof v === 'boolean') return [enc(v ? 'true' : 'false')]
  if (typeof v === 'number') return [enc(serNum(v))]
  if (v instanceof Map) {
    const parts = [enc('<<')]
    for (const [k, val] of v) parts.push(enc(' ' + serName(k) + ' '), ...serialize(val))
    parts.push(enc('>>'))
    return parts
  }
  if (Array.isArray(v)) {
    const parts = [enc('[')]
    v.forEach((item, i) => parts.push(enc(i ? ' ' : ''), ...serialize(item)))
    parts.push(enc(']'))
    return parts
  }
  switch (v.k) {
    case 'n': return [enc(serName(v.v))]
    case 'r': return [enc(`${v.n} ${v.g} R`)]
    case 's': return [serStr(v.bytes)]
    case 'x': return [enc('<' + toHex(v.bytes) + '>')]
    case 't': {
      v.dict.set('Length', v.data.length)
      return [...serialize(v.dict), enc('\nstream\n'), v.data, enc('\nendstream')]
    }
    default:
      throw new Error('cannot serialize value: ' + JSON.stringify(v).slice(0, 80))
  }
}

function concat(parts) {
  const total = parts.reduce((n, p) => n + p.length, 0)
  const out = new Uint8Array(total)
  let o = 0
  for (const p of parts) {
    out.set(p, o)
    o += p.length
  }
  return out
}

// ---- src/pdf/env.js ----
// Environment-neutral inflate (FlateDecode). Node → zlib; browser → DecompressionStream.

async function inflate(data) {
  if (typeof process !== 'undefined' && process.versions?.node) {
    const { inflateSync } = await import('node:zlib')
    return new Uint8Array(inflateSync(data))
  }
  const out = await inflateRaw(data, 'deflate').catch(() => inflateRaw(data, 'deflate-raw'))
  if (!out) throw new Error('inflate failed')
  return out
}

async function inflateRaw(data, format) {
  const ds = new DecompressionStream(format)
  const stream = new Blob([data]).stream().pipeThrough(ds)
  return new Uint8Array(await new Response(stream).arrayBuffer())
}

// ---- src/pdf/parse.js ----

const WS = new Set([0x00, 0x09, 0x0a, 0x0c, 0x0d, 0x20])
const DELIM = new Set([0x28, 0x29, 0x3c, 0x3e, 0x5b, 0x5d, 0x7b, 0x7d, 0x2f, 0x25])
const isWs = (b) => WS.has(b)
const isDelim = (b) => isWs(b) || DELIM.has(b)
const isDigit = (b) => b >= 0x30 && b <= 0x39

function skipWs(buf, i) {
  while (i < buf.length) {
    if (isWs(buf[i])) i++
    else if (buf[i] === 0x25) {
      while (i < buf.length && buf[i] !== 0x0a && buf[i] !== 0x0d) i++ // % comment → EOL
    } else break
  }
  return i
}

function matchKeyword(buf, i, kw) {
  for (let j = 0; j < kw.length; j++) if (buf[i + j] !== kw.charCodeAt(j)) return false
  return true
}

/** Parse one PDF value at buf[i]. Returns [value, nextIndex]. */
function parseValue(buf, i, allowStream = false) {
  i = skipWs(buf, i)
  const b = buf[i]

  if (b === 0x3c) {
    // << dict >> or <hex>
    if (buf[i + 1] === 0x3c) {
      const dict = new Map()
      i += 2
      while (true) {
        i = skipWs(buf, i)
        if (buf[i] === 0x3e && buf[i + 1] === 0x3e) {
          i += 2
          break
        }
        if (buf[i] !== 0x2f) throw new Error(`dict: expected /key @${i}`)
        let keyEnd = i + 1
        while (keyEnd < buf.length && !isDelim(buf[keyEnd])) keyEnd++
        const key = decodeName(buf, i + 1, keyEnd)
        const [val, next] = parseValue(buf, keyEnd)
        dict.set(key, val)
        i = next
      }
      // top-level only: stream data may follow a dict
      if (allowStream) {
        const j = skipWs(buf, i)
        if (matchKeyword(buf, j, 'stream') && isDelim(buf[j + 6])) {
          let d = j + 6
          if (buf[d] === 0x0d && buf[d + 1] === 0x0a) d += 2
          else if (buf[d] === 0x0d || buf[d] === 0x0a) d += 1
          const len = get(dict, 'Length')
          let data
          if (typeof len === 'number' && len >= 0 && d + len <= buf.length) {
            data = buf.slice(d, d + len)
            i = d + len
            const e = skipWs(buf, i)
            if (matchKeyword(buf, e, 'endstream')) i = e + 9
          } else {
            const end = findMarker(buf, d, 'endstream')
            data = buf.slice(d, end)
            i = end + 9
          }
          return [stream(dict, data), i]
        }
      }
      return [dict, i]
    }
    // hex string
    let j = i + 1
    const nib = []
    while (j < buf.length && buf[j] !== 0x3e) {
      const c = buf[j]
      if (!isWs(c)) nib.push(c)
      j++
    }
    if (nib.length % 2) nib.push(0x30)
    const out = new Uint8Array(nib.length / 2)
    for (let k = 0; k < out.length; k++)
      out[k] = parseInt(String.fromCharCode(nib[2 * k], nib[2 * k + 1]), 16)
    return [hex(out), j + 1]
  }

  if (b === 0x5b) {
    const arr = []
    i++
    while (true) {
      i = skipWs(buf, i)
      if (buf[i] === 0x5d) return [arr, i + 1]
      const [v, next] = parseValue(buf, i)
      arr.push(v)
      i = next
    }
  }

  if (b === 0x2f) {
    let j = i + 1
    while (j < buf.length && !isDelim(buf[j])) j++
    return [name(decodeName(buf, i + 1, j)), j]
  }

  if (b === 0x28) {
    // literal string — escapes + balanced parens
    const out = []
    let j = i + 1
    let depth = 1
    while (j < buf.length && depth > 0) {
      const c = buf[j]
      if (c === 0x5c) {
        const e = buf[j + 1]
        j += 2
        switch (e) {
          case 0x6e: out.push(0x0a); break
          case 0x72: out.push(0x0d); break
          case 0x74: out.push(0x09); break
          case 0x62: out.push(0x08); break
          case 0x66: out.push(0x0c); break
          case 0x28: case 0x29: case 0x5c: out.push(e); break
          case 0x0d: if (buf[j] === 0x0a) j++; break
          case 0x0a: break
          default:
            if (isDigit(e)) {
              let oct = e - 0x30, cnt = 1
              while (cnt < 3 && isDigit(buf[j])) { oct = oct * 8 + (buf[j] - 0x30); j++; cnt++ }
              out.push(oct & 0xff)
            } else if (e !== undefined) out.push(e)
        }
      } else if (c === 0x28) { depth++; out.push(c); j++ }
      else if (c === 0x29) { if (--depth > 0) out.push(c); j++ }
      else { out.push(c); j++ }
    }
    return [str(new Uint8Array(out)), j]
  }

  // number / ref / keyword
  const start = i
  let j = i
  if (buf[j] === 0x2b || buf[j] === 0x2d) j++
  let sawDot = false
  while (j < buf.length && (isDigit(buf[j]) || (buf[j] === 0x2e && !sawDot))) {
    if (buf[j] === 0x2e) sawDot = true
    j++
  }
  if (j > start && (isDigit(buf[j - 1]) || isDigit(buf[start]))) {
    const numStr = dec(buf.slice(start, j))
    const num = parseFloat(numStr)
    if (Number.isInteger(num) && !numStr.includes('.')) {
      // maybe "n g R"
      let k = skipWs(buf, j)
      const s2 = k
      while (k < buf.length && isDigit(buf[k])) k++
      if (k > s2) {
        const g = parseInt(dec(buf.slice(s2, k)), 10)
        const k2 = skipWs(buf, k)
        if (buf[k2] === 0x52 && isDelim(buf[k2 + 1])) return [ref(num, g), k2 + 1]
      }
    }
    return [num, j]
  }

  // keyword
  let k = i
  while (k < buf.length && !isDelim(buf[k])) k++
  const word = dec(buf.slice(i, k))
  if (word === 'true') return [true, k]
  if (word === 'false') return [false, k]
  if (word === 'null') return [null, k]
  throw new Error(`unexpected token "${word}" @${i}`)
}

function decodeName(buf, i, j) {
  let s = ''
  while (i < j) {
    if (buf[i] === 0x23 && i + 2 < j) {
      // #XX
      const hv = parseInt(dec(buf.slice(i + 1, i + 3)), 16)
      if (!Number.isNaN(hv)) { s += String.fromCharCode(hv); i += 3; continue }
    }
    s += String.fromCharCode(buf[i++])
  }
  return s
}

function findMarker(buf, from, marker) {
  const m = marker
  outer: for (let i = from; i <= buf.length - m.length; i++) {
    for (let j = 0; j < m.length; j++) if (buf[i + j] !== m.charCodeAt(j)) continue outer
    // strip the EOL that precedes the marker (not part of stream data)
    let end = i
    if (buf[end - 1] === 0x0a) end--
    if (buf[end - 1] === 0x0d) end--
    return end
  }
  return buf.length
}

const OBJ_RE = /(\d+)\s+(\d+)\s+obj\b/g

/**
 * Parse a PDF by scanning for indirect objects — ignores xref tables entirely,
 * so linearized / damaged / xref-stream files all parse the same.
 */
async function parsePdf(bytes, warnings = []) {
  const text = dec(bytes)
  const objects = new Map()

  for (const m of text.matchAll(OBJ_RE)) {
    const n = +m[1]
    const g = +m[2]
    const start = m.index + m[0].length
    try {
      const [v, next] = parseValue(bytes, start, true)
      const e = skipWs(bytes, next)
      if (!matchKeyword(bytes, e, 'endobj')) continue // not a real object boundary
      objects.set(`${n} ${g}`, { n, g, v })
    } catch {
      // false-positive match inside stream data — skip
    }
  }

  // objects hidden inside /ObjStm compressed streams
  for (const { v } of objects.values()) {
    if (!isStream(v) || !typeIs(v.dict, 'ObjStm')) continue
    const N = get(v.dict, 'N')
    const first = get(v.dict, 'First')
    if (typeof N !== 'number' || typeof first !== 'number') continue
    try {
      const data = await inflate(v.data)
      const headerEnd = first
      const header = dec(data.slice(0, headerEnd)).trim().split(/\s+/).map(Number)
      for (let i = 0; i < N; i++) {
        const num = header[i * 2]
        const off = header[i * 2 + 1]
        try {
          const [v2] = parseValue(data, first + off)
          if (!objects.has(`${num} 0`)) objects.set(`${num} 0`, { n: num, g: 0, v: v2 })
        } catch { warnings.push(`ObjStm: bad object ${num}`) }
      }
    } catch { warnings.push('ObjStm: inflate failed — document may be incomplete') }
  }

  // trailer: classic `trailer` dict, or an /XRef stream dict
  let trailer = null
  const tIdx = text.lastIndexOf('trailer')
  if (tIdx !== -1) {
    try { const [t] = parseValue(bytes, skipWs(bytes, tIdx + 7)); trailer = t } catch { /* fall through */ }
  }
  if (!(trailer instanceof Map)) {
    for (const { v } of objects.values()) {
      const dict = isStream(v) ? v.dict : v
      if (typeIs(dict, 'XRef')) { trailer = dict; break }
    }
  }
  if (!(trailer instanceof Map)) {
    // last resort: synthesize a trailer pointing at the catalog
    for (const { n, g, v } of objects.values()) {
      const dict = isStream(v) ? v.dict : v
      if (typeIs(dict, 'Catalog')) {
        trailer = new Map([['Root', ref(n, g)]])
        break
      }
    }
  }
  if (!trailer) throw new Error('not a PDF (no trailer/catalog found)')
  if (get(trailer, 'Encrypt')) throw new Error('encrypted PDFs are not supported')

  return { objects, trailer, warnings }
}

/** Resolve a value: refs are dereferenced, everything else returned as-is. */
function deref(doc, v) {
  if (v?.k === 'r') return doc.objects.get(`${v.n} ${v.g}`)?.v
  return v
}

// ---- src/pdf/write.js ----

/** A document under construction: numbered objects + allocator. */
function newDoc() {
  return {
    objects: new Map(), // num → value
    _next: 1,
    alloc() {
      return this._next++
    },
    set(num, v) {
      this.objects.set(num, v)
    },
  }
}

/** Serialize a built doc to PDF bytes: header, objects, classic xref, trailer. */
function writeDoc(doc, rootNum) {
  const parts = [enc('%PDF-1.7\n%\xe2\xe3\xcf\xd3\n')]
  const offsets = new Map()

  const nums = [...doc.objects.keys()].sort((a, b) => a - b)
  for (const n of nums) {
    offsets.set(n, parts.reduce((s, p) => s + p.length, 0))
    parts.push(enc(`${n} 0 obj\n`), ...serialize(doc.objects.get(n)), enc('\nendobj\n'))
  }

  const xrefAt = parts.reduce((s, p) => s + p.length, 0)
  const count = nums.length ? nums[nums.length - 1] + 1 : 1
  let xref = 'xref\n0 ' + count + '\n0000000000 65535 f \r\n'
  for (let n = 1; n < count; n++) {
    const off = offsets.get(n)
    xref += off === undefined ? '0000000000 65535 f \r\n' : String(off).padStart(10, '0') + ' 00000 n \r\n'
  }
  parts.push(
    enc(xref),
    enc(`trailer\n<< /Size ${count} /Root ${rootNum} 0 R >>\nstartxref\n${xrefAt}\n%%EOF\n`),
  )
  return concat(parts)
}

// ---- src/zip.js ----
// Minimal ZIP writer — STORE method (no compression), enough for download bundles.

const CRC_TABLE = (() => {
  const t = new Uint32Array(256)
  for (let n = 0; n < 256; n++) {
    let c = n
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1
    t[n] = c >>> 0
  }
  return t
})()

function crc32(data, crc = 0xffffffff) {
  for (let i = 0; i < data.length; i++) crc = CRC_TABLE[(crc ^ data[i]) & 0xff] ^ (crc >>> 8)
  return (crc ^ 0xffffffff) >>> 0
}

const zte = new TextEncoder() // named uniquely — single-file build shares one scope

/** files: [{name: string, data: Uint8Array}] → zip bytes */
function zipStore(files) {
  const chunks = []
  const central = []
  let offset = 0

  const u16 = (n) => new Uint8Array([n & 0xff, (n >> 8) & 0xff])
  const u32 = (n) => new Uint8Array([n & 0xff, (n >> 8) & 0xff, (n >> 16) & 0xff, (n >>> 24) & 0xff])

  for (const f of files) {
    const nameBytes = zte.encode(f.name)
    const crc = crc32(f.data)
    const local = [
      u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(0), u16(0), // sig, ver, utf8 flag, method, time, date
      u32(crc), u32(f.data.length), u32(f.data.length),
      u16(nameBytes.length), u16(0), nameBytes,
    ]
    chunks.push(...local, f.data)
    central.push({ nameBytes, crc, size: f.data.length, offset })
    offset += local.reduce((n, c) => n + c.length, 0) + f.data.length
  }

  const cdStart = offset
  for (const c of central) {
    const rec = [
      u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(c.crc), u32(c.size), u32(c.size),
      u16(c.nameBytes.length), u16(0), u16(0), u16(0), u16(0),
      u32(0), u32(c.offset), c.nameBytes,
    ]
    chunks.push(...rec)
    offset += rec.reduce((n, x) => n + x.length, 0)
  }
  const cdSize = offset - cdStart

  chunks.push(
    u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
    u32(cdSize), u32(cdStart), u16(0),
  )

  const out = new Uint8Array(chunks.reduce((n, c) => n + c.length, 0))
  let o = 0
  for (const c of chunks) { out.set(c, o); o += c.length }
  return out
}

// ---- src/png.js ----
// Minimal PNG encoder — truecolor/gray 8-bit, zlib stream with STORED deflate
// blocks (no compression, but valid). Enough to export decoded PDF rasters.

function adler32(data) {
  let a = 1, b = 0
  for (let i = 0; i < data.length; i++) {
    a = (a + data[i]) % 65521
    b = (b + a) % 65521
  }
  return ((b << 16) | a) >>> 0
}

/** Wrap raw bytes in a zlib stream using uncompressed deflate blocks. */
function zlibStore(data) {
  const nBlocks = Math.max(1, Math.ceil(data.length / 65535))
  const out = new Uint8Array(2 + data.length + nBlocks * 5 + 4)
  let o = 0
  out[o++] = 0x78
  out[o++] = 0x01
  for (let i = 0; i < nBlocks; i++) {
    const chunk = data.subarray(i * 65535, (i + 1) * 65535)
    const last = i === nBlocks - 1
    out[o++] = last ? 1 : 0
    out[o++] = chunk.length & 0xff
    out[o++] = (chunk.length >> 8) & 0xff
    out[o++] = ~chunk.length & 0xff
    out[o++] = (~chunk.length >> 8) & 0xff
    out.set(chunk, o)
    o += chunk.length
  }
  const adler = adler32(data)
  out[o++] = (adler >>> 24) & 0xff
  out[o++] = (adler >>> 16) & 0xff
  out[o++] = (adler >>> 8) & 0xff
  out[o++] = adler & 0xff
  return out.subarray(0, o)
}

/** pixels: Uint8Array of RGB or grayscale samples. gray=true → 1 byte/px, else 3. */
function pngEncode(width, height, pixels, gray = false) {
  const bpp = gray ? 1 : 3
  const stride = width * bpp
  if (pixels.length !== stride * height) throw new Error('pixel buffer size mismatch')

  const scan = new Uint8Array((stride + 1) * height)
  for (let y = 0; y < height; y++) {
    scan[y * (stride + 1)] = 0 // filter: none
    scan.set(pixels.subarray(y * stride, (y + 1) * stride), y * (stride + 1) + 1)
  }

  const chunk = (type, data) => {
    const t = new TextEncoder().encode(type)
    const len = new Uint8Array(4)
    new DataView(len.buffer).setUint32(0, data.length)
    const body = new Uint8Array(t.length + data.length)
    body.set(t)
    body.set(data, t.length)
    const crc = new Uint8Array(4)
    new DataView(crc.buffer).setUint32(0, crc32(body))
    const out = new Uint8Array(4 + body.length + 4)
    out.set(len, 0)
    out.set(body, 4)
    out.set(crc, 4 + body.length)
    return out
  }

  const ihdr = new Uint8Array(13)
  const dv = new DataView(ihdr.buffer)
  dv.setUint32(0, width)
  dv.setUint32(4, height)
  ihdr[8] = 8 // bit depth
  ihdr[9] = gray ? 0 : 2 // color type
  // compression/filter/interlace = 0

  const sig = new Uint8Array([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a])
  const parts = [sig, chunk('IHDR', ihdr), chunk('IDAT', zlibStore(scan)), chunk('IEND', new Uint8Array(0))]
  const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0))
  let o = 0
  for (const p of parts) { out.set(p, o); o += p.length }
  return out
}

// ---- src/pdf/ops.js ----

const INHERITED = ['Resources', 'MediaBox', 'CropBox', 'Rotate']

/** Walk the page tree → ordered leaves with resolved inherited attributes. */
function pageLeaves(doc) {
  const root = deref(doc, get(doc.trailer, 'Root'))
  const catalog = isStream(root) ? root.dict : root
  const pagesRef = get(catalog, 'Pages')
  if (!isRef(pagesRef)) throw new Error('no /Pages in catalog')
  const leaves = []
  const seen = new Set()

  const walk = (nodeRef, inh) => {
    const key = nodeRef.n + ' ' + nodeRef.g
    if (seen.has(key)) return
    seen.add(key)
    const node = deref(doc, nodeRef)
    const dict = isStream(node) ? node.dict : node
    if (!(dict instanceof Map)) return
    const cur = { ...inh }
    for (const k of INHERITED) {
      const v = get(dict, k)
      if (v !== undefined) cur[k] = v
    }
    if (typeIs(dict, 'Page')) leaves.push({ ref: nodeRef, dict, inh: cur })
    else {
      const kidsArr = deref(doc, get(dict, 'Kids'))
      if (Array.isArray(kidsArr)) for (const kid of kidsArr) if (isRef(kid)) walk(kid, cur)
    }
  }
  walk(pagesRef, {})
  if (!leaves.length) throw new Error('PDF has no pages')
  return leaves
}

async function pageCount(bytes) {
  return pageLeaves(await parsePdf(bytes)).length
}

/** Per-page geometry for UI pickers: [{w, h, rotate}] — MediaBox + inherited Rotate. */
function pageDims(doc) {
  return pageLeaves(doc).map((leaf) => {
    let mb = get(leaf.dict, 'MediaBox') ?? leaf.inh.MediaBox
    if (isRef(mb)) mb = deref(doc, mb)
    if (!Array.isArray(mb)) mb = [0, 0, 612, 792]
    const rot = get(leaf.dict, 'Rotate') ?? leaf.inh.Rotate ?? 0
    return { w: Math.round(mb[2] - mb[0]), h: Math.round(mb[3] - mb[1]), rotate: typeof rot === 'number' ? rot : 0 }
  })
}

const textVal = (v) => {
  if (isStr(v) || isHex(v)) {
    const b = v.bytes
    if (b[0] === 0xfe && b[1] === 0xff) return new TextDecoder('utf-16be').decode(b.subarray(2))
    return dec(b).replace(/\x00+$/, '')
  }
  if (isName(v)) return '/' + v.v
  if (typeof v === 'number' || typeof v === 'boolean') return String(v)
  return null
}

/**
 * What the file says about you: /Info fields, XMP presence, doc ID presence.
 * Drives the Scrub tool's "here's what's leaking" preview.
 */
async function readMetadata(bytes) {
  const doc = await parsePdf(bytes)
  const out = { fields: [], xmp: false, id: false }
  const infoRaw = get(doc.trailer, 'Info')
  const info = isRef(infoRaw) ? deref(doc, infoRaw) : infoRaw
  if (info instanceof Map) {
    for (const [k, v] of info) {
      const s = textVal(isRef(v) ? deref(doc, v) : v)
      if (s) out.fields.push({ key: k, value: s })
    }
  }
  const root = deref(doc, get(doc.trailer, 'Root'))
  const catalog = isStream(root) ? root.dict : root
  if (get(catalog, 'Metadata') !== undefined) out.xmp = true
  if (get(doc.trailer, 'ID') !== undefined) out.id = true
  return out
}

/** Deep-copy a value across docs, remapping refs. */
function copyValue(v, src, dst, refMap) {
  if (isRef(v)) {
    const key = `${v.n} ${v.g}`
    if (refMap.has(key)) return refMap.get(key)
    const newNum = dst.alloc()
    const out = ref(newNum, 0)
    refMap.set(key, out)
    const srcVal = src.objects.get(key)?.v
    if (srcVal === undefined) return null // dangling ref → drop it
    dst.set(newNum, copyValue(srcVal, src, dst, refMap))
    return out
  }
  if (v instanceof Map) {
    const m = new Map()
    for (const [k, val] of v) m.set(k, copyValue(val, src, dst, refMap))
    return m
  }
  if (Array.isArray(v)) return v.map((x) => copyValue(x, src, dst, refMap))
  if (isStream(v)) return stream(copyValue(v.dict, src, dst, refMap), v.data.slice())
  return v
}

/**
 * Append selected pages of `srcDoc` into `dst` under `pagesRef`.
 * `picks` = [{leaf, rotateDelta}] — leaves already walked (source order preserved by caller).
 * `strip` names extra page-dict keys to drop (privacy scrubbing).
 */
function appendPages(srcDoc, picks, dst, pagesRef, kids, strip = []) {
  const refMap = new Map()
  for (const { leaf, rotateDelta } of picks) {
    const num = dst.alloc()
    kids.push(ref(num, 0))
    const pageDict = new Map()
    for (const k of INHERITED) {
      const v = get(leaf.dict, k) ?? leaf.inh[k]
      if (v !== undefined) pageDict.set(k, copyValue(v, srcDoc, dst, refMap))
    }
    for (const [k, val] of leaf.dict) {
      if (k === 'Parent' || k === 'Metadata' || INHERITED.includes(k) || strip.includes(k)) continue
      pageDict.set(k, copyValue(val, srcDoc, dst, refMap))
    }
    pageDict.set('Type', name('Page'))
    pageDict.set('Parent', ref(pagesRef, 0))
    if (rotateDelta) {
      const cur = get(pageDict, 'Rotate')
      const base = typeof cur === 'number' ? cur : 0
      pageDict.set('Rotate', ((base + rotateDelta) % 360 + 360) % 360)
    }
    dst.set(num, pageDict)
  }
}

function finishDoc(dst, pagesRef, kids) {
  dst.set(pagesRef, new Map([
    ['Type', name('Pages')],
    ['Kids', kids],
    ['Count', kids.length],
  ]))
  const catNum = dst.alloc()
  dst.set(catNum, new Map([
    ['Type', name('Catalog')],
    ['Pages', ref(pagesRef, 0)],
  ]))
  return writeDoc(dst, catNum)
}

/** Merge several PDFs (Uint8Array[]) into one, in order. */
async function mergePdfs(inputs) {
  const dst = newDoc()
  const pagesRef = dst.alloc()
  const kids = []
  for (const bytes of inputs) {
    const doc = await parsePdf(bytes)
    appendPages(doc, pageLeaves(doc).map((leaf) => ({ leaf, rotateDelta: 0 })), dst, pagesRef, kids)
  }
  return finishDoc(dst, pagesRef, kids)
}

/**
 * Rebuild a PDF from an ordered op list (1-based source pages):
 * reorder by list order, delete by omission, rotate via `rotation` delta.
 */
async function organizePages(bytes, ops) {
  const src = await parsePdf(bytes)
  const leaves = pageLeaves(src)
  const picks = ops.map((o) => {
    if (o.page < 1 || o.page > leaves.length) throw new Error(`page ${o.page} out of range`)
    return { leaf: leaves[o.page - 1], rotateDelta: o.rotation || 0 }
  })
  const dst = newDoc()
  const pagesRef = dst.alloc()
  const kids = []
  appendPages(src, picks, dst, pagesRef, kids)
  return finishDoc(dst, pagesRef, kids)
}

/** Extract page ranges (1-based inclusive {from,to}) into a single PDF. */
async function extractPages(bytes, ranges) {
  const ops = ranges.flatMap(({ from, to }) =>
    Array.from({ length: to - from + 1 }, (_, i) => ({ page: from + i, rotation: 0 })),
  )
  return organizePages(bytes, ops)
}

/** One output PDF per range. */
async function splitPdf(bytes, ranges) {
  return Promise.all(ranges.map((r) => extractPages(bytes, [r])))
}

/** Parse "1-3, 5, 8-10" into {from,to}[] with bounds checking. */
function parseRanges(spec, maxPage) {
  const ranges = []
  for (const part of spec.split(',')) {
    const t = part.trim()
    if (!t) continue
    const m = /^(\d+)(?:\s*-\s*(\d+))?$/.exec(t)
    if (!m) throw new Error(`bad range "${t}"`)
    const from = parseInt(m[1], 10)
    const to = m[2] ? parseInt(m[2], 10) : from
    if (from < 1 || to > maxPage || from > to) throw new Error(`range "${t}" out of bounds`)
    ranges.push({ from, to })
  }
  if (!ranges.length) throw new Error('no ranges given')
  return ranges
}

// ---------- images → pdf ----------

/** Read dimensions/colorspace from a JPEG's SOF marker. */
function jpegInfo(buf) {
  if (buf[0] !== 0xff || buf[1] !== 0xd8) throw new Error('not a JPEG')
  let i = 2
  while (i + 3 < buf.length) {
    if (buf[i] !== 0xff) { i++; continue }
    const marker = buf[i + 1]
    if (marker === 0xd8 || marker === 0x01 || (marker >= 0xd0 && marker <= 0xd7)) { i += 2; continue }
    const len = (buf[i + 2] << 8) | buf[i + 3]
    if (marker === 0xda) break // SOS — image data
    if ([0xc0, 0xc1, 0xc2, 0xc3, 0xc5, 0xc6, 0xc7, 0xc9, 0xca, 0xcb, 0xcd, 0xce, 0xcf].includes(marker)) {
      const height = (buf[i + 5] << 8) | buf[i + 6]
      const width = (buf[i + 7] << 8) | buf[i + 8]
      const comps = buf[i + 9]
      const cs = comps === 1 ? 'DeviceGray' : comps === 4 ? 'DeviceCMYK' : 'DeviceRGB'
      return { width, height, colorSpace: cs }
    }
    i += 2 + len
  }
  throw new Error('JPEG SOF marker not found')
}

/** Pack JPEG images into a PDF — one image per page at native size. */
const PAGE_SIZES = { a4: [595.28, 841.89], letter: [612, 792] }

/**
 * Wrap jpeg images into a one-page-each PDF.
 * opts: size 'native'|'a4'|'letter', orient 'auto'|'portrait'|'landscape',
 *       margin (pt), fit 'contain'|'stretch'.
 */
function imagesToPdf(images, opts = {}) {
  const { size = 'native', orient = 'auto', margin = 0, fit = 'contain' } = opts
  const dst = newDoc()
  const pagesRef = dst.alloc()
  const kids = []
  for (const img of images) {
    const { width, height, colorSpace } = jpegInfo(img.data)
    const imgNum = dst.alloc()
    dst.set(imgNum, stream(new Map([
      ['Type', name('XObject')],
      ['Subtype', name('Image')],
      ['Width', width],
      ['Height', height],
      ['ColorSpace', name(colorSpace)],
      ['BitsPerComponent', 8],
      ['Filter', name('DCTDecode')],
      ['Length', img.data.length],
    ]), img.data))

    let pw, ph
    if (size === 'native') {
      pw = width + margin * 2
      ph = height + margin * 2
    } else {
      let [bw, bh] = PAGE_SIZES[size] ?? PAGE_SIZES.a4
      const landscape = orient === 'landscape' || (orient === 'auto' && width > height)
      ;[pw, ph] = landscape ? [Math.max(bw, bh), Math.min(bw, bh)] : [Math.min(bw, bh), Math.max(bw, bh)]
    }
    const cw = Math.max(1, pw - margin * 2)
    const ch = Math.max(1, ph - margin * 2)
    let dw, dh
    if (fit === 'stretch') { dw = cw; dh = ch }
    else { const s = Math.min(cw / width, ch / height); dw = width * s; dh = height * s }
    const x = (pw - dw) / 2
    const y = (ph - dh) / 2

    const csNum = dst.alloc()
    dst.set(csNum, stream(new Map(), new TextEncoder().encode(`q ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im0 Do Q`)))
    const pageNum = dst.alloc()
    dst.set(pageNum, new Map([
      ['Type', name('Page')],
      ['Parent', ref(pagesRef, 0)],
      ['MediaBox', [0, 0, pw, ph]],
      ['Resources', new Map([['XObject', new Map([['Im0', ref(imgNum, 0)]])]])],
      ['Contents', ref(csNum, 0)],
    ]))
    kids.push(ref(pageNum, 0))
  }
  return finishDoc(dst, pagesRef, kids)
}

// ---------- page numbers ----------

/** Escape a JS string into PDF literal-string bytes (ASCII only). */
const pdfStr = (s) => '(' + s.replace(/[\\()]/g, (c) => '\\' + c) + ')'

/**
 * Stamp a label on every page.
 * opts: pos 'tl'|'tc'|'tr'|'bl'|'bc'|'br' (default 'bc'),
 *       fmt 'n'|'n-of-total'|'page-n' (default 'n-of-total'),
 *       start (number shown on first stamped page, default 1),
 *       skipFirst (don't stamp page 1), size (pt, default 10), margin (pt, default 18),
 *       fmt 'custom' uses fmtStr with {n} = page number, {t} = total.
 * Appends a content stream ON TOP of existing content and injects a
 * Helvetica base-14 font under an unlikely-colliding resource name.
 */
async function addPageNumbers(bytes, opts = {}) {
  const { pos = 'bc', fmt = 'n-of-total', fmtStr = '{n}', start = 1, skipFirst = false, size = 10, margin = 18 } = opts
  const src = await parsePdf(bytes)
  const leaves = pageLeaves(src)
  const total = leaves.length
  const fontResName = 'PDFFnt1'

  const labelFor = (i) => {
    const n = i + start
    if (fmt === 'custom') return (fmtStr || '{n}').replaceAll('{n}', String(n)).replaceAll('{t}', String(total))
    if (fmt === 'n') return String(n)
    if (fmt === 'page-n') return `Page ${n}`
    return `${n} / ${total}`
  }

  const dst = newDoc()
  const pagesRef = dst.alloc()
  const kids = []
  const refMap = new Map()

  for (let i = 0; i < leaves.length; i++) {
    const { leaf } = { leaf: leaves[i] }
    const num = dst.alloc()
    kids.push(ref(num, 0))
    const pageDict = new Map()
    for (const k of INHERITED) {
      const v = get(leaf.dict, k) ?? leaf.inh[k]
      if (v !== undefined) pageDict.set(k, copyValue(v, src, dst, refMap))
    }
    for (const [k, val] of leaf.dict) {
      if (k === 'Parent' || k === 'Metadata' || INHERITED.includes(k)) continue
      pageDict.set(k, copyValue(val, src, dst, refMap))
    }
    pageDict.set('Type', name('Page'))
    pageDict.set('Parent', ref(pagesRef, 0))

    if (i === 0 && skipFirst) {
      dst.set(num, pageDict)
      continue
    }

    // label position is chosen in DISPLAY space (what the user sees), then
    // mapped back into the page's user space honouring /Rotate.
    const mbSrc = get(leaf.dict, 'MediaBox') ?? leaf.inh.MediaBox
    const mbResolved = isRef(mbSrc) ? deref(src, mbSrc) : mbSrc
    const mb = Array.isArray(mbResolved) ? mbResolved : [0, 0, 612, 792]
    const rotSrc = get(leaf.dict, 'Rotate') ?? leaf.inh.Rotate ?? 0
    const rot = typeof rotSrc === 'number' ? ((rotSrc % 360) + 360) % 360 : 0
    const w = mb[2] - mb[0]
    const hh = mb[3] - mb[1]
    const dw = rot % 180 === 0 ? w : hh
    const dh = rot % 180 === 0 ? hh : w
    const label = labelFor(i)
    const charW = size * 0.5 // ~half-em advance for Helvetica digits
    const xd = pos.endsWith('l') ? margin
      : pos.endsWith('r') ? dw - margin - label.length * charW
      : dw / 2 - (label.length * charW) / 2
    const yd = pos.startsWith('t') ? dh - margin - size * 0.72 : margin
    // display (xd,yd) → user (xu,yu) for each quarter-turn, then counter-rotate
    // the text matrix so the label reads upright on the displayed page.
    const [xu, yu, m] =
      rot === 90 ? [w - yd, xd, [0, 1, -1, 0]]
      : rot === 180 ? [w - xd, hh - yd, [-1, 0, 0, -1]]
      : rot === 270 ? [yd, hh - xd, [0, -1, 1, 0]]
      : [xd, yd, [1, 0, 0, 1]]
    const csNum = dst.alloc()
    dst.set(csNum, stream(new Map(), new TextEncoder().encode(
      `q ${m[0]} ${m[1]} ${m[2]} ${m[3]} ${(mb[0] + xu).toFixed(1)} ${(mb[1] + yu).toFixed(1)} cm ` +
      `BT /${fontResName} ${size} Tf 0 g 0 0 Td ${pdfStr(label)} Tj ET Q`,
    )))

    // contents = existing contents + ours last (draws on top)
    const contents = pageDict.get('Contents')
    const arr = Array.isArray(contents) ? contents.slice() : contents !== undefined ? [contents] : []
    arr.push(ref(csNum, 0))
    pageDict.set('Contents', arr.length === 1 ? arr[0] : arr)

    // resources: pageDict already holds dst-space copies/refs — resolve any
    // indirect /Resources or /Font against dst.objects, never against src.
    let res = pageDict.get('Resources')
    if (isRef(res)) res = dst.objects.get(res.n)
    if (!(res instanceof Map)) res = new Map()
    let fonts = res.get('Font')
    if (isRef(fonts)) fonts = dst.objects.get(fonts.n)
    if (!(fonts instanceof Map)) fonts = new Map()
    if (!fonts.has(fontResName)) {
      fonts.set(fontResName, new Map([
        ['Type', name('Font')],
        ['Subtype', name('Type1')],
        ['BaseFont', name('Helvetica')],
      ]))
      res.set('Font', fonts)
    }
    pageDict.set('Resources', res)
    dst.set(num, pageDict)
  }
  return finishDoc(dst, pagesRef, kids)
}

/**
 * Rebuild dropping /Info, XMP /Metadata, doc IDs, per-page annotations (author
 * names, comments, popup threads) and /PieceInfo — tracker scrub.
 */
async function scrubPdf(bytes) {
  const src = await parsePdf(bytes)
  const leaves = pageLeaves(src)
  const dst = newDoc()
  const pagesRef = dst.alloc()
  const kids = []
  appendPages(src, leaves.map((leaf) => ({ leaf, rotateDelta: 0 })), dst, pagesRef, kids, [
    'Annots',
    'PieceInfo',
  ])
  return finishDoc(dst, pagesRef, kids)
}

// ---------- page previews (text + dominant image, no renderer) ----------

/** Concatenated, decoded Contents bytes for a page (null if undecodable). */
async function contentBytes(doc, leaf) {
  let c = get(leaf.dict, 'Contents')
  if (isRef(c)) c = deref(doc, c)
  const streams = isStream(c) ? [c]
    : Array.isArray(c) ? c.map((x) => (isRef(x) ? deref(doc, x) : x)).filter(isStream)
    : []
  const parts = []
  for (const s of streams) {
    let d = s.data
    const fl = get(s.dict, 'Filter')
    const chain = Array.isArray(fl) ? fl : fl ? [fl] : []
    for (const f of chain) {
      const fn = isName(f) ? f.v : null
      if (fn === 'FlateDecode' || fn === 'Fl') d = await inflate(d)
      else return null
    }
    parts.push(d)
  }
  return parts.length ? concat(parts) : null
}

/**
 * Minimal content-stream tokenizer → [{op, operands}].
 * Handles names, numbers, literal+hex strings, arrays, dict marks.
 * Operands keep source order; arrays arrive as {t:'arr', items}.
 */
function tokenizeContent(data) {
  const ops = []
  let operands = []
  let i = 0
  const n = data.length
  const isWS = (c) => c === 0 || c === 9 || c === 10 || c === 12 || c === 13 || c === 32
  const isDelim = (c) => isWS(c) || c === 0x5b || c === 0x5d || c === 0x3c || c === 0x3e || c === 0x28 || c === 0x29 || c === 0x2f || c === 0x25
  while (i < n) {
    const c = data[i]
    if (isWS(c)) { i++; continue }
    if (c === 0x25) { while (i < n && data[i] !== 0x0a && data[i] !== 0x0d) i++; continue }
    if (c === 0x2f) {
      let j = i + 1
      while (j < n && !isDelim(data[j])) j++
      operands.push({ t: 'name', v: dec(data.subarray(i + 1, j)) })
      i = j
      continue
    }
    if (c === 0x28) {
      let j = i + 1, depth = 1
      const bytes = []
      while (j < n && depth) {
        const b = data[j]
        if (b === 0x5c) { bytes.push(data[j + 1]); j += 2; continue }
        if (b === 0x28) depth++
        else if (b === 0x29) { depth--; if (!depth) { j++; break } }
        bytes.push(b)
        j++
      }
      operands.push({ t: 'str', bytes: Uint8Array.from(bytes) })
      i = j
      continue
    }
    if (c === 0x3c) {
      if (data[i + 1] === 0x3c) { operands.push({ t: 'dict' }); i += 2; continue }
      let j = i + 1, hexs = ''
      while (j < n && data[j] !== 0x3e) { if (!isWS(data[j])) hexs += String.fromCharCode(data[j]); j++ }
      const bytes = new Uint8Array(Math.ceil(hexs.length / 2))
      for (let k = 0; k < bytes.length; k++) bytes[k] = parseInt(hexs.slice(k * 2, k * 2 + 2).padEnd(2, '0'), 16)
      operands.push({ t: 'str', bytes })
      i = j + 1
      continue
    }
    if (c === 0x3e && data[i + 1] === 0x3e) { operands.push({ t: 'dict' }); i += 2; continue }
    if (c === 0x5b) { operands.push({ t: '[' }); i++; continue }
    if (c === 0x5d) {
      let k = operands.length - 1
      while (k >= 0 && operands[k].t !== '[') k--
      const items = operands.splice(k + 1)
      operands.length = k
      operands.push({ t: 'arr', items })
      i++
      continue
    }
    let j = i
    while (j < n && !isDelim(data[j])) j++
    const tok = dec(data.subarray(i, j))
    i = j
    if (tok === 'ID') {
      // inline image payload: one ws byte, raw data until whitespace+'EI'
      ops.push({ op: 'ID', operands })
      operands = []
      if (i < n && isWS(data[i])) i++
      while (i < n) {
        if (isWS(data[i]) && data[i + 1] === 0x45 && data[i + 2] === 0x49 && (i + 3 >= n || isDelim(data[i + 3]))) {
          i += 3
          ops.push({ op: 'EI', operands: [] })
          break
        }
        i++
      }
      continue
    }
    if (/^[+-]?(\d+\.?\d*|\.\d+)$/.test(tok)) operands.push(parseFloat(tok))
    else if (tok === 'true' || tok === 'false' || tok === 'null') operands.push(tok === 'true' ? true : tok === 'false' ? false : null)
    else { ops.push({ op: tok, operands }); operands = [] }
  }
  return ops
}

/**
 * Best-effort visual for a page: {img: {data, mime} | null, text: string}.
 * img = the largest painted image XObject (dominant cm area); text = the
 * page's own first characters of drawn text (Tj/TJ operands, latin1-decoded).
 */
async function pagePreview(doc, leaf, maxLen = 200) {
  const data = await contentBytes(doc, leaf)
  if (!data) return { img: null, text: '' }
  const ops = tokenizeContent(data)
  const fonts = await fontMap(doc, leaf)
  let curFont = null
  const parts = []
  for (const { op, operands } of ops) {
    if (op === 'Tf') {
      const nm = operands.find((o) => o.t === 'name')
      if (nm) curFont = fonts.get(nm.v) ?? null
      continue
    }
    if (op === 'Tj' || op === "'" || op === '"') {
      for (let k = operands.length - 1; k >= 0; k--) {
        if (operands[k].t === 'str') { parts.push(decodeString(operands[k].bytes, curFont)); break }
      }
    } else if (op === 'TJ') {
      const arr = operands.find((o) => o.t === 'arr')
      if (arr) for (const it of arr.items) if (it.t === 'str') parts.push(decodeString(it.bytes, curFont))
    }
  }
  const text = parts.join(' ').replace(/\s+/g, ' ').trim().slice(0, maxLen)
  return { img: await dominantImage(doc, leaf, ops), text }
}

/** Largest-painted-area image XObject invoked by the page's Do operators. */
async function dominantImage(doc, leaf, ops) {
  const resSrc = get(leaf.dict, 'Resources') ?? leaf.inh.Resources
  const res = isRef(resSrc) ? deref(doc, resSrc) : resSrc
  const xoSrc = get(res, 'XObject')
  const xo = isRef(xoSrc) ? deref(doc, xoSrc) : xoSrc
  if (!(xo instanceof Map)) return null
  let cm = [1, 0, 0, 1, 0, 0]
  let best = null
  for (const { op, operands } of ops) {
    if (op === 'cm' && operands.length === 6) cm = operands.map(Number)
    else if (op === 'Do') {
      const nm = [...operands].reverse().find((o) => o.t === 'name')
      if (!nm) continue
      let xv = xo.get(nm.v)
      if (isRef(xv)) xv = deref(doc, xv)
      if (!isStream(xv) || get(xv.dict, 'Subtype')?.v !== 'Image') continue
      const area = Math.abs(cm[0] * cm[3] - cm[1] * cm[2])
      if (!best || area > best.area) best = { area, xv }
    }
  }
  return best ? decodeImageStream(doc, best.xv) : null
}

// ---------- page rendering ----------

/** Parse a /ToUnicode CMap stream → {map: Map<code,string>, codeLen}. */
function parseToUnicode(data) {
  const src = dec(data)
  const hex = (s) => parseInt(s, 16)
  const uni = (s) => {
    let out = ''
    for (let i = 0; i + 4 <= s.length; i += 4) out += String.fromCodePoint(parseInt(s.slice(i, i + 4), 16))
    return out
  }
  const map = new Map()
  let codeLen = 1
  const blocks = src.matchAll(/beginbf(char|range)([\s\S]*?)endbf\1/g)
  for (const b of blocks) {
    const [, kind, body] = b
    if (kind === 'char') {
      for (const m of body.matchAll(/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g)) {
        codeLen = Math.max(codeLen, m[1].length / 2)
        map.set(hex(m[1]), uni(m[2]))
      }
    } else {
      for (const m of body.matchAll(/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*(\[[^\]]*\]|<([0-9A-Fa-f]+)>)/g)) {
        codeLen = Math.max(codeLen, m[1].length / 2)
        const lo = hex(m[1]), hi = hex(m[2])
        if (m[4]) for (let c = lo; c <= hi; c++) map.set(c, uni((hex(m[4]) + c - lo).toString(16).padStart(m[4].length, '0')))
        else for (const [k, dm] of [...m[3].matchAll(/<([0-9A-Fa-f]+)>/g)].entries()) map.set(lo + k, uni(dm[1]))
      }
    }
  }
  return { map, codeLen }
}

/**
 * Resolve a page's font resources → Map<name, {widths, firstChar, tounicode}>.
 * widths = /Widths array (deref'd) + /FirstChar; CID /W ranges folded in.
 */
async function fontMap(doc, leaf) {
  const resSrc = get(leaf.dict, 'Resources') ?? leaf.inh.Resources
  const res = isRef(resSrc) ? deref(doc, resSrc) : resSrc
  let fonts = res instanceof Map ? get(res, 'Font') : null
  if (isRef(fonts)) fonts = deref(doc, fonts)
  const out = new Map()
  if (!(fonts instanceof Map)) return out
  for (const [fname, fref] of fonts) {
    let fd = isRef(fref) ? deref(doc, fref) : fref
    if (isStream(fd)) fd = fd.dict
    if (!(fd instanceof Map)) continue
    const info = { widths: null, firstChar: 0, wRanges: null, tounicode: null }
    let w = get(fd, 'Widths')
    if (isRef(w)) w = deref(doc, w)
    if (Array.isArray(w)) info.widths = w
    info.firstChar = get(fd, 'FirstChar') ?? 0
    let wArr = get(fd, 'W')
    if (isRef(wArr)) wArr = deref(doc, wArr)
    if (Array.isArray(wArr)) {
      info.wRanges = new Map()
      for (let i = 0; i + 2 < wArr.length; i += 3) {
        const [lo, hi, ws] = [wArr[i], wArr[i + 1], wArr[i + 2]]
        if (typeof lo === 'number' && Array.isArray(ws)) ws.forEach((ww, k) => info.wRanges.set(lo + k, ww))
        else if (typeof lo === 'number' && typeof hi === 'number' && typeof ws === 'number')
          for (let c = lo; c <= hi; c++) info.wRanges.set(c, ws)
      }
    }
    let tu = get(fd, 'ToUnicode')
    if (isRef(tu)) tu = deref(doc, tu)
    if (isStream(tu)) {
      let d = tu.data
      const fl = get(tu.dict, 'Filter')
      const chain = Array.isArray(fl) ? fl : fl ? [fl] : []
      let ok = true
      for (const f of chain) {
        const fn = isName(f) ? f.v : null
        if (fn === 'FlateDecode' || fn === 'Fl') d = await inflate(d)
        else { ok = false; break }
      }
      if (ok) info.tounicode = parseToUnicode(d)
    }
    out.set(fname, info)
  }
  return out
}

/** Decode a PDF string operand using a font entry (ToUnicode → latin1). */
function decodeString(bytes, font) {
  if (font?.tounicode) {
    const { map, codeLen } = font.tounicode
    let out = ''
    for (let i = 0; i + codeLen <= bytes.length; i += codeLen) {
      let code = 0
      for (let k = 0; k < codeLen; k++) code = code * 256 + bytes[i + k]
      out += map.get(code) ?? ''
    }
    return out
  }
  return dec(bytes)
}

/** Fraction of decoded chars that are non-printable — flags garbage text. */
const garbageRatio = (s) => {
  if (!s.length) return 1
  let bad = 0
  for (const ch of s) {
    const c = ch.codePointAt(0)
    if ((c < 0x20 && ch !== ' ' && ch !== '\t') || (c >= 0x7f && c <= 0x9f)) bad++
  }
  return bad / s.length
}

const matMul = (a, b) => [
  a[0] * b[0] + a[2] * b[1], a[1] * b[0] + a[3] * b[1],
  a[0] * b[2] + a[2] * b[3], a[1] * b[2] + a[3] * b[3],
  a[0] * b[4] + a[2] * b[5] + a[4], a[1] * b[4] + a[3] * b[5] + a[5],
]
const matPt = (m, x, y) => [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]]

/** user→display transform (top-left origin, /Rotate applied clockwise). */
function displayTransform(mb, rot) {
  const [x0, y0, x1, y1] = mb
  if (rot === 90) return [0, 1, 1, 0, -y0, -x0]
  if (rot === 180) return [-1, 0, 0, 1, x1, -y0]
  if (rot === 270) return [0, -1, -1, 0, y1, x1]
  return [1, 0, 0, -1, -x0, y1]
}

/**
 * Interpret a page content stream into positioned display-space draw ops.
 * Returns { ops, box } — box = {w,h} of the displayed page in points.
 * ops: {t:'text'|'bar'|'img'|'rect', x,y,w,h, rot, str?, key?, stroke?}
 */
async function collectDrawOps(doc, leaf) {
  const data = await contentBytes(doc, leaf)
  const mbSrc = get(leaf.dict, 'MediaBox') ?? leaf.inh.MediaBox
  const mbRes = isRef(mbSrc) ? deref(doc, mbSrc) : mbSrc
  const mb = Array.isArray(mbRes) ? mbRes : [0, 0, 612, 792]
  const rotSrc = get(leaf.dict, 'Rotate') ?? leaf.inh.Rotate ?? 0
  const rot = typeof rotSrc === 'number' ? ((rotSrc % 360) + 360) % 360 : 0
  const w = mb[2] - mb[0]
  const hgt = mb[3] - mb[1]
  const box = { w: rot % 180 === 0 ? w : hgt, h: rot % 180 === 0 ? hgt : w }
  const disp = displayTransform(mb, rot)
  const empty = { ops: [], box }
  if (!data) return empty

  const fonts = await fontMap(doc, leaf)
  const resSrc = get(leaf.dict, 'Resources') ?? leaf.inh.Resources
  const res = isRef(resSrc) ? deref(doc, resSrc) : resSrc
  const xoSrc = res instanceof Map ? get(res, 'XObject') : null
  const xo = isRef(xoSrc) ? deref(doc, xoSrc) : xoSrc

  const ops = []
  let ctm = [1, 0, 0, 1, 0, 0]
  const gstack = []
  let tm = [1, 0, 0, 1, 0, 0], tlm = [1, 0, 0, 1, 0, 0]
  let leading = 0, fontSize = 0, curFont = null, tc = 0, tw = 0, tz = 1
  const pathRects = []

  const imgObj = (nm) => {
    if (!(xo instanceof Map)) return null
    let xv = xo.get(nm)
    if (isRef(xv)) xv = deref(doc, xv)
    return isStream(xv) && get(xv.dict, 'Subtype')?.v === 'Image' ? xv : null
  }
  const imgKey = (nm) => {
    const v = xo instanceof Map ? xo.get(nm) : null
    return isRef(v) ? `${v.n} ${v.g}` : `inline:${nm}`
  }
  const fontOf = () => (curFont && fonts.get(curFont)) || null

  const advance = (bytes, font) => {
    if (!font) return bytes.length * 0.5 * fontSize * tz
    let sum = 0
    const cl = font.tounicode?.codeLen ?? 1
    for (let i = 0; i + cl <= bytes.length; i += cl) {
      let code = 0
      for (let k = 0; k < cl; k++) code = code * 256 + bytes[i + k]
      const wv = font.wRanges?.get(code) ?? font.widths?.[code - font.firstChar]
      sum += (typeof wv === 'number' ? wv : 500) / 1000
    }
    return sum * fontSize * tz
  }

  const emitText = (bytes) => {
    const font = fontOf()
    const str = decodeString(bytes, font)
    const ncodes = font?.tounicode ? Math.floor(bytes.length / font.tounicode.codeLen) : bytes.length
    const adv = advance(bytes, font) + tw * (str.split(' ').length - 1) + tc * ncodes
    const m = matMul(ctm, tm)
    const [ux, uy] = matPt(m, 0, 0)
    const [dx, dy] = matPt(disp, ux, uy)
    // baseline direction + advance vector through the same transform
    const [ux2, uy2] = matPt(m, adv, 0)
    const [dx2, dy2] = matPt(disp, ux2, uy2)
    const dspW = Math.hypot(dx2 - dx, dy2 - dy)
    const ang = Math.atan2(dy2 - dy, dx2 - dx)
    const hh = Math.hypot(m[2], m[3]) * fontSize
    ops.push({
      t: 'text', x: dx, y: dy, w: dspW, h: hh, rot: ang,
      str: garbageRatio(str) < 0.4 ? str : '', size: fontSize * Math.hypot(m[0], m[1]),
    })
    // advance the text matrix in TEXT space: Tm' = Tm × T(adv,0)
    tm = matMul(tm, [1, 0, 0, 1, adv, 0])
  }

  for (const { op, operands } of tokenizeContent(data)) {
    switch (op) {
      case 'q': gstack.push({ ctm, tm, tlm }); break
      case 'Q': { const s = gstack.pop(); if (s) ({ ctm, tm, tlm } = s); break }
      case 'cm': if (operands.length === 6) ctm = matMul(operands.map(Number), ctm); break
      case 'BT': tm = [1, 0, 0, 1, 0, 0]; tlm = [...tm]; break
      case 'ET': break
      case 'Tf': {
        const nm = operands.find((o) => o.t === 'name')
        const sz = operands.find((o) => typeof o === 'number')
        if (nm) curFont = nm.v
        if (sz !== undefined) fontSize = sz
        break
      }
      case 'Td': case 'TD': {
        const [tx, ty] = [Number(operands[0]) || 0, Number(operands[1]) || 0]
        if (op === 'TD') leading = -ty
        // Tlm' = Tlm × T(tx,ty) — offset in text space, not user space
        tlm = matMul(tlm, [1, 0, 0, 1, tx, ty])
        tm = [...tlm]
        break
      }
      case 'T*': tlm = matMul(tlm, [1, 0, 0, 1, 0, -leading]); tm = [...tlm]; break
      case 'TL': leading = Number(operands[0]) || 0; break
      case 'Tm': if (operands.length === 6) { tm = operands.map(Number); tlm = [...tm] } break
      case 'Tc': tc = Number(operands[0]) || 0; break
      case 'Tw': tw = Number(operands[0]) || 0; break
      case 'Tz': tz = (Number(operands[0]) || 100) / 100; break
      case 'Tj': case "'": case '"': {
        if (op === "'" || op === '"') { tlm = matMul(tlm, [1, 0, 0, 1, 0, -leading]); tm = [...tlm] }
        const s = [...operands].reverse().find((o) => o.t === 'str')
        if (s) emitText(s.bytes)
        break
      }
      case 'TJ': {
        const arr = operands.find((o) => o.t === 'arr')
        if (!arr) break
        for (const it of arr.items) {
          if (it.t === 'str') emitText(it.bytes)
          else if (typeof it === 'number') {
            // kerning adjust: negative moves forward, in thousandths of em
            tm[4] += (-it / 1000) * fontSize * tz
          }
        }
        break
      }
      case 'Do': {
        const nm = [...operands].reverse().find((o) => o.t === 'name')
        if (!nm) break
        if (imgObj(nm.v)) {
          const corners = [[0, 0], [1, 0], [1, 1], [0, 1]].map(([x, y]) => matPt(disp, ...matPt(ctm, x, y)))
          const xs = corners.map((c) => c[0]), ys = corners.map((c) => c[1])
          ops.push({ t: 'img', x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys), rot: 0, key: imgKey(nm.v), ref: imgObj(nm.v) })
        }
        break
      }
      case 're': {
        const [rx, ry, rw, rh] = operands.map(Number)
        if ([rx, ry, rw, rh].every(Number.isFinite)) pathRects.push([rx, ry, rw, rh])
        break
      }
      case 'f': case 'F': case 'f*': case 'S': case 's': case 'B': case 'b': {
        for (const [rx, ry, rw, rh] of pathRects) {
          const corners = [[rx, ry], [rx + rw, ry], [rx + rw, ry + rh], [rx, ry + rh]].map(([x, y]) => matPt(disp, ...matPt(ctm, x, y)))
          const xs = corners.map((c) => c[0]), ys = corners.map((c) => c[1])
          ops.push({ t: 'rect', x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys), stroke: op === 'S' || op === 's' })
        }
        pathRects.length = 0
        break
      }
      case 'n': pathRects.length = 0; break
    }
  }
  return { ops, box }
}

/** Undo PNG/TIFF predictors on inflated image data (DecodeParms). */
function unPredict(data, { predictor = 1, columns = 1, colors = 1, bpc = 8 }) {
  if (predictor === 1) return data
  const bpp = Math.max(1, Math.ceil((colors * bpc) / 8))
  const rowBytes = Math.ceil((columns * colors * bpc) / 8)
  if (predictor === 2) {
    const out = new Uint8Array(data.length)
    for (let y = 0; y * rowBytes < data.length; y++) {
      const row = y * rowBytes
      for (let x = 0; x < rowBytes; x++) {
        const left = x >= bpp ? out[row + x - bpp] : 0
        out[row + x] = (data[row + x] + left) & 0xff
      }
    }
    return out
  }
  if (predictor < 10 || predictor > 15) throw new Error(`unsupported predictor ${predictor}`)
  const hasFilterByte = predictor >= 10
  const rowStride = rowBytes + (hasFilterByte ? 1 : 0)
  const rows = Math.floor(data.length / rowStride)
  const out = new Uint8Array(rows * rowBytes)
  const paeth = (a, b, c) => {
    const p = a + b - c
    const pa = Math.abs(p - a), pb = Math.abs(p - b), pc = Math.abs(p - c)
    return pa <= pb && pa <= pc ? a : pb <= pc ? b : c
  }
  for (let y = 0; y < rows; y++) {
    const src = y * rowStride + (hasFilterByte ? 1 : 0)
    const f = hasFilterByte ? data[y * rowStride] : 1 // Optimum → sub? spec: treated as per-row
    const prev = y > 0 ? (y - 1) * rowBytes : -1
    for (let x = 0; x < rowBytes; x++) {
      const a = x >= bpp ? out[y * rowBytes + x - bpp] : 0
      const b = prev >= 0 ? out[prev + x] : 0
      const c = x >= bpp && prev >= 0 ? out[prev + x - bpp] : 0
      let v = data[src + x]
      if (f === 1) v += a
      else if (f === 2) v += b
      else if (f === 3) v += (a + b) >> 1
      else if (f === 4) v += paeth(a, b, c)
      out[y * rowBytes + x] = v & 0xff
    }
  }
  return out
}

/**
 * Pull embedded images out of a PDF.
 * Returns { images: [{name, data, w, h}], skipped } — DCTDecode→.jpg,
 * JPXDecode→.jp2, FlateDecode raw RGB/gray 8-bit→.png, else counted in skipped.
 */
/**
 * Decode one image XObject stream → {data, mime, ext} or null when unsupported.
 * Applies the full /Filter chain in order; a trailing image codec (DCT/JPX)
 * names the format, everything else is unwrapped as compression.
 */
async function decodeImageStream(doc, v) {
  const w = get(v.dict, 'Width') ?? 0
  const h = get(v.dict, 'Height') ?? 0
  const filterVal = get(v.dict, 'Filter')
  const chain = (Array.isArray(filterVal) ? filterVal : filterVal === undefined ? [] : [filterVal]).map(
    (fl) => (isName(fl) ? fl.v : null),
  )
  const codec = { DCTDecode: ['.jpg', 'image/jpeg'], DCT: ['.jpg', 'image/jpeg'], JPXDecode: ['.jp2', 'image/jp2'], JPX: ['.jp2', 'image/jp2'] }
  const last = chain.length ? chain[chain.length - 1] : null
  const out = last ? codec[last] : undefined
  const decodeChain = out ? chain.slice(0, -1) : chain
  let data = v.data
  for (const fl of decodeChain) {
    if (fl === 'FlateDecode' || fl === 'Fl') data = await inflate(data)
    else return null
  }
  if (out) return { data, mime: out[1], ext: out[0] }
  if (!decodeChain.every((fl) => fl === 'FlateDecode' || fl === 'Fl' || fl === null)) return null
  const bpc = get(v.dict, 'BitsPerComponent') ?? 8
  let cs = get(v.dict, 'ColorSpace')
  if (isRef(cs)) cs = deref(doc, cs)
  const csName = isName(cs) ? cs.v : Array.isArray(cs) && isName(cs[0]) ? cs[0].v : null
  if (bpc !== 8 || (csName !== 'DeviceRGB' && csName !== 'DeviceGray')) return null
  const colors = csName === 'DeviceRGB' ? 3 : 1
  let dp = get(v.dict, 'DecodeParms') ?? get(v.dict, 'DP')
  if (Array.isArray(dp)) dp = [...dp].reverse().find((x) => x instanceof Map)
  const parms = dp instanceof Map ? {
    predictor: get(dp, 'Predictor') ?? 1,
    columns: get(dp, 'Columns') ?? w,
    colors: get(dp, 'Colors') ?? colors,
    bpc: get(dp, 'BitsPerComponent') ?? 8,
  } : { predictor: 1, columns: w, colors, bpc: 8 }
  const raw = unPredict(data, parms)
  if (raw.length !== w * h * colors) return null
  return { data: pngEncode(w, h, raw, colors === 1), mime: 'image/png', ext: '.png' }
}

/**
 * Pull embedded images out of a PDF.
 * Returns { images: [{name, data, w, h, mime}], skipped }.
 */
async function extractImages(bytes) {
  const doc = await parsePdf(bytes)
  const images = []
  let skipped = 0
  let i = 0
  for (const { v } of doc.objects.values()) {
    if (!isStream(v) || get(v.dict, 'Subtype')?.v !== 'Image') continue
    i++
    const w = get(v.dict, 'Width') ?? 0
    const h = get(v.dict, 'Height') ?? 0
    const dec = await decodeImageStream(doc, v).catch(() => null)
    if (dec) images.push({ name: `image-${i}-${w}x${h}${dec.ext}`, data: dec.data, w, h, mime: dec.mime, hash: crc32(dec.data) >>> 0 })
    else skipped++
  }
  return { images, skipped }
}

// Tiny DOM helper — h(tag, attrs, ...children). No framework, no build.

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs ?? {})) {
    if (v === undefined || v === null) continue
    if (k === 'class') el.className = v
    else if (k === 'dataset') Object.assign(el.dataset, v)
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v)
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v)
    else if (v === true) el.setAttribute(k, '')
    else el.setAttribute(k, v)
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue
    el.append(kid?.nodeType ? kid : document.createTextNode(String(kid)))
  }
  return el
}

    p.setAttribute('stroke-width', '1.8')
    p.setAttribute('stroke-linecap', 'round')
    p.setAttribute('stroke-linejoin', 'round')

function setKids(el, ...kids) {

function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob)
  const a = h('a', { href: url, download: name })
  a.click()
  setTimeout(() => URL.revokeObjectURL(url), 10_000)
}

const readBytes = async (file) => new Uint8Array(await file.arrayBuffer())

function fmtBytes(n) {
  if (n < 1024) return `${n} B`
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`
  return `${(n / 1024 / 1024).toFixed(1)} MB`
}

/**
 * File drop zone — a <label> wrapping a hidden input, so clicking it opens the
 * file dialog NATIVELY. Zero JS involved in opening the picker (no recursion
 * bugs possible). Drag & drop handled separately.
 */
function DropZone({ accept, multiple = false, onFiles, label }) {
  const input = h('input', {
    type: 'file',
    accept,
    multiple: multiple || undefined,
    class: 'hidden-input',
    onchange: (e) => {
      const files = [...e.target.files]
      if (files.length) onFiles(files)
      e.target.value = ''
    },
  })

  const zone = h(
    'label',
    {
      class: 'dropzone',
      tabindex: '0',
      role: 'button',
      onclick: (e) => {
        if (e.target === input) return // our own input.click() bubbling up — don't loop
        e.preventDefault() // kill native label forwarding; JS path opens exactly one dialog
        input.click()
      },
      onkeydown: (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault()
          input.click()
        }
      },
    },
    input,
    icon('upload', 'icon-lg dim'),
    h('span', { class: 'dz-text' }, label ?? `Drop ${multiple ? 'files' : 'a file'} here or `, h('em', {}, 'browse')),
  )

  zone.addEventListener('dragover', (e) => {
    e.preventDefault()
    zone.classList.add('over')
  })
  zone.addEventListener('dragleave', () => zone.classList.remove('over'))
  zone.addEventListener('drop', (e) => {
    e.preventDefault()
    zone.classList.remove('over')
    const files = [...e.dataTransfer.files]
    if (files.length) onFiles(files)
  })
  return zone
}

/**
 * Ordered file list — drag-to-reorder + move-up/down + remove.
 * Each item may carry .meta (extra info line, e.g. page count) and .err.
 */
function FileList({ files, onMove, onRemove }) {
  let dragIdx = null
  const list = h('ul', { class: 'filelist' })
  files.forEach((f, i) => {
    const li = h(
      'li',
      {
        draggable: 'true',
        ondragstart: (e) => {
          dragIdx = i
          e.dataTransfer.effectAllowed = 'move'
          e.dataTransfer.setData('text/plain', '') // required for drag to fire
        },
        ondragend: () => {
          dragIdx = null
          list.querySelectorAll('li').forEach((x) => x.classList.remove('target'))
        },
        ondragover: (e) => {
          e.preventDefault()
          li.classList.add('target')
        },
        ondragleave: () => li.classList.remove('target'),
        ondrop: (e) => {
          e.preventDefault()
          li.classList.remove('target')
          if (dragIdx !== null && dragIdx !== i) onMove(dragIdx, i)
        },
      },
      f.thumbNode
        ? f.thumbNode
        : f.thumb
          ? h('img', { class: 'thumb', src: f.thumb, alt: '' })
          : h('span', { class: 'idx' }, String(i + 1)),
      h('span', { class: 'fname' }, f.name, f.meta ? h('span', { class: 'fmeta' }, f.meta) : null),
      f.err ? h('span', { class: 'ferr' }, f.err) : h('span', { class: 'fsize' }, fmtBytes(f.size)),
      f.onExpand ? iconBtn('grid', 'Show pages', (e) => { e.stopPropagation(); f.onExpand() }) : null,
      iconBtn('up', 'Move up', () => onMove(i, i - 1), i === 0),
      iconBtn('down', 'Move down', () => onMove(i, i + 1), i === files.length - 1),
      iconBtn('x', 'Remove', () => onRemove(i)),
    )
    if (f.detail) li.append(h('div', { class: 'fdetail' }, f.detail))
    list.append(li)
  })
  return list
}

/**
 * Page-card grid for Organize — drag-reorder, rotate ±90°, delete/restore,
 * click/shift select, insertion-line drop indicator, zoom on demand.
 * items: [{page, w, h, rotation, deleted, canvas?, imgUrl?, text?}]
 */
function PageGrid({ items, onReorder, onRotate, onToggleDelete, selected, onSelect, onZoom }) {
  let dragIdx = null
  const grid = h('div', { class: 'pgrid' })

  const clearMarks = () => grid.querySelectorAll('.pcard').forEach((c) => c.classList.remove('target', 'drop-before', 'drop-after'))

  items.forEach((it, i) => {
    const card = h(
      'div',
      {
        class: 'pcard' + (it.deleted ? ' deleted' : '') + (selected?.has(it) ? ' sel' : ''),
        style: { aspectRatio: it.w && it.h ? `${it.w} / ${it.h}` : '3 / 4' },
        draggable: 'true',
        onclick: onSelect ? (e) => onSelect(i, e.shiftKey) : undefined,
        ondragstart: (e) => {
          dragIdx = i
          e.dataTransfer.effectAllowed = 'move'
          e.dataTransfer.setData('text/plain', '') // required for drag to fire
        },
        ondragend: () => {
          dragIdx = null
          clearMarks()
        },
        ondragover: (e) => {
          e.preventDefault()
          clearMarks()
          const r = card.getBoundingClientRect()
          const after = e.clientX > r.left + r.width / 2
          card.classList.add(after ? 'drop-after' : 'drop-before')
        },
        ondragleave: () => card.classList.remove('drop-before', 'drop-after'),
        ondrop: (e) => {
          e.preventDefault()
          const r = card.getBoundingClientRect()
          const after = e.clientX > r.left + r.width / 2
          clearMarks()
          if (dragIdx === null) return
          let to = after ? i + 1 : i
          if (dragIdx < to) to--
          if (to !== dragIdx) onReorder(dragIdx, to)
        },
      },
      h('div', { class: 'pbody' },
        it.canvas ?? (it.imgUrl
          ? h('img', { class: 'pthumb', src: it.imgUrl, alt: '', draggable: 'false' })
          : it.text
            ? h('div', { class: 'ptext' }, it.text)
            : null),
        h('div', { class: 'pnum' }, `p${it.page}`),
        h('div', { class: 'pdim' }, `${it.w}×${it.h}`),
        it.rotation ? h('div', { class: 'prot' }, `${it.rotation}°`) : null,
      ),
      onSelect && selected?.has(it) ? h('div', { class: 'pchk' }, icon('check', 'icon-sm')) : null,
      h(
        'div',
        { class: 'pops' },
        onZoom ? iconBtn('zoom', 'View page', (e) => { e.stopPropagation(); onZoom(i) }) : null,
        iconBtn('rotl', 'Rotate −90°', (e) => { e.stopPropagation(); onRotate(i, -90) }),
        iconBtn('rotate', 'Rotate +90°', (e) => { e.stopPropagation(); onRotate(i, 90) }),
        iconBtn(it.deleted ? 'undo' : 'x', it.deleted ? 'Restore' : 'Delete', (e) => { e.stopPropagation(); onToggleDelete(i) }),
      ),
    )
    grid.append(card)
  })
  return grid
}
