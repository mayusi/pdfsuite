      const list = parseRanges(range || '', n).flatMap(({ from, to }) => Array.from({ length: to - from + 1 }, (_, k) => from - 1 + k))
      const ok = [...new Set(list)].filter((i) => i >= 0 && i < n)
      if (!ok.length) throw new Error('Type which pages to save, e.g. 1-3, 5')
      return ok
    }
    return ed.pages.map((_, i) => i)
  }
  /**
   * opts: {format: 'pdf'|'png'|'jpg', pages: 'all'|'current'|'range', range, dpi, quality, flatten, name}
   * Images are rendered from the exported PDF, so they show exactly what the PDF contains.
   */
  async function doExport({ flatten = false, format = 'pdf', pages = 'all', range = '', dpi = 150, quality = 0.9, name = '' } = {}) {
    ed.closeEditor(true)
    ed.finishCrop(true)
    const btn = els.download
    btn.disabled = true
    const label = btn.lastChild
    const orig = label.textContent
    try {
      const anyField = Object.keys(ed.values).length > 0
      const idx = pickPages(pages, range)
      const all = idx.length === ed.pages.length && idx.every((v, k) => v === k)
      // a PDF of some pages: export just those; images: export everything, render the picks
      const subset = format === 'pdf' && !all
      const out = await exportEdited(ed.info, subset ? idx.map((i) => ed.pages[i]) : ed.pages, {
        forms: anyField || flatten ? { values: ed.values, flatten: flatten || format !== 'pdf' } : null,
        onStep: (st) => { label.textContent = `${st}…` },
      })
      const baseName = (name || ed.fileName || stem(ed.info.name)).trim().replace(/\.(pdf|png|jpe?g|zip)$/i, '')
      const base = `${baseName}${baseName === stem(ed.info.name) ? '-edited' : ''}`
      if (format === 'pdf') {
        const fname = `${base}.pdf`
        saveBlob(new Blob([out], { type: 'application/pdf' }), fname)
        toast(`Saved ${fname} · ${fmtBytes(out.length)}`)
        if (all) ed.dirty = false
      } else {
        const doc = await parsePdf(out)
        const leaves = pageLeaves(doc)
        const mime = format === 'jpg' ? 'image/jpeg' : 'image/png'
        const cache = new Map()
        const files = []
        for (let k = 0; k < idx.length; k++) {
          const i = idx[k]
          label.textContent = `Page ${k + 1}/${idx.length}…`
          const width = Math.min(Math.round((ed.pages[i].w * dpi) / 72), 9000) // ~40 MP cap keeps the tab alive
          const cv = await renderPage(doc, leaves[i], { width, cache })
          const blob = await new Promise((r) => cv.toBlob(r, mime, format === 'jpg' ? quality : undefined))
          if (!blob) throw new Error(`Couldn’t encode page ${i + 1} (too large?)`)
          files.push({ name: `${base}-page-${String(i + 1).padStart(String(ed.pages.length).length, '0')}.${format}`, data: new Uint8Array(await blob.arrayBuffer()) })
          await yieldUI()
        }
        if (files.length === 1) {
          saveBlob(new Blob([files[0].data], { type: mime }), files[0].name)
          toast(`Saved ${files[0].name} · ${fmtBytes(files[0].data.length)}`)
        } else {
          const zip = zipStore(files)
          saveBlob(new Blob([zip], { type: 'application/zip' }), `${base}-${format}.zip`)
          toast(`Saved ${files.length} images in ${base}-${format}.zip · ${fmtBytes(zip.length)}`)
        }
      }
      ed.lastExport = { format, pages: idx.length }
    } catch (e) {
      console.error(e)
      toast(`Couldn’t save: ${friendly(e)}`, { type: 'error' })
    } finally {
      btn.disabled = false
      label.textContent = orig
    }
  }
  const EXPORT_KEY = 'pdfsuite-export'
  ed.exportDialog = () => {
    ed.closeEditor(true)
    let o = { format: 'pdf', pages: 'all', dpi: 150, quality: 0.9, flatten: false }
    try { o = { ...o, ...JSON.parse(localStorage.getItem(EXPORT_KEY) ?? '{}') } } catch { /* private mode */ }
    o.range = ''
    o.name = ed.fileName || stem(ed.info.name)
    const body = h('div', { class: 'xport' })
    const est = () => {
      const p = ed.current ?? ed.pages[0]
      return `${Math.round((p.w * o.dpi) / 72)} × ${Math.round((p.h * o.dpi) / 72)} px per page`
    }
    const paint = () => {
      const img = o.format !== 'pdf'
      const count = o.pages === 'all' ? ed.pages.length : o.pages === 'current' ? 1 : 2
      setKids(body,
        Field('Save as', Seg([['pdf', 'PDF', 'file'], ['png', 'PNG', 'image'], ['jpg', 'JPG', 'image']], o.format, (v) => { o.format = v; paint() }, { block: true })),
        Field('Pages', Seg([['all', `All ${ed.pages.length}`], ['current', `Page ${ed.pages.indexOf(ed.current) + 1}`], ['range', 'Choose…']], o.pages, (v) => { o.pages = v; paint() }, { block: true })),
        o.pages === 'range' ? Field('Which pages', TextInput(o.range, (v) => { o.range = v }, { placeholder: `e.g. 1-3, 5 (of ${ed.pages.length})` })) : null,
        img ? Field('Resolution', Seg([['72', 'Screen'], ['150', 'Standard'], ['220', 'High'], ['300', 'Print']], String(o.dpi), (v) => { o.dpi = +v; paint() }, { block: true }), { hint: `${o.dpi} DPI · ${est()}` }) : null,
        img && o.format === 'jpg' ? Field('JPG quality', Range(Math.round(o.quality * 100), { min: 40, max: 100, fmt: (v) => `${v}%` }, (v) => { o.quality = v / 100 })) : null,
        !img && ed.fields.length ? Switch('Flatten form fields', !!o.flatten, (v) => { o.flatten = v }, { hint: 'Fixes the answers into the page so they can’t be changed' }) : null,
        Field('File name', TextInput(o.name, (v) => { o.name = v })),
        img && count > 1 ? h('div', { class: 'tip' }, 'Several pages download together in one .zip file.') : null)
    }
    paint()
    modal({
      title: 'Download', body: [body],
      actions: [{ label: 'Cancel' }, {
        label: 'Download', variant: 'primary', onClick: () => {
          if (o.pages === 'range') {
            try { pickPages('range', o.range) } catch (e) { toast(/bad range/.test(e.message) ? 'Use page numbers like 1-3, 5' : e.message, { type: 'error' }); return false }
          }
          try { localStorage.setItem(EXPORT_KEY, JSON.stringify({ format: o.format, pages: o.pages === 'range' ? 'all' : o.pages, dpi: o.dpi, quality: o.quality, flatten: o.flatten })) } catch { /* private mode */ }
          doExport({ ...o })
        },
      }],
    })
  }
  ed._export = doExport // test hook

  const confirmLeave = async () => !ed.dirty || confirmDialog('Leave without saving?', 'Your edits haven’t been downloaded yet. They’ll be lost if you leave.', { ok: 'Leave', danger: true, cancel: 'Stay' })
  const onBeforeUnload = (e) => { if (ed.dirty && root.isConnected) { e.preventDefault(); e.returnValue = '' } }
  addEventListener('beforeunload', onBeforeUnload)

  ed.showShortcuts = () => {
    const rows = [['V', 'Select'], ['E', 'Edit existing text'], ['T', 'Add text'], ['P', 'Draw'], ['H', 'Highlight'], ['R', 'Shapes'], ['W', 'Whiteout'], ['X', 'Redact'], ['I', 'Image'], ['S', 'Signature'], ['K', 'Stamps'], ['N', 'Comment'], ['L', 'Link'],
      ['Ctrl+Z', 'Undo'], ['Ctrl+Shift+Z / Ctrl+Y', 'Redo'], ['Ctrl+C / Ctrl+V', 'Copy / paste'], ['Ctrl+D', 'Duplicate'], ['Del', 'Delete selection'], ['Arrows', 'Nudge (Shift = 10pt)'], ['Enter', 'Edit selected text'], ['Esc', 'Deselect / back to Select'],
      ['Ctrl + / Ctrl −', 'Zoom'], ['Ctrl+0', 'Fit width'], ['Ctrl+wheel / pinch', 'Zoom at cursor'], ['Ctrl+S', 'Download'], ['PgUp / PgDn', 'Previous / next page'], ['Shift while drawing', 'Squares, circles, 45° lines']]
    modal({ title: 'Keyboard shortcuts', wide: true, body: h('div', { class: 'kbgrid' }, rows.map(([k, d]) => h('div', {}, h('span', {}, d), h('span', { class: 'kbd' }, k)))) })
  }
  ed.saveStyle = () => { try { localStorage.setItem(STYLE_KEY, JSON.stringify(ed.style)) } catch { /* private mode */ } }

  // ---------- keyboard ----------
  const KEYMAP = Object.fromEntries(TOOLS.filter((t) => t !== '|').map(([id, , k]) => [k.toLowerCase(), id]))
  const onKey = (e) => {
    if (!root.isConnected) { cleanup(); return }
    if (!ed.info || document.querySelector('.modal-back, .menu')) return
    if (/input|textarea|select/i.test(e.target.tagName) || e.target.isContentEditable) return
    const mod = e.ctrlKey || e.metaKey
    const k = e.key.toLowerCase()
    if (mod && k === 'z' && !e.shiftKey) { e.preventDefault(); ed.undo() }
    else if (mod && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); ed.redo() }
    else if (mod && k === 's' && !e.shiftKey) { e.preventDefault(); doExport({}) }
    else if (mod && e.shiftKey && k === 's') { e.preventDefault(); ed.exportDialog() }
    else if (mod && k === 'c') copySel()
    else if (mod && k === 'v') { e.preventDefault(); paste() }
    else if (mod && k === 'd') { e.preventDefault(); ed.duplicate() }
    else if (mod && (k === '=' || k === '+')) { e.preventDefault(); ed.setZoom(ed.zoom * 1.2, { commit: true }) }
    else if (mod && k === '-') { e.preventDefault(); ed.setZoom(ed.zoom / 1.2, { commit: true }) }
    else if (mod && k === '0') { e.preventDefault(); ed.fit('width') }
    else if (mod && ['b', 'i', 'u'].includes(k) && ed.sel && /text/.test(ed.sel.a.t)) {
      e.preventDefault()
      const key = { b: 'bold', i: 'italic', u: 'underline' }[k]
      ed.sel.a[key] = !ed.sel.a[key]
      ed.redrawCurrent(); ed.refreshProps(); ed.commit('Style')
    } else if (ed.cropping && (e.key === 'Enter' || e.key === 'Escape')) { e.preventDefault(); ed.finishCrop(e.key === 'Enter') }
    else if (mod && k === 'a') { e.preventDefault(); ed.selectAll() }
    else if (mod && k === 'e') { e.preventDefault(); ed.exportDialog() }
    else if ((e.key === 'Delete' || e.key === 'Backspace') && (ed.sel || ed.pdfImg)) { e.preventDefault(); ed.deleteSel() }
    else if (e.key === 'Escape') { if (ed.sel || ed.pdfImg) ed.select(null); else if (ed.tool !== 'select') ed.setTool('select') }
    else if (e.key === '[' || e.key === ']') { if (ed.sel) { e.preventDefault(); ed.reorder(e.key === ']' ? (mod ? 'front' : 'forward') : (mod ? 'back' : 'backward')) } }
    else if (e.key.startsWith('Arrow') && ed.sel) {
      e.preventDefault()
      const d = e.shiftKey ? 10 : 1
      for (const a of ed.selected()) if (!a.locked) move(a, e.key === 'ArrowLeft' ? -d : e.key === 'ArrowRight' ? d : 0, e.key === 'ArrowUp' ? -d : e.key === 'ArrowDown' ? d : 0)
      ed.redrawCurrent()
      clearTimeout(ed._nt)
      ed._nt = setTimeout(() => ed.commit('Nudge'), 400)
    } else if (e.key === 'Enter' && ed.sel && /text/.test(ed.sel.a.t)) { e.preventDefault(); ed.editSelected() }
    else if (e.key === '?') ed.showShortcuts()
    else if (!mod && !e.altKey && KEYMAP[k]) { e.preventDefault(); ed.setTool(KEYMAP[k]) }
    else if (e.key === 'PageDown' || e.key === 'PageUp') {
      const i = ed.pages.indexOf(ed.current) + (e.key === 'PageDown' ? 1 : -1)
      if (ed.pages[i]) { e.preventDefault(); ed.scrollToPage(ed.pages[i]) }
    }
  }
  document.addEventListener('keydown', onKey)
  function cleanup() {
    document.removeEventListener('keydown', onKey)
    removeEventListener('beforeunload', onBeforeUnload)
    io?.disconnect()
    farIo?.disconnect()
    thumbs?.disconnect()
    els.ro?.disconnect()
  }
  // the router swaps the whole app on navigation: notice when we're detached
  const mo = new MutationObserver(() => { if (!root.isConnected) { cleanup(); mo.disconnect() } })
  requestAnimationFrame(() => mo.observe(document.getElementById('app') ?? document.body, { childList: true }))

  window.__pdfsuiteEditor = ed // devtools / automated tests
  const ho = takeHandoff()
  if (ho) load([Array.isArray(ho) ? ho[0] : ho])
  else empty()
  return root
}

// ---- src/tools/img2pdf.js ----

const ACCEPT = 'image/jpeg,image/png,image/webp,image/gif,image/bmp,image/avif,.jpg,.jpeg,.png,.webp,.gif,.bmp,.avif'

/** Decode an image file for the PDF: JPEG passthrough (lossless) or RGBA pixels. */
async function prepare(file, { shrink }) {
  const isJpeg = /jpe?g$/i.test(file.type) || /\.jpe?g$/i.test(file.name)
  const bmp = await createImageBitmap(file, { imageOrientation: 'none' })
  try {
    const big = Math.max(bmp.width, bmp.height) > 2600
    if (isJpeg && !(shrink && big)) return { jpeg: await readBytes(file) }
    const k = shrink && big ? 2600 / Math.max(bmp.width, bmp.height) : 1
    const c = document.createElement('canvas')
    c.width = Math.max(1, Math.round(bmp.width * k))
    c.height = Math.max(1, Math.round(bmp.height * k))
    const x = c.getContext('2d')
    x.drawImage(bmp, 0, 0, c.width, c.height)
    if (isJpeg || (shrink && big)) { // photo → JPEG keeps the PDF small
      let exif = 0
      if (isJpeg) { try { exif = exifRotation(jpegInfo(await readBytes(file)).orientation) } catch { /* not a parseable jpeg */ } }
      const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.88))
      return { jpeg: new Uint8Array(await blob.arrayBuffer()), extraRot: exif }
    }
    return { rgba: x.getImageData(0, 0, c.width, c.height).data, width: c.width, height: c.height }
  } finally { bmp.close?.() }
}

function ImgToPdf() {
  const { root, render } = mount()
  let items = [] // {id, file, thumb, w, h, rotate, err}
  let size = 'fit'
  let orient = 'auto'
  let margin = 0
  let fit = 'contain'
  let shrink = true
  let outName = 'images'
  let busy = false
  let result = null
  let uid = 0

  const add = async (files) => {
    result = null
    for (const f of files) {
      const it = { id: ++uid, file: f, thumb: null, w: 0, h: 0, rotate: 0, err: null }
      items.push(it)
      paint()
      try {
        // thumbnail with EXIF orientation applied (what the PDF will show)
        const bmp = await createImageBitmap(f)
        it.w = bmp.width
        it.h = bmp.height
        const k = 260 / Math.max(bmp.width, bmp.height)
        const c = document.createElement('canvas')
        c.width = Math.max(1, Math.round(bmp.width * k))
        c.height = Math.max(1, Math.round(bmp.height * k))
        c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height)
        bmp.close?.()
        it.thumb = c
      } catch { it.err = 'Can’t read this image' }
      paint()
    }
  }

  const run = () => runTask((b) => { busy = b; paint() }, async () => {
    const good = items.filter((x) => !x.err)
    const images = []
    for (const it of good) {
      const p = await prepare(it.file, { shrink })
      images.push({ ...p, rotate: (it.rotate + (p.extraRot ?? 0)) % 360 })
    }
    const out = await imagesToPdf(images, { size, orient, margin, fit })
    result = { blob: new Blob([out], { type: 'application/pdf' }), name: `${(outName.trim() || 'images').replace(/\.pdf$/i, '')}.pdf`, n: good.length }
  })

  const move = (from, to) => { const [x] = items.splice(from, 1); items.splice(to, 0, x); paint() }

  function card(it, k) {
    const thumb = it.thumb ? rotatedCanvas(it.thumb, it.rotate) : null
    return h('div', { class: 'pcard draggable' },
      h('div', { class: 'pops' },
        h('button', { type: 'button', 'data-tip': 'Rotate', onclick: (e) => { e.stopPropagation(); it.rotate = (it.rotate + 90) % 360; paint() } }, icon('rotate', 'icon-sm')),
        h('button', { type: 'button', class: 'danger', 'data-tip': 'Remove', onclick: (e) => { e.stopPropagation(); items = items.filter((x) => x !== it); paint() } }, icon('x', 'icon-sm'))),
      h('div', { class: 'pthumbw' }, thumb ?? (it.err ? h('span', { class: 'ferr small' }, it.err) : h('div', { class: 'pskel' }))),
      h('div', { class: 'plabel', title: it.file.name }, h('b', {}, `${k + 1}`), h('span', {}, it.w ? `${it.w}×${it.h}` : fmtBytes(it.file.size))))
  }

  function paint() {
    if (!items.length) {
      render(ToolHead('img2pdf'), Dropzone({ accept: ACCEPT, multiple: true, onFiles: add, title: 'Drop your images here', subtitle: 'JPG, PNG, WebP, GIF, BMP — as many as you like', label: 'Choose images', tc: 'var(--c-convert)', icon: 'image' }))
      return
    }
    if (result) {
      render(ToolHead('img2pdf'), ResultCard({ title: 'Your PDF is ready', blob: result.blob, filename: result.name, toolId: 'img2pdf', sub: `${result.name} · ${plural(result.n, 'page')} · ${fmtBytes(result.blob.size)}`, onAgain: () => { items = []; result = null; paint() } }))
      return
    }
    const grid = h('div', { class: 'pgrid' }, items.map(card))
    sortable(grid, '.pcard', move)
    const fixed = size !== 'fit'
    render(
      ToolHead('img2pdf'),
      Workspace(
        [
          h('div', { class: 'row between' },
            h('span', { class: 'muted small' }, 'Drag to reorder · each image becomes one page'),
            h('div', { class: 'row', style: { gap: '6px' } },
              Button({ label: 'A → Z', size: 'sm', onClick: () => { items.sort((a, b) => a.file.name.localeCompare(b.file.name, undefined, { numeric: true })); paint() } }),
              Button({ label: 'Reverse', size: 'sm', onClick: () => { items.reverse(); paint() } }))),
          grid,
          Dropzone({ accept: ACCEPT, multiple: true, onFiles: add, compact: true, title: 'Add more images', icon: 'image' }),
        ],
        [
          h('div', { class: 'card stack' },
            Field('Page size', Select([['fit', 'Same as image'], ['a4', 'A4'], ['letter', 'US Letter'], ['legal', 'US Legal'], ['a3', 'A3'], ['a5', 'A5']], size, (v) => { size = v; paint() })),
            fixed ? Field('Orientation', Seg([['auto', 'Auto'], ['portrait', 'Portrait'], ['landscape', 'Landscape']], orient, (v) => (orient = v), { block: true })) : null,
            fixed ? Field('Fit', Seg([['contain', 'Fit'], ['cover', 'Fill'], ['stretch', 'Stretch']], fit, (v) => (fit = v), { block: true })) : null,
            Field('Margin', Seg([[0, 'None'], [18, 'Small'], [36, 'Medium'], [54, 'Large']], margin, (v) => (margin = v), { block: true })),
            Switch('Shrink large photos', shrink, (v) => (shrink = v), { hint: 'Scales images over 2600px down — much smaller files' }),
            Field('File name', TextInput(outName, (v) => (outName = v)), { hint: '.pdf' })),
          h('div', { class: 'action-bar sticky-m' },
            Button({ label: busy ? 'Building PDF…' : 'Create PDF', icon: 'file', variant: 'primary', size: 'lg', block: true, busy, disabled: !items.some((x) => !x.err), onClick: run }),
            h('div', { class: 'summary' }, plural(items.filter((x) => !x.err).length, 'image'))),
        ]),
    )
  }

  const ho = takeHandoff()
  if (ho) add(Array.isArray(ho) ? ho : [ho])
  else paint()
  return root
}

/** Browser re-encode: the engine's PNG writer is uncompressed (zero-dep), canvas isn't. */
async function compressPng(im) {
  if (!im.rgba) return im.data
  const c = document.createElement('canvas')
  c.width = im.w
  c.height = im.h
  c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(im.rgba), im.w, im.h), 0, 0)
  const blob = await new Promise((r) => c.toBlob(r, 'image/png'))
  return blob ? new Uint8Array(await blob.arrayBuffer()) : im.data
}

function ExtractImgs() {
  const { root, render } = mount()
  let info = null
  let images = [] // {name, data, mime, w, h, hash, count, url}
  let skipped = 0
  let sel = new Set()
  let hideSmall = true
  let loading = null

  const load = async ([f]) => {
    try {
      const i = await openPdf(f)
      if (!i) return
      for (const im of images) URL.revokeObjectURL(im.url)
      info = i
      images = []
      skipped = 0
      loading = Progress(null)
      paint()
      const byHash = new Map()
      let n = 0
      const streams = [...info.doc.objects.values()].map((e) => e.v).filter((v) => isStream(v) && get(v.dict, 'Subtype')?.v === 'Image' && !get(v.dict, 'ImageMask'))
      // skip soft masks — they're alpha channels of other images, not pictures
      const smasks = new Set(streams.map((v) => get(v.dict, 'SMask')).filter(Boolean).map((r) => `${r.n} ${r.g}`))
      for (const [key, e] of info.doc.objects) {
        const v = e.v
        if (!streams.includes(v) || smasks.has(key)) continue
        const im = await decodeImageStream(info.doc, v).catch(() => null)
        if (!im) { skipped++; continue }
        const data = im.mime === 'image/png' ? await compressPng(im) : im.data
        const hash = crc32(data) >>> 0
        const w = get(v.dict, 'Width') ?? 0, hh = get(v.dict, 'Height') ?? 0
        if (byHash.has(hash)) { byHash.get(hash).count++; continue }
        const rec = { name: `${stem(info.name)}-image-${++n}${im.ext}`, data, mime: im.mime, w, h: hh, hash, count: 1, url: im.mime === 'image/jp2' ? null : URL.createObjectURL(new Blob([data], { type: im.mime })) }
        byHash.set(hash, rec)
        images.push(rec)
        if (n % 4 === 0) await yieldUI()
      }
      sel = new Set(visible())
      loading = null
      paint()
    } catch (e) { loading = null; toast(e.message, { type: 'error' }); paint() }
  }

  const visible = () => images.filter((im) => !hideSmall || (im.w >= 48 && im.h >= 48))

  const download = () => {
    const picks = visible().filter((im) => sel.has(im))
    if (picks.length === 1) { saveBlob(new Blob([picks[0].data], { type: picks[0].mime }), picks[0].name); return }
    saveBlob(new Blob([zipStore(picks.map((im) => ({ name: im.name, data: im.data })))], { type: 'application/zip' }), `${stem(info.name)}-images.zip`)
    toast(`Saved ${plural(picks.length, 'image')}`)
  }

  function paint() {
    if (!info) { render(ToolHead('extract'), Dropzone({ onFiles: load, title: 'Drop a PDF to pull out its images', tc: 'var(--c-convert)', icon: 'layers' })); return }
    const vis = visible()
    const picked = vis.filter((im) => sel.has(im))
    const total = picked.reduce((n, im) => n + im.data.length, 0)
    render(
      ToolHead('extract'),
      Workspace(
        [
          FileChip({ name: info.name, size: info.size, meta: docMeta(info), onReplace: async () => { const [f] = await pickFiles(); if (f) load([f]) } }),
          loading ? h('div', { class: 'card card-pad stack-sm' }, h('span', { class: 'muted small' }, 'Finding images…'), loading) : null,
          !loading && !vis.length ? Callout(images.length ? 'Only tiny images (icons, bullets) were found — turn off “Hide tiny images” to see them.' : 'This PDF has no embedded images we can extract.', { type: 'warn' }) : null,
          vis.length ? h('div', { class: 'row between' },
            h('span', { class: 'muted small' }, `${vis.length} unique image${vis.length === 1 ? '' : 's'}${skipped ? ` · ${skipped} in unsupported formats skipped` : ''}`),
            h('div', { class: 'row', style: { gap: '6px' } },
              Button({ label: 'All', size: 'sm', onClick: () => { sel = new Set(vis); paint() } }),
              Button({ label: 'None', size: 'sm', onClick: () => { sel = new Set(); paint() } }))) : null,
          h('div', { class: 'igrid' }, vis.map((im) => h('div', {
            class: 'icard' + (sel.has(im) ? ' sel' : ''), tabindex: '0',
            onclick: () => { sel.has(im) ? sel.delete(im) : sel.add(im); paint() },
          },
          h('span', { class: 'pcheck' }, icon('check', 'icon-sm')),
          h('button', { class: 'btn btn-sm btn-icon isave', 'data-tip': 'Download', onclick: (e) => { e.stopPropagation(); saveBlob(new Blob([im.data], { type: im.mime }), im.name) } }, icon('download', 'icon-sm')),
          h('div', { class: 'iprev' }, im.url ? h('img', { src: im.url, alt: im.name, loading: 'lazy' }) : h('span', { class: 'muted small' }, 'JPEG 2000')),
          h('div', {}, h('div', { class: 'iname' }, im.name.replace(/^.*-image-/, 'Image ')),
            h('div', { class: 'idim' }, `${im.w}×${im.h} · ${im.mime.split('/')[1].toUpperCase().replace('JPEG', 'JPG')} · ${fmtBytes(im.data.length)}${im.count > 1 ? ` · used ×${im.count}` : ''}`))))),
        ],
        [
          h('div', { class: 'card stack' },
            Switch('Hide tiny images', hideSmall, (v) => { hideSmall = v; sel = new Set(visible()); paint() }, { hint: 'Icons and bullets under 48px' }),
            h('p', { class: 'muted small', style: { margin: 0 } }, 'Photos come out exactly as stored in the PDF (no re-compression). Repeated images, like logos on every page, appear once.')),
          h('div', { class: 'action-bar sticky-m' },
            Button({ label: picked.length > 1 ? `Download ${picked.length} images` : 'Download image', icon: 'download', variant: 'primary', size: 'lg', block: true, disabled: !picked.length, onClick: download }),
            h('div', { class: 'summary' }, picked.length ? `${fmtBytes(total)}${picked.length > 1 ? ' · as a ZIP' : ''}` : 'Select images to download')),
        ]),
    )
  }

  const ho = takeHandoff()
  if (ho) load([Array.isArray(ho) ? ho[0] : ho])
  else paint()
  return root
}

const hexToRgb = (hx) => { const n = parseInt(hx.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255] }

/** An image file → watermark image ({jpeg} or {rgba,w,h} — transparency kept). */
async function loadImage(file) {
  const bmp = await createImageBitmap(file)
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height))
  const c = document.createElement('canvas')
  c.width = Math.max(1, Math.round(bmp.width * k))
  c.height = Math.max(1, Math.round(bmp.height * k))
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height)
  bmp.close?.()
  if (/jpe?g/i.test(file.type) && k === 1) return { jpeg: await readBytes(file), name: file.name, url: c.toDataURL() }
  return { rgba: c.getContext('2d').getImageData(0, 0, c.width, c.height).data, w: c.width, h: c.height, name: file.name, url: c.toDataURL() }
}

function PdfToImg() {
  const { root, render } = mount()
  let info = null
  let thumbs = null
  let fmt = 'png'
  let quality = 0.9
  let dpi = 150
  let sel = new Set()
  let busy = false
  let progress = null
  let result = null

  const load = async ([f]) => {
    try {
      const i = await openPdf(f)
      if (!i) return
      info = i
      thumbs?.disconnect()
      thumbs = pageThumbs(info)
      sel = new Set(info.leaves.map((_, k) => k))
      result = null
      paint()
    } catch (e) { toast(e.message, { type: 'error' }) }
  }

  const pxSize = () => { // rough output size for the first selected page
    const d = info.dims[[...sel][0] ?? 0]
    const w = d.rotate % 180 === 0 ? d.w : d.h, hh = d.rotate % 180 === 0 ? d.h : d.w
    return [Math.round((w * dpi) / 72), Math.round((hh * dpi) / 72)]
  }

  const run = () => runTask((b) => { busy = b; paint() }, async () => {
    const picks = [...sel].sort((a, b) => a - b)
    const cache = new Map()
    const files = []
    const base = stem(info.name)
    const mime = fmt === 'jpg' ? 'image/jpeg' : 'image/png'
    progress = Progress(0)
    paint()
    for (let k = 0; k < picks.length; k++) {
      const i = picks[k]
      const d = info.dims[i]
      const w = d.rotate % 180 === 0 ? d.w : d.h
      // cap at ~40 MP so 600 DPI on a poster can't crash the tab
      const width = Math.min(Math.round((w * dpi) / 72), 9000)
      const cv = await renderPage(info.doc, info.leaves[i], { width, cache })
      const blob = await new Promise((r) => cv.toBlob(r, mime, fmt === 'jpg' ? quality : undefined))
      if (!blob) throw new Error(`Couldn’t encode page ${i + 1} (too large?)`)
      files.push({ name: `${base}-page-${String(i + 1).padStart(String(info.leaves.length).length, '0')}.${fmt}`, data: new Uint8Array(await blob.arrayBuffer()) })
      progress.set((k + 1) / picks.length)
      await yieldUI() // let the UI breathe between pages
    }
    progress = null
    if (files.length === 1) result = { blob: new Blob([files[0].data], { type: mime }), name: files[0].name, n: 1 }
    else result = { blob: new Blob([zipStore(files)], { type: 'application/zip' }), name: `${base}-${fmt}.zip`, n: files.length }
  })

  function paint() {
    if (!info) { render(ToolHead('pdf2img'), Dropzone({ onFiles: load, title: 'Drop a PDF to turn into images', tc: 'var(--c-convert)', icon: 'image' })); return }
    if (result) {
      render(ToolHead('pdf2img'), ResultCard({
        title: result.n > 1 ? `${plural(result.n, 'image')} ready` : 'Image ready', blob: result.blob, filename: result.name, toolId: 'pdf2img',
        sub: `${result.name} · ${fmtBytes(result.blob.size)}`, onAgain: () => { result = null; paint() },
      }))
      return
    }
    const [pw, ph] = pxSize()
    render(
      ToolHead('pdf2img'),
      Workspace(
        [
          FileChip({ name: info.name, size: info.size, meta: docMeta(info), onReplace: async () => { const [f] = await pickFiles(); if (f) load([f]) } }),
          h('div', { class: 'row between' },
            h('span', { class: 'muted small' }, `${sel.size} of ${info.leaves.length} pages selected`),
            h('div', { class: 'row', style: { gap: '6px' } },
              Button({ label: 'All', size: 'sm', onClick: () => { sel = new Set(info.leaves.map((_, k) => k)); paint() } }),
              Button({ label: 'None', size: 'sm', onClick: () => { sel = new Set(); paint() } }))),
          h('div', { class: 'pgrid' }, info.leaves.map((_, i) => PageCard({
            thumbs, src: i, dims: info.dims[i], label: `${i + 1}`, selected: sel.has(i),
            onClick: () => { sel.has(i) ? sel.delete(i) : sel.add(i); paint() },
            ops: [{ icon: 'zoomIn', tip: 'Preview', onClick: () => zoomPage(info, i) }],
          }))),
        ],
        [
          h('div', { class: 'card stack' },
            Field('Format', Seg([['png', 'PNG'], ['jpg', 'JPG']], fmt, (v) => { fmt = v; paint() }, { block: true }), { hint: fmt === 'png' ? 'sharp, larger' : 'smaller files' }),
            fmt === 'jpg' ? Field('Quality', Range(Math.round(quality * 100), { min: 40, max: 100, fmt: (v) => `${v}%` }, (v) => (quality = v / 100))) : null,
            Field('Resolution', Seg([[72, '72'], [150, '150'], [300, '300'], [600, '600']], dpi, (v) => { dpi = v; paint() }, { block: true }), { hint: 'DPI' }),
            h('p', { class: 'muted small', style: { margin: 0 } }, `About ${pw} × ${ph} px per page.`)),
          h('div', { class: 'action-bar sticky-m' },
            progress,
            Button({ label: busy ? 'Rendering…' : `Convert ${plural(sel.size, 'page')}`, icon: 'download', variant: 'primary', size: 'lg', block: true, busy, disabled: !sel.size, onClick: run }),
            h('div', { class: 'summary' }, sel.size > 1 ? 'Downloaded as a ZIP' : '')),
        ]),
    )
  }

  const ho = takeHandoff()
  if (ho) load([Array.isArray(ho) ? ho[0] : ho])
  else paint()
  return root
}

/** Undo hard line-wrapping: join lines inside paragraphs, fix hyphenation. */
function reflow(text) {
  return text.split(/\n{2,}/).map((para) => para
    .replace(/(\w)-\n(\w)/g, '$1$2')
    .replace(/([^\n.!?:;])\n(?=[a-zà-ÿ0-9(“"'])/g, '$1 ')
  ).join('\n\n')
}

function PdfToText() {
  const { root, render } = mount()
  let info = null
  let pages = []
  let markers = true
  let paragraphs = false
  let loading = null

  const load = async ([f]) => {
    try {
      const i = await openPdf(f)
      if (!i) return
      info = i
      pages = []
      loading = Progress(0)
      paint()
      for (let k = 0; k < info.leaves.length; k++) {
        pages.push(await pageText(info.doc, info.leaves[k]).catch(() => ''))
        loading.set((k + 1) / info.leaves.length)
        if (k % 5 === 4) await yieldUI()
      }
      loading = null
      paint()
    } catch (e) { loading = null; toast(e.message, { type: 'error' }); paint() }
  }

  const fullText = () => pages.map((t, k) => {
    const body = paragraphs ? reflow(t) : t
    return markers ? `——— Page ${k + 1} ———\n${body}` : body
  }).join(markers ? '\n\n' : '\n\n')

  function paint() {
    if (!info) { render(ToolHead('pdftext'), Dropzone({ onFiles: load, title: 'Drop a PDF to pull its text out', tc: 'var(--c-convert)', icon: 'filetext' })); return }
    const text = loading ? '' : fullText()
    const words = text.trim() ? text.trim().split(/\s+/).length : 0
    const empty = !loading && pages.every((p) => !p.trim())
    const area = h('textarea', { class: 'textout', readonly: true, spellcheck: 'false' })
    area.value = text
    render(
      ToolHead('pdftext'),
      Workspace(
        [
          FileChip({ name: info.name, size: info.size, meta: docMeta(info), onReplace: async () => { const [f] = await pickFiles(); if (f) load([f]) } }),
          loading ? h('div', { class: 'card card-pad stack-sm' }, h('span', { class: 'muted small' }, 'Reading pages…'), loading) : null,
          empty ? Callout('No text found. This PDF is probably scanned images — the pages are pictures of text, not text. (OCR would be needed.)', { type: 'warn' }) : null,
          loading ? null : area,
        ],
        [
          h('div', { class: 'card stack' },
            Switch('Page markers', markers, (v) => { markers = v; paint() }, { hint: 'A line between pages' }),
            Switch('Join lines into paragraphs', paragraphs, (v) => { paragraphs = v; paint() }, { hint: 'Undo hard line breaks and hyphenation' }),
            h('p', { class: 'muted small', style: { margin: 0 } }, `${plural(words, 'word')} · ${plural(pages.length, 'page')}`)),
          h('div', { class: 'action-bar sticky-m' },
            Button({ label: 'Copy text', icon: 'copy', variant: 'primary', size: 'lg', block: true, disabled: !!loading || !words, onClick: async () => {
              try { await navigator.clipboard.writeText(fullText()); toast('Copied to clipboard') } catch { area.select(); document.execCommand('copy'); toast('Copied') }
            } }),
            Button({ label: 'Download .txt', icon: 'download', block: true, disabled: !!loading || !words, onClick: () => saveBlob(new Blob([fullText()], { type: 'text/plain;charset=utf-8' }), `${stem(info.name)}.txt`) })),
        ]),
    )
  }

  const ho = takeHandoff()
  if (ho) load([Array.isArray(ho) ? ho[0] : ho])
  else paint()
  return root
}

// ---- src/tools/compress.js ----

const LEVELS = {
  lossless: { label: 'Lossless', desc: 'Repacks everything without touching image quality.', q: null },
  balanced: { label: 'Balanced', desc: 'Re-encodes photos at good quality and caps them at 2000px. Best for most files.', q: 0.75, max: 2000 },
  smallest: { label: 'Smallest', desc: 'Stronger photo compression, capped at 1400px. Great for email; photos get softer.', q: 0.55, max: 1400 },
}

/** Browser-side photo re-encoder handed to the engine. */
const reimager = ({ q, max }) => async (dec) => {
  let src
  if (dec.rgba) {
    const c = document.createElement('canvas')
    c.width = dec.w
    c.height = dec.h
    c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(dec.rgba), dec.w, dec.h), 0, 0)
    src = c
  } else if (dec.mime === 'image/jpeg') {
    src = await createImageBitmap(new Blob([dec.data], { type: 'image/jpeg' })).catch(() => null)
  }
  if (!src) return null
  const k = Math.min(1, max / Math.max(src.width, src.height))
  if (src.width * src.height < 120 * 120) return null // icons: not worth it
  const c = document.createElement('canvas')
  c.width = Math.max(1, Math.round(src.width * k))
  c.height = Math.max(1, Math.round(src.height * k))
  const x = c.getContext('2d')
  x.fillStyle = '#fff' // JPEG has no alpha; any soft mask stays attached to the image
  x.fillRect(0, 0, c.width, c.height)
  x.drawImage(src, 0, 0, c.width, c.height)
  src.close?.()
  const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', q))
  return blob ? new Uint8Array(await blob.arrayBuffer()) : null
}

function Compress() {
  const { root, render } = mount()
  let info = null
  let level = 'balanced'
  let stripMeta = false
  let busy = false
  let result = null

  const load = async ([f]) => {
    try {
      const i = await openPdf(f)
      if (!i) return
      info = i
      result = null
      paint()
    } catch (e) { toast(e.message, { type: 'error' }) }
  }

  const run = () => runTask((b) => { busy = b; paint() }, async () => {
    const L = LEVELS[level]
    const r = await compressPdf(info.bytes, { reimage: L.q ? reimager(L) : undefined, stripMeta })
    const smaller = r.after < info.size
    result = { ...r, smaller, blob: new Blob([smaller ? r.bytes : info.bytes], { type: 'application/pdf' }), name: `${stem(info.name)}-compressed.pdf` }
  })

      render(ToolHead('compress'), ResultCard({
        title: result.smaller ? `${pct}% smaller` : 'Already well optimized',
        sub: result.smaller ? `${fmtBytes(info.size)} → ${fmtBytes(result.after)}` : 'We couldn’t make this file smaller — you’re downloading the original.',
        blob: result.blob, filename: result.name, toolId: 'compress', autoDownload: result.smaller,
        extra: h('div', { class: 'stats' },
          h('div', { class: 'stat' }, h('div', { class: 'sv' }, fmtBytes(info.size)), h('div', { class: 'sl' }, 'Before')),
          h('div', { class: 'stat good' }, h('div', { class: 'sv' }, fmtBytes(Math.min(info.size, result.after))), h('div', { class: 'sl' }, 'After')),
          h('div', { class: 'stat' }, h('div', { class: 'sv' }, `${result.images.recoded}/${result.images.total}`), h('div', { class: 'sl' }, 'Images re-compressed'))),
        onAgain: () => { result = null; paint() },
      }))
      if (!result.smaller) toast('This PDF is already as small as we can make it', { type: 'info' })
      return
    }
    render(
      ToolHead('compress'),
      Workspace(
        [
          FileChip({ name: info.name, size: info.size, meta: docMeta(info), onReplace: async () => { const [f] = await pickFiles(); if (f) load([f]) } }),
          h('div', { class: 'card card-pad stack-sm' },
            Object.entries(LEVELS).map(([k, L]) => h('label', {
              class: 'callout' + (k === level ? ' ok' : ''), style: { cursor: 'pointer', alignItems: 'center' },
              onclick: () => { level = k; paint() },
            }, h('input', { type: 'radio', name: 'lvl', checked: k === level, style: { accentColor: 'var(--accent)' } }),
            h('div', {}, h('b', {}, L.label), h('div', { class: 'small muted' }, L.desc))))),
        ],
        [
          h('div', { class: 'card stack' },
            Switch('Remove metadata', stripMeta, (v) => (stripMeta = v), { hint: 'Author, title, dates and XMP — a few KB, and more private' }),
            Callout('Text and vector graphics are always kept sharp — only photos are re-encoded, and only when it actually saves space.')),
          h('div', { class: 'action-bar sticky-m' },
            Button({ label: busy ? 'Compressing…' : 'Compress PDF', icon: 'shrink', variant: 'primary', size: 'lg', block: true, busy, onClick: run })),
        ]),
    )
  }

  const ho = takeHandoff()
  if (ho) load([Array.isArray(ho) ? ho[0] : ho])
  else paint()
  return root
}

/** Password field with show/hide toggle. */

  const input = TextInput(value, onInput, { type: 'password', placeholder, autocomplete: 'new-password' })
  const eye = h('button', { type: 'button', 'aria-label': 'Show password', onclick: () => {
    const show = input.type === 'password'

    eye.replaceChildren(icon(show ? 'eyeOff' : 'eye', 'icon-sm'))
  } }, icon('eye', 'icon-sm'))
  return h('div', { class: 'input-suffix' }, input, eye)
}

/** 0–4 rough strength score + label. */
function strength(p) {
  if (!p) return [0, '']
  let s = 0
  if (p.length >= 8) s++
  if (p.length >= 12) s++
  if (/[a-z]/.test(p) && /[A-Z]/.test(p)) s++
  if (/\d/.test(p) && /[^A-Za-z0-9]/.test(p)) s++
  if (p.length < 6) s = 0
  return [s, ['Very weak', 'Weak', 'Okay', 'Strong', 'Very strong'][s]]
}

function Protect() {
  const { root, render } = mount()
  let info = null
  let pwd = ''
  let pwd2 = ''
  let method = 'aes256'
  let requireOpen = true
  let owner = ''
  let advanced = false
  const perms = { print: true, copy: true, modify: true, annotate: true, fill: true }
  let busy = false
  let result = null

  const load = async ([f]) => {
    try {
      const i = await openPdf(f)
      if (!i) return
      info = i
      result = null
      paint()
    } catch (e) { toast(e.message, { type: 'error' }) }
  }

  const problems = () => {
    if (requireOpen && !pwd) return 'Enter a password'
    if (requireOpen && pwd !== pwd2) return 'Passwords don’t match'
    if (!requireOpen && !owner) return 'Set an owner password to lock the restrictions'
    if (method !== 'aes256' && /[^\x00-\xff]/.test(pwd + owner)) return 'Only AES-256 supports non-Latin characters in passwords'
    return null
  }

  const run = () => runTask((b) => { busy = b; paint() }, async () => {
    const err = problems()
    if (err) throw new Error(err)
    const out = await protectPdf(info.bytes, requireOpen ? pwd : '', { ownerPwd: owner || undefined, method, perms })
    result = { blob: new Blob([out], { type: 'application/pdf' }), name: `${stem(info.name)}-protected.pdf` }
  })

  function paint() {
    if (!info) { render(ToolHead('protect'), Dropzone({ onFiles: load, title: 'Drop a PDF to password-protect', tc: 'var(--c-secure)', icon: 'lock' })); return }
    if (result) {
      render(ToolHead('protect'), ResultCard({
        title: 'Your PDF is protected', blob: result.blob, filename: result.name, toolId: 'protect',
        extra: Callout(requireOpen ? 'Keep the password safe — without it the file can’t be opened, and nobody (including us) can recover it.' : 'Anyone can open it; the restrictions need the owner password to lift.', { type: 'warn' }),
        onAgain: () => { result = null; pwd = pwd2 = ''; paint() },
      }))
      return
    }
    const [sc, sl] = strength(pwd)
    const err = problems()
    const meter = h('div', { id: 'pw-meter', style: { display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '4px' } },
      [1, 2, 3, 4].map((k) => h('i', { style: { height: '4px', borderRadius: '2px', background: k <= sc ? (sc <= 1 ? 'var(--danger)' : sc === 2 ? 'var(--warn)' : 'var(--accent)') : 'var(--surface-3)' } })))
    const perm = (k, label) => Switch(label, perms[k], (v) => { perms[k] = v })
    render(
      ToolHead('protect'),
      Workspace(
        [
          FileChip({ name: info.name, size: info.size, meta: docMeta(info), onReplace: async () => { const [f] = await pickFiles(); if (f) load([f]) } }),
          h('div', { class: 'card card-pad stack' },
            Switch('Require a password to open', requireOpen, (v) => { requireOpen = v; paint() }, { hint: requireOpen ? 'Nobody can view the file without it' : 'Anyone can open it — only the restrictions below are locked' }),
            requireOpen ? [
              Field('Password', PwdInput(pwd, (v) => { pwd = v; updateBtn() }), { right: h('span', { class: 'hint', id: 'pw-label' }, sl) }),
              meter,
              Field('Confirm password', PwdInput(pwd2, (v) => { pwd2 = v; updateBtn() }, 'Type it again')),
            ] : null),
          h('div', { class: 'card card-pad stack' },
            h('div', { class: 'card-title' }, 'What can people do after opening it?'),
            perm('print', 'Print'), perm('copy', 'Copy text and images'), perm('modify', 'Edit the document'),
            perm('annotate', 'Add comments'), perm('fill', 'Fill in forms')),
        ],
        [
          h('div', { class: 'card stack' },
            Field('Encryption', Seg([['aes256', 'AES-256'], ['aes128', 'AES-128'], ['rc4', 'RC4']], method, (v) => { method = v; paint() }, { block: true }), { hint: method === 'aes256' ? 'recommended' : 'for very old readers' }),
            h('button', { type: 'button', class: 'btn btn-ghost btn-sm', style: { justifySelf: 'start', paddingLeft: '0' }, onclick: () => { advanced = !advanced; paint() } }, icon(advanced ? 'chevDown' : 'chevRight', 'icon-sm'), 'Separate owner password'),
            advanced || !requireOpen ? Field('Owner password', PwdInput(owner, (v) => { owner = v; updateBtn() }, 'Lifts the restrictions'), { hint: 'optional' }) : null,
            h('p', { class: 'muted small', style: { margin: 0 } }, 'Restrictions are honoured by standard PDF readers; the open password is real encryption.')),
          h('div', { class: 'action-bar sticky-m' },
            Button({ label: busy ? 'Encrypting…' : 'Protect PDF', icon: 'lock', variant: 'primary', size: 'lg', block: true, busy, disabled: !!err, onClick: run }),
            h('div', { class: 'summary', id: 'pw-err' }, err ?? '')),
        ]),
    )
  }
  function updateBtn() {
    const [sc, sl] = strength(pwd)
    const lab = root.querySelector('#pw-label')
    if (lab) lab.textContent = sl
    root.querySelectorAll('#pw-meter i').forEach((el, k) => {
      el.style.background = k + 1 <= sc ? (sc <= 1 ? 'var(--danger)' : sc === 2 ? 'var(--warn)' : 'var(--accent)') : 'var(--surface-3)'
    })
    const err = problems()
    const btn = root.querySelector('.action-bar .btn')
    if (btn && !busy) btn.disabled = !!err
    const s = root.querySelector('#pw-err')
    if (s) s.textContent = err ?? ''
  }

  const ho = takeHandoff()
  if (ho) load([Array.isArray(ho) ? ho[0] : ho])
  else paint()
  return root
}

function Unlock() {
  const { root, render } = mount()
  let file = null
  let bytes = null
  let pwd = ''
  let wrong = false
  let busy = false
  let result = null
  let notLocked = false

  const load = async ([f]) => {
    try {
      file = f
      bytes = await readBytes(f)
      result = null
      wrong = false
      pwd = ''
      notLocked = !(await isEncrypted(bytes).catch(() => false))
      if (!notLocked) {
        // restriction-only files open with an empty password: unlock right away
        try { await finish(await decryptPdf(bytes, '')); return } catch { /* needs a password */ }
      }
      paint()
    } catch { toast('That file isn’t a readable PDF', { type: 'error' }) }
  }
  const finish = async (out) => {
    const pages = pageLeaves(await parsePdf(out)).length
    result = { blob: new Blob([out], { type: 'application/pdf' }), name: `${stem(file.name)}-unlocked.pdf`, pages }
    paint()
  }
  const run = () => runTask((b) => { busy = b; paint() }, async () => {
    try { await finish(await decryptPdf(bytes, pwd)) } catch (e) {
      if (/wrong password/.test(e.message)) { wrong = true; paint(); return }
      throw e
    }
  })

  function paint() {
    if (!file) { render(ToolHead('unlock'), Dropzone({ onFiles: load, title: 'Drop a password-protected PDF', tc: 'var(--c-secure)', icon: 'unlock' })); return }
    if (result) { render(ToolHead('unlock'), ResultCard({ title: 'Password removed', blob: result.blob, filename: result.name, toolId: 'unlock', onAgain: () => { file = null; result = null; paint() } })); return }
    const input = PwdInput(pwd, (v) => { pwd = v }, 'Password')
    input.querySelector('input').addEventListener('keydown', (e) => { if (e.key === 'Enter') run() })
    render(
      ToolHead('unlock'),
      Workspace(
        [
          FileChip({ name: file.name, size: file.size, meta: notLocked ? 'not protected' : 'password-protected', onReplace: async () => { const [f] = await pickFiles(); if (f) load([f]) } }),
          notLocked
            ? Callout('This PDF isn’t password-protected — there’s nothing to unlock.', { type: 'ok' })
            : h('div', { class: 'card card-pad stack' },
                Field('Password', input),
                wrong ? Callout('That password didn’t work. Passwords are case-sensitive.', { type: 'danger' }) : null,
                h('p', { class: 'muted small', style: { margin: 0 } }, 'Works with the open password or the owner password. Supports RC4, AES-128 and AES-256 encryption.')),
        ],
        [h('div', { class: 'action-bar sticky-m' },
          Button({ label: busy ? 'Unlocking…' : 'Unlock PDF', icon: 'unlock', variant: 'primary', size: 'lg', block: true, busy, disabled: notLocked, onClick: run }))]),
    )
    if (!notLocked) requestAnimationFrame(() => input.querySelector('input')?.focus())
  }

  const ho = takeHandoff()
  if (ho) load([Array.isArray(ho) ? ho[0] : ho])
  else paint()
  return root
}

// ---- src/tools/metadata.js ----

const EDITABLE = [['Title', 'Title'], ['Author', 'Author'], ['Subject', 'Subject'], ['Keywords', 'Keywords']]
const LABELS = { Creator: 'Created with', Producer: 'PDF made by', CreationDate: 'Created', ModDate: 'Modified', Trapped: 'Trapped' }
const PDF_DATE = /D:(\d{4})(\d{2})?(\d{2})?(\d{2})?(\d{2})?(\d{2})?/

/** "D:20240102153000+01'00'" → readable date. */
function pdfDate(s) {
  const m = String(s).match(PDF_DATE)
  if (!m) return s
  const d = new Date(Date.UTC(+m[1], (+m[2] || 1) - 1, +m[3] || 1, +m[4] || 0, +m[5] || 0, +m[6] || 0))
  return Number.isNaN(+d) ? s : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })
}

function Metadata() {
  const { root, render } = mount()
  let info = null
  let meta = null
  let edits = {}
  let comments = 0
  let removeComments = true
  let busy = false
  let result = null

  const load = async ([f]) => {
    try {
      const i = await openPdf(f)
      if (!i) return
      info = i
      meta = await readMetadata(info.bytes)
      edits = Object.fromEntries(EDITABLE.map(([k]) => [k, meta.fields.find((x) => x.key === k)?.value ?? '']))
      comments = 0
      for (const leaf of info.leaves) {
        const an = deref(info.doc, get(leaf.dict, 'Annots'))
        if (!Array.isArray(an)) continue
        for (const r of an) {
          const a = deref(info.doc, r)
          const st = a instanceof Map ? get(a, 'Subtype')?.v : null
          if (st && st !== 'Link' && st !== 'Widget') comments++
        }
      }
      result = null
      paint()
    } catch (e) { toast(e.message, { type: 'error' }) }
  }

  const save = () => runTask((b) => { busy = b; paint() }, async () => {
    const out = await setMetadata(info.bytes, edits)
    result = { blob: new Blob([out], { type: 'application/pdf' }), name: `${stem(info.name)}.pdf`, title: 'Metadata updated' }
  })
  const wipe = () => runTask((b) => { busy = b; paint() }, async () => {
    const out = await scrubPdf(info.bytes, { removeComments })
    result = { blob: new Blob([out], { type: 'application/pdf' }), name: `${stem(info.name)}-clean.pdf`, title: 'All hidden data removed' }
  })

  function paint() {
    if (!info) { render(ToolHead('metadata'), Dropzone({ onFiles: load, title: 'Drop a PDF to inspect its hidden data', tc: 'var(--c-secure)', icon: 'eraser' })); return }
    if (result) {
      render(ToolHead('metadata'), ResultCard({ title: result.title, blob: result.blob, filename: result.name, toolId: 'metadata', onAgain: () => load([new File([result.blob], result.name, { type: 'application/pdf' })]) }))
      return
    }
    const other = meta.fields.filter((f) => !EDITABLE.some(([k]) => k === f.key))
    const rows = [
      ...other.map((f) => [LABELS[f.key] ?? f.key, /Date$/.test(f.key) ? pdfDate(f.value) : f.value]),
      meta.xmp ? ['XMP packet', 'Embedded metadata (often holds the same info, plus edit history)'] : null,
      meta.id ? ['Document ID', 'A unique fingerprint that can link copies of this file'] : null,
      comments ? ['Comments', `${comments} annotation${comments === 1 ? '' : 's'} — may include author names`] : null,
    ].filter(Boolean)
    render(
      ToolHead('metadata'),
      Workspace(
        [
          FileChip({ name: info.name, size: info.size, meta: docMeta(info), onReplace: async () => { const [f] = await pickFiles(); if (f) load([f]) } }),
          h('div', { class: 'card card-pad stack' },
            h('div', { class: 'card-title' }, 'Document properties'),
            EDITABLE.map(([k, label]) => Field(label, TextInput(edits[k], (v) => (edits[k] = v), { placeholder: `No ${label.toLowerCase()}` }))),
            Button({ label: busy ? 'Saving…' : 'Save properties', icon: 'save', busy, onClick: save })),
          h('div', { class: 'card card-pad stack-sm' },
            h('div', { class: 'card-title' }, 'Hidden data in this file'),
            rows.length
              ? h('table', { class: 'mtable' }, h('tbody', {}, rows.map(([k, v]) => h('tr', {}, h('td', { class: 'mkey' }, k), h('td', { class: 'mval leak' }, v)))))
              : Callout('Nothing hidden here — this file is already clean.', { type: 'ok' })),
        ],
        [
          h('div', { class: 'card stack' },
            h('div', { class: 'card-title' }, 'Remove everything'),
            h('p', { class: 'muted small', style: { margin: 0 } }, 'Strips properties, XMP, the document ID and app data. Pages, links, bookmarks and form fields are kept.'),
            Switch('Also remove comments', removeComments, (v) => (removeComments = v), { hint: 'Sticky notes, highlights and other markup' })),
          h('div', { class: 'action-bar sticky-m' },
            Button({ label: busy ? 'Cleaning…' : 'Remove all hidden data', icon: 'eraser', variant: 'primary', size: 'lg', block: true, busy, onClick: wipe })),
        ]),
    )
  }

  const ho = takeHandoff()
  if (ho) load([Array.isArray(ho) ? ho[0] : ho])
  else paint()
  return root
}

// ---- src/app.js ----

const VIEWS = {
  edit: Edit, merge: Merge, split: Split, organize: Organize, rotate: Rotate, crop: Crop, img2pdf: ImgToPdf,
  extract: ExtractImgs, pagenum: PageNums, metadata: Metadata, pdf2img: PdfToImg, pdftext: PdfToText,
  compress: Compress, watermark: Watermark, protect: Protect, unlock: Unlock,
}
// old links keep working
const ALIASES = { scrub: 'metadata', pdf2png: 'pdf2img' }

const app = document.getElementById('app')
let cleanup = null

// ---------- theme ----------
const THEME_KEY = 'pdfsuite-theme'
const storedTheme = () => { try { return localStorage.getItem(THEME_KEY) } catch { return null } }
function applyTheme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
  else delete document.documentElement.dataset.theme
}
applyTheme(storedTheme())
const isDark = () => (document.documentElement.dataset.theme ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark'
function toggleTheme() {
  const next = isDark() ? 'light' : 'dark'
  applyTheme(next)
  try { localStorage.setItem(THEME_KEY, next) } catch { /* private mode */ }
  render()
}

// ---------- routing ----------
function route() {
  const raw = location.hash.replace(/^#\/?/, '')
  const [path, q = ''] = raw.split('?')
  const params = Object.fromEntries(new URLSearchParams(q))
  return { id: ALIASES[path] ?? path, params }
}

function topbar() {
  return h('header', { class: 'topbar' },
    h('a', { class: 'brand', href: '#/' }, h('span', { class: 'brand-mark' }, icon('file', 'icon-sm')), h('span', {}, 'PDF', h('span', { class: 'accent' }, 'Suite'))),
    h('span', { class: 'topbar-tag' }, icon('shield', 'icon-sm'), 'Free · no uploads · no account'),
    h('span', { class: 'spacer' }),
    h('button', { class: 'btn btn-ghost btn-icon', 'data-tip': isDark() ? 'Light mode' : 'Dark mode', 'aria-label': 'Toggle theme', onclick: toggleTheme }, icon(isDark() ? 'sun' : 'moon')),
    h('a', { class: 'btn btn-ghost btn-icon', href: 'https://github.com/mayusi/pdfsuite', 'data-tip': 'Source code', 'aria-label': 'Source on GitHub', target: '_blank', rel: 'noopener' }, icon('github')))
}

function footer() {
  return h('footer', { class: 'footer' },
    h('p', {}, 'Smallpdf charges $12/month and iLovePDF $9/month to process ', h('em', {}, 'your'), ' documents on ', h('em', {}, 'their'), ' servers. PDFSuite does it on your own device for $0 — no uploads, no account, no limits. Every line is hand-written, dependency-free JavaScript you can read. MIT licensed.'),
    h('p', {}, 'Want it offline? ', h('a', { href: './pdfsuite.html', download: 'pdfsuite.html' }, 'Download the whole app as one HTML file'), ' — it works from a double-click, no internet needed.'))
}

function toolCard(t) {
  const href = `#/${t.route ?? t.id}`
  return h('a', { class: 'toolcard', href, style: { '--tc': catColor(t.cat) } },
    h('div', { class: 'ticon' }, icon(t.icon, 'icon-lg')),
    h('div', {}, h('h3', {}, t.name, t.isNew ? h('span', { class: 'new' }, 'New') : null), h('p', {}, t.desc)))
}

function home() {
  let q = ''
  const results = h('div')
  const paint = () => {
    const terms = q.toLowerCase().split(/\s+/).filter(Boolean)
    const match = (t) => terms.every((w) => `${t.name} ${t.desc} ${t.kw}`.toLowerCase().includes(w))
    if (terms.length) {
      const hits = CATALOG.filter(match)
      setKids(results, hits.length
        ? h('div', { class: 'cat' }, h('div', { class: 'tgrid' }, hits.map(toolCard)))
        : h('p', { class: 'empty-search' }, `No tool matches “${q}”.`))
    } else {
      setKids(results, CATS.map((c) => h('section', { class: 'cat' },
        h('h2', {}, h('i', { style: { background: c.color } }), c.name),
        h('div', { class: 'tgrid' }, CATALOG.filter((t) => t.cat === c.id).map(toolCard)))))
    }
  }
  const search = h('input', {
    class: 'input', type: 'search', placeholder: 'Search tools — try “sign” or “smaller”', 'aria-label': 'Search tools',
    oninput: (e) => { q = e.target.value; paint() },
    onkeydown: (e) => {
      if (e.key === 'Enter') { const first = results.querySelector('.toolcard'); if (first) location.hash = first.getAttribute('href') }
    },
  })
  paint()
  const onKey = (e) => {
    if (e.key === '/' && document.activeElement?.tagName !== 'INPUT') { e.preventDefault(); search.focus() }
  }
  document.addEventListener('keydown', onKey)
  cleanup = () => document.removeEventListener('keydown', onKey)
  return h('main', { class: 'content' },
    h('section', { class: 'hero' },
      h('h1', {}, 'Every PDF tool you need. ', h('span', { class: 'accent' }, 'Free, private, no uploads.')),
      h('p', {}, 'Edit, sign, merge, split, compress and convert PDFs right in your browser. Your files never leave your device.'),
      h('div', { class: 'search' }, icon('search'), search, h('span', { class: 'kbd' }, '/')),
      h('div', { class: 'trust' },
        h('span', {}, icon('shield', 'icon-sm'), 'Files stay on your device'),
        h('span', {}, icon('check', 'icon-sm'), 'No sign-up, no limits'),
        h('span', {}, icon('download', 'icon-sm'), 'Works offline'),
        h('span', {}, icon('sparkles', 'icon-sm'), 'Open source'))),
    results,
    h('section', { class: 'compare' },
      h('h2', {}, 'Why pay for this?'),
      h('table', { class: 'ctable' },
        h('thead', {}, h('tr', {}, h('th', {}, ''), h('th', {}, 'Smallpdf / iLovePDF'), h('th', {}, 'PDFSuite'))),
        h('tbody', {},
          [['Price', '$108–144 per year', '$0, forever'], ['Your files', 'Uploaded to their servers', 'Never leave your device'],
            ['Account', 'Required past the free tier', 'Never'], ['Limits', '2 tasks/day on free plans', 'Unlimited'],
            ['Offline', 'No', 'Yes — even as a single file']].map(([a, b, c]) => h('tr', {}, h('td', {}, a), h('td', {}, b), h('td', {}, c)))))),
    h('p', { class: 'muted small', style: { textAlign: 'center', marginTop: '28px' } }, 'Tip: drop a PDF anywhere on this page to pick a tool for it.'))
}

function notFound() {
  return h('main', { class: 'content' }, h('section', { class: 'hero' }, h('h1', {}, 'Page not found'), h('p', {}, h('a', { href: '#/' }, 'Back to all tools'))))
}

function render() {
  cleanup?.()
  cleanup = null
  const { id, params } = route()
  const view = VIEWS[id]
  if (id === 'edit') {
    // the editor is a full-screen workspace: no site chrome
    setKids(app, view(params))
  } else if (view) {
    setKids(app, h('div', { class: 'shell' }, topbar(), h('main', { class: 'content' }, view(params)), footer()))
  } else {
    setKids(app, h('div', { class: 'shell' }, topbar(), id ? notFound() : home(), footer()))
  }
  scrollTo(0, 0)
  const t = byId(Object.keys(VIEWS).includes(id) ? id : '')
  document.title = t ? `${t.name} — PDFSuite` : 'PDFSuite — free PDF tools, no uploads'
}

// ---------- global drag & drop ----------
// Dropping a file anywhere other than a drop zone must never navigate away
// (the browser would open the PDF and wipe the app). On the home page a
// dropped PDF opens a "what do you want to do?" picker.
addEventListener('dragover', (e) => e.preventDefault())
addEventListener('drop', (e) => {
  if (e.target.closest?.('.dz')) return
  e.preventDefault()
  const files = [...(e.dataTransfer?.files ?? [])]
  if (!files.length) return
  const { id } = route()
  if (id) { toast('Drop files onto the drop area', { type: 'info' }); return }
  const pdfs = filterAccept(files, 'application/pdf')
  const imgs = filterAccept(files, 'image/*')
  if (imgs.length && !pdfs.length) { handoff(imgs); location.hash = '#/img2pdf'; return }
  if (!pdfs.length) { toast('That isn’t a PDF', { type: 'error' }); return }
  if (pdfs.length > 1) { handoff(pdfs); location.hash = '#/merge'; return }
  const m = modal({
    title: `What do you want to do with “${pdfs[0].name}”?`, wide: true,
    body: h('div', { class: 'tgrid' }, CATALOG.filter((t) => t.id !== 'img2pdf').map((t) => {
      const card = toolCard(t)
      card.addEventListener('click', () => { handoff(pdfs[0]); m.close() })
      return card
    })),
  })
})

addEventListener('hashchange', render)
render()

// offline support: cache the app shell (skipped for file:// and dev servers that disable it)
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('./sw.js').catch(() => {})
}
