    pageDict.set('Parent', ref(pagesRef, 0))
    if (rotateDelta) {
      const cur = get(pageDict, 'Rotate')
      const base = typeof cur === 'number' ? cur : 0
      pageDict.set('Rotate', ((base + rotateDelta) % 360 + 360) % 360)
    }
    dst.set(num, pageDict)
  }
}

// catalog keys that survive whole-document rebuilds (remapped via refMap)
const CATALOG_EXTRAS = [
  'Outlines', 'Names', 'AcroForm', 'PageLabels', 'PageMode', 'OpenAction',
  'ViewerPreferences', 'MarkInfo', 'Lang', 'Metadata', 'StructTreeRoot', 'URI',
]

/**
 * Build the Pages node + catalog (with extras preserved when srcDoc/refMap
 * are given) → {catNum, trailer}. Kept separate from writeDoc so callers can
 * mutate copied objects (recompression) after extras are pulled in.
 */
function buildCatalog(dst, pagesRef, kids, srcDoc, refMap, { skip = [], noInfo = false } = {}) {
  dst.set(pagesRef, new Map([
    ['Type', name('Pages')],
    ['Kids', kids],
    ['Count', kids.length],
  ]))
  const catNum = dst.alloc()
  const catDict = new Map([
    ['Type', name('Catalog')],
    ['Pages', ref(pagesRef, 0)],
  ])
  const trailer = new Map()
  if (srcDoc && refMap) {
    const srcRoot = deref(srcDoc, get(srcDoc.trailer, 'Root'))
    const srcCat = isStream(srcRoot) ? srcRoot.dict : srcRoot
    for (const k of CATALOG_EXTRAS) {
      if (skip.includes(k)) continue
      const v = get(srcCat, k)
      if (v !== undefined) catDict.set(k, copyValue(v, srcDoc, dst, refMap))
    }
    const info = noInfo ? null : get(srcDoc.trailer, 'Info')
    if (info) {
      const iv = copyValue(info, srcDoc, dst, refMap)
      if (iv !== null && iv !== undefined) trailer.set('Info', iv)
    }
    const srcId = get(srcDoc.trailer, 'ID')
    if (Array.isArray(srcId)) {
      trailer.set('ID', srcId.map((x) =>
        x?.bytes ? { k: 'x', bytes: x.bytes.slice() } : copyValue(x, srcDoc, dst, refMap)))
    }
  }
  dst.set(catNum, catDict)
  return { catNum, trailer }
}

function finishDoc(dst, pagesRef, kids, srcDoc, refMap) {
  const { catNum, trailer } = buildCatalog(dst, pagesRef, kids, srcDoc, refMap)
  return writeDoc(dst, catNum, trailer)
}

/**
 * Assemble a new PDF from pages of one or more parsed docs.
 * ops: [{doc, page (1-based), rotation?} | {blank: [w, h]}] in output order.
 * opts.names: per-doc titles → merge bookmarks ("file.pdf" › its own outline).
 * Bookmarks and form fields survive for pages that make it into the output;
 * references to dropped pages become null instead of dragging the whole
 * page (and its content) into the file as an orphan.
 */
async function assemble(docs, ops, { names = null, extrasFrom = null } = {}) {
  const dst = newDoc()
  const pagesRef = dst.alloc()
  const kids = []
  const leavesOf = docs.map((d) => pageLeaves(d))
  const refMaps = docs.map(() => new Map())
  const firstNew = docs.map(() => new Map()) // per doc: src leaf key → first output ref
  const nums = ops.map(() => dst.alloc())
  ops.forEach((o, i) => {
    kids.push(ref(nums[i], 0))
    if (o.blank) return
    const leaves = leavesOf[o.doc]
    if (!leaves || o.page < 1 || o.page > leaves.length) throw new Error(`page ${o.page} out of range`)
    const leaf = leaves[o.page - 1]
    if (isRef(leaf.ref)) {
      const key = `${leaf.ref.n} ${leaf.ref.g}`
      if (!firstNew[o.doc].has(key)) {
        firstNew[o.doc].set(key, ref(nums[i], 0))
        refMaps[o.doc].set(key, ref(nums[i], 0))
      }
    }
  })
  // dropped pages: references resolve to null, never to an orphan copy
  docs.forEach((d, di) => {
    for (const leaf of leavesOf[di]) {
      if (!isRef(leaf.ref)) continue
      const key = `${leaf.ref.n} ${leaf.ref.g}`
      if (!refMaps[di].has(key)) refMaps[di].set(key, null)
    }
  })
  ops.forEach((o, i) => {
    if (o.blank) {
      dst.set(nums[i], new Map([
        ['Type', name('Page')], ['Parent', ref(pagesRef, 0)],
        ['MediaBox', [0, 0, o.blank[0] ?? 612, o.blank[1] ?? 792]],
        ['Resources', new Map()],
      ]))
      return
    }
    writePage(docs[o.doc], leavesOf[o.doc][o.page - 1], nums[i], o.rotation || 0, dst, pagesRef, refMaps[o.doc])
  })

  // bookmarks
  const tree = []
  docs.forEach((d, di) => {
    const mapped = remapOutline(readOutline(d), (key) => firstNew[di].get(key) ?? null)
    if (names) {
      const firstOp = ops.findIndex((o) => !o.blank && o.doc === di)
      if (firstOp >= 0) tree.push({ title: names[di] ?? `Document ${di + 1}`, target: ref(nums[firstOp], 0), view: [name('Fit')], open: false, children: mapped })
    } else tree.push(...mapped)
  })

  // interactive form fields whose widgets landed on output pages
  const fields = []
  const usedNames = new Set()
  let formDA = null, formDR = null, needApp = false
  docs.forEach((d, di) => {
    const root = deref(d, get(d.trailer, 'Root'))
    const form = deref(d, get(root, 'AcroForm'))
    if (!(form instanceof Map)) return
    const top = deref(d, get(form, 'Fields'))
    if (!Array.isArray(top)) return
    const included = new Set([...firstNew[di].keys()])
    const onPage = (fref, depth = 0) => {
      const f = deref(d, fref)
      if (!(f instanceof Map) || depth > 20) return false
      const p = get(f, 'P')
      if (isRef(p) && included.has(`${p.n} ${p.g}`)) return true
      const ks = deref(d, get(f, 'Kids'))
      return Array.isArray(ks) && ks.some((k) => onPage(k, depth + 1))
    }
    for (const fref of top) {
      if (!onPage(fref)) continue
      const copied = copyValue(fref, d, dst, refMaps[di])
      if (!copied) continue
      const fd = dst.objects.get(copied.n)
      const t = fd instanceof Map ? get(fd, 'T') : null
      const tn = t?.bytes ? dec(t.bytes) : null
      if (tn !== null) {
        let nm = tn
        let k = 2
        while (usedNames.has(nm)) nm = `${tn}_${k++}`
        usedNames.add(nm)
        if (nm !== tn) fd.set('T', { k: 's', bytes: enc(nm) })
      }
      fields.push(copied)
    }
    formDA ??= get(form, 'DA') ?? null
    if (!formDR && get(form, 'DR') !== undefined) formDR = copyValue(get(form, 'DR'), d, dst, refMaps[di])
    if (get(form, 'NeedAppearances') === true) needApp = true
  })

  dst.set(pagesRef, new Map([['Type', name('Pages')], ['Kids', kids], ['Count', kids.length]]))
  const catNum = dst.alloc()
  const cat = new Map([['Type', name('Catalog')], ['Pages', ref(pagesRef, 0)]])
  const ol = writeOutline(dst, tree)
  if (ol) { cat.set('Outlines', ol); cat.set('PageMode', name('UseOutlines')) }
  if (fields.length) {
    const af = new Map([['Fields', fields]])
    if (formDA) af.set('DA', formDA)
    if (formDR) af.set('DR', formDR)
    if (needApp) af.set('NeedAppearances', true)
    cat.set('AcroForm', af)
  }
  const trailer = new Map()
  if (extrasFrom !== null) { // single-source rebuild: keep doc-level niceties
    const d = docs[extrasFrom]
    const srcRoot = deref(d, get(d.trailer, 'Root'))
    for (const k of ['Lang', 'ViewerPreferences', 'MarkInfo', 'PageLabels']) {
      const v = get(srcRoot, k)
      if (v !== undefined && k !== 'PageLabels') cat.set(k, copyValue(v, d, dst, refMaps[extrasFrom]))
    }
    const info = get(d.trailer, 'Info')
    if (info) { const iv = copyValue(info, d, dst, refMaps[extrasFrom]); if (iv) trailer.set('Info', iv) }
  }
  dst.set(catNum, cat)
  return writeDoc(dst, catNum, trailer)
}

/** Write one source page into dst as object `num` (inherited attrs flattened). */
function writePage(srcDoc, leaf, num, rotateDelta, dst, pagesRef, refMap, strip = []) {
  const pageDict = new Map()
  for (const k of INHERITED) {
    const v = get(leaf.dict, k) ?? leaf.inh[k]
    if (v !== undefined) pageDict.set(k, copyValue(v, srcDoc, dst, refMap))
  }
  for (const [k, val] of leaf.dict) {
    if (k === 'Parent' || k === 'Metadata' || k === 'StructParents' || INHERITED.includes(k) || strip.includes(k)) continue
    pageDict.set(k, copyValue(val, srcDoc, dst, refMap))
  }
  // a copied Annots array may hold nulls where an entry pointed at a dropped page
  const an = pageDict.get('Annots')
  if (Array.isArray(an)) pageDict.set('Annots', an.filter((x) => x !== null && x !== undefined))
  pageDict.set('Type', name('Page'))
  pageDict.set('Parent', ref(pagesRef, 0))
  if (rotateDelta) {
    const cur = get(pageDict, 'Rotate')
    const base = typeof cur === 'number' ? cur : 0
    pageDict.set('Rotate', ((base + rotateDelta) % 360 + 360) % 360)
  }
  dst.set(num, pageDict)
}

/**
 * Merge several PDFs (Uint8Array[]) into one, in order.
 * opts.names → one bookmark per file holding that file's own bookmarks.
 * opts.pages → per-input array of 1-based pages to take (default: all).
 */
async function mergePdfs(inputs, { names = null, pages = null } = {}) {
  const docs = []
  for (const b of inputs) docs.push(await parsePdf(b))
  const ops = []
  docs.forEach((d, di) => {
    const n = pageLeaves(d).length
    const sel = pages?.[di] ?? Array.from({ length: n }, (_, i) => i + 1)
    for (const p of sel) ops.push(typeof p === 'object' ? { doc: di, ...p } : { doc: di, page: p })
  })
  return assemble(docs, ops, { names })
}

/**
 * Rebuild a PDF from an ordered op list (1-based source pages):
 * reorder by list order, delete by omission, rotate via `rotation` delta,
 * insert blank pages with {blank: [w, h]}, pull pages of extra PDFs with
 * {doc: k, page} where k indexes [main, ...opts.extra].
 */
async function organizePages(bytes, ops, { extra = [] } = {}) {
  const docs = [await parsePdf(bytes)]
  for (const b of extra) docs.push(await parsePdf(b))
  return assemble(docs, ops.map((o) => (o.blank ? o : { doc: o.doc ?? 0, page: o.page, rotation: o.rotation })), { extrasFrom: 0 })
}

/** Extract page ranges (1-based inclusive {from,to}) into a single PDF. */
async function extractPages(bytes, ranges) {
  const ops = ranges.flatMap(({ from, to }) =>
    Array.from({ length: to - from + 1 }, (_, i) => ({ page: from + i, rotation: 0 })),
  )
  return organizePages(bytes, ops)
}

/** One output PDF per range. */
async function splitPdf(bytes, ranges) {
  return Promise.all(ranges.map((r) => extractPages(bytes, [r])))
}

/** Parse "1-3, 5, 8-10" into {from,to}[] with bounds checking. */
function parseRanges(spec, maxPage) {
  const ranges = []
  for (const part of spec.split(',')) {
    const t = part.trim()
    if (!t) continue
    const m = /^(\d+)(?:\s*-\s*(\d+))?$/.exec(t)
    if (!m) throw new Error(`bad range "${t}"`)
    const from = parseInt(m[1], 10)
    const to = m[2] ? parseInt(m[2], 10) : from
    if (from < 1 || to > maxPage || from > to) throw new Error(`range "${t}" out of bounds`)
    ranges.push({ from, to })
  }
  if (!ranges.length) throw new Error('no ranges given')
  return ranges
}

// ---------- images → pdf ----------

/** Read dimensions/colorspace from a JPEG's SOF marker. */
function jpegInfo(buf) {
  if (buf[0] !== 0xff || buf[1] !== 0xd8) throw new Error('not a JPEG')
  let i = 2
  let orientation = 1
  let adobe = false
  while (i + 3 < buf.length) {
    if (buf[i] !== 0xff) { i++; continue }
    const marker = buf[i + 1]
    if (marker === 0xd8 || marker === 0x01 || (marker >= 0xd0 && marker <= 0xd7)) { i += 2; continue }
    const len = (buf[i + 2] << 8) | buf[i + 3]
    if (marker === 0xda) break // SOS — image data
    if (marker === 0xe1 && buf[i + 4] === 0x45 && buf[i + 5] === 0x78 && buf[i + 6] === 0x69 && buf[i + 7] === 0x66) {
      orientation = exifOrientation(buf, i + 10, i + 2 + len) || 1
    }
    if (marker === 0xee && buf[i + 4] === 0x41 && buf[i + 5] === 0x64 && buf[i + 6] === 0x6f && buf[i + 7] === 0x62 && buf[i + 8] === 0x65) adobe = true
    if ([0xc0, 0xc1, 0xc2, 0xc3, 0xc5, 0xc6, 0xc7, 0xc9, 0xca, 0xcb, 0xcd, 0xce, 0xcf].includes(marker)) {
      const height = (buf[i + 5] << 8) | buf[i + 6]
      const width = (buf[i + 7] << 8) | buf[i + 8]
      const comps = buf[i + 9]
      const cs = comps === 1 ? 'DeviceGray' : comps === 4 ? 'DeviceCMYK' : 'DeviceRGB'
      return { width, height, colorSpace: cs, orientation, adobe }
    }
    i += 2 + len
  }
  throw new Error('JPEG SOF marker not found')
}

/** EXIF IFD0 orientation tag (0x0112) from a TIFF block at [t, end). */
function exifOrientation(buf, t, end) {
  const le = buf[t] === 0x49
  const u16 = (o) => (le ? buf[o] | (buf[o + 1] << 8) : (buf[o] << 8) | buf[o + 1])
  const u32 = (o) => (le ? (buf[o] | (buf[o + 1] << 8) | (buf[o + 2] << 16) | (buf[o + 3] << 24)) >>> 0 : ((buf[o] << 24) | (buf[o + 1] << 16) | (buf[o + 2] << 8) | buf[o + 3]) >>> 0)
  const ifd = t + u32(t + 4)
  if (ifd + 2 > end) return 1
  const n = u16(ifd)
  for (let k = 0; k < n; k++) {
    const e = ifd + 2 + k * 12
    if (e + 12 > end) break
    if (u16(e) === 0x0112) return u16(e + 8)
  }
  return 1
}

/** EXIF orientation → clockwise rotation in degrees (mirrored variants approximated). */
const exifRotation = (o) => ({ 3: 180, 4: 180, 5: 90, 6: 90, 7: 270, 8: 270 })[o] ?? 0

const PAGE_SIZES = { a4: [595.28, 841.89], letter: [612, 792], legal: [612, 1008], a3: [841.89, 1190.55], a5: [419.53, 595.28] }

/**
 * Images → PDF, one image per page.
 * images: [{data|jpeg: Uint8Array (JPEG)} | {rgba, width, height}] + optional rotate (deg, clockwise).
 *   JPEGs are embedded losslessly; their EXIF orientation is honoured.
 *   RGBA images keep transparency (soft mask).
 * opts: size 'fit' (page = image at `dpi`) | 'a4' | 'letter' | 'legal' | 'a3' | 'a5'
 *       ('native' = legacy 1px→1pt), orient 'auto'|'portrait'|'landscape', margin (pt),
 *       fit 'contain'|'cover'|'stretch', dpi (default 96).
 */
async function imagesToPdf(images, opts = {}) {
  const { size = 'fit', orient = 'auto', margin = 0, fit = 'contain', dpi = 96 } = opts
  const dst = newDoc()
  const pagesRef = dst.alloc()
  const kids = []
  for (const img of images) {
    let width, height, imgDict, imgData, rot = ((img.rotate ?? 0) % 360 + 360) % 360
    const jpeg = img.jpeg ?? img.data
    if (jpeg) {
      const info = jpegInfo(jpeg)
      width = info.width
      height = info.height
      rot = (rot + exifRotation(info.orientation)) % 360
      imgDict = new Map([
        ['Type', name('XObject')], ['Subtype', name('Image')], ['Width', width], ['Height', height],
        ['ColorSpace', name(info.colorSpace)], ['BitsPerComponent', 8], ['Filter', name('DCTDecode')],
      ])
      if (info.colorSpace === 'DeviceCMYK' && info.adobe) imgDict.set('Decode', [1, 0, 1, 0, 1, 0, 1, 0])
      imgData = jpeg
    } else {
      width = img.width
      height = img.height
      const n = width * height
      const rgb = new Uint8Array(n * 3)
      const alpha = new Uint8Array(n)
      let hasAlpha = false
      for (let k = 0, j = 0; k < n; k++, j += 4) {
        rgb[k * 3] = img.rgba[j]; rgb[k * 3 + 1] = img.rgba[j + 1]; rgb[k * 3 + 2] = img.rgba[j + 2]
        alpha[k] = img.rgba[j + 3]
        if (img.rgba[j + 3] !== 255) hasAlpha = true
      }
      imgDict = new Map([
        ['Type', name('XObject')], ['Subtype', name('Image')], ['Width', width], ['Height', height],
        ['ColorSpace', name('DeviceRGB')], ['BitsPerComponent', 8], ['Filter', name('FlateDecode')],
      ])
      if (hasAlpha) {
        const sm = dst.alloc()
        dst.set(sm, stream(new Map([
          ['Type', name('XObject')], ['Subtype', name('Image')], ['Width', width], ['Height', height],
          ['ColorSpace', name('DeviceGray')], ['BitsPerComponent', 8], ['Filter', name('FlateDecode')],
        ]), await deflate(alpha)))
        imgDict.set('SMask', ref(sm, 0))
      }
      imgData = await deflate(rgb)
    }
    const imgNum = dst.alloc()
    dst.set(imgNum, stream(imgDict, imgData))
    // displayed (post-rotation) image size
    const swap = rot % 180 !== 0
    const vw = swap ? height : width, vh = swap ? width : height
    let pw, ph
    if (size === 'native' || size === 'fit') {
      const k = size === 'native' ? 1 : 72 / (dpi || 96)
      pw = vw * k + margin * 2
      ph = vh * k + margin * 2
    } else {
      const [bw, bh] = PAGE_SIZES[size] ?? PAGE_SIZES.a4
      const landscape = orient === 'landscape' || (orient === 'auto' && vw > vh)
      ;[pw, ph] = landscape ? [Math.max(bw, bh), Math.min(bw, bh)] : [Math.min(bw, bh), Math.max(bw, bh)]
    }
    const cw = Math.max(1, pw - margin * 2), ch = Math.max(1, ph - margin * 2)
    let dw, dh
    if (fit === 'stretch') { dw = cw; dh = ch }
    else { const sc = fit === 'cover' ? Math.max(cw / vw, ch / vh) : Math.min(cw / vw, ch / vh); dw = vw * sc; dh = vh * sc }
    const x = (pw - dw) / 2, y = (ph - dh) / 2
    // unit square → displayed box, rotated clockwise by `rot`
    const f = (v) => +v.toFixed(3)
    const m = rot === 90 ? [0, -dh, dw, 0, x, y + dh]
      : rot === 180 ? [-dw, 0, 0, -dh, x + dw, y + dh]
      : rot === 270 ? [0, dh, -dw, 0, x + dw, y]
      : [dw, 0, 0, dh, x, y]
    const clip = fit === 'cover' ? `${f(margin)} ${f(margin)} ${f(cw)} ${f(ch)} re W n ` : ''
    const csNum = dst.alloc()
    dst.set(csNum, stream(new Map(), new TextEncoder().encode(`q ${clip}${m.map(f).join(' ')} cm /Im0 Do Q`)))
    const pageNum = dst.alloc()
    dst.set(pageNum, new Map([
      ['Type', name('Page')], ['Parent', ref(pagesRef, 0)], ['MediaBox', [0, 0, f(pw), f(ph)]],
      ['Resources', new Map([['XObject', new Map([['Im0', ref(imgNum, 0)]])]])],
      ['Contents', ref(csNum, 0)],
    ]))
    kids.push(ref(pageNum, 0))
  }
  return finishDoc(dst, pagesRef, kids)
}

const KEEP_ANNOTS = new Set(['Link', 'Widget'])
const PERSONAL_ANNOT_KEYS = ['T', 'M', 'NM', 'CreationDate', 'RC', 'Subj']

/**
 * Privacy scrub: drops /Info, XMP /Metadata (catalog + pages), doc IDs and
 * /PieceInfo app data; anonymises what's left of annotations. Bookmarks,
 * links and form fields survive — they're content, not tracking data.
 * opts.removeComments (default true): also drop comment/markup annotations
 * (sticky notes, highlights, ink, stamps…) which carry author names + text.
 */
async function scrubPdf(bytes, { removeComments = true } = {}) {
  const src = await parsePdf(bytes)
  const leaves = pageLeaves(src)
  // filter + anonymise annotations IN THE SOURCE before copying: anything
  // copied and dropped afterwards would still be written as an orphan object
  // (and its comment text would survive in the file)
  for (const leaf of leaves) {
    const an = deref(src, get(leaf.dict, 'Annots'))
    if (!Array.isArray(an)) continue
    const keep = []
    for (const r of an) {
      const ad = deref(src, r)
      if (!(ad instanceof Map)) continue
      const sub = get(ad, 'Subtype')?.v
      if (removeComments && !KEEP_ANNOTS.has(sub)) continue
      // on widgets /T is the FIELD NAME, not an author — keep it
      for (const k of PERSONAL_ANNOT_KEYS) if (!(sub === 'Widget' && (k === 'T' || k === 'RC'))) ad.delete(k)
      ad.delete('Popup')
      keep.push(r)
    }
    if (keep.length) leaf.dict.set('Annots', keep)
    else leaf.dict.delete('Annots')
  }
  const dst = newDoc()
  const pagesRef = dst.alloc()
  const kids = []
  const refMap = new Map()
  appendPages(src, leaves.map((leaf) => ({ leaf, rotateDelta: 0 })), dst, pagesRef, kids, ['PieceInfo', 'LastModified'], refMap)
  const { catNum, trailer } = buildCatalog(dst, pagesRef, kids, src, refMap, { skip: ['Metadata'], noInfo: true })
  trailer.delete('ID')
  return writeDoc(dst, catNum, trailer)
}

// ---------- text extraction ----------

/** All pages → ['page 1 text', ...]. */
async function extractText(doc) {
  const leaves = pageLeaves(doc)
  const out = []
  for (const leaf of leaves) out.push(await pageText(doc, leaf))
  return out
}

// ---------- compress ----------

/**
 * Rebuild keeping only reachable objects, re-deflate every stream that gets
 * smaller, merge byte-identical streams (fonts/images repeated across merged
 * files), optionally strip metadata + page thumbnails, and — through the
 * browser hook — re-encode/downscale photos.
 * opts.reimage(decoded, {w, h}) → Promise<Uint8Array JPEG | null>
 * opts.stripMeta: drop /Info + XMP; opts.stripThumbs (default true): drop page /Thumb images.
 * Returns { bytes, before, after, images: {total, recoded} }.
 */
async function compressPdf(bytes, { reimage, stripMeta = false, stripThumbs = true } = {}) {
  const src = await parsePdf(bytes)
  const leaves = pageLeaves(src)
  if (stripThumbs) for (const leaf of leaves) { leaf.dict.delete('Thumb'); leaf.dict.delete('PieceInfo') }
  const dst = newDoc()
  const pagesRef = dst.alloc()
  const kids = []
  const refMap = new Map()
  appendPages(src, leaves.map((leaf) => ({ leaf, rotateDelta: 0 })), dst, pagesRef, kids, [], refMap)
  const { catNum, trailer } = buildCatalog(dst, pagesRef, kids, src, refMap, stripMeta ? { skip: ['Metadata'], noInfo: true } : {})
  const dstDoc = { objects: new Map(), trailer: new Map() }
  for (const [num, v] of dst.objects) dstDoc.objects.set(`${num} 0`, { v })
  // soft masks are alpha channels — never JPEG them (halos), and skip stencils
  const smaskNums = new Set()
  for (const v of dst.objects.values()) {
    if (isStream(v)) { const sm = get(v.dict, 'SMask'); if (isRef(sm)) smaskNums.add(sm.n) }
  }
  const stats = { total: 0, recoded: 0 }
  for (const [num, v] of dst.objects) {
    if (!isStream(v)) continue
    const isImage = get(v.dict, 'Subtype')?.v === 'Image'
    if (isImage && !smaskNums.has(num) && get(v.dict, 'ImageMask') !== true) {
      stats.total++
      const bpc = get(v.dict, 'BitsPerComponent') ?? 8
      if (reimage && bpc >= 8) {
        const dec = await decodeImageStream(dstDoc, v).catch(() => null)
        const repl = dec ? await reimage(dec, { w: get(v.dict, 'Width'), h: get(v.dict, 'Height') }).catch(() => null) : null
        if (repl && repl.length < v.data.length * 0.95) {
          const info = jpegInfo(repl)
          v.data = repl
          v.dict.set('Filter', name('DCTDecode'))
          v.dict.set('ColorSpace', name(info.colorSpace))
          v.dict.set('BitsPerComponent', 8)
          v.dict.set('Width', info.width) // the hook may have downscaled (any SMask still maps 1:1 onto the unit square)
          v.dict.set('Height', info.height)
          for (const k of ['DecodeParms', 'DP', 'Decode', 'Mask']) v.dict.delete(k)
          stats.recoded++
          continue
        }
      }
    }
    // streamData undoes the whole chain incl. predictors, so the re-deflated
    // bytes are raw — DecodeParms no longer applies and must go with the old filters.
    const raw = await streamData(v)
    if (raw === null) continue
    const packed = await deflate(raw)
    if (packed.length < v.data.length) {
      v.data = packed
      v.dict.set('Filter', name('FlateDecode'))
      v.dict.delete('DecodeParms')
      v.dict.delete('DP')
    }
  }
  dedupeStreams(dst)
  const out = writeDoc(dst, catNum, trailer)
  return { bytes: out, before: bytes.length, after: out.length, images: stats }
}

/** Merge byte-identical stream objects and repoint every reference to the survivor. */
function dedupeStreams(dst) {
  const seen = new Map() // key → num
  const remap = new Map() // dup num → keeper num
  for (const [num, v] of dst.objects) {
    if (!isStream(v) || v.data.length < 64) continue
    const dictKey = [...v.dict].filter(([k]) => k !== 'Length').map(([k, x]) => `${k}=${JSON.stringify(x, (_, y) => (y instanceof Uint8Array ? [...y] : y instanceof Map ? [...y] : y))}`).sort().join('|')
    const key = `${crc32(v.data)}:${v.data.length}:${dictKey}`
    const prev = seen.get(key)
    if (prev !== undefined && bytesEqual(dst.objects.get(prev).data, v.data)) remap.set(num, prev)
    else seen.set(key, num)
  }
  if (!remap.size) return
  const fix = (x) => {
    if (isRef(x)) return remap.has(x.n) ? ref(remap.get(x.n), 0) : x
    if (x instanceof Map) { for (const [k, y] of x) x.set(k, fix(y)); return x }
    if (Array.isArray(x)) { for (let i = 0; i < x.length; i++) x[i] = fix(x[i]); return x }
    if (isStream(x)) { fix(x.dict); return x }
    return x
  }
  for (const v of dst.objects.values()) fix(v)
  for (const n of remap.keys()) dst.objects.delete(n)
}
const bytesEqual = (a, b) => { if (a.length !== b.length) return false; for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true }

/**
 * Best-effort visual for a page when rendering fails: {img: {data, mime} | null, text}.
 * img = the largest painted image XObject; text = the page's first characters.
 */
async function pagePreview(doc, leaf, maxLen = 200) {
  const { ops } = await collectDrawOps(doc, leaf, { annots: false }).catch(() => ({ ops: [] }))
  const text = textFromOps(ops).replace(/\s+/g, ' ').trim().slice(0, maxLen)
  let best = null
  for (const o of ops) if (o.t === 'img' && o.ref && (!best || o.w * o.h > best.w * best.h)) best = o
  return { img: best ? await decodeImageStream(doc, best.ref).catch(() => null) : null, text }
}

// ---------- extract images ----------

/**
 * Decode one image XObject stream → {data, mime, ext} or null when unsupported.
 * JPEG/JPEG2000 payloads are passed through untouched (lossless extraction);
 * everything else is decoded through its colour space to PNG (alpha kept).
 */
async function decodeImageStream(doc, v) {
  const im = await decodeImage(doc, v)
  if (!im) return null
  if (im.kind === 'jpeg') return { data: im.data, mime: 'image/jpeg', ext: '.jpg', smask: im.smask, cmyk: im.cmyk, invert: im.invert }
  if (im.kind === 'jpx') return { data: im.data, mime: 'image/jp2', ext: '.jp2' }
  return { data: rgbaToPng(im.w, im.h, im.rgba), mime: 'image/png', ext: '.png', rgba: im.rgba, w: im.w, h: im.h }
}

/** RGBA → smallest faithful PNG (drops alpha / colour when unused). */
function rgbaToPng(w, h, rgba) {
  let opaque = true, gray = true
  for (let i = 0; i < rgba.length; i += 4) {
    if (rgba[i + 3] !== 255) opaque = false
    if (rgba[i] !== rgba[i + 1] || rgba[i] !== rgba[i + 2]) gray = false
    if (!opaque && !gray) break
  }
  const ch = (gray ? 1 : 3) + (opaque ? 0 : 1)
  const px = new Uint8Array(w * h * ch)
  for (let i = 0, o = 0; i < rgba.length; i += 4) {
    px[o++] = rgba[i]
    if (!gray) { px[o++] = rgba[i + 1]; px[o++] = rgba[i + 2] }
    if (!opaque) px[o++] = rgba[i + 3]
  }
  return pngEncode(w, h, px, ch)
}

/**
 * Pull embedded images out of a PDF.
 * Returns { images: [{name, data, w, h, mime}], skipped }.
 */
async function extractImages(bytes) {
  const doc = await parsePdf(bytes)
  const images = []
  let skipped = 0
  let i = 0
  for (const { v } of doc.objects.values()) {
    if (!isStream(v) || get(v.dict, 'Subtype')?.v !== 'Image') continue
    i++
    const w = get(v.dict, 'Width') ?? 0
    const h = get(v.dict, 'Height') ?? 0
    const dec = await decodeImageStream(doc, v).catch(() => null)
    if (dec) images.push({ name: `image-${i}-${w}x${h}${dec.ext}`, data: dec.data, w, h, mime: dec.mime, hash: crc32(dec.data) >>> 0 })
    else skipped++
  }
  return { images, skipped }
}

// ---- src/pdf/security.js ----
// PDF Standard Security Handler — unlock RC4-40/128, AES-128 (R4) and
// AES-256 (R5/R6); protect with AES-256 (default), AES-128 or RC4-128,
// including owner password + permission flags.

const PAD32 = new Uint8Array([
  0x28, 0xbf, 0x4e, 0x5e, 0x4e, 0x75, 0x8a, 0x41, 0x64, 0x00, 0x4e, 0x56, 0xff, 0xfa, 0x01, 0x08,
  0x2e, 0x2e, 0x00, 0xb6, 0xd0, 0x68, 0x3e, 0x80, 0x2f, 0x0c, 0xa9, 0xfe, 0x64, 0x53, 0x69, 0x7a,
])

/** R2–R4 passwords are Latin-1 byte strings, padded/truncated to 32 bytes. */
const pwdPad = (s) => {
  for (const c of s) {
    if (c.codePointAt(0) > 0xff) throw new Error('this encryption mode needs a Latin-1 password — use AES-256 for other characters')
  }
  const b = Uint8Array.from(s, (c) => c.charCodeAt(0) & 0xff)
  const out = new Uint8Array(32)
  out.set(b.subarray(0, 32))
  if (b.length < 32) out.set(PAD32.subarray(0, 32 - b.length), b.length)
  return out
}
/** R5/R6 passwords are UTF-8, max 127 bytes. */
const pwdUtf8 = (s) => enc(s.normalize('NFKC')).slice(0, 127)

const xorKey = (key, i) => Uint8Array.from(key, (b) => b ^ i)
const le32 = (n) => { const b = new Uint8Array(4); new DataView(b.buffer).setInt32(0, n, true); return b }
const bytesEq = (a, b, n = a.length) => { for (let i = 0; i < n; i++) if (a[i] !== b[i]) return false; return true }

function randomBytes(n) {
  const out = new Uint8Array(n)
  if (globalThis.crypto?.getRandomValues) return globalThis.crypto.getRandomValues(out)
  let seed = md5(enc(`${Date.now()}:${Math.random()}:${performance.now?.()}`))
  for (let i = 0; i < n; i++) { if (i % 16 === 0 && i) seed = md5(seed); out[i] = seed[i % 16] ^ ((Math.random() * 256) | 0) }
  return out
}

// ---------- R2–R4 (MD5/RC4 key derivation) ----------

function computeO(ownerPad, userPad, keyLen, R) {
  let d = md5(ownerPad)
  if (R >= 3) for (let i = 0; i < 50; i++) d = md5(d.subarray(0, keyLen))
  const ok = d.subarray(0, keyLen)
  if (R === 2) return rc4(ok, userPad)
  let data = userPad
  for (let i = 0; i < 20; i++) data = rc4(xorKey(ok, i), data)
  return data
}

function computeFileKey(userPad, O, P, id0, keyLen, R, encryptMeta = true) {
  const parts = [userPad, O.subarray(0, 32), le32(P), id0]
  if (R >= 4 && !encryptMeta) parts.push(new Uint8Array([255, 255, 255, 255]))
  let d = md5(concat(parts))
  if (R >= 3) for (let i = 0; i < 50; i++) d = md5(d.subarray(0, keyLen))
  return d.slice(0, keyLen)
}

function computeU(fileKey, id0, R) {
  if (R === 2) return rc4(fileKey, PAD32)
  let data = md5(concat([PAD32, id0]))
  for (let i = 0; i < 20; i++) data = rc4(xorKey(fileKey, i), data)
  const out = new Uint8Array(32)
  out.set(data)
  out.set(md5(fileKey), 16) // arbitrary padding (spec) — deterministic here
  return out
}

// ---------- R5/R6 (SHA-2 / AES-256) ----------

/** Algorithm 2.B (R6) — or plain SHA-256 for R5. */
function hash2B(pwd, salt, udata, R) {
  let K = sha256(concat([pwd, salt, udata]))
  if (R === 5) return K
  for (let round = 0; ; round++) {
    const unit = concat([pwd, K, udata])
    const K1 = new Uint8Array(unit.length * 64)
    for (let i = 0; i < 64; i++) K1.set(unit, i * unit.length)
    const E = aesCbcEncrypt(K.subarray(0, 16), K.subarray(16, 32), K1, false)
    let sum = 0
    for (let i = 0; i < 16; i++) sum += E[i]
    const m = sum % 3
    K = m === 0 ? sha256(E) : m === 1 ? sha384(E) : sha512(E)
    if (round >= 63 && E[E.length - 1] <= round + 1 - 32) break // round numbers count from 1 (qpdf, Acrobat)
  }
  return K.slice(0, 32)
}

const ZERO_IV = new Uint8Array(16)

// ---------- encrypt-dict analysis ----------

/**
 * Authenticate a password against a Standard-handler encrypt dict.
 * Returns {fileKey, stm, str, R, V, P, encryptMeta, owner} where stm/str are
 * 'RC4' | 'AESV2' | 'AESV3' | 'None'. Throws 'wrong password' / 'unsupported …'.
 */
function authenticate(doc, encDict, pwd) {
  const dd = (v) => (isRef(v) ? deref(doc, v) : v)
  const filt = dd(get(encDict, 'Filter'))
  if (!isName(filt) || filt.v !== 'Standard') throw new Error('unsupported security handler (certificate-encrypted PDFs need the original certificate)')
  const V = dd(get(encDict, 'V')) ?? 0
  const R = dd(get(encDict, 'R')) ?? 2
  const P = dd(get(encDict, 'P')) ?? -4
  const encryptMeta = dd(get(encDict, 'EncryptMetadata')) !== false
  const O = dd(get(encDict, 'O'))?.bytes
  const U = dd(get(encDict, 'U'))?.bytes
  if (!O || !U) throw new Error('unsupported encryption (missing O/U)')

  // crypt filter selection
  let stm = 'RC4', str = 'RC4'
  if (V >= 4) {
    const cf = dd(get(encDict, 'CF'))
    const method = (sel) => {
      const sn = dd(get(encDict, sel))
      const nm = isName(sn) ? sn.v : 'Identity'
      if (nm === 'Identity') return 'None'
      const f = cf instanceof Map ? dd(cf.get(nm)) : null
      const cfm = f instanceof Map ? dd(get(f, 'CFM')) : null
      const m = isName(cfm) ? cfm.v : 'None'
      if (m === 'V2') return 'RC4'
      if (m === 'AESV2' || m === 'AESV3' || m === 'None') return m
      throw new Error(`unsupported crypt filter ${m}`)
    }
    stm = method('StmF')
    str = method('StrF')
  } else if (V !== 1 && V !== 2) {
    throw new Error(`unsupported encryption version V=${V}`)
  }

  if (R >= 5) {
    const OE = dd(get(encDict, 'OE'))?.bytes
    const UE = dd(get(encDict, 'UE'))?.bytes
    if (!OE || !UE) throw new Error('unsupported encryption (missing OE/UE)')
    const pw = pwdUtf8(pwd)
    const U48 = U.subarray(0, 48)
    if (bytesEq(hash2B(pw, U.subarray(32, 40), new Uint8Array(0), R), U, 32)) {
      const ik = hash2B(pw, U.subarray(40, 48), new Uint8Array(0), R)
      return { fileKey: aesCbcDecrypt(ik, ZERO_IV, UE, false), stm, str, R, V, P, encryptMeta, owner: false }
    }
    if (bytesEq(hash2B(pw, O.subarray(32, 40), U48, R), O, 32)) {
      const ik = hash2B(pw, O.subarray(40, 48), U48, R)
      return { fileKey: aesCbcDecrypt(ik, ZERO_IV, OE, false), stm, str, R, V, P, encryptMeta, owner: true }
    }
    throw new Error('wrong password')
  }

  const id0 = doc.trailer && get(doc.trailer, 'ID')?.[0]?.bytes
  if (!id0) throw new Error('unsupported encryption (missing document ID)')
  const keyLen = V === 1 ? 5 : Math.min(16, ((dd(get(encDict, 'Length')) ?? 40) / 8) | 0) || 5
  const uOk = (key) => {
    const u = computeU(key, id0, R)
    return bytesEq(u, U, R === 2 ? 32 : 16)
  }
  let fileKey = computeFileKey(pwdPad(pwd), O, P, id0, keyLen, R, encryptMeta)
  if (uOk(fileKey)) return { fileKey, stm, str, R, V, P, encryptMeta, owner: false }
  // owner password → recover the user pad from O
  let d = md5(pwdPad(pwd))
  if (R >= 3) for (let i = 0; i < 50; i++) d = md5(d.subarray(0, keyLen))
  const ok = d.subarray(0, keyLen)
  let userPad = O.subarray(0, 32)
  if (R === 2) userPad = rc4(ok, userPad)
  else for (let i = 19; i >= 0; i--) userPad = rc4(xorKey(ok, i), userPad)
  fileKey = computeFileKey(userPad, O, P, id0, keyLen, R, encryptMeta)
  if (uOk(fileKey)) return { fileKey, stm, str, R, V, P, encryptMeta, owner: true }
  throw new Error('wrong password')
}

/** Per-object key for RC4 / AESV2; AESV3 uses the file key directly. */
function objectKey(fileKey, n, g, method) {
  if (method === 'AESV3') return fileKey
  const parts = [fileKey, new Uint8Array([n & 0xff, (n >> 8) & 0xff, (n >> 16) & 0xff, g & 0xff, (g >> 8) & 0xff])]
  if (method === 'AESV2') parts.push(new Uint8Array([0x73, 0x41, 0x6c, 0x54])) // "sAlT"
  return md5(concat(parts)).subarray(0, Math.min(fileKey.length + 5, 16))
}

function cryptBytes(method, key, bytes, encrypt) {
  if (method === 'None') return bytes
  if (method === 'RC4') return rc4(key, bytes)
  if (encrypt) {
    const iv = randomBytes(16)
    return concat([iv, aesCbcEncrypt(key, iv, bytes, true)])
  }
  if (bytes.length < 16) return new Uint8Array(0)
  return aesCbcDecrypt(key, bytes.subarray(0, 16), bytes.subarray(16), true)
}

/** Apply the cipher to every string and stream inside one object value. */
function cryptObject(v, n, g, sec, encrypt) {
  const sk = objectKey(sec.fileKey, n, g, sec.str)
  const tk = objectKey(sec.fileKey, n, g, sec.stm)
  const walk = (x) => {
    if (x instanceof Map) { for (const y of x.values()) walk(y) }
    else if (Array.isArray(x)) { for (const y of x) walk(y) }
    else if (x?.k === 's' || x?.k === 'x') x.bytes = cryptBytes(sec.str, sk, x.bytes, encrypt)
  }
  if (isStream(v)) {
    walk(v.dict)
    const isMeta = typeIs(v.dict, 'Metadata')
    if (!(isMeta && !sec.encryptMeta)) {
      v.data = cryptBytes(sec.stm, tk, v.data, encrypt)
      if (!encrypt) v.dict.set('Length', v.data.length)
    }
  } else walk(v)
}

/** Deep-clone one value, remapping refs through refMap. */
function cloneVal(v, refMap) {
  if (isRef(v)) return refMap.get(`${v.n} ${v.g}`) ?? null
  if (v instanceof Map) {
    const m = new Map()
    for (const [k, x] of v) m.set(k, cloneVal(x, refMap))
    return m
  }
  if (Array.isArray(v)) return v.map((x) => cloneVal(x, refMap))
  if (isStream(v)) return stream(cloneVal(v.dict, refMap), v.data.slice())
  if (v?.k === 's' || v?.k === 'x') return { ...v, bytes: v.bytes.slice() }
  return v
}

/** Copy every object (minus skip keys and xref streams) into dst; returns maps + root number. */
function cloneDoc(src, dst, skip = new Set()) {
  const numOf = new Map()
  const refMap = new Map()
  for (const [key, ent] of src.objects) {
    if (skip.has(key)) continue
    const dict = isStream(ent.v) ? ent.v.dict : ent.v
    if (typeIs(dict, 'XRef')) { skip.add(key); continue } // writer emits its own xref
    numOf.set(key, dst.alloc())
  }
  for (const [k, num] of numOf) refMap.set(k, ref(num, 0))
  for (const [key, ent] of src.objects) {
    if (skip.has(key)) continue
    dst.set(numOf.get(key), cloneVal(ent.v, refMap))
  }
  const rootRef = get(src.trailer, 'Root')
  return { numOf, refMap, rootNum: numOf.get(`${rootRef.n} ${rootRef.g}`) }
}

const mapInfo = (src, numOf, refMap, trailer) => {
  const infoRef = get(src.trailer, 'Info')
  if (isRef(infoRef)) {
    const mapped = numOf.get(`${infoRef.n} ${infoRef.g}`)
    if (mapped) trailer.set('Info', ref(mapped, 0))
  } else if (infoRef instanceof Map) trailer.set('Info', cloneVal(infoRef, refMap))
}

/** Is this file encrypted? (cheap check for the UI) */
async function isEncrypted(bytes) {
  const doc = await parsePdf(bytes, [], true)
  return !!get(doc.trailer, 'Encrypt')
}

/**
 * Unlock a protected PDF with the user OR owner password → unprotected bytes.
 * Throws 'wrong password' when neither authenticates.
 */
async function decryptPdf(bytes, pwd) {
  const src = await parsePdf(bytes, [], true)
  const encRef = get(src.trailer, 'Encrypt')
  if (!encRef) return bytes
  const encDict = isRef(encRef) ? deref(src, encRef) : encRef
  const sec = authenticate(src, encDict, pwd)
  // encrypted object streams: parsePdf unpacked nothing useful from ciphertext,
  // so decrypt each container with its own key and unpack its objects now
  const objStmKeys = new Set()
  const unpacked = new Set() // inner objects are plaintext already
  for (const [key, ent] of src.objects) {
    const v = ent.v
    if (!isStream(v) || !typeIs(v.dict, 'ObjStm')) continue
    const N = get(v.dict, 'N'), first = get(v.dict, 'First')
    if (typeof N !== 'number' || typeof first !== 'number') continue
    const [n, g] = key.split(' ').map(Number)
    const plain = cryptBytes(sec.stm, objectKey(sec.fileKey, n, g, sec.stm), v.data, false)
    const data = await streamData({ dict: v.dict, data: plain })
    if (!data) continue
    objStmKeys.add(key)
    const header = dec(data.slice(0, first)).trim().split(/\s+/).map(Number)
    for (let i = 0; i < N; i++) {
      const num = header[i * 2], off = header[i * 2 + 1]
      try {
        const [v2] = parseValue(data, first + off)
        const k2 = `${num} 0`
        if (!src.objects.has(k2)) { // a directly-scanned object is the newer revision
          src.objects.set(k2, { n: num, g: 0, v: v2 })
          unpacked.add(k2)
        }
      } catch { /* skip malformed inner object */ }
    }
  }
  const encKey = isRef(encRef) ? `${encRef.n} ${encRef.g}` : null
  const skip = new Set([...objStmKeys, ...(encKey ? [encKey] : [])])
  const dst = newDoc()
  const { numOf, refMap, rootNum } = cloneDoc(src, dst, skip)
  // keys bind to SOURCE object ids — never to the renumbered clones
  for (const [key] of src.objects) {
    if (skip.has(key) || unpacked.has(key)) continue
    const [n, g] = key.split(' ').map(Number)
    cryptObject(dst.objects.get(numOf.get(key)), n, g, sec, false)
  }
  const id0 = get(src.trailer, 'ID')?.[0]?.bytes ?? md5(bytes.subarray(0, 4096))
  const trailer = new Map([['ID', [{ k: 'x', bytes: id0 }, { k: 'x', bytes: md5(concat([id0, enc('unlocked')])) }]]])
  mapInfo(src, numOf, refMap, trailer)
  return writeDoc(dst, rootNum, trailer)
}

/**
 * Permission flags → /P. perms: {print, printHigh, copy, modify, annotate, fill, assemble, accessibility}
 * (all default true — the password gates opening, flags restrict what readers allow after).
 */
function permBits(perms = {}) {
  const on = (k) => perms[k] !== false
  let p = 0xfffff0c0 | 0 // reserved bits set, 1-2 clear
  if (on('print')) p |= 1 << 2
  if (on('modify')) p |= 1 << 3
  if (on('copy')) p |= 1 << 4
  if (on('annotate')) p |= 1 << 5
  if (on('fill')) p |= 1 << 8
  if (on('accessibility')) p |= 1 << 9
  if (on('assemble')) p |= 1 << 10
  if (on('print') && perms.printHigh !== false) p |= 1 << 11
  return p | 0
}

/**
 * Password-protect a PDF.
 * opts.method: 'aes256' (default, R6) | 'aes128' (R4) | 'rc4' (R3, legacy)
 * opts.ownerPwd: defaults to userPwd. opts.perms: see permBits.
 * An empty user password + owner password = opens freely, restrictions apply.
 */
async function protectPdf(bytes, userPwd, { ownerPwd, method = 'aes256', perms } = {}) {
  let src = await parsePdf(bytes, [], true)
  if (get(src.trailer, 'Encrypt')) throw new Error('this PDF is already protected — unlock it first')
  const dst = newDoc()
  const { numOf, refMap, rootNum } = cloneDoc(src, dst)
  const P = permBits(perms)
  const owner = ownerPwd || userPwd
  const srcId = get(src.trailer, 'ID')
  const id0 = Array.isArray(srcId) && srcId[0]?.bytes?.length ? srcId[0].bytes.slice(0, 16) : randomBytes(16)
  const id1 = randomBytes(16)
  let sec, encDict
  if (method === 'aes256') {
    const fileKey = randomBytes(32)
    const upw = pwdUtf8(userPwd), opw = pwdUtf8(owner)
    const uvs = randomBytes(8), uks = randomBytes(8), ovs = randomBytes(8), oks = randomBytes(8)
    const none = new Uint8Array(0)
    const U = concat([hash2B(upw, uvs, none, 6), uvs, uks])
    const UE = aesCbcEncrypt(hash2B(upw, uks, none, 6), ZERO_IV, fileKey, false)
    const O = concat([hash2B(opw, ovs, U, 6), ovs, oks])
    const OE = aesCbcEncrypt(hash2B(opw, oks, U, 6), ZERO_IV, fileKey, false)
    const permsBlock = concat([le32(P), new Uint8Array([255, 255, 255, 255]), enc('Tadb'), randomBytes(4)])
    const Perms = aesCbcEncrypt(fileKey, ZERO_IV, permsBlock, false)
    sec = { fileKey, stm: 'AESV3', str: 'AESV3', encryptMeta: true }
    encDict = new Map([
      ['Filter', name('Standard')], ['V', 5], ['R', 6], ['Length', 256], ['P', P],
      ['CF', new Map([['StdCF', new Map([['AuthEvent', name('DocOpen')], ['CFM', name('AESV3')], ['Length', 32]])]])],
      ['StmF', name('StdCF')], ['StrF', name('StdCF')],
      ['O', { k: 'x', bytes: O }], ['U', { k: 'x', bytes: U }],
      ['OE', { k: 'x', bytes: OE }], ['UE', { k: 'x', bytes: UE }], ['Perms', { k: 'x', bytes: Perms }],
    ])
  } else {
    const R = method === 'aes128' ? 4 : 3
    const uPad = pwdPad(userPwd)
    const O = computeO(pwdPad(owner), uPad, 16, R)
    const fileKey = computeFileKey(uPad, O, P, id0, 16, R, true)
    const U = computeU(fileKey, id0, R)
    const m = method === 'aes128' ? 'AESV2' : 'RC4'
    sec = { fileKey, stm: m, str: m, encryptMeta: true }
    encDict = new Map([['Filter', name('Standard')], ['V', R === 4 ? 4 : 2], ['R', R], ['Length', 128], ['P', P],
      ['O', { k: 'x', bytes: O }], ['U', { k: 'x', bytes: U }]])
    if (R === 4) {
      encDict.set('CF', new Map([['StdCF', new Map([['AuthEvent', name('DocOpen')], ['CFM', name('AESV2')], ['Length', 16]])]]))
      encDict.set('StmF', name('StdCF'))
      encDict.set('StrF', name('StdCF'))
    }
  }
  for (const [num, v] of dst.objects) cryptObject(v, num, 0, sec, true)
  const encNum = dst.alloc()
  dst.set(encNum, encDict)
  const trailer = new Map([['Encrypt', ref(encNum, 0)], ['ID', [{ k: 'x', bytes: id0 }, { k: 'x', bytes: id1 }]]])
  mapInfo(src, numOf, refMap, trailer)
  src = null
  return writeDoc(dst, rootNum, trailer)
}

// ---- src/pdf/stamp.js ----
// Everything that draws ON pages: page numbers, watermarks and the editor's
// annotation export. One rebuild pass (stampPages) appends generated content
// streams, merges resources and can add real PDF annotations (notes, links).

/** Display→user position + counter-rotation matrix for /Rotate'd pages. */
function stampPos(rot, xd, yd, w, hh) {
  return rot === 90 ? [w - yd, xd, [0, 1, -1, 0]]
    : rot === 180 ? [w - xd, hh - yd, [-1, 0, 0, -1]]
    : rot === 270 ? [yd, hh - xd, [0, -1, 1, 0]]
    : [xd, yd, [1, 0, 0, 1]]
}

const fmt = (v) => (Number.isFinite(v) ? +v.toFixed(3) : 0)

/** Standard font face → base font name. family: helv|times|courier. */
function stdFont(family = 'helv', bold = false, italic = false) {
  if (family === 'helvb') { family = 'helv'; bold = true }
  if (family === 'times') return bold ? (italic ? 'Times-BoldItalic' : 'Times-Bold') : (italic ? 'Times-Italic' : 'Times-Roman')
  if (family === 'courier') return bold ? (italic ? 'Courier-BoldOblique' : 'Courier-Bold') : (italic ? 'Courier-Oblique' : 'Courier')
  return bold ? (italic ? 'Helvetica-BoldOblique' : 'Helvetica-Bold') : (italic ? 'Helvetica-Oblique' : 'Helvetica')
}
const fontDict = (base) => new Map([
  ['Type', name('Font')], ['Subtype', name('Type1')], ['BaseFont', name(base)], ['Encoding', name('WinAnsiEncoding')],
])

/** WinAnsi literal string operand; unmappable chars become '?'. */
function winStr(s) {
  let out = '('
  for (const ch of s) {
    const b = toWinAnsi(ch)?.[0] ?? 0x3f
    if (b === 0x28 || b === 0x29 || b === 0x5c) out += '\\' + String.fromCharCode(b)
    else if (b >= 0x20 && b < 0x7f) out += String.fromCharCode(b)
    else out += '\\' + b.toString(8).padStart(3, '0')
  }
  return out + ')'
}
/** Text width in pt for a standard font (unmappable chars measured as '?'). */
function textWidth(base, s, size) {
  const bytes = []
  for (const ch of s) bytes.push(toWinAnsi(ch)?.[0] ?? 0x3f)
  return stdWidth(base, bytes, size)
}

/** '#rrggbb' or [r,g,b] (0-1) → 'r g b' or null. */
function rgbOp(c) {
  if (Array.isArray(c) && c.length >= 3) return c.slice(0, 3).map((v) => fmt(Math.min(1, Math.max(0, v)))).join(' ')
  const m = typeof c === 'string' ? c.match(/^#([0-9a-f]{6})$/i) : null
  if (!m) return null
  const n = parseInt(m[1], 16)
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255].map((v) => fmt(v)).join(' ')
}

/**
 * Build an image XObject in dst from {jpeg} or {rgba, w, h} (alpha → /SMask).
 * Returns the ref.
 */
async function imageXObject(dst, img) {
  if (img.jpeg instanceof Uint8Array) {
    const info = jpegInfo(img.jpeg)
    const d = new Map([
      ['Type', name('XObject')], ['Subtype', name('Image')], ['Width', info.width], ['Height', info.height],
      ['ColorSpace', name(info.colorSpace)], ['BitsPerComponent', 8], ['Filter', name('DCTDecode')],
    ])
    if (info.colorSpace === 'DeviceCMYK' && info.adobe) d.set('Decode', [1, 0, 1, 0, 1, 0, 1, 0])
    const num = dst.alloc()
    dst.set(num, stream(d, img.jpeg))
    return ref(num, 0)
  }
  const { rgba, w, h } = img
  const rgb = new Uint8Array(w * h * 3)
  const alpha = new Uint8Array(w * h)
  let hasAlpha = false
  for (let i = 0, j = 0; i < w * h; i++, j += 4) {
    rgb[i * 3] = rgba[j]; rgb[i * 3 + 1] = rgba[j + 1]; rgb[i * 3 + 2] = rgba[j + 2]
    alpha[i] = rgba[j + 3]
    if (rgba[j + 3] !== 255) hasAlpha = true
  }
  const d = new Map([
    ['Type', name('XObject')], ['Subtype', name('Image')], ['Width', w], ['Height', h],
    ['ColorSpace', name('DeviceRGB')], ['BitsPerComponent', 8], ['Filter', name('FlateDecode')],
  ])
  if (hasAlpha) {
    const sm = dst.alloc()
    dst.set(sm, stream(new Map([
      ['Type', name('XObject')], ['Subtype', name('Image')], ['Width', w], ['Height', h],
      ['ColorSpace', name('DeviceGray')], ['BitsPerComponent', 8], ['Filter', name('FlateDecode')],
    ]), await deflate(alpha)))
    d.set('SMask', ref(sm, 0))
  }
  const num = dst.alloc()
  dst.set(num, stream(d, await deflate(rgb)))
  return ref(num, 0)
}

/**
 * Rebuild `bytes` stamping generated content on each page.
 * stampFor(ctx) → {content, res?: {Font?, ExtGState?, XObject?}, under?, annots?: Map[]} | null
 * (may be async). ctx = {leaf, i, total, mb, rot, w, hh, dw, dh, dst}.
 * The original content is wrapped in q…Q so its leftover graphics state
 * (an unbalanced cm, a clip) can never shift or hide the stamp.
 */
async function stampPages(bytes, stampFor, { pages = null } = {}) {
  const src = bytes instanceof Uint8Array ? await parsePdf(bytes) : bytes // a parsed (possibly pre-edited) doc is fine too
  const leaves = pageLeaves(src)
  const dst = newDoc()
  const pagesRef = dst.alloc()
  const kids = []
  const refMap = new Map()
  const nums = leaves.map((leaf) => {
    const num = dst.alloc()
    kids.push(ref(num, 0))
    if (isRef(leaf.ref)) refMap.set(`${leaf.ref.n} ${leaf.ref.g}`, ref(num, 0))
    return num
  })
  let qNum = 0, QNum = 0
  const qq = () => {
    if (!qNum) {
      qNum = dst.alloc(); dst.set(qNum, stream(new Map(), enc('q\n')))
      QNum = dst.alloc(); dst.set(QNum, stream(new Map(), enc('\nQ\n')))
    }
  }
  for (let i = 0; i < leaves.length; i++) {
    const leaf = leaves[i]
    const pageDict = new Map()
    for (const k of INHERITED) {
      const v = get(leaf.dict, k) ?? leaf.inh[k]
      if (v !== undefined) pageDict.set(k, copyValue(v, src, dst, refMap))
    }
    for (const [k, val] of leaf.dict) {
      if (k === 'Parent' || k === 'Metadata' || INHERITED.includes(k)) continue
      pageDict.set(k, copyValue(val, src, dst, refMap))
    }
    pageDict.set('Type', name('Page'))
    pageDict.set('Parent', ref(pagesRef, 0))
    // the VISIBLE box (CropBox ∩ MediaBox) — what viewers and our editor show
    const mb = pageBox(src, leaf)
    const rot = pageRotation(src, leaf)
    const w = mb[2] - mb[0], hh = mb[3] - mb[1]
    const dw = rot % 180 === 0 ? w : hh
    const dh = rot % 180 === 0 ? hh : w
    const stamp = pages && !pages.includes(i) ? null
      : await stampFor({ leaf, i, total: leaves.length, mb, rot, w, hh, dw, dh, dst })
    if (stamp && (stamp.content || stamp.annots?.length)) {
      if (stamp.content) {
        const csNum = dst.alloc()
        dst.set(csNum, stream(new Map(), enc(stamp.content)))
        let contents = pageDict.get('Contents')
        if (isRef(contents)) { // qpdf-style: Contents → ref TO an array
          const c = dst.objects.get(contents.n)
          if (Array.isArray(c)) contents = c
        }
        const orig = Array.isArray(contents) ? contents.slice() : contents !== undefined && contents !== null ? [contents] : []
        let arr
        if (stamp.under) arr = [ref(csNum, 0), ...orig]
        else if (orig.length) { qq(); arr = [ref(qNum, 0), ...orig, ref(QNum, 0), ref(csNum, 0)] }
        else arr = [ref(csNum, 0)]
        pageDict.set('Contents', arr.length === 1 ? arr[0] : arr)
        let res = pageDict.get('Resources')
        if (isRef(res)) res = dst.objects.get(res.n)
        // clone before mutating: shared Resources dicts must not leak across pages
        res = res instanceof Map ? new Map(res) : new Map()
        for (const [section, entries] of Object.entries(stamp.res ?? {})) {
          let sec = res.get(section)
          if (isRef(sec)) sec = dst.objects.get(sec.n)
          sec = sec instanceof Map ? new Map(sec) : new Map()
          for (const [nm, val] of Object.entries(entries)) sec.set(nm, val)
          res.set(section, sec)
        }
        pageDict.set('Resources', res)
      }
      if (stamp.annots?.length) {
        let an = pageDict.get('Annots')
        if (isRef(an)) an = dst.objects.get(an.n)
        const list = Array.isArray(an) ? an.slice() : []
        for (const a of stamp.annots) {
          const n = dst.alloc()
          a.set('P', ref(nums[i], 0))
          dst.set(n, a)
          list.push(ref(n, 0))
        }
        pageDict.set('Annots', list)
      }
    }
    dst.set(nums[i], pageDict)
  }
  return finishDoc(dst, pagesRef, kids, src, refMap)
}

/** Which 0-based page indices a page selector covers. sel: 'all'|'odd'|'even'|number[] (1-based). */
function selectPages(sel, total) {
  if (Array.isArray(sel)) return sel.map((p) => p - 1).filter((i) => i >= 0 && i < total)
  const all = Array.from({ length: total }, (_, i) => i)
  if (sel === 'odd') return all.filter((i) => i % 2 === 0)
  if (sel === 'even') return all.filter((i) => i % 2 === 1)
  return all
}

/**
 * Stamp page numbers.
 * opts: pos (tl|tc|tr|bl|bc|br), fmt ('n-of-total'|'n'|'page-n'|'page-n-of-total'|'custom'),
 * fmtStr ({n},{t}), start, skipFirst, size, margin, font, bold, color, mirror (swap l/r on even pages),
 * pages ('all'|'odd'|'even'|number[]).
 */
async function addPageNumbers(bytes, opts = {}) {
  const {
    pos = 'bc', fmt: style = 'n-of-total', fmtStr = '{n}', start = 1, skipFirst = false, size = 10,
    margin = 18, font = 'helv', bold = false, color = '#000000', mirror = false, pages: sel = 'all',
    total: totalOverride = null, offset = 0, // preview support: real total + index of the first page given
  } = opts
  const base = stdFont(font, bold)
  const label = (i0, total0) => {
    const i = i0 + offset
    const total = totalOverride ?? total0
    const n = i + start - (skipFirst ? 1 : 0)
    const t = total - (skipFirst ? 1 : 0) + start - 1
    if (style === 'custom') return (fmtStr || '{n}').replaceAll('{n}', String(n)).replaceAll('{t}', String(t))
    if (style === 'n') return String(n)
    if (style === 'page-n') return `Page ${n}`
    if (style === 'page-n-of-total') return `Page ${n} of ${t}`
    return `${n} / ${t}`
  }
  const col = rgbOp(color) ?? '0 0 0'
  let wanted = null
  return stampPages(bytes, ({ i, total, mb, rot, w, hh, dw, dh }) => {
    wanted ??= new Set(selectPages(sel, totalOverride ?? total))
    const gi = i + offset // index in the real document
    if ((gi === 0 && skipFirst) || !wanted.has(gi)) return null
    const s = label(i, total)
    const tw = textWidth(base, s, size)
    let side = pos[1]
    if (mirror && gi % 2 === 1 && side !== 'c') side = side === 'l' ? 'r' : 'l'
    const xd = side === 'l' ? margin : side === 'r' ? dw - margin - tw : dw / 2 - tw / 2
    const yd = pos[0] === 't' ? dh - margin - size * 0.72 : margin
    const [xu, yu, m] = stampPos(rot, xd, yd, w, hh)
    return {
      content: `\nq ${m.join(' ')} ${fmt(mb[0] + xu)} ${fmt(mb[1] + yu)} cm ${col} rg BT /PSNum ${fmt(size)} Tf 0 0 Td ${winStr(s)} Tj ET Q\n`,
      res: { Font: { PSNum: fontDict(base) } },
    }
  })
}

/**
 * Watermark every (selected) page with text or an image.
 * opts: text, size, font, bold, opacity, color, angle (deg, display space; negative ↗),
 * layout ('center'|'tile'), under (behind content), image ({jpeg}|{rgba,w,h}), imageScale (fraction of page width),
 * pages selector.
 */
async function watermarkPdf(bytes, opts = {}) {
  const {
    text = 'CONFIDENTIAL', size = 48, font = 'helv', bold = true, opacity = 0.25, color = [0.62, 0.1, 0.1],
    angle = -45, layout = 'center', under = false, image = null, imageScale = 0.5, pages: sel = 'all',
  } = opts
  const base = stdFont(font, bold)
  const col = rgbOp(color) ?? '0.62 0.1 0.1'
  const th = (angle * Math.PI) / 180
  const R = [Math.cos(th), Math.sin(th), -Math.sin(th), Math.cos(th)]
  const tw = textWidth(base, text, size)
  let imRef = null, imDims = null, wanted = null
  return stampPages(bytes, async ({ i, total, mb, rot, w, hh, dw, dh, dst }) => {
    wanted ??= new Set(selectPages(sel, total))
    if (!wanted.has(i)) return null
    if (image && !imRef) {
      imRef = await imageXObject(dst, image)
      imDims = image.jpeg ? jpegInfo(image.jpeg) : { width: image.w, height: image.h }
    }
    const dispLin = rot === 90 ? [0, 1, 1, 0] : rot === 180 ? [-1, 0, 0, 1] : rot === 270 ? [0, -1, -1, 0] : [1, 0, 0, -1]
    // after `wrap`, coordinates are display space (top-left origin, y down)
    const [xu0, yu0] = stampPos(rot, 0, dh, w, hh)
    const wrap = `${dispLin.join(' ')} ${fmt(mb[0] + xu0)} ${fmt(mb[1] + yu0)} cm`
    const centers = []
    if (layout === 'tile') {
      const stepX = Math.max(tw, size * 4) * 1.4, stepY = Math.max(size * 5, tw * 0.6)
      for (let y = stepY / 2; y < dh + stepY; y += stepY)
        for (let x = ((Math.round(y / stepY) % 2) * stepX) / 2; x < dw + stepX; x += stepX) centers.push([x, y])
    } else centers.push([dw / 2, dh / 2])
    const parts = []
    for (const [cx, cy] of centers) {
      // display space is y-down, so a negative angle tilts the baseline up-right (↗)
      const m = R
      if (imRef) {
        const iw = dw * imageScale, ih = (iw * imDims.height) / imDims.width
        parts.push(`q ${m.map(fmt).join(' ')} ${fmt(cx)} ${fmt(cy)} cm ${fmt(iw)} 0 0 ${fmt(-ih)} ${fmt(-iw / 2)} ${fmt(ih / 2)} cm /PSWmIm Do Q`)
      } else {
        // text needs y-up glyphs: flip back inside the rotated frame
        parts.push(`q ${m.map(fmt).join(' ')} ${fmt(cx)} ${fmt(cy)} cm 1 0 0 -1 0 0 cm BT /PSWm ${fmt(size)} Tf ${fmt(-tw / 2)} ${fmt(-size * 0.35)} Td ${winStr(text)} Tj ET Q`)
      }
    }
    const res = { ExtGState: { PSWmGS: new Map([['ca', opacity], ['CA', opacity]]) } }
    if (imRef) res.XObject = { PSWmIm: imRef }
    else res.Font = { PSWm: fontDict(base) }
    return {
      content: `\nq ${wrap} /PSWmGS gs ${col} rg ${parts.join(' ')} Q\n`,
      res,
      under,
    }
  })
}

const KAPPA = 0.5523

/** CSS / canvas blend mode → PDF /BM name. */
const BLEND_PDF = {
  multiply: 'Multiply', screen: 'Screen', overlay: 'Overlay', darken: 'Darken', lighten: 'Lighten',
  'color-dodge': 'ColorDodge', 'color-burn': 'ColorBurn', 'hard-light': 'HardLight', 'soft-light': 'SoftLight',
  difference: 'Difference', exclusion: 'Exclusion', hue: 'Hue', saturation: 'Saturation', color: 'Color', luminosity: 'Luminosity',
}

/** SVG-ish path segs (display space) → PDF path operators. */
function pathOps(segs) {
  return segs.map((s) => {
    if (s[0] === 'M') return `${fmt(s[1])} ${fmt(s[2])} m`
    if (s[0] === 'L') return `${fmt(s[1])} ${fmt(s[2])} l`
    if (s[0] === 'C') return `${fmt(s[1])} ${fmt(s[2])} ${fmt(s[3])} ${fmt(s[4])} ${fmt(s[5])} ${fmt(s[6])} c`
    if (s[0] === 'Z') return 'h'
    return ''
  }).join(' ')
}

/**
 * Bake editor annotations into pages as real PDF operators / annotations.
 * pagesAnnots[p] (0-based) = [{t, ...}] in DISPLAY-space pt (top-left origin, y down).
 *  stroke {pts,color,width} · vstroke {pts:[x,y,w]} · highlight {pts,color,width}
 *  line {x1,y1,x2,y2,color,width,arrow?,arrowStart?,dash?}
 *  rect/ellipse {x,y,w,h,stroke,fill,lw,dash?,radius?}
 *  path {segs:[['M',x,y],['L',x,y],['C',…],['Z']], stroke?, fill?, lw?}
 *  text {x,y,text,size,font,bold?,italic?,color,align?,w?,underline?,strike?,bg?,lineHeight?}
 *    x,y = top-left of the first line; baseline = y + size·0.8 (ascent); leading = size·lineHeight
 *  image {x,y,w,h, jpeg | rgba+iw+ih}
 *  note {x,y,text,color} → real /Text (sticky note) annotation
 *  link {x,y,w,h,url} → real /Link annotation
 * Every shape may carry alpha (0-1) and rot (radians, about its box centre).
 */
async function annotatePdf(bytes, pagesAnnots) {
  return stampPages(bytes, async ({ i, mb, rot, w, hh, dh, dst }) => {
    const anns = pagesAnnots?.[i]
    if (!Array.isArray(anns) || !anns.length) return null
    const dispLin = rot === 90 ? [0, 1, 1, 0] : rot === 180 ? [-1, 0, 0, 1] : rot === 270 ? [0, -1, -1, 0] : [1, 0, 0, -1]
    const [xu0, yu0] = stampPos(rot, 0, dh, w, hh)
    const wrap = `${dispLin.join(' ')} ${fmt(mb[0] + xu0)} ${fmt(mb[1] + yu0)} cm`
    // display (y-down) point → default user space, for annotation /Rect
    const toUser = (x, y) => {
      const [ux, uy] = stampPos(rot, x, dh - y, w, hh)
      return [mb[0] + ux, mb[1] + uy]
    }
    const res = {}
    const ops = []
    const annots = []
    let gsN = 0, imN = 0
    const gsFor = (alpha, blend) => {
      const d = new Map([['ca', alpha], ['CA', alpha]])
      if (blend) d.set('BM', name(blend === true ? 'Multiply' : blend))
      const nm = `ANN_GS${++gsN}`
      ;(res.ExtGState ??= {})[nm] = d
      return `/${nm} gs`
    }
    const pt2 = (p) => Array.isArray(p) && Number.isFinite(p[0]) && Number.isFinite(p[1])
    const num = (v) => (Number.isFinite(v) ? fmt(v) : '0')
    for (const a of anns) {
      if (!a || typeof a !== 'object') continue
      const alpha = typeof a.alpha === 'number' ? Math.min(1, Math.max(0, a.alpha)) : null
      const color = rgbOp(a.color)
      const parts = []
      // optional rotation about the shape's centre
      let pre = ''
      if (a.rot && Number.isFinite(a.rot) && [a.x, a.y, a.w, a.h].every(Number.isFinite)) {
        const cx = a.x + a.w / 2, cy = a.y + a.h / 2
        const c = Math.cos(a.rot), s = Math.sin(a.rot)
        pre = `1 0 0 1 ${num(cx)} ${num(cy)} cm ${num(c)} ${num(s)} ${num(-s)} ${num(c)} 0 0 cm 1 0 0 1 ${num(-cx)} ${num(-cy)} cm`
      }
      const dashOp = Array.isArray(a.dash) && a.dash.length ? `[${a.dash.map(num).join(' ')}] 0 d` : ''
      switch (a.t) {
        case 'stroke':
        case 'highlight': {
          if (!color || !Array.isArray(a.pts) || a.pts.length < 1 || !a.pts.every(pt2)) break
          const w0 = a.t === 'highlight' ? (a.width ?? 12) : (a.width ?? 2)
          const path = a.pts.length === 1
            ? `${num(a.pts[0][0])} ${num(a.pts[0][1])} m ${num(a.pts[0][0] + 0.01)} ${num(a.pts[0][1])} l`
            : a.pts.map((p, k) => `${num(p[0])} ${num(p[1])} ${k ? 'l' : 'm'}`).join(' ')
          parts.push(`${color} RG ${num(w0)} w ${a.t === 'highlight' ? '0 J' : '1 J'} 1 j ${path} S`)
          break
        }
        case 'vstroke': {
          if (!color || !Array.isArray(a.pts) || a.pts.length < 1) break
          const segs = []
          for (let k = 0; k + 1 < a.pts.length; k++) {
            const [p, q] = [a.pts[k], a.pts[k + 1]]
            if (!pt2(p) || !pt2(q)) continue
            const sw = Math.min(60, Math.max(0.3, typeof p[2] === 'number' ? (p[2] + (q[2] ?? p[2])) / 2 : 1))
            segs.push(`${num(sw)} w ${num(p[0])} ${num(p[1])} m ${num(q[0])} ${num(q[1])} l S`)
          }
          if (!segs.length && a.pts.length === 1 && pt2(a.pts[0])) {
            const p = a.pts[0]
            const sw = Math.min(60, Math.max(0.3, typeof p[2] === 'number' ? p[2] : 1))
            segs.push(`${num(sw)} w ${num(p[0])} ${num(p[1])} m ${num(p[0] + 0.01)} ${num(p[1])} l S`)
          }
          if (!segs.length) break
          parts.push(`${color} RG 1 J 1 j ${segs.join(' ')}`)
          break
        }
        case 'line': {
          if (!color || ![a.x1, a.y1, a.x2, a.y2].every(Number.isFinite)) break
          const lw = typeof a.width === 'number' && a.width > 0 ? a.width : 2
          const head = (x1, y1, x2, y2) => {
            const ang = Math.atan2(y2 - y1, x2 - x1)
            const L = Math.min(60, Math.max(6, 3 * lw))
            const [bx, by] = [x2 - L * Math.cos(ang), y2 - L * Math.sin(ang)]
            const [px, py] = [-Math.sin(ang) * L * 0.45, Math.cos(ang) * L * 0.45]
            return `${color} rg ${num(x2)} ${num(y2)} m ${num(bx + px)} ${num(by + py)} l ${num(bx - px)} ${num(by - py)} l h f`
          }
          // shorten the shaft under arrowheads so the round cap doesn't poke through
          const ang = Math.atan2(a.y2 - a.y1, a.x2 - a.x1)
          const L = Math.min(60, Math.max(6, 3 * lw)) * 0.6
          const ex = a.arrow ? a.x2 - L * Math.cos(ang) : a.x2, ey = a.arrow ? a.y2 - L * Math.sin(ang) : a.y2
          const sx = a.arrowStart ? a.x1 + L * Math.cos(ang) : a.x1, sy = a.arrowStart ? a.y1 + L * Math.sin(ang) : a.y1
          parts.push(`${color} RG ${num(lw)} w 1 J ${dashOp} ${num(sx)} ${num(sy)} m ${num(ex)} ${num(ey)} l S`)
          if (a.arrow) parts.push(head(a.x1, a.y1, a.x2, a.y2))
          if (a.arrowStart) parts.push(head(a.x2, a.y2, a.x1, a.y1))
          break
        }
        case 'rect':
        case 'ellipse': {
          if (![a.x, a.y, a.w, a.h].every(Number.isFinite)) break
          const fill = rgbOp(a.fill), strokeC = rgbOp(a.stroke)
          if (!fill && !strokeC) break
          const lw = typeof a.lw === 'number' && a.lw > 0 ? a.lw : 1
          let path
          if (a.t === 'rect' && a.radius > 0) {
            const r = Math.min(a.radius, a.w / 2, a.h / 2), k = r * (1 - KAPPA)
            const [x0, y0, x1, y1] = [a.x, a.y, a.x + a.w, a.y + a.h]
            path = `${num(x0 + r)} ${num(y0)} m ${num(x1 - r)} ${num(y0)} l ${num(x1 - k)} ${num(y0)} ${num(x1)} ${num(y0 + k)} ${num(x1)} ${num(y0 + r)} c ` +
              `${num(x1)} ${num(y1 - r)} l ${num(x1)} ${num(y1 - k)} ${num(x1 - k)} ${num(y1)} ${num(x1 - r)} ${num(y1)} c ` +
              `${num(x0 + r)} ${num(y1)} l ${num(x0 + k)} ${num(y1)} ${num(x0)} ${num(y1 - k)} ${num(x0)} ${num(y1 - r)} c ` +
              `${num(x0)} ${num(y0 + r)} l ${num(x0)} ${num(y0 + k)} ${num(x0 + k)} ${num(y0)} ${num(x0 + r)} ${num(y0)} c h`
          } else if (a.t === 'rect') {
            path = `${num(a.x)} ${num(a.y)} ${num(a.w)} ${num(a.h)} re`
          } else {
            const [cx, cy, rx, ry, k] = [a.x + a.w / 2, a.y + a.h / 2, a.w / 2, a.h / 2, KAPPA]
            path =
              `${num(cx + rx)} ${num(cy)} m ` +
              `${num(cx + rx)} ${num(cy - k * ry)} ${num(cx + k * rx)} ${num(cy - ry)} ${num(cx)} ${num(cy - ry)} c ` +
              `${num(cx - k * rx)} ${num(cy - ry)} ${num(cx - rx)} ${num(cy - k * ry)} ${num(cx - rx)} ${num(cy)} c ` +
              `${num(cx - rx)} ${num(cy + k * ry)} ${num(cx - k * rx)} ${num(cy + ry)} ${num(cx)} ${num(cy + ry)} c ` +
              `${num(cx + k * rx)} ${num(cy + ry)} ${num(cx + rx)} ${num(cy + k * ry)} ${num(cx + rx)} ${num(cy)} c h`
          }
          const paint = fill && strokeC ? 'B' : fill ? 'f' : 'S'
          parts.push(`${fill ? `${fill} rg ` : ''}${strokeC ? `${strokeC} RG ` : ''}${num(lw)} w ${dashOp} ${path} ${paint}`)
          break
        }
        case 'path': {
          if (!Array.isArray(a.segs) || !a.segs.length) break
          const fill = rgbOp(a.fill), strokeC = rgbOp(a.stroke ?? a.color)
          if (!fill && !strokeC) break
          const lw = typeof a.lw === 'number' && a.lw > 0 ? a.lw : 1.5
          const paint = fill && strokeC ? 'B' : fill ? 'f' : 'S'
          parts.push(`${fill ? `${fill} rg ` : ''}${strokeC ? `${strokeC} RG ` : ''}${num(lw)} w 1 J 1 j ${dashOp} ${pathOps(a.segs)} ${paint}`)
          break
        }
        case 'text': {
          const size = typeof a.size === 'number' && a.size > 0 ? a.size : null
          if (!color || !size || typeof a.text !== 'string' || !a.text.length || ![a.x, a.y].every(Number.isFinite)) break
          const base = stdFont(a.font, !!a.bold, !!a.italic)
          const fname = `ANN_${base.replace(/[^A-Za-z]/g, '')}`
          ;(res.Font ??= {})[fname] = fontDict(base)
          const lead = size * (a.lineHeight ?? 1.2)
          const sp = Number.isFinite(a.spacing) ? a.spacing : 0 // letter spacing, pt (Tc)
          const lines = a.text.split('\n')
          const widths = lines.map((l) => textWidth(base, l, size) + sp * Math.max(0, [...l].length - 1))
          const boxW = Number.isFinite(a.w) && a.w > 0 ? a.w : Math.max(...widths)
          if (a.bg) {
            const bg = rgbOp(a.bg)
            if (bg) parts.push(`${bg} rg ${num(a.x - 2)} ${num(a.y - 1)} ${num(boxW + 4)} ${num(lines.length * lead + 2)} re f`)
          }
          const outline = a.outline?.width > 0 ? rgbOp(a.outline.color ?? '#000000') : null
          const shadow = a.shadow?.opacity > 0 ? rgbOp(a.shadow.color ?? '#000000') : null
          const runLines = (dx, dy, fill, mode) => lines.forEach((line, li) => {
            if (!line.length) return
            const lx = (a.align === 'center' ? a.x + (boxW - widths[li]) / 2 : a.align === 'right' ? a.x + boxW - widths[li] : a.x) + dx
            const by = a.y + size * 0.8 + li * lead + dy // baseline (ascent ≈ 0.8em for the standard fonts)
            // glyphs need y-up: local flip at the baseline
            parts.push(`${fill} BT /${fname} ${num(size)} Tf ${sp ? `${num(sp)} Tc ` : ''}${mode ? `${mode} ` : ''}1 0 0 -1 ${num(lx)} ${num(by)} Tm ${winStr(line)} Tj ET`)
          })
          if (shadow) {
            const sgs = gsFor((a.shadow.opacity / 100) * (alpha ?? 1), null)
            const off = (v) => ((v ?? 0) / 100) * size * 0.5
            parts.push(`q ${sgs}`)
            runLines(off(a.shadow.dx ?? 30), off(a.shadow.dy ?? 30), `${shadow} rg`, '')
            parts.push('Q')
          }
          if (outline) runLines(0, 0, `${color} rg ${outline} RG ${num(a.outline.width)} w 1 j`, '2 Tr')
          else runLines(0, 0, `${color} rg`, '')
          lines.forEach((line, li) => {
            const lx = a.align === 'center' ? a.x + (boxW - widths[li]) / 2 : a.align === 'right' ? a.x + boxW - widths[li] : a.x
            const by = a.y + size * 0.8 + li * lead
            const deco = []
            if (a.underline) deco.push(by + size * 0.12)
            if (a.strike) deco.push(by - size * 0.28)
            for (const yy of deco) parts.push(`${color} RG ${num(Math.max(0.5, size / 16))} w ${num(lx)} ${num(yy)} m ${num(lx + widths[li])} ${num(yy)} l S`)
          })
          break
        }
        case 'image': {
          if (![a.x, a.y, a.w, a.h].every(Number.isFinite)) break
          let r
          try {
            if (a.jpeg instanceof Uint8Array) r = await imageXObject(dst, { jpeg: a.jpeg })
            else if (a.rgba && a.iw && a.ih) r = await imageXObject(dst, { rgba: a.rgba, w: a.iw, h: a.ih })
            else break
          } catch { break }
          const nm = `ANN_Im${++imN}`
          ;(res.XObject ??= {})[nm] = r
          parts.push(`${num(a.w)} 0 0 ${num(-a.h)} ${num(a.x)} ${num(a.y + a.h)} cm /${nm} Do`)
          break
        }
        case 'note': {
          if (![a.x, a.y].every(Number.isFinite)) break
          const [ux, uy] = toUser(a.x, a.y)
          const c = rgbOp(a.color ?? '#ffd43b')?.split(' ').map(Number) ?? [1, 0.83, 0.23]
          annots.push(new Map([
            ['Type', name('Annot')], ['Subtype', name('Text')], ['Rect', [fmt(ux), fmt(uy - 20), fmt(ux + 20), fmt(uy)]],
            ['Contents', textString(String(a.text ?? ''))], ['Name', name('Comment')], ['C', c], ['F', 4],
            ['T', textString(a.author || 'PDFSuite')], ['Open', false],
          ]))
          break
        }
        case 'link': {
          if (![a.x, a.y, a.w, a.h].every(Number.isFinite) || typeof a.url !== 'string' || !a.url) break
          const [x1, y1] = toUser(a.x, a.y), [x2, y2] = toUser(a.x + a.w, a.y + a.h)
          const url = /^[a-z][a-z0-9+.-]*:/i.test(a.url) ? a.url : `https://${a.url}`
          annots.push(new Map([
            ['Type', name('Annot')], ['Subtype', name('Link')],
            ['Rect', [fmt(Math.min(x1, x2)), fmt(Math.min(y1, y2)), fmt(Math.max(x1, x2)), fmt(Math.max(y1, y2))]],
            ['Border', [0, 0, 0]], ['F', 4],
            ['A', new Map([['S', name('URI')], ['URI', { k: 's', bytes: enc(url) }]])],
          ]))
          break
        }
      }
      if (parts.length) {
        const bm = a.t === 'highlight' ? 'Multiply' : BLEND_PDF[a.blend] ?? null
        const needsGs = bm || (alpha !== null && alpha < 1)
        const gs = needsGs ? gsFor(alpha ?? (a.t === 'highlight' ? 0.35 : 1), bm) : ''
        ops.push(`q ${wrap} ${[pre, gs, ...parts].filter(Boolean).join(' ')} Q`)
      }
    }
    // leading \n keeps our first op from fusing with the previous stream's last token
    return ops.length || annots.length ? { content: ops.length ? '\n' + ops.join('\n') + '\n' : '', res, annots } : null
  })
}

/**
 * Replace the document info (Title, Author, Subject, Keywords, Creator, Producer).
 * fields: {Title?, Author?, …} — empty strings remove a key. The XMP packet is
 * dropped so readers that prefer XMP don't show the stale values.
 */
async function setMetadata(bytes, fields) {
  const doc = await parsePdf(bytes)
  const old = deref(doc, get(doc.trailer, 'Info'))
  const info = old instanceof Map ? new Map(old) : new Map()
  for (const [k, v] of Object.entries(fields)) {
    if (v === null || v === undefined || v === '') info.delete(k)
    else info.set(k, textString(String(v)))
  }
  const now = new Date()
  const pad = (n) => String(n).padStart(2, '0')
  info.set('ModDate', textString(`D:${now.getUTCFullYear()}${pad(now.getUTCMonth() + 1)}${pad(now.getUTCDate())}${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}${pad(now.getUTCSeconds())}Z`))
  doc.trailer.set('Info', info)
  const root = deref(doc, get(doc.trailer, 'Root'))
  if (root instanceof Map) root.delete('Metadata')
  return stampPages(doc, () => null)
}

/**
 * Set the visible area of pages. rects[i] = {x, y, w, h} in that page's
 * current DISPLAY space (what the user sees), or null to leave it.
 * Handles /Rotate by mapping the display rect back into user space.
 */
async function cropPages(bytes, rects) {
  const doc = await parsePdf(bytes)
  pageLeaves(doc).forEach((leaf, i) => {
    const r = rects[i]
    if (!r || !(r.w > 1) || !(r.h > 1)) return
    const box = pageBox(doc, leaf)
    const rot = pageRotation(doc, leaf)
    const w = box[2] - box[0], hh = box[3] - box[1]
    const toUser = (x, y) => { const [ux, uy] = stampPos(rot, x, (rot % 180 === 0 ? hh : w) - y, w, hh); return [box[0] + ux, box[1] + uy] }
    const [x1, y1] = toUser(r.x, r.y), [x2, y2] = toUser(r.x + r.w, r.y + r.h)
    const cb = [Math.min(x1, x2), Math.min(y1, y2), Math.max(x1, x2), Math.max(y1, y2)].map((v) => +v.toFixed(3))
    leaf.dict.set('CropBox', cb)
    leaf.dict.set('TrimBox', cb)
    leaf.dict.delete('ArtBox')
    leaf.dict.delete('BleedBox')
  })
  return stampPages(doc, () => null)
}

// ---- src/pdf/redact.js ----
// True redaction + text erasing by rewriting content streams.
// Glyphs whose centres fall inside a region are REMOVED from the Tj/TJ
// operators (replaced by spacing so the rest of the line keeps its place);
// image pixels under the region are painted out and the image re-encoded;
// links/comments over the region go. Nothing hidden "under a black box".

const inRect = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h
/** Image bbox [x0,y0,x1,y1] ≈ region {x,y,w,h}: intersection-over-union ≥ 0.8. */
function sameBox(b, r) {
  const ix = Math.max(0, Math.min(b[2], r.x + r.w) - Math.max(b[0], r.x))
  const iy = Math.max(0, Math.min(b[3], r.y + r.h) - Math.max(b[1], r.y))
  const inter = ix * iy
  const uni = (b[2] - b[0]) * (b[3] - b[1]) + r.w * r.h - inter
  return uni > 0 && inter / uni >= 0.8
}
const rectsHit = (b, r) => b[0] < r.x + r.w && b[2] > r.x && b[1] < r.y + r.h && b[3] > r.y

/** Serialize a PDF string operand (literal, escaped). */
function strOperand(bytes) {
  let s = '('
  for (const b of bytes) {
    if (b === 0x28 || b === 0x29 || b === 0x5c) s += '\\' + String.fromCharCode(b)
    else if (b < 0x20 || b > 0x7e) s += '\\' + b.toString(8).padStart(3, '0')
    else s += String.fromCharCode(b)
  }
  return s + ')'
}
const fnum = (v) => (Number.isFinite(v) ? String(+v.toFixed(4)) : '0')

/**
 * Rebuild one text-showing operator with some glyphs removed.
 * tok: tokenizer op; parts: Map<partIndex, {fs, th, glyphs, removed:Set<glyphIdx>}>.
 * Returns replacement source text.
 */
function rewriteTextOp(tok, parts) {
  const out = [] // TJ items: strings (bytes) and numbers
  const pushStr = (bytes) => { if (bytes.length) out.push({ s: bytes }) }
  const pushNum = (n) => { if (n) out.push({ n }) }
  const doString = (bytes, part) => {
    const p = parts.get(part)
    if (!p) { pushStr(bytes); return }
    let keep = []
    let gap = 0
    p.glyphs.forEach((g, gi) => {
      if (p.removed.has(gi)) {
        if (keep.length) { pushStr(Uint8Array.from(keep)); keep = [] }
        gap += g.a
      } else {
        if (gap) { pushNum(-(gap * 1000) / (p.fs * p.th || 1)); gap = 0 }
        for (let k = g.b0; k < g.b1; k++) keep.push(bytes[k])
      }
    })
    if (keep.length) pushStr(Uint8Array.from(keep))
    if (gap) pushNum(-(gap * 1000) / (p.fs * p.th || 1))
  }
  let prefix = ''
  if (tok.op === 'TJ') {
    const arr = tok.operands.find((o) => o?.t === 'arr')
    arr?.items.forEach((it, k) => {
      if (it?.t === 'str') doString(it.bytes, k)
      else if (typeof it === 'number') pushNum(it)
    })
  } else {
    const nums = tok.operands.filter((o) => typeof o === 'number')
    if (tok.op === '"' && nums.length >= 2) prefix = `${fnum(nums[0])} Tw ${fnum(nums[1])} Tc `
    if (tok.op === "'" || tok.op === '"') prefix += 'T* '
    const s = [...tok.operands].reverse().find((o) => o?.t === 'str')
    if (s) doString(s.bytes, 0)
  }
  // merge adjacent numbers
  const merged = []
  for (const it of out) {
    const last = merged[merged.length - 1]
    if (it.n !== undefined && last?.n !== undefined) last.n += it.n
    else merged.push({ ...it })
  }
  const body = merged.map((it) => (it.n !== undefined ? fnum(it.n) : strOperand(it.s))).join(' ')
  return `${prefix}[${body}] TJ`
}

/** Paint display-space regions out of an RGBA image drawn with matrix m. */
function blankPixels(im, m, regions, fill) {
  // display → unit square (image space, y up) inverse
  const det = m[0] * m[3] - m[1] * m[2]
  if (!det) return false
  const inv = [m[3] / det, -m[1] / det, -m[2] / det, m[0] / det, (m[2] * m[5] - m[3] * m[4]) / det, (m[1] * m[4] - m[0] * m[5]) / det]
  let touched = false
  const [fr, fg, fb] = fill
  for (const r of regions) {
    const corners = [[r.x, r.y], [r.x + r.w, r.y], [r.x, r.y + r.h], [r.x + r.w, r.y + r.h]].map(([x, y]) => matPt(inv, x, y))
    const ux0 = Math.min(...corners.map((c) => c[0])), ux1 = Math.max(...corners.map((c) => c[0]))
    const uy0 = Math.min(...corners.map((c) => c[1])), uy1 = Math.max(...corners.map((c) => c[1]))
    const px0 = Math.max(0, Math.floor(ux0 * im.w)), px1 = Math.min(im.w, Math.ceil(ux1 * im.w))
    // image row 0 is the TOP (unit y = 1)
    const py0 = Math.max(0, Math.floor((1 - uy1) * im.h)), py1 = Math.min(im.h, Math.ceil((1 - uy0) * im.h))
    for (let y = py0; y < py1; y++) {
      for (let x = px0; x < px1; x++) {
        // exact test for rotated images: pixel centre back to display space
        const [dx, dy] = matPt(m, (x + 0.5) / im.w, 1 - (y + 0.5) / im.h)
        if (!inRect(dx, dy, { x: r.x - 0.5, y: r.y - 0.5, w: r.w + 1, h: r.h + 1 })) continue
        const o = (y * im.w + x) * 4
        im.rgba[o] = fr; im.rgba[o + 1] = fg; im.rgba[o + 2] = fb; im.rgba[o + 3] = 255
        touched = true
      }
    }
  }
  return touched
}

async function rgbaImageStream(im) {
  const rgb = new Uint8Array(im.w * im.h * 3)
  for (let i = 0, j = 0; i < im.w * im.h; i++, j += 4) { rgb[i * 3] = im.rgba[j]; rgb[i * 3 + 1] = im.rgba[j + 1]; rgb[i * 3 + 2] = im.rgba[j + 2] }
  return stream(new Map([
    ['Type', name('XObject')], ['Subtype', name('Image')], ['Width', im.w], ['Height', im.h],
    ['ColorSpace', name('DeviceRGB')], ['BitsPerComponent', 8], ['Filter', name('FlateDecode')],
  ]), await deflate(rgb))
}

/**
 * Apply removals to a parsed doc IN PLACE (call before stamping/serialising).
 * regionsByPage[p] = [{x, y, w, h}] in display space.
 * opts.mode: 'redact' (text + images + annotations, then paint fill) | 'erase' (text only, no box)
 * opts.fill: '#000000' default for redact, null → no box.
 * opts.decodeJpeg(bytes) → Promise<{w,h,rgba}> (browser) for JPEG images under redactions;
 *   without it a JPEG touched by a redaction is removed entirely (safe default).
 * Returns {glyphs, images, annots} counts of what was removed.
 */
async function applyRemovals(doc, regionsByPage, { mode = 'redact', fill = '#000000', decodeJpeg = null } = {}) {
  const leaves = pageLeaves(doc)
  const stats = { glyphs: 0, images: 0, annots: 0 }
  const fillRgb = hexRgb(fill) ?? [0, 0, 0]
  for (let pi = 0; pi < leaves.length; pi++) {
    const regions = (regionsByPage?.[pi] ?? []).filter((r) => r && r.w > 0 && r.h > 0)
    if (!regions.length) continue
    const leaf = leaves[pi]
    const { ops, data, tokens, disp } = await collectDrawOps(doc, leaf, { glyphs: true, annots: false })
    // ---- collect glyph removals per (xpath, op, part) ----
    const perStream = new Map() // xpathKey → Map<opIdx, Map<part, info>>
    for (const o of ops) {
      if (mode === 'dropimg' || o.t !== 'text' || !o.glyphs?.length) continue
      let rec = null
      o.glyphs.forEach((g, gi) => {
        const [cx, cy] = matPt(o.m, g.x + g.w / 2, o.fs * 0.32)
