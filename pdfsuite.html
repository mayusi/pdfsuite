const cmyk2rgb = (c, m, y, k) => [
  1 - Math.min(1, c + k), 1 - Math.min(1, m + k), 1 - Math.min(1, y + k),
]

/** Decode numeric color operands by component count (gray/rgb/cmyk). */
function colorFrom(nums) {
  if (nums.length === 1) return [nums[0], nums[0], nums[0]]
  if (nums.length === 3) return nums.slice(0, 3)
  if (nums.length >= 4) return cmyk2rgb(nums[0], nums[1], nums[2], nums[3])
  return null
}

async function walkContent(doc, st, data, res, fonts) {
  const { ops, disp } = st
  const xf = (x, y) => matPt(disp, ...matPt(st.ctm, x, y))
  const avgScale = () => (Math.hypot(st.ctm[0], st.ctm[1]) + Math.hypot(st.ctm[2], st.ctm[3])) / 2
  const lwScaled = () => st.lw * avgScale()
  const dashScaled = () => (st.dash ? st.dash.map((d) => d * avgScale()) : null)
  const doffScaled = () => (st.dash ? st.dashPhase * avgScale() : 0)

  const xoDict = () => {
    let x = res instanceof Map ? get(res, 'XObject') : null
    if (isRef(x)) x = deref(doc, x)
    return x instanceof Map ? x : null
  }
  const xoResolve = (nm) => {
    let xv = xoDict()?.get(nm)
    if (isRef(xv)) xv = deref(doc, xv)
    return xv
  }
  const xoKey = (nm) => {
    const v = xoDict()?.get(nm)
    return isRef(v) ? `${v.n} ${v.g}` : `inline:${nm}`
  }
  const fontOf = () => (st.curFont && fonts.get(st.curFont)) || null

  const advance = (bytes, font) => {
    if (!font) return bytes.length * 0.5 * st.fontSize * st.tz
    let sum = 0
    const cl = font.tounicode?.codeLen ?? font.codeLen ?? 1
    for (let i = 0; i + cl <= bytes.length; i += cl) {
      let code = 0
      for (let k = 0; k < cl; k++) code = code * 256 + bytes[i + k]
      const wv = font.wRanges?.get(code) ?? font.widths?.[code - font.firstChar]
      // DW is a CIDFont concept (spec default 1000); simple fonts fall back ~500
      sum += (typeof wv === 'number' ? wv : font.dw ?? (font.codeLen ? 1000 : 500)) / 1000
    }
    return sum * st.fontSize * st.tz
  }

  const emitText = (bytes) => {
    const font = fontOf()
    const str = decodeString(bytes, font)
    const cl = font?.tounicode?.codeLen ?? font?.codeLen ?? 1
    const ncodes = Math.floor(bytes.length / cl)
    const adv = advance(bytes, font) + st.tw * (str.split(' ').length - 1) + st.tc * ncodes
    const m = matMul(st.ctm, st.tm)
    const [ux, uy] = matPt(m, 0, 0)
    const [dx, dy] = matPt(disp, ux, uy)
    const [ux2, uy2] = matPt(m, adv, 0)
    const [dx2, dy2] = matPt(disp, ux2, uy2)
    const dspW = Math.hypot(dx2 - dx, dy2 - dy)
    const ang = Math.atan2(dy2 - dy, dx2 - dx)
    const hh = Math.hypot(m[2], m[3]) * st.fontSize
    ops.push({
      t: 'text', x: dx, y: dy, w: dspW, h: hh, rot: ang,
      str: garbageRatio(str) >= 0.4 ? '' : str,
      size: st.fontSize * Math.hypot(m[0], m[1]),
      fc: st.fillC, a: st.fillA, inv: st.tr === 3,
    })
    st.tm = matMul(st.tm, [1, 0, 0, 1, adv, 0])
  }

  const xformSegs = (subs, closing) =>
    subs.flatMap((sub) => {
      const segs = sub.segs.map((seg) => {
        if (seg[0] === 'Z') return ['Z']
        const out = [seg[0]]
        for (let i = 1; i + 1 < seg.length; i += 2) out.push(...xf(seg[i], seg[i + 1]))
        return out
      })
      if (closing && segs.length && segs[segs.length - 1][0] !== 'Z') segs.push(['Z'])
      return segs
    })

  const paintPath = (op) => {
    const fill = 'fFbB'.includes(op[0]) || op === 'f*' || op === 'b*' || op === 'B*'
    const stroke = op[0] === 'S' || op[0] === 's' || 'bB'.includes(op[0])
    const closing = 'sb'.includes(op[0])
    const eo = op.endsWith('*')
    const lw = lwScaled(), dash = dashScaled(), doff = doffScaled()
    const nonRect = []
    for (const sub of st.path) {
      if (sub.rect) {
        const [rx, ry, rw, rh] = sub.rect
        const cs = [[rx, ry], [rx + rw, ry], [rx + rw, ry + rh], [rx, ry + rh]].map(([x, y]) => xf(x, y))
        const xs = cs.map((c) => c[0]), ys = cs.map((c) => c[1])
        ops.push({
          t: 'rect', x: Math.min(...xs), y: Math.min(...ys),
          w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys),
          fill, stroke, fc: st.fillC, sc: st.strokeC,
          a: stroke && !fill ? st.strokeA : st.fillA, lw, dash, doff,
        })
      } else nonRect.push(sub)
    }
    if (nonRect.length) {
      ops.push({
        t: 'path', segs: xformSegs(nonRect, closing), fill, stroke, eo,
        fc: st.fillC, sc: st.strokeC,
        a: stroke && !fill ? st.strokeA : st.fillA, lw, dash, doff,
      })
    }
    st.path.length = 0
    st.cur = null
  }

  const nums = (operands) => operands.filter((o) => typeof o === 'number').map(Number)

  for (const { op, operands } of tokenizeContent(data)) {
    switch (op) {
      case 'q':
        st.gstack.push({
          ctm: st.ctm, tm: st.tm, tlm: st.tlm,
          fillC: st.fillC, strokeC: st.strokeC, fillA: st.fillA, strokeA: st.strokeA,
          lw: st.lw, dash: st.dash, dashPhase: st.dashPhase,
        })
        break
      case 'Q': {
        const s = st.gstack.pop()
        if (s) ({
          ctm: st.ctm, tm: st.tm, tlm: st.tlm,
          fillC: st.fillC, strokeC: st.strokeC, fillA: st.fillA, strokeA: st.strokeA,
          lw: st.lw, dash: st.dash, dashPhase: st.dashPhase,
        } = s)
        while (st.clipLevels.length && st.clipLevels[st.clipLevels.length - 1] > st.gstack.length) {
          st.clipLevels.pop()
          ops.push({ t: 'unclip' })
        }
        break
      }
      case 'cm': if (operands.length === 6) st.ctm = matMul(st.ctm, operands.map(Number)); break
      case 'BT': st.tm = [1, 0, 0, 1, 0, 0]; st.tlm = [...st.tm]; break
      case 'ET': break
      case 'Tf': {
        const nm = operands.find((o) => o.t === 'name')
        const sz = operands.find((o) => typeof o === 'number')
        if (nm) st.curFont = nm.v
        if (sz !== undefined) st.fontSize = sz
        break
      }
      case 'Td': case 'TD': {
        const [tx, ty] = [Number(operands[0]) || 0, Number(operands[1]) || 0]
        if (op === 'TD') st.leading = -ty
        st.tlm = matMul(st.tlm, [1, 0, 0, 1, tx, ty])
        st.tm = [...st.tlm]
        break
      }
      case 'T*': st.tlm = matMul(st.tlm, [1, 0, 0, 1, 0, -st.leading]); st.tm = [...st.tlm]; break
      case 'TL': st.leading = Number(operands[0]) || 0; break
      case 'Tm': if (operands.length === 6) { st.tm = operands.map(Number); st.tlm = [...st.tm] } break
      case 'Tc': st.tc = Number(operands[0]) || 0; break
      case 'Tw': st.tw = Number(operands[0]) || 0; break
      case 'Tz': st.tz = (Number(operands[0]) || 100) / 100; break
      case 'Tr': st.tr = Number(operands[0]) || 0; break
      case 'Tj': case "'": case '"': {
        if (op === '"') {
          // " aw ac string — sets Tw and Tc, then behaves like '
          const ns = nums(operands)
          if (ns.length >= 2) { st.tw = ns[0]; st.tc = ns[1] }
        }
        if (op === "'" || op === '"') {
          st.tlm = matMul(st.tlm, [1, 0, 0, 1, 0, -st.leading]); st.tm = [...st.tlm]
        }
        const s = [...operands].reverse().find((o) => o.t === 'str')
        if (s) emitText(s.bytes)
        break
      }
      case 'TJ': {
        const arr = operands.find((o) => o.t === 'arr')
        if (!arr) break
        for (const it of arr.items) {
          if (it.t === 'str') emitText(it.bytes)
          else if (typeof it === 'number')
            st.tm = matMul(st.tm, [1, 0, 0, 1, (-it / 1000) * st.fontSize * st.tz, 0])
        }
        break
      }
      // ---- path construction ----
      case 'm': {
        const [x, y] = [Number(operands[0]) || 0, Number(operands[1]) || 0]
        st.path.push({ segs: [['M', x, y]] })
        st.cur = [x, y]
        break
      }
      case 'l': {
        if (!st.path.length) break
        const [x, y] = [Number(operands[0]) || 0, Number(operands[1]) || 0]
        st.path[st.path.length - 1].segs.push(['L', x, y])
        st.cur = [x, y]
        break
      }
      case 'c': {
        if (!st.path.length) break
        const n6 = nums(operands)
        if (n6.length < 6) break
        st.path[st.path.length - 1].segs.push(['C', ...n6.slice(0, 6)])
        st.cur = [n6[4], n6[5]]
        break
      }
      case 'v': {
        if (!st.path.length || !st.cur) break
        const n4 = nums(operands)
        if (n4.length < 4) break
        st.path[st.path.length - 1].segs.push(['C', st.cur[0], st.cur[1], ...n4.slice(0, 4)])
        st.cur = [n4[2], n4[3]]
        break
      }
      case 'y': {
        if (!st.path.length) break
        const n4 = nums(operands)
        if (n4.length < 4) break
        st.path[st.path.length - 1].segs.push(['C', n4[0], n4[1], n4[2], n4[3], n4[2], n4[3]])
        st.cur = [n4[2], n4[3]]
        break
      }
      case 'h': {
        if (st.path.length) st.path[st.path.length - 1].segs.push(['Z'])
        break
      }
      case 're': {
        const n4 = nums(operands)
        if (n4.length < 4) break
        const [rx, ry, rw, rh] = n4
        st.path.push({
          rect: [rx, ry, rw, rh],
          segs: [['M', rx, ry], ['L', rx + rw, ry], ['L', rx + rw, ry + rh], ['L', rx, ry + rh], ['Z']],
        })
        break
      }
      // ---- path painting / clipping ----
      case 'f': case 'F': case 'f*': case 'S': case 's': case 'B': case 'b': case 'B*': case 'b*':
        paintPath(op)
        break
      case 'W': case 'W*': {
        if (st.path.length) {
          ops.push({ t: 'clip', segs: xformSegs(st.path, true), eo: op === 'W*' })
          st.clipLevels.push(st.gstack.length)
        }
        break
      }
      case 'n': st.path.length = 0; st.cur = null; break
      // ---- color + graphics state ----
      case 'g': { const v = Number(operands[0]) || 0; st.fillC = [v, v, v]; break }
      case 'G': { const v = Number(operands[0]) || 0; st.strokeC = [v, v, v]; break }
      case 'rg': { const c = colorFrom(nums(operands).slice(0, 3)); if (c) st.fillC = c; break }
      case 'RG': { const c = colorFrom(nums(operands).slice(0, 3)); if (c) st.strokeC = c; break }
      case 'k': case 'K': {
        const c = colorFrom(nums(operands))
        if (c) op === 'k' ? (st.fillC = c) : (st.strokeC = c)
        break
      }
      case 'sc': case 'scn': { const c = colorFrom(nums(operands)); if (c) st.fillC = c; break }
      case 'SC': case 'SCN': { const c = colorFrom(nums(operands)); if (c) st.strokeC = c; break }
      case 'cs': case 'CS': break
      case 'w': {
        const w = Number(operands[0])
        if (Number.isFinite(w)) st.lw = w // 0 w is a real hairline, not 1
        break
      }
      case 'd': {
        const arr = operands.find((o) => o.t === 'arr')
        const phase = Number(operands.filter((o) => typeof o === 'number').pop() ?? 0)
        st.dash = arr
          ? arr.items.map(Number).filter((x) => Number.isFinite(x) && x >= 0)
          : null
        st.dashPhase = Number.isFinite(phase) ? phase : 0
        break
      }
      case 'gs': {
        const nm = operands.find((o) => o.t === 'name')
        let gd = res instanceof Map ? get(res, 'ExtGState') : null
        if (isRef(gd)) gd = deref(doc, gd)
        let e = gd instanceof Map && nm ? gd.get(nm.v) : null
        if (isRef(e)) e = deref(doc, e)
        if (e instanceof Map) {
          const ca = get(e, 'ca'), CA = get(e, 'CA')
          if (typeof ca === 'number') st.fillA = ca
          if (typeof CA === 'number') st.strokeA = CA
        }
        break
      }
      case 'Do': {
        const nm = [...operands].reverse().find((o) => o.t === 'name')
        if (!nm) break
        const xv = xoResolve(nm.v)
        if (!isStream(xv)) break
        const sub = get(xv.dict, 'Subtype')?.v
        if (sub === 'Image') {
          // cs[0..3] = unit quad corners (0,0)(1,0)(1,1)(0,1) in display space.
          // Anchor at cs[3] (image top-left); basis e1 = top edge, e2 = left
          // edge (down the bitmap) — captures rotation/mirror, not just bbox.
          const cs = [[0, 0], [1, 0], [1, 1], [0, 1]].map(([x, y]) => xf(x, y))
          const e1 = [cs[2][0] - cs[3][0], cs[2][1] - cs[3][1]]
          const e2 = [cs[0][0] - cs[3][0], cs[0][1] - cs[3][1]]
          ops.push({
            t: 'img', x: cs[3][0], y: cs[3][1],
            w: Math.hypot(...e1), h: Math.hypot(...e2),
            rot: Math.atan2(e1[1], e1[0]),
            mirror: e1[0] * e2[1] - e1[1] * e2[0] < 0,
            key: xoKey(nm.v), ref: xv, a: st.fillA,
          })
        } else if (sub === 'Form' && st.depth < 4) {
          const fm = get(xv.dict, 'Matrix')
          const fmat = Array.isArray(fm) && fm.length === 6 ? fm.map(Number) : [1, 0, 0, 1, 0, 0]
          // form content runs under an implied q/Q: snapshot the whole graphics
          // state — colors/alpha/dash, text state (a form's Tf/Tr/Tw would
          // otherwise leak into outer text), the in-progress path, and the
          // gstack itself (unbalanced q/Q inside a form must not corrupt ours)
          const saved = {
            ctm: st.ctm, tm: st.tm, tlm: st.tlm, curFont: st.curFont,
            leading: st.leading, fontSize: st.fontSize, tc: st.tc, tw: st.tw,
            tz: st.tz, tr: st.tr,
            fillC: st.fillC, strokeC: st.strokeC, fillA: st.fillA, strokeA: st.strokeA,
            lw: st.lw, dash: st.dash, dashPhase: st.dashPhase,
            path: st.path, cur: st.cur, gstack: st.gstack,
            clipLen: st.clipLevels.length,
          }
          st.ctm = matMul(st.ctm, fmat)
          // fresh path + gstack so the form can't touch the outer ones
          st.path = []
          st.cur = null
          st.gstack = []
          const bb = get(xv.dict, 'BBox')
          let clipped = false
          if (Array.isArray(bb) && bb.length === 4) {
            const [bx0, by0, bx1, by1] = bb.map(Number)
            const cs = [[bx0, by0], [bx1, by0], [bx1, by1], [bx0, by1]].map(([x, y]) => xf(x, y))
            ops.push({
              t: 'clip',
              segs: [['M', ...cs[0]], ['L', ...cs[1]], ['L', ...cs[2]], ['L', ...cs[3]], ['Z']],
            })
            clipped = true
          }
          st.depth++
          try {
            let subRes = get(xv.dict, 'Resources')
            if (isRef(subRes)) subRes = deref(doc, subRes)
            const merged = subRes instanceof Map
              ? new Map([...(res instanceof Map ? res : []), ...subRes])
              : res
            const subFonts = merged === res ? fonts : await fontMapFromRes(doc, merged)
            st.curFont = null
            const fdata = await streamData(xv).catch(() => null)
            if (fdata) await walkContent(doc, st, fdata, merged, subFonts)
          } finally {
            st.depth--
            // clips opened inside the form die with it
            while (st.clipLevels.length > saved.clipLen) {
              st.clipLevels.pop()
              ops.push({ t: 'unclip' })
            }
            ;({
              ctm: st.ctm, tm: st.tm, tlm: st.tlm, curFont: st.curFont,
              leading: st.leading, fontSize: st.fontSize, tc: st.tc, tw: st.tw,
              tz: st.tz, tr: st.tr,
              fillC: st.fillC, strokeC: st.strokeC, fillA: st.fillA, strokeA: st.strokeA,
              lw: st.lw, dash: st.dash, dashPhase: st.dashPhase,
            } = saved)
            st.path = saved.path
            st.cur = saved.cur
            st.gstack = saved.gstack
            if (clipped) ops.push({ t: 'unclip' })
          }
        }
        break
      }
    }
  }
}

// ---------- extract images ----------

/** Undo PNG/TIFF predictors on inflated image data (DecodeParms). */
function unPredict(data, { predictor = 1, columns = 1, colors = 1, bpc = 8 }) {
  if (predictor === 1) return data
  const bpp = Math.max(1, Math.ceil((colors * bpc) / 8))
  const rowBytes = Math.ceil((columns * colors * bpc) / 8)
  if (predictor === 2) {
    const out = new Uint8Array(data.length)
    for (let y = 0; y * rowBytes < data.length; y++) {
      const row = y * rowBytes
      for (let x = 0; x < rowBytes; x++) {
        const left = x >= bpp ? out[row + x - bpp] : 0
        out[row + x] = (data[row + x] + left) & 0xff
      }
    }
    return out
  }
  if (predictor < 10 || predictor > 15) throw new Error(`unsupported predictor ${predictor}`)
  const hasFilterByte = predictor >= 10
  const rowStride = rowBytes + (hasFilterByte ? 1 : 0)
  const rows = Math.floor(data.length / rowStride)
  const out = new Uint8Array(rows * rowBytes)
  const paeth = (a, b, c) => {
    const p = a + b - c
    const pa = Math.abs(p - a), pb = Math.abs(p - b), pc = Math.abs(p - c)
    return pa <= pb && pa <= pc ? a : pb <= pc ? b : c
  }
  for (let y = 0; y < rows; y++) {
    const src = y * rowStride + (hasFilterByte ? 1 : 0)
    const f = hasFilterByte ? data[y * rowStride] : 1 // Optimum → sub? spec: treated as per-row
    const prev = y > 0 ? (y - 1) * rowBytes : -1
    for (let x = 0; x < rowBytes; x++) {
      const a = x >= bpp ? out[y * rowBytes + x - bpp] : 0
      const b = prev >= 0 ? out[prev + x] : 0
      const c = x >= bpp && prev >= 0 ? out[prev + x - bpp] : 0
      let v = data[src + x]
      if (f === 1) v += a
      else if (f === 2) v += b
      else if (f === 3) v += (a + b) >> 1
      else if (f === 4) v += paeth(a, b, c)
      out[y * rowBytes + x] = v & 0xff
    }
  }
  return out
}

/**
 * Pull embedded images out of a PDF.
 * Returns { images: [{name, data, w, h}], skipped } — DCTDecode→.jpg,
 * JPXDecode→.jp2, FlateDecode raw RGB/gray 8-bit→.png, else counted in skipped.
 */
/**
 * Decode one image XObject stream → {data, mime, ext} or null when unsupported.
 * Applies the full /Filter chain in order; a trailing image codec (DCT/JPX)
 * names the format, everything else is unwrapped as compression.
 */
async function decodeImageStream(doc, v) {
  const w = get(v.dict, 'Width') ?? 0
  const h = get(v.dict, 'Height') ?? 0
  const filterVal = get(v.dict, 'Filter')
  const chain = (Array.isArray(filterVal) ? filterVal : filterVal === undefined ? [] : [filterVal]).map(
    (fl) => (isName(fl) ? fl.v : null),
  )
  const codec = { DCTDecode: ['.jpg', 'image/jpeg'], DCT: ['.jpg', 'image/jpeg'], JPXDecode: ['.jp2', 'image/jp2'], JPX: ['.jp2', 'image/jp2'] }
  const last = chain.length ? chain[chain.length - 1] : null
  const out = last ? codec[last] : undefined
  const decodeChain = out ? chain.slice(0, -1) : chain
  let data = v.data
  for (const fl of decodeChain) {
    if (fl === 'FlateDecode' || fl === 'Fl') data = await inflate(data)
    else return null
  }
  if (out) return { data, mime: out[1], ext: out[0] }
  // anything left in decodeChain is Flate by now — non-Flate returns above
  const bpc = get(v.dict, 'BitsPerComponent') ?? 8
  let cs = get(v.dict, 'ColorSpace')
  if (isRef(cs)) cs = deref(doc, cs)
  const csName = isName(cs) ? cs.v : Array.isArray(cs) && isName(cs[0]) ? cs[0].v : null
  if (bpc !== 8 || (csName !== 'DeviceRGB' && csName !== 'DeviceGray')) return null
  const colors = csName === 'DeviceRGB' ? 3 : 1
  let dp = get(v.dict, 'DecodeParms') ?? get(v.dict, 'DP')
  if (Array.isArray(dp)) dp = [...dp].reverse().find((x) => x instanceof Map)
  const parms = dp instanceof Map ? {
    predictor: get(dp, 'Predictor') ?? 1,
    columns: get(dp, 'Columns') ?? w,
    colors: get(dp, 'Colors') ?? colors,
    bpc: get(dp, 'BitsPerComponent') ?? 8,
  } : { predictor: 1, columns: w, colors, bpc: 8 }
  const raw = unPredict(data, parms)
  if (raw.length !== w * h * colors) return null
  return { data: pngEncode(w, h, raw, colors === 1), mime: 'image/png', ext: '.png' }
}

/**
 * Pull embedded images out of a PDF.
 * Returns { images: [{name, data, w, h, mime}], skipped }.
 */
async function extractImages(bytes) {
  const doc = await parsePdf(bytes)
  const images = []
  let skipped = 0
  let i = 0
  for (const { v } of doc.objects.values()) {
    if (!isStream(v) || get(v.dict, 'Subtype')?.v !== 'Image') continue
    i++
    const w = get(v.dict, 'Width') ?? 0
    const h = get(v.dict, 'Height') ?? 0
    const dec = await decodeImageStream(doc, v).catch(() => null)
    if (dec) images.push({ name: `image-${i}-${w}x${h}${dec.ext}`, data: dec.data, w, h, mime: dec.mime, hash: crc32(dec.data) >>> 0 })
    else skipped++
  }
  return { images, skipped }
}

/**
 * Canvas painter for collectDrawOps output — browser-side only.
 * renderPage() walks a page's content stream and paints a miniature:
 * images at their painted rects, real text where decodable & large enough,
 * skeleton bars elsewhere, table/box fills as light rects.
 */

/** Decode an image XObject once per doc → ImageBitmap (cached by stream object). */
async function cachedBitmap(doc, ref, cache) {
  if (!cache.has(ref)) {
    cache.set(ref, (async () => {
      const dec = await decodeImageStream(doc, ref).catch(() => null)
      if (!dec) return null
      return createImageBitmap(new Blob([dec.data], { type: dec.mime })).catch(() => null)
    })())
  }
  return cache.get(ref)
}

/**
 * Render a page to a canvas element.
 * width: target pixel width. cache: Map shared across pages of one doc
 * (letterhead/logo images decode once). Returns null for empty pages.
 */
async function renderPage(doc, leaf, { width = 160, cache = new Map() } = {}) {
  const { ops, box } = await collectDrawOps(doc, leaf)
  if (!ops.length) return null
  const scale = width / box.w
  const canvas = document.createElement('canvas')
  canvas.width = Math.max(2, Math.round(box.w * scale))
  canvas.height = Math.max(2, Math.round(box.h * scale))
  const ctx = canvas.getContext('2d')
  ctx.fillStyle = '#ffffff'
  ctx.fillRect(0, 0, canvas.width, canvas.height)

  const s = (v) => v * scale
  const rgba = (c, a = 1) => `rgba(${Math.round(c[0] * 255)},${Math.round(c[1] * 255)},${Math.round(c[2] * 255)},${a})`
  const trace = (segs) => {
    ctx.beginPath()
    for (const seg of segs) {
      if (seg[0] === 'M') ctx.moveTo(s(seg[1]), s(seg[2]))
      else if (seg[0] === 'L') ctx.lineTo(s(seg[1]), s(seg[2]))
      else if (seg[0] === 'C') ctx.bezierCurveTo(s(seg[1]), s(seg[2]), s(seg[3]), s(seg[4]), s(seg[5]), s(seg[6]))
      else if (seg[0] === 'Z') ctx.closePath()
    }
  }
  const paintShape = (op, run) => {
    if (op.fill) {
      ctx.fillStyle = rgba(op.fc ?? [0.8, 0.85, 0.92], (op.a ?? 1) * 0.9)
      run.fill(op.eo ? 'evenodd' : 'nonzero')
    }
    if (op.stroke) {
      ctx.strokeStyle = rgba(op.sc ?? [0.45, 0.5, 0.6], op.a ?? 1)
      ctx.lineWidth = Math.max(0.5, s(op.lw ?? 1))
      if (op.dash) {
        ctx.setLineDash(op.dash.map((d) => d * scale))
        ctx.lineDashOffset = s(op.doff ?? 0)
      }
      run.stroke()
      ctx.setLineDash([])
      ctx.lineDashOffset = 0
    }
  }
  for (const op of ops) {
    if (op.t === 'clip') {
      ctx.save()
      trace(op.segs)
      ctx.clip(op.eo ? 'evenodd' : 'nonzero')
    } else if (op.t === 'unclip') {
      ctx.restore()
    } else if (op.t === 'rect') {
      ctx.beginPath()
      ctx.rect(s(op.x), s(op.y), s(op.w), s(op.h))
      paintShape(op, {
        fill: (r) => ctx.fill(r),
        stroke: () => ctx.stroke(),
      })
    } else if (op.t === 'path') {
      trace(op.segs)
      paintShape(op, {
        fill: (r) => ctx.fill(r),
        stroke: () => ctx.stroke(),
      })
    } else if (op.t === 'img') {
      const bmp = await cachedBitmap(doc, op.ref, cache)
      if (!bmp) continue
      ctx.save()
      ctx.globalAlpha = (op.a ?? 1) * 0.92
      ctx.translate(s(op.x), s(op.y))
      if (op.rot) ctx.rotate(op.rot)
      if (op.mirror) ctx.scale(1, -1)
      ctx.drawImage(bmp, 0, 0, s(op.w), s(op.h))
      ctx.restore()
    } else if (op.t === 'text') {
      if (op.inv) continue // invisible OCR layer — extractable but not painted
      const px = op.h * scale
      ctx.save()
      ctx.translate(s(op.x), s(op.y))
      if (op.rot) ctx.rotate(op.rot)
      if (op.str && op.size * scale >= 4) {
        ctx.fillStyle = rgba(op.fc ?? [0.15, 0.2, 0.3], (op.a ?? 1) * 0.9)
        ctx.font = `${px}px sans-serif`
        ctx.textBaseline = 'alphabetic'
        ctx.fillText(op.str, 0, 0)
      } else {
        // skeleton bar — text run too small/undecodable: ink density block
        ctx.fillStyle = 'rgba(71,85,105,0.55)'
        const bh = Math.max(0.8, op.h * scale * 0.72)
        ctx.fillRect(0, -bh, Math.max(1, s(op.w)), bh)
      }
      ctx.restore()
    }
  }
  return canvas
}

// Tiny DOM helper — h(tag, attrs, ...children). No framework, no build.

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs ?? {})) {
    if (v === undefined || v === null) continue
    if (k === 'class') el.className = v
    else if (k === 'dataset') Object.assign(el.dataset, v)
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v)
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v)
    else if (v === true) el.setAttribute(k, '')
    else el.setAttribute(k, v)
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue
    el.append(kid?.nodeType ? kid : document.createTextNode(String(kid)))
  }
  return el
}

function icon(name, cls = 'icon') {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
  svg.setAttribute('viewBox', name === 'github' ? '0 0 16 16' : '0 0 24 24')
  svg.setAttribute('class', cls)
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path')
  p.setAttribute('d', ICONS[name])
  if (name === 'github') p.setAttribute('fill', 'currentColor')
  else {
    p.setAttribute('fill', 'none')
    p.setAttribute('stroke', 'currentColor')
    p.setAttribute('stroke-width', '1.8')
    p.setAttribute('stroke-linecap', 'round')
    p.setAttribute('stroke-linejoin', 'round')
  }
  svg.append(p)
  return svg
}

// replaceChildren converts null/undefined args into literal "null" text nodes —
// always re-render through this instead.
function setKids(el, ...kids) {
  el.replaceChildren(...kids.filter((k) => k !== null && k !== undefined && k !== false))
}

function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob)
  const a = h('a', { href: url, download: name })
  a.click()
  setTimeout(() => URL.revokeObjectURL(url), 10_000)
}

const readBytes = async (file) => new Uint8Array(await file.arrayBuffer())

function fmtBytes(n) {
  if (n < 1024) return `${n} B`
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`
  return `${(n / 1024 / 1024).toFixed(1)} MB`
}

/**
 * File drop zone — a <label> wrapping a hidden input, so clicking it opens the
 * file dialog NATIVELY. Zero JS involved in opening the picker (no recursion
 * bugs possible). Drag & drop handled separately.
 */
function DropZone({ accept, multiple = false, onFiles, label }) {
  const input = h('input', {
    type: 'file',
    accept,
    multiple: multiple || undefined,
    class: 'hidden-input',
    onchange: (e) => {
      const files = [...e.target.files]
      if (files.length) onFiles(files)
      e.target.value = ''
    },
  })

  const zone = h(
    'label',
    {
      class: 'dropzone',
      tabindex: '0',
      role: 'button',
      onclick: (e) => {
        if (e.target === input) return // our own input.click() bubbling up — don't loop
        e.preventDefault() // kill native label forwarding; JS path opens exactly one dialog
        input.click()
      },
      onkeydown: (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault()
          input.click()
        }
      },
    },
    input,
    icon('upload', 'icon-lg dim'),
    h('span', { class: 'dz-text' }, label ?? `Drop ${multiple ? 'files' : 'a file'} here or `, h('em', {}, 'browse')),
  )

  zone.addEventListener('dragover', (e) => {
    e.preventDefault()
    zone.classList.add('over')
  })
  zone.addEventListener('dragleave', () => zone.classList.remove('over'))
  zone.addEventListener('drop', (e) => {
    e.preventDefault()
    zone.classList.remove('over')
    const files = [...e.dataTransfer.files]
    if (files.length) onFiles(files)
  })
  return zone
}

/**
 * Ordered file list — drag-to-reorder + move-up/down + remove.
 * Each item may carry .meta (extra info line, e.g. page count) and .err.
 */
function FileList({ files, onMove, onRemove }) {
  let dragIdx = null
  const list = h('ul', { class: 'filelist' })
  files.forEach((f, i) => {
    const li = h(
      'li',
      {
        draggable: 'true',
        ondragstart: (e) => {
          dragIdx = i
          e.dataTransfer.effectAllowed = 'move'
          e.dataTransfer.setData('text/plain', '') // required for drag to fire
        },
        ondragend: () => {
          dragIdx = null
          list.querySelectorAll('li').forEach((x) => x.classList.remove('target'))
        },
        ondragover: (e) => {
          e.preventDefault()
          li.classList.add('target')
        },
        ondragleave: () => li.classList.remove('target'),
        ondrop: (e) => {
          e.preventDefault()
          li.classList.remove('target')
          if (dragIdx !== null && dragIdx !== i) onMove(dragIdx, i)
        },
      },
      f.thumbNode
        ? f.thumbNode
        : f.thumb
          ? h('img', { class: 'thumb', src: f.thumb, alt: '' })
          : h('span', { class: 'idx' }, String(i + 1)),
      h('span', { class: 'fname' }, f.name, f.meta ? h('span', { class: 'fmeta' }, f.meta) : null),
      f.err ? h('span', { class: 'ferr' }, f.err) : h('span', { class: 'fsize' }, fmtBytes(f.size)),
      f.onExpand ? iconBtn('grid', 'Show pages', (e) => { e.stopPropagation(); f.onExpand() }) : null,
      iconBtn('up', 'Move up', () => onMove(i, i - 1), i === 0),
      iconBtn('down', 'Move down', () => onMove(i, i + 1), i === files.length - 1),
      iconBtn('x', 'Remove', () => onRemove(i)),
    )
    if (f.detail) li.append(h('div', { class: 'fdetail' }, f.detail))
    list.append(li)
  })
  return list
}

function iconBtn(iconName, title, onclick, disabled = false) {
  return h(

    icon(iconName, 'icon-sm'),

}

/**
 * Page-card grid for Organize — drag-reorder, rotate ±90°, delete/restore,
 * click/shift select, insertion-line drop indicator, zoom on demand.
 * items: [{page, w, h, rotation, deleted, canvas?, imgUrl?, text?}]
 */
function PageGrid({ items, onReorder, onRotate, onToggleDelete, selected, onSelect, onZoom }) {
  let dragIdx = null
  const grid = h('div', { class: 'pgrid' })

  const clearMarks = () => grid.querySelectorAll('.pcard').forEach((c) => c.classList.remove('target', 'drop-before', 'drop-after'))

  items.forEach((it, i) => {
    const card = h(
      'div',
      {
        class: 'pcard' + (it.deleted ? ' deleted' : '') + (selected?.has(it) ? ' sel' : ''),
        style: { aspectRatio: it.w && it.h ? `${it.w} / ${it.h}` : '3 / 4' },
        draggable: 'true',
        onclick: onSelect ? (e) => onSelect(i, e.shiftKey) : undefined,
        ondragstart: (e) => {
          dragIdx = i
          e.dataTransfer.effectAllowed = 'move'
          e.dataTransfer.setData('text/plain', '') // required for drag to fire
        },
        ondragend: () => {
          dragIdx = null
          clearMarks()
        },
        ondragover: (e) => {
          e.preventDefault()
          clearMarks()
          const r = card.getBoundingClientRect()
          const after = e.clientX > r.left + r.width / 2
          card.classList.add(after ? 'drop-after' : 'drop-before')
        },
        ondragleave: () => card.classList.remove('drop-before', 'drop-after'),
        ondrop: (e) => {
          e.preventDefault()
          const r = card.getBoundingClientRect()
          const after = e.clientX > r.left + r.width / 2
          clearMarks()
          if (dragIdx === null) return
          let to = after ? i + 1 : i
          if (dragIdx < to) to--
          if (to !== dragIdx) onReorder(dragIdx, to)
        },
      },
      h('div', { class: 'pbody' },
        it.canvas ?? (it.imgUrl
          ? h('img', { class: 'pthumb', src: it.imgUrl, alt: '', draggable: 'false' })
          : it.text
            ? h('div', { class: 'ptext' }, it.text)
            : null),
        h('div', { class: 'pnum' }, `p${it.page}`),
        h('div', { class: 'pdim' }, `${it.w}×${it.h}`),
        it.rotation ? h('div', { class: 'prot' }, `${it.rotation}°`) : null,
      ),
      onSelect && selected?.has(it) ? h('div', { class: 'pchk' }, icon('check', 'icon-sm')) : null,
      h(
        'div',
        { class: 'pops' },
        onZoom ? iconBtn('zoom', 'View page', (e) => { e.stopPropagation(); onZoom(i) }) : null,
        iconBtn('rotl', 'Rotate −90°', (e) => { e.stopPropagation(); onRotate(i, -90) }),
        iconBtn('rotate', 'Rotate +90°', (e) => { e.stopPropagation(); onRotate(i, 90) }),
        iconBtn(it.deleted ? 'undo' : 'x', it.deleted ? 'Restore' : 'Delete', (e) => { e.stopPropagation(); onToggleDelete(i) }),
      ),
    )
    grid.append(card)
  })
  return grid
}

function openLightbox(node, caption = '') {
  const onKey = (e) => { if (e.key === 'Escape') close() }
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey) }
  const ov = h(
    'div',
    { class: 'lightbox', onclick: (e) => { if (e.target === ov) close() } },
    h('div', { class: 'lb-box' }, node, caption ? h('div', { class: 'lb-cap' }, caption) : null),
  )
  document.addEventListener('keydown', onKey)
  document.body.append(ov)
  return close
}

/**
 * Metadata preview table for Scrub — shows exactly what will be wiped.
 * meta: {fields: [{key, value}], xmp, id}
 */
function MetaTable({ fields, xmp, id }) {
  const rows = fields.map((f) =>
    h('tr', {}, h('td', { class: 'mkey' }, f.key), h('td', { class: 'mval' }, f.value)),
  )
  if (xmp) rows.push(h('tr', {}, h('td', { class: 'mkey' }, 'XMP stream'), h('td', { class: 'mval' }, 'embedded metadata packet')))
  if (id) rows.push(h('tr', {}, h('td', { class: 'mkey' }, 'Document ID'), h('td', { class: 'mval' }, 'unique fingerprint in trailer')))
  if (!rows.length) return h('p', { class: 'meta dim' }, 'No metadata found — this file is already clean.')
  return h('table', { class: 'mtable' }, h('tbody', {}, rows))
}

/** Small text-button toolbar row (Organize bulk actions). */
function Toolbar(actions) {
  return h(
    'div',
    { class: 'toolbar' },
    actions.map(([label, onclick, disabled]) =>
      h('button', { type: 'button', class: 'tbtn', onclick, disabled: disabled || undefined }, label),
    ),
  )
}

// ---- src/tools/merge.js ----

function Merge() {
  let files = [] // {file, bytes, pages, doc, leaves, thumbNode, expanded, detail}
  let busy = false
  let error = ''
  let outName = 'merged'
  const root = h('div', { class: 'tool' })

  const add = async (incoming) => {
    for (const f of incoming) {
      const entry = {
        name: f.name, size: f.size, file: f,
        bytes: null, pages: null, doc: null, leaves: null, cache: new Map(),
        thumbNode: null, expanded: false, detail: null,
        meta: 'reading…', err: null,
      }
      entry.onExpand = () => expand(entry)
      files.push(entry)
      render()
      try {
        const bytes = await readBytes(f)
        entry.bytes = bytes
        const doc = await parsePdf(bytes)
        entry.doc = doc
        entry.leaves = pageLeaves(doc)
        entry.pages = entry.leaves.length
        entry.meta = `${entry.pages} page${entry.pages === 1 ? '' : 's'}`
        try {
          const canvas = await renderPage(doc, entry.leaves[0], { width: 72, cache: entry.cache })
          if (canvas) { canvas.className = 'thumb pcanvas-sm'; entry.thumbNode = canvas }
        } catch { /* no thumbnail — row keeps index */ }
      } catch {
        entry.err = 'not a readable PDF'
        entry.meta = ''
      }
      render()
    }
  }

  const expand = async (entry) => {
    entry.expanded = !entry.expanded
    if (!entry.expanded || !entry.leaves) { entry.detail = null; render(); return }
    const strip = h('div', { class: 'pstrip' }, h('span', { class: 'meta dim' }, 'rendering…'))
    entry.detail = strip
    render()
    for (let i = 0; i < entry.leaves.length; i++) {
      if (!entry.expanded) return // collapsed while rendering
      try {
        const c = await renderPage(entry.doc, entry.leaves[i], { width: 64, cache: entry.cache })
        if (c) {
          c.className = 'pcanvas-sm'
          c.title = `page ${i + 1}`
          strip.append(h('div', { class: 'pstrip-cell' }, c, h('span', { class: 'pstrip-n' }, `${i + 1}`)))
          if (i === 0) strip.firstChild.remove() // drop "rendering…"
        }
      } catch { /* skip page */ }
    }
    if (!strip.querySelectorAll('canvas').length) setKids(strip, h('span', { class: 'meta dim' }, 'no renderable pages'))
  }

  const move = (from, to) => {
    const c = [...files]
    const [x] = c.splice(from, 1)
    c.splice(to, 0, x)
    files = c
    render()
  }

  const run = async () => {
    busy = true
    error = ''
    render()
    try {
      const bad = files.find((f) => !f.bytes)
      if (bad) throw new Error(`"${bad.file.name}" isn't a readable PDF — remove it`)
      const out = await mergePdfs(files.map((f) => f.bytes))
      const name = (outName.trim() || 'merged').replace(/\.pdf$/i, '')
      saveBlob(new Blob([out], { type: 'application/pdf' }), `${name}.pdf`)
    } catch (e) {
      error = e.message || 'merge failed'
    } finally {
      busy = false
      render()
    }
  }

  function render() {
    const good = files.filter((f) => f.bytes)
    const total = good.reduce((n, f) => n + (f.pages || 0), 0)
    const estSize = good.reduce((n, f) => n + f.size, 0)
    setKids(root,
      DropZone({
        accept: 'application/pdf',
        multiple: true,
        onFiles: add,
        label: files.length ? 'Drop more PDFs to add them or ' : undefined,
      }),
      files.length
        ? Card(
            FileList({ files, onMove: move, onRemove: (i) => { files = files.filter((_, j) => j !== i); render() } }),
            h('p', { class: 'meta dim', style: { marginTop: '10px' } },
              `Drag to reorder · ${good.length} valid · ${total} pages total · ~${fmtBytes(estSize)} output`),
          )
        : null,
      files.length
        ? Card(
            h('label', { class: 'lbl' }, 'Output filename'),
            h('input', {
              class: 'textin', value: outName, placeholder: 'merged',
              oninput: (e) => (outName = e.target.value),
            }),
          )
        : null,
      ErrorText(error),
      Btn(busy ? 'Merging…' : `Merge ${good.length} PDFs · ${total} pages`, {
        onclick: run,
        disabled: busy || good.length < 2 || good.length !== files.length,
      }),
    )
  }
  render()
  return root
}

// ---- src/tools/split.js ----

/** Selected set → "1-3, 5" spec string. */
const selToSpec = (sel) => {
  const pgs = [...sel].sort((a, b) => a - b)
  const parts = []
  for (let i = 0; i < pgs.length; i++) {
    let j = i
    while (j + 1 < pgs.length && pgs[j + 1] === pgs[j] + 1) j++
    parts.push(pgs[i] === pgs[j] ? `${pgs[i]}` : `${pgs[i]}-${pgs[j]}`)
    i = j
  }
  return parts.join(', ')
}

function Split() {
  let file = null
  let bytes = null
  let doc = null
  let leaves = []
  let items = [] // {page, w, h, canvas, imgUrl, text}
  let selected = new Set()
  let lastPick = null // for shift-click ranges
  let spec = ''
  let specOK = true
  let mode = 'one'
  let busy = false
  let error = ''
  let loadGen = 0
  let urls = []
  const imgCache = new Map()
  const root = h('div', { class: 'tool' })

  const load = async ([f]) => {
    const my = ++loadGen
    error = ''
    file = f
    items = []
    selected = new Set()
    lastPick = null
    spec = ''
    specOK = true
    imgCache.clear()
    for (const u of urls) URL.revokeObjectURL(u)
    urls = []
    render()
    try {
      const b = await readBytes(f)
      if (my !== loadGen) return
      const d = await parsePdf(b)
      if (my !== loadGen) return
      bytes = b
      doc = d
      leaves = pageLeaves(d)
      const dims = pageDims(d)
      items = dims.map((d2, i) => ({ page: i + 1, w: d2.w, h: d2.h, canvas: null, imgUrl: null, text: '' }))
      selected = new Set(items.map((i) => i.page))
      spec = selToSpec(selected)
      render()
      leaves.forEach(async (leaf, i) => {
        try {
          const canvas = await renderPage(d, leaf, { width: 200, cache: imgCache })
          if (my !== loadGen) return
          if (canvas) {
            canvas.className = 'pcanvas'
            items[i].canvas = canvas
          } else {
            const pv = await pagePreview(d, leaf)
            if (my !== loadGen) return
            if (pv.img) {
              items[i].imgUrl = URL.createObjectURL(new Blob([pv.img.data], { type: pv.img.mime }))
              urls.push(items[i].imgUrl)
            } else {
              items[i].text = pv.text
            }
          }
          render()
        } catch { /* card keeps dims */ }
      })
    } catch (e) {
      if (my !== loadGen) return
      error = e.message || 'could not read that PDF'
      file = null
      bytes = null
      doc = null
    }
    render()
  }

  const zoom = async (page) => {
    try {
      const it = items[page - 1]
      const canvas = await renderPage(doc, leaves[page - 1], { width: Math.min(860, it.w * 1.5), cache: imgCache })
      if (canvas) openLightbox(canvas, `page ${page} · ${it.w}×${it.h}pt`)
    } catch { /* no preview */ }
  }

  const toggle = (page, shift) => {
    if (shift && lastPick !== null) {
      const [a, b] = lastPick < page ? [lastPick, page] : [page, lastPick]
      for (let p = a; p <= b; p++) selected.add(p)
    } else {
      selected.has(page) ? selected.delete(page) : selected.add(page)
    }
    lastPick = page
    spec = selToSpec(selected)
    specOK = true
    render()
  }

  const preset = (kind) => {
    selected = new Set(
      kind === 'all' ? items.map((i) => i.page)
      : kind === 'none' ? []
      : items.filter((i) => (kind === 'odd') === (i.page % 2 === 1)).map((i) => i.page),
    )
    lastPick = null
    spec = selToSpec(selected)
    specOK = true
    render()
  }

  let gridEl = null
  let btnEl = null

  const onSpec = (v) => {
    spec = v
    try {
      selected = new Set(parseRanges(v, items.length).flatMap(({ from, to }) =>
        Array.from({ length: to - from + 1 }, (_, i) => from + i)))
      specOK = true
    } catch {
      specOK = false // leave cards as-is until the spec parses
    }
    if (btnEl) btnEl.disabled = busy || !specOK || !selected.size
    // hot-swap only the grid — full render() would nuke input focus mid-typing
    if (specOK && gridEl) {
      const fresh = SelectGrid({ items, selected, onToggle: toggle, onZoom: zoom })
      gridEl.replaceWith(fresh)
      gridEl = fresh
    }
  }

  const run = async () => {
    busy = true
    error = ''
    render()
    try {
      const stem = file.name.replace(/\.pdf$/i, '')
      if (mode === 'one') {
        const ranges = parseRanges(spec, items.length)
        const out = await extractPages(bytes, ranges)
        saveBlob(new Blob([out], { type: 'application/pdf' }), `${stem}-pages.pdf`)
      } else if (mode === 'each') {
        const pgs = [...selected].sort((a, b) => a - b)
        const outs = await splitPdf(bytes, pgs.map((p) => ({ from: p, to: p })))
        saveBlob(
          new Blob([zipStore(outs.map((out, i) => ({
            name: `${stem}-p${pgs[i]}.pdf`,
            data: out,
          })))], { type: 'application/zip' }),
          `${stem}-pages.zip`,
        )
      } else {
        const ranges = parseRanges(spec, items.length)
        const outs = await splitPdf(bytes, ranges)
        saveBlob(
          new Blob([zipStore(outs.map((out, i) => ({
            name: `${stem}-${ranges[i].from}-${ranges[i].to}.pdf`,
            data: out,
          })))], { type: 'application/zip' }),
          `${stem}-split.zip`,
        )
      }
    } catch (e) {
      error = e.message || 'split failed'
    } finally {
      busy = false
      render()
    }
  }

  const radio = (val, text) =>
    h(
      'label',
      { class: 'radio' },
      h('input', {
        type: 'radio',
        name: 'splitmode',
        checked: mode === val || undefined,
        onchange: () => { mode = val; render() },
      }),
      text,
    )

  function render() {
    setKids(root,
      DropZone({ accept: 'application/pdf', onFiles: load }),
      file
        ? Card(
            h('p', { class: 'meta' }, h('b', {}, file.name), ` — ${items.length} pages`),
            h('p', { class: 'meta dim' }, 'Click pages to pick them · shift-click selects a range'),
            Toolbar([
              ['All', () => preset('all')],
              ['None', () => preset('none')],
              ['Odd pages', () => preset('odd')],
              ['Even pages', () => preset('even')],
            ]),
          )
        : null,
      items.length ? (gridEl = SelectGrid({ items, selected, onToggle: toggle, onZoom: zoom })) : null,
      file
        ? Card(
            h('label', { class: 'lbl' }, 'Ranges (synced with your picks — edit either)'),
            h('input', {
              class: 'textin',
              value: spec,
              oninput: (e) => onSpec(e.target.value),
            }),
            h(
              'div',
              { class: 'radio-row' },
              radio('one', 'One PDF with those pages'),
              radio('zip', 'Separate PDF per range (zip)'),
              radio('each', 'One PDF per selected page (zip)'),
            ),
          )
        : null,
      ErrorText(error),
      file
        ? (btnEl = Btn(
            busy ? 'Working…' : `Extract ${selected.size} page${selected.size === 1 ? '' : 's'}`,
            { onclick: run, disabled: busy || !specOK || !selected.size },
          ))
        : (btnEl = null),
    )
  }
  render()
  return root
}

// ---- src/tools/organize.js ----

/** Copy a rendered canvas (cloneNode doesn't carry the bitmap). */
const cloneCanvas = (src) => {
  const c = document.createElement('canvas')
  c.width = src.width
  c.height = src.height
  c.getContext('2d').drawImage(src, 0, 0)
  c.className = src.className
  c.draggable = false
  return c
}

function Organize() {
  let file = null
  let bytes = null
  let doc = null
  let leaves = []
  let items = [] // {page, w, h, rotation, deleted, canvas, imgUrl, text}
  let sel = new Set() // selected item objects (identity survives reorder)
  let lastIdx = null // shift-click anchor
  let moveTo = 1
  let urls = []
  let history = [] // undo stack of item-list snapshots
  let busy = false
  let error = ''
  let loadGen = 0
  const imgCache = new Map() // shared decode cache across pages of this doc
  const root = h('div', { class: 'tool' })

  const load = async ([f]) => {
    const my = ++loadGen
    error = ''
    file = f
    items = []
    sel = new Set()
    lastIdx = null
    history = []
    imgCache.clear()
    for (const u of urls) URL.revokeObjectURL(u)
    urls = []
    render()
    try {
      const b = await readBytes(f)
      if (my !== loadGen) return
      const d = await parsePdf(b)
      if (my !== loadGen) return
      bytes = b
      doc = d
      leaves = pageLeaves(d)
      items = leaves.map((leaf, i) => {
        const mb = get(leaf.dict, 'MediaBox') ?? leaf.inh.MediaBox ?? [0, 0, 0, 0]
        return {
          page: i + 1,
          w: Math.round(mb[2] - mb[0]),
          h: Math.round(mb[3] - mb[1]),
          rotation: 0,
          deleted: false,
          canvas: null,
          imgUrl: null,
          text: '',
        }
      })
      render()
      // fill previews progressively: real mini-render first, image/text fallback
      leaves.forEach(async (leaf, i) => {
        try {
          const canvas = await renderPage(d, leaf, { width: 200, cache: imgCache })
          if (my !== loadGen) return
          if (canvas) {
            canvas.className = 'pcanvas'
            canvas.draggable = false
            items[i].canvas = canvas
          } else {
            const pv = await pagePreview(d, leaf)
            if (my !== loadGen) return
            if (pv.img) {
              items[i].imgUrl = URL.createObjectURL(new Blob([pv.img.data], { type: pv.img.mime }))
              urls.push(items[i].imgUrl)
            } else {
              items[i].text = pv.text
            }
          }
          render()
        } catch { /* card keeps dims */ }
      })
    } catch (e) {
      if (my !== loadGen) return
      error = e.message || 'could not read that PDF'
      file = null
      bytes = null
      doc = null
    }
    render()
  }

  const mutate = (fn) => {
    history.push([...items])
    if (history.length > 50) history.shift()
    fn()
    render()
  }

  const undo = () => {
    if (!history.length) return
    items = history.pop()
    sel = new Set([...sel].filter((x) => items.includes(x)))
    render()
  }

  const onSelect = (i, shift) => {
    if (shift && lastIdx !== null) {
      const [a, b] = lastIdx < i ? [lastIdx, i] : [i, lastIdx]
      for (let k = a; k <= b; k++) sel.add(items[k])
    } else {
      sel.has(items[i]) ? sel.delete(items[i]) : sel.add(items[i])
    }
    lastIdx = i
    render()
  }

  const applySel = (fn) => mutate(() => { items = items.map((x) => (sel.has(x) ? fn(x) : x)) })

  const moveSelected = (where) => mutate(() => {
    const picked = items.filter((x) => sel.has(x))
    const rest = items.filter((x) => !sel.has(x))
    if (!picked.length) return
    if (where === 'front') items = [...picked, ...rest]
    else if (where === 'back') items = [...rest, ...picked]
    else {
      const idx = Math.max(0, Math.min(rest.length, moveTo - 1))
      items = [...rest.slice(0, idx), ...picked, ...rest.slice(idx)]
    }
  })

  const dupSelected = () => mutate(() => {
    const picked = items.filter((x) => sel.has(x))
    if (!picked.length) return
    const lastPos = items.lastIndexOf(picked[picked.length - 1])
    // clone canvas nodes — a DOM node can only live in one card at a time
    const dups = picked.map((x) => ({ ...x, canvas: x.canvas ? cloneCanvas(x.canvas) : null }))
    items = [...items.slice(0, lastPos + 1), ...dups, ...items.slice(lastPos + 1)]
  })

  const onZoom = async (i) => {
    const it = items[i]
    const leaf = leaves[it.page - 1]
    try {
      const canvas = await renderPage(doc, leaf, { width: Math.min(860, it.w * 1.5), cache: imgCache })
      if (canvas) openLightbox(canvas, `page ${it.page} · ${it.w}×${it.h}pt${it.rotation ? ` · rotated ${it.rotation}°` : ''}`)
    } catch { /* no preview */ }
  }

  const extractSel = async () => {
    const picked = items.filter((x) => sel.has(x) && !x.deleted)
    if (!picked.length) return
    busy = true
    error = ''
    render()
    try {
      const out = await organizePages(bytes, picked.map((x) => ({ page: x.page, rotation: x.rotation })))
      saveBlob(new Blob([out], { type: 'application/pdf' }), `${file.name.replace(/\.pdf$/i, '')}-extract.pdf`)
    } catch (e) {
      error = e.message || 'failed'
    } finally {
      busy = false
      render()
    }
  }

  const run = async () => {
    busy = true
    error = ''
    render()
    try {
      const ops = items.filter((it) => !it.deleted).map((it) => ({ page: it.page, rotation: it.rotation }))
      if (!ops.length) throw new Error('all pages deleted')
      const out = await organizePages(bytes, ops)
      saveBlob(
        new Blob([out], { type: 'application/pdf' }),
        `${file.name.replace(/\.pdf$/i, '')}-organized.pdf`,
      )
    } catch (e) {
      error = e.message || 'failed'
    } finally {
      busy = false
      render()
    }
  }

  // keyboard: Ctrl+A select-all, Del delete, Ctrl+Z undo — self-removes when detached
  const onKey = (e) => {
    if (!root.isConnected) return document.removeEventListener('keydown', onKey)
    if (!items.length || /input|textarea|select/i.test(e.target.tagName)) return
    if (e.ctrlKey && e.key === 'a') { e.preventDefault(); sel = new Set(items); render() }
    else if (e.key === 'Delete' && sel.size) applySel((x) => ({ ...x, deleted: true }))
    else if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo() }
  }
  document.addEventListener('keydown', onKey)

  function render() {
    const kept = items.filter((i) => !i.deleted).length
    const n = sel.size
    setKids(root,
      DropZone({ accept: 'application/pdf', onFiles: load }),
      items.length
        ? h('p', { class: 'meta dim' },
            `Click to select (shift = range) · drag to reorder · ⌨ Ctrl+A / Del / Ctrl+Z · ${kept} of ${items.length} kept${n ? ` · ${n} selected` : ''}`)
        : null,
      items.length
        ? Toolbar([
            ['Select all', () => { sel = new Set(items); render() }],
            ['Clear', () => { sel = new Set(); render() }, !n],
            ['Invert', () => { sel = new Set(items.filter((x) => !sel.has(x))); render() }],
            ['⇤ To front', () => moveSelected('front'), !n],
            ['To back ⇥', () => moveSelected('back'), !n],
            ['Rotate sel +90°', () => applySel((x) => ({ ...x, rotation: (x.rotation + 90) % 360 })), !n],
            ['Delete sel', () => applySel((x) => ({ ...x, deleted: true })), !n],
            ['Duplicate sel', dupSelected, !n],
            ['↶ Undo', undo, !history.length],
            ['Restore all', () => mutate(() => { items = items.map((x) => ({ ...x, deleted: false })) }), kept === items.length],
            ['Reset all', () => mutate(() => {
              items = items.map((x) => ({ ...x, rotation: 0, deleted: false }))
              items.sort((a, b) => a.page - b.page)
              sel = new Set()
            })],
          ])
        : null,
      items.length
        ? h('div', { class: 'toolbar' },
            h('label', { class: 'lbl', style: { alignSelf: 'center', margin: 0 } }, 'Move selected to position'),
            h('input', {
              class: 'textin num', type: 'number', value: moveTo, min: 1, max: items.length,
              style: { width: '80px', margin: 0 },
              oninput: (e) => (moveTo = parseInt(e.target.value, 10) || 1),
            }),
            h('button', { type: 'button', class: 'tbtn', disabled: !n || undefined, onclick: () => moveSelected('at') }, 'Move'),
            n ? h('button', { type: 'button', class: 'tbtn', onclick: extractSel, disabled: busy || undefined }, 'Download selected as PDF') : null,
          )
        : null,
      items.length
        ? PageGrid({
            items,
            selected: sel,
            onSelect,
            onZoom,
            onReorder: (from, to) => mutate(() => {
              const c = [...items]
              const [x] = c.splice(from, 1)
              c.splice(to, 0, x)
              items = c
            }),
            onRotate: (i, delta) => mutate(() => {
              items = items.map((x, j) => (j === i ? { ...x, rotation: ((x.rotation + delta) % 360 + 360) % 360 } : x))
            }),
            onToggleDelete: (i) => mutate(() => {
              items = items.map((x, j) => (j === i ? { ...x, deleted: !x.deleted } : x))
            }),
          })
        : null,
      ErrorText(error),
      items.length
        ? Btn(busy ? 'Building…' : `Download organized PDF (${kept} pages)`, { onclick: run, disabled: busy || kept === 0 })
        : null,
    )
    // apply rotation to rendered canvases so cards reflect it
    for (const it of items) {
      if (it.canvas) it.canvas.style.transform = it.rotation ? `rotate(${it.rotation}deg)` : ''
    }
  }
  render()
  return root
}

// ---- src/tools/img2pdf.js ----

/** Any raster → JPEG bytes via the browser's own decoder (canvas). */
async function toJpeg(file) {
  if (file.type === 'image/jpeg') return readBytes(file)
  const bmp = await createImageBitmap(file)
  const canvas = document.createElement('canvas')
  canvas.width = bmp.width
  canvas.height = bmp.height
  const ctx = canvas.getContext('2d')
  ctx.fillStyle = '#ffffff' // flatten alpha
  ctx.drawImage(bmp, 0, 0)
  const blob = await new Promise((res) => canvas.toBlob(res, 'image/jpeg', 0.92))
  return new Uint8Array(await blob.arrayBuffer())
}

function ImgToPdf() {
  let files = [] // {file, url, dims}
  let busy = false
  let error = ''
  let opts = { size: 'native', orient: 'auto', margin: 0, fit: 'contain' }
  const root = h('div', { class: 'tool' })

  const add = async (incoming) => {
    for (const f of incoming) {
      const entry = { file: f, url: URL.createObjectURL(f), dims: null }
      files.push(entry)
      render()
      try {
        const bmp = await createImageBitmap(f)
        entry.dims = `${bmp.width}×${bmp.height}`
        bmp.close()
      } catch { /* non-decodable → toJpeg will surface it on build */ }
      render()
    }
  }

  const remove = (i) => {
    URL.revokeObjectURL(files[i].url)
    files = files.filter((_, j) => j !== i)
    render()
  }

  const move = (from, to) => {
    const c = [...files]
    const [x] = c.splice(from, 1)
    c.splice(to, 0, x)
    files = c
    render()
  }

  const run = async () => {
    busy = true
    error = ''
    render()
    try {
      const images = await Promise.all(files.map(async (f) => ({ data: await toJpeg(f.file) })))
      const out = imagesToPdf(images, opts)
      saveBlob(new Blob([out], { type: 'application/pdf' }), 'images.pdf')
    } catch (e) {
      error = e.message || 'failed — use JPEG or PNG images'
    } finally {
      busy = false
      render()
    }
  }

  function render() {
    setKids(root,
      DropZone({
        accept: 'image/jpeg,image/png,image/webp,image/gif,image/bmp',
        multiple: true,
        onFiles: add,
        label: 'Drop images here or ',
      }),
      files.length
        ? Card(
            ThumbList({ files, onMove: move, onRemove: remove }),
            h('p', { class: 'meta dim', style: { marginTop: '10px' } }, 'Drag to reorder — each image becomes one page'),
          )
        : null,
      files.length
        ? Card(
            h('div', { class: 'optrow' },
              h('label', { class: 'lbl' }, 'Page size'),
              h('select', { class: 'textin sel', onchange: (e) => { opts = { ...opts, size: e.target.value } } },
                h('option', { value: 'native', selected: true }, 'Match image'),
                h('option', { value: 'a4' }, 'A4'),
                h('option', { value: 'letter' }, 'Letter')),
              h('label', { class: 'lbl' }, 'Orientation'),
              h('select', { class: 'textin sel', onchange: (e) => { opts = { ...opts, orient: e.target.value } } },
                h('option', { value: 'auto', selected: true }, 'Auto'),
                h('option', { value: 'portrait' }, 'Portrait'),
                h('option', { value: 'landscape' }, 'Landscape')),
            ),
            h('div', { class: 'optrow' },
              h('label', { class: 'lbl' }, `Margin ${opts.margin}pt`),
              h('input', {
                type: 'range', min: 0, max: 72, step: 1, value: opts.margin, class: 'slider',
                oninput: (e) => { opts = { ...opts, margin: +e.target.value }; e.target.previousElementSibling.textContent = `Margin ${opts.margin}pt` },
              }),
              h('label', { class: 'lbl' }, 'Fit'),

                h('option', { value: 'contain', selected: true }, 'Fit (keep ratio)'),

// ---- src/tools/extract.js ----

function ExtractImgs() {
  let file = null
  let results = null // {images, skipped}
  let busy = false
  let error = ''
  let loadGen = 0
  let hideDupes = false
  let selected = new Set() // image objects
  const root = h('div', { class: 'tool' })

  const load = async ([f]) => {
    const my = ++loadGen
    error = ''
    file = f
    results = null
    hideDupes = false
    selected = new Set()
    busy = true
    render()
    try {
      const bytes = await readBytes(f)
      if (my !== loadGen) return
      const found = await extractImages(bytes)
      if (my !== loadGen) return
      // count duplicates by content hash → first occurrence carries the badge
      const counts = new Map()
      for (const im of found.images) counts.set(im.hash, (counts.get(im.hash) ?? 0) + 1)
      const seen = new Set()
      for (const im of found.images) {
        im.dupCount = seen.has(im.hash) ? 0 : counts.get(im.hash)
        im.dup = seen.has(im.hash)
        seen.add(im.hash)
      }
      results = found
      if (!results.images.length) {
        error = results.skipped
          ? `found ${results.skipped} image${results.skipped === 1 ? '' : 's'} but in formats we can't decode yet (CCITT/JBIG2/masked)`
          : 'no embedded images found in this PDF'
      }
    } catch (e) {
      if (my !== loadGen) return
      error = e.message || 'could not read that PDF'
      file = null
      results = null
    } finally {
      if (my === loadGen) busy = false
      render()
    }
  }

  const saveOne = (im) => saveBlob(new Blob([im.data], { type: im.mime }), im.name)

  const saveZip = (list, suffix) => {
    const stem = file.name.replace(/\.pdf$/i, '')
    saveBlob(
      new Blob([zipStore(list.map((im) => ({ name: im.name, data: im.data })))], { type: 'application/zip' }),
      `${stem}-${suffix}.zip`,
    )
  }

  function render() {
    const imgs = results?.images ?? []
    const visible = hideDupes ? imgs.filter((im) => !im.dup) : imgs
    const unique = new Set(imgs.map((im) => im.hash)).size
    setKids(root,
      DropZone({ accept: 'application/pdf', onFiles: load, label: 'Drop a PDF here or ' }),
      busy ? h('p', { class: 'meta dim' }, 'Scanning for embedded images…') : null,
      file && results
        ? Card(
            h('p', { class: 'meta' },
              h('b', {}, file.name),
              ` — ${imgs.length} image${imgs.length === 1 ? '' : 's'} · ${unique} unique${results.skipped ? ` · ${results.skipped} skipped (unsupported)` : ''}`),
            imgs.length
              ? h('div', { class: 'toolbar' },
                  h('button', { type: 'button', class: 'tbtn', onclick: () => { selected = new Set(visible); render() } }, 'Select shown'),
                  h('button', { type: 'button', class: 'tbtn', onclick: () => { selected = new Set(); render() }, disabled: !selected.size || undefined }, 'Clear'),
                  h('label', { class: 'lbl', style: { margin: 0, alignSelf: 'center' } },
                    h('input', { type: 'checkbox', checked: hideDupes || undefined, onchange: (e) => { hideDupes = e.target.checked; render() } }),
                    ' hide duplicates'),
                  selected.size
                    ? h('span', { class: 'meta dim', style: { alignSelf: 'center' } }, `${selected.size} selected`)
                    : null,
                )
              : null,
          )
        : null,
      visible.length ? ImgGrid({ images: visible, onSave: saveOne, selected, onToggle: (im) => { selected.has(im) ? selected.delete(im) : selected.add(im); render() } }) : null,
      ErrorText(error),
      imgs.length
        ? h('div', { class: 'btnrow' },
            Btn(`Download all ${imgs.length} (.zip)`, { onclick: () => saveZip(imgs, 'images') }),
            selected.size
              ? Btn(`Download ${selected.size} selected (.zip)`, { onclick: () => saveZip([...selected], 'selected') })
              : null,
          )
        : null,
    )
  }
  render()
  return root
}

                h('label', { class: 'lbl' }, `Margin — ${margin}pt`),

function PdfToPng() {
  let file = null
  let doc = null
  let pages = [] // {i, leaf, canvas, box}
  let scale = 2
  let busy = false
  let error = ''
  let loadGen = 0
  const root = h('div', { class: 'tool' })

  const load = async ([f]) => {
    const my = ++loadGen
    error = ''
    file = f
    doc = null
    pages = []
    busy = true
    render()
    try {
      const b = await readBytes(f)
      if (my !== loadGen) return
      const parsed = await parsePdf(b)
      const leaves = pageLeaves(parsed)
      if (my !== loadGen) return
      doc = parsed
      pages = leaves.map((leaf, i) => ({ leaf, i, canvas: null }))
      busy = false
      render()
      const cache = new Map()
      for (const p of pages) {
        if (my !== loadGen) return
        p.canvas = await renderPage(doc, p.leaf, { width: 220 * scale, cache }).catch(() => null)
        render()
      }
    } catch (e) {
      if (my !== loadGen) return
      error = e.message || 'could not read that file'
      file = null
    } finally {
      if (my === loadGen) busy = false
      render()
    }
  }

  const blobOf = (canvas) =>
    new Promise((res, rej) => canvas.toBlob((b) => (b ? res(b) : rej(new Error('encode failed'))), 'image/png'))

  const saveAll = async () => {
    busy = true
    render()
    try {
      // export renders at true scale (page-pts × scale), independent of the
      // 220px preview thumbs — scale 3 on a letter page ≈ 1836px ≈ 216 DPI
      const entries = []
      const cache = new Map()
      for (const p of pages) {
        const { box } = await collectDrawOps(doc, p.leaf).catch(() => ({ box: null }))
        if (!box) continue
        const hi = await renderPage(doc, p.leaf, { width: Math.round(box.w * scale), cache }).catch(() => null)
        if (!hi) continue
        const blob = await blobOf(hi)
        entries.push({
          name: `${file.name.replace(/\.pdf$/i, '')}-p${p.i + 1}.png`,
          data: new Uint8Array(await blob.arrayBuffer()),
        })
      }
      if (!entries.length) throw new Error('nothing rendered')
      if (entries.length === 1) saveBlob(new Blob([entries[0].data], { type: 'image/png' }), entries[0].name)
      else saveBlob(new Blob([zipStore(entries)], { type: 'application/zip' }), `${file.name.replace(/\.pdf$/i, '')}-pages.zip`)
    } catch (e) {
      error = e.message || 'export failed'
    } finally {
      busy = false
      render()
    }
  }

  function render() {
    setKids(root,
      DropZone({ accept: 'application/pdf', onFiles: load }),
      file
        ? Card(
            h('div', { class: 'optrow' },
              h('div', {},
                h('label', { class: 'lbl' }, 'Resolution'),
                h('select', { class: 'textin sel', onchange: (e) => { scale = Number(e.target.value); load([file]) } },
                  [[1, '1× — small'], [2, '2× — crisp'], [3, '3× — print']]
                    .map(([v, l]) => h('option', { value: v, selected: v === scale || undefined }, l)))),
              h('div', {},
                h('label', { class: 'lbl' }, 'Pages'),
                h('p', { class: 'meta dim' }, `${pages.length} page${pages.length === 1 ? '' : 's'} → PNG${pages.length > 1 ? 's in a zip' : ''}`))),
            pages.length
              ? h('div', { class: 'pgrid' },
                  pages.map((p) =>
                    h('div', { class: 'pcard' },
                      p.canvas ?? h('div', { class: 'pthumb dim' }, '…'),
                      h('div', { class: 'plabel' }, `p${p.i + 1}`))))
              : null,
            h('div', { class: 'btnrow' },
              Btn(busy ? 'Encoding…' : pages.length > 1 ? 'Download PNGs (zip)' : 'Download PNG', {
                onclick: saveAll, disabled: busy || !pages.length,
              })),
          )
        : null,
      busy && !pages.length ? h('p', { class: 'meta dim' }, 'Rendering pages…') : null,
      ErrorText(error),
    )
  }
  render()
  return root
}

  let busy = false
  let error = ''
  let loadGen = 0
  const root = h('div', { class: 'tool' })

    busy = true
    error = ''
    result = null
    render()
    try {
      result = await compressPdf(bytes, { reimage: reimageImgs ? reimage : undefined })
      if (result.after >= result.before) {
        result.note = 'already tight — rebuilt but not smaller'
      }
    } catch (e) {
      error = e.message || 'compress failed'
    } finally {
      busy = false
      render()
    }
  }

  const download = () =>
    saveBlob(new Blob([result.bytes], { type: 'application/pdf' }),
      `${file.name.replace(/\.pdf$/i, '')}-small.pdf`)

  function render() {
    const saved = result ? result.before - result.after : 0
    const pct = result ? Math.round((saved / result.before) * 100) : 0
    setKids(root,
      DropZone({ accept: 'application/pdf', onFiles: load }),
      file
        ? Card(
            h('p', { class: 'meta' }, h('b', {}, file.name), ` — ${fmtBytes(bytes?.length ?? 0)}`),
            h('label', { class: 'lbl chk' },
              h('input', {
                type: 'checkbox', checked: reimageImgs || undefined,
                onchange: (e) => { reimageImgs = e.target.checked },
              }),
              ' Re-encode embedded images at lower quality (biggest wins, slight quality loss)'),
            h('div', { class: 'btnrow' },
              Btn(busy ? 'Compressing…' : 'Compress', { onclick: run, disabled: busy })),
            result
              ? h('p', { class: 'meta' },
                  h('b', {}, `${fmtBytes(result.before)} → ${fmtBytes(result.after)}`),
                  saved > 0 ? ` — saved ${fmtBytes(saved)} (${pct}%)` : ` — ${result.note}`)
              : null,
            result ? Btn('Download compressed PDF', { onclick: download }) : null,
          )
        : null,
      ErrorText(error),
    )
  }
  render()
  return root
}

// ---- src/tools/protect.js ----

function Protect() {
  let file = null
  let bytes = null
  let encrypted = false
  let pwd = ''
  let pwd2 = ''
  let busy = false
  let error = ''
  let ok = ''
  let loadGen = 0
  const root = h('div', { class: 'tool' })

  const load = async ([f]) => {
    const my = ++loadGen
    error = ''
    ok = ''
    file = f
    bytes = null
    encrypted = false
    pwd = pwd2 = ''
    try {
      const b = await readBytes(f)
      if (my !== loadGen) return
      bytes = b
      try {
        await parsePdf(b)
      } catch (e) {
        if (!/password-protected/.test(e.message)) throw e
        encrypted = true
      }
    } catch (e) {
      if (my !== loadGen) return
      error = e.message || 'could not read that file'
      file = null
      bytes = null
    }
    render()
  }

  const lock = async () => {
    if (!pwd) { error = 'enter a password first'; render(); return }
    busy = true
    error = ''
    render()
    try {
      const out = await protectPdf(bytes, pwd, { ownerPwd: pwd2 || undefined })
      saveBlob(new Blob([out], { type: 'application/pdf' }),
        `${file.name.replace(/\.pdf$/i, '')}-protected.pdf`)
    } catch (e) {
      error = e.message || 'failed'
    } finally {
      busy = false
      render()
    }
  }

  const unlock = async () => {
    if (!pwd) { error = 'enter a password first'; render(); return }
    busy = true
    error = ''
    ok = ''
    render()
    try {
      const out = await decryptPdf(bytes, pwd)
      saveBlob(new Blob([out], { type: 'application/pdf' }),
        `${file.name.replace(/\.pdf$/i, '')}-unlocked.pdf`)
      ok = 'Unlocked — the download has no password.'
    } catch (e) {
      error = /wrong password/.test(e.message) ? 'Wrong password — try again.' : e.message
    } finally {
      busy = false
      render()
    }
  }

  const pwdInput = (label, val, onset, ph = '••••••••') =>
    h('div', {},
      h('label', { class: 'lbl' }, label),
      h('input', {
        class: 'textin', type: 'password', placeholder: ph, value: val,
        oninput: (e) => onset(e.target.value),
        onkeydown: (e) => { if (e.key === 'Enter' && pwd) (encrypted ? unlock : lock)() },
      }))

  function render() {
    setKids(root,
      DropZone({ accept: 'application/pdf', onFiles: load }),
      file && !encrypted
        ? Card(
            h('p', { class: 'meta' }, h('b', {}, file.name), ' — not protected yet'),
            h('div', { class: 'optrow' },
              pwdInput('Password (required to open)', pwd, (v) => (pwd = v)),
              pwdInput('Owner password (optional)', pwd2, (v) => (pwd2 = v), 'same as above if blank')),
            h('p', { class: 'meta dim' },
              'RC4-128 Standard handler — every real PDF reader will ask for the password before opening.'),
            h('div', { class: 'btnrow' },
              Btn(busy ? 'Locking…' : 'Protect PDF', { onclick: lock, disabled: busy })),
          )
        : null,
      file && encrypted
        ? Card(
            h('p', { class: 'meta' }, h('b', {}, file.name), ' — password-protected'),
            h('div', { class: 'optrow' },
              pwdInput('Password (user or owner)', pwd, (v) => (pwd = v))),
            h('div', { class: 'btnrow' },
              Btn(busy ? 'Unlocking…' : 'Unlock PDF', { onclick: unlock, disabled: busy })),
            ok ? h('p', { class: 'meta ok' }, ok) : null,
          )
        : null,
      ErrorText(error),
    )
  }
  render()
  return root
}

// ---- src/tools/scrub.js ----

function Scrub() {
  let file = null
  let bytes = null
  let meta = null // {fields, xmp, id}
  let busy = false
  let error = ''
  let loadGen = 0
  const root = h('div', { class: 'tool' })

  const load = async ([f]) => {
    const my = ++loadGen
    error = ''
    file = f
    meta = null
    busy = true
    render()
    try {
      const b = await readBytes(f)
      if (my !== loadGen) return
      const found = await readMetadata(b)
      if (my !== loadGen) return
      bytes = b
      meta = found
    } catch (e) {
      if (my !== loadGen) return
      error = e.message || 'could not read that file'
      file = null
      bytes = null
    } finally {
      if (my === loadGen) busy = false
      render()
    }
  }

  const run = async () => {
    busy = true
    error = ''
    render()
    try {
      const out = await scrubPdf(bytes)
      saveBlob(new Blob([out], { type: 'application/pdf' }), `${file.name.replace(/\.pdf$/i, '')}-clean.pdf`)
    } catch (e) {
      error = e.message || 'failed'
    } finally {
      busy = false
      render()
    }
  }

  function render() {
    const leaking = meta && (meta.fields.length || meta.xmp || meta.id)
    setKids(root,
      DropZone({ accept: 'application/pdf', onFiles: load }),
      busy ? h('p', { class: 'meta dim' }, 'Reading metadata…') : null,
      file && meta
        ? Card(
            h('p', { class: 'meta' }, h('b', {}, file.name)),
            leaking
              ? h('p', { class: 'meta dim' }, 'This file is carrying the following — all of it gets wiped:')
              : null,
            MetaTable(meta),
          )
        : null,
      ErrorText(error),
      file && meta
        ? Btn(busy ? 'Scrubbing…' : leaking ? 'Scrub it all' : 'Rebuild anyway', { onclick: run, disabled: busy })
        : null,
    )
  }
  render()
  return root
}

  { id: 'split', name: 'Split PDF', desc: 'Pull out page ranges — one file or a zip', icon: 'scissors', view: Split },
  { id: 'organize', name: 'Organize pages', desc: 'Reorder, rotate and delete pages visually', icon: 'grid', view: Organize },
  { id: 'img2pdf', name: 'Images to PDF', desc: 'JPG/PNG/WebP pages into a single PDF', icon: 'image', view: ImgToPdf },
  { id: 'extract', name: 'Extract images', desc: 'Pull embedded images out — JPG/PNG in a zip', icon: 'layers', view: ExtractImgs },
  { id: 'pagenum', name: 'Page numbers', desc: 'Stamp "N / total" on every page', icon: 'hash', view: PageNums },
  { id: 'watermark', name: 'Watermark', desc: 'Diagonal translucent text on every page', icon: 'droplet', view: Watermark },
  { id: 'pdf2png', name: 'PDF to PNG', desc: 'Render every page to images, in a zip', icon: 'download', view: PdfToPng },
  { id: 'pdftext', name: 'PDF to text', desc: 'Pull the text out, pages in order', icon: 'filetext', view: PdfToText },
  { id: 'compress', name: 'Compress PDF', desc: 'Recompress streams + re-encode images', icon: 'shrink', view: Compress },
  { id: 'protect', name: 'Protect / Unlock', desc: 'Password-protect or unlock a PDF', icon: 'lock', view: Protect },
  { id: 'scrub', name: 'Scrub metadata', desc: 'Strip author, producer, XMP and doc IDs', icon: 'eraser', view: Scrub },
]

const app = document.getElementById('app')

function route() {
  return location.hash.replace(/^#\/?/, '')
}

function header() {
  return h(
    'header',
    {},
    h('a', { class: 'brand', href: '#/' }, h('b', {}, 'PDF', h('span', { class: 'accent' }, 'Suite')),
      h('span', { class: 'tagline' }, 'free forever · no account · no uploads · zero dependencies')),
    h('a', { class: 'gh', href: 'https://github.com/mayusi/pdfsuite', title: 'Source on GitHub' },
      icon('github', 'icon')),
  )
}

function footer() {
  return h(
    'footer',
    {},
    h(
      'p',
      {},
      'Smallpdf charges $12/mo · iLovePDF $9/mo — to upload ',
      h('em', {}, 'your'),
      ' documents to ',
      h('em', {}, 'their'),
      ' servers for work your own browser can do. PDFSuite does the same job for $0, your files never leave the machine, and the entire app is hand-written JavaScript you can read end-to-end. MIT licensed. ',
    ),
    h(
      'p',
      {},
      'Want it offline? ',
      h('a', { href: './pdfsuite.html', download: 'pdfsuite.html' }, 'Download the whole app as one HTML file'),
      ' — same code, works from a double-click.',
    ),
  )
}

function home() {
  return h(
    'main',
    {},
    h('h1', {}, "Every PDF tool you'd pay Smallpdf $12/mo for. ", h('span', { class: 'accent' }, 'Free.')),
    h('p', { class: 'sub' }, icon('shield', 'icon-sm accent'),
      'Files never leave your browser — every tool runs 100% client-side with zero dependencies. Check the network tab, then check the source.'),
    h(
      'div',
      { class: 'grid' },
      TOOLS.map((t) =>
        h('a', { class: 'toolcard', href: `#/${t.id}` },
          icon(t.icon, 'icon-lg accent'),
          h('h2', {}, t.name),
          h('p', {}, t.desc)),
      ),
    ),
  )
}

function toolView(tool) {
  return h(
    'main',
    {},
    h('a', { class: 'back', href: '#/' }, '← all tools'),
    h('h1', {}, tool.name),
    h('p', { class: 'sub' }, tool.desc),
    tool.view(),
  )
}

function render() {
  const tool = TOOLS.find((t) => t.id === route())
  app.replaceChildren(header(), tool ? toolView(tool) : home(), footer())
  scrollTo(0, 0)
}

// Dropping a file anywhere EXCEPT a dropzone must not navigate away and nuke the app.
addEventListener('dragover', (e) => e.preventDefault())
addEventListener('drop', (e) => {
  if (!e.target.closest?.('.dropzone')) e.preventDefault()
})

addEventListener('hashchange', render)
render()
