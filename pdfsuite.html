/**
 * File drop zone — a <label> wrapping a hidden input, so clicking it opens the
 * file dialog NATIVELY. Zero JS involved in opening the picker (no recursion
 * bugs possible). Drag & drop handled separately.
 */
function DropZone({ accept, multiple = false, onFiles, label }) {
  const input = h('input', {
    type: 'file',
    accept,
    multiple: multiple || undefined,
    class: 'hidden-input',
    onchange: (e) => {
      const files = [...e.target.files]
      if (files.length) onFiles(files)
      e.target.value = ''
    },
  })

  const zone = h(
    'label',
    {
      class: 'dropzone',
      tabindex: '0',
      role: 'button',
      onclick: (e) => {
        if (e.target === input) return // our own input.click() bubbling up — don't loop
        e.preventDefault() // kill native label forwarding; JS path opens exactly one dialog
        input.click()
      },
      onkeydown: (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault()
          input.click()
        }
      },
    },
    input,
    icon('upload', 'icon-lg dim'),
    h('span', { class: 'dz-text' }, label ?? `Drop ${multiple ? 'files' : 'a file'} here or `, h('em', {}, 'browse')),
  )

  zone.addEventListener('dragover', (e) => {
    e.preventDefault()
    zone.classList.add('over')
  })
  zone.addEventListener('dragleave', () => zone.classList.remove('over'))
  zone.addEventListener('drop', (e) => {
    e.preventDefault()
    zone.classList.remove('over')
    const files = [...e.dataTransfer.files]
    if (files.length) onFiles(files)
  })
  return zone
}

/**
 * Shared pointer-drag reorder — grab an item, a ghost follows the pointer, the
 * sibling under it highlights, drop fires onDrop(from, to). Mouse/pen grabs after
 * 5px; touch grabs after a 180ms hold — moving earlier means the user is scrolling,
 * so the gesture drives window.scrollBy by hand (touch-action:none killed native).
 */
function attachPtrDrag(container, itemSel, { onDrop, targetCls }) {
  let st = null // live gesture: {pid, touch, x0, y0, x, y, lastY, el, mode, ...}
  let eatClick = false // a completed drag/scroll swallows the trailing click

  const rectsOf = () => st.nodes.map((n) => ({ n, r: n.getBoundingClientRect() }))

  const mark = (n) => {
    if (n === st.target) return
    st.target?.classList.remove(targetCls)
    st.target = n
    n?.classList.add(targetCls)
  }

  const hitTest = () => {
    if (!st.el.isConnected) return stop(false)
    const hit = st.rects.find(
      ({ n, r }) => n !== st.el && st.x >= r.left && st.x <= r.right && st.y >= r.top && st.y <= r.bottom,
    )
    mark(hit?.n ?? null)
  }

  const moveGhost = () => {
    st.ghost.style.transform = `translate(${st.x - st.offX}px, ${st.y - st.offY}px) scale(1.04)`
  }

  // edge auto-scroll: ~8px/frame scaled by proximity to viewport top/bottom
  const scrollTick = () => {
    if (!st) return
    st.raf = 0
    if (st.mode !== 'drag' || !st.vy) return
    window.scrollBy(0, st.vy)
    st.rects = rectsOf()
    hitTest()
    if (st) st.raf = requestAnimationFrame(scrollTick)
  }

  const onScroll = () => {
    if (st?.mode !== 'drag') return
    st.rects = rectsOf()
    hitTest()
  }

  const onEsc = (e) => {
    if (e.key === 'Escape' && st) stop(false)
  }

  // safety net for gestures orphaned mid-flight (container re-rendered, capture
  // stolen): a pointerup anywhere in the doc ends a drag whose card is gone
  const onDocUp = (e) => {
    if (st && e.pointerId === st.pid && st.mode === 'drag' && !st.el.isConnected) stop(false)
  }

  const activate = () => {
    st.mode = 'drag'
    st.nodes = [...container.querySelectorAll(itemSel)]
    st.rects = rectsOf()
    const r = st.el.getBoundingClientRect()
    st.offX = st.x0 - r.left
    st.offY = st.y0 - r.top
    const clone = st.el.cloneNode(true)
    const srcCv = st.el.querySelectorAll('canvas')
    clone.querySelectorAll('canvas').forEach((c, i) => {
      const s = srcCv[i]
      if (!s) return
      c.width = s.width
      c.height = s.height
      c.getContext('2d').drawImage(s, 0, 0) // cloneNode doesn't carry the bitmap
    })
    clone.style.width = '100%'
    // same-class empty shell so class-scoped styles (.filelist li) still hit the clone
    const ghost = container.cloneNode(false)
    ghost.classList.add('drag-ghost')
    ghost.removeAttribute('id')
    Object.assign(ghost.style, {
      display: 'block',
      left: '0',
      top: '0',
      width: `${r.width}px`,
      transformOrigin: `${st.offX}px ${st.offY}px`,
    })
    ghost.append(clone)
    document.body.append(ghost)
    st.ghost = ghost
    st.el.classList.add('drag-src')
    window.addEventListener('scroll', onScroll, true)
    document.addEventListener('keydown', onEsc)
    document.addEventListener('pointerup', onDocUp, true)
    moveGhost()
    hitTest()
  }

  const stop = (snap) => {
    const { el, ghost, mode, timer, raf, target } = st
    if (mode !== 'pre') eatClick = true
    clearTimeout(timer)
    if (raf) cancelAnimationFrame(raf)
    window.removeEventListener('scroll', onScroll, true)
    document.removeEventListener('keydown', onEsc)
    document.removeEventListener('pointerup', onDocUp, true)
    target?.classList.remove(targetCls)
    st = null
    if (ghost && snap && el.isConnected) {
      const r = el.getBoundingClientRect()
      ghost.style.transition = 'transform .12s ease'
      ghost.style.transform = `translate(${r.left}px, ${r.top}px) scale(1)`
      setTimeout(() => {
        ghost.remove()
        el.classList.remove('drag-src')
      }, 140)
    } else {
      ghost?.remove()
      el.classList.remove('drag-src')
    }
  }

  container.addEventListener('pointerdown', (e) => {
    if (st) {
      if (st.el.isConnected) return // one gesture at a time
      stop(false) // container was re-rendered mid-gesture — drop the stale state
    }
    eatClick = false
    if (e.button) return
    if (e.target.closest('button, .pops')) return
    const el = e.target.closest(itemSel)
    if (!el || el.parentElement !== container) return
    st = {
      pid: e.pointerId, touch: e.pointerType === 'touch',
      x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, lastY: e.clientY,
      el, mode: 'pre', vy: 0, raf: 0, target: null, ghost: null, timer: 0,
    }
    el.setPointerCapture(e.pointerId)
    if (st.touch) st.timer = setTimeout(() => st?.mode === 'pre' && activate(), 180)
  })

  container.addEventListener('pointermove', (e) => {
    if (!st || e.pointerId !== st.pid) return
    st.x = e.clientX
    st.y = e.clientY
    const dx = e.clientX - st.x0
    const dy = e.clientY - st.y0
    if (st.mode === 'pre') {
      if (st.touch) {
        if (dx * dx + dy * dy > 100) {
          clearTimeout(st.timer)
          st.mode = 'scroll' // moved before the hold fired — hand-scroll instead
          window.scrollBy(0, st.lastY - e.clientY)
        }
      } else if (dx * dx + dy * dy > 25) activate()
    } else if (st.mode === 'scroll') {
      window.scrollBy(0, st.lastY - e.clientY)
    } else {
      moveGhost()
      hitTest()
      if (!st) return
      const z = 48
      st.vy = st.y < z ? -8 * (1 - st.y / z) : innerHeight - st.y < z ? 8 * (1 - (innerHeight - st.y) / z) : 0
      if (st.vy && !st.raf) st.raf = requestAnimationFrame(scrollTick)
    }
    st.lastY = e.clientY
  })

  container.addEventListener('pointerup', (e) => {
    if (!st || e.pointerId !== st.pid) return
    if (st.mode !== 'drag') {
      if (st.mode === 'scroll') eatClick = true
      clearTimeout(st.timer)
      st = null
      return
    }
    const from = st.nodes.indexOf(st.el)
    const to = st.target ? st.nodes.indexOf(st.target) : -1
    stop(to < 0)
    if (to >= 0 && to !== from) onDrop?.(from, to)
  })

  container.addEventListener('pointercancel', (e) => {
    if (!st || e.pointerId !== st.pid) return
    if (st.mode === 'drag') stop(true)
    else {
      clearTimeout(st.timer)
      st = null
    }
  })

  // capture phase beats the card's own onclick — eat the click a drag leaves behind
  container.addEventListener('click', (e) => {
    if (!eatClick) return
    eatClick = false
    e.preventDefault()
    e.stopPropagation()
  }, true)

  // kill stray native drags (images are draggable by default)
  container.addEventListener('dragstart', (e) => e.preventDefault())

  // Android fires contextmenu ~500ms into a held touch → pointercancel would
  // snap a live drag back. Only suppressed mid-gesture; normal right-click stays.
  container.addEventListener('contextmenu', (e) => { if (st) e.preventDefault() })

  // if the browser drops capture mid-gesture, release the state — otherwise st
  // wedges and every later pointerdown early-returns (dead drag until re-render)
  container.addEventListener('lostpointercapture', (e) => {
    if (!st || e.pointerId !== st.pid) return
    if (st.mode === 'drag') stop(false)
    else {
      if (st.mode === 'scroll') eatClick = true
      clearTimeout(st.timer)
      st = null
    }
  })
}

/**
 * Ordered file list — drag-to-reorder + move-up/down + remove.
 * Each item may carry .meta (extra info line, e.g. page count) and .err.
 */
function FileList({ files, onMove, onRemove }) {
  const list = h('ul', { class: 'filelist' })
  files.forEach((f, i) => {
    const li = h(
      'li',
      {},
      f.thumbNode
        ? f.thumbNode
        : f.thumb
          ? h('img', { class: 'thumb', src: f.thumb, alt: '' })
          : h('span', { class: 'idx' }, String(i + 1)),
      h('span', { class: 'fname' }, f.name, f.meta ? h('span', { class: 'fmeta' }, f.meta) : null),
      f.err ? h('span', { class: 'ferr' }, f.err) : h('span', { class: 'fsize' }, fmtBytes(f.size)),
      f.onExpand ? iconBtn('grid', 'Show pages', (e) => { e.stopPropagation(); f.onExpand() }) : null,
      iconBtn('up', 'Move up', () => onMove(i, i - 1), i === 0),
      iconBtn('down', 'Move down', () => onMove(i, i + 1), i === files.length - 1),
      iconBtn('x', 'Remove', () => onRemove(i)),
    )
    if (f.detail) li.append(h('div', { class: 'fdetail' }, f.detail))
    list.append(li)
  })
  attachPtrDrag(list, 'li', { targetCls: 'target', onDrop: onMove })
  return list
}

function iconBtn(iconName, title, onclick, disabled = false) {
  return h(
    'button',
    { type: 'button', class: 'iconbtn', title, onclick, disabled: disabled || undefined },
    icon(iconName, 'icon-sm'),
  )
}

/** Primary action button. */
function Btn(label, { onclick, disabled } = {}) {
  return h('button', { type: 'button', class: 'btn', onclick, disabled: disabled || undefined }, label)
}

function Card(...kids) {
  return h('div', { class: 'card' }, kids)
}

function ErrorText(msg) {
  return msg ? h('p', { class: 'error' }, msg) : null
}

/**
 * Page-card grid for Organize — grab & swap drag-reorder, rotate ±90°,
 * delete/restore, click/shift select, zoom on demand.
 * items: [{page, w, h, rotation, deleted, canvas?, imgUrl?, text?}]
 * onDrop(dragIdx, targetIdx) — the card the pointer was released over.
 */
function PageGrid({ items, onDrop, onRotate, onToggleDelete, selected, onSelect, onZoom }) {
  const grid = h('div', { class: 'pgrid' })

  items.forEach((it, i) => {
    const card = h(
      'div',
      {
        class: 'pcard' + (it.deleted ? ' deleted' : '') + (selected?.has(it) ? ' sel' : ''),
        style: { aspectRatio: it.w && it.h ? `${it.w} / ${it.h}` : '3 / 4' },
        onclick: onSelect ? (e) => onSelect(i, e.shiftKey) : undefined,
      },
      h('div', { class: 'pbody' },
        it.canvas ?? (it.imgUrl
          ? h('img', { class: 'pthumb', src: it.imgUrl, alt: '', draggable: 'false' })
          : it.text
            ? h('div', { class: 'ptext' }, it.text)
            : null),
        h('div', { class: 'pnum' }, `p${it.page}`),
        h('div', { class: 'pdim' }, `${it.w}×${it.h}`),
        it.rotation ? h('div', { class: 'prot' }, `${it.rotation}°`) : null,
      ),
      onSelect && selected?.has(it) ? h('div', { class: 'pchk' }, icon('check', 'icon-sm')) : null,
      h(
        'div',
        { class: 'pops' },
        onZoom ? iconBtn('zoom', 'View page', (e) => { e.stopPropagation(); onZoom(i) }) : null,
        iconBtn('rotl', 'Rotate −90°', (e) => { e.stopPropagation(); onRotate(i, -90) }),
        iconBtn('rotate', 'Rotate +90°', (e) => { e.stopPropagation(); onRotate(i, 90) }),
        iconBtn(it.deleted ? 'undo' : 'x', it.deleted ? 'Restore' : 'Delete', (e) => { e.stopPropagation(); onToggleDelete(i) }),
      ),
    )
    grid.append(card)
  })
  attachPtrDrag(grid, '.pcard', { targetCls: 'swap-target', onDrop })
  return grid
}

/**
 * Click-to-select page picker for Split — cards proportioned to MediaBox.
 * Click toggles; shift+click selects the range from the last click.
 * selected = Set of 1-based page numbers; onToggle(page, shiftKey).
 */
function SelectGrid({ items, selected, onToggle, onZoom }) {
  return h(
    'div',
    { class: 'pgrid sel' },
    items.map((it) =>
      h(
        'div',
        {
          class: 'pcard pick' + (selected.has(it.page) ? ' sel' : ''),
          style: { aspectRatio: it.w && it.h ? `${it.w} / ${it.h}` : '3 / 4' },
          role: 'checkbox',
          'aria-checked': selected.has(it.page) ? 'true' : 'false',
          tabindex: '0',
          onclick: (e) => onToggle(it.page, e.shiftKey),
          onkeydown: (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault()
              onToggle(it.page, e.shiftKey)
            }
          },
        },
        h('div', { class: 'pbody' },
          it.canvas ?? (it.imgUrl
            ? h('img', { class: 'pthumb', src: it.imgUrl, alt: '', draggable: 'false' })
            : it.text
              ? h('div', { class: 'ptext' }, it.text)
              : null),
          h('div', { class: 'pnum' }, `p${it.page}`),
          h('div', { class: 'pdim' }, `${it.w}×${it.h}`),
        ),
        onZoom
          ? h('button', { type: 'button', class: 'pzoom', title: 'View page', onclick: (e) => { e.stopPropagation(); onZoom(it.page) } }, icon('zoom', 'icon-sm'))
          : null,
        h('div', { class: 'pchk' }, icon('check', 'icon-sm')),
      ),
    ),
  )
}

/**
 * Image file list for Images→PDF — real thumbnails via object URLs.
 * files: [{file, url}] — caller owns URL.createObjectURL / revoke.
 */
function ThumbList({ files, onMove, onRemove }) {
  const list = h('ul', { class: 'filelist thumbs' })
  files.forEach((f, i) => {
    const li = h(
      'li',
      {},
      h('img', { class: 'thumb', src: f.url, alt: '' }),
      h('span', { class: 'fname' }, f.file.name),
      h('span', { class: 'fsize' }, f.dims ?? fmtBytes(f.file.size)),
      iconBtn('up', 'Move up', () => onMove(i, i - 1), i === 0),
      iconBtn('down', 'Move down', () => onMove(i, i + 1), i === files.length - 1),
      iconBtn('x', 'Remove', () => onRemove(i)),
    )
    list.append(li)
  })
  attachPtrDrag(list, 'li', { targetCls: 'target', onDrop: onMove })
  return list
}

/**
 * Extracted-image results grid — real previews + per-image download.
 * images: [{name, data, w, h, mime, hash, dupCount?}]. onSave(image) downloads one.
 * Pass selected (Set) + onToggle to enable click-select.
 */
function ImgGrid({ images, onSave, selected, onToggle }) {
  return h(
    'div',
    { class: 'igrid' },
    images.map((im) => {
      const url = URL.createObjectURL(new Blob([im.data], { type: im.mime }))
      return h(
        'div',
        {
          class: 'icard' + (selected?.has(im) ? ' sel' : ''),
          onclick: onToggle ? () => onToggle(im) : undefined,
        },
        h('img', {
          src: url,
          alt: im.name,
          loading: 'lazy',
          onload: () => URL.revokeObjectURL(url),
          onerror: () => URL.revokeObjectURL(url),
        }),
        h('div', { class: 'imeta' },
          h('span', { class: 'iname' }, im.name),
          h('span', { class: 'idim' }, `${im.w}×${im.h} · ${fmtBytes(im.data.length)}${im.dupCount > 1 ? ` · ×${im.dupCount}` : ''}`),
        ),
        onToggle && selected?.has(im) ? h('div', { class: 'pchk' }, icon('check', 'icon-sm')) : null,
        h('button', { type: 'button', class: 'isave', title: 'Download', onclick: (e) => { e.stopPropagation(); onSave(im) } }, icon('download', 'icon-sm')),
      )
    }),
  )
}

/**
 * Modal page zoom — show a canvas (or any node) large, Esc/click-out to close.
 */
function openLightbox(node, caption = '') {
  const onKey = (e) => { if (e.key === 'Escape') close() }
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey) }
  const ov = h(
    'div',
    { class: 'lightbox', onclick: (e) => { if (e.target === ov) close() } },
    h('div', { class: 'lb-box' }, node, caption ? h('div', { class: 'lb-cap' }, caption) : null),
  )
  document.addEventListener('keydown', onKey)
  document.body.append(ov)
  return close
}

/**
 * Metadata preview table for Scrub — shows exactly what will be wiped.
 * meta: {fields: [{key, value}], xmp, id}
 */
function MetaTable({ fields, xmp, id }) {
  const rows = fields.map((f) =>
    h('tr', {}, h('td', { class: 'mkey' }, f.key), h('td', { class: 'mval' }, f.value)),
  )
  if (xmp) rows.push(h('tr', {}, h('td', { class: 'mkey' }, 'XMP stream'), h('td', { class: 'mval' }, 'embedded metadata packet')))
  if (id) rows.push(h('tr', {}, h('td', { class: 'mkey' }, 'Document ID'), h('td', { class: 'mval' }, 'unique fingerprint in trailer')))
  if (!rows.length) return h('p', { class: 'meta dim' }, 'No metadata found — this file is already clean.')
  return h('table', { class: 'mtable' }, h('tbody', {}, rows))
}

/** Small text-button toolbar row (Organize bulk actions). */
function Toolbar(actions) {
  return h(
    'div',
    { class: 'toolbar' },
    actions.map(([label, onclick, disabled]) =>
      h('button', { type: 'button', class: 'tbtn', onclick, disabled: disabled || undefined }, label),
    ),
  )
}

// ---- src/tools/merge.js ----

function Merge() {
  let files = [] // {file, bytes, pages, doc, leaves, thumbNode, expanded, detail}
  let busy = false
  let error = ''
  let outName = 'merged'
  const root = h('div', { class: 'tool' })

  const add = async (incoming) => {
    for (const f of incoming) {
      const entry = {
        name: f.name, size: f.size, file: f,
        bytes: null, pages: null, doc: null, leaves: null, cache: new Map(),
        thumbNode: null, expanded: false, detail: null,
        meta: 'reading…', err: null,
      }
      entry.onExpand = () => expand(entry)
      files.push(entry)
      render()
      try {
        const bytes = await readBytes(f)
        entry.bytes = bytes
        const doc = await parsePdf(bytes)
        entry.doc = doc
        entry.leaves = pageLeaves(doc)
        entry.pages = entry.leaves.length
        entry.meta = `${entry.pages} page${entry.pages === 1 ? '' : 's'}`
        try {
          const canvas = await renderPage(doc, entry.leaves[0], { width: 72, cache: entry.cache })
          if (canvas) { canvas.className = 'thumb pcanvas-sm'; entry.thumbNode = canvas }
        } catch { /* no thumbnail — row keeps index */ }
      } catch {
        entry.err = 'not a readable PDF'
        entry.meta = ''
      }
      render()
    }
  }

  const expand = async (entry) => {
    entry.expanded = !entry.expanded
    if (!entry.expanded || !entry.leaves) { entry.detail = null; render(); return }
    const strip = h('div', { class: 'pstrip' }, h('span', { class: 'meta dim' }, 'rendering…'))
    entry.detail = strip
    render()
    for (let i = 0; i < entry.leaves.length; i++) {
      if (!entry.expanded) return // collapsed while rendering
      try {
        const c = await renderPage(entry.doc, entry.leaves[i], { width: 64, cache: entry.cache })
        if (c) {
          c.className = 'pcanvas-sm'
          c.title = `page ${i + 1}`
          strip.append(h('div', { class: 'pstrip-cell' }, c, h('span', { class: 'pstrip-n' }, `${i + 1}`)))
          if (i === 0) strip.firstChild.remove() // drop "rendering…"
        }
      } catch { /* skip page */ }
    }
    if (!strip.querySelectorAll('canvas').length) setKids(strip, h('span', { class: 'meta dim' }, 'no renderable pages'))
  }

  const move = (from, to) => {
    const c = [...files]
    const [x] = c.splice(from, 1)
    c.splice(to, 0, x)
    files = c
    render()
  }

  const run = async () => {
    busy = true
    error = ''
    render()
    try {
      const bad = files.find((f) => !f.bytes)
      if (bad) throw new Error(`"${bad.file.name}" isn't a readable PDF — remove it`)
      const out = await mergePdfs(files.map((f) => f.bytes))
      const name = (outName.trim() || 'merged').replace(/\.pdf$/i, '')
      saveBlob(new Blob([out], { type: 'application/pdf' }), `${name}.pdf`)
    } catch (e) {
      error = e.message || 'merge failed'
    } finally {
      busy = false
      render()
    }
  }

  function render() {
    const good = files.filter((f) => f.bytes)
    const total = good.reduce((n, f) => n + (f.pages || 0), 0)
    const estSize = good.reduce((n, f) => n + f.size, 0)
    setKids(root,
      DropZone({
        accept: 'application/pdf',
        multiple: true,
        onFiles: add,
        label: files.length ? 'Drop more PDFs to add them or ' : undefined,
      }),
      files.length
        ? Card(
            FileList({ files, onMove: move, onRemove: (i) => { files = files.filter((_, j) => j !== i); render() } }),
            h('p', { class: 'meta dim', style: { marginTop: '10px' } },
              `Drag to reorder · ${good.length} valid · ${total} pages total · ~${fmtBytes(estSize)} output`),
          )
        : null,
      files.length
        ? Card(
            h('label', { class: 'lbl' }, 'Output filename'),
            h('input', {
              class: 'textin', value: outName, placeholder: 'merged',
              oninput: (e) => (outName = e.target.value),
            }),
          )
        : null,
      ErrorText(error),
      Btn(busy ? 'Merging…' : `Merge ${good.length} PDFs · ${total} pages`, {
        onclick: run,
        disabled: busy || good.length < 2 || good.length !== files.length,
      }),
    )
  }
  render()
  return root
}

// ---- src/tools/split.js ----

/** Selected set → "1-3, 5" spec string. */
const selToSpec = (sel) => {
  const pgs = [...sel].sort((a, b) => a - b)
  const parts = []
  for (let i = 0; i < pgs.length; i++) {
    let j = i
    while (j + 1 < pgs.length && pgs[j + 1] === pgs[j] + 1) j++
    parts.push(pgs[i] === pgs[j] ? `${pgs[i]}` : `${pgs[i]}-${pgs[j]}`)
    i = j
  }
  return parts.join(', ')
}

function Split() {
  let file = null
  let bytes = null
  let doc = null
  let leaves = []
  let items = [] // {page, w, h, canvas, imgUrl, text}
  let selected = new Set()
  let lastPick = null // for shift-click ranges
  let spec = ''
  let specOK = true
  let mode = 'one'
  let busy = false
  let error = ''
  let loadGen = 0
  let urls = []
  const imgCache = new Map()
  const root = h('div', { class: 'tool' })

  const load = async ([f]) => {
    const my = ++loadGen
    error = ''
    file = f
    items = []
    selected = new Set()
    lastPick = null
    spec = ''
    specOK = true
    imgCache.clear()
    for (const u of urls) URL.revokeObjectURL(u)
    urls = []
    render()
    try {
      const b = await readBytes(f)
      if (my !== loadGen) return
      const d = await parsePdf(b)
      if (my !== loadGen) return
      bytes = b
      doc = d
      leaves = pageLeaves(d)
      const dims = pageDims(d)
      items = dims.map((d2, i) => ({ page: i + 1, w: d2.w, h: d2.h, canvas: null, imgUrl: null, text: '' }))
      selected = new Set(items.map((i) => i.page))
      spec = selToSpec(selected)
      render()
      leaves.forEach(async (leaf, i) => {
        try {
          const canvas = await renderPage(d, leaf, { width: 200, cache: imgCache })
          if (my !== loadGen) return
          if (canvas) {
            canvas.className = 'pcanvas'
            items[i].canvas = canvas
          } else {
            const pv = await pagePreview(d, leaf)
            if (my !== loadGen) return
            if (pv.img) {
              items[i].imgUrl = URL.createObjectURL(new Blob([pv.img.data], { type: pv.img.mime }))
              urls.push(items[i].imgUrl)
            } else {
              items[i].text = pv.text
            }
          }
          render()
        } catch { /* card keeps dims */ }
      })
    } catch (e) {
      if (my !== loadGen) return
      error = e.message || 'could not read that PDF'
      file = null
      bytes = null
      doc = null
    }
    render()
  }

  const zoom = async (page) => {
    try {
      const it = items[page - 1]
      const canvas = await renderPage(doc, leaves[page - 1], { width: Math.min(860, it.w * 1.5), cache: imgCache })
      if (canvas) openLightbox(canvas, `page ${page} · ${it.w}×${it.h}pt`)
    } catch { /* no preview */ }
  }

  const toggle = (page, shift) => {
    if (shift && lastPick !== null) {
      const [a, b] = lastPick < page ? [lastPick, page] : [page, lastPick]
      for (let p = a; p <= b; p++) selected.add(p)
    } else {
      selected.has(page) ? selected.delete(page) : selected.add(page)
    }
    lastPick = page
    spec = selToSpec(selected)
    specOK = true
    render()
  }

  const preset = (kind) => {
    selected = new Set(
      kind === 'all' ? items.map((i) => i.page)
      : kind === 'none' ? []
      : items.filter((i) => (kind === 'odd') === (i.page % 2 === 1)).map((i) => i.page),
    )
    lastPick = null
    spec = selToSpec(selected)
    specOK = true
    render()
  }

  let gridEl = null
  let btnEl = null

  const onSpec = (v) => {
    spec = v
    try {
      selected = new Set(parseRanges(v, items.length).flatMap(({ from, to }) =>
        Array.from({ length: to - from + 1 }, (_, i) => from + i)))
      specOK = true
    } catch {
      specOK = false // leave cards as-is until the spec parses
    }
    if (btnEl) btnEl.disabled = busy || !specOK || !selected.size
    // hot-swap only the grid — full render() would nuke input focus mid-typing
    if (specOK && gridEl) {
      const fresh = SelectGrid({ items, selected, onToggle: toggle, onZoom: zoom })
      gridEl.replaceWith(fresh)
      gridEl = fresh
    }
  }

  const run = async () => {
    busy = true
    error = ''
    render()
    try {
      const stem = file.name.replace(/\.pdf$/i, '')
      if (mode === 'one') {
        const ranges = parseRanges(spec, items.length)
        const out = await extractPages(bytes, ranges)
        saveBlob(new Blob([out], { type: 'application/pdf' }), `${stem}-pages.pdf`)
      } else if (mode === 'each') {
        const pgs = [...selected].sort((a, b) => a - b)
        const outs = await splitPdf(bytes, pgs.map((p) => ({ from: p, to: p })))
        saveBlob(
          new Blob([zipStore(outs.map((out, i) => ({
            name: `${stem}-p${pgs[i]}.pdf`,
            data: out,
          })))], { type: 'application/zip' }),
          `${stem}-pages.zip`,
        )
      } else {
        const ranges = parseRanges(spec, items.length)
        const outs = await splitPdf(bytes, ranges)
        saveBlob(
          new Blob([zipStore(outs.map((out, i) => ({
            name: `${stem}-${ranges[i].from}-${ranges[i].to}.pdf`,
            data: out,
          })))], { type: 'application/zip' }),
          `${stem}-split.zip`,
        )
      }
    } catch (e) {
      error = e.message || 'split failed'
    } finally {
      busy = false
      render()
    }
  }

  const radio = (val, text) =>
    h(
      'label',
      { class: 'radio' },
      h('input', {
        type: 'radio',
        name: 'splitmode',
        checked: mode === val || undefined,
        onchange: () => { mode = val; render() },
      }),
      text,
    )

  function render() {
    setKids(root,
      DropZone({ accept: 'application/pdf', onFiles: load }),
      file
        ? Card(
            h('p', { class: 'meta' }, h('b', {}, file.name), ` — ${items.length} pages`),
            h('p', { class: 'meta dim' }, 'Click pages to pick them · shift-click selects a range'),
            Toolbar([
              ['All', () => preset('all')],
              ['None', () => preset('none')],
              ['Odd pages', () => preset('odd')],
              ['Even pages', () => preset('even')],
            ]),
          )
        : null,
      items.length ? (gridEl = SelectGrid({ items, selected, onToggle: toggle, onZoom: zoom })) : null,
      file
        ? Card(
            h('label', { class: 'lbl' }, 'Ranges (synced with your picks — edit either)'),
            h('input', {
              class: 'textin',
              value: spec,
              oninput: (e) => onSpec(e.target.value),
            }),
            h(
              'div',
              { class: 'radio-row' },
              radio('one', 'One PDF with those pages'),
              radio('zip', 'Separate PDF per range (zip)'),
              radio('each', 'One PDF per selected page (zip)'),
            ),
          )
        : null,
      ErrorText(error),
      file
        ? (btnEl = Btn(
            busy ? 'Working…' : `Extract ${selected.size} page${selected.size === 1 ? '' : 's'}`,
            { onclick: run, disabled: busy || !specOK || !selected.size },
          ))
        : (btnEl = null),
    )
  }
  render()
  return root
}

// ---- src/tools/organize.js ----

/** Copy a rendered canvas (cloneNode doesn't carry the bitmap). */
const cloneCanvas = (src) => {
  const c = document.createElement('canvas')
  c.width = src.width
  c.height = src.height
  c.getContext('2d').drawImage(src, 0, 0)
  c.className = src.className
  c.draggable = false
  return c
}

function Organize() {
  let file = null
  let bytes = null
  let doc = null
  let leaves = []
  let items = [] // {page, w, h, rotation, deleted, canvas, imgUrl, text}
  let sel = new Set() // selected item objects (identity survives reorder)
  let lastIdx = null // shift-click anchor
  let moveTo = 1
  let urls = []
  let history = [] // undo stack of item-list snapshots
  let busy = false
  let error = ''
  let loadGen = 0
  const imgCache = new Map() // shared decode cache across pages of this doc
  const root = h('div', { class: 'tool' })

  const load = async ([f]) => {
    const my = ++loadGen
    error = ''
    file = f
    items = []
    sel = new Set()
    lastIdx = null
    history = []
    imgCache.clear()
    for (const u of urls) URL.revokeObjectURL(u)
    urls = []
    render()
    try {
      const b = await readBytes(f)
      if (my !== loadGen) return
      const d = await parsePdf(b)
      if (my !== loadGen) return
      bytes = b
      doc = d
      leaves = pageLeaves(d)
      items = leaves.map((leaf, i) => {
        const mb = get(leaf.dict, 'MediaBox') ?? leaf.inh.MediaBox ?? [0, 0, 0, 0]
        return {
          page: i + 1,
          w: Math.round(mb[2] - mb[0]),
          h: Math.round(mb[3] - mb[1]),
          rotation: 0,
          deleted: false,
          canvas: null,
          imgUrl: null,
          text: '',
        }
      })
      render()
      // fill previews progressively: real mini-render first, image/text fallback
      leaves.forEach(async (leaf, i) => {
        try {
          const canvas = await renderPage(d, leaf, { width: 200, cache: imgCache })
          if (my !== loadGen) return
          if (canvas) {
            canvas.className = 'pcanvas'
            canvas.draggable = false
            items[i].canvas = canvas
          } else {
            const pv = await pagePreview(d, leaf)
            if (my !== loadGen) return
            if (pv.img) {
              items[i].imgUrl = URL.createObjectURL(new Blob([pv.img.data], { type: pv.img.mime }))
              urls.push(items[i].imgUrl)
            } else {
              items[i].text = pv.text
            }
          }
          render()
        } catch { /* card keeps dims */ }
      })
    } catch (e) {
      if (my !== loadGen) return
      error = e.message || 'could not read that PDF'
      file = null
      bytes = null
      doc = null
    }
    render()
  }

  const mutate = (fn) => {
    history.push([...items])
    if (history.length > 50) history.shift()
    fn()
    render()
  }

  const undo = () => {
    if (!history.length) return
    items = history.pop()
    sel = new Set([...sel].filter((x) => items.includes(x)))
    render()
  }

  const onSelect = (i, shift) => {
    if (shift && lastIdx !== null) {
      const [a, b] = lastIdx < i ? [lastIdx, i] : [i, lastIdx]
      for (let k = a; k <= b; k++) sel.add(items[k])
    } else {
      sel.has(items[i]) ? sel.delete(items[i]) : sel.add(items[i])
    }
    lastIdx = i
    render()
  }

  const applySel = (fn) => mutate(() => { items = items.map((x) => (sel.has(x) ? fn(x) : x)) })

  const moveSelected = (where) => mutate(() => {
    const picked = items.filter((x) => sel.has(x))
    const rest = items.filter((x) => !sel.has(x))
    if (!picked.length) return
    if (where === 'front') items = [...picked, ...rest]
    else if (where === 'back') items = [...rest, ...picked]
    else {
      const idx = Math.max(0, Math.min(rest.length, moveTo - 1))
      items = [...rest.slice(0, idx), ...picked, ...rest.slice(idx)]
    }
  })

  const dupSelected = () => mutate(() => {
    const picked = items.filter((x) => sel.has(x))
    if (!picked.length) return
    const lastPos = items.lastIndexOf(picked[picked.length - 1])
    // clone canvas nodes — a DOM node can only live in one card at a time
    const dups = picked.map((x) => ({ ...x, canvas: x.canvas ? cloneCanvas(x.canvas) : null }))
    items = [...items.slice(0, lastPos + 1), ...dups, ...items.slice(lastPos + 1)]
  })

  const onZoom = async (i) => {
    const it = items[i]
    const leaf = leaves[it.page - 1]
    try {
      const canvas = await renderPage(doc, leaf, { width: Math.min(860, it.w * 1.5), cache: imgCache })
      if (canvas) openLightbox(canvas, `page ${it.page} · ${it.w}×${it.h}pt${it.rotation ? ` · rotated ${it.rotation}°` : ''}`)
    } catch { /* no preview */ }
  }

  const extractSel = async () => {
    const picked = items.filter((x) => sel.has(x) && !x.deleted)
    if (!picked.length) return
    busy = true
    error = ''
    render()
    try {
      const out = await organizePages(bytes, picked.map((x) => ({ page: x.page, rotation: x.rotation })))
      saveBlob(new Blob([out], { type: 'application/pdf' }), `${file.name.replace(/\.pdf$/i, '')}-extract.pdf`)
    } catch (e) {
      error = e.message || 'failed'
    } finally {
      busy = false
      render()
    }
  }

  const run = async () => {
    busy = true
    error = ''
    render()
    try {
      const ops = items.filter((it) => !it.deleted).map((it) => ({ page: it.page, rotation: it.rotation }))
      if (!ops.length) throw new Error('all pages deleted')
      const out = await organizePages(bytes, ops)
      saveBlob(
        new Blob([out], { type: 'application/pdf' }),
        `${file.name.replace(/\.pdf$/i, '')}-organized.pdf`,
      )
    } catch (e) {
      error = e.message || 'failed'
    } finally {
      busy = false
      render()
    }
  }

  // keyboard: Ctrl+A select-all, Del delete, Ctrl+Z undo — self-removes when detached
  const onKey = (e) => {
    if (!root.isConnected) return document.removeEventListener('keydown', onKey)
    if (!items.length || /input|textarea|select/i.test(e.target.tagName)) return
    if (e.ctrlKey && e.key === 'a') { e.preventDefault(); sel = new Set(items); render() }
    else if (e.key === 'Delete' && sel.size) applySel((x) => ({ ...x, deleted: true }))
    else if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo() }
  }
  document.addEventListener('keydown', onKey)

  function render() {
    const kept = items.filter((i) => !i.deleted).length
    const n = sel.size
    setKids(root,
      DropZone({ accept: 'application/pdf', onFiles: load }),
      items.length
        ? h('p', { class: 'meta dim' },
            `Click to select (shift = range) · drag a card onto another to swap · ⌨ Ctrl+A / Del / Ctrl+Z · ${kept} of ${items.length} kept${n ? ` · ${n} selected` : ''}`)
        : null,
      items.length
        ? Toolbar([
            ['Select all', () => { sel = new Set(items); render() }],
            ['Clear', () => { sel = new Set(); render() }, !n],
            ['Invert', () => { sel = new Set(items.filter((x) => !sel.has(x))); render() }],
            ['⇤ To front', () => moveSelected('front'), !n],
            ['To back ⇥', () => moveSelected('back'), !n],
            ['Rotate sel +90°', () => applySel((x) => ({ ...x, rotation: (x.rotation + 90) % 360 })), !n],
            ['Delete sel', () => applySel((x) => ({ ...x, deleted: true })), !n],
            ['Duplicate sel', dupSelected, !n],
            ['↶ Undo', undo, !history.length],
            ['Restore all', () => mutate(() => { items = items.map((x) => ({ ...x, deleted: false })) }), kept === items.length],
            ['Reset all', () => mutate(() => {
              items = items.map((x) => ({ ...x, rotation: 0, deleted: false }))
              items.sort((a, b) => a.page - b.page)
              sel = new Set()
            })],
          ])
        : null,
      items.length
        ? h('div', { class: 'toolbar' },
            h('label', { class: 'lbl', style: { alignSelf: 'center', margin: 0 } }, 'Move selected to position'),
            h('input', {
              class: 'textin num', type: 'number', value: moveTo, min: 1, max: items.length,
              style: { width: '80px', margin: 0 },
              oninput: (e) => (moveTo = parseInt(e.target.value, 10) || 1),
            }),
            h('button', { type: 'button', class: 'tbtn', disabled: !n || undefined, onclick: () => moveSelected('at') }, 'Move'),
            n ? h('button', { type: 'button', class: 'tbtn', onclick: extractSel, disabled: busy || undefined }, 'Download selected as PDF') : null,
          )
        : null,
      items.length
        ? PageGrid({
            items,
            selected: sel,
            onSelect,
            onZoom,
            onDrop: (from, to) => mutate(() => {
              if (sel.size > 1 && sel.has(items[from])) {
                // block-move the selection, dragged item lands at index `to`
                const picked = items.filter((x) => sel.has(x))
                const rest = items.filter((x) => !sel.has(x))
                const at = Math.max(0, Math.min(rest.length, to - picked.indexOf(items[from])))
                items = [...rest.slice(0, at), ...picked, ...rest.slice(at)]
              } else {
                const c = [...items]
                const tmp = c[from]
                c[from] = c[to]
                c[to] = tmp
                items = c
              }
            }),
            onRotate: (i, delta) => mutate(() => {
              items = items.map((x, j) => (j === i ? { ...x, rotation: ((x.rotation + delta) % 360 + 360) % 360 } : x))
            }),
            onToggleDelete: (i) => mutate(() => {
              items = items.map((x, j) => (j === i ? { ...x, deleted: !x.deleted } : x))
            }),
          })
        : null,
      ErrorText(error),
      items.length
        ? Btn(busy ? 'Building…' : `Download organized PDF (${kept} pages)`, { onclick: run, disabled: busy || kept === 0 })
        : null,
    )
    // apply rotation to rendered canvases so cards reflect it
    for (const it of items) {
      if (it.canvas) it.canvas.style.transform = it.rotation ? `rotate(${it.rotation}deg)` : ''
    }
  }
  render()
  return root
}

// ---- src/tools/edit.js ----

/**
 * Edit PDF — annotation layer over rendered pages: pen (pressure), highlighter,
 * text, line/arrow, rect/ellipse, whiteout, images, select/move/resize, eraser.
 * Annotations live in DISPLAY space (top-left origin, pt units, post-/Rotate
 * dims) — exactly the space annotatePdf() consumes on export.
 */
function Edit() {
  // ---------- state ----------
  let file = null
  let bytes = null
  let doc = null
  let leaves = []
  let dims = []
  let annots = [] // annots[i] = annotation objects for page i
  let page = 0
  let zoom = 1
  let tool = 'select'
  let color = '#e03131'
  let penWidth = 4
  let alpha = 1
  let font = 'helv'
  let fontSize = 16
  let sel = null // selected annotation (object identity inside annots[page])
  let undoStack = []
  let redoStack = []
  let busy = false
  let error = ''
  let loadGen = 0
  let baseGen = 0
  const imgCache = new Map() // shared page-render decode cache
  const bmpCache = new WeakMap() // image annot → ImageBitmap | Promise
  const root = h('div', { class: 'tool' })

  // dom refs — built once per loaded doc, updated in place (canvas state is precious)
  let editorEl = null
  let stage, pageEl, base, over, octx, delChip
  let thumbsEl, thumbObs
  let metaEl, pageLbl, zoomLbl, prevBtn, nextBtn, dlBtn
  let toolBtns, fontWrap, widthSlider, widthLbl, alphaSlider, alphaLbl, colorPick
  let swatchEls = []
  let actionSlot
  let txtIn = null // {ta, x, y} floating text editor

  // gesture state
  const pointers = new Map() // pointerId → {x,y} client px — powers pinch zoom
  let pinch = null // {d} last finger-pair distance
  let draft = null // in-progress stroke/shape (not yet committed)
  let drag = null // {kind:'shape'|'move'|'resize', corner, sx, sy, o, pushed}
  let captureId = null // pointerId owning the active gesture
  let tap = null // {id,x,y} pending text/eraser tap
  let pendingDeselect = null // pointerId of an empty-space press awaiting its up

  const ED_TOOLS = [
    ['select', 'Select'], ['pen', 'Pen'], ['hilite', 'Highlight'], ['text', 'Text'],
    ['line', 'Line'], ['arrow', 'Arrow'], ['rect', 'Rect'], ['ellipse', 'Ellipse'],
    ['whiteout', 'Whiteout'], ['image', 'Image'], ['eraser', 'Eraser'],
  ]
  const ED_COLORS = ['#111111', '#e03131', '#1971c2', '#2f9e44', '#f08c00', '#862e9c', '#ffffff']
  const ED_FONTS = [['helv', 'Helvetica'], ['helvb', 'Helvetica Bold'], ['times', 'Times'], ['courier', 'Courier']]
  const ED_DRAW = new Set(['pen', 'hilite', 'line', 'arrow', 'rect', 'ellipse', 'whiteout'])
  const ED_FAM = {
    helv: 'Helvetica, Arial, sans-serif',
    helvb: 'Helvetica, Arial, sans-serif',
    times: '"Times New Roman", Times, serif',
    courier: '"Courier New", Courier, monospace',
  }

  // ---------- geometry ----------
  const pageW = () => (dims[page].rotate % 180 === 0 ? dims[page].w : dims[page].h)
  const pageH = () => (dims[page].rotate % 180 === 0 ? dims[page].h : dims[page].w)
  const toPt = (cx, cy) => {
    const r = over.getBoundingClientRect()
    return [(cx - r.left) / zoom, (cy - r.top) / zoom]
  }
  const distSeg = (px, py, x1, y1, x2, y2) => {
    const dx = x2 - x1, dy = y2 - y1
    const l2 = dx * dx + dy * dy
    let t = l2 ? ((px - x1) * dx + (py - y1) * dy) / l2 : 0
    t = Math.max(0, Math.min(1, t))
    return Math.hypot(x1 + t * dx - px, y1 + t * dy - py)
  }

  const edTextBox = (a) => {
    const lines = String(a.text).split('\n')
    return {
      x: a.x, y: a.y,
      w: Math.max(4, Math.max(...lines.map((l) => l.length)) * a.size * 0.5),
      h: lines.length * a.size * 1.2,
    }
  }

  const edBBox = (a) => {
    if (a.pts?.length) {
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9
      for (const p of a.pts) {
        const r = (p[2] ?? a.width ?? 2) / 2 + 1
        x0 = Math.min(x0, p[0] - r); y0 = Math.min(y0, p[1] - r)
        x1 = Math.max(x1, p[0] + r); y1 = Math.max(y1, p[1] + r)
      }
      return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 }
    }
    if (a.t === 'line') {
      const r = (a.width ?? 2) / 2 + 2
      const x0 = Math.min(a.x1, a.x2) - r, y0 = Math.min(a.y1, a.y2) - r
      return { x: x0, y: y0, w: Math.abs(a.x2 - a.x1) + 2 * r, h: Math.abs(a.y2 - a.y1) + 2 * r }
    }
    if (a.t === 'text') return edTextBox(a)
    if (a.w !== undefined) return { x: a.x, y: a.y, w: a.w, h: a.h }
    return null
  }

  const edResizable = (a) => a.t === 'image' || a.t === 'rect' || a.t === 'ellipse' || a.t === 'text'
  const edCorners = (b) => [
    ['nw', b.x, b.y], ['ne', b.x + b.w, b.y],
    ['sw', b.x, b.y + b.h], ['se', b.x + b.w, b.y + b.h],
  ]
  const handleAt = (a, x, y) => {
    const b = edBBox(a)
    const hs = 6 / zoom // 12 css px hit target
    for (const [id, cx, cy] of edCorners(b)) {
      if (Math.abs(x - cx) <= hs && Math.abs(y - cy) <= hs) return id
    }
    return null
  }

  const edHit = (a, x, y) => {
    if (a.pts) {
      const tol = Math.max(6, (a.width ?? 4) / 2 + 4)
      if (a.pts.length === 1) return Math.hypot(x - a.pts[0][0], y - a.pts[0][1]) < tol
      for (let i = 1; i < a.pts.length; i++) {
        const t2 = a.t === 'vstroke' ? Math.max(6, (a.pts[i][2] ?? 2) / 2 + 4) : tol
        if (distSeg(x, y, a.pts[i - 1][0], a.pts[i - 1][1], a.pts[i][0], a.pts[i][1]) < t2) return true
      }
      return false
    }
    if (a.t === 'line') return distSeg(x, y, a.x1, a.y1, a.x2, a.y2) < Math.max(6, (a.width ?? 2) / 2 + 4)
    const b = edBBox(a)
    if (!b) return false
    if (a.t === 'rect' || a.t === 'ellipse') {
      if (a.fill) return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h
      const band = (a.lw ?? 2) / 2 + 4
      const outer = x >= b.x - band && x <= b.x + b.w + band && y >= b.y - band && y <= b.y + b.h + band
      const inner = x > b.x + band && x < b.x + b.w - band && y > b.y + band && y < b.y + b.h - band
      return outer && !inner
    }
    return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h // text, image
  }

  const pickAt = (x, y) => {
    if (sel && edResizable(sel) && annots[page].includes(sel)) {
      const c = handleAt(sel, x, y)
      if (c) return { a: sel, corner: c }
    }
    const arr = annots[page]
    for (let i = arr.length - 1; i >= 0; i--) if (edHit(arr[i], x, y)) return { a: arr[i] }
    return null
  }

  // coords-only copy (jpeg bytes shared — they are never mutated in place)
  const edSnap = (a) => {
    const o = { ...a }
    if (a.pts) o.pts = a.pts.map((p) => [...p])
    return o
  }
  const edRestore = (a, o) => {
    for (const k of ['x', 'y', 'x1', 'y1', 'x2', 'y2', 'w', 'h', 'size'])
      if (o[k] !== undefined) a[k] = o[k]
    if (o.pts) a.pts = o.pts.map((p) => [...p])
  }
  const edMove = (o, a, dx, dy) => {
    if (o.pts) a.pts = o.pts.map((p) => [p[0] + dx, p[1] + dy, ...p.slice(2)])
    if (o.x !== undefined) a.x = o.x + dx
    if (o.y !== undefined) a.y = o.y + dy
    if (o.x1 !== undefined) { a.x1 = o.x1 + dx; a.y1 = o.y1 + dy; a.x2 = o.x2 + dx; a.y2 = o.y2 + dy }
  }
  const edResize = (o, a, corner, x, y) => {
    if (a.t === 'text') { // scale font about the opposite corner
      const ob = edTextBox(o)
      const opp = { nw: [ob.x + ob.w, ob.y + ob.h], ne: [ob.x, ob.y + ob.h], sw: [ob.x + ob.w, ob.y], se: [ob.x, ob.y] }[corner]
      const oc = { nw: [ob.x, ob.y], ne: [ob.x + ob.w, ob.y], sw: [ob.x, ob.y + ob.h], se: [ob.x + ob.w, ob.y + ob.h] }[corner]
      const d0 = Math.hypot(oc[0] - opp[0], oc[1] - opp[1]) || 1
      const f = Math.max(0.1, Math.min(20, Math.hypot(x - opp[0], y - opp[1]) / d0))
      a.size = Math.max(4, o.size * f)
      a.x = corner[1] === 'w' ? opp[0] - ob.w * f : opp[0]
      a.y = corner[0] === 'n' ? opp[1] - ob.h * f : opp[1]
      return
    }
    const x1 = o.x + o.w, y1 = o.y + o.h
    if (corner[1] === 'w') { a.x = Math.min(x, x1 - 4); a.w = x1 - a.x }
    if (corner[1] === 'e') a.w = Math.max(4, x - o.x)
    if (corner[0] === 'n') { a.y = Math.min(y, y1 - 4); a.h = y1 - a.y }
    if (corner[0] === 's') a.h = Math.max(4, y - o.y)
  }

  // ---------- undo / redo ----------
  const edCloneAnnots = () => annots.map((arr) => arr.map(edSnap))
  const pushUndo = () => {
    undoStack.push(edCloneAnnots())
    if (undoStack.length > 50) undoStack.shift()
    redoStack = []
  }
  const undo = () => {
    if (!undoStack.length) return
    redoStack.push(edCloneAnnots())
    annots = undoStack.pop()
    if (sel && !annots[page].includes(sel)) sel = null
    afterMut()
  }
  const redo = () => {
    if (!redoStack.length) return
    undoStack.push(edCloneAnnots())
    annots = redoStack.pop()
    if (sel && !annots[page].includes(sel)) sel = null
    afterMut()
  }
  const afterMut = () => { redraw(); updateChrome() }

  // ---------- overlay painting ----------
  const bmpFor = (a) => {
    let b = bmpCache.get(a)
    if (b === undefined) {
      b = createImageBitmap(new Blob([a.jpeg], { type: 'image/jpeg' })).catch(() => null)
      bmpCache.set(a, b)
      b.then((r) => { bmpCache.set(a, r); if (root.isConnected) redraw() })
      return null
    }
    return b instanceof ImageBitmap ? b : null
  }

  const drawAnnot = (c, a, S) => {
    c.globalAlpha = a.alpha ?? 1
    if (a.t === 'stroke' || a.t === 'highlight' || a.t === 'vstroke') {
      c.strokeStyle = a.color
      if (a.t === 'vstroke') {
        for (let i = 1; i < a.pts.length; i++) {
          const [x0, y0, w0] = a.pts[i - 1]
          const [x1, y1, w1] = a.pts[i]
          c.lineWidth = Math.max(0.5, ((w0 + w1) / 2) * S)
          c.beginPath()
          c.moveTo(x0 * S, y0 * S)
          c.lineTo(x1 * S, y1 * S)
          c.stroke()
        }
        if (a.pts.length === 1) {
          const [x, y, w] = a.pts[0]
          c.fillStyle = a.color
          c.beginPath()
          c.arc(x * S, y * S, Math.max(0.5, (w * S) / 2), 0, 7)
          c.fill()
        }
      } else {
        c.lineWidth = Math.max(0.5, (a.width ?? 2) * S)
        c.beginPath()
        a.pts.forEach((p, i) => (i ? c.lineTo(p[0] * S, p[1] * S) : c.moveTo(p[0] * S, p[1] * S)))
        if (a.pts.length === 1) c.lineTo(a.pts[0][0] * S + 0.01, a.pts[0][1] * S)
        c.stroke()
      }
    } else if (a.t === 'line') {
      c.strokeStyle = a.color
      c.lineWidth = Math.max(0.5, (a.width ?? 2) * S)
      c.beginPath()
      c.moveTo(a.x1 * S, a.y1 * S)
      c.lineTo(a.x2 * S, a.y2 * S)
      if (a.arrow) {
        const ang = Math.atan2(a.y2 - a.y1, a.x2 - a.x1)
        const hl = Math.max(8, (a.width ?? 2) * 3)
        for (const s of [1, -1]) {
          const th = ang + Math.PI + s * 0.45
          c.moveTo(a.x2 * S, a.y2 * S)
          c.lineTo((a.x2 + hl * Math.cos(th)) * S, (a.y2 + hl * Math.sin(th)) * S)
        }
      }
      c.stroke()
    } else if (a.t === 'rect' || a.t === 'ellipse') {
      c.beginPath()
      if (a.t === 'rect') c.rect(a.x * S, a.y * S, a.w * S, a.h * S)
      else c.ellipse((a.x + a.w / 2) * S, (a.y + a.h / 2) * S, (a.w / 2) * S, (a.h / 2) * S, 0, 0, 7)
      if (a.fill) { c.fillStyle = a.fill; c.fill() }
      if (a.stroke) { c.strokeStyle = a.stroke; c.lineWidth = Math.max(0.5, (a.lw ?? 2) * S); c.stroke() }
    } else if (a.t === 'text') {
      // y anchors the TOP of the first line — baseline ≈ y+size (matches export)
      c.fillStyle = a.color
      c.font = `${a.font === 'helvb' ? '700 ' : ''}${a.size * S}px ${ED_FAM[a.font] ?? ED_FAM.helv}`
      String(a.text).split('\n').forEach((ln, i) => c.fillText(ln, a.x * S, (a.y + a.size + i * a.size * 1.2) * S))
    } else if (a.t === 'image') {
      const b = bmpFor(a)
      if (b) c.drawImage(b, a.x * S, a.y * S, a.w * S, a.h * S)
      else { c.strokeStyle = '#71717b'; c.lineWidth = 1; c.strokeRect(a.x * S, a.y * S, a.w * S, a.h * S) }
    }
    c.globalAlpha = 1
  }

  const drawSel = (c, a, S) => {
    const b = edBBox(a)
    if (!b) return
    const u = S / zoom // canvas px per css px — chrome stays constant on screen
    c.save()
    c.strokeStyle = '#34d399'
    c.lineWidth = 1.5 * u
    c.setLineDash([5 * u, 4 * u])
    c.strokeRect((b.x - 4) * S, (b.y - 4) * S, (b.w + 8) * S, (b.h + 8) * S)
    c.setLineDash([])
    if (edResizable(a)) {
      const hs = 4 / zoom // 8 css px squares at bbox corners
      c.fillStyle = '#34d399'
      c.strokeStyle = '#09090b'
      for (const [, cx, cy] of edCorners(b)) {
        c.fillRect((cx - hs) * S, (cy - hs) * S, hs * 2 * S, hs * 2 * S)
        c.strokeRect((cx - hs) * S, (cy - hs) * S, hs * 2 * S, hs * 2 * S)
      }
    }
    c.restore()
  }

  const redraw = () => {
    if (!octx || !doc) return
    const S = over.width / pageW() // backing px per pt
    octx.clearRect(0, 0, over.width, over.height)
    octx.lineJoin = 'round'
    octx.lineCap = 'round'
    for (const a of annots[page]) drawAnnot(octx, a, S)
    if (draft) drawAnnot(octx, draft, S)
    if (sel && annots[page].includes(sel)) drawSel(octx, sel, S)
    positionChip()
  }

  const applyPageSize = () => {
    pageEl.style.width = `${pageW() * zoom}px`
    pageEl.style.height = `${pageH() * zoom}px`
  }

  // base raster: DOM size updates synchronously, bitmap follows async
  const renderBase = async () => {
    if (!doc) return
    closeTextIn(true)
    const my = ++baseGen
    const W = pageW(), H = pageH()
    const dpr = self.devicePixelRatio || 1
    const bw = Math.max(2, Math.min(4096, Math.round(W * zoom * dpr)))
    const bh = Math.max(2, Math.round((bw * H) / W))
    applyPageSize()
    base.width = over.width = bw
    base.height = over.height = bh
    const ctx = base.getContext('2d')
    ctx.fillStyle = '#ffffff'
    ctx.fillRect(0, 0, bw, bh)
    redraw()
    try {
      const cv = await renderPage(doc, leaves[page], { width: bw, cache: imgCache })
      if (my !== baseGen) return
      if (cv) ctx.drawImage(cv, 0, 0, bw, bh)
    } catch { /* blank page stays white */ }
  }

  // ---------- zoom / nav ----------
  const setZoom = (z) => {
    const nz = Math.max(0.25, Math.min(4, z))
    if (nz === zoom) return
    zoom = nz
    renderBase()
    updateChrome()
  }

  // zoom keeping the pt under (cx,cy) client coords stationary
  const zoomAround = (cx, cy, z) => {
    const nz = Math.max(0.25, Math.min(4, z))
    if (nz === zoom) return
    const r = pageEl.getBoundingClientRect()
    const ax = (cx - r.left) / zoom, ay = (cy - r.top) / zoom
    zoom = nz
    if (pinch) {
      // mid-pinch: leave backing canvases alone — CSS stretch keeps base +
      // overlay aligned for free; a real re-raster runs when the pinch ends
      applyPageSize()
      redraw()
    } else {
      renderBase()
    }
    const r2 = pageEl.getBoundingClientRect()
    stage.scrollLeft += r2.left + ax * zoom - cx
    stage.scrollTop += r2.top + ay * zoom - cy
    updateChrome()
  }

  const fitZoom = () => setZoom(Math.max(0.25, stage.clientWidth / pageW()))

  const gotoPage = (i) => {
    if (!doc || i < 0 || i >= leaves.length) return
    cancelGesture()
    page = i
    sel = null
    renderBase()
    thumbsEl?.querySelectorAll('.edthumb').forEach((el, j) => el.classList.toggle('cur', j === page))
    updateChrome()
  }

  // ---------- tools ----------
  const shapeDraft = (x0, y0, x1, y1) => {
    if (tool === 'line' || tool === 'arrow')
      return { t: 'line', x1: x0, y1: y0, x2: x1, y2: y1, color, width: penWidth, alpha, arrow: tool === 'arrow' }
    const x = Math.min(x0, x1), y = Math.min(y0, y1)
    const w = Math.abs(x1 - x0), hgt = Math.abs(y1 - y0)
    if (tool === 'rect') return { t: 'rect', x, y, w, h: hgt, stroke: color, fill: null, lw: penWidth, alpha }
    if (tool === 'ellipse') return { t: 'ellipse', x, y, w, h: hgt, stroke: color, fill: null, lw: penWidth, alpha }
    return { t: 'rect', x, y, w, h: hgt, stroke: null, fill: '#ffffff', lw: 0, alpha: 1 } // whiteout
  }

  const setTool = (t) => {
    if (t === 'image') { pickImage(); return }
    tool = t
    closeTextIn(true)
    for (const [k, b] of toolBtns) b.classList.toggle('on', k === t)
    // draw modes own every gesture; select/text/eraser let the stage pan natively
    // (pan-x pan-y still blocks browser pinch-zoom so our JS pinch keeps working)
    over.style.touchAction = ED_DRAW.has(t) ? 'none' : 'pan-x pan-y'
    over.style.cursor = t === 'select' ? 'default' : t === 'text' ? 'text' : 'crosshair'
    if (t === 'hilite' && penWidth < 10) { penWidth = 14; syncOpts() }
    updateChrome()
  }

  const pickImage = () => {
    const inp = h('input', { type: 'file', accept: 'image/*', class: 'hidden-input' })
    inp.addEventListener('cancel', () => inp.remove())
    inp.onchange = async () => {
      const f = inp.files?.[0]
      inp.remove()
      if (!f) return
      try {
        const bmp = await createImageBitmap(f)
        const cv = document.createElement('canvas')
        cv.width = bmp.width
        cv.height = bmp.height
        const cx = cv.getContext('2d')
        cx.fillStyle = '#ffffff' // flatten alpha onto white
        cx.fillRect(0, 0, cv.width, cv.height)
        cx.drawImage(bmp, 0, 0)
        const blob = await new Promise((res) => cv.toBlob(res, 'image/jpeg', 0.9))
        if (!blob) throw new Error('encode failed')
        const W = pageW(), H = pageH()
        let w = Math.min(200, W - 40)
        let hgt = (w * bmp.height) / bmp.width
        if (hgt > H - 40) { hgt = H - 40; w = (hgt * bmp.width) / bmp.height }
        const a = {
          t: 'image', x: (W - w) / 2, y: (H - hgt) / 2, w, h: hgt,
          jpeg: new Uint8Array(await blob.arrayBuffer()),
        }
        bmpCache.set(a, bmp)
        pushUndo()
        annots[page].push(a)
        sel = a
        setTool('select')
        afterMut()
      } catch {
        error = 'could not read that image'
        paint()
      }
    }
    editorEl.append(inp)
    inp.click()
  }

  const openTextIn = (x, y) => {
    closeTextIn(true)
    const ta = h('textarea', {
      class: 'edtxtin',
      rows: '1',
      style: {
        left: `${x * zoom}px`, top: `${y * zoom}px`,
        fontSize: `${fontSize * zoom}px`, color,
        fontFamily: ED_FAM[font], fontWeight: font === 'helvb' ? '700' : '400',
      },
      onkeydown: (e) => {
        e.stopPropagation()
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); closeTextIn(true) }
        else if (e.key === 'Escape') { e.preventDefault(); closeTextIn(false) }
      },
      onblur: () => closeTextIn(true),
    })
    txtIn = { ta, x, y }
    pageEl.append(ta)
    ta.focus()
  }

  const closeTextIn = (commit) => {
    if (!txtIn) return
    const { ta, x, y } = txtIn
    txtIn = null // null first — removing the node re-fires blur
    const text = ta.value.replace(/\s+$/, '')
    ta.remove()
    if (!commit || !text.trim()) return
    pushUndo()
    const a = { t: 'text', x, y, text, size: fontSize, color, font, alpha }
    annots[page].push(a)
    sel = a
    afterMut()
  }

  const delSel = () => {
    if (!sel) return
    const arr = annots[page]
    const i = arr.indexOf(sel)
    if (i < 0) { sel = null; return }
    pushUndo()
    arr.splice(i, 1)
    sel = null
    afterMut()
  }

  const clearPage = () => {
    if (!annots[page]?.length) return
    pushUndo()
    annots[page] = []
    sel = null
    afterMut()
  }

  // ---------- gestures ----------
  const cancelGesture = () => {
    if (drag && sel && (drag.kind === 'move' || drag.kind === 'resize')) {
      if (drag.pushed) undoStack.pop()
      edRestore(sel, drag.o)
    }
    draft = null
    drag = null
    tap = null
    pendingDeselect = null
    captureId = null
    redraw()
    updateChrome()
  }

  const onDown = (e) => {
    if (!doc || (e.pointerType === 'mouse' && e.button !== 0)) return
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY })
    if (pointers.size === 2) { // second finger → pinch, kill whatever was mid-flight
      cancelGesture()
      const [p, q] = [...pointers.values()]
      pinch = { d: Math.hypot(p.x - q.x, p.y - q.y) }
      return
    }
    if (pointers.size > 2) return
    const [x, y] = toPt(e.clientX, e.clientY)
    if (tool === 'select') {
      const hit = pickAt(x, y)
      if (hit) {
        sel = hit.a
        captureId = e.pointerId
        over.setPointerCapture(e.pointerId)
        drag = { kind: hit.corner ? 'resize' : 'move', corner: hit.corner, sx: x, sy: y, o: edSnap(hit.a), pushed: false }
        e.preventDefault()
      } else {
        pendingDeselect = e.pointerId // confirmed on pointerup — pans must not deselect
        over.setPointerCapture(e.pointerId) // else an off-canvas release leaks the pointers entry → phantom pinch
      }
      redraw()
      updateChrome()
    } else if (tool === 'pen' || tool === 'hilite') {
      captureId = e.pointerId
      over.setPointerCapture(e.pointerId)
      const w = penWidth * (0.4 + 1.2 * (e.pressure || 0.5))
      draft = tool === 'pen'
        ? { t: 'vstroke', pts: [[x, y, w]], color, alpha }
        : { t: 'highlight', pts: [[x, y]], color, width: penWidth, alpha: Math.min(alpha, 0.35) }
      e.preventDefault()
      redraw()
    } else if (tool === 'text' || tool === 'eraser') {
      tap = { id: e.pointerId, x, y } // act on pointerup so pans don't fire it
      captureId = e.pointerId // capture so the up/cancel always reaches us
      over.setPointerCapture(e.pointerId)
    } else { // line, arrow, rect, ellipse, whiteout
      captureId = e.pointerId
      over.setPointerCapture(e.pointerId)
      drag = { kind: 'shape', sx: x, sy: y }
      draft = shapeDraft(x, y, x, y)
      e.preventDefault()
      redraw()
    }
  }

  const onMove = (e) => {
    const p = pointers.get(e.pointerId)
    if (!p) return
    p.x = e.clientX
    p.y = e.clientY
    if (pointers.size >= 2) {
      if (pinch) {
        const [a, b] = [...pointers.values()]
        const d = Math.hypot(a.x - b.x, a.y - b.y)
        if (d > 0 && pinch.d > 0) zoomAround((a.x + b.x) / 2, (a.y + b.y) / 2, (zoom * d) / pinch.d)
        pinch.d = d
      }
      return
    }
    if (e.pointerId !== captureId) return
    const [x, y] = toPt(e.clientX, e.clientY)
    if (draft && (draft.t === 'vstroke' || draft.t === 'highlight')) {
      for (const ev of e.getCoalescedEvents?.() ?? [e]) {
        const [ex, ey] = toPt(ev.clientX, ev.clientY)
        const last = draft.pts[draft.pts.length - 1]
        if (Math.hypot(ex - last[0], ey - last[1]) < 0.6) continue
        if (draft.t === 'vstroke') draft.pts.push([ex, ey, penWidth * (0.4 + 1.2 * (ev.pressure || 0.5))])
        else draft.pts.push([ex, ey])
      }
      redraw()
    } else if (drag?.kind === 'shape') {
      draft = shapeDraft(drag.sx, drag.sy, x, y)
      redraw()
    } else if (drag?.kind === 'move' && sel) {
      const dx = x - drag.sx, dy = y - drag.sy
      if (dx || dy) {
        if (!drag.pushed) { pushUndo(); drag.pushed = true; updateChrome() }
        edMove(drag.o, sel, dx, dy)
        redraw()
      }
    } else if (drag?.kind === 'resize' && sel) {
      if (!drag.pushed) { pushUndo(); drag.pushed = true; updateChrome() }
      edResize(drag.o, sel, drag.corner, x, y)
      redraw()
    }
  }

  const onUp = (e) => {
    pointers.delete(e.pointerId)
    if (e.pointerType === 'mouse' && e.button !== 0) return // stray right-release mid-drag commits nothing
    if (pinch && pointers.size < 2) { pinch = null; renderBase() } // re-raster at final zoom
    if (tap && tap.id === e.pointerId) {
      const { x, y } = tap
      tap = null
      captureId = null
      const [ux, uy] = toPt(e.clientX, e.clientY)
      if (Math.hypot(ux - x, uy - y) > 8) return // dragged, not tapped
      if (tool === 'text') openTextIn(x, y)
      else { // eraser
        const hit = pickAt(x, y)
        if (hit) {
          pushUndo()
          const arr = annots[page]
          arr.splice(arr.indexOf(hit.a), 1)
          if (sel === hit.a) sel = null
          afterMut()
        }
      }
      return
    }
    if (pendingDeselect === e.pointerId) {
      pendingDeselect = null
      sel = null
      redraw()
      updateChrome()
      return
    }
    if (e.pointerId !== captureId) return
    captureId = null
    if (draft) {
      const d = draft
      draft = null
      const ok = d.pts ? d.pts.length >= 1
        : d.t === 'line' ? Math.hypot(d.x2 - d.x1, d.y2 - d.y1) > 2
        : d.w > 2 && d.h > 2
      if (ok) {
        pushUndo()
        annots[page].push(d)
        sel = d
      }
      afterMut()
    }
    drag = null
  }

  const onCancel = (e) => {
    pointers.delete(e.pointerId)
    if (pinch && pointers.size < 2) { pinch = null; renderBase() }
    cancelGesture()
  }

  const onWheel = (e) => {
    if (!e.ctrlKey && !e.metaKey) return
    e.preventDefault()
    zoomAround(e.clientX, e.clientY, zoom * Math.exp(-e.deltaY * (e.deltaMode === 1 ? 16 : 1) * 0.0018))
  }

  const onTouchStart = (e) => {
    if (e.touches.length > 1) { e.preventDefault(); return } // our pinch, not the browser's
    if (tool !== 'select') return
    const t = e.touches[0]
    if (!t) return
    const [x, y] = toPt(t.clientX, t.clientY)
    if (pickAt(x, y)) e.preventDefault() // block native pan so pointer events drive the drag
  }

  // ---------- build ----------
  const buildThumbs = () => {
    thumbObs?.disconnect()
    thumbObs = null
    setKids(thumbsEl)
    const render1 = (cell, i) => {
      renderPage(doc, leaves[i], { width: 180, cache: imgCache })
        .then((cv) => { if (cv && cell.isConnected) { cv.className = 'edthumbc'; cell.prepend(cv) } })
        .catch(() => {})
    }
    const cells = dims.map((d, i) => {
      const W = d.rotate % 180 === 0 ? d.w : d.h
      const H = d.rotate % 180 === 0 ? d.h : d.w
      const cell = h('button', {
        type: 'button', class: 'edthumb' + (i === page ? ' cur' : ''), title: `Page ${i + 1}`,
        style: { aspectRatio: `${W} / ${H}` },
        onclick: () => gotoPage(i),
      }, h('span', { class: 'edthumbn' }, String(i + 1)))
      thumbsEl.append(cell)
      return cell
    })
    if ('IntersectionObserver' in window) {
      thumbObs = new IntersectionObserver((ents) => {
        for (const en of ents) {
          if (!en.isIntersecting) continue
          thumbObs.unobserve(en.target)
          render1(en.target, cells.indexOf(en.target))
        }
      }, { root: thumbsEl, rootMargin: '120px' })
      cells.forEach((c) => thumbObs.observe(c))
    } else {
      cells.forEach((c, i) => render1(c, i))
    }
  }

  const build = () => {
    toolBtns = new Map()
    metaEl = h('p', { class: 'meta dim' })

    const toolRow = h('div', { class: 'edtools' })
    for (const [t, label] of ED_TOOLS) {
      const b = h('button', { type: 'button', class: 'edt', onclick: () => setTool(t) }, label)
      toolBtns.set(t, b)
      toolRow.append(b)
    }

    swatchEls = []
    const swatches = h('div', { class: 'edsws' },
      ED_COLORS.map((c) => {
        const b = h('button', {
          type: 'button', class: 'edsw', title: c, style: { background: c },
          onclick: () => { color = c; syncOpts() },
        })
        swatchEls.push([c, b])
        return b
      }),
      colorPick = h('input', {
        type: 'color', class: 'edpick', value: color, title: 'Custom color',
        oninput: (e) => { color = e.target.value; syncOpts() },
      }))
    widthLbl = h('span', { class: 'edrangev' })
    widthSlider = h('input', {
      type: 'range', min: '1', max: '40', value: String(penWidth), class: 'slider edslider',
      oninput: (e) => { penWidth = +e.target.value; syncOpts() },
    })
    const widthWrap = h('label', { class: 'edopt' }, 'Stroke', widthSlider, widthLbl)
    alphaLbl = h('span', { class: 'edrangev' })
    alphaSlider = h('input', {
      type: 'range', min: '10', max: '100', value: '100', class: 'slider edslider',
      oninput: (e) => { alpha = +e.target.value / 100; syncOpts() },
    })
    const alphaWrap = h('label', { class: 'edopt' }, 'Opacity', alphaSlider, alphaLbl)
    fontWrap = h('span', { class: 'edtext' },
      h('select', { class: 'textin sel edfont', onchange: (e) => (font = e.target.value) },
        ED_FONTS.map(([v, l]) => h('option', { value: v, selected: v === font || undefined }, l))),
      h('input', {
        type: 'number', class: 'textin num ednum', min: '8', max: '72', value: String(fontSize), title: 'Font size (pt)',
        oninput: (e) => { fontSize = Math.max(8, Math.min(72, +e.target.value || 16)) },
      }))
    const optsRow = h('div', { class: 'edopts' }, swatches, widthWrap, alphaWrap, fontWrap)

    prevBtn = h('button', { type: 'button', class: 'edt', onclick: () => gotoPage(page - 1) }, '‹ Prev')
    pageLbl = h('span', { class: 'edpgl' })
    nextBtn = h('button', { type: 'button', class: 'edt', onclick: () => gotoPage(page + 1) }, 'Next ›')
    zoomLbl = h('span', { class: 'edpgl' })
    actionSlot = h('div', { class: 'edacts' })
    const navRow = h('div', { class: 'ednav' },
      prevBtn, pageLbl, nextBtn, h('span', { class: 'edsep' }),
      h('button', { type: 'button', class: 'edt', title: 'Zoom out', onclick: () => setZoom(zoom / 1.25) }, '−'),
      zoomLbl,
      h('button', { type: 'button', class: 'edt', title: 'Zoom in', onclick: () => setZoom(zoom * 1.25) }, '+'),
      h('button', { type: 'button', class: 'edt', title: 'Fit width', onclick: fitZoom }, 'Fit'),
      h('span', { class: 'edsep' }),
      actionSlot)

    base = h('canvas', { class: 'edbase' })
    over = h('canvas', { class: 'edover' })
    octx = over.getContext('2d')
    delChip = iconBtn('x', 'Delete annotation', (e) => { e.stopPropagation(); delSel() })
    delChip.classList.add('edsel')
    delChip.style.display = 'none'
    pageEl = h('div', { class: 'edpage' }, base, over, delChip)
    stage = h('div', { class: 'edwrap' }, pageEl)
    thumbsEl = h('div', { class: 'edthumbs' })
    dlBtn = Btn('Download edited PDF', { onclick: run })
    editorEl = h('div', { class: 'ed' }, metaEl, toolRow, optsRow, navRow, stage, thumbsEl, dlBtn)

    over.addEventListener('pointerdown', onDown)
    over.addEventListener('pointermove', onMove)
    over.addEventListener('pointerup', onUp)
    over.addEventListener('pointercancel', onCancel)
    over.addEventListener('touchstart', onTouchStart, { passive: false })
    over.addEventListener('contextmenu', (e) => e.preventDefault())
    stage.addEventListener('wheel', onWheel, { passive: false })

    setTool('select')
    syncOpts()
    buildThumbs()
  }

  const positionChip = () => {
    if (!delChip) return
    const b = sel && annots[page]?.includes(sel) ? edBBox(sel) : null
    if (!b) { delChip.style.display = 'none'; return }
    delChip.style.display = ''
    delChip.style.left = `${(b.x + b.w) * zoom + 4}px`
    delChip.style.top = `${b.y * zoom - 12}px`
  }

  const syncOpts = () => {
    for (const [c, b] of swatchEls) b.classList.toggle('on', c === color)
    if (colorPick) colorPick.value = color
    if (widthSlider) widthSlider.value = String(penWidth)
    if (widthLbl) widthLbl.textContent = `${penWidth}pt`
    if (alphaSlider) alphaSlider.value = String(Math.round(alpha * 100))
    if (alphaLbl) alphaLbl.textContent = `${Math.round(alpha * 100)}%`
  }

  const updateChrome = () => {
    if (!editorEl) return
    const total = annots.reduce((n, a) => n + a.length, 0)
    metaEl.textContent =
      `${file.name} · ${fmtBytes(file.size)} · ${leaves.length} page${leaves.length > 1 ? 's' : ''} · ` +
      `${total} annotation${total === 1 ? '' : 's'}`
    pageLbl.textContent = `p ${page + 1} / ${leaves.length}`
    zoomLbl.textContent = `${Math.round(zoom * 100)}%`
    prevBtn.disabled = page === 0
    nextBtn.disabled = page === leaves.length - 1
    for (const [t, b] of toolBtns) b.classList.toggle('on', t === tool)
    fontWrap.style.display = tool === 'text' ? '' : 'none'
    setKids(actionSlot, Toolbar([
      ['↶ Undo', undo, !undoStack.length],
      ['↷ Redo', redo, !redoStack.length],
      ['Clear page', clearPage, !annots[page]?.length],
    ]))
    setKids(dlBtn, h('span', { class: 'edbtnin' }, icon('download', 'icon-sm'), busy ? 'Working…' : 'Download edited PDF'))
    dlBtn.disabled = busy
    positionChip()
  }

  // ---------- load / export ----------
  const load = async ([f]) => {
    const my = ++loadGen
    error = ''
    file = f
    bytes = null
    doc = null
    editorEl = null
    annots = []
    sel = null
    undoStack = []
    redoStack = []
    pointers.clear() // a load mid-gesture must not leak pointer/pinch/draft state
    pinch = null
    cancelGesture()
    imgCache.clear()
    thumbObs?.disconnect()
    thumbObs = null
    paint()
    try {
      const b = await readBytes(f)
      if (my !== loadGen) return
      const d = await parsePdf(b)
      if (my !== loadGen) return
      bytes = b
      doc = d
      leaves = pageLeaves(d)
      dims = pageDims(d)
      annots = leaves.map(() => [])
      page = 0
      zoom = 1
      build()
      paint()
      gotoPage(0)
      if (pageW() * zoom > stage.clientWidth) fitZoom() // small screens open fit-width
    } catch (e) {
      if (my !== loadGen) return
      error = e.message || 'could not read that PDF'
      file = null
      doc = null
      paint()
    }
  }

  const run = async () => {
    busy = true
    error = ''
    updateChrome()
    try {
      const out = await annotatePdf(bytes, annots)
      saveBlob(new Blob([out], { type: 'application/pdf' }), `${file.name.replace(/\.pdf$/i, '')}-edited.pdf`)
    } catch (e) {
      error = e.message || 'export failed'
      paint()
    } finally {
      busy = false
      updateChrome()
    }
  }

  function paint() {
    setKids(root,
      DropZone({ accept: 'application/pdf', onFiles: load }),
      editorEl,
      ErrorText(error))
  }

  // keyboard: Ctrl+Z/Y undo-redo, Del deletes selection, Esc cancels — self-removes when detached
  const onKey = (e) => {
    if (!root.isConnected) {
      thumbObs?.disconnect()
      return document.removeEventListener('keydown', onKey)
    }
    if (!doc || /input|textarea|select/i.test(e.target.tagName)) return
    const mod = e.ctrlKey || e.metaKey
    const k = e.key.toLowerCase()
    if (mod && k === 'z' && !e.shiftKey) { e.preventDefault(); undo() }
    else if (mod && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo() }
    else if ((e.key === 'Delete' || e.key === 'Backspace') && sel) { e.preventDefault(); delSel() }
    else if (e.key === 'Escape') {
      if (draft || drag) cancelGesture()
      else if (sel) { sel = null; afterMut() }
    }
  }
  document.addEventListener('keydown', onKey)

  paint()
  return root
}
