    try { return parseRanges(e.range, n).flatMap(({ from, to }) => Array.from({ length: to - from + 1 }, (_, i) => from + i)) } catch { return null }
  }

  const run = () => runTask((b) => { busy = b; paint() }, async () => {
    const good = files.filter((f) => f.info)
    const pages = good.map(pagesOf)
    if (pages.some((p) => !p)) throw new Error('Fix the highlighted page ranges first')
    const out = await mergePdfs(good.map((f) => f.info.bytes), { names: bookmarks ? good.map((f) => stem(f.file.name)) : null, pages })
    const name = `${(outName.trim() || 'merged').replace(/\.pdf$/i, '')}.pdf`
    result = { blob: new Blob([out], { type: 'application/pdf' }), name, pages: pages.reduce((n, p) => n + p.length, 0) }
  })

  const move = (from, to) => { const [x] = files.splice(from, 1); files.splice(to, 0, x); paint() }

  function fileRow(e, i) {
    const n = e.info?.leaves.length
    const range = TextInput(e.range, (v) => {
      e.range = v
      e.rangeOk = pagesOf(e) !== null
      range.classList.toggle('bad', !e.rangeOk)
      meta.textContent = metaText()
      updateAction()
    }, { placeholder: `All ${n ?? ''} pages — or e.g. 1-3, 5` })
    range.style.height = '32px'
    range.style.maxWidth = '220px'
    if (!e.rangeOk) range.classList.add('bad')
    const metaText = () => {
      const p = pagesOf(e)
      return e.err ? '' : e.loading ? 'Reading…' : `${plural(n, 'page')}${p && p.length !== n ? ` · using ${p.length}` : ''}${e.info?.wasEncrypted ? ' · unlocked' : ''}`
    }
    const meta = h('span', { class: 'fmeta' }, metaText())
    return h('div', { class: 'fitem' },
      h('span', { class: 'grip', 'aria-hidden': 'true' }, icon('grip', 'icon-sm')),
      h('div', { class: 'fthumb' }, e.thumb ?? h('div', { class: 'fc-icon', style: { width: '34px', height: '42px' } }, 'PDF')),
      h('div', { class: 'fmain' },
        h('span', { class: 'fname', title: e.file.name }, e.file.name),
        e.err ? h('span', { class: 'ferr' }, e.err) : h('div', { class: 'row', style: { gap: '8px' } }, meta, e.info ? range : null)),
      h('div', { class: 'facts' },
        IconButton('up', 'Move up', () => move(i, i - 1), { disabled: i === 0 }),
        IconButton('down', 'Move down', () => move(i, i + 1), { disabled: i === files.length - 1 }),
        IconButton('x', 'Remove', () => { files = files.filter((x) => x !== e); result = null; paint() })))
  }

  let actionBtn = null
  let summary = null
  const totals = () => {
    const good = files.filter((f) => f.info)
    const pages = good.map(pagesOf)
    return { good, pages: pages.every(Boolean) ? pages.reduce((n, p) => n + p.length, 0) : null }
  }
  const updateAction = () => {
    if (!actionBtn) return
    const { good, pages } = totals()
    const ok = good.length >= 2 && pages !== null && !files.some((f) => f.loading)
    actionBtn.disabled = !ok || busy
    summary.textContent = good.length < 2 ? 'Add at least two PDFs' : pages === null ? 'Check your page ranges' : `${plural(good.length, 'file')} · ${plural(pages, 'page')}`
  }

  function paint() {
    if (!files.length) {
      render(ToolHead('merge'), Dropzone({ multiple: true, onFiles: add, title: 'Drop the PDFs you want to combine', tc: 'var(--c-organize)', icon: 'merge' }))
      return
    }
    if (result) {
      render(ToolHead('merge'), ResultCard({
        title: 'Your PDFs are merged', blob: result.blob, filename: result.name, toolId: 'merge',
        sub: `${result.name} · ${plural(result.pages, 'page')}`,
        onAgain: () => { files = []; result = null; paint() },
      }))
      return
    }
    const list = h('div', { class: 'flist' }, files.map(fileRow))
    sortable(list, '.fitem', move, { horizontal: false, handle: '.grip' })
    actionBtn = Button({ label: busy ? 'Merging…' : 'Merge PDFs', icon: 'merge', variant: 'primary', size: 'lg', block: true, busy, onClick: run })
    summary = h('div', { class: 'summary' })
    render(
      ToolHead('merge'),
      Workspace(
        [
          h('div', { class: 'row between' },
            h('div', { class: 'muted small' }, 'Drag ', icon('grip', 'icon-sm'), ' to reorder. Leave the page box empty to use every page.'),
            h('div', { class: 'row', style: { gap: '6px' } },
              Button({ label: 'A → Z', size: 'sm', onClick: () => { files.sort((a, b) => a.file.name.localeCompare(b.file.name, undefined, { numeric: true })); paint() } }),
              Button({ label: 'Reverse', size: 'sm', onClick: () => { files.reverse(); paint() } }))),
          list,
          Dropzone({ multiple: true, onFiles: add, compact: true, title: 'Add more PDFs' }),
        ],
        [
          h('div', { class: 'card stack' },
            Field('File name', TextInput(outName, (v) => (outName = v), { placeholder: 'merged' }), { hint: '.pdf' }),
            Switch('Bookmark each file', bookmarks, (v) => (bookmarks = v), { hint: 'Adds a bookmark per file; each file’s own bookmarks go inside it' })),
          h('div', { class: 'action-bar sticky-m' }, actionBtn, summary),
        ]),
    )
    updateAction()
  }

  const ho = takeHandoff()
  if (ho) add(Array.isArray(ho) ? ho : [ho])
  else paint()
  return root
}

// ---- src/tools/split.js ----

/** Sorted set → "1-3, 5" */
const selToSpec = (sel) => {
  const pgs = [...sel].sort((a, b) => a - b)
  const parts = []
  for (let i = 0; i < pgs.length; i++) {
    let j = i
    while (j + 1 < pgs.length && pgs[j + 1] === pgs[j] + 1) j++
    parts.push(pgs[i] === pgs[j] ? `${pgs[i]}` : `${pgs[i]}-${pgs[j]}`)
    i = j
  }
  return parts.join(', ')
}

function Split() {
  const { root, render } = mount()
  let info = null
  let thumbs = null
  let mode = 'select' // select | ranges | every | each
  let sel = new Set()
  let last = null
  let spec = ''
  let rangesSpec = ''
  let everyN = 2
  let busy = false
  let result = null

  const load = async ([f]) => {
    try {
      const i = await openPdf(f)
      if (!i) return
      info = i
      thumbs?.disconnect()
      thumbs = pageThumbs(info)
      const n = info.leaves.length
      sel = new Set()
      spec = ''
      rangesSpec = n > 1 ? `1-${Math.ceil(n / 2)}, ${Math.ceil(n / 2) + 1}-${n}` : '1'
      result = null
      paint()
    } catch (e) { toast(e.message, { type: 'error' }) }
  }

  const N = () => info?.leaves.length ?? 0
  const groups = () => { // [{from,to}] for the current mode, or null if invalid
    const n = N()
    try {
      if (mode === 'select') return sel.size ? parseRanges(selToSpec(sel), n) : []
      if (mode === 'ranges') return parseRanges(rangesSpec, n)
      if (mode === 'every') return Array.from({ length: Math.ceil(n / everyN) }, (_, k) => ({ from: k * everyN + 1, to: Math.min(n, (k + 1) * everyN) }))
      return Array.from({ length: n }, (_, k) => ({ from: k + 1, to: k + 1 }))
    } catch { return null }
  }

  const toggle = (p, shift) => {
    if (shift && last !== null) {
      const [a, b] = last < p ? [last, p] : [p, last]
      for (let x = a; x <= b; x++) sel.add(x)
    } else sel.has(p) ? sel.delete(p) : sel.add(p)
    last = p
    spec = selToSpec(sel)
    paint()
  }
  const preset = (kind) => {
    const all = Array.from({ length: N() }, (_, i) => i + 1)
    sel = new Set(kind === 'all' ? all : kind === 'none' ? [] : kind === 'invert' ? all.filter((p) => !sel.has(p)) : all.filter((p) => (kind === 'odd') === (p % 2 === 1)))
    last = null
    spec = selToSpec(sel)
    paint()
  }

  const run = () => runTask((b) => { busy = b; paint() }, async () => {
    const g = groups()
    if (!g?.length) throw new Error('Nothing to extract')
    const base = stem(info.name)
    if (mode === 'select') {
      const out = await extractPages(info.bytes, g)
      result = { blob: new Blob([out], { type: 'application/pdf' }), name: `${base}-pages-${selToSpec(sel).replace(/\s/g, '')}.pdf`, n: 1 }
    } else {
      const outs = await splitPdf(info.bytes, g)
      if (outs.length === 1) {
        result = { blob: new Blob([outs[0]], { type: 'application/pdf' }), name: `${base}-${g[0].from}-${g[0].to}.pdf`, n: 1 }
      } else {
        const zip = zipStore(outs.map((o, k) => ({ name: `${base}-${g[k].from === g[k].to ? `p${g[k].from}` : `${g[k].from}-${g[k].to}`}.pdf`, data: o })))
        result = { blob: new Blob([zip], { type: 'application/zip' }), name: `${base}-split.zip`, n: outs.length }
      }
    }
  })

  function paint() {
    if (!info) { render(ToolHead('split'), Dropzone({ onFiles: load, title: 'Drop the PDF you want to split', tc: 'var(--c-organize)', icon: 'scissors' })); return }
    if (result) {
      render(ToolHead('split'), ResultCard({
        title: result.n > 1 ? `Split into ${result.n} files` : 'Pages extracted', blob: result.blob, filename: result.name, toolId: 'split',
        onAgain: () => { result = null; paint() },
      }))
      return
    }
    const g = groups()
    // which output file each page lands in (for the badges)
    const fileOf = new Map()
    g?.forEach((r, k) => { for (let p = r.from; p <= r.to; p++) if (!fileOf.has(p)) fileOf.set(p, k + 1) })
    let grid = h('div', { class: 'pgrid' }, info.leaves.map((_, i) => {
      const p = i + 1
      const inOut = fileOf.has(p)
      return PageCard({
        thumbs, src: i, dims: info.dims[i], label: `${p}`,
        sub: mode !== 'select' && inOut && g.length > 1 ? `→ file ${fileOf.get(p)}` : '',
        selected: mode === 'select' ? sel.has(p) : undefined,
        off: mode !== 'select' && !inOut,
        onClick: mode === 'select' ? (e) => toggle(p, e.shiftKey) : null,
        ops: [{ icon: 'zoomIn', tip: 'Preview', onClick: () => zoomPage(info, i) }],
      })
    }))
    const specInput = TextInput(spec, (v) => {
      spec = v
      try {
        sel = new Set(v.trim() ? parseRanges(v, N()).flatMap(({ from, to }) => Array.from({ length: to - from + 1 }, (_, k) => from + k)) : [])
        specInput.classList.remove('bad')
        paintGridOnly()
      } catch { specInput.classList.add('bad') }
    }, { placeholder: 'e.g. 1-3, 7, 10-12' })
    const rangesInput = TextInput(rangesSpec, (v) => {
      rangesSpec = v
      const ok = groups() !== null
      rangesInput.classList.toggle('bad', !ok)
      if (ok) paintGridOnly()
    }, { placeholder: 'e.g. 1-3, 4-8, 9-12' })
    const outCount = g?.length ?? 0
    const pagesOut = g ? g.reduce((n, r) => n + r.to - r.from + 1, 0) : 0
    const label = mode === 'select' ? (sel.size ? `Extract ${plural(sel.size, 'page')}` : 'Select pages to extract')
      : g === null ? 'Fix the ranges' : `Split into ${plural(outCount, 'file')}`
    render(
      ToolHead('split'),
      Workspace(
        [
          FileChip({ name: info.name, size: info.size, meta: docMeta(info), onReplace: async () => { const [f] = await pickFiles(); if (f) load([f]) } }),
          mode === 'select' ? h('div', { class: 'row between' },
            h('span', { class: 'muted small' }, 'Click pages to pick them · Shift-click selects a range'),
            h('div', { class: 'row', style: { gap: '6px' } },
              ['all', 'none', 'odd', 'even', 'invert'].map((k) => Button({ label: k[0].toUpperCase() + k.slice(1), size: 'sm', onClick: () => preset(k) })))) : null,
          grid,
        ],
        [
          h('div', { class: 'card stack' },
            Field('How to split', Seg([['select', 'Pick pages'], ['ranges', 'Ranges'], ['every', 'Every N'], ['each', 'Each page']], mode, (v) => { mode = v; paint() }, { block: true })),
            mode === 'select' ? Field('Pages', specInput, { hint: 'synced with your picks' })
              : mode === 'ranges' ? Field('Ranges — one file per range', rangesInput)
              : mode === 'every' ? Field('Pages per file', Stepper(everyN, { min: 1, max: Math.max(1, N()) }, (v) => { everyN = v; paint() }))
              : h('p', { class: 'muted small', style: { margin: 0 } }, `Every page becomes its own PDF — ${plural(N(), 'file')} in a ZIP.`),
            h('p', { class: 'muted small', style: { margin: 0 } }, mode === 'select'
              ? 'Selected pages are saved together as one new PDF.'
              : `${plural(pagesOut, 'page')} → ${plural(outCount, 'PDF')}${outCount > 1 ? ', downloaded as a ZIP' : ''}.`)),
          h('div', { class: 'action-bar sticky-m' },
            Button({ label: busy ? 'Working…' : label, icon: 'scissors', variant: 'primary', size: 'lg', block: true, busy, disabled: !outCount, onClick: run })),
        ]),
    )
    function paintGridOnly() { // keep text inputs focused while typing
      const fresh = h('div', { class: 'pgrid' }, info.leaves.map((_, i) => {
        const p = i + 1
        const gg = groups() ?? []
        const inOut = gg.some((r) => p >= r.from && p <= r.to)
        return PageCard({
          thumbs, src: i, dims: info.dims[i], label: `${p}`,
          selected: mode === 'select' ? sel.has(p) : undefined, off: mode !== 'select' && !inOut,
          onClick: mode === 'select' ? (e) => toggle(p, e.shiftKey) : null,
          ops: [{ icon: 'zoomIn', tip: 'Preview', onClick: () => zoomPage(info, i) }],
        })
      }))
      grid.replaceWith(fresh)
      grid = fresh
      const btn = root.querySelector('.action-bar .btn')
      const gg = groups()
      if (btn) {
        btn.disabled = !(gg?.length)
        btn.lastChild.textContent = mode === 'select' ? (sel.size ? `Extract ${plural(sel.size, 'page')}` : 'Select pages to extract') : gg === null ? 'Fix the ranges' : `Split into ${plural(gg.length, 'file')}`
      }
    }
  }

  const ho = takeHandoff()
  if (ho) load([Array.isArray(ho) ? ho[0] : ho])
  else paint()
  return root
}

// ---- src/tools/organize.js ----

function Organize() {
  const { root, render } = mount()
  let info = null
  let extras = [] // extra opened PDFs: {info, thumbs}
  let thumbs = null
  let items = [] // {id, doc, page (0-based), rotation, blank?:[w,h]}
  let sel = new Set() // item ids
  let lastClick = null
  let history = []
  let future = []
  let busy = false
  let result = null
  let uid = 0

  const snapshot = () => items.map((x) => ({ ...x }))
  const mutate = (fn) => { history.push(snapshot()); if (history.length > 100) history.shift(); future = []; fn(); paint() }
  const undo = () => { if (!history.length) return; future.push(snapshot()); items = history.pop(); sel = new Set([...sel].filter((id) => items.some((x) => x.id === id))); paint() }
  const redo = () => { if (!future.length) return; history.push(snapshot()); items = future.pop(); paint() }

  const load = async ([f]) => {
    try {
      const i = await openPdf(f)
      if (!i) return
      info = i
      thumbs?.disconnect()
      thumbs = pageThumbs(info)
      extras = []
      items = info.leaves.map((_, p) => ({ id: ++uid, doc: 0, page: p, rotation: 0 }))
      sel = new Set(); history = []; future = []; result = null
      paint()
    } catch (e) { toast(e.message, { type: 'error' }) }
  }

  const docInfo = (d) => (d === 0 ? info : extras[d - 1].info)
  const docThumbs = (d) => (d === 0 ? thumbs : extras[d - 1].thumbs)
  const dimsOf = (it) => (it.blank ? { w: it.blank[0], h: it.blank[1], rotate: 0 } : docInfo(it.doc).dims[it.page])

  const insertPdf = async () => {
    const [f] = await pickFiles()
    if (!f) return
    try {
      const xi = await openPdf(f)
      if (!xi) return
      extras.push({ info: xi, thumbs: pageThumbs(xi) })
      const d = extras.length
      const at = sel.size ? Math.max(...items.map((x, k) => (sel.has(x.id) ? k : -1))) + 1 : items.length
      mutate(() => items.splice(at, 0, ...xi.leaves.map((_, p) => ({ id: ++uid, doc: d, page: p, rotation: 0 }))))
      toast(`Inserted ${plural(xi.leaves.length, 'page')} from ${f.name}`)
    } catch (e) { toast(e.message, { type: 'error' }) }
  }

  const selIdx = () => items.map((x, k) => (sel.has(x.id) ? k : -1)).filter((k) => k >= 0)
  const rot = (ids, d) => mutate(() => { for (const x of items) if (ids.has(x.id)) x.rotation = (x.rotation + d + 360) % 360 })
  const del = (ids) => {
    if (ids.size >= items.length) { toast('A PDF needs at least one page', { type: 'error' }); return }
    mutate(() => { items = items.filter((x) => !ids.has(x.id)); sel = new Set([...sel].filter((id) => !ids.has(id))) })
  }
  const dup = (ids) => mutate(() => {
    const out = []
    for (const x of items) { out.push(x); if (ids.has(x.id)) out.push({ ...x, id: ++uid }) }
    items = out
  })
  const blankAfter = (k) => {
    const d = dimsOf(items[k] ?? items[items.length - 1])
    const w = d.rotate % 180 === 0 ? d.w : d.h, hh = d.rotate % 180 === 0 ? d.h : d.w
    mutate(() => items.splice(k + 1, 0, { id: ++uid, blank: [w, hh], rotation: 0 }))
  }
  const moveSel = (where) => mutate(() => {
    const picked = items.filter((x) => sel.has(x.id))
    const rest = items.filter((x) => !sel.has(x.id))
    items = where === 'start' ? [...picked, ...rest] : [...rest, ...picked]
  })

  const click = (it, k, e) => {
    if (e.shiftKey && lastClick !== null) {
      const [a, b] = lastClick < k ? [lastClick, k] : [k, lastClick]
      for (let j = a; j <= b; j++) sel.add(items[j].id)
    } else if (sel.has(it.id)) sel.delete(it.id)
    else sel.add(it.id)
    lastClick = k
    paint()
  }

  const opsList = (keep) => keep.map((x) => (x.blank ? { blank: x.blank } : { doc: x.doc, page: x.page + 1, rotation: x.rotation }))
  const save = (only = null) => runTask((b) => { busy = b; paint() }, async () => {
    const keep = only ?? items
    const out = await organizePages(info.bytes, opsList(keep), { extra: extras.map((e) => e.info.bytes) })
    const name = `${stem(info.name)}${only ? '-selected' : '-organized'}.pdf`
    const blob = new Blob([out], { type: 'application/pdf' })
    if (only) { saveBlob(blob, name); toast(`Saved ${plural(keep.length, 'page')} as ${name}`); return }
    result = { blob, name, n: keep.length }
  })

  const onKey = (e) => {
    if (!root.isConnected) { document.removeEventListener('keydown', onKey); return }
    if (!info || result || /input|textarea|select/i.test(e.target.tagName)) return
    const mod = e.ctrlKey || e.metaKey
    const k = e.key.toLowerCase()
    if (mod && k === 'z' && !e.shiftKey) { e.preventDefault(); undo() }
    else if (mod && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo() }
    else if (mod && k === 'a') { e.preventDefault(); sel = new Set(items.map((x) => x.id)); paint() }
    else if ((e.key === 'Delete' || e.key === 'Backspace') && sel.size) { e.preventDefault(); del(new Set(sel)) }
    else if (e.key === 'Escape' && sel.size) { sel = new Set(); paint() }
  }
  document.addEventListener('keydown', onKey)

  function paint() {
    if (!info) { render(ToolHead('organize'), Dropzone({ onFiles: load, title: 'Drop a PDF to rearrange its pages', tc: 'var(--c-organize)', icon: 'grid' })); return }
    if (result) {
      render(ToolHead('organize'), ResultCard({
        title: 'Pages organized', blob: result.blob, filename: result.name, toolId: 'organize', sub: `${result.name} · ${plural(result.n, 'page')}`,
        onAgain: () => { result = null; paint() },
      }))
      return
    }
    const grid = h('div', { class: 'pgrid' }, items.map((it, k) => PageCard({
      thumbs: it.blank ? null : docThumbs(it.doc), src: it.page, blank: !!it.blank, dims: dimsOf(it), rotation: it.rotation,
      label: `${k + 1}`, sub: it.blank ? 'blank' : it.doc ? `from ${extras[it.doc - 1].info.name.slice(0, 14)}` : it.page !== k ? `was ${it.page + 1}` : '',
      selected: sel.has(it.id), draggable: true,
      onClick: (e) => click(it, k, e),
      ops: [
        !it.blank ? { icon: 'zoomIn', tip: 'Preview', onClick: () => zoomPage(docInfo(it.doc), it.page, it.rotation) } : null,
        { icon: 'rotl', tip: 'Rotate left', onClick: () => rot(new Set([it.id]), -90) },
        { icon: 'rotate', tip: 'Rotate right', onClick: () => rot(new Set([it.id]), 90) },
        { icon: 'more', tip: 'More', onClick: () => {
          const btn = grid.children[k]?.querySelector('.pops button:last-child')
          menu(btn ?? grid, [
            { label: 'Duplicate', icon: 'copy', onClick: () => dup(new Set([it.id])) },
            { label: 'Insert blank page after', icon: 'pageAdd', onClick: () => blankAfter(k) },
            { label: 'Move to start', icon: 'up', onClick: () => mutate(() => { items.splice(k, 1); items.unshift(it) }) },
            { label: 'Move to end', icon: 'down', onClick: () => mutate(() => { items.splice(k, 1); items.push(it) }) },
            'sep',
            { label: 'Delete page', icon: 'trash', danger: true, onClick: () => del(new Set([it.id])) },
          ], { align: 'right' })
        } },
      ].filter(Boolean),
    })))
    sortable(grid, '.pcard', (from, to) => mutate(() => { const [x] = items.splice(from, 1); items.splice(to, 0, x) }))
    const n = sel.size
    const ids = new Set(sel)
    const removed = info.leaves.length + extras.reduce((a, e) => a + e.info.leaves.length, 0) - items.filter((x) => !x.blank).length
    render(
      ToolHead('organize'),
      Workspace(
        [
          FileChip({ name: info.name, size: info.size, meta: docMeta(info), onReplace: async () => { const [f] = await pickFiles(); if (f) load([f]) } }),
          h('div', { class: 'row between' },
            h('div', { class: 'row', style: { gap: '6px' } },
              IconButton('undo', 'Undo (Ctrl+Z)', undo, { disabled: !history.length }),
              IconButton('redo', 'Redo (Ctrl+Shift+Z)', redo, { disabled: !future.length }),
              h('span', { class: 'muted small' }, n ? `${plural(n, 'page')} selected` : 'Drag pages to reorder · click to select · Shift-click for a range')),
            h('div', { class: 'row', style: { gap: '6px' } },
              Button({ label: n === items.length ? 'Clear' : 'Select all', size: 'sm', onClick: () => { sel = n === items.length ? new Set() : new Set(items.map((x) => x.id)); paint() } }))),
          n ? h('div', { class: 'card', style: { padding: '8px', position: 'sticky', top: '66px', zIndex: 5 } }, h('div', { class: 'row', style: { gap: '6px' } },
            Button({ label: 'Rotate left', icon: 'rotl', size: 'sm', onClick: () => rot(ids, -90) }),
            Button({ label: 'Rotate right', icon: 'rotate', size: 'sm', onClick: () => rot(ids, 90) }),
            Button({ label: 'Duplicate', icon: 'copy', size: 'sm', onClick: () => dup(ids) }),
            Button({ label: 'To start', icon: 'up', size: 'sm', onClick: () => moveSel('start') }),
            Button({ label: 'To end', icon: 'down', size: 'sm', onClick: () => moveSel('end') }),
            Button({ label: 'Save selected as PDF', icon: 'download', size: 'sm', onClick: () => save(items.filter((x) => ids.has(x.id))) }),
            Button({ label: 'Delete', icon: 'trash', size: 'sm', variant: 'danger', onClick: () => del(ids) }))) : null,
          grid,
        ],
        [
          h('div', { class: 'card stack-sm' },
            h('div', { class: 'card-title' }, 'Add pages'),
            Button({ label: 'Blank page at end', icon: 'pageAdd', block: true, onClick: () => blankAfter(items.length - 1) }),
            Button({ label: 'Pages from another PDF', icon: 'files', block: true, onClick: insertPdf }),
            h('div', { class: 'divider' }),
            h('div', { class: 'card-title' }, 'Whole document'),
            Button({ label: 'Reverse page order', icon: 'refresh', block: true, onClick: () => mutate(() => items.reverse()) }),
            Button({ label: 'Reset all changes', icon: 'undo', block: true, disabled: !history.length && !extras.length, onClick: () => load([info.file]) })),
          h('div', { class: 'action-bar sticky-m' },
            Button({ label: busy ? 'Saving…' : 'Save PDF', icon: 'download', variant: 'primary', size: 'lg', block: true, busy, onClick: () => save() }),
            h('div', { class: 'summary' }, `${plural(items.length, 'page')}${removed > 0 ? ` · ${removed} removed` : ''}`)),
        ]),
    )
  }

  const ho = takeHandoff()
  if (ho) load([Array.isArray(ho) ? ho[0] : ho])
  else paint()
  return root
}

// ---- src/tools/rotate.js ----

function Rotate() {
  const { root, render } = mount()
  let info = null
  let thumbs = null
  let rots = []
  let scope = 'all'
  let busy = false
  let result = null

  const load = async ([f]) => {
    try {
      const i = await openPdf(f)
      if (!i) return
      info = i
      thumbs?.disconnect()
      thumbs = pageThumbs(info)
      rots = info.leaves.map(() => 0)
      result = null
      paint()
    } catch (e) { toast(e.message, { type: 'error' }) }
  }
  const inScope = (i) => scope === 'all' || (scope === 'odd' ? i % 2 === 0 : i % 2 === 1)
  const rotAll = (d) => { rots = rots.map((r, i) => (inScope(i) ? (r + d + 360) % 360 : r)); paint() }

  const run = () => runTask((b) => { busy = b; paint() }, async () => {
    const out = await organizePages(info.bytes, rots.map((r, i) => ({ page: i + 1, rotation: r })))
    result = { blob: new Blob([out], { type: 'application/pdf' }), name: `${stem(info.name)}-rotated.pdf` }
  })

  function paint() {
    if (!info) { render(ToolHead('rotate'), Dropzone({ onFiles: load, title: 'Drop a PDF to rotate', tc: 'var(--c-organize)', icon: 'rotate' })); return }
    if (result) { render(ToolHead('rotate'), ResultCard({ title: 'Pages rotated', blob: result.blob, filename: result.name, toolId: 'rotate', onAgain: () => { result = null; paint() } })); return }
    const changed = rots.filter(Boolean).length
    render(
      ToolHead('rotate'),
      Workspace(
        [
          FileChip({ name: info.name, size: info.size, meta: docMeta(info), onReplace: async () => { const [f] = await pickFiles(); if (f) load([f]) } }),
          h('p', { class: 'muted small', style: { margin: 0 } }, 'Click a page to turn it 90° clockwise, or use the buttons to rotate many at once.'),
          h('div', { class: 'pgrid' }, info.leaves.map((_, i) => PageCard({
            thumbs, src: i, dims: info.dims[i], rotation: rots[i], label: `${i + 1}`, sub: rots[i] ? `${rots[i]}°` : '',
            onClick: () => { rots[i] = (rots[i] + 90) % 360; paint() },
            ops: [
              { icon: 'rotl', tip: 'Rotate left', onClick: () => { rots[i] = (rots[i] + 270) % 360; paint() } },
              { icon: 'rotate', tip: 'Rotate right', onClick: () => { rots[i] = (rots[i] + 90) % 360; paint() } },
            ],
          }))),
        ],
        [
          h('div', { class: 'card stack' },
            Field('Apply to', Seg([['all', 'All pages'], ['odd', 'Odd'], ['even', 'Even']], scope, (v) => (scope = v), { block: true })),
            h('div', { class: 'row', style: { gap: '6px' } },
              Button({ label: 'Left', icon: 'rotl', onClick: () => rotAll(-90) }),
              Button({ label: 'Right', icon: 'rotate', onClick: () => rotAll(90) }),
              Button({ label: '180°', onClick: () => rotAll(180) })),
            Button({ label: 'Reset', icon: 'undo', size: 'sm', disabled: !changed, onClick: () => { rots = rots.map(() => 0); paint() } })),
          h('div', { class: 'action-bar sticky-m' },
            Button({ label: busy ? 'Saving…' : 'Save rotated PDF', icon: 'download', variant: 'primary', size: 'lg', block: true, busy, disabled: !changed, onClick: run }),
            h('div', { class: 'summary' }, changed ? `${plural(changed, 'page')} will be rotated` : 'Nothing rotated yet')),
        ]),
    )
  }

  const ho = takeHandoff()
  if (ho) load([Array.isArray(ho) ? ho[0] : ho])
  else paint()
  return root
}

// ---- src/tools/crop.js ----
// Crop PDF — drag a crop box over a page preview (or auto-detect the content
// margins) and apply it to every page, the current page, or odd / even pages.
// Cropping sets the visible page box; nothing outside it is shown or printed.

const NONE = { l: 0, t: 0, r: 0, b: 0 } // margins as fractions of the page

/** Content bounds of a rendered page → margins (fractions), with a little breathing room. */
function contentMargins(rgba, w, h, { pad = 0.015, threshold = 245 } = {}) {
  let x0 = w, y0 = h, x1 = -1, y1 = -1
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4
      if (rgba[i] < threshold || rgba[i + 1] < threshold || rgba[i + 2] < threshold) {
        if (x < x0) x0 = x
        if (x > x1) x1 = x
        if (y < y0) y0 = y
        if (y > y1) y1 = y
      }
    }
  }
  if (x1 < 0) return { ...NONE } // blank page: leave it alone
  const c = (v) => Math.max(0, Math.min(0.45, v))
  return { l: c(x0 / w - pad), t: c(y0 / h - pad), r: c(1 - (x1 + 1) / w - pad), b: c(1 - (y1 + 1) / h - pad) }
}

function Crop() {
  const { root, render } = mount()
  let info = null
  let cur = 0
  let scope = 'all'
  let margins = [] // per page
  let busy = false
  let result = null
  let preview = null // {i, canvas}
  const cache = new Map()

  const dispDims = (i) => {
    const d = info.dims[i]
    return d.rotate % 180 === 0 ? { w: d.w, h: d.h } : { w: d.h, h: d.w }
  }
  const load = async ([f]) => {
    try {
      const i = await openPdf(f)
      if (!i) return
      info = i
      cur = 0
      margins = info.leaves.map(() => ({ ...NONE }))
      result = null
      preview = null
      cache.clear()
      paint()
    } catch (e) { toast(e.message, { type: 'error' }) }
  }
  const inScope = (i) => scope === 'all' || (scope === 'current' ? i === cur : scope === 'odd' ? i % 2 === 0 : i % 2 === 1)
  const setMargins = (m) => { margins = margins.map((old, i) => (inScope(i) ? { ...m } : old)) }
  const cropped = () => margins.filter((m) => m.l || m.t || m.r || m.b).length

  const autoDetect = () => runTask((b) => { busy = b; paint() }, async () => {
    for (let i = 0; i < info.leaves.length; i++) {
      if (!inScope(i)) continue
      const cv = await renderPage(info.doc, info.leaves[i], { width: 300, cache })
      const d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height)
      margins[i] = contentMargins(d.data, cv.width, cv.height)
      await yieldUI()
    }
    toast('Margins detected — adjust the box if needed', { type: 'info' })
  })

  const run = () => runTask((b) => { busy = b; paint() }, async () => {
    const rects = margins.map((m, i) => {
      if (!(m.l || m.t || m.r || m.b)) return null
      const { w, h: hh } = dispDims(i)
      return { x: m.l * w, y: m.t * hh, w: (1 - m.l - m.r) * w, h: (1 - m.t - m.b) * hh }
    })
    const out = await cropPages(info.bytes, rects)
    result = { blob: new Blob([out], { type: 'application/pdf' }), name: `${stem(info.name)}-cropped.pdf` }
  })

  /** Page preview with a draggable crop box. */
  function Stage() {
    const m = margins[cur]
    const wrap = h('div', { class: 'crop-stage' })
    const box = h('div', { class: 'crop-box' }, ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'].map((k) => h('span', { class: `crop-h ${k}`, 'data-h': k })))
    const place = () => Object.assign(box.style, { left: `${m.l * 100}%`, top: `${m.t * 100}%`, right: `${m.r * 100}%`, bottom: `${m.b * 100}%` })
    place()
    const draw = (cv) => { cv.classList.add('crop-cv'); wrap.prepend(cv) }
    if (preview?.i === cur) draw(preview.canvas)
    else {
      const { w, h: hh } = dispDims(cur)
      wrap.style.aspectRatio = `${w} / ${hh}`
      renderPage(info.doc, info.leaves[cur], { width: 900, cache }).then((cv) => {
        preview = { i: cur, canvas: cv }
        if (wrap.isConnected) { wrap.style.aspectRatio = ''; draw(cv) }
      }).catch(() => {})
    }
    let drag = null
    box.addEventListener('pointerdown', (e) => {
      e.preventDefault()
      try { box.setPointerCapture(e.pointerId) } catch { /* pointer already gone */ }
      drag = { h: e.target.dataset.h ?? 'move', x: e.clientX, y: e.clientY, m: { ...m }, r: wrap.getBoundingClientRect() }
    })
    box.addEventListener('pointermove', (e) => {
      if (!drag) return
      const dx = (e.clientX - drag.x) / drag.r.width, dy = (e.clientY - drag.y) / drag.r.height
      const o = drag.m, min = 0.05
      const k = drag.h
      if (k === 'move') {
        const mx = Math.max(-o.l, Math.min(o.r, dx)), my = Math.max(-o.t, Math.min(o.b, dy))
        Object.assign(m, { l: o.l + mx, r: o.r - mx, t: o.t + my, b: o.b - my })
      } else {
        if (k.includes('w')) m.l = Math.max(0, Math.min(1 - o.r - min, o.l + dx))
        if (k.includes('e')) m.r = Math.max(0, Math.min(1 - o.l - min, o.r - dx))
        if (k.includes('n')) m.t = Math.max(0, Math.min(1 - o.b - min, o.t + dy))
        if (k.includes('s')) m.b = Math.max(0, Math.min(1 - o.t - min, o.b - dy))
      }
      place()
    })
    const end = () => { if (!drag) return; drag = null; setMargins(m); paint() }
    box.addEventListener('pointerup', end)
    box.addEventListener('pointercancel', end)
    wrap.append(box)
    return wrap
  }

  function marginInputs() {
    const m = margins[cur]
    const { w, h: hh } = dispDims(cur)
    const mm = (frac, size) => Math.round(((frac * size) / 72) * 25.4)
    const set = (k, size) => (v) => {
      const f = Math.max(0, (v / 25.4) * 72) / size
      const opp = { l: 'r', r: 'l', t: 'b', b: 't' }[k]
      m[k] = Math.min(f, 0.95 - m[opp])
      setMargins(m)
      paint()
    }
    return h('div', { class: 'crop-mm' },
      Field('Top (mm)', Stepper(mm(m.t, hh), { min: 0, max: 999 }, set('t', hh))),
      Field('Bottom (mm)', Stepper(mm(m.b, hh), { min: 0, max: 999 }, set('b', hh))),
      Field('Left (mm)', Stepper(mm(m.l, w), { min: 0, max: 999 }, set('l', w))),
      Field('Right (mm)', Stepper(mm(m.r, w), { min: 0, max: 999 }, set('r', w))))
  }

  function paint() {
    if (!info) { render(ToolHead('crop'), Dropzone({ onFiles: load, title: 'Drop a PDF to crop', tc: 'var(--c-organize)', icon: 'crop' })); return }
    if (result) { render(ToolHead('crop'), ResultCard({ title: 'PDF cropped', blob: result.blob, filename: result.name, toolId: 'crop', onAgain: () => { result = null; paint() } })); return }
    const n = info.leaves.length
    const done = cropped()
    const go = (i) => { cur = Math.max(0, Math.min(n - 1, i)); paint() }
    render(
      ToolHead('crop'),
      Workspace(
        [
          FileChip({ name: info.name, size: info.size, meta: docMeta(info), onReplace: async () => { const [f] = await pickFiles(); if (f) load([f]) } }),
          h('p', { class: 'muted small', style: { margin: 0 } }, 'Drag the edges or corners of the box. Everything outside it is cut off.'),
          h('div', { class: 'crop-nav' },
            Button({ icon: 'chevLeft', size: 'sm', tip: 'Previous page', disabled: cur === 0, onClick: () => go(cur - 1) }),
            h('span', {}, `Page ${cur + 1} of ${n}`),
            Button({ icon: 'chevRight', size: 'sm', tip: 'Next page', disabled: cur === n - 1, onClick: () => go(cur + 1) })),
          Stage(),
        ],
        [
          h('div', { class: 'card stack' },
            Field('Apply to', Seg([['all', 'All pages'], ['current', 'This page'], ['odd', 'Odd'], ['even', 'Even']], scope, (v) => { scope = v; paint() }, { block: true })),
            marginInputs(),
            h('div', { class: 'row', style: { gap: '6px' } },
              Button({ label: 'Auto-detect margins', icon: 'wand', disabled: busy, onClick: autoDetect }),
              Button({ label: 'Reset', icon: 'undo', size: 'sm', disabled: !done, onClick: () => { margins = margins.map(() => ({ ...NONE })); paint() } }))),
          h('div', { class: 'action-bar sticky-m' },
            Button({ label: busy ? 'Working…' : 'Save cropped PDF', icon: 'download', variant: 'primary', size: 'lg', block: true, busy, disabled: !done, onClick: run }),
            h('div', { class: 'summary' }, done ? `${plural(done, 'page')} will be cropped` : 'Nothing cropped yet')),
        ]),
    )
  }

  const ho = takeHandoff()
  if (ho) load([Array.isArray(ho) ? ho[0] : ho])
  else paint()
  return root
}

// ---- src/tools/edit.js ----
// Edit PDF — full-screen workspace: tool rail, page thumbnails, continuous
// page scroll, contextual properties, undo/redo, forms, signatures, redaction.

const TOOLS = [
  ['select', 'cursor', 'V'], ['edittext', 'editText', 'E'], ['text', 'type', 'T'], '|',
  ['draw', 'pencil', 'P'], ['highlight', 'highlight', 'H'], ['erase', 'eraser', 'Z'], ['shape', 'shapes', 'R'], '|',
  ['whiteout', 'whiteout', 'W'], ['redact', 'redact', 'X'], '|',
  ['image', 'image', 'I'], ['signature', 'signature', 'S'], ['stamp', 'stamp', 'K'], ['note', 'note', 'N'], ['link', 'link', 'L'],
]
const STYLE_KEY = 'pdfsuite-editor-style'
const DEFAULT_STYLE = {
  penColor: '#1971c2', penWidth: 2.5, penAlpha: 1, hlColor: '#ffe066', hlWidth: 14,
  textColor: '#111111', textSize: 14, font: 'helv', bold: false, italic: false, underline: false, align: 'left',
  shapeStroke: '#e03131', shapeFill: null, shapeWidth: 2, shapeAlpha: 1, shapeDash: false,
  redactColor: '#000000', stampSize: 18, stampColor: '#e03131', markColor: '#111111', noteColor: '#ffd43b',
  eraserSize: 10, snap: true, shapeFillAlpha: 1, polySides: 6, starPoints: 5,
}
const tabletMQ = matchMedia('(min-width: 761px) and (max-width: 1100px)')
let uidSeq = 0
const uid = () => `a${++uidSeq}`

function loadStyle() {
  try { return { ...DEFAULT_STYLE, ...JSON.parse(localStorage.getItem(STYLE_KEY) ?? '{}') } } catch { return { ...DEFAULT_STYLE } }
}

function Edit(params = {}) {
  const root = h('div', { class: 'ed-root' })
  const ed = {
    info: null, doc: null, pages: [], views: [], zoom: 1, tool: 'select',
    sub: { shape: 'rect', hl: 'text', stamp: 'check' },
    style: loadStyle(), sel: null, editing: null, fields: [], values: {}, dirty: false,
    imgCache: new Map(), clipboard: null, fileName: '', propsTab: 'props',
    history: [], future: [], current: null,
    selSet: new Set(), penSeen: false, cropping: null, cropAspect: null, pdfImg: null,
    touchUI: matchMedia('(pointer: coarse)').matches, newId: () => uid(),
  }
  let els = {}
  let thumbs = null
  let io = null
  let farIo = null
  let last = null // current history snapshot

  // ---------- loading ----------
  const load = async ([f]) => {
    try {
      const info = await openPdf(f)
      if (!info) return
      ed.info = info
      ed.doc = info.doc
      ed.fileName = stem(info.name)
      ed.imgCache = new Map()
      ed.pages = info.leaves.map((_, i) => {
        const d = info.dims[i]
        const w = d.rotate % 180 === 0 ? d.w : d.h, hh = d.rotate % 180 === 0 ? d.h : d.w
        return { id: uid(), src: i, rot: 0, w, h: hh, annots: [], ops: null }
      })
      try { ed.fields = readFields(ed.doc).filter((x) => x.type !== 'button' && x.widgets.length) } catch { ed.fields = [] }
      ed.values = {}
      ed.history = []
      ed.future = []
      ed.dirty = false
      ed.sel = null
      ed.current = ed.pages[0]
      build()
      last = snapshot()
      updateChrome()
      if (params.mode === 'sign') ed.setTool('signature')
      else if (params.mode === 'redact') ed.setTool('redact')
      else if (params.mode === 'fill') {
        ed.setTool('select')
        ed.hint(ed.fields.length ? `This form has ${ed.fields.length} field${ed.fields.length === 1 ? '' : 's'} — click into them to type` : 'No fillable fields found — use the Text tool to type anywhere')
      } else if (ed.fields.length) ed.hint(`This PDF has ${ed.fields.length} form field${ed.fields.length === 1 ? '' : 's'} you can fill in`)
    } catch (e) { toast(friendly(e, f.name), { type: 'error' }) }
  }

  // ---------- shell ----------
  function empty() {
    const titles = { sign: ['Sign PDF', 'signature', 'sign'], fill: ['Fill forms', 'form', 'fill in'], redact: ['Redact PDF', 'redact', 'redact'] }
    const [t, ic, verb] = titles[params.mode] ?? ['Edit PDF', 'pencil', 'edit']
    setKids(root,
      h('div', { class: 'ed-top' },
        h('a', { class: 'btn btn-ghost btn-icon', href: '#/', 'data-tip': 'All tools', 'aria-label': 'All tools' }, icon('left')),
        h('span', { class: 'ed-name' }, t)),
      h('div', { style: { overflow: 'auto', display: 'grid', placeItems: 'center', padding: '24px 16px' } },
        h('div', { style: { width: 'min(640px, 100%)' } },
          Dropzone({ onFiles: load, title: `Drop the PDF you want to ${verb}`, tc: 'var(--c-edit)', icon: ic }))))
  }

  function build() {
    thumbs?.disconnect()
    io?.disconnect()
    farIo?.disconnect()
    els.ro?.disconnect()
    ed.views = []
    els = {}
    els.name = h('input', {
      class: 'ed-name', value: ed.fileName, 'aria-label': 'File name', spellcheck: 'false',
      onchange: (e) => { ed.fileName = e.target.value.trim() || stem(ed.info.name) },
      onkeydown: (e) => { e.stopPropagation(); if (e.key === 'Enter') e.target.blur() },
    })
    els.undo = Button({ icon: 'undo', size: 'sm', variant: 'ghost', tip: 'Undo (Ctrl+Z)', onClick: () => ed.undo() })
    els.redo = Button({ icon: 'redo', size: 'sm', variant: 'ghost', tip: 'Redo (Ctrl+Shift+Z)', onClick: () => ed.redo() })
    els.zoomLbl = h('button', {
      type: 'button', 'data-tip': 'Zoom options',
      onclick: (e) => menu(e.currentTarget, [
        { label: 'Fit width', icon: 'fitW', kbd: 'Ctrl+0', onClick: () => ed.fit('width') },
        { label: 'Fit page', icon: 'fit', onClick: () => ed.fit('page') },
        'sep', ...[50, 75, 100, 125, 150, 200, 300].map((z) => ({ label: `${z}%`, onClick: () => ed.setZoom(z / 100, { commit: true }) })),
      ]),
    }, '100%')
    els.pageInput = h('input', {
      value: '1', 'aria-label': 'Page number',
      onkeydown: (e) => { e.stopPropagation(); if (e.key === 'Enter') { const n = parseInt(e.target.value, 10); if (n >= 1 && n <= ed.pages.length) ed.scrollToPage(ed.pages[n - 1]) } },
    })
    els.pageCount = h('span', {}, `/ ${ed.pages.length}`)
    els.download = Button({ label: 'Download', icon: 'download', variant: 'primary', size: 'sm', onClick: () => ed.exportDialog() })
    const more = Button({
      icon: 'chevDown', variant: 'primary', size: 'sm', tip: 'More options',
      onClick: (e) => menu(e.currentTarget, [
        { label: 'Download options…', icon: 'download', kbd: 'Ctrl+Shift+S', onClick: () => ed.exportDialog() },
        { label: 'Quick download PDF', icon: 'file', kbd: 'Ctrl+S', onClick: () => doExport({}) },
        { label: 'Save pages as PNG images', icon: 'image', onClick: () => doExport({ format: 'png', pages: 'all', dpi: 150 }) },
        ed.fields.length ? { label: 'Download with flattened form', icon: 'form', onClick: () => doExport({ flatten: true }) } : null,
        'sep',
        { label: 'Open another PDF', icon: 'files', onClick: async () => { if (await confirmLeave()) { const [f] = await pickFiles(); if (f) load([f]) } } },
        { label: 'Keyboard shortcuts', icon: 'keyboard', kbd: '?', onClick: () => ed.showShortcuts() },
      ], { align: 'right' }),
    })
    Object.assign(more.style, { borderTopLeftRadius: '0', borderBottomLeftRadius: '0', borderLeft: '1px solid rgba(0,0,0,.15)' })
    Object.assign(els.download.style, { borderTopRightRadius: '0', borderBottomRightRadius: '0' })
    const top = h('div', { class: 'ed-top' },
      h('div', { class: 'ed-title' },
        h('button', { class: 'btn btn-ghost btn-icon btn-sm', 'data-tip': 'All tools', 'aria-label': 'Back to all tools', onclick: async () => { if (await confirmLeave()) { ed.dirty = false; location.hash = '#/' } } }, icon('left')),
        h('button', { class: 'btn btn-ghost btn-icon btn-sm ed-hide-m', 'data-tip': 'Pages panel', 'aria-label': 'Toggle pages panel', onclick: () => { els.body.classList.toggle('no-thumbs'); els.body.classList.toggle('thumbs-open') } }, icon('sidebar')),
        els.name),
      h('div', { class: 'ed-mid' },
        els.undo, els.redo, h('span', { class: 'ed-sep' }),
        h('div', { class: 'ed-zoom ed-hide-m' },
          h('button', { type: 'button', 'data-tip': 'Zoom out', 'aria-label': 'Zoom out', onclick: () => ed.setZoom(ed.zoom / 1.2, { commit: true }) }, icon('minus', 'icon-sm')),
          els.zoomLbl,
          h('button', { type: 'button', 'data-tip': 'Zoom in', 'aria-label': 'Zoom in', onclick: () => ed.setZoom(ed.zoom * 1.2, { commit: true }) }, icon('plus', 'icon-sm'))),
        h('span', { class: 'ed-sep ed-hide-m' }),
        h('span', { class: 'ed-pageind ed-hide-m' }, els.pageInput, els.pageCount)),
      h('button', { class: 'btn btn-ghost btn-icon btn-sm ed-propbtn', 'data-tip': 'Properties & layers', 'aria-label': 'Properties and layers', onclick: () => els.props.classList.toggle('open') }, icon('layers')),
      h('div', { class: 'row', style: { gap: '0', flexWrap: 'nowrap' } }, els.download, more))

    els.rail = h('nav', { class: 'ed-rail', 'aria-label': 'Tools' }, TOOLS.map((t) => {
      if (t === '|') return h('span', { class: 'sep' })
      const [id, ic, key] = t
      return h('button', { type: 'button', class: 'ed-tool', 'data-tool': id, 'data-tip': `${TOOL_INFO[id][0]} (${key})`, 'data-tip-side': 'right', 'aria-label': TOOL_INFO[id][0], onclick: () => ed.setTool(id) }, icon(ic), h('span', { class: 'ed-key' }, key))
    }))
    els.thumbs = h('div', { class: 'ed-thumbs', 'aria-label': 'Pages' })
    els.pages = h('div', { class: 'ed-pages' })
    els.scroll = h('div', { class: 'ed-scroll' }, els.pages)
    els.props = h('aside', { class: 'ed-props', 'aria-label': 'Properties' })
    els.body = h('div', { class: 'ed-body' }, els.rail, els.thumbs, els.scroll, els.props)
    setKids(root, top, els.body)

    io = new IntersectionObserver((ents) => {
      for (const en of ents) {
        const v = ed.views.find((x) => x.el === en.target)
        if (!v) continue
        v.near = en.isIntersecting
        if (en.isIntersecting && v.rendered !== ed.zoom) v.render()
      }
    }, { root: els.scroll, rootMargin: '120% 0px' })
    farIo = new IntersectionObserver((ents) => {
      for (const en of ents) {
        const v = ed.views.find((x) => x.el === en.target)
        if (v && !en.isIntersecting && v.rendered) v.release()
      }
    }, { root: els.scroll, rootMargin: '450% 0px' })
    rebuildViews()
    els.scroll.addEventListener('scroll', rafThrottle(trackCurrent))
    els.scroll.addEventListener('wheel', (e) => {
      if (!e.ctrlKey && !e.metaKey) return
      e.preventDefault()
      ed.setZoom(ed.zoom * Math.exp(-e.deltaY * (e.deltaMode === 1 ? 16 : 1) * 0.0022), { cx: e.clientX, cy: e.clientY, live: true })
      clearTimeout(ed._zt)
      ed._zt = setTimeout(() => ed.setZoom(ed.zoom, { commit: true }), 160)
    }, { passive: false })
    // fit as soon as the page area has a real size (it can be 0 for a frame
    // while the layout settles) and keep fitting on resize until the user zooms
    ed.userZoomed = false
    const ro = new ResizeObserver(() => {
      if (!els.scroll.clientWidth) return
      if (!ed.userZoomed) ed.fit('width', { max: 1.5, auto: true })
    })
    ro.observe(els.scroll)
    els.ro = ro
    ed.setTool(ed.tool)
    // insurance: the first pages render even if visibility notifications are late
    setTimeout(() => {
      if (!ed.userZoomed && els.scroll?.clientWidth) ed.fit('width', { max: 1.5, auto: true }) // resize notifications can be paused
      for (const v of ed.views.slice(0, 2)) if (!v.rendered) v.render()
    }, 500)
  }

  function rebuildViews() {
    const keep = new Map(ed.views.map((v) => [v.page, v]))
    ed.views = ed.pages.map((p) => keep.get(p) ?? createPageView(ed, p))
    for (const v of keep.values()) if (!ed.views.includes(v)) { io?.unobserve(v.el); farIo?.unobserve(v.el) }
    setKids(els.pages, ed.views.map((v) => v.el))
    for (const v of ed.views) { v.layout(); io.observe(v.el); farIo.observe(v.el) }
    ed.current = ed.pages.includes(ed.current) ? ed.current : ed.pages[0]
    buildThumbs()
    if (els.pageCount) els.pageCount.textContent = `/ ${ed.pages.length}`
    trackCurrent()
  }

  function buildThumbs() {
    thumbs?.disconnect()
    const cache = new Map()
    thumbs = thumbQueue((src) => renderPage(ed.doc, ed.info.leaves[src], { width: 240, cache }), { root: els.thumbs })
    setKids(els.thumbs,
      ed.pages.map((p, i) => {
        const tw = h('div', { class: 'tw' }, h('div', { class: 'tskel', style: { aspectRatio: `${p.w} / ${p.h}` } }))
        if (p.src !== null) thumbs.attach(tw, p.src, (cv) => { if (cv) tw.replaceChildren(rotatedCanvas(cv, p.rot)) })
        else tw.replaceChildren(h('canvas', { width: Math.round(120 * (p.w / p.h)), height: 120, style: { width: '100%' } }))
        const op = (ic, tip, fn, cls = '') => h('span', { class: cls, role: 'button', 'data-tip': tip, 'aria-label': tip, onclick: (e) => { e.stopPropagation(); fn() } }, icon(ic, 'icon-sm'))
        return h('button', { type: 'button', class: 'ed-thumb' + (p === ed.current ? ' cur' : ''), 'data-id': p.id, onclick: () => ed.scrollToPage(p) },
          h('div', { class: 'tops' },
            op('rotate', 'Rotate', () => ed.rotatePage(p)),
            op('copy', 'Duplicate', () => ed.duplicatePage(p)),
            ed.pages.length > 1 ? op('trash', 'Delete page', () => ed.deletePage(p), 'danger') : null),
          tw, `${i + 1}`)
      }),
      h('button', { class: 'ed-addpage', onclick: () => ed.insertBlank(ed.pages[ed.pages.length - 1]) }, icon('plus', 'icon-sm'), 'Blank page'))
    sortable(els.thumbs, '.ed-thumb', (from, to) => {
      const [p] = ed.pages.splice(from, 1)
      ed.pages.splice(to, 0, p)
      rebuildViews()
      ed.commit('Move page')
    }, { horizontal: false })
  }

  function trackCurrent() {
    if (!els.scroll) return
    const mid = els.scroll.getBoundingClientRect().top + els.scroll.clientHeight * 0.35
    let best = null, bd = Infinity
    for (const v of ed.views) {
      const r = v.el.getBoundingClientRect()
      const d = r.top <= mid && r.bottom >= mid ? 0 : Math.min(Math.abs(r.top - mid), Math.abs(r.bottom - mid))
      if (d < bd) { bd = d; best = v }
    }
    if (best && best.page !== ed.current) ed.setCurrentPage(best.page, true)
    else if (best && els.pageInput && document.activeElement !== els.pageInput) els.pageInput.value = String(ed.pages.indexOf(best.page) + 1)
  }

  // ---------- API used by views / props ----------
  ed.setCurrentPage = (p, fromScroll = false) => {
    if (ed.current === p && !fromScroll) return
    ed.current = p
    for (const v of ed.views) v.el.classList.toggle('cur', v.page === p)
    els.thumbs?.querySelectorAll('.ed-thumb').forEach((t) => t.classList.toggle('cur', t.dataset.id === p.id))
    if (els.pageInput && document.activeElement !== els.pageInput) els.pageInput.value = String(ed.pages.indexOf(p) + 1)
    if (fromScroll) els.thumbs?.querySelector('.ed-thumb.cur')?.scrollIntoView({ block: 'nearest' })
    if (ed.tool === 'select' && !ed.sel) ed.refreshProps()
  }
  ed.currentPage = () => ed.current
  ed.scrollToPage = (p) => {
    const v = ed.views.find((x) => x.page === p)
    if (!v) return
    els.scroll.scrollTo({ top: v.el.offsetTop - 24, behavior: 'smooth' })
    ed.setCurrentPage(p)
  }
  ed.viewOf = (p) => ed.views.find((v) => v.page === p)
  ed.redrawCurrent = () => ed.viewOf(ed.sel ? ed.sel.page : ed.current)?.redraw()
  ed.redrawAll = () => ed.views.forEach((v) => v.redraw())
  ed.dirtyChrome = () => { ed.dirty = true }

  ed.setTool = (t) => {
    ed.closeEditor(true)
    ed.finishCrop(true)
    if (t === 'image') { ed.insertImage(); return }
    ed.tool = t
    els.rail?.querySelectorAll('.ed-tool').forEach((b) => b.classList.toggle('on', b.dataset.tool === t))
    for (const v of ed.views) {
      v.over.style.cursor = t === 'select' ? 'default' : t === 'edittext' || t === 'text' ? 'text' : t === 'erase' ? 'none' : 'crosshair'
      v.over.style.touchAction = t === 'select' ? 'pan-x pan-y' : 'none'
      if ((t === 'edittext' || t === 'redact' || t === 'highlight') && v.near) v.getRuns().then(() => v.redraw())
    }
    if (t !== 'select') ed.select(null)
    ed.refreshProps()
    ed.hintTool()
  }
  ed.hintTool = () => {
    const tips = {
      edittext: 'Click any text to change it', text: 'Click to add text — drag sideways for a wrapping box',
      highlight: ed.sub.hl === 'text' ? 'Drag across text to highlight it' : 'Draw to highlight',
      redact: 'Drag boxes over sensitive content — or search on the right', stamp: 'Click to place the mark',
      note: 'Click to add a comment', link: 'Drag over the area to make clickable', signature: 'Create or pick a signature on the right',
      erase: 'Rub over drawings, highlights and shapes to erase them',
    }
    if (tips[ed.tool]) ed.hint(tips[ed.tool])
  }
  let hintEl = null
  let hintT = 0
  ed.hint = (msg) => {
    hintEl?.remove()
    hintEl = h('div', { class: 'ed-hint', role: 'status' }, msg)
    root.append(hintEl)
    if (els.scroll) {
      const r = els.scroll.getBoundingClientRect()
      hintEl.style.position = 'fixed'
      hintEl.style.left = `${r.left + r.width / 2}px`
    }
    clearTimeout(hintT)
    hintT = setTimeout(() => hintEl?.remove(), 2800)
  }

  // selection: ed.sel = primary {page, a}; ed.selSet = every selected object (same page)
  const clearPdfImg = () => {
    if (!ed.pdfImg) return
    const p = ed.pdfImg.page
    ed.pdfImg = null
    ed.viewOf(p)?.redraw()
  }
  ed.select = (page, a) => {
    if (ed.cropping && ed.cropping.a !== a) ed.finishCrop(true)
    clearPdfImg()
    if (!page) {
      ed.selSet.clear()
      if (!ed.sel) return
      const old = ed.sel
      ed.sel = null
      ed.viewOf(old.page)?.redraw()
      ed.refreshProps()
      return
    }
    const prev = ed.sel
    ed.sel = { page, a }
    ed.selSet = new Set([a])
    if (tabletMQ.matches && prev?.a !== a) els.props?.classList.add('open') // drawer slides in with the object's options
    if (prev && prev.page !== page) ed.viewOf(prev.page)?.redraw()
    ed.viewOf(page)?.redraw()
    ed.refreshProps()
  }
  ed.selectMany = (page, list) => {
    list = list.filter((a) => page.annots.includes(a))
    if (!list.length) { ed.select(null); return }
    if (list.length === 1) { ed.select(page, list[0]); return }
    clearPdfImg()
    const prev = ed.sel
    ed.sel = { page, a: list[list.length - 1] }
    ed.selSet = new Set(list)
    if (prev && prev.page !== page) ed.viewOf(prev.page)?.redraw()
    ed.viewOf(page)?.redraw()
    ed.refreshProps()
  }
  ed.toggleSelect = (page, a) => {
    if (ed.sel?.page !== page) { ed.select(page, a); return }
    const list = [...ed.selSet]
    ed.selectMany(page, ed.selSet.has(a) ? list.filter((x) => x !== a) : [...list, a])
  }
  ed.selectAll = () => {
    const p = ed.current
    if (!p) return
    if (ed.tool !== 'select') ed.setTool('select')
    ed.selectMany(p, p.annots.filter((a) => !a.hidden && !a.locked && a.t !== 'imgremove'))
  }
  ed.selected = () => (ed.sel ? [...ed.selSet].filter((a) => ed.sel.page.annots.includes(a)) : [])
  /** Scroll the page area (two-finger pan, pen-mode finger pan). */
  ed.panBy = (dx, dy) => {
    if (!els.scroll) return
    els.scroll.scrollLeft += dx
    els.scroll.scrollTop += dy
  }
  let propsT = 0
  ed.refreshProps = (soft = false) => {
    if (!els.props) return
    clearTimeout(propsT)
    if (soft) { propsT = setTimeout(() => renderProps(ed, els.props), 150); return }
    renderProps(ed, els.props)
  }

  ed.add = (page, a, { select = true, silent = false } = {}) => {
    a.id = uid()
    page.annots.push(a)
    if (select) ed.select(page, a); else ed.viewOf(page)?.redraw()
    if (!silent) ed.commit('Add')
    return a
  }
  ed.deleteSel = () => {
    if (ed.pdfImg) { ed.deletePdfImage(); return }
    if (!ed.sel) return
    const { page } = ed.sel
    const gone = new Set(ed.selected().filter((a) => !a.locked))
    if (!gone.size) { ed.hint('That item is locked — unlock it in Layers first'); return }
    if (ed.cropping && gone.has(ed.cropping.a)) ed.cropping = null
    page.annots = page.annots.filter((x) => !gone.has(x))
    ed.sel = null
    ed.selSet.clear()
    if ([...gone].some((a) => a.t === 'textedit')) ed.viewOf(page)?.render() // bring the original text back
    else ed.viewOf(page)?.redraw()
    ed.refreshProps()
    ed.commit('Delete')
  }
  const move = (a, dx, dy) => {
    if (a.pts) a.pts = a.pts.map((p) => [p[0] + dx, p[1] + dy, ...p.slice(2)])
    if (a.rects) a.rects = a.rects.map((r) => ({ ...r, x: r.x + dx, y: r.y + dy }))
    if (a.x1 !== undefined) { a.x1 += dx; a.y1 += dy; a.x2 += dx; a.y2 += dy }
    if (a.x !== undefined) { a.x += dx; a.y += dy }
  }
  ed.duplicate = () => {
    if (!ed.sel) return
    const { page } = ed.sel
    const src = ed.selected().filter((a) => a.t !== 'textedit')
    if (!src.length) { toast('Edited text can’t be duplicated — use the Text tool instead', { type: 'info' }); return }
    const copies = src.map((a) => { const c = annClone(a); move(c, 12, 12); c.id = uid(); c.locked = false; page.annots.push(c); return c })
    ed.selectMany(page, copies)
    ed.commit('Duplicate')
  }
  /** where: 'front' | 'back' | 'forward' | 'backward' — applies to the whole selection. */
  ed.reorder = (where) => {
    if (!ed.sel) return
    const { page } = ed.sel
    const set = new Set(ed.selected())
    const list = page.annots
    if (where === 'front' || where === 'back') {
      const rest = list.filter((x) => !set.has(x)), mine = list.filter((x) => set.has(x))
      page.annots = where === 'front' ? [...rest, ...mine] : [...mine, ...rest]
    } else if (where === 'forward') {
      for (let i = list.length - 2; i >= 0; i--) if (set.has(list[i]) && !set.has(list[i + 1])) [list[i], list[i + 1]] = [list[i + 1], list[i]]
    } else {
      for (let i = 1; i < list.length; i++) if (set.has(list[i]) && !set.has(list[i - 1])) [list[i], list[i - 1]] = [list[i - 1], list[i]]
    }
    ed.viewOf(page)?.redraw()
    ed.refreshProps()
    ed.commit('Arrange')
  }
  /** Move one object to a stacking index (layers panel drag). */
  ed.moveLayer = (page, a, toIndex) => {
    const list = page.annots.filter((x) => x !== a)
    list.splice(Math.max(0, Math.min(list.length, toIndex)), 0, a)
    page.annots = list
    ed.viewOf(page)?.redraw()
    ed.refreshProps()
    ed.commit('Arrange')
  }
  /** Align / distribute the selection (or a single object to the page). */
  ed.align = (how) => {
    if (!ed.sel) return
    const { page } = ed.sel
    const items = ed.selected().filter((a) => !a.locked)
    if (!items.length) return
    const bs = items.map((a) => annBounds(a))
    let ref
    if (items.length === 1) ref = { x: 0, y: 0, w: page.w, h: page.h }
    else {
      const x0 = Math.min(...bs.map((b) => b.x)), y0 = Math.min(...bs.map((b) => b.y))
      ref = { x: x0, y: y0, w: Math.max(...bs.map((b) => b.x + b.w)) - x0, h: Math.max(...bs.map((b) => b.y + b.h)) - y0 }
    }
    if (how === 'dh' || how === 'dv') {
      if (items.length < 3) { ed.hint('Select 3 or more items to distribute'); return }
      const hz = how === 'dh'
      const order = items.map((a, i) => [a, bs[i]]).sort((p, q) => (hz ? p[1].x - q[1].x : p[1].y - q[1].y))
      const total = order.reduce((s2, [, b]) => s2 + (hz ? b.w : b.h), 0)
      const gap = ((hz ? ref.w : ref.h) - total) / (order.length - 1)
      let at = hz ? ref.x : ref.y
      for (const [a, b] of order) { move(a, hz ? at - b.x : 0, hz ? 0 : at - b.y); at += (hz ? b.w : b.h) + gap }
    } else {
      items.forEach((a, i) => {
        const b = bs[i]
        const dx = how === 'l' ? ref.x - b.x : how === 'c' ? ref.x + ref.w / 2 - (b.x + b.w / 2) : how === 'r' ? ref.x + ref.w - (b.x + b.w) : 0
        const dy = how === 't' ? ref.y - b.y : how === 'm' ? ref.y + ref.h / 2 - (b.y + b.h / 2) : how === 'b' ? ref.y + ref.h - (b.y + b.h) : 0
        move(a, dx, dy)
      })
    }
    ed.viewOf(page)?.redraw()
    ed.commit('Align')
  }
  ed.setFlag = (page, a, key, val) => {
    a[key] = val
    if (val && (key === 'hidden' || key === 'locked') && ed.selSet.has(a)) ed.selectMany(page, ed.selected().filter((x) => x !== a))
    ed.viewOf(page)?.redraw()
    ed.refreshProps()
    ed.commit(key === 'hidden' ? 'Visibility' : 'Lock')
  }
  ed.editSelected = () => { if (ed.sel && (ed.sel.a.t === 'text' || ed.sel.a.t === 'textedit')) ed.viewOf(ed.sel.page)?.editText(ed.sel.a) }
  ed.dblClick = (page, a) => {
    if (a.t === 'text' || a.t === 'textedit') ed.viewOf(page)?.editText(a)
    else if (a.t === 'note') ed.editNote(page, a)
    else if (a.t === 'link') ed.editLink(page, a)
  }
  ed.closeEditor = (commit) => {
    const e = ed.editing
    if (!e) return
    ed.editing = null
    e.el.remove()
    const { a, page } = e
    if (a.t === 'text' && !a.text.trim()) {
      page.annots = page.annots.filter((x) => x !== a)
      if (ed.sel?.a === a) ed.sel = null
    } else if (a.t === 'textedit' && a.text === a.origText && e.before === a.origText) {
      // untouched: drop the edit and bring the original back
      page.annots = page.annots.filter((x) => x !== a)
      if (ed.sel?.a === a) ed.sel = null
      ed.viewOf(page)?.render()
      ed.viewOf(page)?.redraw()
      ed.refreshProps()
      return
    }
    ed.viewOf(page)?.redraw()
    ed.refreshProps()
    if (commit && (a.text !== e.before || a.t === 'textedit')) ed.commit('Text')
  }

  ed.editNote = (page, a, isNew = false) => {
    let text = a.text
    const ta = h('textarea', { class: 'textarea', rows: '5', placeholder: 'Write a comment…', oninput: (e) => (text = e.target.value) })
    ta.value = a.text
    modal({
      title: isNew ? 'Add a comment' : 'Edit comment', body: [ta],
      onClose: () => { if (isNew && !a.text) { page.annots = page.annots.filter((x) => x !== a); ed.sel = null; ed.viewOf(page)?.redraw(); ed.refreshProps() } },
      actions: [{ label: 'Cancel' }, { label: 'Save', variant: 'primary', onClick: () => { a.text = text; isNew = false; ed.commit('Comment'); ed.refreshProps(); ed.viewOf(page)?.redraw() } }],
    })
  }
  ed.editLink = (page, a, isNew = false) => {
    let url = a.url
    const input = TextInput(a.url, (v) => (url = v), { placeholder: 'https://example.com', type: 'url' })
    modal({
      title: isNew ? 'Link to a web address' : 'Edit link', body: [Field('Web address', input)],
      onClose: () => { if (isNew && !a.url) { page.annots = page.annots.filter((x) => x !== a); ed.sel = null; ed.viewOf(page)?.redraw(); ed.refreshProps() } },
      actions: [{ label: 'Cancel' }, { label: 'Save link', variant: 'primary', onClick: () => {
        if (!url.trim()) { toast('Enter a web address', { type: 'error' }); return false }
        a.url = url.trim(); isNew = false; ed.commit('Link'); ed.refreshProps()
      } }],
    })
  }
  ed.contextMenu = (e, page, a) => {
    const anchor = { getBoundingClientRect: () => ({ left: e.clientX, right: e.clientX, top: e.clientY, bottom: e.clientY }) }
    const many = ed.selSet.size > 1
    menu(anchor, [
      !many && (a.t === 'text' || a.t === 'textedit') ? { label: 'Edit text', icon: 'pencil', kbd: 'Enter', onClick: () => ed.dblClick(page, a) } : null,
      !many && a.t === 'image' ? { label: 'Crop image', icon: 'crop', onClick: () => ed.startCrop(page, a) } : null,
      !many && a.t === 'image' ? { label: 'Save image as PNG', icon: 'download', onClick: () => ed.saveImage(a) } : null,
      { label: 'Duplicate', icon: 'copy', kbd: 'Ctrl+D', onClick: () => ed.duplicate() },
      { label: 'Copy', icon: 'copy', kbd: 'Ctrl+C', onClick: () => copySel() },
      { label: 'Bring to front', icon: 'front', onClick: () => ed.reorder('front') },
      { label: 'Bring forward', icon: 'up', onClick: () => ed.reorder('forward') },
      { label: 'Send backward', icon: 'down', onClick: () => ed.reorder('backward') },
      { label: 'Send to back', icon: 'back', onClick: () => ed.reorder('back') },
      { label: 'Lock', icon: 'lock', onClick: () => { for (const x of ed.selected()) x.locked = true; ed.select(null); ed.commit('Lock') } },
      'sep',
      { label: many ? `Delete ${ed.selSet.size} items` : 'Delete', icon: 'trash', danger: true, kbd: 'Del', onClick: () => ed.deleteSel() },
    ])
  }

  // ---------- images & signatures ----------
  // Image previews: the source is decoded once to a (≤1000px) RGBA buffer per
  // srcKey; the fx pipeline runs on that and is cached per look, so dragging a
  // slider re-processes a small buffer only, and the export runs the identical
  // pipeline at full resolution.
  const PREVIEW_MAX = 1000
  const srcs = new WeakMap() // srcKey → {rgba,w,h} | null (pending)
  const looks = new WeakMap() // srcKey → Map(lookKey → result)
  const decodeSrc = async (a) => {
    let cv
    if (a.rgba) {
      cv = document.createElement('canvas')
      cv.width = a.iw
      cv.height = a.ih
      cv.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(a.rgba), a.iw, a.ih), 0, 0)
    } else cv = await createImageBitmap(new Blob([a.jpeg], { type: 'image/jpeg' }))
    const k = Math.min(1, PREVIEW_MAX / Math.max(a.iw, a.ih))
    const c = document.createElement('canvas')
    c.width = Math.max(1, Math.round(a.iw * k))
    c.height = Math.max(1, Math.round(a.ih * k))
    const x = c.getContext('2d')
    x.drawImage(cv, 0, 0, c.width, c.height)
    cv.close?.()
    return { rgba: x.getImageData(0, 0, c.width, c.height).data, w: c.width, h: c.height, canvas: c }
  }
  const toCanvas = (r) => {
    const c = document.createElement('canvas')
    c.width = r.w
    c.height = r.h
    c.getContext('2d').putImageData(new ImageData(r.rgba, r.w, r.h), 0, 0)
    return c
  }
  const lookKey = (a, full) => JSON.stringify([a.fx ?? null, full ? null : a.crop ?? null, !!a.flipH, !!a.flipV, full])
  ed.bitmap = (a, { full = false } = {}) => {
    if (a.t !== 'image') return null
    const key = a.srcKey ?? (a.srcKey = {})
    const src = srcs.get(key)
    if (src === undefined) {
      srcs.set(key, null)
      decodeSrc(a).then((s) => {
        srcs.set(key, s)
        for (const v of ed.views) if (v.page.annots.some((x) => x.srcKey === key)) v.redraw()
        if (ed.sel?.a.srcKey === key) ed.refreshProps() // preset thumbnails need the pixels
      }).catch(() => {})
      return null
    }
    if (!src) return null
    const fx = full ? { ...(a.fx ?? {}), shadow: null } : a.fx ?? {}
    const geo = { crop: full ? null : a.crop, srcW: a.iw, flipH: a.flipH, flipV: a.flipV }
    if (fxIsIdentity(fx, geo)) return { src: src.canvas, ox: 0, oy: 0, innerW: src.w, innerH: src.h }
    let m = looks.get(key)
    if (!m) looks.set(key, (m = new Map()))
    const lk = lookKey(a, full)
    let r = m.get(lk)
    if (!r) {
      const out = processImage(src, geo, fx)
      r = { src: toCanvas(out), ox: out.ox, oy: out.oy, innerW: out.innerW, innerH: out.innerH }
      if (m.size > 6) m.delete(m.keys().next().value) // a slider drag makes many looks: keep a few
      m.set(lk, r)
    }
    return r
  }
  ed.imageSrc = (a) => (a.srcKey && srcs.get(a.srcKey)) || null
  /** Full-resolution processed pixels of an image object (export / save). */
  ed.imageFull = async (a) => {
    const cv = a.rgba ? null : await createImageBitmap(new Blob([a.jpeg], { type: 'image/jpeg' }))
    let rgba = a.rgba ? new Uint8ClampedArray(a.rgba) : null
    if (cv) {
      const c = document.createElement('canvas')
      c.width = a.iw
      c.height = a.ih
      const x = c.getContext('2d')
      x.drawImage(cv, 0, 0)
      cv.close?.()
      rgba = x.getImageData(0, 0, a.iw, a.ih).data
    }
    return processImage({ rgba, w: a.iw, h: a.ih }, { crop: a.crop, srcW: a.iw, flipH: a.flipH, flipV: a.flipV }, a.fx ?? {})
  }
  ed.saveImage = async (a) => {
    const r = await ed.imageFull(a)
    const blob = await new Promise((res) => toCanvas(r).toBlob(res, 'image/png'))
    saveBlob(blob, `${ed.fileName || 'image'}-image.png`)
  }

  // ---------- image crop mode ----------
  ed.startCrop = (page, a) => {
    if (a.t !== 'image' || a.locked) return
    if (a.rot) { ed.hint('Straighten the image (rotation 0°) to crop it'); return }
    ed.select(page, a)
    ed.cropping = { page, a, before: annClone(a) }
    ed.cropAspect = null
    ed.viewOf(page)?.redraw()
    ed.refreshProps()
    ed.hint('Drag the edges to crop · Enter to apply · Esc to cancel')
  }
  ed.finishCrop = (apply = true) => {
    const c = ed.cropping
    if (!c) return
    ed.cropping = null
    if (!apply) Object.assign(c.a, c.before)
    else {
      const cr = c.a.crop
      if (cr && cr.x <= 0.5 && cr.y <= 0.5 && cr.w >= c.a.iw - 0.5 && cr.h >= c.a.ih - 0.5) delete c.a.crop
      if (JSON.stringify(c.a.crop ?? null) !== JSON.stringify(c.before.crop ?? null)) ed.commit('Crop')
    }
    ed.viewOf(c.page)?.redraw()
    ed.refreshProps()
  }

  // ---------- images already inside the PDF ----------
  ed.selectPdfImage = (page, op, box) => {
    ed.select(null)
    ed.pdfImg = { page, op, box }
    if (tabletMQ.matches) els.props?.classList.add('open')
    ed.viewOf(page)?.redraw()
    ed.refreshProps()
  }
  /** Rasterise a PDF image op exactly as it appears (orientation, mirror) into RGBA. */
  const pdfImagePixels = async (page, op, box) => {
    const src = await imageSource(ed.doc, op, ed.imgCache)
    if (!src) throw new Error('This image format can’t be edited in the browser')
    const sw = src.width, sh = src.height
    const k = Math.min(2400 / Math.max(sw, sh), Math.max(sw / box.w, sh / box.h, 1)) // keep the native resolution
    const W = Math.max(1, Math.round(box.w * k)), H = Math.max(1, Math.round(box.h * k))
    const c = document.createElement('canvas')
    c.width = W
    c.height = H
    const x = c.getContext('2d')
    const m = op.m
    x.setTransform(k * m[0], k * m[1], k * m[2], k * m[3], k * (m[4] - box.x), k * (m[5] - box.y))
    x.transform(1, 0, 0, -1, 0, 1)
    x.imageSmoothingQuality = 'high'
    x.globalAlpha = op.a ?? 1
    x.drawImage(src, 0, 0, 1, 1)
    return { rgba: x.getImageData(0, 0, W, H).data, iw: W, ih: H }
  }
  ed.editPdfImage = async () => {
    const pi = ed.pdfImg
    if (!pi) return null
    try {
      const px = await pdfImagePixels(pi.page, pi.op, pi.box)
      pi.page.annots.push({ id: uid(), t: 'imgremove', region: { ...pi.box } })
      ed.pdfImg = null
      const a = { id: uid(), t: 'image', ...pi.box, ...px, srcKey: {}, alpha: 1 }
      pi.page.annots.push(a)
      ed.viewOf(pi.page)?.render()
      ed.select(pi.page, a)
      ed.commit('Edit image')
      return a
    } catch (e) { toast(friendly(e), { type: 'error' }); return null }
  }
  ed.deletePdfImage = () => {
    const pi = ed.pdfImg
    if (!pi) return
    pi.page.annots.push({ id: uid(), t: 'imgremove', region: { ...pi.box } })
    ed.pdfImg = null
    ed.viewOf(pi.page)?.render()
    ed.refreshProps()
    ed.commit('Delete image')
    toast('Image removed — it’s taken out of the file when you download', { type: 'info' })
  }
  ed.savePdfImage = async () => {
    const pi = ed.pdfImg
    if (!pi) return
    try {
      const px = await pdfImagePixels(pi.page, pi.op, pi.box)
      const blob = await new Promise((res) => toCanvas({ rgba: px.rgba, w: px.iw, h: px.ih }).toBlob(res, 'image/png'))
      saveBlob(blob, `${ed.fileName || 'page'}-image.png`)
    } catch (e) { toast(friendly(e), { type: 'error' }) }
  }
  const placeOnPage = (img, opts = {}) => {
    const p = ed.current ?? ed.pages[0]
    let w = opts.w ?? Math.min(p.w * 0.4, img.iw * 0.75)
    let hh = (w * img.ih) / img.iw
    if (hh > p.h * 0.6) { hh = p.h * 0.6; w = (hh * img.iw) / img.ih }
    const v = ed.viewOf(p)
    const sr = els.scroll.getBoundingClientRect(), pr = v.el.getBoundingClientRect()
    const cy = Math.min(p.h - hh / 2, Math.max(hh / 2, ((sr.top + sr.height / 2 - pr.top) / pr.height) * p.h))
    const a = { t: 'image', x: opts.x ?? (p.w - w) / 2, y: opts.y ?? cy - hh / 2, w, h: hh, ...img, alpha: 1 }
    if (ed.tool !== 'select') ed.setTool('select')
    ed.add(p, a)
    return a
  }
  ed.insertImage = async () => {
    const [f] = await pickFiles({ accept: 'image/png,image/jpeg,image/webp,image/gif,image/bmp' })
    if (!f) return
    try {
      const bmp = await createImageBitmap(f)
      const k = Math.min(1, 2400 / Math.max(bmp.width, bmp.height))
      const c = document.createElement('canvas')
      c.width = Math.round(bmp.width * k)
      c.height = Math.round(bmp.height * k)
      const x = c.getContext('2d')
      x.drawImage(bmp, 0, 0, c.width, c.height)
      bmp.close?.()
      let img
      if (/jpe?g/i.test(f.type)) {
        const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.9))
        img = { jpeg: new Uint8Array(await blob.arrayBuffer()), iw: c.width, ih: c.height }
      } else img = { rgba: x.getImageData(0, 0, c.width, c.height).data, iw: c.width, ih: c.height }
      img.srcKey = {}
      placeOnPage(img)
    } catch { toast('Couldn’t read that image', { type: 'error' }) }
  }
  ed.newSignature = async () => {
    const sig = await signatureDialog()
    if (sig) { await ed.placeSignature(sig); ed.refreshProps() }
  }
  ed.placeSignature = async (sigOrUrl, box = null) => {
    const sig = typeof sigOrUrl === 'string' ? await sigFromUrl(sigOrUrl) : sigOrUrl
    const img = { rgba: sig.rgba, iw: sig.iw, ih: sig.ih, srcKey: {} }
    if (box) {
      const k = Math.min(box.w / img.iw, box.h / img.ih)
      const w = img.iw * k, hh = img.ih * k
      return placeOnPage(img, { x: box.x + (box.w - w) / 2, y: box.y + (box.h - hh) / 2, w })
    }
    return placeOnPage(img, { w: Math.min(ed.current.w * 0.32, 200) })
  }
  ed.signField = async (page, rect) => {
    ed.setCurrentPage(page)
    const sig = await signatureDialog()
    if (sig) ed.placeSignature(sig, rect)
  }

  ed.setField = (name, value) => { ed.values[name] = value; ed.dirty = true }

  // ---------- search & redact ----------
  ed.searchAll = async (query, opts) => {
    const out = []
    for (const p of ed.pages) {
      if (p.src === null) continue
      const hits = await findText(ed.doc, ed.info.leaves[p.src], query, opts).catch(() => [])
      const W0 = p.rot % 180 ? p.h : p.w, H0 = p.rot % 180 ? p.w : p.h
      for (const r of hits) {
        const [x1, y1] = rotPt(r.x, r.y, p.rot, W0, H0), [x2, y2] = rotPt(r.x + r.w, r.y + r.h, p.rot, W0, H0)
        out.push({ page: p, x: Math.min(x1, x2), y: Math.min(y1, y2), w: Math.abs(x2 - x1), h: Math.abs(y2 - y1), text: r.text })
      }
    }
    return out
  }
  ed.flashHit = (m) => {
    ed.scrollToPage(m.page)
    const a = { t: 'rect', x: m.x - 2, y: m.y - 2, w: m.w + 4, h: m.h + 4, stroke: '#e03131', lw: 2, id: 'flash' }
    m.page.annots.push(a)
    ed.viewOf(m.page)?.redraw()
    setTimeout(() => { m.page.annots = m.page.annots.filter((x) => x !== a); ed.viewOf(m.page)?.redraw() }, 1300)
  }
  ed.redactHits = (hits) => {
    for (const m of hits) m.page.annots.push({ id: uid(), t: 'redact', x: m.x, y: m.y, w: m.w, h: m.h, fill: ed.style.redactColor })
    ed.redrawAll()
    ed.commit('Redact')
    toast(`${hits.length} area${hits.length === 1 ? '' : 's'} marked — permanently removed when you download`)
  }

  // ---------- pages ----------
  ed.rotatePage = (p) => {
    const W = p.w, H = p.h
    for (const a of p.annots) annRotate90(a, W, H)
    p.rot = (p.rot + 90) % 360
    p.w = H
    p.h = W
    const v = ed.viewOf(p)
    v.invalidateRuns()
    v.layout()
    v.render()
    buildThumbs()
    ed.commit('Rotate page')
  }
  ed.deletePage = async (p) => {
    if (ed.pages.length < 2) return
    if (p.annots.length && !(await confirmDialog('Delete this page?', 'It has edits on it. You can undo this.', { ok: 'Delete page', danger: true }))) return
    ed.pages = ed.pages.filter((x) => x !== p)
    if (ed.sel?.page === p) ed.sel = null
    rebuildViews()
    ed.commit('Delete page')
  }
  ed.duplicatePage = (p) => {
    const c = { ...p, id: uid(), annots: p.annots.filter((a) => a.t !== 'textedit').map((a) => ({ ...annClone(a), id: uid() })) }
    ed.pages.splice(ed.pages.indexOf(p) + 1, 0, c)
    rebuildViews()
    ed.commit('Duplicate page')
  }
  ed.insertBlank = (after) => {
    const p = { id: uid(), src: null, rot: 0, w: after?.w ?? 612, h: after?.h ?? 792, annots: [] }
    ed.pages.splice(after ? ed.pages.indexOf(after) + 1 : ed.pages.length, 0, p)
    rebuildViews()
    ed.scrollToPage(p)
    ed.commit('Blank page')
  }

  // ---------- zoom ----------
  ed.setZoom = (z, { cx, cy, live = false, commit = false, auto = false } = {}) => {
    if (!auto) ed.userZoomed = true
    const nz = Math.max(0.2, Math.min(5, z))
    const sc = els.scroll
    const r = sc.getBoundingClientRect()
    const px = (cx ?? r.left + r.width / 2) - r.left, py = (cy ?? r.top + r.height / 2) - r.top
    const ax = px + sc.scrollLeft, ay = py + sc.scrollTop
    const k = nz / ed.zoom
    ed.zoom = nz
    if (ed.editing) ed.closeEditor(true)
    for (const v of ed.views) v.layout()
    sc.scrollLeft = ax * k - px
    sc.scrollTop = ay * k - py
    els.zoomLbl.textContent = `${Math.round(nz * 100)}%`
    if (!live || commit) {
      clearTimeout(ed._rz)
      ed._rz = setTimeout(() => { for (const v of ed.views) if (v.near) v.render() }, 40)
    }
  }
  ed.fit = (mode, { max = 5, auto = false } = {}) => {
    const sc = els.scroll
    if (!sc.clientWidth) return
    if (!auto) ed.userZoomed = true
    const maxW = Math.max(...ed.pages.map((p) => p.w))
    const cur = ed.current ?? ed.pages[0]
    const z = mode === 'page' ? Math.min((sc.clientWidth - 48) / cur.w, (sc.clientHeight - 60) / cur.h) : (sc.clientWidth - 48) / maxW
    ed.setZoom(Math.min(max, z), { commit: true, auto })
    if (mode === 'page') ed.scrollToPage(cur)
  }

  // ---------- history ----------
  function snapshot() {
    return { pages: ed.pages.map((p) => ({ ...p, annots: p.annots.map((a) => annClone(a)) })), values: { ...ed.values } }
  }
  ed.commit = () => {
    if (last) { ed.history.push(last); if (ed.history.length > 80) ed.history.shift() }
    last = snapshot()
    ed.future = []
    ed.dirty = true
    updateChrome()
  }
  const restore = (s) => {
    const structural = s.pages.length !== ed.pages.length || s.pages.some((p, i) => p.id !== ed.pages[i].id || p.rot !== ed.pages[i].rot)
    const prevById = new Map(ed.pages.map((p) => [p.id, p]))
    ed.pages = s.pages.map((sp) => {
      const live = prevById.get(sp.id)
      if (live && live.rot === sp.rot) { live.annots = sp.annots.map((a) => annClone(a)); return live }
      return { ...sp, annots: sp.annots.map((a) => annClone(a)) }
    })
    ed.values = { ...s.values }
    ed.sel = null
    ed.selSet.clear()
    ed.pdfImg = null
    ed.cropping = null
    if (structural) rebuildViews()
    for (const v of ed.views) { v.invalidateRuns(); if (v.near || v.rendered) v.render(); v.layoutFields() }
    ed.refreshProps()
    updateChrome()
  }
  ed.undo = () => {
    ed.closeEditor(true)
    if (ed.cropping) { ed.finishCrop(false); return }
    if (!ed.history.length) return
    ed.future.push(last)
    last = ed.history.pop()
    restore(last)
  }
  ed.redo = () => {
    if (!ed.future.length) return
    ed.history.push(last)
    last = ed.future.pop()
    restore(last)
  }
  function updateChrome() {
    if (!els.undo) return
    els.undo.disabled = !ed.history.length
    els.redo.disabled = !ed.future.length
  }

  // ---------- clipboard ----------
  const copySel = () => {
    const list = ed.selected().filter((a) => a.t !== 'textedit')
    if (list.length) { ed.clipboard = list.map((a) => annClone(a)); toast(list.length > 1 ? `Copied ${list.length} items` : 'Copied', { type: 'info', timeout: 1200 }) }
  }
  const paste = () => {
    if (!ed.clipboard?.length) return
    const p = ed.current
    const copies = ed.clipboard.map((a) => { const c = annClone(a); move(c, 14, 14); c.id = uid(); c.locked = false; p.annots.push(c); return c })
    ed.clipboard = copies.map((c) => annClone(c))
    if (ed.tool !== 'select') ed.setTool('select')
    ed.selectMany(p, copies)
    ed.commit('Paste')
  }

  // ---------- export ----------
  const pickPages = (pages, range) => {
    const n = ed.pages.length
    if (pages === 'current') return [Math.max(0, ed.pages.indexOf(ed.current))]
    if (pages === 'range') {
