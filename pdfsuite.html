      for (const m of body.matchAll(/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*(\[[^\]]*\]|<([0-9A-Fa-f]+)>)/g)) {
        codeLen = Math.max(codeLen, m[1].length / 2)
        const lo = hex(m[1]), hi = Math.min(hex(m[2]), lo + 65535)
        if (m[4] !== undefined) {
          // increment the LAST code unit of the destination
          const base = m[4]
          const head = base.slice(0, -4), tail = hex(base.slice(-4) || '0')
          for (let c = lo; c <= hi; c++) map.set(c, uni(head + (tail + c - lo).toString(16).padStart(4, '0')))
        } else for (const [k, dm] of [...m[3].matchAll(/<([0-9A-Fa-f]+)>/g)].entries()) map.set(lo + k, uni(dm[1]))
      }
    }
  }
  return { map, codeLen }
}

const FONT_CACHE = new WeakMap() // font dict → parsed info (fonts repeat on every page)

/** Resolve a page's /Resources /Font → Map<name, fontInfo>. */
async function fontMap(doc, leaf) {
  const res = deref(doc, get(leaf.dict, 'Resources') ?? leaf.inh.Resources)
  return fontMapFromRes(doc, res)
}

/** Font name → info {widths, firstChar, wRanges, dw, codeLen, tounicode, enc, base, bold, italic, serif, mono, fm}. */
async function fontMapFromRes(doc, res) {
  let fonts = res instanceof Map ? get(res, 'Font') : null
  fonts = deref(doc, fonts)
  const out = new Map()
  if (!(fonts instanceof Map)) return out
  for (const [fname, fref] of fonts) {
    let fd = deref(doc, fref)
    if (isStream(fd)) fd = fd.dict
    if (!(fd instanceof Map)) continue
    const hit = FONT_CACHE.get(fd)
    if (hit) { out.set(fname, hit); continue }
    const info = await parseFont(doc, fd)
    FONT_CACHE.set(fd, info)
    out.set(fname, info)
  }
  return out
}

async function parseFont(doc, fd) {
  const info = { widths: null, firstChar: 0, wRanges: null, tounicode: null, codeLen: null, dw: null, fm: 0.001 }
  const sub = get(fd, 'Subtype')?.v
  const isCid = sub === 'Type0' || get(fd, 'DescendantFonts') !== undefined
  if (isCid) info.codeLen = 2
  let cidFd = fd
  const desc = deref(doc, get(fd, 'DescendantFonts'))
  if (Array.isArray(desc) && desc.length) {
    let d0 = deref(doc, desc[0])
    if (isStream(d0)) d0 = d0.dict
    if (d0 instanceof Map) cidFd = d0
  }
  info.dw = deref(doc, get(cidFd, 'DW')) ?? null
  const w = deref(doc, get(fd, 'Widths'))
  if (Array.isArray(w)) info.widths = w.map((x) => deref(doc, x))
  info.firstChar = deref(doc, get(fd, 'FirstChar')) ?? 0
  if (sub === 'Type3') { // glyph space → text space via FontMatrix
    const fmx = deref(doc, get(fd, 'FontMatrix'))
    if (Array.isArray(fmx)) info.fm = Number(fmx[0]) || 0.001
  }
  const wArr = deref(doc, get(cidFd, 'W') ?? get(fd, 'W'))
  if (Array.isArray(wArr)) {
    info.wRanges = new Map()
    for (let i = 0; i < wArr.length;) {
      const a = deref(doc, wArr[i]), b = deref(doc, wArr[i + 1])
      if (typeof a === 'number' && Array.isArray(b)) {
        b.forEach((ww, k) => info.wRanges.set(a + k, deref(doc, ww)))
        i += 2
      } else if (typeof a === 'number' && typeof b === 'number' && typeof deref(doc, wArr[i + 2]) === 'number') {
        const ww = deref(doc, wArr[i + 2])
        for (let c = a; c <= b && c - a < 65536; c++) info.wRanges.set(c, ww)
        i += 3
      } else i++
    }
  }
  // style hints for the renderer
  let base = get(fd, 'BaseFont')
  base = isName(base) ? base.v.replace(/^[A-Z]{6}\+/, '') : ''
  let fdesc = deref(doc, get(cidFd, 'FontDescriptor') ?? get(fd, 'FontDescriptor'))
  const flags = fdesc instanceof Map ? deref(doc, get(fdesc, 'Flags')) ?? 0 : 0
  const lname = base.toLowerCase()
  info.base = base
  info.bold = /bold|black|heavy|semibold|demi|,b\b|-b\b|cmbx|ssbx/.test(lname) || (fdesc instanceof Map && (deref(doc, get(fdesc, 'FontWeight')) ?? 400) >= 600) || !!(flags & 262144)
  info.italic = /italic|oblique|ital\b|-it\b|,i\b|cmti|cmsl|cmmi|ssi\d|-obl/.test(lname) || !!(flags & 64)
  info.mono = /courier|mono|consol|menlo|cmtt|typewriter|code/.test(lname) || !!(flags & 1)
  const SANS = /sans|arial|helvetica|cmss|verdana|tahoma|calibri|segoe|frutiger|futura|gill|myriad|roboto|open ?sans|lato|inter|ubuntu|gothic|nimbussan|liberationsans|dejavusans|notosans|source ?sans|franklin|avenir|trebuchet|lucida ?grande|yahei|meiryo/
  const SERIF = /times|serif|roman|roma\b|georgia|garamond|cmr\d|cmti|cmbx|cmsl|cmmi|cmsy|eur[a-z]*\d|lmroman|minion|palatino|palladio|pazo|book|cambria|constantia|nimbusrom|schoolbook|century|libertine|charter|utopia|baskerville|caslon|sabon|bembo|didot|bodoni|pagella|termes|bonum|schola|merriweather|lora|mincho|songti|simsun/
  info.serif = !info.mono && !SANS.test(lname) && (SERIF.test(lname) || !!(flags & 2))
  info.symbol = /symbol|dingbat|wingding/.test(lname)
  info.type3 = sub === 'Type3'
  if (!isCid) {
    const encv = deref(doc, get(fd, 'Encoding'))
    info.enc = simpleEncodingTable(encv, { symbolic: !!(flags & 4) && !encv })
  }
  const tu = deref(doc, get(fd, 'ToUnicode'))
  if (isStream(tu)) {
    const d = await streamData(tu).catch(() => null)
    if (d) {
      info.tounicode = parseToUnicode(d)
      if (isCid) info.tounicode.codeLen = 2 // Identity-H/V codes are always 2 bytes
    }
  }
  return info
}

/** Decode a PDF string operand using a font entry. */
function decodeString(bytes, font) {
  if (font?.tounicode) {
    const { map, codeLen } = font.tounicode
    let out = ''
    for (let i = 0; i + codeLen <= bytes.length; i += codeLen) {
      let code = 0
      for (let k = 0; k < codeLen; k++) code = code * 256 + bytes[i + k]
      out += map.get(code) ?? (codeLen === 1 && font.enc ? font.enc[code] : '')
    }
    return out
  }
  if (font?.enc) {
    let out = ''
    for (let i = 0; i < bytes.length; i++) out += font.enc[bytes[i]]
    return out
  }
  const cl = font?.codeLen ?? 1
  if (cl > 1) {
    let out = ''
    for (let i = 0; i + cl <= bytes.length; i += cl) {
      let code = 0
      for (let k = 0; k < cl; k++) code = code * 256 + bytes[i + k]
      out += code < 0x110000 ? String.fromCodePoint(code) : ''
    }
    return out
  }
  return dec(bytes)
}

/** Fraction of decoded chars that are non-printable — flags garbage text. */
const garbageRatio = (s) => {
  if (!s.length) return 1
  let bad = 0
  for (const ch of s) {
    const c = ch.codePointAt(0)
    if ((c < 0x20 && ch !== ' ' && ch !== '\t') || (c >= 0x7f && c <= 0x9f) || (c >= 0xe000 && c <= 0xf8ff)) bad++
  }
  return bad / s.length
}

// ---------- geometry ----------

const matMul = (a, b) => [
  a[0] * b[0] + a[2] * b[1], a[1] * b[0] + a[3] * b[1],
  a[0] * b[2] + a[2] * b[3], a[1] * b[2] + a[3] * b[3],
  a[0] * b[4] + a[2] * b[5] + a[4], a[1] * b[4] + a[3] * b[5] + a[5],
]
const matPt = (m, x, y) => [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]]

/** user→display transform (top-left origin, /Rotate applied clockwise). */
function displayTransform(mb, rot) {
  const [x0, y0, x1, y1] = mb
  if (rot === 90) return [0, 1, 1, 0, -y0, -x0]
  if (rot === 180) return [-1, 0, 0, 1, x1, -y0]
  if (rot === 270) return [0, -1, -1, 0, y1, x1]
  return [1, 0, 0, -1, -x0, y1]
}

/** Effective page box: CropBox ∩ MediaBox (what viewers show). */
function pageBox(doc, leaf) {
  const num = (a) => (Array.isArray(a) && a.length === 4 ? a.map((v) => Number(deref(doc, v))) : null)
  const mb = num(deref(doc, get(leaf.dict, 'MediaBox') ?? leaf.inh.MediaBox)) ?? [0, 0, 612, 792]
  const norm = (b) => [Math.min(b[0], b[2]), Math.min(b[1], b[3]), Math.max(b[0], b[2]), Math.max(b[1], b[3])]
  let box = norm(mb)
  const cb = num(deref(doc, get(leaf.dict, 'CropBox') ?? leaf.inh.CropBox))
  if (cb) {
    const c = norm(cb)
    const ix = [Math.max(box[0], c[0]), Math.max(box[1], c[1]), Math.min(box[2], c[2]), Math.min(box[3], c[3])]
    if (ix[2] - ix[0] > 1 && ix[3] - ix[1] > 1) box = ix
  }
  return box
}

function pageRotation(doc, leaf) {
  const r = deref(doc, get(leaf.dict, 'Rotate') ?? leaf.inh.Rotate ?? 0)
  return typeof r === 'number' ? ((Math.round(r / 90) * 90) % 360 + 360) % 360 : 0
}

// ---------- the walker ----------

/**
 * Interpret a page into display-space draw ops.
 * Returns {ops, box:{w,h}, rot, mb, disp}. ops:
 *   text  {x,y,w,h,rot,str,size,fc,sc,a,sa,mode,inv,font,m,glyphs?,src?}
 *         m = display matrix of the run origin (text space → display, size baked in)
 *         glyphs = [{x (text-space advance from origin, in em*size units), w, s}]
 *   img   {x,y,w,h,rot,mirror,m,ref|inline,a,fill,key}
 *   rect/path {segs|x,y,w,h, fill,stroke,fc,sc,a,sa,lw,dash,doff,eo,cap,join,blend}
 *   shade {kind:'axial'|'radial', coords (display), stops:[[t,[r,g,b]]], extend, a} (fills current clip)
 *   clip / unclip
 * opts.glyphs: per-glyph geometry + source op references (redaction / editing).
 * opts.annots: also paint annotation appearance streams (default true).
 */
async function collectDrawOps(doc, leaf, { glyphs = false, annots = true, widgets = true } = {}) {
  const box4 = pageBox(doc, leaf)
  const rot = pageRotation(doc, leaf)
  const w = box4[2] - box4[0], hgt = box4[3] - box4[1]
  const box = { w: rot % 180 === 0 ? w : hgt, h: rot % 180 === 0 ? hgt : w }
  const res = deref(doc, get(leaf.dict, 'Resources') ?? leaf.inh.Resources)
  const disp = displayTransform(box4, rot)
  const st = newState(disp)
  st.glyphs = glyphs
  st.ops = []
  st.csCache = new Map()
  const data = await contentBytes(doc, leaf)
  if (data) {
    st.srcTokens = glyphs ? tokenizeContent(data) : null
    await walk(doc, st, data, res, await fontMapFromRes(doc, res), st.srcTokens, [])
  }
  if (annots) await paintAnnotations(doc, leaf, st, res, widgets)
  return { ops: st.ops, box, rot, mb: box4, disp, data, tokens: st.srcTokens }
}

function newState(disp) {
  return {
    ops: [], disp,
    ctm: [1, 0, 0, 1, 0, 0], gstack: [],
    tm: [1, 0, 0, 1, 0, 0], tlm: [1, 0, 0, 1, 0, 0],
    leading: 0, fontSize: 0, curFont: null, tc: 0, tw: 0, tz: 1, tr: 0, rise: 0,
    path: [], cur: null,
    fillC: [0, 0, 0], strokeC: [0, 0, 0], fillA: 1, strokeA: 1, blend: null,
    fillCS: null, strokeCS: null, fillPat: null, strokePat: null,
    lw: 1, cap: 0, join: 0, dash: null, dashPhase: 0, clipLevels: [], depth: 0,
  }
}

const GSTATE_KEYS = ['ctm', 'tm', 'tlm', 'fillC', 'strokeC', 'fillA', 'strokeA', 'blend', 'fillCS', 'strokeCS', 'fillPat', 'strokePat',
  'lw', 'cap', 'join', 'dash', 'dashPhase', 'curFont', 'fontSize', 'tc', 'tw', 'tz', 'tr', 'leading', 'rise']
const snap = (st) => Object.fromEntries(GSTATE_KEYS.map((k) => [k, st[k]]))

const BLEND = { Multiply: 'multiply', Screen: 'screen', Overlay: 'overlay', Darken: 'darken', Lighten: 'lighten', ColorDodge: 'color-dodge', ColorBurn: 'color-burn', HardLight: 'hard-light', SoftLight: 'soft-light', Difference: 'difference', Exclusion: 'exclusion', Hue: 'hue', Saturation: 'saturation', Color: 'color', Luminosity: 'luminosity' }

async function walk(doc, st, data, res, fonts, tokens, xpath) {
  const { ops } = st
  const disp = st.disp
  const dm = () => matMul(disp, st.ctm) // user → display
  const xf = (x, y) => matPt(disp, ...matPt(st.ctm, x, y))
  const avgScale = () => { const m = dm(); return Math.sqrt(Math.abs(m[0] * m[3] - m[1] * m[2])) || 1 }
  const resSec = (k) => { const v = res instanceof Map ? deref(doc, get(res, k)) : null; return v instanceof Map ? v : null }
  const fontOf = () => (st.curFont && fonts.get(st.curFont)) || null
  const toks = tokens ?? tokenizeContent(data)

  const csFor = async (nm) => {
    const key = `${xpath.join('/')}|${nm}`
    if (st.csCache.has(key)) return st.csCache.get(key)
    const cs = await resolveColorSpace(doc, { k: 'n', v: nm }, res).catch(() => null)
    st.csCache.set(key, cs)
    return cs
  }
  const colorOf = (cs, comps) => {
    if (!cs) return comps.length === 1 ? [comps[0], comps[0], comps[0]] : comps.length === 4 ? cmyk(comps) : comps.length >= 3 ? comps.slice(0, 3) : null
    try { return cs.toRGB(comps).map((v) => Math.min(1, Math.max(0, v))) } catch { return null }
  }

  const glyphWidth = (font, code) => {
    if (!font) return 0.5
    const wv = font.wRanges?.get(code) ?? font.widths?.[code - font.firstChar]
    if (typeof wv === 'number') return wv * (font.fm ?? 0.001)
    return (font.dw ?? (font.codeLen ? 1000 : 500)) * 0.001
  }

  /** Show one string; part = index within a TJ array (for source mapping). */
  const showText = (bytes, opIdx, part) => {
    const font = fontOf()
    const cl = font?.tounicode?.codeLen ?? font?.codeLen ?? 1
    const fs = st.fontSize, th = st.tz
    const trm = matMul(dm(), matMul(st.tm, [1, 0, 0, 1, 0, st.rise])) // text space → display
    const gl = []
    const gx = [] // per-glyph advance offsets — exact placement with substitute fonts
    let adv = 0
    let str = ''
    for (let i = 0; i + cl <= bytes.length; i += cl) {
      let code = 0
      for (let k = 0; k < cl; k++) code = code * 256 + bytes[i + k]
      const ch = decodeString(bytes.subarray(i, i + cl), font)
      const w0 = glyphWidth(font, code)
      const isSpace = cl === 1 && code === 32
      const a = (w0 * fs + st.tc + (isSpace ? st.tw : 0)) * th
      if (st.glyphs) gl.push({ x: adv, w: w0 * fs * th, a, s: ch, b0: i, b1: i + cl })
      gx.push(adv, ch)
      str += ch
      adv += a
    }
    const [dx, dy] = matPt(trm, 0, 0)
    const [dx2, dy2] = matPt(trm, adv, 0)
    const [ux, uy] = matPt(trm, 0, fs)
    const hh = Math.hypot(ux - dx, uy - dy)
    const ang = Math.atan2(dy2 - dy, dx2 - dx)
    const mode = st.tr
    const op = {
      t: 'text', x: dx, y: dy, w: Math.hypot(dx2 - dx, dy2 - dy), h: hh, rot: ang,
      str: garbageRatio(str) >= 0.4 ? '' : str,
      size: hh, fs, th,
      fc: st.fillC, sc: st.strokeC, a: st.fillA, sa: st.strokeA, mode, inv: mode === 3 || mode === 7,
      font: font ? { base: font.base, bold: font.bold, italic: font.italic, serif: font.serif, mono: font.mono, symbol: font.symbol } : null,
      m: trm, blend: st.blend, gx, // gx = [adv0, ch0, adv1, ch1, …] in text space
    }
    if (st.glyphs) { op.glyphs = gl; op.src = { op: opIdx, part, xpath } }
    ops.push(op)
    st.tm = matMul(st.tm, [1, 0, 0, 1, adv, 0])
  }

  const xformSegs = (subs, closing) =>
    subs.flatMap((sub) => {
      const segs = sub.segs.map((seg) => {
        if (seg[0] === 'Z') return ['Z']
        const out = [seg[0]]
        for (let i = 1; i + 1 < seg.length; i += 2) out.push(...xf(seg[i], seg[i + 1]))
        return out
      })
      if (closing && segs.length && segs[segs.length - 1][0] !== 'Z') segs.push(['Z'])
      return segs
    })

  const strokeParams = () => ({
    lw: st.lw * avgScale(), dash: st.dash ? st.dash.map((d) => d * avgScale()) : null,
    doff: st.dash ? st.dashPhase * avgScale() : 0, cap: st.cap, join: st.join,
  })

  const paintPath = async (op) => {
    const fill = 'fFbB'.includes(op[0]) || op === 'f*' || op === 'b*' || op === 'B*'
    const stroke = op[0] === 'S' || op[0] === 's' || 'bB'.includes(op[0])
    const closing = 'sb'.includes(op[0])
    const eo = op.endsWith('*')
    // pattern fills: shading patterns → gradient clipped to the path
    const usePat = fill && !!st.fillPat
    if (usePat) {
      const shade = await patternShade(st.fillPat)
      if (shade) {
        ops.push({ t: 'clip', segs: xformSegs(st.path, true), eo })
        ops.push(shade)
        ops.push({ t: 'unclip' })
      }
    }
    const doFill = fill && !usePat
    if (!doFill && !stroke) { st.path.length = 0; st.cur = null; return }
    const common = {
      fill: doFill, stroke, eo, fc: st.fillC, sc: st.strokeC,
      a: st.fillA, sa: st.strokeA, blend: st.blend, ...strokeParams(),
    }
    const nonRect = []
    for (const sub of st.path) {
      if (sub.rect && Math.abs(dm()[1]) < 1e-6 && Math.abs(dm()[2]) < 1e-6) {
        const [rx, ry, rw, rh] = sub.rect
        const cs = [[rx, ry], [rx + rw, ry + rh]].map(([x, y]) => xf(x, y))
        ops.push({
          t: 'rect', x: Math.min(cs[0][0], cs[1][0]), y: Math.min(cs[0][1], cs[1][1]),
          w: Math.abs(cs[1][0] - cs[0][0]), h: Math.abs(cs[1][1] - cs[0][1]), ...common,
        })
      } else nonRect.push(sub)
    }
    if (nonRect.length) ops.push({ t: 'path', segs: xformSegs(nonRect, closing), ...common })
    st.path.length = 0
    st.cur = null
  }

  /** Shading dict → display-space gradient op (axial/radial), else a flat average fill. */
  const shadeOp = async (sh, extraMatrix = null) => {
    sh = deref(doc, sh)
    const sd = isStream(sh) ? sh.dict : sh
    if (!(sd instanceof Map)) return null
    const type = deref(doc, get(sd, 'ShadingType'))
    const cs = await resolveColorSpace(doc, get(sd, 'ColorSpace'), res).catch(() => null)
    const fn = await compileFunction(doc, get(sd, 'Function')).catch(() => null)
    const domain = deref(doc, get(sd, 'Domain')) ?? [0, 1]
    const coords = deref(doc, get(sd, 'Coords'))
    const ext = deref(doc, get(sd, 'Extend')) ?? [false, false]
    const m = extraMatrix ? matMul(disp, extraMatrix) : dm()
    if ((type === 2 || type === 3) && Array.isArray(coords) && fn && cs) {
      const stops = []
      for (let k = 0; k <= 16; k++) {
        const t = k / 16
        const v = domain[0] + t * (domain[1] - domain[0])
        const c = colorOf(cs, fn([v]))
        if (c) stops.push([t, c])
      }
      if (type === 2) {
        const [x0, y0] = matPt(m, coords[0], coords[1]), [x1, y1] = matPt(m, coords[2], coords[3])
        return { t: 'shade', kind: 'axial', coords: [x0, y0, x1, y1], stops, extend: ext, a: st.fillA, blend: st.blend }
      }
      const sc = Math.sqrt(Math.abs(m[0] * m[3] - m[1] * m[2])) || 1
      const [x0, y0] = matPt(m, coords[0], coords[1]), [x1, y1] = matPt(m, coords[3], coords[4])
      return { t: 'shade', kind: 'radial', coords: [x0, y0, coords[2] * sc, x1, y1, coords[5] * sc], stops, extend: ext, a: st.fillA, blend: st.blend }
    }
    // other shading types: flat colour from the middle of the function / background
    let c = null
    if (fn && cs) c = colorOf(cs, fn([(domain[0] + domain[1]) / 2]))
    const bg = deref(doc, get(sd, 'Background'))
    if (!c && Array.isArray(bg) && cs) c = colorOf(cs, bg)
    return c ? { t: 'shade', kind: 'flat', color: c, a: st.fillA, blend: st.blend } : null
  }

  const patternShade = async (pat) => {
    const pd = isStream(pat) ? pat.dict : pat
    if (!(pd instanceof Map)) return null
    const ptype = deref(doc, get(pd, 'PatternType'))
    const pm = deref(doc, get(pd, 'Matrix'))
    const mat = Array.isArray(pm) && pm.length === 6 ? pm.map(Number) : [1, 0, 0, 1, 0, 0]
    if (ptype === 2) return shadeOp(get(pd, 'Shading'), mat) // pattern space = default user space × Matrix
    // tiling pattern: approximate by a neutral tint of its paint colour
    return { t: 'shade', kind: 'flat', color: st.fillC ?? [0.75, 0.75, 0.75], a: st.fillA * 0.5, blend: st.blend }
  }

  const emitImage = async (ref, inlineIm, opIdx) => {
    const m = dm()
    const cs = [[0, 0], [1, 0], [1, 1], [0, 1]].map(([x, y]) => matPt(m, x, y))
    const e1 = [cs[2][0] - cs[3][0], cs[2][1] - cs[3][1]]
    const e2 = [cs[0][0] - cs[3][0], cs[0][1] - cs[3][1]]
    const xs = cs.map((c) => c[0]), ys = cs.map((c) => c[1])
    ops.push({
      t: 'img', x: cs[3][0], y: cs[3][1], w: Math.hypot(...e1), h: Math.hypot(...e2),
      rot: Math.atan2(e1[1], e1[0]), mirror: e1[0] * e2[1] - e1[1] * e2[0] < 0,
      m, bbox: [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)],
      ref, inline: inlineIm, res, a: st.fillA, fill: st.fillC, blend: st.blend,
      src: st.glyphs ? { op: opIdx, xpath } : undefined,
    })
  }

  const nums = (operands) => operands.filter((o) => typeof o === 'number')

  for (let oi = 0; oi < toks.length; oi++) {
    const { op, operands } = toks[oi]
    switch (op) {
      case 'q': st.gstack.push(snap(st)); break
      case 'Q': {
        const s = st.gstack.pop()
        if (s) Object.assign(st, s)
        while (st.clipLevels.length && st.clipLevels[st.clipLevels.length - 1] > st.gstack.length) {
          st.clipLevels.pop()
          ops.push({ t: 'unclip' })
        }
        break
      }
      case 'cm': if (operands.length >= 6) st.ctm = matMul(st.ctm, nums(operands).slice(0, 6)); break
      case 'BT': st.tm = [1, 0, 0, 1, 0, 0]; st.tlm = [...st.tm]; break
      case 'ET': break
      case 'Tf': {
        const nm = operands.find((o) => o?.t === 'name')
        const sz = operands.find((o) => typeof o === 'number')
        if (nm) st.curFont = nm.v
        if (sz !== undefined) st.fontSize = sz
        break
      }
      case 'Td': case 'TD': {
        const [tx, ty] = nums(operands)
        if (op === 'TD') st.leading = -(ty || 0)
        st.tlm = matMul(st.tlm, [1, 0, 0, 1, tx || 0, ty || 0])
        st.tm = [...st.tlm]
        break
      }
      case 'T*': st.tlm = matMul(st.tlm, [1, 0, 0, 1, 0, -st.leading]); st.tm = [...st.tlm]; break
      case 'TL': st.leading = nums(operands)[0] || 0; break
      case 'Tm': { const n6 = nums(operands); if (n6.length >= 6) { st.tm = n6.slice(0, 6); st.tlm = [...st.tm] } break }
      case 'Tc': st.tc = nums(operands)[0] || 0; break
      case 'Tw': st.tw = nums(operands)[0] || 0; break
      case 'Tz': st.tz = (nums(operands)[0] ?? 100) / 100; break
      case 'Tr': st.tr = nums(operands)[0] || 0; break
      case 'Ts': st.rise = nums(operands)[0] || 0; break
      case 'Tj': case "'": case '"': {
        if (op === '"') { const ns = nums(operands); if (ns.length >= 2) { st.tw = ns[0]; st.tc = ns[1] } }
        if (op === "'" || op === '"') { st.tlm = matMul(st.tlm, [1, 0, 0, 1, 0, -st.leading]); st.tm = [...st.tlm] }
        const s = [...operands].reverse().find((o) => o?.t === 'str')
        if (s) showText(s.bytes, oi, 0)
        break
      }
      case 'TJ': {
        const arr = operands.find((o) => o?.t === 'arr')
        if (!arr) break
        arr.items.forEach((it, k) => {
          if (it?.t === 'str') showText(it.bytes, oi, k)
          else if (typeof it === 'number') st.tm = matMul(st.tm, [1, 0, 0, 1, (-it / 1000) * st.fontSize * st.tz, 0])
        })
        break
      }
      // ---- paths ----
      case 'm': { const [x, y] = nums(operands); st.path.push({ segs: [['M', x || 0, y || 0]] }); st.cur = [x || 0, y || 0]; break }
      case 'l': {
        if (!st.path.length) break
        const [x, y] = nums(operands)
        st.path[st.path.length - 1].segs.push(['L', x || 0, y || 0]); st.cur = [x || 0, y || 0]
        break
      }
      case 'c': {
        const n6 = nums(operands)
        if (!st.path.length || n6.length < 6) break
        st.path[st.path.length - 1].segs.push(['C', ...n6.slice(0, 6)]); st.cur = [n6[4], n6[5]]
        break
      }
      case 'v': {
        const n4 = nums(operands)
        if (!st.path.length || !st.cur || n4.length < 4) break
        st.path[st.path.length - 1].segs.push(['C', st.cur[0], st.cur[1], ...n4.slice(0, 4)]); st.cur = [n4[2], n4[3]]
        break
      }
      case 'y': {
        const n4 = nums(operands)
        if (!st.path.length || n4.length < 4) break
        st.path[st.path.length - 1].segs.push(['C', n4[0], n4[1], n4[2], n4[3], n4[2], n4[3]]); st.cur = [n4[2], n4[3]]
        break
      }
      case 'h': if (st.path.length) st.path[st.path.length - 1].segs.push(['Z']); break
      case 're': {
        const n4 = nums(operands)
        if (n4.length < 4) break
        const [rx, ry, rw, rh] = n4
        st.path.push({ rect: [rx, ry, rw, rh], segs: [['M', rx, ry], ['L', rx + rw, ry], ['L', rx + rw, ry + rh], ['L', rx, ry + rh], ['Z']] })
        st.cur = [rx, ry]
        break
      }
      case 'f': case 'F': case 'f*': case 'S': case 's': case 'B': case 'b': case 'B*': case 'b*':
        if (st.pendingClip) {
          ops.push(st.pendingClip); st.clipLevels.push(st.gstack.length); st.pendingClip = null
        }
        await paintPath(op)
        break
      case 'W': case 'W*':
        if (st.path.length) st.pendingClip = { t: 'clip', segs: xformSegs(st.path, true), eo: op === 'W*' }
        break
      case 'n':
        if (st.pendingClip) { ops.push(st.pendingClip); st.clipLevels.push(st.gstack.length); st.pendingClip = null }
        st.path.length = 0; st.cur = null
        break
      // ---- colour ----
      case 'g': { const v = nums(operands)[0] ?? 0; st.fillC = [v, v, v]; st.fillCS = null; st.fillPat = null; break }
      case 'G': { const v = nums(operands)[0] ?? 0; st.strokeC = [v, v, v]; st.strokeCS = null; st.strokePat = null; break }
      case 'rg': { const n3 = nums(operands); if (n3.length >= 3) st.fillC = n3.slice(0, 3); st.fillCS = null; st.fillPat = null; break }
      case 'RG': { const n3 = nums(operands); if (n3.length >= 3) st.strokeC = n3.slice(0, 3); st.strokeCS = null; st.strokePat = null; break }
      case 'k': { const n4 = nums(operands); if (n4.length >= 4) st.fillC = cmyk(n4); st.fillCS = null; st.fillPat = null; break }
      case 'K': { const n4 = nums(operands); if (n4.length >= 4) st.strokeC = cmyk(n4); st.strokeCS = null; st.strokePat = null; break }
      case 'cs': case 'CS': {
        const nm = operands.find((o) => o?.t === 'name')?.v
        const cs = nm ? await csFor(nm) : null
        // spec: selecting a colour space resets the colour to its initial value (all-zero components)
        const init = cs && cs.n > 0 ? colorOf(cs, new Array(cs.n).fill(cs.name === 'Separation' || cs.name === 'DeviceN' ? 1 : 0)) : null
        if (op === 'cs') { st.fillCS = cs; st.fillPat = null; st.fillC = init ?? [0, 0, 0] }
        else { st.strokeCS = cs; st.strokePat = null; st.strokeC = init ?? [0, 0, 0] }
        break
      }
      case 'sc': case 'scn': case 'SC': case 'SCN': {
        const fillSide = op === 'sc' || op === 'scn'
        const cs = fillSide ? st.fillCS : st.strokeCS
        const pnm = operands.find((o) => o?.t === 'name')
        if (pnm && (cs?.pattern || !cs)) {
          const pats = resSec('Pattern')
          const pat = pats ? deref(doc, pats.get(pnm.v)) : null
          if (fillSide) st.fillPat = pat ?? null
          else st.strokePat = pat ?? null
          break
        }
        const c = colorOf(cs, nums(operands))
        if (c) { if (fillSide) { st.fillC = c; st.fillPat = null } else { st.strokeC = c; st.strokePat = null } }
        break
      }
      case 'sh': {
        const nm = operands.find((o) => o?.t === 'name')
        const shd = resSec('Shading')
        if (nm && shd) {
          const op2 = await shadeOp(shd.get(nm.v))
          if (op2) ops.push(op2)
        }
        break
      }
      // ---- graphics state ----
      case 'w': { const v = nums(operands)[0]; if (Number.isFinite(v)) st.lw = v; break }
      case 'J': st.cap = nums(operands)[0] || 0; break
      case 'j': st.join = nums(operands)[0] || 0; break
      case 'd': {
        const arr = operands.find((o) => o?.t === 'arr')
        st.dash = arr ? arr.items.filter((x) => typeof x === 'number' && x >= 0) : null
        if (st.dash && !st.dash.some((x) => x > 0)) st.dash = null
        st.dashPhase = nums(operands)[0] ?? 0
        break
      }
      case 'gs': {
        const nm = operands.find((o) => o?.t === 'name')
        const gd = resSec('ExtGState')
        const e = gd && nm ? deref(doc, gd.get(nm.v)) : null
        if (e instanceof Map) {
          const ca = deref(doc, get(e, 'ca')), CA = deref(doc, get(e, 'CA'))
          if (typeof ca === 'number') st.fillA = ca
          if (typeof CA === 'number') st.strokeA = CA
          const lw = deref(doc, get(e, 'LW')); if (typeof lw === 'number') st.lw = lw
          const lc = deref(doc, get(e, 'LC')); if (typeof lc === 'number') st.cap = lc
          const lj = deref(doc, get(e, 'LJ')); if (typeof lj === 'number') st.join = lj
          let bm = deref(doc, get(e, 'BM'))
          if (Array.isArray(bm)) bm = bm[0]
          if (bm?.k === 'n') st.blend = BLEND[bm.v] ?? null
          const font = deref(doc, get(e, 'Font'))
          if (Array.isArray(font) && typeof font[1] === 'number') st.fontSize = font[1]
        }
        break
      }
      case 'BI': {
        const fillC = st.fillC
        await emitImage(null, { dict: toks[oi].dict, data: toks[oi].data, fill: fillC }, oi)
        break
      }
      case 'Do': {
        const nm = [...operands].reverse().find((o) => o?.t === 'name')
        if (!nm) break
        const xo = resSec('XObject')
        const xv = xo ? deref(doc, xo.get(nm.v)) : null
        if (!isStream(xv)) break
        const sub = get(xv.dict, 'Subtype')?.v
        if (sub === 'Image') {
          await emitImage(xv, null, oi)
          const last = ops[ops.length - 1]
          const r = xo.get(nm.v)
          last.key = isRef(r) ? `${r.n} ${r.g}` : `inline:${nm.v}`
          last.name = nm.v
        } else if (sub === 'Form' && st.depth < 8) {
          await runForm(doc, st, xv, res, fonts, [...xpath, nm.v])
        }
        break
      }
    }
  }
}

/** Run a form XObject (shared by Do and annotation appearances). */
async function runForm(doc, st, xv, parentRes, parentFonts, xpath, extraMatrix = null) {
  const fm = deref(doc, get(xv.dict, 'Matrix'))
  const fmat = Array.isArray(fm) && fm.length === 6 ? fm.map(Number) : [1, 0, 0, 1, 0, 0]
  const saved = { ...snap(st), path: st.path, cur: st.cur, gstack: st.gstack, clipLen: st.clipLevels.length, pendingClip: st.pendingClip }
  if (extraMatrix) st.ctm = matMul(st.ctm, extraMatrix)
  st.ctm = matMul(st.ctm, fmat)
  st.path = []
  st.cur = null
  st.gstack = []
  st.pendingClip = null
  const bb = deref(doc, get(xv.dict, 'BBox'))
  let clipped = false
  if (Array.isArray(bb) && bb.length === 4) {
    const [bx0, by0, bx1, by1] = bb.map((v) => Number(deref(doc, v)))
    const m = matMul(st.disp, st.ctm)
    const cs = [[bx0, by0], [bx1, by0], [bx1, by1], [bx0, by1]].map(([x, y]) => matPt(m, x, y))
    st.ops.push({ t: 'clip', segs: [['M', ...cs[0]], ['L', ...cs[1]], ['L', ...cs[2]], ['L', ...cs[3]], ['Z']] })
    clipped = true
  }
  // transparency group: constant alpha applies to the group as a whole —
  // approximated by letting the current alpha flow into the form
  st.depth++
  try {
    const subRes = deref(doc, get(xv.dict, 'Resources'))
    const merged = subRes instanceof Map ? subRes : parentRes
    const subFonts = merged === parentRes ? parentFonts : await fontMapFromRes(doc, merged)
    const fdata = await streamData(xv)
    if (fdata) await walk(doc, st, fdata, merged, subFonts, null, xpath)
  } finally {
    st.depth--
    while (st.clipLevels.length > saved.clipLen) { st.clipLevels.pop(); st.ops.push({ t: 'unclip' }) }
    Object.assign(st, saved)
    if (clipped) st.ops.push({ t: 'unclip' })
  }
}

/** Paint annotation normal appearances (stamps, filled fields, ink, signatures…). */
async function paintAnnotations(doc, leaf, st, pageRes, widgets) {
  const an = deref(doc, get(leaf.dict, 'Annots'))
  if (!Array.isArray(an)) return
  for (const r of an) {
    const a = deref(doc, r)
    if (!(a instanceof Map)) continue
    const sub = get(a, 'Subtype')?.v
    if (sub === 'Popup' || sub === 'Link' || (!widgets && sub === 'Widget')) continue
    const flags = deref(doc, get(a, 'F')) ?? 0
    if (flags & 2 || flags & 32) continue // hidden / NoView
    let ap = deref(doc, get(deref(doc, get(a, 'AP')), 'N'))
    if (ap instanceof Map && !isStream(ap)) { // appearance states (checkboxes, radios)
      const as = get(a, 'AS')
      ap = deref(doc, as?.k === 'n' ? ap.get(as.v) : ap.get('On') ?? ap.get('Yes') ?? null)
    }
    if (!isStream(ap)) continue
    const rect = deref(doc, get(a, 'Rect'))
    if (!Array.isArray(rect) || rect.length !== 4) continue
    const [x0, y0, x1, y1] = rect.map((v) => Number(deref(doc, v)))
    const bb = deref(doc, get(ap.dict, 'BBox')) ?? [0, 0, x1 - x0, y1 - y0]
    const fm = deref(doc, get(ap.dict, 'Matrix'))
    const M = Array.isArray(fm) && fm.length === 6 ? fm.map(Number) : [1, 0, 0, 1, 0, 0]
    // spec 12.5.5: transform BBox by Matrix, map that box onto Rect
    const pts = [[bb[0], bb[1]], [bb[2], bb[1]], [bb[2], bb[3]], [bb[0], bb[3]]].map(([x, y]) => matPt(M, x, y))
    const bx0 = Math.min(...pts.map((p) => p[0])), by0 = Math.min(...pts.map((p) => p[1]))
    const bw = Math.max(...pts.map((p) => p[0])) - bx0 || 1, bh = Math.max(...pts.map((p) => p[1])) - by0 || 1
    const A = [(Math.min(x0, x1) === x0 ? x1 - x0 : x0 - x1) / bw, 0, 0, Math.abs(y1 - y0) / bh, 0, 0]
    A[4] = Math.min(x0, x1) - bx0 * A[0]
    A[5] = Math.min(y0, y1) - by0 * A[3]
    const saved = snap(st)
    st.ctm = [1, 0, 0, 1, 0, 0]
    st.fillA = 1; st.strokeA = 1; st.blend = null
    await runForm(doc, st, ap, pageRes, new Map(), ['@annot'], A).catch(() => {})
    Object.assign(st, saved)
  }
}

const cmyk = (n) => [(1 - n[0]) * (1 - n[3]), (1 - n[1]) * (1 - n[3]), (1 - n[2]) * (1 - n[3])]

// ---------- text extraction ----------

/** Page text, lines reassembled by position (top→bottom, left→right). */
async function pageText(doc, leaf) {
  const { ops } = await collectDrawOps(doc, leaf, { annots: false })
  return textFromOps(ops)
}

/**
 * Text ops → reading-order text. Runs are grouped into lines by baseline, then
 * joined by GEOMETRY: a space only where the gap between runs is wider than a
 * fraction of the font size. (Kerned TJ arrays and per-glyph positioning emit
 * one op per fragment — joining those with blanks gives "Quar t erly".)
 */
function textFromOps(ops) {
  const texts = ops.filter((o) => o.t === 'text' && o.str && Math.abs(o.rot ?? 0) < 0.3)
    .sort((a, b) => a.y - b.y || a.x - b.x)
  const lines = []
  let cur = []
  let lineY = 0
  for (const t of texts) {
    if (cur.length && Math.abs(t.y - lineY) > Math.max(2, Math.min(t.h, cur[0].h) * 0.5)) { lines.push(cur); cur = [] }
    if (!cur.length) lineY = t.y
    cur.push(t)
  }
  if (cur.length) lines.push(cur)
  const rotated = ops.filter((o) => o.t === 'text' && o.str && Math.abs(o.rot ?? 0) >= 0.3).map((o) => o.str.trim()).filter(Boolean)
  const out = lines.map((l) => {
    l.sort((a, b) => a.x - b.x)
    let s = ''
    let end = -Infinity
    for (const t of l) {
      const size = t.size || t.h || 10
      const gap = t.x - end
      if (s && gap > size * 0.18 && !s.endsWith(' ') && !t.str.startsWith(' ')) s += ' '
      s += t.str
      end = Math.max(end, t.x + t.w)
    }
    return s.replace(/[ﬀ-ﬆ]/g, (c) => c.normalize('NFKC')).replace(/\s+/g, ' ').trim()
  }).filter(Boolean)
  return [...out, ...rotated].join('\n')
}


// ---- src/pdf/ops.js ----

const INHERITED = ['Resources', 'MediaBox', 'CropBox', 'Rotate']

/** Walk the page tree → ordered leaves with resolved inherited attributes. */
function pageLeaves(doc) {
  const root = deref(doc, get(doc.trailer, 'Root'))
  const catalog = isStream(root) ? root.dict : root
  const pagesRef = get(catalog, 'Pages')
  if (!isRef(pagesRef)) throw new Error('no /Pages in catalog')
  const leaves = []
  const seen = new Set()

  const walk = (nodeRef, inh) => {
    const key = nodeRef.n + ' ' + nodeRef.g
    if (seen.has(key)) return
    seen.add(key)
    const node = deref(doc, nodeRef)
    const dict = isStream(node) ? node.dict : node
    if (!(dict instanceof Map)) return
    const cur = { ...inh }
    for (const k of INHERITED) {
      const v = get(dict, k)
      if (v !== undefined) cur[k] = v
    }
    if (typeIs(dict, 'Page')) leaves.push({ ref: nodeRef, dict, inh: cur })
    else {
      const kidsArr = deref(doc, get(dict, 'Kids'))
      if (Array.isArray(kidsArr)) for (const kid of kidsArr) if (isRef(kid)) walk(kid, cur)
    }
  }
  walk(pagesRef, {})
  if (!leaves.length) throw new Error('PDF has no pages')
  return leaves
}

async function pageCount(bytes) {
  return pageLeaves(await parsePdf(bytes)).length
}

/** Per-page geometry for UI pickers: [{w, h, rotate}] — MediaBox + inherited Rotate. */
function pageDims(doc) {
  return pageLeaves(doc).map((leaf) => {
    let mb = get(leaf.dict, 'MediaBox') ?? leaf.inh.MediaBox
    if (isRef(mb)) mb = deref(doc, mb)
    if (!Array.isArray(mb)) mb = [0, 0, 612, 792]
    const rot = get(leaf.dict, 'Rotate') ?? leaf.inh.Rotate ?? 0
    return { w: Math.round(mb[2] - mb[0]), h: Math.round(mb[3] - mb[1]), rotate: typeof rot === 'number' ? rot : 0 }
  })
}

const textVal = (v) => {
  if (isStr(v) || isHex(v)) {
    const b = v.bytes
    if (b[0] === 0xfe && b[1] === 0xff) return new TextDecoder('utf-16be').decode(b.subarray(2))
    return dec(b).replace(/\x00+$/, '')
  }
  if (isName(v)) return '/' + v.v
  if (typeof v === 'number' || typeof v === 'boolean') return String(v)
  return null
}

/**
 * What the file says about you: /Info fields, XMP presence, doc ID presence.
 * Drives the Scrub tool's "here's what's leaking" preview.
 */
async function readMetadata(bytes) {
  const doc = await parsePdf(bytes)
  const out = { fields: [], xmp: false, id: false }
  const infoRaw = get(doc.trailer, 'Info')
  const info = isRef(infoRaw) ? deref(doc, infoRaw) : infoRaw
  if (info instanceof Map) {
    for (const [k, v] of info) {
      const s = textVal(isRef(v) ? deref(doc, v) : v)
      if (s) out.fields.push({ key: k, value: s })
    }
  }
  const root = deref(doc, get(doc.trailer, 'Root'))
  const catalog = isStream(root) ? root.dict : root
  if (get(catalog, 'Metadata') !== undefined) out.xmp = true
  if (get(doc.trailer, 'ID') !== undefined) out.id = true
  return out
}

/** Deep-copy a value across docs, remapping refs. */
function copyValue(v, src, dst, refMap) {
  if (isRef(v)) {
    const key = `${v.n} ${v.g}`
    if (refMap.has(key)) return refMap.get(key)
    const newNum = dst.alloc()
    const out = ref(newNum, 0)
    refMap.set(key, out)
    const srcVal = src.objects.get(key)?.v
    if (srcVal === undefined) {
      refMap.delete(key) // don't leave a pointer to an object that never gets written
      return null
    }
    dst.set(newNum, isStream(srcVal)
      ? stream(copyValue(srcVal.dict, src, dst, refMap), srcVal.data.slice())
      : copyValue(srcVal, src, dst, refMap))
    return out
  }
  if (v instanceof Map) {
    const m = new Map()
    for (const [k, val] of v) m.set(k, copyValue(val, src, dst, refMap))
    return m
  }
  if (Array.isArray(v)) return v.map((x) => copyValue(x, src, dst, refMap))
  if (isStream(v)) {
    // streams are only valid as indirect objects — re-home direct ones
    const num = dst.alloc()
    dst.set(num, stream(copyValue(v.dict, src, dst, refMap), v.data.slice()))
    return ref(num, 0)
  }
  return v
}

/**
 * Append selected pages of `srcDoc` into `dst` under `pagesRef`.
 * `picks` = [{leaf, rotateDelta}] — leaves already walked (source order preserved by caller).
 * `strip` names extra page-dict keys to drop (privacy scrubbing).
 */
function appendPages(srcDoc, picks, dst, pagesRef, kids, strip = [], refMap = new Map()) {
  // pre-register every leaf ref first: a page dict referencing a LATER page
  // (annotation /P, named dests inside dicts) must remap onto the real copy —
  // a refMap miss would deep-copy an orphan page object outside the tree
  const nums = picks.map(({ leaf }) => {
    const num = dst.alloc()
    kids.push(ref(num, 0))
    if (isRef(leaf.ref)) refMap.set(`${leaf.ref.n} ${leaf.ref.g}`, ref(num, 0))
    return num
  })
  for (const [pi, { leaf, rotateDelta }] of picks.entries()) {
    const num = nums[pi]
    const pageDict = new Map()
    for (const k of INHERITED) {
      const v = get(leaf.dict, k) ?? leaf.inh[k]
      if (v !== undefined) pageDict.set(k, copyValue(v, srcDoc, dst, refMap))
    }
    for (const [k, val] of leaf.dict) {
      if (k === 'Parent' || k === 'Metadata' || INHERITED.includes(k) || strip.includes(k)) continue
      pageDict.set(k, copyValue(val, srcDoc, dst, refMap))
    }
    pageDict.set('Type', name('Page'))
    pageDict.set('Parent', ref(pagesRef, 0))
    if (rotateDelta) {
      const cur = get(pageDict, 'Rotate')
      const base = typeof cur === 'number' ? cur : 0
      pageDict.set('Rotate', ((base + rotateDelta) % 360 + 360) % 360)
    }
    dst.set(num, pageDict)
  }
}

// catalog keys that survive whole-document rebuilds (remapped via refMap)
const CATALOG_EXTRAS = [
  'Outlines', 'Names', 'AcroForm', 'PageLabels', 'PageMode', 'OpenAction',
  'ViewerPreferences', 'MarkInfo', 'Lang', 'Metadata', 'StructTreeRoot', 'URI',
]

/**
 * Build the Pages node + catalog (with extras preserved when srcDoc/refMap
 * are given) → {catNum, trailer}. Kept separate from writeDoc so callers can
 * mutate copied objects (recompression) after extras are pulled in.
 */
function buildCatalog(dst, pagesRef, kids, srcDoc, refMap, { skip = [], noInfo = false } = {}) {
  dst.set(pagesRef, new Map([
    ['Type', name('Pages')],
    ['Kids', kids],
    ['Count', kids.length],
  ]))
  const catNum = dst.alloc()
  const catDict = new Map([
    ['Type', name('Catalog')],
    ['Pages', ref(pagesRef, 0)],
  ])
  const trailer = new Map()
  if (srcDoc && refMap) {
    const srcRoot = deref(srcDoc, get(srcDoc.trailer, 'Root'))
    const srcCat = isStream(srcRoot) ? srcRoot.dict : srcRoot
    for (const k of CATALOG_EXTRAS) {
      if (skip.includes(k)) continue
      const v = get(srcCat, k)
      if (v !== undefined) catDict.set(k, copyValue(v, srcDoc, dst, refMap))
    }
    const info = noInfo ? null : get(srcDoc.trailer, 'Info')
    if (info) {
      const iv = copyValue(info, srcDoc, dst, refMap)
      if (iv !== null && iv !== undefined) trailer.set('Info', iv)
    }
    const srcId = get(srcDoc.trailer, 'ID')
    if (Array.isArray(srcId)) {
      trailer.set('ID', srcId.map((x) =>
        x?.bytes ? { k: 'x', bytes: x.bytes.slice() } : copyValue(x, srcDoc, dst, refMap)))
    }
  }
  dst.set(catNum, catDict)
  return { catNum, trailer }
}

function finishDoc(dst, pagesRef, kids, srcDoc, refMap) {
  const { catNum, trailer } = buildCatalog(dst, pagesRef, kids, srcDoc, refMap)
  return writeDoc(dst, catNum, trailer)
}

/**
 * Assemble a new PDF from pages of one or more parsed docs.
 * ops: [{doc, page (1-based), rotation?} | {blank: [w, h]}] in output order.
 * opts.names: per-doc titles → merge bookmarks ("file.pdf" › its own outline).
 * Bookmarks and form fields survive for pages that make it into the output;
 * references to dropped pages become null instead of dragging the whole
 * page (and its content) into the file as an orphan.
 */
async function assemble(docs, ops, { names = null, extrasFrom = null } = {}) {
  const dst = newDoc()
  const pagesRef = dst.alloc()
  const kids = []
  const leavesOf = docs.map((d) => pageLeaves(d))
  const refMaps = docs.map(() => new Map())
  const firstNew = docs.map(() => new Map()) // per doc: src leaf key → first output ref
  const nums = ops.map(() => dst.alloc())
  ops.forEach((o, i) => {
    kids.push(ref(nums[i], 0))
    if (o.blank) return
    const leaves = leavesOf[o.doc]
    if (!leaves || o.page < 1 || o.page > leaves.length) throw new Error(`page ${o.page} out of range`)
    const leaf = leaves[o.page - 1]
    if (isRef(leaf.ref)) {
      const key = `${leaf.ref.n} ${leaf.ref.g}`
      if (!firstNew[o.doc].has(key)) {
        firstNew[o.doc].set(key, ref(nums[i], 0))
        refMaps[o.doc].set(key, ref(nums[i], 0))
      }
    }
  })
  // dropped pages: references resolve to null, never to an orphan copy
  docs.forEach((d, di) => {
    for (const leaf of leavesOf[di]) {
      if (!isRef(leaf.ref)) continue
      const key = `${leaf.ref.n} ${leaf.ref.g}`
      if (!refMaps[di].has(key)) refMaps[di].set(key, null)
    }
  })
  ops.forEach((o, i) => {
    if (o.blank) {
      dst.set(nums[i], new Map([
        ['Type', name('Page')], ['Parent', ref(pagesRef, 0)],
        ['MediaBox', [0, 0, o.blank[0] ?? 612, o.blank[1] ?? 792]],
        ['Resources', new Map()],
      ]))
      return
    }
    writePage(docs[o.doc], leavesOf[o.doc][o.page - 1], nums[i], o.rotation || 0, dst, pagesRef, refMaps[o.doc])
  })

  // bookmarks
  const tree = []
  docs.forEach((d, di) => {
    const mapped = remapOutline(readOutline(d), (key) => firstNew[di].get(key) ?? null)
    if (names) {
      const firstOp = ops.findIndex((o) => !o.blank && o.doc === di)
      if (firstOp >= 0) tree.push({ title: names[di] ?? `Document ${di + 1}`, target: ref(nums[firstOp], 0), view: [name('Fit')], open: false, children: mapped })
    } else tree.push(...mapped)
  })

  // interactive form fields whose widgets landed on output pages
  const fields = []
  const usedNames = new Set()
  let formDA = null, formDR = null, needApp = false
  docs.forEach((d, di) => {
    const root = deref(d, get(d.trailer, 'Root'))
    const form = deref(d, get(root, 'AcroForm'))
    if (!(form instanceof Map)) return
    const top = deref(d, get(form, 'Fields'))
    if (!Array.isArray(top)) return
    const included = new Set([...firstNew[di].keys()])
    const onPage = (fref, depth = 0) => {
      const f = deref(d, fref)
      if (!(f instanceof Map) || depth > 20) return false
      const p = get(f, 'P')
      if (isRef(p) && included.has(`${p.n} ${p.g}`)) return true
      const ks = deref(d, get(f, 'Kids'))
      return Array.isArray(ks) && ks.some((k) => onPage(k, depth + 1))
    }
    for (const fref of top) {
      if (!onPage(fref)) continue
      const copied = copyValue(fref, d, dst, refMaps[di])
      if (!copied) continue
      const fd = dst.objects.get(copied.n)
      const t = fd instanceof Map ? get(fd, 'T') : null
      const tn = t?.bytes ? dec(t.bytes) : null
      if (tn !== null) {
        let nm = tn
        let k = 2
        while (usedNames.has(nm)) nm = `${tn}_${k++}`
        usedNames.add(nm)
        if (nm !== tn) fd.set('T', { k: 's', bytes: enc(nm) })
      }
      fields.push(copied)
    }
    formDA ??= get(form, 'DA') ?? null
    if (!formDR && get(form, 'DR') !== undefined) formDR = copyValue(get(form, 'DR'), d, dst, refMaps[di])
    if (get(form, 'NeedAppearances') === true) needApp = true
  })

  dst.set(pagesRef, new Map([['Type', name('Pages')], ['Kids', kids], ['Count', kids.length]]))
  const catNum = dst.alloc()
  const cat = new Map([['Type', name('Catalog')], ['Pages', ref(pagesRef, 0)]])
  const ol = writeOutline(dst, tree)
  if (ol) { cat.set('Outlines', ol); cat.set('PageMode', name('UseOutlines')) }
  if (fields.length) {
    const af = new Map([['Fields', fields]])
    if (formDA) af.set('DA', formDA)
    if (formDR) af.set('DR', formDR)
    if (needApp) af.set('NeedAppearances', true)
    cat.set('AcroForm', af)
  }
  const trailer = new Map()
  if (extrasFrom !== null) { // single-source rebuild: keep doc-level niceties
    const d = docs[extrasFrom]
    const srcRoot = deref(d, get(d.trailer, 'Root'))
    for (const k of ['Lang', 'ViewerPreferences', 'MarkInfo', 'PageLabels']) {
      const v = get(srcRoot, k)
      if (v !== undefined && k !== 'PageLabels') cat.set(k, copyValue(v, d, dst, refMaps[extrasFrom]))
    }
    const info = get(d.trailer, 'Info')
    if (info) { const iv = copyValue(info, d, dst, refMaps[extrasFrom]); if (iv) trailer.set('Info', iv) }
  }
  dst.set(catNum, cat)
  return writeDoc(dst, catNum, trailer)
}

/** Write one source page into dst as object `num` (inherited attrs flattened). */
function writePage(srcDoc, leaf, num, rotateDelta, dst, pagesRef, refMap, strip = []) {
  const pageDict = new Map()
  for (const k of INHERITED) {
    const v = get(leaf.dict, k) ?? leaf.inh[k]
    if (v !== undefined) pageDict.set(k, copyValue(v, srcDoc, dst, refMap))
  }
  for (const [k, val] of leaf.dict) {
    if (k === 'Parent' || k === 'Metadata' || k === 'StructParents' || INHERITED.includes(k) || strip.includes(k)) continue
    pageDict.set(k, copyValue(val, srcDoc, dst, refMap))
  }
  // a copied Annots array may hold nulls where an entry pointed at a dropped page
  const an = pageDict.get('Annots')
  if (Array.isArray(an)) pageDict.set('Annots', an.filter((x) => x !== null && x !== undefined))
  pageDict.set('Type', name('Page'))
  pageDict.set('Parent', ref(pagesRef, 0))
  if (rotateDelta) {
    const cur = get(pageDict, 'Rotate')
    const base = typeof cur === 'number' ? cur : 0
    pageDict.set('Rotate', ((base + rotateDelta) % 360 + 360) % 360)
  }
  dst.set(num, pageDict)
}

/**
 * Merge several PDFs (Uint8Array[]) into one, in order.
 * opts.names → one bookmark per file holding that file's own bookmarks.
 * opts.pages → per-input array of 1-based pages to take (default: all).
 */
async function mergePdfs(inputs, { names = null, pages = null } = {}) {
  const docs = []
  for (const b of inputs) docs.push(await parsePdf(b))
  const ops = []
  docs.forEach((d, di) => {
    const n = pageLeaves(d).length
    const sel = pages?.[di] ?? Array.from({ length: n }, (_, i) => i + 1)
    for (const p of sel) ops.push(typeof p === 'object' ? { doc: di, ...p } : { doc: di, page: p })
  })
  return assemble(docs, ops, { names })
}

/**
 * Rebuild a PDF from an ordered op list (1-based source pages):
 * reorder by list order, delete by omission, rotate via `rotation` delta,
 * insert blank pages with {blank: [w, h]}, pull pages of extra PDFs with
 * {doc: k, page} where k indexes [main, ...opts.extra].
 */
async function organizePages(bytes, ops, { extra = [] } = {}) {
  const docs = [await parsePdf(bytes)]
  for (const b of extra) docs.push(await parsePdf(b))
  return assemble(docs, ops.map((o) => (o.blank ? o : { doc: o.doc ?? 0, page: o.page, rotation: o.rotation })), { extrasFrom: 0 })
}

/** Extract page ranges (1-based inclusive {from,to}) into a single PDF. */
async function extractPages(bytes, ranges) {
  const ops = ranges.flatMap(({ from, to }) =>
    Array.from({ length: to - from + 1 }, (_, i) => ({ page: from + i, rotation: 0 })),
  )
  return organizePages(bytes, ops)
}

/** One output PDF per range. */
async function splitPdf(bytes, ranges) {
  return Promise.all(ranges.map((r) => extractPages(bytes, [r])))
}

/** Parse "1-3, 5, 8-10" into {from,to}[] with bounds checking. */
function parseRanges(spec, maxPage) {
  const ranges = []
  for (const part of spec.split(',')) {
    const t = part.trim()
    if (!t) continue
    const m = /^(\d+)(?:\s*-\s*(\d+))?$/.exec(t)
    if (!m) throw new Error(`bad range "${t}"`)
    const from = parseInt(m[1], 10)
    const to = m[2] ? parseInt(m[2], 10) : from
    if (from < 1 || to > maxPage || from > to) throw new Error(`range "${t}" out of bounds`)
    ranges.push({ from, to })
  }
  if (!ranges.length) throw new Error('no ranges given')
  return ranges
}

// ---------- images → pdf ----------

/** Read dimensions/colorspace from a JPEG's SOF marker. */
function jpegInfo(buf) {
  if (buf[0] !== 0xff || buf[1] !== 0xd8) throw new Error('not a JPEG')
  let i = 2
  while (i + 3 < buf.length) {
    if (buf[i] !== 0xff) { i++; continue }
    const marker = buf[i + 1]
    if (marker === 0xd8 || marker === 0x01 || (marker >= 0xd0 && marker <= 0xd7)) { i += 2; continue }
    const len = (buf[i + 2] << 8) | buf[i + 3]
    if (marker === 0xda) break // SOS — image data
    if ([0xc0, 0xc1, 0xc2, 0xc3, 0xc5, 0xc6, 0xc7, 0xc9, 0xca, 0xcb, 0xcd, 0xce, 0xcf].includes(marker)) {
      const height = (buf[i + 5] << 8) | buf[i + 6]
      const width = (buf[i + 7] << 8) | buf[i + 8]
      const comps = buf[i + 9]
      const cs = comps === 1 ? 'DeviceGray' : comps === 4 ? 'DeviceCMYK' : 'DeviceRGB'
      return { width, height, colorSpace: cs }
    }
    i += 2 + len
  }
  throw new Error('JPEG SOF marker not found')
}

/** Pack JPEG images into a PDF — one image per page at native size. */
const PAGE_SIZES = { a4: [595.28, 841.89], letter: [612, 792] }

/**
 * Wrap jpeg images into a one-page-each PDF.
 * opts: size 'native'|'a4'|'letter', orient 'auto'|'portrait'|'landscape',
 *       margin (pt), fit 'contain'|'stretch'.
 */
function imagesToPdf(images, opts = {}) {
  const { size = 'native', orient = 'auto', margin = 0, fit = 'contain' } = opts
  const dst = newDoc()
  const pagesRef = dst.alloc()
  const kids = []
  for (const img of images) {
    const { width, height, colorSpace } = jpegInfo(img.data)
    const imgNum = dst.alloc()
    dst.set(imgNum, stream(new Map([
      ['Type', name('XObject')],
      ['Subtype', name('Image')],
      ['Width', width],
      ['Height', height],
      ['ColorSpace', name(colorSpace)],
      ['BitsPerComponent', 8],
      ['Filter', name('DCTDecode')],
      ['Length', img.data.length],
    ]), img.data))

    let pw, ph
    if (size === 'native') {
      pw = width + margin * 2
      ph = height + margin * 2
    } else {
      let [bw, bh] = PAGE_SIZES[size] ?? PAGE_SIZES.a4
      const landscape = orient === 'landscape' || (orient === 'auto' && width > height)
      ;[pw, ph] = landscape ? [Math.max(bw, bh), Math.min(bw, bh)] : [Math.min(bw, bh), Math.max(bw, bh)]
    }
    const cw = Math.max(1, pw - margin * 2)
    const ch = Math.max(1, ph - margin * 2)
    let dw, dh
    if (fit === 'stretch') { dw = cw; dh = ch }
    else { const s = Math.min(cw / width, ch / height); dw = width * s; dh = height * s }
    const x = (pw - dw) / 2
    const y = (ph - dh) / 2

    const csNum = dst.alloc()
    dst.set(csNum, stream(new Map(), new TextEncoder().encode(`q ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im0 Do Q`)))
    const pageNum = dst.alloc()
    dst.set(pageNum, new Map([
      ['Type', name('Page')],
      ['Parent', ref(pagesRef, 0)],
      ['MediaBox', [0, 0, pw, ph]],
      ['Resources', new Map([['XObject', new Map([['Im0', ref(imgNum, 0)]])]])],
      ['Contents', ref(csNum, 0)],
    ]))
    kids.push(ref(pageNum, 0))
  }
  return finishDoc(dst, pagesRef, kids)
}

const KEEP_ANNOTS = new Set(['Link', 'Widget'])
const PERSONAL_ANNOT_KEYS = ['T', 'M', 'NM', 'CreationDate', 'RC', 'Subj']

/**
 * Privacy scrub: drops /Info, XMP /Metadata (catalog + pages), doc IDs and
 * /PieceInfo app data; anonymises what's left of annotations. Bookmarks,
 * links and form fields survive — they're content, not tracking data.
 * opts.removeComments (default true): also drop comment/markup annotations
 * (sticky notes, highlights, ink, stamps…) which carry author names + text.
 */
async function scrubPdf(bytes, { removeComments = true } = {}) {
  const src = await parsePdf(bytes)
  const leaves = pageLeaves(src)
  // filter + anonymise annotations IN THE SOURCE before copying: anything
  // copied and dropped afterwards would still be written as an orphan object
  // (and its comment text would survive in the file)
  for (const leaf of leaves) {
    const an = deref(src, get(leaf.dict, 'Annots'))
    if (!Array.isArray(an)) continue
    const keep = []
    for (const r of an) {
      const ad = deref(src, r)
      if (!(ad instanceof Map)) continue
      const sub = get(ad, 'Subtype')?.v
      if (removeComments && !KEEP_ANNOTS.has(sub)) continue
      // on widgets /T is the FIELD NAME, not an author — keep it
      for (const k of PERSONAL_ANNOT_KEYS) if (!(sub === 'Widget' && (k === 'T' || k === 'RC'))) ad.delete(k)
      ad.delete('Popup')
      keep.push(r)
    }
    if (keep.length) leaf.dict.set('Annots', keep)
    else leaf.dict.delete('Annots')
  }
  const dst = newDoc()
  const pagesRef = dst.alloc()
  const kids = []
  const refMap = new Map()
  appendPages(src, leaves.map((leaf) => ({ leaf, rotateDelta: 0 })), dst, pagesRef, kids, ['PieceInfo', 'LastModified'], refMap)
  const { catNum, trailer } = buildCatalog(dst, pagesRef, kids, src, refMap, { skip: ['Metadata'], noInfo: true })
  trailer.delete('ID')
  return writeDoc(dst, catNum, trailer)
}

// ---------- text extraction ----------

/** All pages → ['page 1 text', ...]. */
async function extractText(doc) {
  const leaves = pageLeaves(doc)
  const out = []
  for (const leaf of leaves) out.push(await pageText(doc, leaf))
  return out
}

// ---------- compress ----------

/**
 * Rebuild keeping only reachable objects; re-deflate every decodable stream
 * when it wins. opts.reimage: async (stream, decodedBytes) → Uint8Array|null —
 * browser hook to re-encode DCT images at lower quality (canvas path).
 * Returns { bytes, before, after }.
 */
async function compressPdf(bytes, { reimage } = {}) {
  const src = await parsePdf(bytes)
  const leaves = pageLeaves(src)
  const dst = newDoc()
  const pagesRef = dst.alloc()
  const kids = []
  const refMap = new Map()
  appendPages(src, leaves.map((leaf) => ({ leaf, rotateDelta: 0 })), dst, pagesRef, kids, [], refMap)
  // pull catalog extras in now so recompression covers them too
  const { catNum, trailer } = buildCatalog(dst, pagesRef, kids, src, refMap)
  const dstDoc = { objects: new Map() }
  for (const [num, v] of dst.objects) dstDoc.objects.set(`${num} 0`, { v })
  for (const v of dst.objects.values()) {
    if (!isStream(v)) continue
    if (reimage && get(v.dict, 'Subtype')?.v === 'Image' && get(v.dict, 'SMask') === undefined) {
      const dec = await decodeImageStream(dstDoc, v).catch(() => null)
      const repl = dec ? await reimage(dec).catch(() => null) : null
      if (repl && repl.length < v.data.length) {
        v.data = repl
        v.dict.set('Filter', name('DCTDecode'))
        v.dict.set('ColorSpace', name('DeviceRGB'))
        v.dict.set('BitsPerComponent', 8)
        for (const k of ['DecodeParms', 'DP', 'Decode']) v.dict.delete(k)
        continue
      }
    }
    // streamData undoes the whole chain incl. predictors, so the re-deflated
    // bytes are raw — DecodeParms no longer applies and must go with the old filters.
    const raw = await streamData(v)
    if (raw === null) continue
    const packed = await deflate(raw)
    if (packed.length < v.data.length) {
      v.data = packed
      v.dict.set('Filter', name('FlateDecode'))
      v.dict.delete('DecodeParms')
      v.dict.delete('DP')
    }
  }
  const out = writeDoc(dst, catNum, trailer)
  return { bytes: out, before: bytes.length, after: out.length }
}

/**
 * Best-effort visual for a page when rendering fails: {img: {data, mime} | null, text}.
 * img = the largest painted image XObject; text = the page's first characters.
 */
async function pagePreview(doc, leaf, maxLen = 200) {
  const { ops } = await collectDrawOps(doc, leaf, { annots: false }).catch(() => ({ ops: [] }))
  const text = textFromOps(ops).replace(/\s+/g, ' ').trim().slice(0, maxLen)
  let best = null
  for (const o of ops) if (o.t === 'img' && o.ref && (!best || o.w * o.h > best.w * best.h)) best = o
  return { img: best ? await decodeImageStream(doc, best.ref).catch(() => null) : null, text }
}

// ---------- extract images ----------

/**
 * Decode one image XObject stream → {data, mime, ext} or null when unsupported.
 * JPEG/JPEG2000 payloads are passed through untouched (lossless extraction);
 * everything else is decoded through its colour space to PNG (alpha kept).
 */
async function decodeImageStream(doc, v) {
  const im = await decodeImage(doc, v)
  if (!im) return null
  if (im.kind === 'jpeg') return { data: im.data, mime: 'image/jpeg', ext: '.jpg', smask: im.smask, cmyk: im.cmyk, invert: im.invert }
  if (im.kind === 'jpx') return { data: im.data, mime: 'image/jp2', ext: '.jp2' }
  return { data: rgbaToPng(im.w, im.h, im.rgba), mime: 'image/png', ext: '.png', rgba: im.rgba, w: im.w, h: im.h }
}

/** RGBA → smallest faithful PNG (drops alpha / colour when unused). */
function rgbaToPng(w, h, rgba) {
  let opaque = true, gray = true
  for (let i = 0; i < rgba.length; i += 4) {
    if (rgba[i + 3] !== 255) opaque = false
    if (rgba[i] !== rgba[i + 1] || rgba[i] !== rgba[i + 2]) gray = false
    if (!opaque && !gray) break
  }
  const ch = (gray ? 1 : 3) + (opaque ? 0 : 1)
  const px = new Uint8Array(w * h * ch)
  for (let i = 0, o = 0; i < rgba.length; i += 4) {
    px[o++] = rgba[i]
    if (!gray) { px[o++] = rgba[i + 1]; px[o++] = rgba[i + 2] }
    if (!opaque) px[o++] = rgba[i + 3]
  }
  return pngEncode(w, h, px, ch)
}

/**
 * Pull embedded images out of a PDF.
 * Returns { images: [{name, data, w, h, mime}], skipped }.
 */
async function extractImages(bytes) {
  const doc = await parsePdf(bytes)
  const images = []
  let skipped = 0
  let i = 0
  for (const { v } of doc.objects.values()) {
    if (!isStream(v) || get(v.dict, 'Subtype')?.v !== 'Image') continue
    i++
    const w = get(v.dict, 'Width') ?? 0
    const h = get(v.dict, 'Height') ?? 0
    const dec = await decodeImageStream(doc, v).catch(() => null)
    if (dec) images.push({ name: `image-${i}-${w}x${h}${dec.ext}`, data: dec.data, w, h, mime: dec.mime, hash: crc32(dec.data) >>> 0 })
    else skipped++
  }
  return { images, skipped }
}

// ---- src/pdf/security.js ----
// PDF Standard Security Handler — unlock RC4-40/128, AES-128 (R4) and
// AES-256 (R5/R6); protect with AES-256 (default), AES-128 or RC4-128,
// including owner password + permission flags.

const PAD32 = new Uint8Array([
  0x28, 0xbf, 0x4e, 0x5e, 0x4e, 0x75, 0x8a, 0x41, 0x64, 0x00, 0x4e, 0x56, 0xff, 0xfa, 0x01, 0x08,
  0x2e, 0x2e, 0x00, 0xb6, 0xd0, 0x68, 0x3e, 0x80, 0x2f, 0x0c, 0xa9, 0xfe, 0x64, 0x53, 0x69, 0x7a,
])

/** R2–R4 passwords are Latin-1 byte strings, padded/truncated to 32 bytes. */
const pwdPad = (s) => {
  for (const c of s) {
    if (c.codePointAt(0) > 0xff) throw new Error('this encryption mode needs a Latin-1 password — use AES-256 for other characters')
  }
  const b = Uint8Array.from(s, (c) => c.charCodeAt(0) & 0xff)
  const out = new Uint8Array(32)
  out.set(b.subarray(0, 32))
  if (b.length < 32) out.set(PAD32.subarray(0, 32 - b.length), b.length)
  return out
}
/** R5/R6 passwords are UTF-8, max 127 bytes. */
const pwdUtf8 = (s) => enc(s.normalize('NFKC')).slice(0, 127)

const xorKey = (key, i) => Uint8Array.from(key, (b) => b ^ i)
const le32 = (n) => { const b = new Uint8Array(4); new DataView(b.buffer).setInt32(0, n, true); return b }
const bytesEq = (a, b, n = a.length) => { for (let i = 0; i < n; i++) if (a[i] !== b[i]) return false; return true }

function randomBytes(n) {
  const out = new Uint8Array(n)
  if (globalThis.crypto?.getRandomValues) return globalThis.crypto.getRandomValues(out)
  let seed = md5(enc(`${Date.now()}:${Math.random()}:${performance.now?.()}`))
  for (let i = 0; i < n; i++) { if (i % 16 === 0 && i) seed = md5(seed); out[i] = seed[i % 16] ^ ((Math.random() * 256) | 0) }
  return out
}

// ---------- R2–R4 (MD5/RC4 key derivation) ----------

function computeO(ownerPad, userPad, keyLen, R) {
  let d = md5(ownerPad)
  if (R >= 3) for (let i = 0; i < 50; i++) d = md5(d.subarray(0, keyLen))
  const ok = d.subarray(0, keyLen)
  if (R === 2) return rc4(ok, userPad)
  let data = userPad
  for (let i = 0; i < 20; i++) data = rc4(xorKey(ok, i), data)
  return data
}

function computeFileKey(userPad, O, P, id0, keyLen, R, encryptMeta = true) {
  const parts = [userPad, O.subarray(0, 32), le32(P), id0]
  if (R >= 4 && !encryptMeta) parts.push(new Uint8Array([255, 255, 255, 255]))
  let d = md5(concat(parts))
  if (R >= 3) for (let i = 0; i < 50; i++) d = md5(d.subarray(0, keyLen))
  return d.slice(0, keyLen)
}

function computeU(fileKey, id0, R) {
  if (R === 2) return rc4(fileKey, PAD32)
  let data = md5(concat([PAD32, id0]))
  for (let i = 0; i < 20; i++) data = rc4(xorKey(fileKey, i), data)
  const out = new Uint8Array(32)
  out.set(data)
  out.set(md5(fileKey), 16) // arbitrary padding (spec) — deterministic here
  return out
}

// ---------- R5/R6 (SHA-2 / AES-256) ----------

/** Algorithm 2.B (R6) — or plain SHA-256 for R5. */
function hash2B(pwd, salt, udata, R) {
  let K = sha256(concat([pwd, salt, udata]))
  if (R === 5) return K
  for (let round = 0; ; round++) {
    const unit = concat([pwd, K, udata])
    const K1 = new Uint8Array(unit.length * 64)
    for (let i = 0; i < 64; i++) K1.set(unit, i * unit.length)
    const E = aesCbcEncrypt(K.subarray(0, 16), K.subarray(16, 32), K1, false)
    let sum = 0
    for (let i = 0; i < 16; i++) sum += E[i]
    const m = sum % 3
    K = m === 0 ? sha256(E) : m === 1 ? sha384(E) : sha512(E)
    if (round >= 63 && E[E.length - 1] <= round - 32) break
  }
  return K.slice(0, 32)
}

const ZERO_IV = new Uint8Array(16)

// ---------- encrypt-dict analysis ----------

/**
 * Authenticate a password against a Standard-handler encrypt dict.
 * Returns {fileKey, stm, str, R, V, P, encryptMeta, owner} where stm/str are
 * 'RC4' | 'AESV2' | 'AESV3' | 'None'. Throws 'wrong password' / 'unsupported …'.
 */
function authenticate(doc, encDict, pwd) {
  const dd = (v) => (isRef(v) ? deref(doc, v) : v)
  const filt = dd(get(encDict, 'Filter'))
  if (!isName(filt) || filt.v !== 'Standard') throw new Error('unsupported security handler (certificate-encrypted PDFs need the original certificate)')
  const V = dd(get(encDict, 'V')) ?? 0
  const R = dd(get(encDict, 'R')) ?? 2
  const P = dd(get(encDict, 'P')) ?? -4
  const encryptMeta = dd(get(encDict, 'EncryptMetadata')) !== false
  const O = dd(get(encDict, 'O'))?.bytes
  const U = dd(get(encDict, 'U'))?.bytes
  if (!O || !U) throw new Error('unsupported encryption (missing O/U)')

  // crypt filter selection
  let stm = 'RC4', str = 'RC4'
  if (V >= 4) {
    const cf = dd(get(encDict, 'CF'))
    const method = (sel) => {
      const sn = dd(get(encDict, sel))
      const nm = isName(sn) ? sn.v : 'Identity'
      if (nm === 'Identity') return 'None'
      const f = cf instanceof Map ? dd(cf.get(nm)) : null
      const cfm = f instanceof Map ? dd(get(f, 'CFM')) : null
      const m = isName(cfm) ? cfm.v : 'None'
      if (m === 'V2') return 'RC4'
      if (m === 'AESV2' || m === 'AESV3' || m === 'None') return m
      throw new Error(`unsupported crypt filter ${m}`)
    }
    stm = method('StmF')
    str = method('StrF')
  } else if (V !== 1 && V !== 2) {
    throw new Error(`unsupported encryption version V=${V}`)
  }

  if (R >= 5) {
    const OE = dd(get(encDict, 'OE'))?.bytes
    const UE = dd(get(encDict, 'UE'))?.bytes
    if (!OE || !UE) throw new Error('unsupported encryption (missing OE/UE)')
    const pw = pwdUtf8(pwd)
    const U48 = U.subarray(0, 48)
    if (bytesEq(hash2B(pw, U.subarray(32, 40), new Uint8Array(0), R), U, 32)) {
      const ik = hash2B(pw, U.subarray(40, 48), new Uint8Array(0), R)
      return { fileKey: aesCbcDecrypt(ik, ZERO_IV, UE, false), stm, str, R, V, P, encryptMeta, owner: false }
    }
    if (bytesEq(hash2B(pw, O.subarray(32, 40), U48, R), O, 32)) {
      const ik = hash2B(pw, O.subarray(40, 48), U48, R)
      return { fileKey: aesCbcDecrypt(ik, ZERO_IV, OE, false), stm, str, R, V, P, encryptMeta, owner: true }
    }
    throw new Error('wrong password')
  }

  const id0 = doc.trailer && get(doc.trailer, 'ID')?.[0]?.bytes
  if (!id0) throw new Error('unsupported encryption (missing document ID)')
  const keyLen = V === 1 ? 5 : Math.min(16, ((dd(get(encDict, 'Length')) ?? 40) / 8) | 0) || 5
  const uOk = (key) => {
    const u = computeU(key, id0, R)
    return bytesEq(u, U, R === 2 ? 32 : 16)
  }
  let fileKey = computeFileKey(pwdPad(pwd), O, P, id0, keyLen, R, encryptMeta)
  if (uOk(fileKey)) return { fileKey, stm, str, R, V, P, encryptMeta, owner: false }
  // owner password → recover the user pad from O
  let d = md5(pwdPad(pwd))
  if (R >= 3) for (let i = 0; i < 50; i++) d = md5(d.subarray(0, keyLen))
  const ok = d.subarray(0, keyLen)
  let userPad = O.subarray(0, 32)
  if (R === 2) userPad = rc4(ok, userPad)
  else for (let i = 19; i >= 0; i--) userPad = rc4(xorKey(ok, i), userPad)
  fileKey = computeFileKey(userPad, O, P, id0, keyLen, R, encryptMeta)
  if (uOk(fileKey)) return { fileKey, stm, str, R, V, P, encryptMeta, owner: true }
  throw new Error('wrong password')
}

/** Per-object key for RC4 / AESV2; AESV3 uses the file key directly. */
function objectKey(fileKey, n, g, method) {
  if (method === 'AESV3') return fileKey
  const parts = [fileKey, new Uint8Array([n & 0xff, (n >> 8) & 0xff, (n >> 16) & 0xff, g & 0xff, (g >> 8) & 0xff])]
  if (method === 'AESV2') parts.push(new Uint8Array([0x73, 0x41, 0x6c, 0x54])) // "sAlT"
  return md5(concat(parts)).subarray(0, Math.min(fileKey.length + 5, 16))
}

function cryptBytes(method, key, bytes, encrypt) {
  if (method === 'None') return bytes
  if (method === 'RC4') return rc4(key, bytes)
  if (encrypt) {
    const iv = randomBytes(16)
    return concat([iv, aesCbcEncrypt(key, iv, bytes, true)])
  }
  if (bytes.length < 16) return new Uint8Array(0)
  return aesCbcDecrypt(key, bytes.subarray(0, 16), bytes.subarray(16), true)
}

/** Apply the cipher to every string and stream inside one object value. */
function cryptObject(v, n, g, sec, encrypt) {
  const sk = objectKey(sec.fileKey, n, g, sec.str)
  const tk = objectKey(sec.fileKey, n, g, sec.stm)
  const walk = (x) => {
    if (x instanceof Map) { for (const y of x.values()) walk(y) }
    else if (Array.isArray(x)) { for (const y of x) walk(y) }
    else if (x?.k === 's' || x?.k === 'x') x.bytes = cryptBytes(sec.str, sk, x.bytes, encrypt)
  }
  if (isStream(v)) {
    walk(v.dict)
    const isMeta = typeIs(v.dict, 'Metadata')
    if (!(isMeta && !sec.encryptMeta)) {
      v.data = cryptBytes(sec.stm, tk, v.data, encrypt)
      if (!encrypt) v.dict.set('Length', v.data.length)
    }
  } else walk(v)
}

/** Deep-clone one value, remapping refs through refMap. */
function cloneVal(v, refMap) {
  if (isRef(v)) return refMap.get(`${v.n} ${v.g}`) ?? null
  if (v instanceof Map) {
    const m = new Map()
    for (const [k, x] of v) m.set(k, cloneVal(x, refMap))
    return m
  }
  if (Array.isArray(v)) return v.map((x) => cloneVal(x, refMap))
  if (isStream(v)) return stream(cloneVal(v.dict, refMap), v.data.slice())
  if (v?.k === 's' || v?.k === 'x') return { ...v, bytes: v.bytes.slice() }
  return v
}

/** Copy every object (minus skip keys and xref streams) into dst; returns maps + root number. */
function cloneDoc(src, dst, skip = new Set()) {
  const numOf = new Map()
  const refMap = new Map()
  for (const [key, ent] of src.objects) {
    if (skip.has(key)) continue
    const dict = isStream(ent.v) ? ent.v.dict : ent.v
    if (typeIs(dict, 'XRef')) { skip.add(key); continue } // writer emits its own xref
    numOf.set(key, dst.alloc())
  }
  for (const [k, num] of numOf) refMap.set(k, ref(num, 0))
  for (const [key, ent] of src.objects) {
    if (skip.has(key)) continue
    dst.set(numOf.get(key), cloneVal(ent.v, refMap))
  }
  const rootRef = get(src.trailer, 'Root')
  return { numOf, refMap, rootNum: numOf.get(`${rootRef.n} ${rootRef.g}`) }
}

const mapInfo = (src, numOf, refMap, trailer) => {
  const infoRef = get(src.trailer, 'Info')
  if (isRef(infoRef)) {
    const mapped = numOf.get(`${infoRef.n} ${infoRef.g}`)
    if (mapped) trailer.set('Info', ref(mapped, 0))
  } else if (infoRef instanceof Map) trailer.set('Info', cloneVal(infoRef, refMap))
}

/** Is this file encrypted? (cheap check for the UI) */
async function isEncrypted(bytes) {
  const doc = await parsePdf(bytes, [], true)
  return !!get(doc.trailer, 'Encrypt')
}

/**
 * Unlock a protected PDF with the user OR owner password → unprotected bytes.
 * Throws 'wrong password' when neither authenticates.
 */
async function decryptPdf(bytes, pwd) {
  const src = await parsePdf(bytes, [], true)
  const encRef = get(src.trailer, 'Encrypt')
  if (!encRef) return bytes
  const encDict = isRef(encRef) ? deref(src, encRef) : encRef
  const sec = authenticate(src, encDict, pwd)
  // encrypted object streams: parsePdf unpacked nothing useful from ciphertext,
  // so decrypt each container with its own key and unpack its objects now
  const objStmKeys = new Set()
  const unpacked = new Set() // inner objects are plaintext already
  for (const [key, ent] of src.objects) {
    const v = ent.v
    if (!isStream(v) || !typeIs(v.dict, 'ObjStm')) continue
    const N = get(v.dict, 'N'), first = get(v.dict, 'First')
    if (typeof N !== 'number' || typeof first !== 'number') continue
    const [n, g] = key.split(' ').map(Number)
    const plain = cryptBytes(sec.stm, objectKey(sec.fileKey, n, g, sec.stm), v.data, false)
    const data = await streamData({ dict: v.dict, data: plain })
    if (!data) continue
    objStmKeys.add(key)
    const header = dec(data.slice(0, first)).trim().split(/\s+/).map(Number)
    for (let i = 0; i < N; i++) {
      const num = header[i * 2], off = header[i * 2 + 1]
      try {
        const [v2] = parseValue(data, first + off)
        const k2 = `${num} 0`
        if (!src.objects.has(k2)) { // a directly-scanned object is the newer revision
          src.objects.set(k2, { n: num, g: 0, v: v2 })
          unpacked.add(k2)
        }
      } catch { /* skip malformed inner object */ }
    }
  }
  const encKey = isRef(encRef) ? `${encRef.n} ${encRef.g}` : null
  const skip = new Set([...objStmKeys, ...(encKey ? [encKey] : [])])
  const dst = newDoc()
  const { numOf, refMap, rootNum } = cloneDoc(src, dst, skip)
  // keys bind to SOURCE object ids — never to the renumbered clones
  for (const [key] of src.objects) {
    if (skip.has(key) || unpacked.has(key)) continue
    const [n, g] = key.split(' ').map(Number)
    cryptObject(dst.objects.get(numOf.get(key)), n, g, sec, false)
  }
  const id0 = get(src.trailer, 'ID')?.[0]?.bytes ?? md5(bytes.subarray(0, 4096))
  const trailer = new Map([['ID', [{ k: 'x', bytes: id0 }, { k: 'x', bytes: md5(concat([id0, enc('unlocked')])) }]]])
  mapInfo(src, numOf, refMap, trailer)
  return writeDoc(dst, rootNum, trailer)
}

/**
 * Permission flags → /P. perms: {print, printHigh, copy, modify, annotate, fill, assemble, accessibility}
 * (all default true — the password gates opening, flags restrict what readers allow after).
 */
function permBits(perms = {}) {
  const on = (k) => perms[k] !== false
  let p = 0xfffff0c0 | 0 // reserved bits set, 1-2 clear
  if (on('print')) p |= 1 << 2
  if (on('modify')) p |= 1 << 3
  if (on('copy')) p |= 1 << 4
  if (on('annotate')) p |= 1 << 5
  if (on('fill')) p |= 1 << 8
  if (on('accessibility')) p |= 1 << 9
  if (on('assemble')) p |= 1 << 10
  if (on('print') && perms.printHigh !== false) p |= 1 << 11
  return p | 0
}

/**
 * Password-protect a PDF.
 * opts.method: 'aes256' (default, R6) | 'aes128' (R4) | 'rc4' (R3, legacy)
 * opts.ownerPwd: defaults to userPwd. opts.perms: see permBits.
 * An empty user password + owner password = opens freely, restrictions apply.
 */
async function protectPdf(bytes, userPwd, { ownerPwd, method = 'aes256', perms } = {}) {
  let src = await parsePdf(bytes, [], true)
  if (get(src.trailer, 'Encrypt')) throw new Error('this PDF is already protected — unlock it first')
  const dst = newDoc()
  const { numOf, refMap, rootNum } = cloneDoc(src, dst)
  const P = permBits(perms)
  const owner = ownerPwd || userPwd
  const srcId = get(src.trailer, 'ID')
  const id0 = Array.isArray(srcId) && srcId[0]?.bytes?.length ? srcId[0].bytes.slice(0, 16) : randomBytes(16)
  const id1 = randomBytes(16)
  let sec, encDict
  if (method === 'aes256') {
    const fileKey = randomBytes(32)
    const upw = pwdUtf8(userPwd), opw = pwdUtf8(owner)
    const uvs = randomBytes(8), uks = randomBytes(8), ovs = randomBytes(8), oks = randomBytes(8)
    const none = new Uint8Array(0)
    const U = concat([hash2B(upw, uvs, none, 6), uvs, uks])
    const UE = aesCbcEncrypt(hash2B(upw, uks, none, 6), ZERO_IV, fileKey, false)
    const O = concat([hash2B(opw, ovs, U, 6), ovs, oks])
    const OE = aesCbcEncrypt(hash2B(opw, oks, U, 6), ZERO_IV, fileKey, false)
    const permsBlock = concat([le32(P), new Uint8Array([255, 255, 255, 255]), enc('Tadb'), randomBytes(4)])
    const Perms = aesCbcEncrypt(fileKey, ZERO_IV, permsBlock, false)
    sec = { fileKey, stm: 'AESV3', str: 'AESV3', encryptMeta: true }
    encDict = new Map([
      ['Filter', name('Standard')], ['V', 5], ['R', 6], ['Length', 256], ['P', P],
      ['CF', new Map([['StdCF', new Map([['AuthEvent', name('DocOpen')], ['CFM', name('AESV3')], ['Length', 32]])]])],
      ['StmF', name('StdCF')], ['StrF', name('StdCF')],
      ['O', { k: 'x', bytes: O }], ['U', { k: 'x', bytes: U }],
      ['OE', { k: 'x', bytes: OE }], ['UE', { k: 'x', bytes: UE }], ['Perms', { k: 'x', bytes: Perms }],
    ])
  } else {
    const R = method === 'aes128' ? 4 : 3
    const uPad = pwdPad(userPwd)
    const O = computeO(pwdPad(owner), uPad, 16, R)
    const fileKey = computeFileKey(uPad, O, P, id0, 16, R, true)
    const U = computeU(fileKey, id0, R)
    const m = method === 'aes128' ? 'AESV2' : 'RC4'
    sec = { fileKey, stm: m, str: m, encryptMeta: true }
    encDict = new Map([['Filter', name('Standard')], ['V', R === 4 ? 4 : 2], ['R', R], ['Length', 128], ['P', P],
      ['O', { k: 'x', bytes: O }], ['U', { k: 'x', bytes: U }]])
    if (R === 4) {
      encDict.set('CF', new Map([['StdCF', new Map([['AuthEvent', name('DocOpen')], ['CFM', name('AESV2')], ['Length', 16]])]]))
      encDict.set('StmF', name('StdCF'))
      encDict.set('StrF', name('StdCF'))
    }
  }
  for (const [num, v] of dst.objects) cryptObject(v, num, 0, sec, true)
  const encNum = dst.alloc()
  dst.set(encNum, encDict)
  const trailer = new Map([['Encrypt', ref(encNum, 0)], ['ID', [{ k: 'x', bytes: id0 }, { k: 'x', bytes: id1 }]]])
  mapInfo(src, numOf, refMap, trailer)
  src = null
  return writeDoc(dst, rootNum, trailer)
}

// ---- src/pdf/stamp.js ----
// Everything that draws ON pages: page numbers, watermarks and the editor's
// annotation export. One rebuild pass (stampPages) appends generated content
// streams, merges resources and can add real PDF annotations (notes, links).

/** Display→user position + counter-rotation matrix for /Rotate'd pages. */
function stampPos(rot, xd, yd, w, hh) {
  return rot === 90 ? [w - yd, xd, [0, 1, -1, 0]]
    : rot === 180 ? [w - xd, hh - yd, [-1, 0, 0, -1]]
    : rot === 270 ? [yd, hh - xd, [0, -1, 1, 0]]
    : [xd, yd, [1, 0, 0, 1]]
}

const fmt = (v) => (Number.isFinite(v) ? +v.toFixed(3) : 0)

/** Standard font face → base font name. family: helv|times|courier. */
function stdFont(family = 'helv', bold = false, italic = false) {
  if (family === 'helvb') { family = 'helv'; bold = true }
  if (family === 'times') return bold ? (italic ? 'Times-BoldItalic' : 'Times-Bold') : (italic ? 'Times-Italic' : 'Times-Roman')
  if (family === 'courier') return bold ? (italic ? 'Courier-BoldOblique' : 'Courier-Bold') : (italic ? 'Courier-Oblique' : 'Courier')
  return bold ? (italic ? 'Helvetica-BoldOblique' : 'Helvetica-Bold') : (italic ? 'Helvetica-Oblique' : 'Helvetica')
}
const fontDict = (base) => new Map([
  ['Type', name('Font')], ['Subtype', name('Type1')], ['BaseFont', name(base)], ['Encoding', name('WinAnsiEncoding')],
])

/** WinAnsi literal string operand; unmappable chars become '?'. */
function winStr(s) {
  let out = '('
  for (const ch of s) {
    const b = toWinAnsi(ch)?.[0] ?? 0x3f
    if (b === 0x28 || b === 0x29 || b === 0x5c) out += '\\' + String.fromCharCode(b)
    else if (b >= 0x20 && b < 0x7f) out += String.fromCharCode(b)
    else out += '\\' + b.toString(8).padStart(3, '0')
  }
  return out + ')'
}
/** Text width in pt for a standard font (unmappable chars measured as '?'). */
function textWidth(base, s, size) {
  const bytes = []
  for (const ch of s) bytes.push(toWinAnsi(ch)?.[0] ?? 0x3f)
  return stdWidth(base, bytes, size)
}

/** '#rrggbb' or [r,g,b] (0-1) → 'r g b' or null. */
function rgbOp(c) {
  if (Array.isArray(c) && c.length >= 3) return c.slice(0, 3).map((v) => fmt(Math.min(1, Math.max(0, v)))).join(' ')
  const m = typeof c === 'string' ? c.match(/^#([0-9a-f]{6})$/i) : null
  if (!m) return null
  const n = parseInt(m[1], 16)
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255].map((v) => fmt(v)).join(' ')
}

/**
 * Build an image XObject in dst from {jpeg} or {rgba, w, h} (alpha → /SMask).
 * Returns the ref.
 */
async function imageXObject(dst, img) {
  if (img.jpeg instanceof Uint8Array) {
    const info = jpegInfo(img.jpeg)
    const d = new Map([
      ['Type', name('XObject')], ['Subtype', name('Image')], ['Width', info.width], ['Height', info.height],
      ['ColorSpace', name(info.colorSpace)], ['BitsPerComponent', 8], ['Filter', name('DCTDecode')],
    ])
    if (info.colorSpace === 'DeviceCMYK' && info.adobe) d.set('Decode', [1, 0, 1, 0, 1, 0, 1, 0])
    const num = dst.alloc()
    dst.set(num, stream(d, img.jpeg))
    return ref(num, 0)
  }
  const { rgba, w, h } = img
