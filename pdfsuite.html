  const rgb = new Uint8Array(w * h * 3)
  const alpha = new Uint8Array(w * h)
  let hasAlpha = false
  for (let i = 0, j = 0; i < w * h; i++, j += 4) {
    rgb[i * 3] = rgba[j]; rgb[i * 3 + 1] = rgba[j + 1]; rgb[i * 3 + 2] = rgba[j + 2]
    alpha[i] = rgba[j + 3]
    if (rgba[j + 3] !== 255) hasAlpha = true
  }
  const d = new Map([
    ['Type', name('XObject')], ['Subtype', name('Image')], ['Width', w], ['Height', h],
    ['ColorSpace', name('DeviceRGB')], ['BitsPerComponent', 8], ['Filter', name('FlateDecode')],
  ])
  if (hasAlpha) {
    const sm = dst.alloc()
    dst.set(sm, stream(new Map([
      ['Type', name('XObject')], ['Subtype', name('Image')], ['Width', w], ['Height', h],
      ['ColorSpace', name('DeviceGray')], ['BitsPerComponent', 8], ['Filter', name('FlateDecode')],
    ]), await deflate(alpha)))
    d.set('SMask', ref(sm, 0))
  }
  const num = dst.alloc()
  dst.set(num, stream(d, await deflate(rgb)))
  return ref(num, 0)
}

/**
 * Rebuild `bytes` stamping generated content on each page.
 * stampFor(ctx) → {content, res?: {Font?, ExtGState?, XObject?}, under?, annots?: Map[]} | null
 * (may be async). ctx = {leaf, i, total, mb, rot, w, hh, dw, dh, dst}.
 * The original content is wrapped in q…Q so its leftover graphics state
 * (an unbalanced cm, a clip) can never shift or hide the stamp.
 */
async function stampPages(bytes, stampFor, { pages = null } = {}) {
  const src = bytes instanceof Uint8Array ? await parsePdf(bytes) : bytes // a parsed (possibly pre-edited) doc is fine too
  const leaves = pageLeaves(src)
  const dst = newDoc()
  const pagesRef = dst.alloc()
  const kids = []
  const refMap = new Map()
  const nums = leaves.map((leaf) => {
    const num = dst.alloc()
    kids.push(ref(num, 0))
    if (isRef(leaf.ref)) refMap.set(`${leaf.ref.n} ${leaf.ref.g}`, ref(num, 0))
    return num
  })
  let qNum = 0, QNum = 0
  const qq = () => {
    if (!qNum) {
      qNum = dst.alloc(); dst.set(qNum, stream(new Map(), enc('q\n')))
      QNum = dst.alloc(); dst.set(QNum, stream(new Map(), enc('\nQ\n')))
    }
  }
  for (let i = 0; i < leaves.length; i++) {
    const leaf = leaves[i]
    const pageDict = new Map()
    for (const k of INHERITED) {
      const v = get(leaf.dict, k) ?? leaf.inh[k]
      if (v !== undefined) pageDict.set(k, copyValue(v, src, dst, refMap))
    }
    for (const [k, val] of leaf.dict) {
      if (k === 'Parent' || k === 'Metadata' || INHERITED.includes(k)) continue
      pageDict.set(k, copyValue(val, src, dst, refMap))
    }
    pageDict.set('Type', name('Page'))
    pageDict.set('Parent', ref(pagesRef, 0))
    // the VISIBLE box (CropBox ∩ MediaBox) — what viewers and our editor show
    const mb = pageBox(src, leaf)
    const rot = pageRotation(src, leaf)
    const w = mb[2] - mb[0], hh = mb[3] - mb[1]
    const dw = rot % 180 === 0 ? w : hh
    const dh = rot % 180 === 0 ? hh : w
    const stamp = pages && !pages.includes(i) ? null
      : await stampFor({ leaf, i, total: leaves.length, mb, rot, w, hh, dw, dh, dst })
    if (stamp && (stamp.content || stamp.annots?.length)) {
      if (stamp.content) {
        const csNum = dst.alloc()
        dst.set(csNum, stream(new Map(), enc(stamp.content)))
        let contents = pageDict.get('Contents')
        if (isRef(contents)) { // qpdf-style: Contents → ref TO an array
          const c = dst.objects.get(contents.n)
          if (Array.isArray(c)) contents = c
        }
        const orig = Array.isArray(contents) ? contents.slice() : contents !== undefined && contents !== null ? [contents] : []
        let arr
        if (stamp.under) arr = [ref(csNum, 0), ...orig]
        else if (orig.length) { qq(); arr = [ref(qNum, 0), ...orig, ref(QNum, 0), ref(csNum, 0)] }
        else arr = [ref(csNum, 0)]
        pageDict.set('Contents', arr.length === 1 ? arr[0] : arr)
        let res = pageDict.get('Resources')
        if (isRef(res)) res = dst.objects.get(res.n)
        // clone before mutating: shared Resources dicts must not leak across pages
        res = res instanceof Map ? new Map(res) : new Map()
        for (const [section, entries] of Object.entries(stamp.res ?? {})) {
          let sec = res.get(section)
          if (isRef(sec)) sec = dst.objects.get(sec.n)
          sec = sec instanceof Map ? new Map(sec) : new Map()
          for (const [nm, val] of Object.entries(entries)) sec.set(nm, val)
          res.set(section, sec)
        }
        pageDict.set('Resources', res)
      }
      if (stamp.annots?.length) {
        let an = pageDict.get('Annots')
        if (isRef(an)) an = dst.objects.get(an.n)
        const list = Array.isArray(an) ? an.slice() : []
        for (const a of stamp.annots) {
          const n = dst.alloc()
          a.set('P', ref(nums[i], 0))
          dst.set(n, a)
          list.push(ref(n, 0))
        }
        pageDict.set('Annots', list)
      }
    }
    dst.set(nums[i], pageDict)
  }
  return finishDoc(dst, pagesRef, kids, src, refMap)
}

/** Which 0-based page indices a page selector covers. sel: 'all'|'odd'|'even'|number[] (1-based). */
function selectPages(sel, total) {
  if (Array.isArray(sel)) return sel.map((p) => p - 1).filter((i) => i >= 0 && i < total)
  const all = Array.from({ length: total }, (_, i) => i)
  if (sel === 'odd') return all.filter((i) => i % 2 === 0)
  if (sel === 'even') return all.filter((i) => i % 2 === 1)
  return all
}

/**
 * Stamp page numbers.
 * opts: pos (tl|tc|tr|bl|bc|br), fmt ('n-of-total'|'n'|'page-n'|'page-n-of-total'|'custom'),
 * fmtStr ({n},{t}), start, skipFirst, size, margin, font, bold, color, mirror (swap l/r on even pages),
 * pages ('all'|'odd'|'even'|number[]).
 */
async function addPageNumbers(bytes, opts = {}) {
  const {
    pos = 'bc', fmt: style = 'n-of-total', fmtStr = '{n}', start = 1, skipFirst = false, size = 10,
    margin = 18, font = 'helv', bold = false, color = '#000000', mirror = false, pages: sel = 'all',
  } = opts
  const base = stdFont(font, bold)
  const label = (i, total) => {
    const n = i + start - (skipFirst ? 1 : 0)
    const t = total - (skipFirst ? 1 : 0) + start - 1
    if (style === 'custom') return (fmtStr || '{n}').replaceAll('{n}', String(n)).replaceAll('{t}', String(t))
    if (style === 'n') return String(n)
    if (style === 'page-n') return `Page ${n}`
    if (style === 'page-n-of-total') return `Page ${n} of ${t}`
    return `${n} / ${t}`
  }
  const col = rgbOp(color) ?? '0 0 0'
  let wanted = null
  return stampPages(bytes, ({ i, total, mb, rot, w, hh, dw, dh }) => {
    wanted ??= new Set(selectPages(sel, total))
    if ((i === 0 && skipFirst) || !wanted.has(i)) return null
    const s = label(i, total)
    const tw = textWidth(base, s, size)
    let side = pos[1]
    if (mirror && i % 2 === 1 && side !== 'c') side = side === 'l' ? 'r' : 'l'
    const xd = side === 'l' ? margin : side === 'r' ? dw - margin - tw : dw / 2 - tw / 2
    const yd = pos[0] === 't' ? dh - margin - size * 0.72 : margin
    const [xu, yu, m] = stampPos(rot, xd, yd, w, hh)
    return {
      content: `\nq ${m.join(' ')} ${fmt(mb[0] + xu)} ${fmt(mb[1] + yu)} cm ${col} rg BT /PSNum ${fmt(size)} Tf 0 0 Td ${winStr(s)} Tj ET Q\n`,
      res: { Font: { PSNum: fontDict(base) } },
    }
  })
}

/**
 * Watermark every (selected) page with text or an image.
 * opts: text, size, font, bold, opacity, color, angle (deg, display space; negative ↗),
 * layout ('center'|'tile'), under (behind content), image ({jpeg}|{rgba,w,h}), imageScale (fraction of page width),
 * pages selector.
 */
async function watermarkPdf(bytes, opts = {}) {
  const {
    text = 'CONFIDENTIAL', size = 48, font = 'helv', bold = true, opacity = 0.25, color = [0.62, 0.1, 0.1],
    angle = -45, layout = 'center', under = false, image = null, imageScale = 0.5, pages: sel = 'all',
  } = opts
  const base = stdFont(font, bold)
  const col = rgbOp(color) ?? '0.62 0.1 0.1'
  const th = (angle * Math.PI) / 180
  const R = [Math.cos(th), Math.sin(th), -Math.sin(th), Math.cos(th)]
  const tw = textWidth(base, text, size)
  let imRef = null, imDims = null, wanted = null
  return stampPages(bytes, async ({ i, total, mb, rot, w, hh, dw, dh, dst }) => {
    wanted ??= new Set(selectPages(sel, total))
    if (!wanted.has(i)) return null
    if (image && !imRef) {
      imRef = await imageXObject(dst, image)
      imDims = image.jpeg ? jpegInfo(image.jpeg) : { width: image.w, height: image.h }
    }
    const dispLin = rot === 90 ? [0, 1, 1, 0] : rot === 180 ? [-1, 0, 0, 1] : rot === 270 ? [0, -1, -1, 0] : [1, 0, 0, -1]
    // after `wrap`, coordinates are display space (top-left origin, y down)
    const [xu0, yu0] = stampPos(rot, 0, dh, w, hh)
    const wrap = `${dispLin.join(' ')} ${fmt(mb[0] + xu0)} ${fmt(mb[1] + yu0)} cm`
    const centers = []
    if (layout === 'tile') {
      const stepX = Math.max(tw, size * 4) * 1.4, stepY = Math.max(size * 5, tw * 0.6)
      for (let y = stepY / 2; y < dh + stepY; y += stepY)
        for (let x = ((Math.round(y / stepY) % 2) * stepX) / 2; x < dw + stepX; x += stepX) centers.push([x, y])
    } else centers.push([dw / 2, dh / 2])
    const parts = []
    for (const [cx, cy] of centers) {
      // display space is y-down, so a negative angle tilts the baseline up-right (↗)
      const m = R
      if (imRef) {
        const iw = dw * imageScale, ih = (iw * imDims.height) / imDims.width
        parts.push(`q ${m.map(fmt).join(' ')} ${fmt(cx)} ${fmt(cy)} cm ${fmt(iw)} 0 0 ${fmt(-ih)} ${fmt(-iw / 2)} ${fmt(ih / 2)} cm /PSWmIm Do Q`)
      } else {
        // text needs y-up glyphs: flip back inside the rotated frame
        parts.push(`q ${m.map(fmt).join(' ')} ${fmt(cx)} ${fmt(cy)} cm 1 0 0 -1 0 0 cm BT /PSWm ${fmt(size)} Tf ${fmt(-tw / 2)} ${fmt(-size * 0.35)} Td ${winStr(text)} Tj ET Q`)
      }
    }
    const res = { ExtGState: { PSWmGS: new Map([['ca', opacity], ['CA', opacity]]) } }
    if (imRef) res.XObject = { PSWmIm: imRef }
    else res.Font = { PSWm: fontDict(base) }
    return {
      content: `\nq ${wrap} /PSWmGS gs ${col} rg ${parts.join(' ')} Q\n`,
      res,
      under,
    }
  })
}

const KAPPA = 0.5523

/** SVG-ish path segs (display space) → PDF path operators. */
function pathOps(segs) {
  return segs.map((s) => {
    if (s[0] === 'M') return `${fmt(s[1])} ${fmt(s[2])} m`
    if (s[0] === 'L') return `${fmt(s[1])} ${fmt(s[2])} l`
    if (s[0] === 'C') return `${fmt(s[1])} ${fmt(s[2])} ${fmt(s[3])} ${fmt(s[4])} ${fmt(s[5])} ${fmt(s[6])} c`
    if (s[0] === 'Z') return 'h'
    return ''
  }).join(' ')
}

/**
 * Bake editor annotations into pages as real PDF operators / annotations.
 * pagesAnnots[p] (0-based) = [{t, ...}] in DISPLAY-space pt (top-left origin, y down).
 *  stroke {pts,color,width} · vstroke {pts:[x,y,w]} · highlight {pts,color,width}
 *  line {x1,y1,x2,y2,color,width,arrow?,arrowStart?,dash?}
 *  rect/ellipse {x,y,w,h,stroke,fill,lw,dash?,radius?}
 *  path {segs:[['M',x,y],['L',x,y],['C',…],['Z']], stroke?, fill?, lw?}
 *  text {x,y,text,size,font,bold?,italic?,color,align?,w?,underline?,strike?,bg?,lineHeight?}
 *    x,y = top-left of the first line; baseline = y + size·0.8 (ascent); leading = size·lineHeight
 *  image {x,y,w,h, jpeg | rgba+iw+ih}
 *  note {x,y,text,color} → real /Text (sticky note) annotation
 *  link {x,y,w,h,url} → real /Link annotation
 * Every shape may carry alpha (0-1) and rot (radians, about its box centre).
 */
async function annotatePdf(bytes, pagesAnnots) {
  return stampPages(bytes, async ({ i, mb, rot, w, hh, dh, dst }) => {
    const anns = pagesAnnots?.[i]
    if (!Array.isArray(anns) || !anns.length) return null
    const dispLin = rot === 90 ? [0, 1, 1, 0] : rot === 180 ? [-1, 0, 0, 1] : rot === 270 ? [0, -1, -1, 0] : [1, 0, 0, -1]
    const [xu0, yu0] = stampPos(rot, 0, dh, w, hh)
    const wrap = `${dispLin.join(' ')} ${fmt(mb[0] + xu0)} ${fmt(mb[1] + yu0)} cm`
    // display (y-down) point → default user space, for annotation /Rect
    const toUser = (x, y) => {
      const [ux, uy] = stampPos(rot, x, dh - y, w, hh)
      return [mb[0] + ux, mb[1] + uy]
    }
    const res = {}
    const ops = []
    const annots = []
    let gsN = 0, imN = 0
    const gsFor = (alpha, multiply) => {
      const d = new Map([['ca', alpha], ['CA', alpha]])
      if (multiply) d.set('BM', name('Multiply'))
      const nm = `ANN_GS${++gsN}`
      ;(res.ExtGState ??= {})[nm] = d
      return `/${nm} gs`
    }
    const pt2 = (p) => Array.isArray(p) && Number.isFinite(p[0]) && Number.isFinite(p[1])
    const num = (v) => (Number.isFinite(v) ? fmt(v) : '0')
    for (const a of anns) {
      if (!a || typeof a !== 'object') continue
      const alpha = typeof a.alpha === 'number' ? Math.min(1, Math.max(0, a.alpha)) : null
      const color = rgbOp(a.color)
      const parts = []
      // optional rotation about the shape's centre
      let pre = ''
      if (a.rot && Number.isFinite(a.rot) && [a.x, a.y, a.w, a.h].every(Number.isFinite)) {
        const cx = a.x + a.w / 2, cy = a.y + a.h / 2
        const c = Math.cos(a.rot), s = Math.sin(a.rot)
        pre = `1 0 0 1 ${num(cx)} ${num(cy)} cm ${num(c)} ${num(s)} ${num(-s)} ${num(c)} 0 0 cm 1 0 0 1 ${num(-cx)} ${num(-cy)} cm`
      }
      const dashOp = Array.isArray(a.dash) && a.dash.length ? `[${a.dash.map(num).join(' ')}] 0 d` : ''
      switch (a.t) {
        case 'stroke':
        case 'highlight': {
          if (!color || !Array.isArray(a.pts) || a.pts.length < 1 || !a.pts.every(pt2)) break
          const w0 = a.t === 'highlight' ? (a.width ?? 12) : (a.width ?? 2)
          const path = a.pts.length === 1
            ? `${num(a.pts[0][0])} ${num(a.pts[0][1])} m ${num(a.pts[0][0] + 0.01)} ${num(a.pts[0][1])} l`
            : a.pts.map((p, k) => `${num(p[0])} ${num(p[1])} ${k ? 'l' : 'm'}`).join(' ')
          parts.push(`${color} RG ${num(w0)} w ${a.t === 'highlight' ? '0 J' : '1 J'} 1 j ${path} S`)
          break
        }
        case 'vstroke': {
          if (!color || !Array.isArray(a.pts) || a.pts.length < 1) break
          const segs = []
          for (let k = 0; k + 1 < a.pts.length; k++) {
            const [p, q] = [a.pts[k], a.pts[k + 1]]
            if (!pt2(p) || !pt2(q)) continue
            const sw = Math.min(60, Math.max(0.3, typeof p[2] === 'number' ? (p[2] + (q[2] ?? p[2])) / 2 : 1))
            segs.push(`${num(sw)} w ${num(p[0])} ${num(p[1])} m ${num(q[0])} ${num(q[1])} l S`)
          }
          if (!segs.length && a.pts.length === 1 && pt2(a.pts[0])) {
            const p = a.pts[0]
            const sw = Math.min(60, Math.max(0.3, typeof p[2] === 'number' ? p[2] : 1))
            segs.push(`${num(sw)} w ${num(p[0])} ${num(p[1])} m ${num(p[0] + 0.01)} ${num(p[1])} l S`)
          }
          if (!segs.length) break
          parts.push(`${color} RG 1 J 1 j ${segs.join(' ')}`)
          break
        }
        case 'line': {
          if (!color || ![a.x1, a.y1, a.x2, a.y2].every(Number.isFinite)) break
          const lw = typeof a.width === 'number' && a.width > 0 ? a.width : 2
          const head = (x1, y1, x2, y2) => {
            const ang = Math.atan2(y2 - y1, x2 - x1)
            const L = Math.min(60, Math.max(6, 3 * lw))
            const [bx, by] = [x2 - L * Math.cos(ang), y2 - L * Math.sin(ang)]
            const [px, py] = [-Math.sin(ang) * L * 0.45, Math.cos(ang) * L * 0.45]
            return `${color} rg ${num(x2)} ${num(y2)} m ${num(bx + px)} ${num(by + py)} l ${num(bx - px)} ${num(by - py)} l h f`
          }
          // shorten the shaft under arrowheads so the round cap doesn't poke through
          const ang = Math.atan2(a.y2 - a.y1, a.x2 - a.x1)
          const L = Math.min(60, Math.max(6, 3 * lw)) * 0.6
          const ex = a.arrow ? a.x2 - L * Math.cos(ang) : a.x2, ey = a.arrow ? a.y2 - L * Math.sin(ang) : a.y2
          const sx = a.arrowStart ? a.x1 + L * Math.cos(ang) : a.x1, sy = a.arrowStart ? a.y1 + L * Math.sin(ang) : a.y1
          parts.push(`${color} RG ${num(lw)} w 1 J ${dashOp} ${num(sx)} ${num(sy)} m ${num(ex)} ${num(ey)} l S`)
          if (a.arrow) parts.push(head(a.x1, a.y1, a.x2, a.y2))
          if (a.arrowStart) parts.push(head(a.x2, a.y2, a.x1, a.y1))
          break
        }
        case 'rect':
        case 'ellipse': {
          if (![a.x, a.y, a.w, a.h].every(Number.isFinite)) break
          const fill = rgbOp(a.fill), strokeC = rgbOp(a.stroke)
          if (!fill && !strokeC) break
          const lw = typeof a.lw === 'number' && a.lw > 0 ? a.lw : 1
          let path
          if (a.t === 'rect' && a.radius > 0) {
            const r = Math.min(a.radius, a.w / 2, a.h / 2), k = r * (1 - KAPPA)
            const [x0, y0, x1, y1] = [a.x, a.y, a.x + a.w, a.y + a.h]
            path = `${num(x0 + r)} ${num(y0)} m ${num(x1 - r)} ${num(y0)} l ${num(x1 - k)} ${num(y0)} ${num(x1)} ${num(y0 + k)} ${num(x1)} ${num(y0 + r)} c ` +
              `${num(x1)} ${num(y1 - r)} l ${num(x1)} ${num(y1 - k)} ${num(x1 - k)} ${num(y1)} ${num(x1 - r)} ${num(y1)} c ` +
              `${num(x0 + r)} ${num(y1)} l ${num(x0 + k)} ${num(y1)} ${num(x0)} ${num(y1 - k)} ${num(x0)} ${num(y1 - r)} c ` +
              `${num(x0)} ${num(y0 + r)} l ${num(x0)} ${num(y0 + k)} ${num(x0 + k)} ${num(y0)} ${num(x0 + r)} ${num(y0)} c h`
          } else if (a.t === 'rect') {
            path = `${num(a.x)} ${num(a.y)} ${num(a.w)} ${num(a.h)} re`
          } else {
            const [cx, cy, rx, ry, k] = [a.x + a.w / 2, a.y + a.h / 2, a.w / 2, a.h / 2, KAPPA]
            path =
              `${num(cx + rx)} ${num(cy)} m ` +
              `${num(cx + rx)} ${num(cy - k * ry)} ${num(cx + k * rx)} ${num(cy - ry)} ${num(cx)} ${num(cy - ry)} c ` +
              `${num(cx - k * rx)} ${num(cy - ry)} ${num(cx - rx)} ${num(cy - k * ry)} ${num(cx - rx)} ${num(cy)} c ` +
              `${num(cx - rx)} ${num(cy + k * ry)} ${num(cx - k * rx)} ${num(cy + ry)} ${num(cx)} ${num(cy + ry)} c ` +
              `${num(cx + k * rx)} ${num(cy + ry)} ${num(cx + rx)} ${num(cy + k * ry)} ${num(cx + rx)} ${num(cy)} c h`
          }
          const paint = fill && strokeC ? 'B' : fill ? 'f' : 'S'
          parts.push(`${fill ? `${fill} rg ` : ''}${strokeC ? `${strokeC} RG ` : ''}${num(lw)} w ${dashOp} ${path} ${paint}`)
          break
        }
        case 'path': {
          if (!Array.isArray(a.segs) || !a.segs.length) break
          const fill = rgbOp(a.fill), strokeC = rgbOp(a.stroke ?? a.color)
          if (!fill && !strokeC) break
          const lw = typeof a.lw === 'number' && a.lw > 0 ? a.lw : 1.5
          const paint = fill && strokeC ? 'B' : fill ? 'f' : 'S'
          parts.push(`${fill ? `${fill} rg ` : ''}${strokeC ? `${strokeC} RG ` : ''}${num(lw)} w 1 J 1 j ${pathOps(a.segs)} ${paint}`)
          break
        }
        case 'text': {
          const size = typeof a.size === 'number' && a.size > 0 ? a.size : null
          if (!color || !size || typeof a.text !== 'string' || !a.text.length || ![a.x, a.y].every(Number.isFinite)) break
          const base = stdFont(a.font, !!a.bold, !!a.italic)
          const fname = `ANN_${base.replace(/[^A-Za-z]/g, '')}`
          ;(res.Font ??= {})[fname] = fontDict(base)
          const lead = size * (a.lineHeight ?? 1.2)
          const lines = a.text.split('\n')
          const widths = lines.map((l) => textWidth(base, l, size))
          const boxW = Number.isFinite(a.w) && a.w > 0 ? a.w : Math.max(...widths)
          if (a.bg) {
            const bg = rgbOp(a.bg)
            if (bg) parts.push(`${bg} rg ${num(a.x - 2)} ${num(a.y - 1)} ${num(boxW + 4)} ${num(lines.length * lead + 2)} re f`)
          }
          lines.forEach((line, li) => {
            const lx = a.align === 'center' ? a.x + (boxW - widths[li]) / 2 : a.align === 'right' ? a.x + boxW - widths[li] : a.x
            const by = a.y + size * 0.8 + li * lead // baseline (ascent ≈ 0.8em for the standard fonts)
            // glyphs need y-up: local flip at the baseline
            if (line.length) parts.push(`${color} rg BT /${fname} ${num(size)} Tf 1 0 0 -1 ${num(lx)} ${num(by)} Tm ${winStr(line)} Tj ET`)
            const deco = []
            if (a.underline) deco.push(by + size * 0.12)
            if (a.strike) deco.push(by - size * 0.28)
            for (const yy of deco) parts.push(`${color} RG ${num(Math.max(0.5, size / 16))} w ${num(lx)} ${num(yy)} m ${num(lx + widths[li])} ${num(yy)} l S`)
          })
          break
        }
        case 'image': {
          if (![a.x, a.y, a.w, a.h].every(Number.isFinite)) break
          let r
          try {
            if (a.jpeg instanceof Uint8Array) r = await imageXObject(dst, { jpeg: a.jpeg })
            else if (a.rgba && a.iw && a.ih) r = await imageXObject(dst, { rgba: a.rgba, w: a.iw, h: a.ih })
            else break
          } catch { break }
          const nm = `ANN_Im${++imN}`
          ;(res.XObject ??= {})[nm] = r
          parts.push(`${num(a.w)} 0 0 ${num(-a.h)} ${num(a.x)} ${num(a.y + a.h)} cm /${nm} Do`)
          break
        }
        case 'note': {
          if (![a.x, a.y].every(Number.isFinite)) break
          const [ux, uy] = toUser(a.x, a.y)
          const c = rgbOp(a.color ?? '#ffd43b')?.split(' ').map(Number) ?? [1, 0.83, 0.23]
          annots.push(new Map([
            ['Type', name('Annot')], ['Subtype', name('Text')], ['Rect', [fmt(ux), fmt(uy - 20), fmt(ux + 20), fmt(uy)]],
            ['Contents', textString(String(a.text ?? ''))], ['Name', name('Comment')], ['C', c], ['F', 4],
            ['T', textString(a.author || 'PDFSuite')], ['Open', false],
          ]))
          break
        }
        case 'link': {
          if (![a.x, a.y, a.w, a.h].every(Number.isFinite) || typeof a.url !== 'string' || !a.url) break
          const [x1, y1] = toUser(a.x, a.y), [x2, y2] = toUser(a.x + a.w, a.y + a.h)
          const url = /^[a-z][a-z0-9+.-]*:/i.test(a.url) ? a.url : `https://${a.url}`
          annots.push(new Map([
            ['Type', name('Annot')], ['Subtype', name('Link')],
            ['Rect', [fmt(Math.min(x1, x2)), fmt(Math.min(y1, y2)), fmt(Math.max(x1, x2)), fmt(Math.max(y1, y2))]],
            ['Border', [0, 0, 0]], ['F', 4],
            ['A', new Map([['S', name('URI')], ['URI', { k: 's', bytes: enc(url) }]])],
          ]))
          break
        }
      }
      if (parts.length) {
        const needsGs = a.t === 'highlight' || (alpha !== null && alpha < 1)
        const gs = needsGs ? gsFor(alpha ?? 0.35, a.t === 'highlight') : ''
        ops.push(`q ${wrap} ${[pre, gs, ...parts].filter(Boolean).join(' ')} Q`)
      }
    }
    // leading \n keeps our first op from fusing with the previous stream's last token
    return ops.length || annots.length ? { content: ops.length ? '\n' + ops.join('\n') + '\n' : '', res, annots } : null
  })
}

// ---- src/pdf/redact.js ----
// True redaction + text erasing by rewriting content streams.
// Glyphs whose centres fall inside a region are REMOVED from the Tj/TJ
// operators (replaced by spacing so the rest of the line keeps its place);
// image pixels under the region are painted out and the image re-encoded;
// links/comments over the region go. Nothing hidden "under a black box".

const inRect = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h
const rectsHit = (b, r) => b[0] < r.x + r.w && b[2] > r.x && b[1] < r.y + r.h && b[3] > r.y

/** Serialize a PDF string operand (literal, escaped). */
function strOperand(bytes) {
  let s = '('
  for (const b of bytes) {
    if (b === 0x28 || b === 0x29 || b === 0x5c) s += '\\' + String.fromCharCode(b)
    else if (b < 0x20 || b > 0x7e) s += '\\' + b.toString(8).padStart(3, '0')
    else s += String.fromCharCode(b)
  }
  return s + ')'
}
const fnum = (v) => (Number.isFinite(v) ? String(+v.toFixed(4)) : '0')

/**
 * Rebuild one text-showing operator with some glyphs removed.
 * tok: tokenizer op; parts: Map<partIndex, {fs, th, glyphs, removed:Set<glyphIdx>}>.
 * Returns replacement source text.
 */
function rewriteTextOp(tok, parts) {
  const out = [] // TJ items: strings (bytes) and numbers
  const pushStr = (bytes) => { if (bytes.length) out.push({ s: bytes }) }
  const pushNum = (n) => { if (n) out.push({ n }) }
  const doString = (bytes, part) => {
    const p = parts.get(part)
    if (!p) { pushStr(bytes); return }
    let keep = []
    let gap = 0
    p.glyphs.forEach((g, gi) => {
      if (p.removed.has(gi)) {
        if (keep.length) { pushStr(Uint8Array.from(keep)); keep = [] }
        gap += g.a
      } else {
        if (gap) { pushNum(-(gap * 1000) / (p.fs * p.th || 1)); gap = 0 }
        for (let k = g.b0; k < g.b1; k++) keep.push(bytes[k])
      }
    })
    if (keep.length) pushStr(Uint8Array.from(keep))
    if (gap) pushNum(-(gap * 1000) / (p.fs * p.th || 1))
  }
  let prefix = ''
  if (tok.op === 'TJ') {
    const arr = tok.operands.find((o) => o?.t === 'arr')
    arr?.items.forEach((it, k) => {
      if (it?.t === 'str') doString(it.bytes, k)
      else if (typeof it === 'number') pushNum(it)
    })
  } else {
    const nums = tok.operands.filter((o) => typeof o === 'number')
    if (tok.op === '"' && nums.length >= 2) prefix = `${fnum(nums[0])} Tw ${fnum(nums[1])} Tc `
    if (tok.op === "'" || tok.op === '"') prefix += 'T* '
    const s = [...tok.operands].reverse().find((o) => o?.t === 'str')
    if (s) doString(s.bytes, 0)
  }
  // merge adjacent numbers
  const merged = []
  for (const it of out) {
    const last = merged[merged.length - 1]
    if (it.n !== undefined && last?.n !== undefined) last.n += it.n
    else merged.push({ ...it })
  }
  const body = merged.map((it) => (it.n !== undefined ? fnum(it.n) : strOperand(it.s))).join(' ')
  return `${prefix}[${body}] TJ`
}

/** Paint display-space regions out of an RGBA image drawn with matrix m. */
function blankPixels(im, m, regions, fill) {
  // display → unit square (image space, y up) inverse
  const det = m[0] * m[3] - m[1] * m[2]
  if (!det) return false
  const inv = [m[3] / det, -m[1] / det, -m[2] / det, m[0] / det, (m[2] * m[5] - m[3] * m[4]) / det, (m[1] * m[4] - m[0] * m[5]) / det]
  let touched = false
  const [fr, fg, fb] = fill
  for (const r of regions) {
    const corners = [[r.x, r.y], [r.x + r.w, r.y], [r.x, r.y + r.h], [r.x + r.w, r.y + r.h]].map(([x, y]) => matPt(inv, x, y))
    const ux0 = Math.min(...corners.map((c) => c[0])), ux1 = Math.max(...corners.map((c) => c[0]))
    const uy0 = Math.min(...corners.map((c) => c[1])), uy1 = Math.max(...corners.map((c) => c[1]))
    const px0 = Math.max(0, Math.floor(ux0 * im.w)), px1 = Math.min(im.w, Math.ceil(ux1 * im.w))
    // image row 0 is the TOP (unit y = 1)
    const py0 = Math.max(0, Math.floor((1 - uy1) * im.h)), py1 = Math.min(im.h, Math.ceil((1 - uy0) * im.h))
    for (let y = py0; y < py1; y++) {
      for (let x = px0; x < px1; x++) {
        // exact test for rotated images: pixel centre back to display space
        const [dx, dy] = matPt(m, (x + 0.5) / im.w, 1 - (y + 0.5) / im.h)
        if (!inRect(dx, dy, { x: r.x - 0.5, y: r.y - 0.5, w: r.w + 1, h: r.h + 1 })) continue
        const o = (y * im.w + x) * 4
        im.rgba[o] = fr; im.rgba[o + 1] = fg; im.rgba[o + 2] = fb; im.rgba[o + 3] = 255
        touched = true
      }
    }
  }
  return touched
}

async function rgbaImageStream(im) {
  const rgb = new Uint8Array(im.w * im.h * 3)
  for (let i = 0, j = 0; i < im.w * im.h; i++, j += 4) { rgb[i * 3] = im.rgba[j]; rgb[i * 3 + 1] = im.rgba[j + 1]; rgb[i * 3 + 2] = im.rgba[j + 2] }
  return stream(new Map([
    ['Type', name('XObject')], ['Subtype', name('Image')], ['Width', im.w], ['Height', im.h],
    ['ColorSpace', name('DeviceRGB')], ['BitsPerComponent', 8], ['Filter', name('FlateDecode')],
  ]), await deflate(rgb))
}

/**
 * Apply removals to a parsed doc IN PLACE (call before stamping/serialising).
 * regionsByPage[p] = [{x, y, w, h}] in display space.
 * opts.mode: 'redact' (text + images + annotations, then paint fill) | 'erase' (text only, no box)
 * opts.fill: '#000000' default for redact, null → no box.
 * opts.decodeJpeg(bytes) → Promise<{w,h,rgba}> (browser) for JPEG images under redactions;
 *   without it a JPEG touched by a redaction is removed entirely (safe default).
 * Returns {glyphs, images, annots} counts of what was removed.
 */
async function applyRemovals(doc, regionsByPage, { mode = 'redact', fill = '#000000', decodeJpeg = null } = {}) {
  const leaves = pageLeaves(doc)
  const stats = { glyphs: 0, images: 0, annots: 0 }
  const fillRgb = hexRgb(fill) ?? [0, 0, 0]
  for (let pi = 0; pi < leaves.length; pi++) {
    const regions = (regionsByPage?.[pi] ?? []).filter((r) => r && r.w > 0 && r.h > 0)
    if (!regions.length) continue
    const leaf = leaves[pi]
    const { ops, data, tokens, disp } = await collectDrawOps(doc, leaf, { glyphs: true, annots: false })
    // ---- collect glyph removals per (xpath, op, part) ----
    const perStream = new Map() // xpathKey → Map<opIdx, Map<part, info>>
    for (const o of ops) {
      if (o.t !== 'text' || !o.glyphs?.length) continue
      let rec = null
      o.glyphs.forEach((g, gi) => {
        const [cx, cy] = matPt(o.m, g.x + g.w / 2, o.fs * 0.32)
        if (!regions.some((r) => inRect(cx, cy, r))) return
        if (!rec) {
          const key = o.src.xpath.join('/')
          if (!perStream.has(key)) perStream.set(key, { xpath: o.src.xpath, ops: new Map() })
          const byOp = perStream.get(key).ops
          if (!byOp.has(o.src.op)) byOp.set(o.src.op, new Map())
          rec = { fs: o.fs, th: o.th, glyphs: o.glyphs, removed: new Set() }
          byOp.get(o.src.op).set(o.src.part, rec)
        }
        rec.removed.add(gi)
        stats.glyphs++
      })
    }
    // ---- images (redact mode) ----
    const imageEdits = [] // {xpath, op, newName, stream} | {xpath, op, inline: replacement text}
    if (mode === 'redact') {
      let n = 0
      for (const o of ops) {
        if (o.t !== 'img' || !o.src) continue
        if (!regions.some((r) => rectsHit(o.bbox, r))) continue
        const srcStream = o.ref ?? { dict: o.inline.dict, data: o.inline.data }
        let im = await decodeImage(doc, srcStream, { fill: o.fill, res: o.res, inline: !!o.inline }).catch(() => null)
        if (im?.kind === 'jpeg' && decodeJpeg) {
          const dj = await decodeJpeg(im.data).catch(() => null)
          im = dj ? { kind: 'rgba', ...dj } : null
        }
        const key = o.src.xpath.join('/')
        if (!im || im.kind !== 'rgba') { // can't edit pixels → drop the image entirely
          imageEdits.push({ key, xpath: o.src.xpath, op: o.src.op, drop: true })
          stats.images++
          continue
        }
        if (!blankPixels(im, o.m, regions, fillRgb)) continue
        stats.images++
        const st = await rgbaImageStream(im)
        if (o.inline) imageEdits.push({ key, xpath: o.src.xpath, op: o.src.op, inline: st })
        else imageEdits.push({ key, xpath: o.src.xpath, op: o.src.op, newName: `RDim${pi}_${++n}`, stream: st })
      }
      for (const e of imageEdits) if (!perStream.has(e.key)) perStream.set(e.key, { xpath: e.xpath, ops: new Map() })
    }
    // ---- rewrite every affected stream (page content + nested forms, copy-on-write) ----
    const pageRes = cloneRes(deref(doc, get(leaf.dict, 'Resources') ?? leaf.inh.Resources))
    const rewriteSrc = (src, toks, edits, images) => {
      const reps = []
      for (const [opIdx, parts] of edits) {
        const tok = toks[opIdx]
        if (!tok || !['Tj', 'TJ', "'", '"'].includes(tok.op)) continue
        reps.push([tok.start, tok.end, rewriteTextOp(tok, parts)])
      }
      for (const e of images) {
        const tok = toks[e.op]
        if (!tok) continue
        if (e.drop) reps.push([tok.start, tok.end, ''])
        else if (e.newName) reps.push([tok.start, tok.end, `/${e.newName} Do`])
        else if (e.inline) reps.push([tok.start, tok.end, `/${e.inlineName} Do`])
      }
      reps.sort((a, b) => b[0] - a[0])
      let out = src
      for (const [s0, e0, txt] of reps) out = concat([out.subarray(0, s0), enc(` ${txt} `), out.subarray(e0)])
      return out
    }
    // group by stream key; page content first
    const keys = [...perStream.keys()].sort((a, b) => a.split('/').length - b.split('/').length)
    let newPageContent = data
    for (const key of keys) {
      const { xpath, ops: edits } = perStream.get(key)
      const images = imageEdits.filter((e) => e.key === key)
      // new image XObjects go into the resources of the stream that draws them
      if (!xpath.length) {
        for (const e of images) {
          if (e.newName) addXObject(pageRes, e.newName, e.stream)
          if (e.inline) { e.inlineName = `RDin${pi}_${e.op}`; addXObject(pageRes, e.inlineName, e.inline) }
        }
        newPageContent = rewriteSrc(data, tokens, edits, images)
        continue
      }
      // nested form: walk the resource chain, cloning each form on the way (copy-on-write)
      let res = pageRes
      let form = null
      for (const nm of xpath) {
        const xo = deref(doc, res.get('XObject'))
        const fv = xo instanceof Map ? deref(doc, xo.get(nm)) : null
        if (!isStream(fv)) { form = null; break }
        const copy = { k: 't', dict: new Map(fv.dict), data: fv.data }
        const subRes = cloneRes(deref(doc, get(fv.dict, 'Resources')) ?? res)
        copy.dict.set('Resources', subRes)
        const xoCopy = new Map(xo)
        xoCopy.set(nm, copy)
        res.set('XObject', xoCopy)
        res = subRes
        form = copy
      }
      if (!form) continue
      const fdata = await streamData(form)
      if (!fdata) continue
      for (const e of images) {
        if (e.newName) addXObject(res, e.newName, e.stream)
        if (e.inline) { e.inlineName = `RDin${pi}_${e.op}`; addXObject(res, e.inlineName, e.inline) }
      }
      const ftoks = tokenizeContent(fdata)
      form.data = rewriteSrc(fdata, ftoks, edits, images)
      form.dict.delete('Filter')
      form.dict.delete('DecodeParms')
      form.dict.set('Length', form.data.length)
    }
    // ---- redaction boxes, painted in display space on top of everything ----
    let tail = ''
    if (mode === 'redact' && fill) {
      const [r, g, b] = fillRgb.map((v) => +(v / 255).toFixed(3))
      const boxes = regions.map((rg) => `${fnum(rg.x)} ${fnum(rg.y)} ${fnum(rg.w)} ${fnum(rg.h)} re`).join(' ')
      // boxes are in display space; disp maps user→display, so cm with disp⁻¹
      const det = disp[0] * disp[3] - disp[1] * disp[2]
      const inv = [disp[3] / det, -disp[1] / det, -disp[2] / det, disp[0] / det, (disp[2] * disp[5] - disp[3] * disp[4]) / det, (disp[1] * disp[4] - disp[0] * disp[5]) / det]
      tail = `\nq ${inv.map(fnum).join(' ')} cm ${r} ${g} ${b} rg ${boxes} f Q\n`
    }
    // the rewritten content replaces ALL of the page's streams (they were concatenated)
    const body = concat([enc('q\n'), newPageContent ?? new Uint8Array(0), enc('\nQ'), enc(tail)])
    leaf.dict.set('Contents', stream(new Map(), body))
    leaf.dict.set('Resources', pageRes)
    // ---- annotations under the regions ----
    if (mode === 'redact') {
      const an = deref(doc, get(leaf.dict, 'Annots'))
      if (Array.isArray(an)) {
        const keep = an.filter((r) => {
          const a = deref(doc, r)
          const rect = a instanceof Map ? deref(doc, get(a, 'Rect')) : null
          if (!Array.isArray(rect)) return true
          const [x0, y0, x1, y1] = rect.map(Number)
          const p1 = matPt(disp, x0, y0), p2 = matPt(disp, x1, y1)
          const bb = [Math.min(p1[0], p2[0]), Math.min(p1[1], p2[1]), Math.max(p1[0], p2[0]), Math.max(p1[1], p2[1])]
          const hit = regions.some((rg) => rectsHit(bb, rg))
          if (hit && get(a, 'Subtype')?.v !== 'Widget') { stats.annots++; return false }
          return true
        })
        leaf.dict.set('Annots', keep)
      }
    }
  }
  return stats
}

function cloneRes(res) {
  const m = res instanceof Map ? new Map(res) : new Map()
  return m
}
function addXObject(res, nm, st) {
  const xo = res.get('XObject')
  const m = xo instanceof Map ? new Map(xo) : new Map()
  m.set(nm, st)
  res.set('XObject', m)
}
function hexRgb(h) {
  const m = typeof h === 'string' ? h.match(/^#([0-9a-f]{6})$/i) : null
  if (!m) return null
  const n = parseInt(m[1], 16)
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255]
}

/**
 * Text under display-space point / rect, for the editor's "edit text" tool:
 * returns runs [{str, x, y, w, h, size, rot, font, color, glyphRect}] grouped
 * into visual lines (adjacent runs on one baseline merge).
 */
async function textRuns(doc, leaf) {
  const { ops } = await collectDrawOps(doc, leaf, { glyphs: true, annots: false })
  const runs = []
  for (const o of ops) {
    if (o.t !== 'text' || !o.str || o.inv || !o.glyphs?.length) continue
    if (Math.abs(o.rot) > 0.01) continue // rotated text: not editable in place
    // tight box from the glyph extents
    const x0 = matPt(o.m, o.glyphs[0].x, 0)[0]
    const last = o.glyphs[o.glyphs.length - 1]
    const x1 = matPt(o.m, last.x + last.w, 0)[0]
    const top = o.y - o.h * 0.78, bottom = o.y + o.h * 0.22
    runs.push({ str: o.str, x: Math.min(x0, x1), y: top, w: Math.abs(x1 - x0), h: bottom - top, base: o.y, size: o.h, font: o.font, color: o.fc })
  }
  // merge runs on the same baseline whose gap is small (kerned fragments → one word/line piece)
  runs.sort((a, b) => a.base - b.base || a.x - b.x)
  const merged = []
  for (const r of runs) {
    const last = merged[merged.length - 1]
    if (last && Math.abs(last.base - r.base) < r.size * 0.25 && Math.abs(last.size - r.size) < r.size * 0.2 &&
        r.x - (last.x + last.w) < r.size * 0.9 && r.x >= last.x) {
      const gap = r.x - (last.x + last.w)
      last.str += (gap > r.size * 0.18 && !last.str.endsWith(' ') ? ' ' : '') + r.str
      last.w = Math.max(last.x + last.w, r.x + r.w) - last.x
    } else merged.push({ ...r })
  }
  return merged
}

// ---- src/pdf/forms.js ----
// Interactive forms (AcroForm): read fields + widget geometry, fill values
// with generated appearance streams (so every viewer shows them), and
// optionally flatten (bake into page content, remove interactivity).

const FF_READONLY = 1, FF_REQUIRED = 2, FF_MULTILINE = 1 << 12, FF_PASSWORD = 1 << 13
const FF_RADIO = 1 << 15, FF_PUSH = 1 << 16, FF_COMBO = 1 << 17, FF_EDIT = 1 << 18, FF_MULTISELECT = 1 << 21, FF_COMB = 1 << 24

/** Inherited field attribute lookup up the /Parent chain. */
function inh(doc, node, key) {
  for (let n = node, d = 0; n instanceof Map && d < 32; n = deref(doc, get(n, 'Parent')), d++) {
    const v = get(n, key)
    if (v !== undefined) return deref(doc, v)
  }
  return undefined
}

/** Parse a DA string "/Helv 12 Tf 0 0 1 rg" → {size, color:[r,g,b]}. */
function parseDA(da) {
  const s = da?.bytes ? new TextDecoder('latin1').decode(da.bytes) : ''
  const sz = s.match(/([\d.]+)\s+Tf/)
  let color = [0, 0, 0]
  const rg = s.match(/([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+rg/)
  const g = s.match(/([\d.]+)\s+g(?![a-z])/)
  if (rg) color = [+rg[1], +rg[2], +rg[3]]
  else if (g) color = [+g[1], +g[1], +g[1]]
  return { size: sz ? +sz[1] : 0, color }
}

/**
 * Read all terminal fields → [{name, type, value, options, flags, readOnly, required, multiline,
 *   maxLen, comb, align, da, widgets:[{page, rect:{x,y,w,h} (display), onState, ref}]}].
 * type: 'text' | 'checkbox' | 'radio' | 'combo' | 'list' | 'button' | 'signature'
 */
function readFields(doc) {
  const root = deref(doc, get(doc.trailer, 'Root'))
  const form = deref(doc, get(root, 'AcroForm'))
  if (!(form instanceof Map)) return []
  const leaves = pageLeaves(doc)
  // widget ref → page index (from page /Annots: more reliable than /P)
  const pageOf = new Map()
  leaves.forEach((leaf, i) => {
    const an = deref(doc, get(leaf.dict, 'Annots'))
    if (Array.isArray(an)) for (const r of an) if (isRef(r)) pageOf.set(`${r.n} ${r.g}`, i)
  })
  const geo = leaves.map((leaf) => {
    const box = pageBox(doc, leaf)
    return displayTransform(box, pageRotation(doc, leaf))
  })
  const fields = []
  const seen = new Set()
  const walk = (fref, prefix, depth) => {
    if (depth > 32) return
    const key = isRef(fref) ? `${fref.n} ${fref.g}` : null
    if (key && seen.has(key)) return
    if (key) seen.add(key)
    const f = deref(doc, fref)
    if (!(f instanceof Map)) return
    const t = get(f, 'T')
    const full = t ? (prefix ? `${prefix}.${pdfString(deref(doc, t))}` : pdfString(deref(doc, t))) : prefix
    const kids = deref(doc, get(f, 'Kids'))
    // kids that are fields (have /T) → recurse; kids without /T are this field's widgets
    const fieldKids = Array.isArray(kids) ? kids.filter((k) => { const kd = deref(doc, k); return kd instanceof Map && get(kd, 'T') !== undefined }) : []
    if (fieldKids.length) { for (const k of fieldKids) walk(k, full, depth + 1); return }
    const widgetRefs = Array.isArray(kids) && kids.length ? kids : [fref]
    const ft = inh(doc, f, 'FT')?.v
    const ff = inh(doc, f, 'Ff') ?? 0
    let type = ft === 'Tx' ? 'text' : ft === 'Ch' ? (ff & FF_COMBO ? 'combo' : 'list') : ft === 'Sig' ? 'signature'
      : ft === 'Btn' ? (ff & FF_PUSH ? 'button' : ff & FF_RADIO ? 'radio' : 'checkbox') : null
    if (!type) return
    const widgets = []
    for (const wr of widgetRefs) {
      const w = deref(doc, wr)
      if (!(w instanceof Map)) continue
      const rect = deref(doc, get(w, 'Rect'))
      const wkey = isRef(wr) ? `${wr.n} ${wr.g}` : null
      let page = wkey && pageOf.has(wkey) ? pageOf.get(wkey) : -1
      if (page < 0) {
        const p = get(w, 'P')
        if (isRef(p)) page = leaves.findIndex((l) => isRef(l.ref) && l.ref.n === p.n)
      }
      if (!Array.isArray(rect) || page < 0) continue
      const [x0, y0, x1, y1] = rect.map((v) => Number(deref(doc, v)))
      const a = matPt(geo[page], x0, y0), b = matPt(geo[page], x1, y1)
      // checkbox / radio on-state = the non-Off key of /AP /N
      let onState = null
      const apn = deref(doc, get(deref(doc, get(w, 'AP')), 'N'))
      if (apn instanceof Map && !isStream(apn)) onState = [...apn.keys()].find((k) => k !== 'Off') ?? null
      widgets.push({
        page, ref: wr, onState,
        rect: { x: Math.min(a[0], b[0]), y: Math.min(a[1], b[1]), w: Math.abs(b[0] - a[0]), h: Math.abs(b[1] - a[1]) },
        hidden: !!((deref(doc, get(w, 'F')) ?? 0) & 2),
      })
    }
    const v = inh(doc, f, 'V')
    let value
    if (type === 'checkbox') value = v?.k === 'n' && v.v !== 'Off'
    else if (type === 'radio') value = v?.k === 'n' && v.v !== 'Off' ? v.v : null
    else if (type === 'list' && Array.isArray(v)) value = v.map((x) => pdfString(deref(doc, x)))
    else value = v?.bytes ? pdfString(v) : v?.k === 'n' ? v.v : ''
    const opt = deref(doc, inh(doc, f, 'Opt'))
    const options = Array.isArray(opt) ? opt.map((o) => {
      o = deref(doc, o)
      if (Array.isArray(o)) return { value: pdfString(deref(doc, o[0])), label: pdfString(deref(doc, o[1])) }
      const s = pdfString(o)
      return { value: s, label: s }
    }) : []
    const da = parseDA(inh(doc, f, 'DA') ?? get(form, 'DA'))
    fields.push({
      name: full, type, value, options, flags: ff, ref: fref,
      readOnly: !!(ff & FF_READONLY), required: !!(ff & FF_REQUIRED), multiline: !!(ff & FF_MULTILINE),
      password: !!(ff & FF_PASSWORD), comb: !!(ff & FF_COMB), editable: !!(ff & FF_EDIT), multiSelect: !!(ff & FF_MULTISELECT),
      maxLen: inh(doc, f, 'MaxLen') ?? null, align: inh(doc, f, 'Q') ?? 0, da, widgets,
    })
  }
  const top = deref(doc, get(form, 'Fields'))
  if (Array.isArray(top)) for (const f of top) walk(f, '', 0)
  return fields
}

const n2 = (v) => +(+v).toFixed(3)

/** Appearance stream for a text-ish widget showing `text`. */
function textAppearance(text, w, h, { size, color, align, multiline, comb, maxLen }) {
  const base = stdFont('helv')
  const pad = 2
  let fs = size || 0
  const lines = multiline ? wrapLines(text, base, fs || 12, w - 2 * pad) : [text]
  if (!fs) { // auto size: fit height (and width for single-line)
    fs = multiline ? 10 : Math.max(4, Math.min(12, (h - 2 * pad) * 0.75))
    if (!multiline) while (fs > 4 && textWidth(base, text, fs) > w - 2 * pad) fs -= 0.5
  }
  const [r, g, b] = color
  let body = ''
  if (comb && maxLen > 0) {
    const cell = w / maxLen
    ;[...text].slice(0, maxLen).forEach((ch, i) => {
      const cw = textWidth(base, ch, fs)
      body += `BT /Helv ${n2(fs)} Tf ${n2(i * cell + (cell - cw) / 2)} ${n2((h - fs * 0.72) / 2)} Td ${winStr(ch)} Tj ET\n`
    })
  } else {
    const ls = multiline ? wrapLines(text, base, fs, w - 2 * pad) : lines
    const lead = fs * 1.15
    ls.forEach((ln, i) => {
      const tw = textWidth(base, ln, fs)
      const x = align === 1 ? (w - tw) / 2 : align === 2 ? w - pad - tw : pad
      const y = multiline ? h - pad - fs * 0.9 - i * lead : (h - fs * 0.72) / 2
      body += `BT /Helv ${n2(fs)} Tf ${n2(x)} ${n2(y)} Td ${winStr(ln)} Tj ET\n`
    })
  }
  return `/Tx BMC q 1 1 ${n2(w - 2)} ${n2(h - 2)} re W n ${n2(r)} ${n2(g)} ${n2(b)} rg\n${body}Q EMC`
}

function wrapLines(text, base, fs, maxW) {
  const out = []
  for (const para of String(text).split('\n')) {
    let line = ''
    for (const word of para.split(/(\s+)/)) {
      const t = line + word
      if (line && textWidth(base, t.trimEnd(), fs) > maxW) { out.push(line.trimEnd()); line = word.trimStart() }
      else line = t
    }
    out.push(line)
  }
  return out
}

const checkAppearance = (w, h, color = [0, 0, 0]) => {
  // ZapfDingbats-free check mark drawn as a path (no font dependency)
  const s = Math.min(w, h) * 0.8, ox = (w - s) / 2, oy = (h - s) / 2
  const [r, g, b] = color
  return `q ${n2(r)} ${n2(g)} ${n2(b)} RG ${n2(Math.max(1, s * 0.12))} w 1 J 1 j ${n2(ox + s * 0.15)} ${n2(oy + s * 0.5)} m ${n2(ox + s * 0.4)} ${n2(oy + s * 0.22)} l ${n2(ox + s * 0.88)} ${n2(oy + s * 0.82)} l S Q`
}
const dotAppearance = (w, h, color = [0, 0, 0]) => {
  const r = Math.min(w, h) * 0.28, cx = w / 2, cy = h / 2, k = 0.5523 * r
  const [cr, cg, cb] = color
  return `q ${n2(cr)} ${n2(cg)} ${n2(cb)} rg ${n2(cx + r)} ${n2(cy)} m ${n2(cx + r)} ${n2(cy + k)} ${n2(cx + k)} ${n2(cy + r)} ${n2(cx)} ${n2(cy + r)} c ${n2(cx - k)} ${n2(cy + r)} ${n2(cx - r)} ${n2(cy + k)} ${n2(cx - r)} ${n2(cy)} c ${n2(cx - r)} ${n2(cy - k)} ${n2(cx - k)} ${n2(cy - r)} ${n2(cx)} ${n2(cy - r)} c ${n2(cx + k)} ${n2(cy - r)} ${n2(cx + r)} ${n2(cy - k)} ${n2(cx + r)} ${n2(cy)} c f Q`
}

/**
 * Fill fields: values = {fieldName: string | boolean | string[]}.
 * opts.flatten: bake appearances into page content and drop the form.
 * Returns new PDF bytes.
 */
async function fillForm(bytes, values, { flatten = false } = {}) {
  const doc = bytes instanceof Uint8Array ? await parsePdf(bytes) : bytes
  const fields = readFields(doc)
  const helv = new Map([['Type', name('Font')], ['Subtype', name('Type1')], ['BaseFont', name('Helvetica')], ['Encoding', name('WinAnsiEncoding')]])
  const mkAP = (content, w, h, withFont) => {
    const res = new Map()
    if (withFont) res.set('Font', new Map([['Helv', helv]]))
    return stream(new Map([['Type', name('XObject')], ['Subtype', name('Form')], ['BBox', [0, 0, n2(w), n2(h)]], ['Resources', res]]), enc(content))
  }
  const setOn = (node, k, v) => { if (node instanceof Map) node.set(k, v) }
  for (const f of fields) {
    if (!(f.name in values) || f.readOnly) continue
    const v = values[f.name]
    const fd = deref(doc, f.ref)
    if (f.type === 'text' || f.type === 'combo' || f.type === 'list') {
      const sv = Array.isArray(v) ? v : String(v ?? '')
      const shown = Array.isArray(sv) ? sv.join(', ') : f.maxLen ? sv.slice(0, f.maxLen) : sv
      setOn(fd, 'V', Array.isArray(sv) ? sv.map(textString) : textString(shown))
      for (const wd of f.widgets) {
        const w = deref(doc, wd.ref)
        const rect = deref(doc, get(w, 'Rect')).map(Number)
        const ww = Math.abs(rect[2] - rect[0]), hh = Math.abs(rect[3] - rect[1])
        const display = f.type === 'list' || f.type === 'combo' ? (f.options.find((o) => o.value === shown)?.label ?? shown) : f.password ? '•'.repeat(shown.length) : shown
        const ap = mkAP(textAppearance(display, ww, hh, { size: f.da.size, color: f.da.color, align: f.align, multiline: f.multiline, comb: f.comb, maxLen: f.maxLen }), ww, hh, true)
        w.set('AP', new Map([['N', ap]]))
      }
    } else if (f.type === 'checkbox') {
      const on = v === true || v === 'true' || v === 'on' || v === 'Yes'
      for (const wd of f.widgets) {
        const w = deref(doc, wd.ref)
        const st = wd.onState ?? 'Yes'
        w.set('AS', name(on ? st : 'Off'))
        if (!wd.onState) { // no appearance for "on" yet → build both states
          const rect = deref(doc, get(w, 'Rect')).map(Number)
          const ww = Math.abs(rect[2] - rect[0]), hh = Math.abs(rect[3] - rect[1])
          w.set('AP', new Map([['N', new Map([['Yes', mkAP(checkAppearance(ww, hh, f.da.color), ww, hh)], ['Off', mkAP('', ww, hh)]])]]))
        }
      }
      setOn(fd, 'V', name(on ? (f.widgets[0]?.onState ?? 'Yes') : 'Off'))
    } else if (f.type === 'radio') {
      const pick = v == null || v === false ? 'Off' : String(v)
      for (const wd of f.widgets) {
        const w = deref(doc, wd.ref)
        const st = wd.onState
        w.set('AS', name(st && st === pick ? st : 'Off'))
        if (!st) {
          const rect = deref(doc, get(w, 'Rect')).map(Number)
          const ww = Math.abs(rect[2] - rect[0]), hh = Math.abs(rect[3] - rect[1])
          w.set('AP', new Map([['N', new Map([[pick, mkAP(dotAppearance(ww, hh, f.da.color), ww, hh)], ['Off', mkAP('', ww, hh)]])]]))
        }
      }
      setOn(fd, 'V', name(pick))
    }
  }
  const root = deref(doc, get(doc.trailer, 'Root'))
  const form = deref(doc, get(root, 'AcroForm'))
  if (form instanceof Map) form.set('NeedAppearances', false)
  if (!flatten) return stampPages(doc, () => null)
  // flatten: strip widgets from the pages up front (pages are copied before
  // stampFor runs), remember their appearances, then draw them as content
  const bake = pageLeaves(doc).map((leaf) => {
    const an = deref(doc, get(leaf.dict, 'Annots'))
    if (!Array.isArray(an)) return []
    const keep = [], todo = []
    for (const r of an) {
      const a = deref(doc, r)
      if (!(a instanceof Map) || get(a, 'Subtype')?.v !== 'Widget') { keep.push(r); continue }
      if ((deref(doc, get(a, 'F')) ?? 0) & 2) continue
      let ap = get(deref(doc, get(a, 'AP')), 'N')
      let apv = deref(doc, ap)
      if (apv instanceof Map && !isStream(apv)) { const as = get(a, 'AS'); ap = as?.k === 'n' ? apv.get(as.v) : null; apv = deref(doc, ap) }
      if (!isStream(apv)) continue
      todo.push({ ap, apv, rect: deref(doc, get(a, 'Rect')).map(Number) })
    }
    if (keep.length) leaf.dict.set('Annots', keep)
    else leaf.dict.delete('Annots')
    return todo
  })
  if (form instanceof Map) root.delete('AcroForm')
  return stampPages(doc, ({ i, dst }) => {
    const todo = bake[i]
    if (!todo?.length) return null
    const xo = {}
    let content = ''
    todo.forEach(({ ap, apv, rect }, k) => {
      const bb = (deref(doc, get(apv.dict, 'BBox')) ?? [0, 0, rect[2] - rect[0], rect[3] - rect[1]]).map(Number)
      const sx = (Math.abs(rect[2] - rect[0]) || 1) / ((bb[2] - bb[0]) || 1)
      const sy = (Math.abs(rect[3] - rect[1]) || 1) / ((bb[3] - bb[1]) || 1)
      const nm = `FLT${k + 1}`
      if (!get(apv.dict, 'Subtype')) { apv.dict.set('Type', name('XObject')); apv.dict.set('Subtype', name('Form')) }
      xo[nm] = copyValue(isRef(ap) ? ap : apv, doc, dst, new Map())
      content += `q ${n2(sx)} 0 0 ${n2(sy)} ${n2(Math.min(rect[0], rect[2]) - bb[0] * sx)} ${n2(Math.min(rect[1], rect[3]) - bb[1] * sy)} cm /${nm} Do Q\n`
    })
    return { content: '\n' + content, res: { XObject: xo } }
  })
}

// ---- src/pdf/render.js ----
// Canvas renderer for collectDrawOps output — browser-side only.
// Paints text glyph-by-glyph at the PDF's own positions (substitute system
// fonts, matched by family/weight/style), images through their full matrix,
// vector paths, gradients, clips, alpha and blend modes.

const FAMILY = {
  serif: '"Times New Roman", Times, "Liberation Serif", Georgia, serif',
  sans: 'Arial, Helvetica, "Liberation Sans", "Segoe UI", sans-serif',
  mono: '"Courier New", Courier, "Liberation Mono", monospace',
}
const fontCss = (f, px) => {
  const fam = f?.mono ? FAMILY.mono : f?.serif ? FAMILY.serif : FAMILY.sans
  return `${f?.italic ? 'italic ' : ''}${f?.bold ? '700 ' : ''}${px}px ${fam}`
}

/** Decode an image op once per doc → CanvasImageSource | null (cached). */
async function imageSource(doc, op, cache) {
  const key = op.ref ?? op.inline
  if (key && cache.has(key)) return cache.get(key)
  const p = (async () => {
    const src = op.ref ?? { dict: op.inline.dict, data: op.inline.data }
    const im = await decodeImage(doc, src, { fill: op.fill ?? [0, 0, 0], res: op.res, inline: !!op.inline }).catch(() => null)
    if (!im) return null
    if (im.kind === 'rgba') return rgbaCanvas(im.w, im.h, im.rgba)
    if (im.kind === 'jpeg') {
      const bmp = await createImageBitmap(new Blob([im.data], { type: 'image/jpeg' })).catch(() => null)
      if (!bmp) return null
      if (!im.smask && !im.invert) return bmp
      const cv = document.createElement('canvas')
      cv.width = bmp.width
      cv.height = bmp.height
      const c = cv.getContext('2d')
      c.drawImage(bmp, 0, 0)
      const id = c.getImageData(0, 0, cv.width, cv.height)
      if (im.invert) for (let i = 0; i < id.data.length; i += 4) { id.data[i] = 255 - id.data[i]; id.data[i + 1] = 255 - id.data[i + 1]; id.data[i + 2] = 255 - id.data[i + 2] }
      if (im.smask) {
        const { w: mw, h: mh, a } = im.smask
        for (let y = 0; y < cv.height; y++) {
          const my = Math.min(mh - 1, Math.floor((y * mh) / cv.height))
          for (let x = 0; x < cv.width; x++) {
            const mx = Math.min(mw - 1, Math.floor((x * mw) / cv.width))
            id.data[(y * cv.width + x) * 4 + 3] = a[my * mw + mx]
          }
        }
      }
      c.putImageData(id, 0, 0)
      return cv
    }
    return null // JPX: no browser decoder
  })()
  if (key) cache.set(key, p)
  return p
}

function rgbaCanvas(w, h, rgba) {
  const cv = document.createElement('canvas')
  cv.width = w
  cv.height = h
  cv.getContext('2d').putImageData(new ImageData(rgba, w, h), 0, 0)
  return cv
}

const CAP = ['butt', 'round', 'square']
const JOIN = ['miter', 'round', 'bevel']
const rgb = (c, fallback = '#000') => (c ? `rgb(${Math.round(c[0] * 255)},${Math.round(c[1] * 255)},${Math.round(c[2] * 255)})` : fallback)

/**
 * Paint draw ops onto ctx. scale = device px per pt. Returns nothing.
 * opts.skipText: leave text out (the editor's text-edit mode paints its own).
 */
async function paintOps(ctx, doc, ops, scale, cache = new Map(), { hide = null } = {}) {
  let saves = 0
  const base = () => ctx.setTransform(scale, 0, 0, scale, 0, 0)
  const trace = (segs) => {
    ctx.beginPath()
    for (const seg of segs) {
      if (seg[0] === 'M') ctx.moveTo(seg[1], seg[2])
      else if (seg[0] === 'L') ctx.lineTo(seg[1], seg[2])
      else if (seg[0] === 'C') ctx.bezierCurveTo(seg[1], seg[2], seg[3], seg[4], seg[5], seg[6])
      else if (seg[0] === 'Z') ctx.closePath()
    }
  }
  const minLw = 1 / scale // hairlines: one device pixel
  base()
  for (const op of ops) {
    if (hide && hide(op)) continue
    ctx.globalCompositeOperation = op.blend ?? 'source-over'
    if (op.t === 'clip') {
      ctx.save(); saves++
      base()
      trace(op.segs)
      ctx.clip(op.eo ? 'evenodd' : 'nonzero')
    } else if (op.t === 'unclip') {
      if (saves > 0) { ctx.restore(); saves-- }
    } else if (op.t === 'rect' || op.t === 'path') {
      base()
      if (op.t === 'rect') { ctx.beginPath(); ctx.rect(op.x, op.y, op.w, op.h) } else trace(op.segs)
      if (op.fill) {
        ctx.globalAlpha = op.a ?? 1
        ctx.fillStyle = rgb(op.fc)
        ctx.fill(op.eo ? 'evenodd' : 'nonzero')
      }
      if (op.stroke) {
        ctx.globalAlpha = op.sa ?? 1
        ctx.strokeStyle = rgb(op.sc)
        ctx.lineWidth = Math.max(minLw, op.lw ?? 1)
        ctx.lineCap = CAP[op.cap] ?? 'butt'
        ctx.lineJoin = JOIN[op.join] ?? 'miter'
        ctx.setLineDash(op.dash ?? [])
        ctx.lineDashOffset = op.doff ?? 0
        ctx.stroke()
        ctx.setLineDash([])
      }
    } else if (op.t === 'shade') {
      base()
      ctx.globalAlpha = op.a ?? 1
      if (op.kind === 'flat') ctx.fillStyle = rgb(op.color)
      else {
        const g = op.kind === 'axial'
          ? ctx.createLinearGradient(...op.coords)
          : ctx.createRadialGradient(...op.coords)
        for (const [t, c] of op.stops) g.addColorStop(Math.min(1, Math.max(0, t)), rgb(c))
        ctx.fillStyle = g
      }
      ctx.fillRect(-1e4, -1e4, 2e4, 2e4) // the active clip bounds it
    } else if (op.t === 'img') {
      const src = await imageSource(doc, op, cache)
      if (!src) continue
      const m = op.m
      // unit square (y up) → display; flip so bitmap row 0 lands at the top
      ctx.setTransform(scale * m[0], scale * m[1], scale * m[2], scale * m[3], scale * m[4], scale * m[5])
      ctx.transform(1, 0, 0, -1, 0, 1)
      ctx.globalAlpha = op.a ?? 1
      // upscaled small images look terrible blurred; tiny-source stencils stay crisp
      const sw = src.width ?? 1
      ctx.imageSmoothingEnabled = !(sw < 64 && op.w * scale > sw * 4)
      ctx.imageSmoothingQuality = 'high'
      ctx.drawImage(src, 0, 0, 1, 1)
      base()
    } else if (op.t === 'text') {
      if (op.inv || !op.h) continue
      const px = op.h * scale
      const m = op.m
      if (!op.str || px < 3.2 || !op.gx) {
        // too small to read (thumbnails) or undecodable: draw an ink bar
        if (op.w * scale < 0.5) continue
        ctx.setTransform(scale * m[0], scale * m[1], scale * m[2], scale * m[3], scale * m[4], scale * m[5])
        ctx.globalAlpha = (op.a ?? 1) * 0.55
        ctx.fillStyle = rgb(op.fc)
        const adv = op.gx?.length ? op.gx[op.gx.length - 2] + op.fs * 0.5 : op.fs * op.str.length * 0.5
        ctx.fillRect(0, 0, Math.max(adv, op.fs * 0.3), op.fs * 0.62)
        base()
        continue
      }
      // text space (y-up, font size fs) → work in device-sized units so the
      // browser rasterises glyphs at their real pixel size (no 1px-font blur)
      const q = px / op.fs
      const th = op.th || 1
      ctx.setTransform(scale * m[0], scale * m[1], scale * m[2], scale * m[3], scale * m[4], scale * m[5])
      ctx.scale(th / q, -1 / q)
      ctx.font = fontCss(op.font, px)
      ctx.textBaseline = 'alphabetic'
      const mode = (op.mode ?? 0) % 4
      const fill = mode === 0 || mode === 2
      const stroke = mode === 1 || mode === 2
      ctx.fillStyle = rgb(op.fc)
      ctx.strokeStyle = rgb(op.sc)
      ctx.lineWidth = Math.max(0.03 * px, 1)
      const gx = op.gx
      for (let i = 0; i < gx.length; i += 2) {
        const ch = gx[i + 1]
        if (!ch || ch === ' ') continue
        const x = (gx[i] / th) * q
        if (fill) { ctx.globalAlpha = op.a ?? 1; ctx.fillText(ch, x, 0) }
        if (stroke) { ctx.globalAlpha = op.sa ?? 1; ctx.strokeText(ch, x, 0) }
      }
      base()
    }
  }
  while (saves-- > 0) ctx.restore()
  ctx.globalAlpha = 1
  ctx.globalCompositeOperation = 'source-over'
  ctx.setTransform(1, 0, 0, 1, 0, 0)
}

/**
 * Render a page to a new canvas `width` px wide (white background).
 * cache: Map shared across pages of one doc (decoded images).
 * Returns null for pages whose content can't be read at all.
 */
async function renderPage(doc, leaf, { width = 160, cache = new Map(), annots = true, widgets = true } = {}) {
  const { ops, box } = await collectDrawOps(doc, leaf, { annots, widgets })
  const scale = width / box.w
  const canvas = document.createElement('canvas')
  canvas.width = Math.max(2, Math.round(box.w * scale))
  canvas.height = Math.max(2, Math.round(box.h * scale))
  const ctx = canvas.getContext('2d')
  ctx.fillStyle = '#ffffff'
  ctx.fillRect(0, 0, canvas.width, canvas.height)
  if (!ops.length) return canvas // a genuinely blank page is still a page
  await paintOps(ctx, doc, ops, scale, cache)
  return canvas
}

// ---- src/ui/dom.js ----
// Tiny DOM helper — h(tag, attrs, ...children). No framework, no build.

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs ?? {})) {
    if (v === undefined || v === null) continue
    if (k === 'class') el.className = v
    else if (k === 'dataset') Object.assign(el.dataset, v)
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v)
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v)
    else if (v === true) el.setAttribute(k, '')
    else el.setAttribute(k, v)
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue
    el.append(kid?.nodeType ? kid : document.createTextNode(String(kid)))
  }
  return el
}

function icon(name, cls = 'icon') {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
  svg.setAttribute('viewBox', name === 'github' ? '0 0 16 16' : '0 0 24 24')
  svg.setAttribute('class', cls)
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path')
  p.setAttribute('d', ICONS[name])
  if (name === 'github') p.setAttribute('fill', 'currentColor')
  else {
    p.setAttribute('fill', 'none')
    p.setAttribute('stroke', 'currentColor')
    p.setAttribute('stroke-width', '1.8')
    p.setAttribute('stroke-linecap', 'round')
    p.setAttribute('stroke-linejoin', 'round')
  }
  svg.append(p)
  return svg
}

// replaceChildren converts null/undefined args into literal "null" text nodes —
// always re-render through this instead.
function setKids(el, ...kids) {
  el.replaceChildren(...kids.filter((k) => k !== null && k !== undefined && k !== false))
}

function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob)
  const a = h('a', { href: url, download: name })
  a.click()
  setTimeout(() => URL.revokeObjectURL(url), 10_000)
}

const readBytes = async (file) => new Uint8Array(await file.arrayBuffer())

function fmtBytes(n) {
  if (n < 1024) return `${n} B`
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`
  return `${(n / 1024 / 1024).toFixed(1)} MB`
}
