/** Any raster → JPEG bytes via the browser's own decoder (canvas). */
async function toJpeg(file) {
  if (file.type === 'image/jpeg') return readBytes(file)
  const bmp = await createImageBitmap(file)
  const canvas = document.createElement('canvas')
  canvas.width = bmp.width
  canvas.height = bmp.height
  const ctx = canvas.getContext('2d')
  ctx.fillStyle = '#ffffff' // flatten alpha
  ctx.drawImage(bmp, 0, 0)
  const blob = await new Promise((res) => canvas.toBlob(res, 'image/jpeg', 0.92))
  return new Uint8Array(await blob.arrayBuffer())
}

function ImgToPdf() {
  let files = [] // {file, url, dims}
  let busy = false
  let error = ''
  let opts = { size: 'native', orient: 'auto', margin: 0, fit: 'contain' }
  const root = h('div', { class: 'tool' })

  const add = async (incoming) => {
    for (const f of incoming) {
      const entry = { file: f, url: URL.createObjectURL(f), dims: null }
      files.push(entry)
      render()
      try {
        const bmp = await createImageBitmap(f)
        entry.dims = `${bmp.width}×${bmp.height}`
        bmp.close()
      } catch { /* non-decodable → toJpeg will surface it on build */ }
      render()
    }
  }

  const remove = (i) => {
    URL.revokeObjectURL(files[i].url)
    files = files.filter((_, j) => j !== i)
    render()
  }

  const move = (from, to) => {
    const c = [...files]
    const [x] = c.splice(from, 1)
    c.splice(to, 0, x)
    files = c
    render()
  }

  const run = async () => {
    busy = true
    error = ''
    render()
    try {
      const images = await Promise.all(files.map(async (f) => ({ data: await toJpeg(f.file) })))
      const out = imagesToPdf(images, opts)
      saveBlob(new Blob([out], { type: 'application/pdf' }), 'images.pdf')
    } catch (e) {
      error = e.message || 'failed — use JPEG or PNG images'
    } finally {
      busy = false
      render()
    }
  }

  function render() {
    setKids(root,
      DropZone({
        accept: 'image/jpeg,image/png,image/webp,image/gif,image/bmp',
        multiple: true,
        onFiles: add,
        label: 'Drop images here or ',
      }),
      files.length
        ? Card(
            ThumbList({ files, onMove: move, onRemove: remove }),
            h('p', { class: 'meta dim', style: { marginTop: '10px' } }, 'Drag to reorder — each image becomes one page'),
          )
        : null,
      files.length
        ? Card(
            h('div', { class: 'optrow' },
              h('label', { class: 'lbl' }, 'Page size'),
              h('select', { class: 'textin sel', onchange: (e) => { opts = { ...opts, size: e.target.value } } },
                h('option', { value: 'native', selected: true }, 'Match image'),
                h('option', { value: 'a4' }, 'A4'),
                h('option', { value: 'letter' }, 'Letter')),
              h('label', { class: 'lbl' }, 'Orientation'),
              h('select', { class: 'textin sel', onchange: (e) => { opts = { ...opts, orient: e.target.value } } },
                h('option', { value: 'auto', selected: true }, 'Auto'),
                h('option', { value: 'portrait' }, 'Portrait'),
                h('option', { value: 'landscape' }, 'Landscape')),
            ),
            h('div', { class: 'optrow' },
              h('label', { class: 'lbl' }, `Margin ${opts.margin}pt`),
              h('input', {
                type: 'range', min: 0, max: 72, step: 1, value: opts.margin, class: 'slider',
                oninput: (e) => { opts = { ...opts, margin: +e.target.value }; e.target.previousElementSibling.textContent = `Margin ${opts.margin}pt` },
              }),
              h('label', { class: 'lbl' }, 'Fit'),
              h('select', { class: 'textin sel', onchange: (e) => { opts = { ...opts, fit: e.target.value } } },
                h('option', { value: 'contain', selected: true }, 'Fit (keep ratio)'),
                h('option', { value: 'stretch' }, 'Stretch to page')),
            ),
          )
        : null,
      ErrorText(error),
      Btn(busy ? 'Building…' : `Build PDF from ${files.length} image${files.length === 1 ? '' : 's'}`, {
        onclick: run,
        disabled: busy || !files.length,
      }),
    )
  }
  render()
  return root
}

// ---- src/tools/extract.js ----

function ExtractImgs() {
  let file = null
  let results = null // {images, skipped}
  let busy = false
  let error = ''
  let loadGen = 0
  let hideDupes = false
  let selected = new Set() // image objects
  const root = h('div', { class: 'tool' })

  const load = async ([f]) => {
    const my = ++loadGen
    error = ''
    file = f
    results = null
    hideDupes = false
    selected = new Set()
    busy = true
    render()
    try {
      const bytes = await readBytes(f)
      if (my !== loadGen) return
      const found = await extractImages(bytes)
      if (my !== loadGen) return
      // count duplicates by content hash → first occurrence carries the badge
      const counts = new Map()
      for (const im of found.images) counts.set(im.hash, (counts.get(im.hash) ?? 0) + 1)
      const seen = new Set()
      for (const im of found.images) {
        im.dupCount = seen.has(im.hash) ? 0 : counts.get(im.hash)
        im.dup = seen.has(im.hash)
        seen.add(im.hash)
      }
      results = found
      if (!results.images.length) {
        error = results.skipped
          ? `found ${results.skipped} image${results.skipped === 1 ? '' : 's'} but in formats we can't decode yet (CCITT/JBIG2/masked)`
          : 'no embedded images found in this PDF'
      }
    } catch (e) {
      if (my !== loadGen) return
      error = e.message || 'could not read that PDF'
      file = null
      results = null
    } finally {
      if (my === loadGen) busy = false
      render()
    }
  }

  const saveOne = (im) => saveBlob(new Blob([im.data], { type: im.mime }), im.name)

  const saveZip = (list, suffix) => {
    const stem = file.name.replace(/\.pdf$/i, '')
    saveBlob(
      new Blob([zipStore(list.map((im) => ({ name: im.name, data: im.data })))], { type: 'application/zip' }),
      `${stem}-${suffix}.zip`,
    )
  }

  function render() {
    const imgs = results?.images ?? []
    const visible = hideDupes ? imgs.filter((im) => !im.dup) : imgs
    const unique = new Set(imgs.map((im) => im.hash)).size
    setKids(root,
      DropZone({ accept: 'application/pdf', onFiles: load, label: 'Drop a PDF here or ' }),
      busy ? h('p', { class: 'meta dim' }, 'Scanning for embedded images…') : null,
      file && results
        ? Card(
            h('p', { class: 'meta' },
              h('b', {}, file.name),
              ` — ${imgs.length} image${imgs.length === 1 ? '' : 's'} · ${unique} unique${results.skipped ? ` · ${results.skipped} skipped (unsupported)` : ''}`),
            imgs.length
              ? h('div', { class: 'toolbar' },
                  h('button', { type: 'button', class: 'tbtn', onclick: () => { selected = new Set(visible); render() } }, 'Select shown'),
                  h('button', { type: 'button', class: 'tbtn', onclick: () => { selected = new Set(); render() }, disabled: !selected.size || undefined }, 'Clear'),
                  h('label', { class: 'lbl', style: { margin: 0, alignSelf: 'center' } },
                    h('input', { type: 'checkbox', checked: hideDupes || undefined, onchange: (e) => { hideDupes = e.target.checked; render() } }),
                    ' hide duplicates'),
                  selected.size

              h('div', { style: { flex: 1 } },
                h('label', { class: 'lbl' }, `Margin — ${margin}pt`),
                h('input', {
                  type: 'range', min: 0, max: 72, step: 1, value: margin, class: 'slider',
                  oninput: (e) => {

// ---- src/tools/pdf2png.js ----

function PdfToPng() {
  let file = null
  let doc = null
  let pages = [] // {i, leaf, canvas, box}
  let scale = 2
  let busy = false
  let error = ''
  let loadGen = 0
  const root = h('div', { class: 'tool' })

  const load = async ([f]) => {
    const my = ++loadGen
    error = ''
    file = f
    doc = null
    pages = []
    busy = true
    render()
    try {
      const b = await readBytes(f)
      if (my !== loadGen) return
      const parsed = await parsePdf(b)
      const leaves = pageLeaves(parsed)
      if (my !== loadGen) return
      doc = parsed
      pages = leaves.map((leaf, i) => ({ leaf, i, canvas: null }))
      busy = false
      render()
      const cache = new Map()
      for (const p of pages) {
        if (my !== loadGen) return
        p.canvas = await renderPage(doc, p.leaf, { width: 220 * scale, cache }).catch(() => null)
        render()
      }
    } catch (e) {
      if (my !== loadGen) return
      error = e.message || 'could not read that file'
      file = null
    } finally {
      if (my === loadGen) busy = false
      render()
    }
  }

  const blobOf = (canvas) =>
    new Promise((res, rej) => canvas.toBlob((b) => (b ? res(b) : rej(new Error('encode failed'))), 'image/png'))

  const saveAll = async () => {
    busy = true
    render()
    try {
      // export renders at true scale (page-pts × scale), independent of the
      // 220px preview thumbs — scale 3 on a letter page ≈ 1836px ≈ 216 DPI
      const entries = []
      const cache = new Map()
      for (const p of pages) {
        const { box } = await collectDrawOps(doc, p.leaf).catch(() => ({ box: null }))
        if (!box) continue
        const hi = await renderPage(doc, p.leaf, { width: Math.round(box.w * scale), cache }).catch(() => null)
        if (!hi) continue
        const blob = await blobOf(hi)
        entries.push({
          name: `${file.name.replace(/\.pdf$/i, '')}-p${p.i + 1}.png`,
          data: new Uint8Array(await blob.arrayBuffer()),
        })
      }
      if (!entries.length) throw new Error('nothing rendered')
      if (entries.length === 1) saveBlob(new Blob([entries[0].data], { type: 'image/png' }), entries[0].name)
      else saveBlob(new Blob([zipStore(entries)], { type: 'application/zip' }), `${file.name.replace(/\.pdf$/i, '')}-pages.zip`)
    } catch (e) {
      error = e.message || 'export failed'
    } finally {
      busy = false
      render()
    }
  }

  function render() {
    setKids(root,
      DropZone({ accept: 'application/pdf', onFiles: load }),
      file
        ? Card(
            h('div', { class: 'optrow' },
              h('div', {},
                h('label', { class: 'lbl' }, 'Resolution'),
                h('select', { class: 'textin sel', onchange: (e) => { scale = Number(e.target.value); load([file]) } },
                  [[1, '1× — small'], [2, '2× — crisp'], [3, '3× — print']]
                    .map(([v, l]) => h('option', { value: v, selected: v === scale || undefined }, l)))),
              h('div', {},
                h('label', { class: 'lbl' }, 'Pages'),
                h('p', { class: 'meta dim' }, `${pages.length} page${pages.length === 1 ? '' : 's'} → PNG${pages.length > 1 ? 's in a zip' : ''}`))),
            pages.length
              ? h('div', { class: 'pgrid' },
                  pages.map((p) =>
                    h('div', { class: 'pcard' },
                      p.canvas ?? h('div', { class: 'pthumb dim' }, '…'),
                      h('div', { class: 'plabel' }, `p${p.i + 1}`))))
              : null,
            h('div', { class: 'btnrow' },
              Btn(busy ? 'Encoding…' : pages.length > 1 ? 'Download PNGs (zip)' : 'Download PNG', {
                onclick: saveAll, disabled: busy || !pages.length,
              })),
          )
        : null,
      busy && !pages.length ? h('p', { class: 'meta dim' }, 'Rendering pages…') : null,
      ErrorText(error),
    )
  }
  render()
  return root
}

// ---- src/tools/compress.js ----

function Compress() {
  let file = null
  let bytes = null
  let result = null // {bytes, before, after}
  let reimageImgs = true
  let busy = false
  let error = ''
  let loadGen = 0
  const root = h('div', { class: 'tool' })

  const load = async ([f]) => {
    const my = ++loadGen
    error = ''
    file = f
    bytes = null
    result = null
    try {
      const b = await readBytes(f)
      if (my !== loadGen) return
      bytes = b
    } catch (e) {
      if (my !== loadGen) return
      error = 'could not read that file'
      file = null
    }
    render()
  }

  const reimage = async (dec) => {
    const bmp = await createImageBitmap(new Blob([dec.data], { type: dec.mime })).catch(() => null)
    if (!bmp) return null
    const canvas = document.createElement('canvas')
    canvas.width = bmp.width
    canvas.height = bmp.height
    canvas.getContext('2d').drawImage(bmp, 0, 0)
    const blob = await new Promise((res) => canvas.toBlob(res, 'image/jpeg', 0.72))
    return blob ? new Uint8Array(await blob.arrayBuffer()) : null
  }

  const run = async () => {
    busy = true
    error = ''
    result = null
    render()
    try {
      result = await compressPdf(bytes, { reimage: reimageImgs ? reimage : undefined })
      if (result.after >= result.before) {
        result.note = 'already tight — rebuilt but not smaller'
      }
    } catch (e) {
      error = e.message || 'compress failed'
    } finally {
      busy = false
      render()
    }
  }

  const download = () =>
    saveBlob(new Blob([result.bytes], { type: 'application/pdf' }),
      `${file.name.replace(/\.pdf$/i, '')}-small.pdf`)

  function render() {
    const saved = result ? result.before - result.after : 0
    const pct = result ? Math.round((saved / result.before) * 100) : 0
    setKids(root,
      DropZone({ accept: 'application/pdf', onFiles: load }),
      file
        ? Card(
            h('p', { class: 'meta' }, h('b', {}, file.name), ` — ${fmtBytes(bytes?.length ?? 0)}`),
            h('label', { class: 'lbl chk' },
              h('input', {
                type: 'checkbox', checked: reimageImgs || undefined,
                onchange: (e) => { reimageImgs = e.target.checked },
              }),
              ' Re-encode embedded images at lower quality (biggest wins, slight quality loss)'),
            h('div', { class: 'btnrow' },
              Btn(busy ? 'Compressing…' : 'Compress', { onclick: run, disabled: busy })),
            result
              ? h('p', { class: 'meta' },
                  h('b', {}, `${fmtBytes(result.before)} → ${fmtBytes(result.after)}`),
                  saved > 0 ? ` — saved ${fmtBytes(saved)} (${pct}%)` : ` — ${result.note}`)
              : null,
            result ? Btn('Download compressed PDF', { onclick: download }) : null,
          )
        : null,
      ErrorText(error),
    )
  }
  render()
  return root
}

// ---- src/tools/protect.js ----

function Protect() {
  let file = null
  let bytes = null
  let encrypted = false
  let pwd = ''
  let pwd2 = ''
  let busy = false
  let error = ''
  let ok = ''
  let loadGen = 0
  const root = h('div', { class: 'tool' })

  const load = async ([f]) => {
    const my = ++loadGen

    ok = ''
    file = f
    bytes = null
    encrypted = false
    pwd = pwd2 = ''
    try {
      const b = await readBytes(f)
      if (my !== loadGen) return
      bytes = b
      try {
        await parsePdf(b)
      } catch (e) {
        if (!/password-protected/.test(e.message)) throw e
        encrypted = true
      }
    } catch (e) {
      if (my !== loadGen) return
      error = e.message || 'could not read that file'
      file = null
      bytes = null
    }
    render()
  }

  const lock = async () => {
    if (!pwd) { error = 'enter a password first'; render(); return }
    busy = true
    error = ''
    render()
    try {
      const out = await protectPdf(bytes, pwd, { ownerPwd: pwd2 || undefined })
      saveBlob(new Blob([out], { type: 'application/pdf' }),
        `${file.name.replace(/\.pdf$/i, '')}-protected.pdf`)
    } catch (e) {
      error = e.message || 'failed'
    } finally {
      busy = false
      render()
    }
  }

  const unlock = async () => {
    if (!pwd) { error = 'enter a password first'; render(); return }
    busy = true
    error = ''
    ok = ''
    render()
    try {
      const out = await decryptPdf(bytes, pwd)
      saveBlob(new Blob([out], { type: 'application/pdf' }),
        `${file.name.replace(/\.pdf$/i, '')}-unlocked.pdf`)
      ok = 'Unlocked — the download has no password.'
    } catch (e) {
      error = /wrong password/.test(e.message) ? 'Wrong password — try again.' : e.message
    } finally {
      busy = false
      render()
    }
  }

  const pwdInput = (label, val, onset, ph = '••••••••') =>
    h('div', {},
      h('label', { class: 'lbl' }, label),
      h('input', {
        class: 'textin', type: 'password', placeholder: ph, value: val,
        oninput: (e) => onset(e.target.value),
        onkeydown: (e) => { if (e.key === 'Enter' && pwd) (encrypted ? unlock : lock)() },
      }))

  function render() {
    setKids(root,
      DropZone({ accept: 'application/pdf', onFiles: load }),
      file && !encrypted
        ? Card(
            h('p', { class: 'meta' }, h('b', {}, file.name), ' — not protected yet'),
            h('div', { class: 'optrow' },
              pwdInput('Password (required to open)', pwd, (v) => (pwd = v)),
              pwdInput('Owner password (optional)', pwd2, (v) => (pwd2 = v), 'same as above if blank')),
            h('p', { class: 'meta dim' },
              'RC4-128 Standard handler — every real PDF reader will ask for the password before opening.'),
            h('div', { class: 'btnrow' },
              Btn(busy ? 'Locking…' : 'Protect PDF', { onclick: lock, disabled: busy })),
          )
        : null,
      file && encrypted
        ? Card(
            h('p', { class: 'meta' }, h('b', {}, file.name), ' — password-protected'),
            h('div', { class: 'optrow' },
              pwdInput('Password (user or owner)', pwd, (v) => (pwd = v))),
            h('div', { class: 'btnrow' },
              Btn(busy ? 'Unlocking…' : 'Unlock PDF', { onclick: unlock, disabled: busy })),
            ok ? h('p', { class: 'meta ok' }, ok) : null,
          )
        : null,
      ErrorText(error),
    )
  }
  render()
  return root
}

      ErrorText(error),
      file && meta
        ? Btn(busy ? 'Scrubbing…' : leaking ? 'Scrub it all' : 'Rebuild anyway', { onclick: run, disabled: busy })
        : null,
    )
  }
  render()
  return root
}

const TOOLS = [
  { id: 'edit', name: 'Edit PDF', desc: 'Draw, highlight, write and stamp — a real editor', icon: 'pencil', view: Edit },
  { id: 'merge', name: 'Merge PDF', desc: 'Combine PDFs into one, in your order', icon: 'files', view: Merge },
  { id: 'split', name: 'Split PDF', desc: 'Pull out page ranges — one file or a zip', icon: 'scissors', view: Split },
  { id: 'organize', name: 'Organize pages', desc: 'Reorder, rotate and delete pages visually', icon: 'grid', view: Organize },
  { id: 'img2pdf', name: 'Images to PDF', desc: 'JPG/PNG/WebP pages into a single PDF', icon: 'image', view: ImgToPdf },
  { id: 'extract', name: 'Extract images', desc: 'Pull embedded images out — JPG/PNG in a zip', icon: 'layers', view: ExtractImgs },
  { id: 'pagenum', name: 'Page numbers', desc: 'Stamp "N / total" on every page', icon: 'hash', view: PageNums },
  { id: 'watermark', name: 'Watermark', desc: 'Diagonal translucent text on every page', icon: 'droplet', view: Watermark },
  { id: 'pdf2png', name: 'PDF to PNG', desc: 'Render every page to images, in a zip', icon: 'download', view: PdfToPng },
  { id: 'pdftext', name: 'PDF to text', desc: 'Pull the text out, pages in order', icon: 'filetext', view: PdfToText },
  { id: 'compress', name: 'Compress PDF', desc: 'Recompress streams + re-encode images', icon: 'shrink', view: Compress },
  { id: 'protect', name: 'Protect / Unlock', desc: 'Password-protect or unlock a PDF', icon: 'lock', view: Protect },
  { id: 'scrub', name: 'Scrub metadata', desc: 'Strip author, producer, XMP and doc IDs', icon: 'eraser', view: Scrub },
]

const app = document.getElementById('app')

function route() {
  return location.hash.replace(/^#\/?/, '')
}

function header() {
  return h(
    'header',
    {},
    h('a', { class: 'brand', href: '#/' }, h('b', {}, 'PDF', h('span', { class: 'accent' }, 'Suite')),
      h('span', { class: 'tagline' }, 'free forever · no account · no uploads · zero dependencies')),
    h('a', { class: 'gh', href: 'https://github.com/mayusi/pdfsuite', title: 'Source on GitHub' },
      icon('github', 'icon')),
  )
}

function footer() {
  return h(
    'footer',
    {},
    h(
      'p',
      {},
      'Smallpdf charges $12/mo · iLovePDF $9/mo — to upload ',
      h('em', {}, 'your'),
      ' documents to ',
      h('em', {}, 'their'),
      ' servers for work your own browser can do. PDFSuite does the same job for $0, your files never leave the machine, and the entire app is hand-written JavaScript you can read end-to-end. MIT licensed. ',
    ),
    h(
      'p',
      {},
      'Want it offline? ',
      h('a', { href: './pdfsuite.html', download: 'pdfsuite.html' }, 'Download the whole app as one HTML file'),
      ' — same code, works from a double-click.',
    ),
  )
}

function home() {
  return h(
    'main',
    {},
    h('h1', {}, "Every PDF tool you'd pay Smallpdf $12/mo for. ", h('span', { class: 'accent' }, 'Free.')),
    h('p', { class: 'sub' }, icon('shield', 'icon-sm accent'),
      'Files never leave your browser — every tool runs 100% client-side with zero dependencies. Check the network tab, then check the source.'),
    h(
      'div',
      { class: 'grid' },
      TOOLS.map((t) =>
        h('a', { class: 'toolcard', href: `#/${t.id}` },
          icon(t.icon, 'icon-lg accent'),
          h('h2', {}, t.name),
          h('p', {}, t.desc)),
      ),
    ),
  )
}

function toolView(tool) {
  return h(
    'main',
    {},
    h('a', { class: 'back', href: '#/' }, '← all tools'),
    h('h1', {}, tool.name),
    h('p', { class: 'sub' }, tool.desc),
    tool.view(),
  )
}

function render() {
  const tool = TOOLS.find((t) => t.id === route())
  app.replaceChildren(header(), tool ? toolView(tool) : home(), footer())
  scrollTo(0, 0)
}

// Dropping a file anywhere EXCEPT a dropzone must not navigate away and nuke the app.
addEventListener('dragover', (e) => e.preventDefault())
addEventListener('drop', (e) => {
  if (!e.target.closest?.('.dropzone')) e.preventDefault()
})

addEventListener('hashchange', render)
render()
</script>
