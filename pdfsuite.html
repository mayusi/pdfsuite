      h('span', { class: 'fsize' }, f.dims ?? fmtBytes(f.file.size)),
      iconBtn('up', 'Move up', () => onMove(i, i - 1), i === 0),
      iconBtn('down', 'Move down', () => onMove(i, i + 1), i === files.length - 1),
      iconBtn('x', 'Remove', () => onRemove(i)),
    )
    list.append(li)
  })
  return list
}

/**
 * Extracted-image results grid — real previews + per-image download.
 * images: [{name, data, w, h, mime, hash, dupCount?}]. onSave(image) downloads one.
 * Pass selected (Set) + onToggle to enable click-select.
 */
function ImgGrid({ images, onSave, selected, onToggle }) {
  return h(
    'div',
    { class: 'igrid' },
    images.map((im) => {
      const url = URL.createObjectURL(new Blob([im.data], { type: im.mime }))
      return h(
        'div',
        {
          class: 'icard' + (selected?.has(im) ? ' sel' : ''),
          onclick: onToggle ? () => onToggle(im) : undefined,
        },
        h('img', {
          src: url,
          alt: im.name,
          loading: 'lazy',
          onload: () => URL.revokeObjectURL(url),
          onerror: () => URL.revokeObjectURL(url),
        }),
        h('div', { class: 'imeta' },
          h('span', { class: 'iname' }, im.name),
          h('span', { class: 'idim' }, `${im.w}×${im.h} · ${fmtBytes(im.data.length)}${im.dupCount > 1 ? ` · ×${im.dupCount}` : ''}`),
        ),
        onToggle && selected?.has(im) ? h('div', { class: 'pchk' }, icon('check', 'icon-sm')) : null,
        h('button', { type: 'button', class: 'isave', title: 'Download', onclick: (e) => { e.stopPropagation(); onSave(im) } }, icon('download', 'icon-sm')),
      )
    }),
  )
}

/**
 * Modal page zoom — show a canvas (or any node) large, Esc/click-out to close.
 */
function openLightbox(node, caption = '') {
  const onKey = (e) => { if (e.key === 'Escape') close() }
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey) }
  const ov = h(
    'div',
    { class: 'lightbox', onclick: (e) => { if (e.target === ov) close() } },
    h('div', { class: 'lb-box' }, node, caption ? h('div', { class: 'lb-cap' }, caption) : null),
  )
  document.addEventListener('keydown', onKey)
  document.body.append(ov)
  return close
}

/**
 * Metadata preview table for Scrub — shows exactly what will be wiped.
 * meta: {fields: [{key, value}], xmp, id}
 */
function MetaTable({ fields, xmp, id }) {
  const rows = fields.map((f) =>
    h('tr', {}, h('td', { class: 'mkey' }, f.key), h('td', { class: 'mval' }, f.value)),
  )
  if (xmp) rows.push(h('tr', {}, h('td', { class: 'mkey' }, 'XMP stream'), h('td', { class: 'mval' }, 'embedded metadata packet')))
  if (id) rows.push(h('tr', {}, h('td', { class: 'mkey' }, 'Document ID'), h('td', { class: 'mval' }, 'unique fingerprint in trailer')))
  if (!rows.length) return h('p', { class: 'meta dim' }, 'No metadata found — this file is already clean.')
  return h('table', { class: 'mtable' }, h('tbody', {}, rows))
}

/** Small text-button toolbar row (Organize bulk actions). */
function Toolbar(actions) {
  return h(
    'div',
    { class: 'toolbar' },
    actions.map(([label, onclick, disabled]) =>
      h('button', { type: 'button', class: 'tbtn', onclick, disabled: disabled || undefined }, label),
    ),
  )
}

// ---- src/tools/merge.js ----

function Merge() {
  let files = [] // {file, bytes, pages, doc, leaves, thumbNode, expanded, detail}
  let busy = false
  let error = ''
  let outName = 'merged'
  const root = h('div', { class: 'tool' })

  const add = async (incoming) => {
    for (const f of incoming) {
      const entry = {
        name: f.name, size: f.size, file: f,
        bytes: null, pages: null, doc: null, leaves: null, cache: new Map(),
        thumbNode: null, expanded: false, detail: null,
        meta: 'reading…', err: null,
      }
      entry.onExpand = () => expand(entry)
      files.push(entry)
      render()
      try {
        const bytes = await readBytes(f)
        entry.bytes = bytes
        const doc = await parsePdf(bytes)
        entry.doc = doc
        entry.leaves = pageLeaves(doc)
        entry.pages = entry.leaves.length
        entry.meta = `${entry.pages} page${entry.pages === 1 ? '' : 's'}`
        try {
          const canvas = await renderPage(doc, entry.leaves[0], { width: 72, cache: entry.cache })
          if (canvas) { canvas.className = 'thumb pcanvas-sm'; entry.thumbNode = canvas }
        } catch { /* no thumbnail — row keeps index */ }
      } catch {
        entry.err = 'not a readable PDF'
        entry.meta = ''
      }
      render()
    }
  }

  const expand = async (entry) => {
    entry.expanded = !entry.expanded
    if (!entry.expanded || !entry.leaves) { entry.detail = null; render(); return }
    const strip = h('div', { class: 'pstrip' }, h('span', { class: 'meta dim' }, 'rendering…'))
    entry.detail = strip
    render()
    for (let i = 0; i < entry.leaves.length; i++) {
      if (!entry.expanded) return // collapsed while rendering
      try {
        const c = await renderPage(entry.doc, entry.leaves[i], { width: 64, cache: entry.cache })
        if (c) {
          c.className = 'pcanvas-sm'
          c.title = `page ${i + 1}`
          strip.append(h('div', { class: 'pstrip-cell' }, c, h('span', { class: 'pstrip-n' }, `${i + 1}`)))
          if (i === 0) strip.firstChild.remove() // drop "rendering…"
        }
      } catch { /* skip page */ }
    }
    if (!strip.querySelectorAll('canvas').length) setKids(strip, h('span', { class: 'meta dim' }, 'no renderable pages'))
  }

  const move = (from, to) => {
    const c = [...files]
    const [x] = c.splice(from, 1)
    c.splice(to, 0, x)
    files = c
    render()
  }

  const run = async () => {
    busy = true
    error = ''
    render()
    try {
      const bad = files.find((f) => !f.bytes)
      if (bad) throw new Error(`"${bad.file.name}" isn't a readable PDF — remove it`)
      const out = await mergePdfs(files.map((f) => f.bytes))
      const name = (outName.trim() || 'merged').replace(/\.pdf$/i, '')
      saveBlob(new Blob([out], { type: 'application/pdf' }), `${name}.pdf`)
    } catch (e) {
      error = e.message || 'merge failed'
    } finally {
      busy = false
      render()
    }
  }

  function render() {
    const good = files.filter((f) => f.bytes)
    const total = good.reduce((n, f) => n + (f.pages || 0), 0)
    const estSize = good.reduce((n, f) => n + f.size, 0)
    setKids(root,
      DropZone({
        accept: 'application/pdf',
        multiple: true,
        onFiles: add,
        label: files.length ? 'Drop more PDFs to add them or ' : undefined,
      }),
      files.length
        ? Card(
            FileList({ files, onMove: move, onRemove: (i) => { files = files.filter((_, j) => j !== i); render() } }),
            h('p', { class: 'meta dim', style: { marginTop: '10px' } },
              `Drag to reorder · ${good.length} valid · ${total} pages total · ~${fmtBytes(estSize)} output`),
          )
        : null,
      files.length
        ? Card(
            h('label', { class: 'lbl' }, 'Output filename'),
            h('input', {
              class: 'textin', value: outName, placeholder: 'merged',
              oninput: (e) => (outName = e.target.value),
            }),
          )
        : null,
      ErrorText(error),
      Btn(busy ? 'Merging…' : `Merge ${good.length} PDFs · ${total} pages`, {
        onclick: run,
        disabled: busy || good.length < 2 || good.length !== files.length,
      }),
    )
  }
  render()
  return root
}

// ---- src/tools/split.js ----

/** Selected set → "1-3, 5" spec string. */
const selToSpec = (sel) => {
  const pgs = [...sel].sort((a, b) => a - b)
  const parts = []
  for (let i = 0; i < pgs.length; i++) {
    let j = i
    while (j + 1 < pgs.length && pgs[j + 1] === pgs[j] + 1) j++
    parts.push(pgs[i] === pgs[j] ? `${pgs[i]}` : `${pgs[i]}-${pgs[j]}`)
    i = j
  }
  return parts.join(', ')
}

function Split() {
  let file = null
  let bytes = null
  let doc = null
  let leaves = []
  let items = [] // {page, w, h, canvas, imgUrl, text}
  let selected = new Set()
  let lastPick = null // for shift-click ranges
  let spec = ''
  let specOK = true
  let mode = 'one'
  let busy = false
  let error = ''
  let loadGen = 0
  let urls = []
  const imgCache = new Map()
  const root = h('div', { class: 'tool' })

  const load = async ([f]) => {
    const my = ++loadGen
    error = ''
    file = f
    items = []
    selected = new Set()
    lastPick = null
    spec = ''
    specOK = true
    imgCache.clear()
    for (const u of urls) URL.revokeObjectURL(u)
    urls = []
    render()
    try {
      const b = await readBytes(f)
      if (my !== loadGen) return
      const d = await parsePdf(b)
      if (my !== loadGen) return
      bytes = b
      doc = d
      leaves = pageLeaves(d)
      const dims = pageDims(d)
      items = dims.map((d2, i) => ({ page: i + 1, w: d2.w, h: d2.h, canvas: null, imgUrl: null, text: '' }))
      selected = new Set(items.map((i) => i.page))
      spec = selToSpec(selected)
      render()
      leaves.forEach(async (leaf, i) => {
        try {
          const canvas = await renderPage(d, leaf, { width: 200, cache: imgCache })
          if (my !== loadGen) return
          if (canvas) {
            canvas.className = 'pcanvas'
            items[i].canvas = canvas
          } else {
            const pv = await pagePreview(d, leaf)
            if (my !== loadGen) return
            if (pv.img) {
              items[i].imgUrl = URL.createObjectURL(new Blob([pv.img.data], { type: pv.img.mime }))
              urls.push(items[i].imgUrl)
            } else {
              items[i].text = pv.text
            }
          }
          render()
        } catch { /* card keeps dims */ }
      })
    } catch (e) {
      if (my !== loadGen) return
      error = e.message || 'could not read that PDF'
      file = null
      bytes = null
      doc = null
    }
    render()
  }

  const zoom = async (page) => {
    try {
      const it = items[page - 1]
      const canvas = await renderPage(doc, leaves[page - 1], { width: Math.min(860, it.w * 1.5), cache: imgCache })
      if (canvas) openLightbox(canvas, `page ${page} · ${it.w}×${it.h}pt`)
    } catch { /* no preview */ }
  }

  const toggle = (page, shift) => {
    if (shift && lastPick !== null) {
      const [a, b] = lastPick < page ? [lastPick, page] : [page, lastPick]
      for (let p = a; p <= b; p++) selected.add(p)
    } else {
      selected.has(page) ? selected.delete(page) : selected.add(page)
    }
    lastPick = page
    spec = selToSpec(selected)
    specOK = true
    render()
  }

  const preset = (kind) => {
    selected = new Set(
      kind === 'all' ? items.map((i) => i.page)
      : kind === 'none' ? []
      : items.filter((i) => (kind === 'odd') === (i.page % 2 === 1)).map((i) => i.page),
    )
    lastPick = null
    spec = selToSpec(selected)
    specOK = true
    render()
  }

  let gridEl = null
  let btnEl = null

  const onSpec = (v) => {
    spec = v
    try {
      selected = new Set(parseRanges(v, items.length).flatMap(({ from, to }) =>
        Array.from({ length: to - from + 1 }, (_, i) => from + i)))
      specOK = true
    } catch {
      specOK = false // leave cards as-is until the spec parses
    }
    if (btnEl) btnEl.disabled = busy || !specOK || !selected.size
    // hot-swap only the grid — full render() would nuke input focus mid-typing
    if (specOK && gridEl) {
      const fresh = SelectGrid({ items, selected, onToggle: toggle, onZoom: zoom })
      gridEl.replaceWith(fresh)
      gridEl = fresh
    }
  }

  const run = async () => {
    busy = true
    error = ''
    render()
    try {
      const stem = file.name.replace(/\.pdf$/i, '')
      if (mode === 'one') {
        const ranges = parseRanges(spec, items.length)
        const out = await extractPages(bytes, ranges)
        saveBlob(new Blob([out], { type: 'application/pdf' }), `${stem}-pages.pdf`)
      } else if (mode === 'each') {
        const pgs = [...selected].sort((a, b) => a - b)
        const outs = await splitPdf(bytes, pgs.map((p) => ({ from: p, to: p })))
        saveBlob(
          new Blob([zipStore(outs.map((out, i) => ({
            name: `${stem}-p${pgs[i]}.pdf`,
            data: out,
          })))], { type: 'application/zip' }),
          `${stem}-pages.zip`,
        )
      } else {
        const ranges = parseRanges(spec, items.length)
        const outs = await splitPdf(bytes, ranges)
        saveBlob(
          new Blob([zipStore(outs.map((out, i) => ({
            name: `${stem}-${ranges[i].from}-${ranges[i].to}.pdf`,
            data: out,
          })))], { type: 'application/zip' }),
          `${stem}-split.zip`,
        )
      }
    } catch (e) {
      error = e.message || 'split failed'
    } finally {
      busy = false
      render()
    }
  }

  const radio = (val, text) =>
    h(
      'label',
      { class: 'radio' },
      h('input', {
        type: 'radio',
        name: 'splitmode',
        checked: mode === val || undefined,
        onchange: () => { mode = val; render() },
      }),
      text,
    )

  function render() {
    setKids(root,
      DropZone({ accept: 'application/pdf', onFiles: load }),
      file
        ? Card(
            h('p', { class: 'meta' }, h('b', {}, file.name), ` — ${items.length} pages`),
            h('p', { class: 'meta dim' }, 'Click pages to pick them · shift-click selects a range'),
            Toolbar([
              ['All', () => preset('all')],
              ['None', () => preset('none')],
              ['Odd pages', () => preset('odd')],
              ['Even pages', () => preset('even')],
            ]),
          )
        : null,
      items.length ? (gridEl = SelectGrid({ items, selected, onToggle: toggle, onZoom: zoom })) : null,
      file
        ? Card(
            h('label', { class: 'lbl' }, 'Ranges (synced with your picks — edit either)'),
            h('input', {
              class: 'textin',
              value: spec,
              oninput: (e) => onSpec(e.target.value),
            }),
            h(
              'div',
              { class: 'radio-row' },
              radio('one', 'One PDF with those pages'),
              radio('zip', 'Separate PDF per range (zip)'),
              radio('each', 'One PDF per selected page (zip)'),
            ),
          )
        : null,
      ErrorText(error),
      file
        ? (btnEl = Btn(
            busy ? 'Working…' : `Extract ${selected.size} page${selected.size === 1 ? '' : 's'}`,
            { onclick: run, disabled: busy || !specOK || !selected.size },
          ))
        : (btnEl = null),
    )
  }
  render()
  return root
}

// ---- src/tools/organize.js ----

/** Copy a rendered canvas (cloneNode doesn't carry the bitmap). */
const cloneCanvas = (src) => {
  const c = document.createElement('canvas')
  c.width = src.width
  c.height = src.height
  c.getContext('2d').drawImage(src, 0, 0)
  c.className = src.className
  c.draggable = false
  return c
}

function Organize() {
  let file = null
  let bytes = null
  let doc = null
  let leaves = []
  let items = [] // {page, w, h, rotation, deleted, canvas, imgUrl, text}
  let sel = new Set() // selected item objects (identity survives reorder)
  let lastIdx = null // shift-click anchor
  let moveTo = 1
  let urls = []
  let history = [] // undo stack of item-list snapshots
  let busy = false
  let error = ''
  let loadGen = 0
  const imgCache = new Map() // shared decode cache across pages of this doc
  const root = h('div', { class: 'tool' })

  const load = async ([f]) => {
    const my = ++loadGen
    error = ''
    file = f
    items = []
    sel = new Set()
    lastIdx = null
    history = []
    imgCache.clear()
    for (const u of urls) URL.revokeObjectURL(u)
    urls = []
    render()
    try {
      const b = await readBytes(f)
      if (my !== loadGen) return
      const d = await parsePdf(b)
      if (my !== loadGen) return
      bytes = b
      doc = d
      leaves = pageLeaves(d)
      items = leaves.map((leaf, i) => {
        const mb = get(leaf.dict, 'MediaBox') ?? leaf.inh.MediaBox ?? [0, 0, 0, 0]
        return {
          page: i + 1,
          w: Math.round(mb[2] - mb[0]),
          h: Math.round(mb[3] - mb[1]),
          rotation: 0,
          deleted: false,
          canvas: null,
          imgUrl: null,
          text: '',
        }
      })
      render()
      // fill previews progressively: real mini-render first, image/text fallback
      leaves.forEach(async (leaf, i) => {
        try {
          const canvas = await renderPage(d, leaf, { width: 200, cache: imgCache })
          if (my !== loadGen) return
          if (canvas) {
            canvas.className = 'pcanvas'
            canvas.draggable = false
            items[i].canvas = canvas
          } else {
            const pv = await pagePreview(d, leaf)
            if (my !== loadGen) return
            if (pv.img) {
              items[i].imgUrl = URL.createObjectURL(new Blob([pv.img.data], { type: pv.img.mime }))
              urls.push(items[i].imgUrl)
            } else {
              items[i].text = pv.text
            }
          }
          render()
        } catch { /* card keeps dims */ }
      })
    } catch (e) {
      if (my !== loadGen) return
      error = e.message || 'could not read that PDF'
      file = null
      bytes = null
      doc = null
    }
    render()
  }

  const mutate = (fn) => {
    history.push([...items])
    if (history.length > 50) history.shift()
    fn()
    render()
  }

  const undo = () => {
    if (!history.length) return
    items = history.pop()
    sel = new Set([...sel].filter((x) => items.includes(x)))
    render()
  }

  const onSelect = (i, shift) => {
    if (shift && lastIdx !== null) {
      const [a, b] = lastIdx < i ? [lastIdx, i] : [i, lastIdx]
      for (let k = a; k <= b; k++) sel.add(items[k])
    } else {
      sel.has(items[i]) ? sel.delete(items[i]) : sel.add(items[i])
    }
    lastIdx = i
    render()
  }

  const applySel = (fn) => mutate(() => { items = items.map((x) => (sel.has(x) ? fn(x) : x)) })

  const moveSelected = (where) => mutate(() => {
    const picked = items.filter((x) => sel.has(x))
    const rest = items.filter((x) => !sel.has(x))
    if (!picked.length) return
    if (where === 'front') items = [...picked, ...rest]
    else if (where === 'back') items = [...rest, ...picked]
    else {
      const idx = Math.max(0, Math.min(rest.length, moveTo - 1))
      items = [...rest.slice(0, idx), ...picked, ...rest.slice(idx)]
    }
  })

  const dupSelected = () => mutate(() => {
    const picked = items.filter((x) => sel.has(x))
    if (!picked.length) return
    const lastPos = items.lastIndexOf(picked[picked.length - 1])
    // clone canvas nodes — a DOM node can only live in one card at a time
    const dups = picked.map((x) => ({ ...x, canvas: x.canvas ? cloneCanvas(x.canvas) : null }))
    items = [...items.slice(0, lastPos + 1), ...dups, ...items.slice(lastPos + 1)]
  })

  const onZoom = async (i) => {
    const it = items[i]
    const leaf = leaves[it.page - 1]
    try {
      const canvas = await renderPage(doc, leaf, { width: Math.min(860, it.w * 1.5), cache: imgCache })
      if (canvas) openLightbox(canvas, `page ${it.page} · ${it.w}×${it.h}pt${it.rotation ? ` · rotated ${it.rotation}°` : ''}`)
    } catch { /* no preview */ }
  }

  const extractSel = async () => {
    const picked = items.filter((x) => sel.has(x) && !x.deleted)
    if (!picked.length) return
    busy = true
    error = ''
    render()
    try {
      const out = await organizePages(bytes, picked.map((x) => ({ page: x.page, rotation: x.rotation })))
      saveBlob(new Blob([out], { type: 'application/pdf' }), `${file.name.replace(/\.pdf$/i, '')}-extract.pdf`)
    } catch (e) {
      error = e.message || 'failed'
    } finally {
      busy = false
      render()
    }
  }

  const run = async () => {
    busy = true
    error = ''
    render()
    try {
      const ops = items.filter((it) => !it.deleted).map((it) => ({ page: it.page, rotation: it.rotation }))
      if (!ops.length) throw new Error('all pages deleted')
      const out = await organizePages(bytes, ops)
      saveBlob(
        new Blob([out], { type: 'application/pdf' }),
        `${file.name.replace(/\.pdf$/i, '')}-organized.pdf`,
      )
    } catch (e) {
      error = e.message || 'failed'
    } finally {
      busy = false
      render()
    }
  }

  // keyboard: Ctrl+A select-all, Del delete, Ctrl+Z undo — self-removes when detached
  const onKey = (e) => {
    if (!root.isConnected) return document.removeEventListener('keydown', onKey)
    if (!items.length || /input|textarea|select/i.test(e.target.tagName)) return
    if (e.ctrlKey && e.key === 'a') { e.preventDefault(); sel = new Set(items); render() }
    else if (e.key === 'Delete' && sel.size) applySel((x) => ({ ...x, deleted: true }))
    else if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo() }
  }
  document.addEventListener('keydown', onKey)

  function render() {
    const kept = items.filter((i) => !i.deleted).length
    const n = sel.size
    setKids(root,
      DropZone({ accept: 'application/pdf', onFiles: load }),
      items.length
        ? h('p', { class: 'meta dim' },
            `Click to select (shift = range) · drag to reorder · ⌨ Ctrl+A / Del / Ctrl+Z · ${kept} of ${items.length} kept${n ? ` · ${n} selected` : ''}`)
        : null,
      items.length
        ? Toolbar([
            ['Select all', () => { sel = new Set(items); render() }],
            ['Clear', () => { sel = new Set(); render() }, !n],
            ['Invert', () => { sel = new Set(items.filter((x) => !sel.has(x))); render() }],
            ['⇤ To front', () => moveSelected('front'), !n],
            ['To back ⇥', () => moveSelected('back'), !n],
            ['Rotate sel +90°', () => applySel((x) => ({ ...x, rotation: (x.rotation + 90) % 360 })), !n],
            ['Delete sel', () => applySel((x) => ({ ...x, deleted: true })), !n],
            ['Duplicate sel', dupSelected, !n],
            ['↶ Undo', undo, !history.length],
            ['Restore all', () => mutate(() => { items = items.map((x) => ({ ...x, deleted: false })) }), kept === items.length],
            ['Reset all', () => mutate(() => {
              items = items.map((x) => ({ ...x, rotation: 0, deleted: false }))
              items.sort((a, b) => a.page - b.page)
              sel = new Set()
            })],
          ])
        : null,
      items.length
        ? h('div', { class: 'toolbar' },
            h('label', { class: 'lbl', style: { alignSelf: 'center', margin: 0 } }, 'Move selected to position'),
            h('input', {
              class: 'textin num', type: 'number', value: moveTo, min: 1, max: items.length,
              style: { width: '80px', margin: 0 },
              oninput: (e) => (moveTo = parseInt(e.target.value, 10) || 1),
            }),
            h('button', { type: 'button', class: 'tbtn', disabled: !n || undefined, onclick: () => moveSelected('at') }, 'Move'),
            n ? h('button', { type: 'button', class: 'tbtn', onclick: extractSel, disabled: busy || undefined }, 'Download selected as PDF') : null,
          )
        : null,
      items.length
        ? PageGrid({
            items,
            selected: sel,
            onSelect,
            onZoom,
            onReorder: (from, to) => mutate(() => {
              const c = [...items]
              const [x] = c.splice(from, 1)
              c.splice(to, 0, x)
              items = c
            }),
            onRotate: (i, delta) => mutate(() => {
              items = items.map((x, j) => (j === i ? { ...x, rotation: ((x.rotation + delta) % 360 + 360) % 360 } : x))
            }),
            onToggleDelete: (i) => mutate(() => {
              items = items.map((x, j) => (j === i ? { ...x, deleted: !x.deleted } : x))
            }),
          })
        : null,
      ErrorText(error),
      items.length
        ? Btn(busy ? 'Building…' : `Download organized PDF (${kept} pages)`, { onclick: run, disabled: busy || kept === 0 })
        : null,
    )
    // apply rotation to rendered canvases so cards reflect it
    for (const it of items) {
      if (it.canvas) it.canvas.style.transform = it.rotation ? `rotate(${it.rotation}deg)` : ''
    }
  }
  render()
  return root
}

/** Any raster → JPEG bytes via the browser's own decoder (canvas). */
async function toJpeg(file) {
  if (file.type === 'image/jpeg') return readBytes(file)
  const bmp = await createImageBitmap(file)
  const canvas = document.createElement('canvas')
  canvas.width = bmp.width
  canvas.height = bmp.height
  const ctx = canvas.getContext('2d')
  ctx.fillStyle = '#ffffff' // flatten alpha
  ctx.drawImage(bmp, 0, 0)
  const blob = await new Promise((res) => canvas.toBlob(res, 'image/jpeg', 0.92))
  return new Uint8Array(await blob.arrayBuffer())
}

function ImgToPdf() {
  let files = [] // {file, url, dims}
  let busy = false
  let error = ''
  let opts = { size: 'native', orient: 'auto', margin: 0, fit: 'contain' }
  const root = h('div', { class: 'tool' })

  const add = async (incoming) => {
    for (const f of incoming) {
      const entry = { file: f, url: URL.createObjectURL(f), dims: null }
      files.push(entry)
      render()
      try {
        const bmp = await createImageBitmap(f)
        entry.dims = `${bmp.width}×${bmp.height}`
        bmp.close()
      } catch { /* non-decodable → toJpeg will surface it on build */ }
      render()
    }
  }

  const remove = (i) => {
    URL.revokeObjectURL(files[i].url)
    files = files.filter((_, j) => j !== i)
    render()
  }

  const move = (from, to) => {
    const c = [...files]
    const [x] = c.splice(from, 1)
    c.splice(to, 0, x)
    files = c
    render()
  }

  const run = async () => {
    busy = true
    error = ''
    render()
    try {
      const images = await Promise.all(files.map(async (f) => ({ data: await toJpeg(f.file) })))
      const out = imagesToPdf(images, opts)
      saveBlob(new Blob([out], { type: 'application/pdf' }), 'images.pdf')
    } catch (e) {
      error = e.message || 'failed — use JPEG or PNG images'
    } finally {
      busy = false
      render()
    }
  }

  function render() {
    setKids(root,
      DropZone({
        accept: 'image/jpeg,image/png,image/webp,image/gif,image/bmp',
        multiple: true,
        onFiles: add,
        label: 'Drop images here or ',
      }),
      files.length
        ? Card(
            ThumbList({ files, onMove: move, onRemove: remove }),
            h('p', { class: 'meta dim', style: { marginTop: '10px' } }, 'Drag to reorder — each image becomes one page'),
          )
        : null,
      files.length
        ? Card(
            h('div', { class: 'optrow' },
              h('label', { class: 'lbl' }, 'Page size'),
              h('select', { class: 'textin sel', onchange: (e) => { opts = { ...opts, size: e.target.value } } },
                h('option', { value: 'native', selected: true }, 'Match image'),
                h('option', { value: 'a4' }, 'A4'),
                h('option', { value: 'letter' }, 'Letter')),
              h('label', { class: 'lbl' }, 'Orientation'),
              h('select', { class: 'textin sel', onchange: (e) => { opts = { ...opts, orient: e.target.value } } },
                h('option', { value: 'auto', selected: true }, 'Auto'),
                h('option', { value: 'portrait' }, 'Portrait'),
                h('option', { value: 'landscape' }, 'Landscape')),
            ),
            h('div', { class: 'optrow' },
              h('label', { class: 'lbl' }, `Margin ${opts.margin}pt`),
              h('input', {
                type: 'range', min: 0, max: 72, step: 1, value: opts.margin, class: 'slider',
                oninput: (e) => { opts = { ...opts, margin: +e.target.value }; e.target.previousElementSibling.textContent = `Margin ${opts.margin}pt` },
              }),
              h('label', { class: 'lbl' }, 'Fit'),
              h('select', { class: 'textin sel', onchange: (e) => { opts = { ...opts, fit: e.target.value } } },
                h('option', { value: 'contain', selected: true }, 'Fit (keep ratio)'),
                h('option', { value: 'stretch' }, 'Stretch to page')),
            ),
          )
        : null,
      ErrorText(error),
      Btn(busy ? 'Building…' : `Build PDF from ${files.length} image${files.length === 1 ? '' : 's'}`, {
        onclick: run,
        disabled: busy || !files.length,
      }),
    )
  }
  render()
  return root
}

// ---- src/tools/extract.js ----

function ExtractImgs() {
  let file = null
  let results = null // {images, skipped}
  let busy = false
  let error = ''
  let loadGen = 0
  let hideDupes = false
  let selected = new Set() // image objects
  const root = h('div', { class: 'tool' })

  const load = async ([f]) => {
    const my = ++loadGen
    error = ''
    file = f
    results = null
    hideDupes = false
    selected = new Set()
    busy = true
    render()
    try {
      const bytes = await readBytes(f)
      if (my !== loadGen) return
      const found = await extractImages(bytes)
      if (my !== loadGen) return
      // count duplicates by content hash → first occurrence carries the badge
      const counts = new Map()
      for (const im of found.images) counts.set(im.hash, (counts.get(im.hash) ?? 0) + 1)
      const seen = new Set()
      for (const im of found.images) {
        im.dupCount = seen.has(im.hash) ? 0 : counts.get(im.hash)
        im.dup = seen.has(im.hash)
        seen.add(im.hash)
      }
      results = found
      if (!results.images.length) {
        error = results.skipped
          ? `found ${results.skipped} image${results.skipped === 1 ? '' : 's'} but in formats we can't decode yet (CCITT/JBIG2/masked)`
          : 'no embedded images found in this PDF'
      }
    } catch (e) {
      if (my !== loadGen) return
      error = e.message || 'could not read that PDF'
      file = null
      results = null
    } finally {
      if (my === loadGen) busy = false
      render()
    }
  }

  const saveOne = (im) => saveBlob(new Blob([im.data], { type: im.mime }), im.name)

  const saveZip = (list, suffix) => {
    const stem = file.name.replace(/\.pdf$/i, '')
    saveBlob(
      new Blob([zipStore(list.map((im) => ({ name: im.name, data: im.data })))], { type: 'application/zip' }),
      `${stem}-${suffix}.zip`,
    )
  }

  function render() {
    const imgs = results?.images ?? []
    const visible = hideDupes ? imgs.filter((im) => !im.dup) : imgs
    const unique = new Set(imgs.map((im) => im.hash)).size
    setKids(root,
      DropZone({ accept: 'application/pdf', onFiles: load, label: 'Drop a PDF here or ' }),
      busy ? h('p', { class: 'meta dim' }, 'Scanning for embedded images…') : null,
      file && results
        ? Card(
            h('p', { class: 'meta' },
              h('b', {}, file.name),
              ` — ${imgs.length} image${imgs.length === 1 ? '' : 's'} · ${unique} unique${results.skipped ? ` · ${results.skipped} skipped (unsupported)` : ''}`),
            imgs.length
              ? h('div', { class: 'toolbar' },
                  h('button', { type: 'button', class: 'tbtn', onclick: () => { selected = new Set(visible); render() } }, 'Select shown'),
                  h('button', { type: 'button', class: 'tbtn', onclick: () => { selected = new Set(); render() }, disabled: !selected.size || undefined }, 'Clear'),
                  h('label', { class: 'lbl', style: { margin: 0, alignSelf: 'center' } },
                    h('input', { type: 'checkbox', checked: hideDupes || undefined, onchange: (e) => { hideDupes = e.target.checked; render() } }),
                    ' hide duplicates'),
                  selected.size
                    ? h('span', { class: 'meta dim', style: { alignSelf: 'center' } }, `${selected.size} selected`)
                    : null,
                )
              : null,
          )
        : null,
      visible.length ? ImgGrid({ images: visible, onSave: saveOne, selected, onToggle: (im) => { selected.has(im) ? selected.delete(im) : selected.add(im); render() } }) : null,
      ErrorText(error),
      imgs.length
        ? h('div', { class: 'btnrow' },
            Btn(`Download all ${imgs.length} (.zip)`, { onclick: () => saveZip(imgs, 'images') }),
            selected.size
              ? Btn(`Download ${selected.size} selected (.zip)`, { onclick: () => saveZip([...selected], 'selected') })
              : null,
          )
        : null,
    )
  }
  render()
  return root
}

// ---- src/tools/pagenum.js ----

const POSITIONS = [
  ['bc', 'Bottom center'], ['bl', 'Bottom left'], ['br', 'Bottom right'],
  ['tc', 'Top center'], ['tl', 'Top left'], ['tr', 'Top right'],
]
const FORMATS = [
  ['n-of-total', '1 / 12'], ['n', '1'], ['page-n', 'Page 1'], ['custom', 'Custom…'],
]

function PageNums() {
  let file = null
  let bytes = null
  let pages = 0
  let pos = 'bc'
  let fmt = 'n-of-total'
  let fmtStr = '{n} / {t}'
  let start = 1
  let size = 10
  let margin = 18
  let skipFirst = false
  let busy = false
  let error = ''
  let loadGen = 0
  let previewEl = null
  const root = h('div', { class: 'tool' })

  const load = async ([f]) => {
    const my = ++loadGen
    error = ''
    file = f
    pages = 0
    render()
    try {
      const b = await readBytes(f)
      if (my !== loadGen) return
      const count = await pageCount(b)
      if (my !== loadGen) return
      bytes = b
      pages = count
    } catch (e) {
      if (my !== loadGen) return
      error = e.message || 'could not read that PDF'
      file = null
      bytes = null
    }
    render()
  }

  const run = async () => {
    busy = true
    error = ''
    render()
    try {
      const out = await addPageNumbers(bytes, { pos, fmt, fmtStr, start, size, margin, skipFirst })
      saveBlob(new Blob([out], { type: 'application/pdf' }), `${file.name.replace(/\.pdf$/i, '')}-numbered.pdf`)
    } catch (e) {
      error = e.message || 'failed'
    } finally {
      busy = false
      render()
    }
  }

  const select = (options, value, onpick) =>
    h('select', {
      class: 'textin sel',
      onchange: (e) => { onpick(e.target.value); render() },
    }, options.map(([v, label]) =>
      h('option', { value: v, selected: v === value || undefined }, label)))

  const numin = (value, min, max, onset) =>
    h('input', {
      class: 'textin num', type: 'number', value, min, max,
      onchange: (e) => { onset(Math.max(min, Math.min(max, parseInt(e.target.value, 10) || min))) },
    })

  const previewLabel = () => {
    const n = (skipFirst ? 1 : 0) + start
    const shown = fmt === 'n' ? `${n}`
      : fmt === 'page-n' ? `Page ${n}`
      : fmt === 'custom' ? (fmtStr || '{n}').replaceAll('{n}', String(n)).replaceAll('{t}', String(pages))
      : `${n} / ${pages}`
    const where = POSITIONS.find(([v]) => v === pos)[1].toLowerCase()
    return `Preview: "${shown}" · ${where} · ${size}pt · ${margin}pt margin${skipFirst ? ' · page 1 left blank' : ''}`
  }

  function render() {
    setKids(root,
      DropZone({ accept: 'application/pdf', onFiles: load }),
      file
        ? Card(
            h('p', { class: 'meta' }, h('b', {}, file.name), ` — ${pages} pages`),
            h('div', { class: 'optrow' },
              h('div', {}, h('label', { class: 'lbl' }, 'Position'), select(POSITIONS, pos, (v) => (pos = v))),
              h('div', {}, h('label', { class: 'lbl' }, 'Format'), select(FORMATS, fmt, (v) => (fmt = v))),
              h('div', {}, h('label', { class: 'lbl' }, 'Start at'), numin(start, 0, 9999, (v) => (start = v))),
              h('div', {}, h('label', { class: 'lbl' }, 'Size (pt)'), numin(size, 6, 48, (v) => (size = v))),
            ),
            fmt === 'custom'
              ? h('div', { class: 'optrow' },
                  h('div', { style: { flex: 1 } },
                    h('label', { class: 'lbl' }, 'Custom label — {n} = number, {t} = total'),
                    h('input', { class: 'textin', value: fmtStr, oninput: (e) => {
                      fmtStr = e.target.value
                      if (previewEl) previewEl.textContent = previewLabel()
                    } })),
                )
              : null,
            h('div', { class: 'optrow' },
              h('div', { style: { flex: 1 } },
                h('label', { class: 'lbl' }, `Margin — ${margin}pt`),
                h('input', {
                  type: 'range', min: 0, max: 72, step: 1, value: margin, class: 'slider',
                  oninput: (e) => {
                    margin = +e.target.value
                    e.target.previousElementSibling.textContent = `Margin — ${margin}pt`
                    if (previewEl) previewEl.textContent = previewLabel()
                  },
                })),
            ),
            h('label', { class: 'radio', style: { marginBottom: '10px' } },
              h('input', { type: 'checkbox', checked: skipFirst || undefined, onchange: (e) => { skipFirst = e.target.checked; render() } }),
              'Skip first page (covers/title pages stay clean)',
            ),
            (previewEl = h('p', { class: 'meta dim' }, previewLabel())),
          )
        : null,
      ErrorText(error),
      file ? Btn(busy ? 'Stamping…' : 'Add page numbers', { onclick: run, disabled: busy || !bytes }) : null,
    )
  }
  render()
  return root
}

// ---- src/tools/scrub.js ----

function Scrub() {
  let file = null
  let bytes = null
  let meta = null // {fields, xmp, id}
  let busy = false
  let error = ''
  let loadGen = 0
  const root = h('div', { class: 'tool' })

  const load = async ([f]) => {
    const my = ++loadGen
    error = ''
    file = f
    meta = null
    busy = true
    render()
    try {
      const b = await readBytes(f)
      if (my !== loadGen) return
      const found = await readMetadata(b)
      if (my !== loadGen) return
      bytes = b
      meta = found
    } catch (e) {
      if (my !== loadGen) return
      error = e.message || 'could not read that file'
      file = null
      bytes = null
    } finally {
      if (my === loadGen) busy = false
      render()
    }
  }

  const run = async () => {
    busy = true
    error = ''
    render()
    try {
      const out = await scrubPdf(bytes)
      saveBlob(new Blob([out], { type: 'application/pdf' }), `${file.name.replace(/\.pdf$/i, '')}-clean.pdf`)
    } catch (e) {
      error = e.message || 'failed'
    } finally {
      busy = false
      render()
    }
  }

  function render() {
    const leaking = meta && (meta.fields.length || meta.xmp || meta.id)
    setKids(root,
      DropZone({ accept: 'application/pdf', onFiles: load }),
      busy ? h('p', { class: 'meta dim' }, 'Reading metadata…') : null,
      file && meta
        ? Card(
            h('p', { class: 'meta' }, h('b', {}, file.name)),
            leaking
              ? h('p', { class: 'meta dim' }, 'This file is carrying the following — all of it gets wiped:')
              : null,
            MetaTable(meta),
          )
        : null,
      ErrorText(error),
      file && meta
        ? Btn(busy ? 'Scrubbing…' : leaking ? 'Scrub it all' : 'Rebuild anyway', { onclick: run, disabled: busy })
        : null,
    )
  }
  render()
  return root
}
