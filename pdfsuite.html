        if (!regions.some((r) => inRect(cx, cy, r))) return
        if (!rec) {
          const key = o.src.xpath.join('/')
          if (!perStream.has(key)) perStream.set(key, { xpath: o.src.xpath, ops: new Map() })
          const byOp = perStream.get(key).ops
          if (!byOp.has(o.src.op)) byOp.set(o.src.op, new Map())
          rec = { fs: o.fs, th: o.th, glyphs: o.glyphs, removed: new Set() }
          byOp.get(o.src.op).set(o.src.part, rec)
        }
        rec.removed.add(gi)
        stats.glyphs++
      })
    }
    // ---- images (redact mode) ----
    const imageEdits = [] // {xpath, op, newName, stream} | {xpath, op, inline: replacement text}
    if (mode === 'dropimg') { // remove whole images that match a region (editor: "edit this image")
      for (const o of ops) {
        if (o.t !== 'img' || !o.src) continue
        if (!regions.some((r) => sameBox(o.bbox, r))) continue
        const key = o.src.xpath.join('/')
        imageEdits.push({ key, xpath: o.src.xpath, op: o.src.op, drop: true })
        stats.images++
      }
      for (const e of imageEdits) if (!perStream.has(e.key)) perStream.set(e.key, { xpath: e.xpath, ops: new Map() })
    }
    if (mode === 'redact') {
      let n = 0
      for (const o of ops) {
        if (o.t !== 'img' || !o.src) continue
        if (!regions.some((r) => rectsHit(o.bbox, r))) continue
        const srcStream = o.ref ?? { dict: o.inline.dict, data: o.inline.data }
        let im = await decodeImage(doc, srcStream, { fill: o.fill, res: o.res, inline: !!o.inline }).catch(() => null)
        if (im?.kind === 'jpeg' && decodeJpeg) {
          const dj = await decodeJpeg(im.data).catch(() => null)
          im = dj ? { kind: 'rgba', ...dj } : null
        }
        const key = o.src.xpath.join('/')
        if (!im || im.kind !== 'rgba') { // can't edit pixels → drop the image entirely
          imageEdits.push({ key, xpath: o.src.xpath, op: o.src.op, drop: true })
          stats.images++
          continue
        }
        if (!blankPixels(im, o.m, regions, fillRgb)) continue
        stats.images++
        const st = await rgbaImageStream(im)
        if (o.inline) imageEdits.push({ key, xpath: o.src.xpath, op: o.src.op, inline: st })
        else imageEdits.push({ key, xpath: o.src.xpath, op: o.src.op, newName: `RDim${pi}_${++n}`, stream: st })
      }
      for (const e of imageEdits) if (!perStream.has(e.key)) perStream.set(e.key, { xpath: e.xpath, ops: new Map() })
    }
    // ---- rewrite every affected stream (page content + nested forms, copy-on-write) ----
    const pageRes = cloneRes(deref(doc, get(leaf.dict, 'Resources') ?? leaf.inh.Resources))
    const rewriteSrc = (src, toks, edits, images) => {
      const reps = []
      for (const [opIdx, parts] of edits) {
        const tok = toks[opIdx]
        if (!tok || !['Tj', 'TJ', "'", '"'].includes(tok.op)) continue
        reps.push([tok.start, tok.end, rewriteTextOp(tok, parts)])
      }
      for (const e of images) {
        const tok = toks[e.op]
        if (!tok) continue
        if (e.drop) reps.push([tok.start, tok.end, ''])
        else if (e.newName) reps.push([tok.start, tok.end, `/${e.newName} Do`])
        else if (e.inline) reps.push([tok.start, tok.end, `/${e.inlineName} Do`])
      }
      reps.sort((a, b) => b[0] - a[0])
      let out = src
      for (const [s0, e0, txt] of reps) out = concat([out.subarray(0, s0), enc(` ${txt} `), out.subarray(e0)])
      return out
    }
    // group by stream key; page content first
    const keys = [...perStream.keys()].sort((a, b) => a.split('/').length - b.split('/').length)
    let newPageContent = data
    for (const key of keys) {
      const { xpath, ops: edits } = perStream.get(key)
      const images = imageEdits.filter((e) => e.key === key)
      // new image XObjects go into the resources of the stream that draws them
      if (!xpath.length) {
        for (const e of images) {
          if (e.newName) addXObject(pageRes, e.newName, e.stream)
          if (e.inline) { e.inlineName = `RDin${pi}_${e.op}`; addXObject(pageRes, e.inlineName, e.inline) }
        }
        newPageContent = rewriteSrc(data, tokens, edits, images)
        continue
      }
      // nested form: walk the resource chain, cloning each form on the way (copy-on-write)
      let res = pageRes
      let form = null
      for (const nm of xpath) {
        const xo = deref(doc, res.get('XObject'))
        const fv = xo instanceof Map ? deref(doc, xo.get(nm)) : null
        if (!isStream(fv)) { form = null; break }
        const copy = { k: 't', dict: new Map(fv.dict), data: fv.data }
        const subRes = cloneRes(deref(doc, get(fv.dict, 'Resources')) ?? res)
        copy.dict.set('Resources', subRes)
        const xoCopy = new Map(xo)
        xoCopy.set(nm, copy)
        res.set('XObject', xoCopy)
        res = subRes
        form = copy
      }
      if (!form) continue
      const fdata = await streamData(form)
      if (!fdata) continue
      for (const e of images) {
        if (e.newName) addXObject(res, e.newName, e.stream)
        if (e.inline) { e.inlineName = `RDin${pi}_${e.op}`; addXObject(res, e.inlineName, e.inline) }
      }
      const ftoks = tokenizeContent(fdata)
      form.data = rewriteSrc(fdata, ftoks, edits, images)
      form.dict.delete('Filter')
      form.dict.delete('DecodeParms')
      form.dict.set('Length', form.data.length)
    }
    // ---- redaction boxes, painted in display space on top of everything ----
    let tail = ''
    if (mode === 'redact' && fill) {
      const [r, g, b] = fillRgb.map((v) => +(v / 255).toFixed(3))
      const boxes = regions.map((rg) => `${fnum(rg.x)} ${fnum(rg.y)} ${fnum(rg.w)} ${fnum(rg.h)} re`).join(' ')
      // boxes are in display space; disp maps user→display, so cm with disp⁻¹
      const det = disp[0] * disp[3] - disp[1] * disp[2]
      const inv = [disp[3] / det, -disp[1] / det, -disp[2] / det, disp[0] / det, (disp[2] * disp[5] - disp[3] * disp[4]) / det, (disp[1] * disp[4] - disp[0] * disp[5]) / det]
      tail = `\nq ${inv.map(fnum).join(' ')} cm ${r} ${g} ${b} rg ${boxes} f Q\n`
    }
    // the rewritten content replaces ALL of the page's streams (they were concatenated)
    const body = concat([enc('q\n'), newPageContent ?? new Uint8Array(0), enc('\nQ'), enc(tail)])
    leaf.dict.set('Contents', stream(new Map(), body))
    leaf.dict.set('Resources', pageRes)
    // ---- annotations under the regions ----
    if (mode === 'redact') {
      const an = deref(doc, get(leaf.dict, 'Annots'))
      if (Array.isArray(an)) {
        const keep = an.filter((r) => {
          const a = deref(doc, r)
          const rect = a instanceof Map ? deref(doc, get(a, 'Rect')) : null
          if (!Array.isArray(rect)) return true
          const [x0, y0, x1, y1] = rect.map(Number)
          const p1 = matPt(disp, x0, y0), p2 = matPt(disp, x1, y1)
          const bb = [Math.min(p1[0], p2[0]), Math.min(p1[1], p2[1]), Math.max(p1[0], p2[0]), Math.max(p1[1], p2[1])]
          const hit = regions.some((rg) => rectsHit(bb, rg))
          if (hit && get(a, 'Subtype')?.v !== 'Widget') { stats.annots++; return false }
          return true
        })
        leaf.dict.set('Annots', keep)
      }
    }
  }
  return stats
}

function cloneRes(res) {
  const m = res instanceof Map ? new Map(res) : new Map()
  return m
}
function addXObject(res, nm, st) {
  const xo = res.get('XObject')
  const m = xo instanceof Map ? new Map(xo) : new Map()
  m.set(nm, st)
  res.set('XObject', m)
}
function hexRgb(h) {
  const m = typeof h === 'string' ? h.match(/^#([0-9a-f]{6})$/i) : null
  if (!m) return null
  const n = parseInt(m[1], 16)
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255]
}

/**
 * Text under display-space point / rect, for the editor's "edit text" tool:
 * returns runs [{str, x, y, w, h, size, rot, font, color, glyphRect}] grouped
 * into visual lines (adjacent runs on one baseline merge).
 */
async function textRuns(doc, leaf) {
  const { ops } = await collectDrawOps(doc, leaf, { glyphs: true, annots: false })
  const runs = []
  for (const o of ops) {
    if (o.t !== 'text' || !o.str || o.inv || !o.glyphs?.length) continue
    if (Math.abs(o.rot) > 0.01) continue // rotated text: not editable in place
    // split one operator's glyphs into pieces at 2+ spaces or wide gaps —
    // generators often emit "FROM:   Company ABC" as a single string
    let piece = null
    let spaces = 0
    const flush = () => {
      if (!piece) return
      const s = piece.str.replace(/\s+$/, '')
      if (s.trim()) runs.push({ ...piece, str: s.replace(/^\s+/, '') })
      piece = null
    }
    for (const g of o.glyphs) {
      const isSpace = !g.s.trim()
      const gx0 = matPt(o.m, g.x, 0)[0], gx1 = matPt(o.m, g.x + g.w, 0)[0]
      const left = Math.min(gx0, gx1), right = Math.max(gx0, gx1)
      if (isSpace) { spaces++; if (piece) piece.str += g.s; continue }
      if (piece && (spaces >= 2 || left - (piece.x + piece.w) > o.h * 0.6)) flush()
      spaces = 0
      if (!piece) piece = { str: '', x: left, y: o.y - o.h * 0.78, w: 0, h: o.h, base: o.y, size: o.h, font: o.font, color: o.fc }
      piece.str += g.s
      piece.w = right - piece.x
    }
    flush()
  }
  // merge runs on one baseline whose gap is word-sized (kerned fragments → one phrase)
  runs.sort((a, b) => a.base - b.base || a.x - b.x)
  const merged = []
  for (const r of runs) {
    const last = merged[merged.length - 1]
    const gap = last ? r.x - (last.x + last.w) : 0
    if (last && Math.abs(last.base - r.base) < r.size * 0.25 && Math.abs(last.size - r.size) < r.size * 0.2 &&
        gap < r.size * 0.45 && r.x >= last.x - 0.5) {
      last.str += (gap > r.size * 0.15 && !last.str.endsWith(' ') ? ' ' : '') + r.str
      last.w = Math.max(last.x + last.w, r.x + r.w) - last.x
    } else merged.push({ ...r })
  }
  return merged
}

/**
 * Find every occurrence of `query` on a page → [{x, y, w, h, text}] boxes in
 * display space, glyph-accurate (for search-and-redact). Case-insensitive;
 * whitespace in the query matches any run of spaces/line joins.
 * opts.regex: treat query as a RegExp source (e.g. emails, phone numbers).
 */
async function findText(doc, leaf, query, { regex = false } = {}) {
  if (!query) return []
  const { ops } = await collectDrawOps(doc, leaf, { glyphs: true, annots: false })
  // flatten glyphs into reading-order lines
  const glyphs = []
  for (const o of ops) {
    if (o.t !== 'text' || !o.glyphs?.length || o.inv) continue
    for (const g of o.glyphs) {
      const [x0, yb] = matPt(o.m, g.x, 0)
      const [x1] = matPt(o.m, g.x + g.w, 0)
      glyphs.push({ s: g.s, x: Math.min(x0, x1), w: Math.abs(x1 - x0), base: yb, size: o.h, rot: o.rot })
    }
  }
  const flat = glyphs.filter((g) => Math.abs(g.rot) < 0.01).sort((a, b) => (Math.abs(a.base - b.base) < a.size * 0.4 ? a.x - b.x : a.base - b.base))
  let text = ''
  const map = [] // char index → glyph index
  flat.forEach((g, i) => {
    const prev = flat[i - 1]
    if (prev) {
      const newLine = Math.abs(prev.base - g.base) >= prev.size * 0.4
      const gap = g.x - (prev.x + prev.w)
      if (newLine || gap > g.size * 0.18) { text += ' '; map.push(-1) }
    }
    for (const ch of g.s) { text += ch; map.push(i) }
  })
  let re
  try {
    re = regex ? new RegExp(query, 'gi') : new RegExp(query.trim().split(/\s+/).map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('\\s+'), 'gi')
  } catch { return [] }
  const out = []
  for (const m of text.matchAll(re)) {
    if (!m[0]) continue
    const idx = map.slice(m.index, m.index + m[0].length).filter((k) => k >= 0)
    if (!idx.length) continue
    // one box per line the match spans
    const lines = new Map()
    for (const k of new Set(idx)) {
      const g = flat[k]
      const key = Math.round(g.base * 2)
      const b = lines.get(key) ?? { x0: Infinity, x1: -Infinity, base: g.base, size: g.size }
      b.x0 = Math.min(b.x0, g.x); b.x1 = Math.max(b.x1, g.x + g.w); b.size = Math.max(b.size, g.size)
      lines.set(key, b)
    }
    for (const b of lines.values()) out.push({ x: b.x0 - 0.5, y: b.base - b.size * 0.8, w: b.x1 - b.x0 + 1, h: b.size * 1.02, text: m[0] })
  }
  return out
}

// ---- src/pdf/forms.js ----
// Interactive forms (AcroForm): read fields + widget geometry, fill values
// with generated appearance streams (so every viewer shows them), and
// optionally flatten (bake into page content, remove interactivity).

const FF_READONLY = 1, FF_REQUIRED = 2, FF_MULTILINE = 1 << 12, FF_PASSWORD = 1 << 13
const FF_RADIO = 1 << 15, FF_PUSH = 1 << 16, FF_COMBO = 1 << 17, FF_EDIT = 1 << 18, FF_MULTISELECT = 1 << 21, FF_COMB = 1 << 24

/** Inherited field attribute lookup up the /Parent chain. */
function inh(doc, node, key) {
  for (let n = node, d = 0; n instanceof Map && d < 32; n = deref(doc, get(n, 'Parent')), d++) {
    const v = get(n, key)
    if (v !== undefined) return deref(doc, v)
  }
  return undefined
}

/** Parse a DA string "/Helv 12 Tf 0 0 1 rg" → {size, color:[r,g,b]}. */
function parseDA(da) {
  const s = da?.bytes ? new TextDecoder('latin1').decode(da.bytes) : ''
  const sz = s.match(/([\d.]+)\s+Tf/)
  let color = [0, 0, 0]
  const rg = s.match(/([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+rg/)
  const g = s.match(/([\d.]+)\s+g(?![a-z])/)
  if (rg) color = [+rg[1], +rg[2], +rg[3]]
  else if (g) color = [+g[1], +g[1], +g[1]]
  return { size: sz ? +sz[1] : 0, color }
}

/**
 * Read all terminal fields → [{name, type, value, options, flags, readOnly, required, multiline,
 *   maxLen, comb, align, da, widgets:[{page, rect:{x,y,w,h} (display), onState, ref}]}].
 * type: 'text' | 'checkbox' | 'radio' | 'combo' | 'list' | 'button' | 'signature'
 */
function readFields(doc) {
  const root = deref(doc, get(doc.trailer, 'Root'))
  const form = deref(doc, get(root, 'AcroForm'))
  if (!(form instanceof Map)) return []
  const leaves = pageLeaves(doc)
  // widget ref → page index (from page /Annots: more reliable than /P)
  const pageOf = new Map()
  leaves.forEach((leaf, i) => {
    const an = deref(doc, get(leaf.dict, 'Annots'))
    if (Array.isArray(an)) for (const r of an) if (isRef(r)) pageOf.set(`${r.n} ${r.g}`, i)
  })
  const geo = leaves.map((leaf) => {
    const box = pageBox(doc, leaf)
    return displayTransform(box, pageRotation(doc, leaf))
  })
  const fields = []
  const seen = new Set()
  const walk = (fref, prefix, depth) => {
    if (depth > 32) return
    const key = isRef(fref) ? `${fref.n} ${fref.g}` : null
    if (key && seen.has(key)) return
    if (key) seen.add(key)
    const f = deref(doc, fref)
    if (!(f instanceof Map)) return
    const t = get(f, 'T')
    const full = t ? (prefix ? `${prefix}.${pdfString(deref(doc, t))}` : pdfString(deref(doc, t))) : prefix
    const kids = deref(doc, get(f, 'Kids'))
    // kids that are fields (have /T) → recurse; kids without /T are this field's widgets
    const fieldKids = Array.isArray(kids) ? kids.filter((k) => { const kd = deref(doc, k); return kd instanceof Map && get(kd, 'T') !== undefined }) : []
    if (fieldKids.length) { for (const k of fieldKids) walk(k, full, depth + 1); return }
    const widgetRefs = Array.isArray(kids) && kids.length ? kids : [fref]
    const ft = inh(doc, f, 'FT')?.v
    const ff = inh(doc, f, 'Ff') ?? 0
    let type = ft === 'Tx' ? 'text' : ft === 'Ch' ? (ff & FF_COMBO ? 'combo' : 'list') : ft === 'Sig' ? 'signature'
      : ft === 'Btn' ? (ff & FF_PUSH ? 'button' : ff & FF_RADIO ? 'radio' : 'checkbox') : null
    if (!type) return
    const widgets = []
    for (const wr of widgetRefs) {
      const w = deref(doc, wr)
      if (!(w instanceof Map)) continue
      const rect = deref(doc, get(w, 'Rect'))
      const wkey = isRef(wr) ? `${wr.n} ${wr.g}` : null
      let page = wkey && pageOf.has(wkey) ? pageOf.get(wkey) : -1
      if (page < 0) {
        const p = get(w, 'P')
        if (isRef(p)) page = leaves.findIndex((l) => isRef(l.ref) && l.ref.n === p.n)
      }
      if (!Array.isArray(rect) || page < 0) continue
      const [x0, y0, x1, y1] = rect.map((v) => Number(deref(doc, v)))
      const a = matPt(geo[page], x0, y0), b = matPt(geo[page], x1, y1)
      // checkbox / radio on-state = the non-Off key of /AP /N
      let onState = null
      const apn = deref(doc, get(deref(doc, get(w, 'AP')), 'N'))
      if (apn instanceof Map && !isStream(apn)) onState = [...apn.keys()].find((k) => k !== 'Off') ?? null
      widgets.push({
        page, ref: wr, onState,
        rect: { x: Math.min(a[0], b[0]), y: Math.min(a[1], b[1]), w: Math.abs(b[0] - a[0]), h: Math.abs(b[1] - a[1]) },
        hidden: !!((deref(doc, get(w, 'F')) ?? 0) & 2),
      })
    }
    const v = inh(doc, f, 'V')
    let value
    if (type === 'checkbox') value = v?.k === 'n' && v.v !== 'Off'
    else if (type === 'radio') value = v?.k === 'n' && v.v !== 'Off' ? v.v : null
    else if (type === 'list' && Array.isArray(v)) value = v.map((x) => pdfString(deref(doc, x)))
    else value = v?.bytes ? pdfString(v) : v?.k === 'n' ? v.v : ''
    const opt = deref(doc, inh(doc, f, 'Opt'))
    const options = Array.isArray(opt) ? opt.map((o) => {
      o = deref(doc, o)
      if (Array.isArray(o)) return { value: pdfString(deref(doc, o[0])), label: pdfString(deref(doc, o[1])) }
      const s = pdfString(o)
      return { value: s, label: s }
    }) : []
    const da = parseDA(inh(doc, f, 'DA') ?? get(form, 'DA'))
    fields.push({
      name: full, type, value, options, flags: ff, ref: fref,
      readOnly: !!(ff & FF_READONLY), required: !!(ff & FF_REQUIRED), multiline: !!(ff & FF_MULTILINE),
      password: !!(ff & FF_PASSWORD), comb: !!(ff & FF_COMB), editable: !!(ff & FF_EDIT), multiSelect: !!(ff & FF_MULTISELECT),
      maxLen: inh(doc, f, 'MaxLen') ?? null, align: inh(doc, f, 'Q') ?? 0, da, widgets,
    })
  }
  const top = deref(doc, get(form, 'Fields'))
  if (Array.isArray(top)) for (const f of top) walk(f, '', 0)
  return fields
}

const n2 = (v) => +(+v).toFixed(3)

/** Appearance stream for a text-ish widget showing `text`. */
function textAppearance(text, w, h, { size, color, align, multiline, comb, maxLen }) {
  const base = stdFont('helv')
  const pad = 2
  let fs = size || 0
  const lines = multiline ? wrapLines(text, base, fs || 12, w - 2 * pad) : [text]
  if (!fs) { // auto size: fit height (and width for single-line)
    fs = multiline ? 10 : Math.max(4, Math.min(12, (h - 2 * pad) * 0.75))
    if (!multiline) while (fs > 4 && textWidth(base, text, fs) > w - 2 * pad) fs -= 0.5
  }
  const [r, g, b] = color
  let body = ''
  if (comb && maxLen > 0) {
    const cell = w / maxLen
    ;[...text].slice(0, maxLen).forEach((ch, i) => {
      const cw = textWidth(base, ch, fs)
      body += `BT /Helv ${n2(fs)} Tf ${n2(i * cell + (cell - cw) / 2)} ${n2((h - fs * 0.72) / 2)} Td ${winStr(ch)} Tj ET\n`
    })
  } else {
    const ls = multiline ? wrapLines(text, base, fs, w - 2 * pad) : lines
    const lead = fs * 1.15
    ls.forEach((ln, i) => {
      const tw = textWidth(base, ln, fs)
      const x = align === 1 ? (w - tw) / 2 : align === 2 ? w - pad - tw : pad
      const y = multiline ? h - pad - fs * 0.9 - i * lead : (h - fs * 0.72) / 2
      body += `BT /Helv ${n2(fs)} Tf ${n2(x)} ${n2(y)} Td ${winStr(ln)} Tj ET\n`
    })
  }
  return `/Tx BMC q 1 1 ${n2(w - 2)} ${n2(h - 2)} re W n ${n2(r)} ${n2(g)} ${n2(b)} rg\n${body}Q EMC`
}

function wrapLines(text, base, fs, maxW) {
  const out = []
  for (const para of String(text).split('\n')) {
    let line = ''
    for (const word of para.split(/(\s+)/)) {
      const t = line + word
      if (line && textWidth(base, t.trimEnd(), fs) > maxW) { out.push(line.trimEnd()); line = word.trimStart() }
      else line = t
    }
    out.push(line)
  }
  return out
}

const checkAppearance = (w, h, color = [0, 0, 0]) => {
  // ZapfDingbats-free check mark drawn as a path (no font dependency)
  const s = Math.min(w, h) * 0.8, ox = (w - s) / 2, oy = (h - s) / 2
  const [r, g, b] = color
  return `q ${n2(r)} ${n2(g)} ${n2(b)} RG ${n2(Math.max(1, s * 0.12))} w 1 J 1 j ${n2(ox + s * 0.15)} ${n2(oy + s * 0.5)} m ${n2(ox + s * 0.4)} ${n2(oy + s * 0.22)} l ${n2(ox + s * 0.88)} ${n2(oy + s * 0.82)} l S Q`
}
const dotAppearance = (w, h, color = [0, 0, 0]) => {
  const r = Math.min(w, h) * 0.28, cx = w / 2, cy = h / 2, k = 0.5523 * r
  const [cr, cg, cb] = color
  return `q ${n2(cr)} ${n2(cg)} ${n2(cb)} rg ${n2(cx + r)} ${n2(cy)} m ${n2(cx + r)} ${n2(cy + k)} ${n2(cx + k)} ${n2(cy + r)} ${n2(cx)} ${n2(cy + r)} c ${n2(cx - k)} ${n2(cy + r)} ${n2(cx - r)} ${n2(cy + k)} ${n2(cx - r)} ${n2(cy)} c ${n2(cx - r)} ${n2(cy - k)} ${n2(cx - k)} ${n2(cy - r)} ${n2(cx)} ${n2(cy - r)} c ${n2(cx + k)} ${n2(cy - r)} ${n2(cx + r)} ${n2(cy - k)} ${n2(cx + r)} ${n2(cy)} c f Q`
}

/**
 * Fill fields: values = {fieldName: string | boolean | string[]}.
 * opts.flatten: bake appearances into page content and drop the form.
 * Returns new PDF bytes.
 */
async function fillForm(bytes, values, { flatten = false } = {}) {
  const doc = bytes instanceof Uint8Array ? await parsePdf(bytes) : bytes
  const fields = readFields(doc)
  const helv = new Map([['Type', name('Font')], ['Subtype', name('Type1')], ['BaseFont', name('Helvetica')], ['Encoding', name('WinAnsiEncoding')]])
  const mkAP = (content, w, h, withFont) => {
    const res = new Map()
    if (withFont) res.set('Font', new Map([['Helv', helv]]))
    return stream(new Map([['Type', name('XObject')], ['Subtype', name('Form')], ['BBox', [0, 0, n2(w), n2(h)]], ['Resources', res]]), enc(content))
  }
  const setOn = (node, k, v) => { if (node instanceof Map) node.set(k, v) }
  for (const f of fields) {
    if (!(f.name in values) || f.readOnly) continue
    const v = values[f.name]
    const fd = deref(doc, f.ref)
    if (f.type === 'text' || f.type === 'combo' || f.type === 'list') {
      const sv = Array.isArray(v) ? v : String(v ?? '')
      const shown = Array.isArray(sv) ? sv.join(', ') : f.maxLen ? sv.slice(0, f.maxLen) : sv
      setOn(fd, 'V', Array.isArray(sv) ? sv.map(textString) : textString(shown))
      for (const wd of f.widgets) {
        const w = deref(doc, wd.ref)
        const rect = deref(doc, get(w, 'Rect')).map(Number)
        const ww = Math.abs(rect[2] - rect[0]), hh = Math.abs(rect[3] - rect[1])
        const display = f.type === 'list' || f.type === 'combo' ? (f.options.find((o) => o.value === shown)?.label ?? shown) : f.password ? '•'.repeat(shown.length) : shown
        const ap = mkAP(textAppearance(display, ww, hh, { size: f.da.size, color: f.da.color, align: f.align, multiline: f.multiline, comb: f.comb, maxLen: f.maxLen }), ww, hh, true)
        w.set('AP', new Map([['N', ap]]))
      }
    } else if (f.type === 'checkbox') {
      const on = v === true || v === 'true' || v === 'on' || v === 'Yes'
      for (const wd of f.widgets) {
        const w = deref(doc, wd.ref)
        const st = wd.onState ?? 'Yes'
        w.set('AS', name(on ? st : 'Off'))
        if (!wd.onState) { // no appearance for "on" yet → build both states
          const rect = deref(doc, get(w, 'Rect')).map(Number)
          const ww = Math.abs(rect[2] - rect[0]), hh = Math.abs(rect[3] - rect[1])
          w.set('AP', new Map([['N', new Map([['Yes', mkAP(checkAppearance(ww, hh, f.da.color), ww, hh)], ['Off', mkAP('', ww, hh)]])]]))
        }
      }
      setOn(fd, 'V', name(on ? (f.widgets[0]?.onState ?? 'Yes') : 'Off'))
    } else if (f.type === 'radio') {
      const pick = v == null || v === false ? 'Off' : String(v)
      for (const wd of f.widgets) {
        const w = deref(doc, wd.ref)
        const st = wd.onState
        w.set('AS', name(st && st === pick ? st : 'Off'))
        if (!st) {
          const rect = deref(doc, get(w, 'Rect')).map(Number)
          const ww = Math.abs(rect[2] - rect[0]), hh = Math.abs(rect[3] - rect[1])
          w.set('AP', new Map([['N', new Map([[pick, mkAP(dotAppearance(ww, hh, f.da.color), ww, hh)], ['Off', mkAP('', ww, hh)]])]]))
        }
      }
      setOn(fd, 'V', name(pick))
    }
  }
  const root = deref(doc, get(doc.trailer, 'Root'))
  const form = deref(doc, get(root, 'AcroForm'))
  if (form instanceof Map) form.set('NeedAppearances', false)
  if (!flatten) return stampPages(doc, () => null)
  // flatten: strip widgets from the pages up front (pages are copied before
  // stampFor runs), remember their appearances, then draw them as content
  const bake = pageLeaves(doc).map((leaf) => {
    const an = deref(doc, get(leaf.dict, 'Annots'))
    if (!Array.isArray(an)) return []
    const keep = [], todo = []
    for (const r of an) {
      const a = deref(doc, r)
      if (!(a instanceof Map) || get(a, 'Subtype')?.v !== 'Widget') { keep.push(r); continue }
      if ((deref(doc, get(a, 'F')) ?? 0) & 2) continue
      let ap = get(deref(doc, get(a, 'AP')), 'N')
      let apv = deref(doc, ap)
      if (apv instanceof Map && !isStream(apv)) { const as = get(a, 'AS'); ap = as?.k === 'n' ? apv.get(as.v) : null; apv = deref(doc, ap) }
      if (!isStream(apv)) continue
      todo.push({ ap, apv, rect: deref(doc, get(a, 'Rect')).map(Number) })
    }
    if (keep.length) leaf.dict.set('Annots', keep)
    else leaf.dict.delete('Annots')
    return todo
  })
  if (form instanceof Map) root.delete('AcroForm')
  return stampPages(doc, ({ i, dst }) => {
    const todo = bake[i]
    if (!todo?.length) return null
    const xo = {}
    let content = ''
    todo.forEach(({ ap, apv, rect }, k) => {
      const bb = (deref(doc, get(apv.dict, 'BBox')) ?? [0, 0, rect[2] - rect[0], rect[3] - rect[1]]).map(Number)
      const sx = (Math.abs(rect[2] - rect[0]) || 1) / ((bb[2] - bb[0]) || 1)
      const sy = (Math.abs(rect[3] - rect[1]) || 1) / ((bb[3] - bb[1]) || 1)
      const nm = `FLT${k + 1}`
      if (!get(apv.dict, 'Subtype')) { apv.dict.set('Type', name('XObject')); apv.dict.set('Subtype', name('Form')) }
      xo[nm] = copyValue(isRef(ap) ? ap : apv, doc, dst, new Map())
      content += `q ${n2(sx)} 0 0 ${n2(sy)} ${n2(Math.min(rect[0], rect[2]) - bb[0] * sx)} ${n2(Math.min(rect[1], rect[3]) - bb[1] * sy)} cm /${nm} Do Q\n`
    })
    return { content: '\n' + content, res: { XObject: xo } }
  })
}

// ---- src/pdf/render.js ----
// Canvas renderer for collectDrawOps output — browser-side only.
// Paints text glyph-by-glyph at the PDF's own positions (substitute system
// fonts, matched by family/weight/style), images through their full matrix,
// vector paths, gradients, clips, alpha and blend modes.

const FAMILY = {
  serif: '"Times New Roman", Times, "Liberation Serif", Georgia, serif',
  sans: 'Arial, Helvetica, "Liberation Sans", "Segoe UI", sans-serif',
  mono: '"Courier New", Courier, "Liberation Mono", monospace',
}
const fontCss = (f, px) => {
  const fam = f?.mono ? FAMILY.mono : f?.serif ? FAMILY.serif : FAMILY.sans
  return `${f?.italic ? 'italic ' : ''}${f?.bold ? '700 ' : ''}${px}px ${fam}`
}

/** Decode an image op once per doc → CanvasImageSource | null (cached). */
async function imageSource(doc, op, cache) {
  const key = op.ref ?? op.inline
  if (key && cache.has(key)) return cache.get(key)
  const p = (async () => {
    const src = op.ref ?? { dict: op.inline.dict, data: op.inline.data }
    const im = await decodeImage(doc, src, { fill: op.fill ?? [0, 0, 0], res: op.res, inline: !!op.inline }).catch(() => null)
    if (!im) return null
    if (im.kind === 'rgba') return rgbaCanvas(im.w, im.h, im.rgba)
    if (im.kind === 'jpeg') {
      const bmp = await createImageBitmap(new Blob([im.data], { type: 'image/jpeg' })).catch(() => null)
      if (!bmp) return null
      if (!im.smask && !im.invert) return bmp
      const cv = document.createElement('canvas')
      cv.width = bmp.width
      cv.height = bmp.height
      const c = cv.getContext('2d')
      c.drawImage(bmp, 0, 0)
      const id = c.getImageData(0, 0, cv.width, cv.height)
      if (im.invert) for (let i = 0; i < id.data.length; i += 4) { id.data[i] = 255 - id.data[i]; id.data[i + 1] = 255 - id.data[i + 1]; id.data[i + 2] = 255 - id.data[i + 2] }
      if (im.smask) {
        const { w: mw, h: mh, a } = im.smask
        for (let y = 0; y < cv.height; y++) {
          const my = Math.min(mh - 1, Math.floor((y * mh) / cv.height))
          for (let x = 0; x < cv.width; x++) {
            const mx = Math.min(mw - 1, Math.floor((x * mw) / cv.width))
            id.data[(y * cv.width + x) * 4 + 3] = a[my * mw + mx]
          }
        }
      }
      c.putImageData(id, 0, 0)
      return cv
    }
    return null // JPX: no browser decoder
  })()
  if (key) cache.set(key, p)
  return p
}

function rgbaCanvas(w, h, rgba) {
  const cv = document.createElement('canvas')
  cv.width = w
  cv.height = h
  cv.getContext('2d').putImageData(new ImageData(rgba, w, h), 0, 0)
  return cv
}

const CAP = ['butt', 'round', 'square']
const JOIN = ['miter', 'round', 'bevel']
const rgb = (c, fallback = '#000') => (c ? `rgb(${Math.round(c[0] * 255)},${Math.round(c[1] * 255)},${Math.round(c[2] * 255)})` : fallback)

/**
 * Paint draw ops onto ctx. scale = device px per pt. Returns nothing.
 * opts.skipText: leave text out (the editor's text-edit mode paints its own).
 */
async function paintOps(ctx, doc, ops, scale, cache = new Map(), { hide = null, hideGlyph = null } = {}) {
  let saves = 0
  const base = () => ctx.setTransform(scale, 0, 0, scale, 0, 0)
  const trace = (segs) => {
    ctx.beginPath()
    for (const seg of segs) {
      if (seg[0] === 'M') ctx.moveTo(seg[1], seg[2])
      else if (seg[0] === 'L') ctx.lineTo(seg[1], seg[2])
      else if (seg[0] === 'C') ctx.bezierCurveTo(seg[1], seg[2], seg[3], seg[4], seg[5], seg[6])
      else if (seg[0] === 'Z') ctx.closePath()
    }
  }
  const minLw = 1 / scale // hairlines: one device pixel
  base()
  for (const op of ops) {
    if (hide && hide(op)) continue
    ctx.globalCompositeOperation = op.blend ?? 'source-over'
    if (op.t === 'clip') {
      ctx.save(); saves++
      base()
      trace(op.segs)
      ctx.clip(op.eo ? 'evenodd' : 'nonzero')
    } else if (op.t === 'unclip') {
      if (saves > 0) { ctx.restore(); saves-- }
    } else if (op.t === 'rect' || op.t === 'path') {
      base()
      if (op.t === 'rect') { ctx.beginPath(); ctx.rect(op.x, op.y, op.w, op.h) } else trace(op.segs)
      if (op.fill) {
        ctx.globalAlpha = op.a ?? 1
        ctx.fillStyle = rgb(op.fc)
        ctx.fill(op.eo ? 'evenodd' : 'nonzero')
      }
      if (op.stroke) {
        ctx.globalAlpha = op.sa ?? 1
        ctx.strokeStyle = rgb(op.sc)
        ctx.lineWidth = Math.max(minLw, op.lw ?? 1)
        ctx.lineCap = CAP[op.cap] ?? 'butt'
        ctx.lineJoin = JOIN[op.join] ?? 'miter'
        ctx.setLineDash(op.dash ?? [])
        ctx.lineDashOffset = op.doff ?? 0
        ctx.stroke()
        ctx.setLineDash([])
      }
    } else if (op.t === 'shade') {
      base()
      ctx.globalAlpha = op.a ?? 1
      if (op.kind === 'flat') ctx.fillStyle = rgb(op.color)
      else {
        const g = op.kind === 'axial'
          ? ctx.createLinearGradient(...op.coords)
          : ctx.createRadialGradient(...op.coords)
        for (const [t, c] of op.stops) g.addColorStop(Math.min(1, Math.max(0, t)), rgb(c))
        ctx.fillStyle = g
      }
      ctx.fillRect(-1e4, -1e4, 2e4, 2e4) // the active clip bounds it
    } else if (op.t === 'img') {
      const src = await imageSource(doc, op, cache)
      if (!src) continue
      const m = op.m
      // unit square (y up) → display; flip so bitmap row 0 lands at the top
      ctx.setTransform(scale * m[0], scale * m[1], scale * m[2], scale * m[3], scale * m[4], scale * m[5])
      ctx.transform(1, 0, 0, -1, 0, 1)
      ctx.globalAlpha = op.a ?? 1
      // upscaled small images look terrible blurred; tiny-source stencils stay crisp
      const sw = src.width ?? 1
      ctx.imageSmoothingEnabled = !(sw < 64 && op.w * scale > sw * 4)
      ctx.imageSmoothingQuality = 'high'
      ctx.drawImage(src, 0, 0, 1, 1)
      base()
    } else if (op.t === 'text') {
      if (op.inv || !op.h) continue
      const px = op.h * scale
      const m = op.m
      if (!op.str || px < 3.2 || !op.gx) {
        // too small to read (thumbnails) or undecodable: draw an ink bar
        if (op.w * scale < 0.5) continue
        if (hideGlyph) { // a run being edited mustn't reappear as a grey bar at low zoom
          const cx = m[0] * (op.fs * 0.3) + m[2] * op.fs * 0.32 + m[4], cy = m[1] * (op.fs * 0.3) + m[3] * op.fs * 0.32 + m[5]
          if (hideGlyph(cx, cy)) continue
        }
        ctx.setTransform(scale * m[0], scale * m[1], scale * m[2], scale * m[3], scale * m[4], scale * m[5])
        ctx.globalAlpha = (op.a ?? 1) * 0.55
        ctx.fillStyle = rgb(op.fc)
        const adv = op.gx?.length ? op.gx[op.gx.length - 2] + op.fs * 0.5 : op.fs * op.str.length * 0.5
        ctx.fillRect(0, 0, Math.max(adv, op.fs * 0.3), op.fs * 0.62)
        base()
        continue
      }
      // text space (y-up, font size fs) → work in device-sized units so the
      // browser rasterises glyphs at their real pixel size (no 1px-font blur)
      const q = px / op.fs
      const th = op.th || 1
      ctx.setTransform(scale * m[0], scale * m[1], scale * m[2], scale * m[3], scale * m[4], scale * m[5])
      ctx.scale(th / q, -1 / q)
      ctx.font = fontCss(op.font, px)
      ctx.textBaseline = 'alphabetic'
      const mode = (op.mode ?? 0) % 4
      const fill = mode === 0 || mode === 2
      const stroke = mode === 1 || mode === 2
      ctx.fillStyle = rgb(op.fc)
      ctx.strokeStyle = rgb(op.sc)
      ctx.lineWidth = Math.max(0.03 * px, 1)
      const gx = op.gx
      for (let i = 0; i < gx.length; i += 2) {
        const ch = gx[i + 1]
        if (!ch || ch === ' ') continue
        if (hideGlyph) { // editor: glyphs under an "edit text" region aren't painted
          const adv = i + 2 < gx.length ? gx[i + 2] - gx[i] : op.fs * 0.5
          const cx = m[0] * (gx[i] + adv / 2) + m[2] * op.fs * 0.32 + m[4]
          const cy = m[1] * (gx[i] + adv / 2) + m[3] * op.fs * 0.32 + m[5]
          if (hideGlyph(cx, cy)) continue
        }
        const x = (gx[i] / th) * q
        if (fill) { ctx.globalAlpha = op.a ?? 1; ctx.fillText(ch, x, 0) }
        if (stroke) { ctx.globalAlpha = op.sa ?? 1; ctx.strokeText(ch, x, 0) }
      }
      base()
    }
  }
  while (saves-- > 0) ctx.restore()
  ctx.globalAlpha = 1
  ctx.globalCompositeOperation = 'source-over'
  ctx.setTransform(1, 0, 0, 1, 0, 0)
}

/**
 * Render a page to a new canvas `width` px wide (white background).
 * cache: Map shared across pages of one doc (decoded images).
 * Returns null for pages whose content can't be read at all.
 */
async function renderPage(doc, leaf, { width = 160, cache = new Map(), annots = true, widgets = true } = {}) {
  const { ops, box } = await collectDrawOps(doc, leaf, { annots, widgets })
  const scale = width / box.w
  const canvas = document.createElement('canvas')
  canvas.width = Math.max(2, Math.round(box.w * scale))
  canvas.height = Math.max(2, Math.round(box.h * scale))
  const ctx = canvas.getContext('2d')
  ctx.fillStyle = '#ffffff'
  ctx.fillRect(0, 0, canvas.width, canvas.height)
  if (!ops.length) return canvas // a genuinely blank page is still a page
  await paintOps(ctx, doc, ops, scale, cache)
  return canvas
}

// Tiny DOM helper — h(tag, attrs, ...children). No framework, no build.

function h(tag, attrs, ...kids) {
  const el = tag === 'svg' || tag === 'path' ? document.createElementNS('http://www.w3.org/2000/svg', tag) : document.createElement(tag)
  for (const [k, v] of Object.entries(attrs ?? {})) {
    if (v === undefined || v === null || v === false) continue
    if (k === 'class') el.setAttribute('class', v)
    else if (k === 'dataset') Object.assign(el.dataset, v)
    else if (k === 'style' && typeof v === 'object') {
      // custom properties (--x) only work through setProperty, not assignment
      for (const [sk, sv] of Object.entries(v)) if (sk.startsWith('--')) el.style.setProperty(sk, sv); else el.style[sk] = sv
    }
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v)
    else if (k === 'value' && 'value' in el) el.value = v
    else if (k === 'checked' || k === 'selected' || k === 'disabled' || k === 'multiple') { el[k] = !!v; if (v) el.setAttribute(k, '') }
    else if (v === true) el.setAttribute(k, '')
    else el.setAttribute(k, v)
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue
    el.append(kid?.nodeType ? kid : document.createTextNode(String(kid)))
  }
  return el
}

function icon(name, cls = 'icon') {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
  svg.setAttribute('viewBox', name === 'github' ? '0 0 16 16' : '0 0 24 24')
  svg.setAttribute('class', cls)
  svg.setAttribute('aria-hidden', 'true')
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path')
  if (name === 'github') {
    p.setAttribute('d', GITHUB)
    p.setAttribute('fill', 'currentColor')
  } else {
    p.setAttribute('d', ICONS[name] ?? ICONS.file)
    p.setAttribute('fill', 'none')
    p.setAttribute('stroke', 'currentColor')
    p.setAttribute('stroke-width', name === 'more' || name === 'grip' ? '3' : '1.8')
    p.setAttribute('stroke-linecap', 'round')
    p.setAttribute('stroke-linejoin', 'round')
  }
  svg.append(p)
  return svg
}

// replaceChildren converts null/undefined args into literal "null" text nodes —
// always re-render through this instead.
function setKids(el, ...kids) {
  el.replaceChildren(...kids.flat(Infinity).filter((k) => k !== null && k !== undefined && k !== false))
}

function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob)
  const a = h('a', { href: url, download: name, style: { display: 'none' } })
  document.body.append(a)
  a.click()
  a.remove()
  setTimeout(() => URL.revokeObjectURL(url), 30_000)
}

const readBytes = async (file) => new Uint8Array(await file.arrayBuffer())

function fmtBytes(n) {
  if (!Number.isFinite(n)) return ''
  if (n < 1024) return `${n} B`
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(n < 10240 ? 1 : 0)} KB`
  return `${(n / 1024 / 1024).toFixed(n < 10485760 ? 2 : 1)} MB`
}

const plural = (n, word, many = word + 's') => `${n} ${n === 1 ? word : many}`
const stem = (filename) => filename.replace(/\.[^.]+$/, '')

/** Run fn on the next animation frame at most once per frame. */
function rafThrottle(fn) {
  let id = 0
  let args = null
  return (...a) => {
    args = a
    if (id) return
    id = requestAnimationFrame(() => { id = 0; fn(...args) })
  }
}

/**
 * Let the browser paint between chunks of heavy work. Uses scheduler.yield or
 * a MessageChannel hop — setTimeout gets throttled to ≥1s in background tabs,
 * which would stall a long job the moment the user switches tabs.
 */
function yieldUI() {
  if (globalThis.scheduler?.yield) return globalThis.scheduler.yield()
  return new Promise((r) => { const ch = new MessageChannel(); ch.port1.onmessage = () => r(); ch.port2.postMessage(0) })
}

/** Button({label, icon, variant: primary|danger|ghost, size: sm|lg, block, busy, disabled, tip, onClick}) */
function Button({ label = '', icon: ic, variant, size, block, busy, disabled, tip, onClick, type = 'button', cls = '', kbd } = {}) {
  return h('button', {
    type, disabled: disabled || busy,
    class: ['btn', variant && `btn-${variant}`, size && `btn-${size}`, block && 'btn-block', !label && 'btn-icon', cls].filter(Boolean).join(' '),
    'data-tip': tip, 'aria-label': tip || label || undefined, onclick: onClick,
  }, busy ? h('span', { class: 'spin' }) : ic ? icon(ic, size === 'sm' ? 'icon-sm' : 'icon') : null, label, kbd ? h('span', { class: 'kbd' }, kbd) : null)
}

const IconButton = (ic, tip, onClick, opts = {}) => Button({ icon: ic, tip, onClick, variant: opts.variant ?? 'ghost', size: opts.size ?? 'sm', disabled: opts.disabled, cls: opts.active ? 'on' : '' })

/** Segmented control. options: [[value, label, icon?, tip?]] */
function Seg(options, value, onChange, { block = false } = {}) {
  const el = h('div', { class: 'seg' + (block ? ' block' : ''), role: 'radiogroup' })
  const paint = (v) => {
    setKids(el, options.map(([val, label, ic, tip]) => h('button', {
      type: 'button', class: val === v ? 'on' : '', role: 'radio', 'aria-checked': String(val === v), 'data-tip': tip,
      onclick: () => { paint(val); onChange(val) },
    }, ic ? icon(ic, 'icon-sm') : null, label)))
  }
  paint(value)
  el.set = paint
  return el
}

function Switch(label, checked, onChange, { hint } = {}) {
  const input = h('input', { type: 'checkbox', checked, onchange: (e) => onChange(e.target.checked) })
  return h('label', { class: 'switch' }, h('span', { class: 'sw-text' }, label, hint ? h('small', {}, hint) : null), input, h('span', { class: 'track' }))
}

/** Range slider with live value label. fmt(v) → string. */
function Range(value, { min = 0, max = 100, step = 1, fmt = (v) => String(v) } = {}, onInput) {
  const val = h('span', { class: 'val' }, fmt(value))
  const input = h('input', {
    type: 'range', min: String(min), max: String(max), step: String(step), value: String(value),
    oninput: (e) => { const v = +e.target.value; val.textContent = fmt(v); onInput(v) },
  })
  const el = h('div', { class: 'range' }, input, val)
  el.set = (v) => { input.value = String(v); val.textContent = fmt(v) }
  return el
}

function Select(options, value, onChange) {
  return h('select', { class: 'select', onchange: (e) => onChange(e.target.value) },
    options.map(([v, label]) => h('option', { value: v, selected: String(v) === String(value) }, label)))
}

function TextInput(value, onInput, { placeholder = '', type = 'text', maxlength, autocomplete = 'off', onEnter } = {}) {
  return h('input', {
    class: 'input', type, value, placeholder, maxlength, autocomplete, spellcheck: 'false',
    oninput: (e) => onInput(e.target.value),
    onkeydown: onEnter ? (e) => { if (e.key === 'Enter') onEnter() } : undefined,
  })
}

function Field(label, control, { hint, right } = {}) {
  return h('div', { class: 'field' }, h('label', {}, h('span', {}, label), right ?? (hint ? h('span', { class: 'hint' }, hint) : null)), control)
}

function Stepper(value, { min = -Infinity, max = Infinity, step = 1 } = {}, onChange) {
  let v = value
  const input = h('input', { value: String(v), inputmode: 'numeric', onchange: (e) => set(parseFloat(e.target.value)) })
  const set = (nv) => {
    if (!Number.isFinite(nv)) nv = v
    v = Math.min(max, Math.max(min, Math.round(nv / step) * step))
    input.value = String(+v.toFixed(2))
    onChange(v)
  }
  return h('div', { class: 'stepper' },
    h('button', { type: 'button', 'aria-label': 'Decrease', onclick: () => set(v - step) }, '−'), input,
    h('button', { type: 'button', 'aria-label': 'Increase', onclick: () => set(v + step) }, '+'))
}

const COLORS = ['#111111', '#e03131', '#1971c2', '#2f9e44', '#f08c00', '#9c36b5', '#ffffff']
/** Colour swatches + custom picker. allowNone adds a "no colour" swatch (value null). */
function Swatches(value, onChange, { colors = COLORS, allowNone = false } = {}) {
  const el = h('div', { class: 'swatches' })
  const paint = (v) => {
    const custom = v && !colors.includes(v)
    setKids(el,
      allowNone ? h('button', { type: 'button', class: 'swatch none' + (v === null ? ' on' : ''), title: 'None', onclick: () => { paint(null); onChange(null) } }) : null,
      colors.map((c) => h('button', { type: 'button', class: 'swatch' + (c === v ? ' on' : ''), title: c, style: { background: c }, onclick: () => { paint(c); onChange(c) } })),
      h('label', { class: 'swatch swatch-custom' + (custom ? ' on' : ''), title: 'Custom colour', style: custom ? { background: v } : {} },
        h('input', { type: 'color', value: v || '#000000', oninput: (e) => { onChange(e.target.value) }, onchange: (e) => paint(e.target.value) })))
  }
  paint(value)
  el.set = paint
  return el
}

// ---------- drop zone ----------

/**
 * Big drop target / browse button. onFiles(File[]).
 * opts: accept, multiple, title, subtitle, compact, tc (tool colour), icon, label (button)
 */
function Dropzone({ accept = 'application/pdf', multiple = false, onFiles, title, subtitle, compact = false, tc, icon: ic = 'upload', label } = {}) {
  const input = h('input', {
    type: 'file', accept, multiple, class: 'hidden-input', tabindex: '-1',
    onchange: (e) => { const fs = [...e.target.files]; e.target.value = ''; if (fs.length) onFiles(filterAccept(fs, accept)) },
  })
  const zone = h('div', {
    class: 'dz' + (compact ? ' compact' : ''), role: 'button', tabindex: '0', style: tc ? { '--tc': tc } : {},
    onclick: () => input.click(),
    onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click() } },
  },
  input,
  h('div', { class: 'dz-icon' }, icon(ic, compact ? 'icon' : 'icon-xl')),
  compact
    ? h('h2', {}, title ?? `Add ${multiple ? 'files' : 'a file'}`)
    : [h('h2', {}, title ?? `Drop your ${multiple ? 'files' : 'file'} here`),
        h('p', {}, subtitle ?? 'or'),
        h('span', { class: 'btn btn-primary btn-lg' }, icon('file', 'icon'), label ?? `Choose ${multiple ? 'files' : 'file'}`),
        h('span', { class: 'privacy' }, icon('shield', 'icon-sm'), 'Processed on your device — nothing is uploaded')])
  let depth = 0
  zone.addEventListener('dragenter', (e) => { e.preventDefault(); depth++; zone.classList.add('over') })
  zone.addEventListener('dragover', (e) => e.preventDefault())
  zone.addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; zone.classList.remove('over') } })
  zone.addEventListener('drop', (e) => {
    e.preventDefault()
    e.stopPropagation()
    depth = 0
    zone.classList.remove('over')
    const fs = filterAccept([...e.dataTransfer.files], accept)
    if (fs.length) onFiles(multiple ? fs : fs.slice(0, 1))
    else if (e.dataTransfer.files.length) toast(`That file type isn't supported here`, { type: 'error' })
  })
  return zone
}

/** Keep files matching an accept string (by MIME or extension). */
function filterAccept(files, accept) {
  const pats = accept.split(',').map((s) => s.trim().toLowerCase()).filter(Boolean)
  if (!pats.length) return files
  return files.filter((f) => {
    const name = f.name.toLowerCase(), type = (f.type || '').toLowerCase()
    return pats.some((p) => (p.startsWith('.') ? name.endsWith(p) : p.endsWith('/*') ? type.startsWith(p.slice(0, -1)) : type === p || (p === 'application/pdf' && name.endsWith('.pdf'))))
  })
}

function FileChip({ name, size, meta, thumb, onReplace, onRemove, extra }) {
  return h('div', { class: 'filechip' },
    thumb ?? h('div', { class: 'fc-icon' }, 'PDF'),
    h('div', { class: 'fc-main' }, h('div', { class: 'fc-name', title: name }, name), h('div', { class: 'fc-meta' }, [fmtBytes(size), meta].filter(Boolean).join(' · '))),
    extra ?? null,
    onReplace ? Button({ label: 'Replace', size: 'sm', onClick: onReplace }) : null,
    onRemove ? IconButton('x', 'Remove', onRemove) : null)
}

/** Ask for a file via a hidden input (for "Replace" / "Add" buttons). */
function pickFiles({ accept = 'application/pdf', multiple = false } = {}) {
  return new Promise((resolve) => {
    const input = h('input', { type: 'file', accept, multiple, class: 'hidden-input' })
    input.addEventListener('change', () => { resolve(filterAccept([...input.files], accept)); input.remove() })
    input.addEventListener('cancel', () => { resolve([]); input.remove() })
    document.body.append(input)
    input.click()
  })
}

// ---------- feedback ----------

let toastHost = null
/** toast(msg, {type: 'ok'|'error'|'info', action: [label, fn], timeout}) */
function toast(msg, { type = 'ok', action, timeout = type === 'error' ? 6000 : 3500 } = {}) {
  if (!toastHost || !toastHost.isConnected) { toastHost = h('div', { class: 'toasts', role: 'status', 'aria-live': 'polite' }); document.body.append(toastHost) }
  const close = () => { el.classList.add('out'); setTimeout(() => el.remove(), 200) }
  const el = h('div', { class: 'toast' + (type === 'error' ? ' error' : '') },
    icon(type === 'error' ? 'alert' : type === 'info' ? 'info' : 'checkCircle', 'icon-sm'),
    h('span', { class: 't-msg' }, msg),
    action ? h('button', { onclick: () => { action[1](); close() } }, action[0]) : null,
    h('button', { 'aria-label': 'Dismiss', onclick: close }, '✕'))
  toastHost.append(el)
  if (timeout) setTimeout(close, timeout)
  return close
}

/** Modal dialog. Returns {close, el}. actions: [{label, variant, onClick, keep}] */
function modal({ title, body, actions = [], wide = false, onClose } = {}) {
  const prevFocus = document.activeElement
  const close = () => {
    back.remove()
    document.removeEventListener('keydown', onKey, true)
    onClose?.()
    prevFocus?.focus?.()
  }
  const onKey = (e) => {
    if (e.key === 'Escape') { e.stopPropagation(); close() }
  }
  const box = h('div', { class: 'modal' + (wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
    h('div', { class: 'modal-head' }, h('h2', {}, title), IconButton('x', 'Close', close)),
    h('div', { class: 'modal-body' }, body),
    actions.length ? h('div', { class: 'modal-foot' }, actions.map((a) => Button({ ...a, onClick: async () => { const r = await a.onClick?.(); if (!a.keep && r !== false) close() } }))) : null)
  const back = h('div', { class: 'modal-back', onmousedown: (e) => { if (e.target === back) close() } }, box)
  document.addEventListener('keydown', onKey, true)
  document.body.append(back)
  requestAnimationFrame(() => (box.querySelector('input, textarea, select, .btn-primary') ?? box).focus?.())
  return { close, el: box }
}

function confirmDialog(title, message, { ok = 'OK', danger = false, cancel = 'Cancel' } = {}) {
  return new Promise((resolve) => {
    let done = false
    const finish = (v) => { if (!done) { done = true; resolve(v) } }
    modal({
      title, body: h('p', { style: { margin: 0, color: 'var(--text-2)' } }, message), onClose: () => finish(false),
      actions: [{ label: cancel, onClick: () => finish(false) }, { label: ok, variant: danger ? 'danger' : 'primary', onClick: () => finish(true) }],
    })
  })
}

/** Popup menu anchored to an element. items: [{label, icon, kbd, danger, onClick} | 'sep'] */
function menu(anchor, items, { align = 'left' } = {}) {
  const r = anchor.getBoundingClientRect()
  const close = () => { el.remove(); document.removeEventListener('pointerdown', outside, true); document.removeEventListener('keydown', esc, true) }
  const outside = (e) => { if (!el.contains(e.target)) close() }
  const esc = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close() } }
  const el = h('div', { class: 'menu', role: 'menu' }, items.filter(Boolean).map((it) => it === 'sep'
    ? h('div', { class: 'sep' })
    : h('button', { type: 'button', role: 'menuitem', class: it.danger ? 'danger' : '', disabled: it.disabled, onclick: () => { close(); it.onClick() } },
      it.icon ? icon(it.icon, 'icon-sm') : null, it.label, it.kbd ? h('span', { class: 'kbd' }, it.kbd) : null)))
  document.body.append(el)
  const mw = el.offsetWidth, mh = el.offsetHeight
  let left = align === 'right' ? r.right - mw : r.left
  let top = r.bottom + 6
  if (top + mh > innerHeight - 8) top = Math.max(8, r.top - mh - 6)
  left = Math.max(8, Math.min(left, innerWidth - mw - 8))
  Object.assign(el.style, { left: `${left}px`, top: `${top}px` })
  setTimeout(() => { document.addEventListener('pointerdown', outside, true); document.addEventListener('keydown', esc, true) })
  return close
}

const Spinner = () => h('span', { class: 'spin' })

function Progress(frac = null) {
  const bar = h('i', { style: { width: `${Math.round((frac ?? 0) * 100)}%` } })
  const el = h('div', { class: 'progress' + (frac === null ? ' indet' : '') }, bar)
  el.set = (f) => { el.classList.toggle('indet', f === null); bar.style.width = `${Math.round((f ?? 0) * 100)}%` }
  return el
}

function Callout(text, { type, icon: ic } = {}) {
  return h('div', { class: 'callout' + (type ? ` ${type}` : '') }, icon(ic ?? (type === 'warn' || type === 'danger' ? 'alert' : type === 'ok' ? 'checkCircle' : 'info'), 'icon-sm'), h('div', {}, text))
}

// ---------- sortable (insert-between drag) ----------

/**
 * Drag-to-reorder for a container's direct children matching itemSel.
 * Mouse/pen start after 5px; touch after a 220ms hold (scrolling stays native).
 * onMove(from, to) — `to` is the index the item should end up at.
 * horizontal: true for grids (decides before/after by x), false for lists (by y).
 */
function sortable(container, itemSel, onMove, { horizontal = true, handle = null } = {}) {
  let st = null
  let eat = false
  const items = () => [...container.children].filter((c) => c.matches(itemSel))
  const clearMarks = () => items().forEach((n) => n.classList.remove('drop-before', 'drop-after'))
  const start = () => {
    st.mode = 'drag'
    const r = st.el.getBoundingClientRect()
    st.offX = st.x0 - r.left
    st.offY = st.y0 - r.top
    const ghost = st.el.cloneNode(true)
    st.el.querySelectorAll('canvas').forEach((c, i) => {
      const g = ghost.querySelectorAll('canvas')[i]
      if (g) { g.width = c.width; g.height = c.height; g.getContext('2d').drawImage(c, 0, 0) }
    })
    ghost.classList.add('drag-ghost')
    Object.assign(ghost.style, { width: `${r.width}px`, height: `${r.height}px`, left: '0', top: '0', margin: '0' })
    document.body.append(ghost)
    st.ghost = ghost
    st.el.classList.add('drag-src')
    navigator.vibrate?.(10)
    move()
  }
  const move = () => {
    st.ghost.style.transform = `translate(${st.x - st.offX}px, ${st.y - st.offY}px)`
    clearMarks()
    const list = items()
    let target = null, after = false
    for (const n of list) {
      if (n === st.el) continue
      const r = n.getBoundingClientRect()
      if (st.x >= r.left - 8 && st.x <= r.right + 8 && st.y >= r.top - 8 && st.y <= r.bottom + 8) {
        target = n
        after = horizontal ? st.x > r.left + r.width / 2 : st.y > r.top + r.height / 2
        break
      }
    }
    st.target = target
    st.after = after
    if (target) target.classList.add(after ? 'drop-after' : 'drop-before')
    // edge auto-scroll
    const z = 60
    const sc = container.closest('.ed-scroll, .ed-thumbs') ?? null
    const vy = st.y < z ? -12 : innerHeight - st.y < z ? 12 : 0
    if (vy) (sc ?? window).scrollBy(0, vy)
  }
  const end = (commit) => {
    const { el, ghost, target, after } = st
    ghost?.remove()
    el.classList.remove('drag-src')
    clearMarks()
    const list = items()
    const from = list.indexOf(el)
    st = null
    eat = true
    if (!commit || !target) return
    let to = list.indexOf(target) + (after ? 1 : 0)
    if (to > from) to--
    if (to !== from) onMove(from, to)
  }
  container.addEventListener('pointerdown', (e) => {
    if (st || e.button) return
    const el = e.target.closest(itemSel)
    if (!el || el.parentElement !== container) return
    if (handle ? !e.target.closest(handle) : e.target.closest('button, input, select, textarea, a, .pops')) return
    eat = false
    st = { pid: e.pointerId, touch: e.pointerType === 'touch', x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, el, mode: 'pre' }
    if (st.touch) st.timer = setTimeout(() => { if (st?.mode === 'pre') { el.setPointerCapture?.(st.pid); start() } }, 220)
  })
  container.addEventListener('pointermove', (e) => {
    if (!st || e.pointerId !== st.pid) return
    st.x = e.clientX
    st.y = e.clientY
    const d2 = (st.x - st.x0) ** 2 + (st.y - st.y0) ** 2
    if (st.mode === 'pre') {
      if (st.touch) { if (d2 > 100) { clearTimeout(st.timer); st = null } } // finger moved first → it's a scroll
      else if (d2 > 25) { st.el.setPointerCapture?.(st.pid); start() }
    } else if (st.mode === 'drag') { e.preventDefault(); move() }
  })
  const up = (e) => {
    if (!st || e.pointerId !== st.pid) return
    clearTimeout(st.timer)
    if (st.mode === 'drag') end(e.type === 'pointerup')
    else st = null
  }
  container.addEventListener('pointerup', up)
  container.addEventListener('pointercancel', up)
  container.addEventListener('lostpointercapture', (e) => { if (st && st.mode === 'drag' && e.pointerId === st.pid) end(true) })
  container.addEventListener('touchmove', (e) => { if (st?.mode === 'drag') e.preventDefault() }, { passive: false })
  container.addEventListener('click', (e) => { if (eat) { eat = false; e.preventDefault(); e.stopPropagation() } }, true)
  container.addEventListener('dragstart', (e) => e.preventDefault())
  container.addEventListener('contextmenu', (e) => { if (st) e.preventDefault() })
}

// ---------- lazy thumbnails ----------

/**
 * Renders page thumbnails on demand (when scrolled into view), a couple at a
 * time so a 300-page file doesn't freeze the tab. render(i) → Promise<canvas>.
 */
function thumbQueue(render, { concurrency = 2, root = null } = {}) {
  const queue = []
  let active = 0
  const done = new Map()
  const pump = () => {
    while (active < concurrency && queue.length) {
      const { i, cb } = queue.shift()
      if (done.has(i)) { cb(done.get(i)); continue }
      active++
      Promise.resolve(render(i)).catch(() => null).then((cv) => {
        active--
        done.set(i, cv)
        cb(cv)
        pump()
      })
    }
  }
  const io = 'IntersectionObserver' in window ? new IntersectionObserver((ents) => {
    for (const en of ents) {
      if (!en.isIntersecting) continue
      io.unobserve(en.target)
      en.target._thumbReq?.()
    }
  }, { root, rootMargin: '300px' }) : null
  return {
    /** Attach a lazy thumbnail for page i into `slot` (an element to fill). */
    attach(slot, i, place) {
      const req = () => {
        if (done.has(i)) { place(done.get(i)); return }
        queue.push({ i, cb: (cv) => { if (slot.isConnected) place(cv) } })
        pump()
      }
      if (done.has(i)) { place(done.get(i)); return }
      if (io) { slot._thumbReq = req; io.observe(slot) } else req()
    },
    get: (i) => done.get(i),
    invalidate(i) { if (i === undefined) done.clear(); else done.delete(i) },
    disconnect() { io?.disconnect(); queue.length = 0 },
  }
}

/** Clone a rendered canvas (DOM nodes can only live in one place). */
function cloneCanvas(src) {
  if (!src) return null
  const c = document.createElement('canvas')
  c.width = src.width
  c.height = src.height
  c.getContext('2d').drawImage(src, 0, 0)
  return c
}

/** Show any node large in a modal (page zoom). */
function lightbox(node, caption = '') {
  return modal({ title: caption || 'Preview', wide: true, body: node })
}
