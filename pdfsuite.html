/** Ask for a PDF password. Resolves to the string or null when cancelled. */
function askPassword(fileName, { wrong = false } = {}) {
  return new Promise((resolve) => {
    let val = ''
    let done = false
    const finish = (v) => { if (!done) { done = true; resolve(v) } }
    const input = TextInput('', (v) => (val = v), { type: 'password', placeholder: 'Password', onEnter: () => { finish(val); m.close() } })
    const m = modal({
      title: 'This PDF is password-protected',
      body: [
        h('p', { style: { margin: 0, color: 'var(--text-2)' } }, h('b', {}, fileName), ' needs a password to open. It is unlocked here in your browser — the password never leaves this device.'),
        wrong ? Callout('That password didn’t work — try again.', { type: 'danger' }) : null,
        Field('Password', input),
      ],
      onClose: () => finish(null),
      actions: [{ label: 'Cancel', onClick: () => finish(null) }, { label: 'Unlock', variant: 'primary', onClick: () => finish(val) }],
    })
  })
}

/**
 * Read + parse a PDF File, prompting for a password when it's encrypted.
 * Returns {file, name, size, bytes, doc, leaves, dims, wasEncrypted} or null if cancelled.
 * Throws a friendly Error for unreadable files.
 */
async function openPdf(file, { allowEncrypted = false } = {}) {
  let bytes = await readBytes(file)
  let wasEncrypted = false
  if (!isPdfHeader(bytes)) throw new Error(`“${file.name}” doesn’t look like a PDF`)
  if (!allowEncrypted && await isEncrypted(bytes).catch(() => false)) {
    wasEncrypted = true
    let wrong = false
    // owner-password-only files (open freely, restricted) unlock with an empty password
    try { bytes = await decryptPdf(bytes, ''); wrong = null } catch { /* needs a real password */ }
    while (wrong !== null) {
      const pwd = await askPassword(file.name, { wrong })
      if (pwd === null) return null
      try { bytes = await decryptPdf(bytes, pwd); wrong = null } catch (e) {
        if (/wrong password/.test(e.message)) wrong = true
        else throw e
      }
    }
  }
  let doc
  try { doc = await parsePdf(bytes, [], allowEncrypted) } catch (e) { throw new Error(friendly(e, file.name)) }
  const leaves = pageLeaves(doc)
  if (!leaves.length) throw new Error(`“${file.name}” has no pages we can read`)
  return { file, name: file.name, size: file.size, bytes, doc, leaves, dims: pageDims(doc), wasEncrypted }
}

const isPdfHeader = (b) => {
  const head = new TextDecoder('latin1').decode(b.subarray(0, 1024))
  return head.includes('%PDF')
}

function friendly(e, name = 'this file') {
  const m = e?.message || String(e)
  if (/password|encrypt/i.test(m)) return m
  if (/no trailer|not a PDF/i.test(m)) return `“${name}” isn’t a readable PDF (it may be damaged)`
  return m || 'Something went wrong'
}

/**
 * Run an async task with a busy button + error toast.
 * Returns the task result or undefined on failure.
 */
async function runTask(setBusy, fn) {
  setBusy(true)
  try {
    return await fn()
  } catch (e) {
    console.error(e)
    toast(friendly(e), { type: 'error' })
    return undefined
  } finally {
    setBusy(false)
  }
}

/**
 * Result card after a successful run.
 * {title, sub, blob, filename, toolId, onAgain, extra}
 * Auto-downloads once; offers download again, "continue with" chips and start over.
 */
function ResultCard({ title = 'Done!', sub, blob, filename, toolId, onAgain, extra, autoDownload = true }) {
  if (autoDownload && blob) saveBlob(blob, filename)
  const next = (NEXT[toolId] ?? []).map(byId).filter(Boolean)
  const isPdf = blob && /pdf$/i.test(filename)
  return h('div', { class: 'result' },
    h('div', { class: 'r-head' },
      h('div', { class: 'r-ok' }, icon('check', 'icon')),
      h('div', { style: { flex: 1, minWidth: 0 } },
        h('h3', {}, title),
        h('div', { class: 'r-sub' }, sub ?? [filename, blob ? fmtBytes(blob.size) : null].filter(Boolean).join(' · '))),
    ),
    extra ?? null,
    h('div', { class: 'row' },
      blob ? Button({ label: 'Download again', icon: 'download', variant: 'primary', onClick: () => saveBlob(blob, filename) }) : null,
      onAgain ? Button({ label: 'Start over', icon: 'refresh', onClick: onAgain }) : null),
    isPdf && next.length ? h('div', { class: 'r-next' }, 'Continue with',
      next.map((t) => h('a', {
        class: 'chip', href: `#/${t.route ?? t.id}`,
        onclick: () => handoff(new File([blob], filename, { type: 'application/pdf' })),
      }, icon(t.icon, 'icon-sm'), t.name))) : null)
}

/** Simple "N pages · X MB" meta string. */
const docMeta = (info) => [plural(info.leaves.length, 'page'), info.wasEncrypted ? 'unlocked' : null].filter(Boolean).join(' · ')

/** Mount helper for tools: root element + render(...) that swaps contents. */
function mount() {
  const root = h('div', { class: 'tool' })
  return { root, render: (...kids) => setKids(root, ...kids) }
}


// ---- src/ui/pages.js ----
// Page thumbnail cards shared by Split / Organize / Rotate / Merge previews.

/** Lazy, cached thumbnail renderer for one opened PDF (see tool.openPdf). */
function pageThumbs(info, { width = 220 } = {}) {
  const cache = new Map()
  const px = Math.round(width * Math.min(2, self.devicePixelRatio || 1))
  return thumbQueue((i) => renderPage(info.doc, info.leaves[i], { width: px, cache }), { concurrency: 2 })
}

/** Copy of `src` rotated by deg (multiple of 90). */
function rotatedCanvas(src, deg) {
  deg = ((deg % 360) + 360) % 360
  if (!src || !deg) return cloneCanvas(src)
  const c = document.createElement('canvas')
  const swap = deg % 180 !== 0
  c.width = swap ? src.height : src.width
  c.height = swap ? src.width : src.height
  const x = c.getContext('2d')
  x.translate(c.width / 2, c.height / 2)
  x.rotate((deg * Math.PI) / 180)
  x.drawImage(src, -src.width / 2, -src.height / 2)
  return c
}

/**
 * One page card. opts:
 *  thumbs (pageThumbs), src (0-based source page), rotation, label, sub,
 *  dims ({w,h,rotate}), selected (bool|undefined → no checkbox), off (dimmed),
 *  ops [{icon, tip, onClick, danger}], onClick(e), draggable
 */
function PageCard({ thumbs, src, rotation = 0, label, sub, dims, selected, off, ops = [], onClick, draggable, blank }) {
  const baseRot = dims?.rotate ?? 0
  const w0 = dims ? (baseRot % 180 === 0 ? dims.w : dims.h) : 612
  const h0 = dims ? (baseRot % 180 === 0 ? dims.h : dims.w) : 792
  const swap = rotation % 180 !== 0
  const ar = swap ? h0 / w0 : w0 / h0
  const slot = h('div', { class: 'pthumbw', style: { '--ar': String(ar) } }, h('div', { class: 'pskel', style: { aspectRatio: String(ar) } }))
  if (blank) slot.replaceChildren(h('canvas', { width: Math.round(120 * ar), height: 120, style: { aspectRatio: String(ar) } }))
  else if (thumbs) {
    thumbs.attach(slot, src, (cv) => {
      if (!cv) { slot.replaceChildren(h('div', { class: 'muted small' }, 'No preview')); return }
      const c = rotatedCanvas(cv, rotation)
      slot.replaceChildren(c)
    })
  }
  const card = h('div', {
    class: ['pcard', selected ? 'sel' : '', off ? 'off' : '', onClick ? 'clickable' : '', draggable ? 'draggable' : ''].filter(Boolean).join(' '),
    tabindex: onClick ? '0' : undefined,
    role: selected !== undefined ? 'checkbox' : undefined,
    'aria-checked': selected !== undefined ? String(!!selected) : undefined,
    onclick: onClick,
    onkeydown: onClick ? (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onClick(e) } } : undefined,
  },
  selected !== undefined ? h('span', { class: 'pcheck' }, icon('check', 'icon-sm')) : null,
  ops.length ? h('div', { class: 'pops' }, ops.map((o) => h('button', {
    type: 'button', class: o.danger ? 'danger' : '', 'data-tip': o.tip, 'aria-label': o.tip,
    onclick: (e) => { e.stopPropagation(); o.onClick() },
  }, icon(o.icon, 'icon-sm')))) : null,
  slot,
  h('div', { class: 'plabel' }, h('b', {}, label), sub ? h('span', {}, sub) : null))
  return card
}

/** Large preview of one page in a modal. */
async function zoomPage(info, i, rotation = 0) {
  const width = Math.min(1400, Math.round(900 * Math.min(2, self.devicePixelRatio || 1)))
  const cv = await renderPage(info.doc, info.leaves[i], { width })
  const c = rotatedCanvas(cv, rotation)
  c.className = 'lightbox-img'
  modal({ title: `Page ${i + 1}`, wide: true, body: c })
}

// ---- src/ui/preview.js ----
// Live, exact preview: run the real engine on a 1–2 page excerpt and render
// it. What you see is precisely what the download will contain.

/**
 * livePreview(info, pages[0-based], apply(bytes) → Promise<bytes>)
 * Returns {el, update()} — call update() after option changes (debounced).
 */
function livePreview(info, pages, apply, { width = 300 } = {}) {
  const el = h('div', { class: 'pv' })
  const slots = pages.map((p) => h('div', { class: 'pv-page' }, h('div', { class: 'pskel', style: { aspectRatio: aspect(info, p) } }), h('div', { class: 'pv-cap' }, `Page ${p + 1}`)))
  el.append(...slots)
  let excerpt = null
  let gen = 0
  let timer = 0
  const px = Math.round(width * Math.min(2, self.devicePixelRatio || 1))
  const run = async () => {
    const my = ++gen
    try {
      excerpt ??= await extractPages(info.bytes, pages.map((p) => ({ from: p + 1, to: p + 1 })))
      const out = await apply(excerpt)
      if (my !== gen) return
      const doc = await parsePdf(out)
      const leaves = pageLeaves(doc)
      const cache = new Map()
      for (let k = 0; k < slots.length; k++) {
        const cv = await renderPage(doc, leaves[k], { width: px, cache })
        if (my !== gen) return
        slots[k].firstChild.replaceWith(cv)
      }
    } catch (e) { console.warn('preview failed', e) }
  }
  run()
  return { el, update: () => { clearTimeout(timer); timer = setTimeout(run, 180) } }
}

const aspect = (info, p) => {
  const d = info.dims[p]
  const w = d.rotate % 180 === 0 ? d.w : d.h, hh = d.rotate % 180 === 0 ? d.h : d.w
  return `${w} / ${hh}`
}

// ---- src/editor/imagefx.js ----
// Pixel pipeline for the editor's image editing — pure JS on RGBA buffers, so
// the live preview and the exported PDF are byte-for-byte the same process
// (and it all runs in node tests). Order: crop → flip → adjustments → effects
// → background removal → rounded corners → border → shadow.

const FX_DEFAULTS = {
  brightness: 0, contrast: 0, saturation: 0, hue: 0, exposure: 0, warmth: 0, tint: 0,
  blur: 0, sharpen: 0, vignette: 0, grain: 0, sepia: 0, grayscale: 0, invert: 0,
  removeBg: null, // {color:[r,g,b], tolerance 0-100, feather 0-100}
  radius: 0, // % of the short side
  border: null, // {width (% short side), color}
  shadow: null, // {blur (% short side), dx, dy (%), color, opacity}
}

/** Preset looks (merged over the defaults). */
const PRESETS = {
  none: {},
  bw: { grayscale: 100, contrast: 12 },
  noir: { grayscale: 100, contrast: 45, brightness: -8, vignette: 45 },
  sepia: { sepia: 85, contrast: 5, brightness: 4 },
  vintage: { sepia: 35, saturation: -25, contrast: -10, warmth: 25, vignette: 35, grain: 18 },
  vivid: { saturation: 45, contrast: 15, sharpen: 25 },
  warm: { warmth: 40, saturation: 10 },
  cool: { warmth: -40, tint: -5 },
  fade: { contrast: -30, brightness: 12, saturation: -20 },
  dramatic: { contrast: 55, saturation: -15, vignette: 55, sharpen: 20 },
  invert: { invert: 100 },
  pop: { saturation: 70, contrast: 25, exposure: 10 },
}

const clamp8 = (v) => (v < 0 ? 0 : v > 255 ? 255 : v)

/** Is this fx object a no-op? (skip work + keep JPEGs untouched) */
function fxIsIdentity(fx = {}, geo = {}) {
  for (const [k, d] of Object.entries(FX_DEFAULTS)) {
    const v = fx[k] ?? d
    if (d === null ? v !== null && v !== undefined : v !== d) return false
  }
  return !geo.crop && !geo.flipH && !geo.flipV
}

/** Crop (source px) → new buffer. */
function cropRGBA({ rgba, w, h }, c) {
  const x0 = Math.max(0, Math.round(c.x)), y0 = Math.max(0, Math.round(c.y))
  const cw = Math.max(1, Math.min(w - x0, Math.round(c.w))), ch = Math.max(1, Math.min(h - y0, Math.round(c.h)))
  const out = new Uint8ClampedArray(cw * ch * 4)
  for (let y = 0; y < ch; y++) out.set(rgba.subarray(((y0 + y) * w + x0) * 4, ((y0 + y) * w + x0 + cw) * 4), y * cw * 4)
  return { rgba: out, w: cw, h: ch }
}

function flipRGBA({ rgba, w, h }, flipH, flipV) {
  if (!flipH && !flipV) return { rgba, w, h }
  const out = new Uint8ClampedArray(rgba.length)
  for (let y = 0; y < h; y++) {
    const sy = flipV ? h - 1 - y : y
    for (let x = 0; x < w; x++) {
      const sx = flipH ? w - 1 - x : x
      const s = (sy * w + sx) * 4, d = (y * w + x) * 4
      out[d] = rgba[s]; out[d + 1] = rgba[s + 1]; out[d + 2] = rgba[s + 2]; out[d + 3] = rgba[s + 3]
    }
  }
  return { rgba: out, w, h }
}

/** Separable box blur (3 passes ≈ gaussian) on all four channels, in place. */
function blurRGBA(rgba, w, h, radius) {
  const r = Math.max(0, Math.round(radius))
  if (!r) return rgba
  const tmp = new Float32Array(rgba.length)
  const src = Float32Array.from(rgba)
  const pass = (from, to, horiz) => {
    const len = horiz ? w : h, lines = horiz ? h : w
    const win = 2 * r + 1
    for (let l = 0; l < lines; l++) {
      const idx = (i) => (horiz ? (l * w + i) * 4 : (i * w + l) * 4)
      for (let c = 0; c < 4; c++) {
        let acc = 0
        for (let i = -r; i <= r; i++) acc += from[idx(Math.min(len - 1, Math.max(0, i))) + c]
        for (let i = 0; i < len; i++) {
          to[idx(i) + c] = acc / win
          acc += from[idx(Math.min(len - 1, i + r + 1)) + c] - from[idx(Math.max(0, i - r)) + c]
        }
      }
    }
  }
  for (let k = 0; k < 3; k++) { pass(src, tmp, true); pass(tmp, src, false) }
  for (let i = 0; i < rgba.length; i++) rgba[i] = src[i]
  return rgba
}

function rgbToHsl(r, g, b) {
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b)
  let hh = 0, s = 0
  const l = (mx + mn) / 2
  if (mx !== mn) {
    const d = mx - mn
    s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn)
    hh = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4
    hh /= 6
  }
  return [hh, s, l]
}
function hslToRgb(hh, s, l) {
  if (!s) return [l, l, l]
  const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q
  const f = (t) => { if (t < 0) t += 1; if (t > 1) t -= 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 0.5 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p }
  return [f(hh + 1 / 3), f(hh), f(hh - 1 / 3)]
}

/** Per-pixel colour adjustments, in place. Values are -100..100 (hue -180..180). */
function adjustRGBA(rgba, w, h, fx) {
  const br = (fx.brightness ?? 0) * 1.6
  const ct = (fx.contrast ?? 0) / 100
  const cf = ct >= 0 ? 1 + ct * 2 : 1 + ct
  const sat = (fx.saturation ?? 0) / 100
  const hue = (fx.hue ?? 0) / 360
  const ex = 2 ** ((fx.exposure ?? 0) / 50)
  const warm = (fx.warmth ?? 0) * 0.5, tint = (fx.tint ?? 0) * 0.4
  const sep = (fx.sepia ?? 0) / 100, gray = (fx.grayscale ?? 0) / 100, inv = (fx.invert ?? 0) / 100
  const vig = (fx.vignette ?? 0) / 100, grain = (fx.grain ?? 0) / 100
  const cx = w / 2, cy = h / 2, maxd = Math.hypot(cx, cy) || 1
  let seed = 1234567
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff - 0.5 }
  for (let y = 0, i = 0; y < h; y++) {
    for (let x = 0; x < w; x++, i += 4) {
      let r = rgba[i], g = rgba[i + 1], b = rgba[i + 2]
      if (ex !== 1) { r *= ex; g *= ex; b *= ex }
      if (br) { r += br; g += br; b += br }
      if (cf !== 1) { r = (r - 128) * cf + 128; g = (g - 128) * cf + 128; b = (b - 128) * cf + 128 }
      if (warm || tint) { r += warm; b -= warm; g += tint }
      r = clamp8(r); g = clamp8(g); b = clamp8(b)
      if (sat || hue) {
        let [hh, s, l] = rgbToHsl(r / 255, g / 255, b / 255)
        if (hue) hh = (hh + hue + 1) % 1
        if (sat) s = Math.min(1, Math.max(0, sat > 0 ? s + (1 - s) * sat * s * 1.5 + s * sat * 0.3 : s * (1 + sat)))
        ;[r, g, b] = hslToRgb(hh, s, l).map((v) => v * 255)
      }
      if (gray) { const yv = 0.299 * r + 0.587 * g + 0.114 * b; r += (yv - r) * gray; g += (yv - g) * gray; b += (yv - b) * gray }
      if (sep) {
        const sr = 0.393 * r + 0.769 * g + 0.189 * b, sg = 0.349 * r + 0.686 * g + 0.168 * b, sb = 0.272 * r + 0.534 * g + 0.131 * b
        r += (sr - r) * sep; g += (sg - g) * sep; b += (sb - b) * sep
      }
      if (inv) { r += (255 - 2 * r) * inv; g += (255 - 2 * g) * inv; b += (255 - 2 * b) * inv }
      if (vig) { const d = Math.hypot(x - cx, y - cy) / maxd; const k = 1 - vig * Math.max(0, d - 0.35) * 1.4; r *= k; g *= k; b *= k }
      if (grain) { const n = rnd() * 60 * grain; r += n; g += n; b += n }
      rgba[i] = clamp8(r); rgba[i + 1] = clamp8(g); rgba[i + 2] = clamp8(b)
    }
  }
  return rgba
}

/** Unsharp mask: original + amount·(original − blurred), in place. */
function sharpenRGBA(rgba, w, h, amount) {
  const a = amount / 100
  if (!a) return rgba
  const bl = blurRGBA(Uint8ClampedArray.from(rgba), w, h, Math.max(1, Math.round(Math.min(w, h) / 400)))
  for (let i = 0; i < rgba.length; i += 4) {
    for (let c = 0; c < 3; c++) rgba[i + c] = clamp8(rgba[i + c] + (rgba[i + c] - bl[i + c]) * a * 1.5)
  }
  return rgba
}

/**
 * Background removal by colour key: pixels close to `color` become
 * transparent; feather softens the edge. Flood-fills from the borders when
 * contiguous=true so the same colour inside the subject survives.
 */
function removeBgRGBA(rgba, w, h, { color, tolerance = 25, feather = 20, contiguous = true }) {
  const tol = (tolerance / 100) * 442 // max RGB distance
  const fth = Math.max(1, (feather / 100) * 120)
  const dist = (i) => Math.hypot(rgba[i] - color[0], rgba[i + 1] - color[1], rgba[i + 2] - color[2])
  const alphaFor = (d) => (d <= tol ? 0 : d >= tol + fth ? 1 : (d - tol) / fth)
  if (!contiguous) {
    for (let i = 0; i < rgba.length; i += 4) rgba[i + 3] = rgba[i + 3] * alphaFor(dist(i))
    return rgba
  }
  const seen = new Uint8Array(w * h)
  const stack = []
  for (let x = 0; x < w; x++) stack.push(x, (h - 1) * w + x)
  for (let y = 0; y < h; y++) stack.push(y * w, y * w + w - 1)
  while (stack.length) {
    const p = stack.pop()
    if (seen[p]) continue
    seen[p] = 1
    const d = dist(p * 4)
    if (d > tol + fth) continue
    rgba[p * 4 + 3] = rgba[p * 4 + 3] * alphaFor(d)
    if (d > tol) continue // feather band: soften but don't spread through it
    const x = p % w, y = (p / w) | 0
    if (x > 0) stack.push(p - 1)
    if (x < w - 1) stack.push(p + 1)
    if (y > 0) stack.push(p - w)
    if (y < h - 1) stack.push(p + w)
  }
  return rgba
}

/** Most common corner colour — a good guess for "the background". */
function guessBackground(rgba, w, h) {
  const pts = [[0, 0], [w - 1, 0], [0, h - 1], [w - 1, h - 1], [w >> 1, 0], [0, h >> 1], [w - 1, h >> 1], [w >> 1, h - 1]]
  const cols = pts.map(([x, y]) => { const i = (y * w + x) * 4; return [rgba[i], rgba[i + 1], rgba[i + 2]] })
  let best = cols[0], bestN = -1
  for (const c of cols) {
    const n = cols.filter((o) => Math.hypot(o[0] - c[0], o[1] - c[1], o[2] - c[2]) < 40).length
    if (n > bestN) { bestN = n; best = c }
  }
  return best
}

/** Rounded-corner alpha mask (radius px), in place. */
function roundRGBA(rgba, w, h, rad) {
  const r = Math.min(rad, w / 2, h / 2)
  if (r < 1) return rgba
  for (let y = 0; y < h; y++) {
    const dy = y < r ? r - y - 0.5 : y >= h - r ? y - (h - r) + 0.5 : 0
    if (!dy) continue
    for (let x = 0; x < w; x++) {
      const dx = x < r ? r - x - 0.5 : x >= w - r ? x - (w - r) + 0.5 : 0
      if (!dx) continue
      const d = Math.hypot(dx, dy) - r
      if (d > -1) rgba[(y * w + x) * 4 + 3] *= Math.max(0, Math.min(1, -d))
    }
  }
  return rgba
}

/** Paint a border inside the edges following the alpha shape (rounded corners respected). */
function borderRGBA(rgba, w, h, bw, color, rad) {
  const b = Math.max(0, Math.round(bw))
  if (!b) return rgba
  const r = Math.min(rad, w / 2, h / 2)
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      // distance to the (rounded) outer edge
      let d = Math.min(x, y, w - 1 - x, h - 1 - y)
      if (r >= 1) {
        const dx = x < r ? r - x : x >= w - r ? x - (w - r) + 1 : 0
        const dy = y < r ? r - y : y >= h - r ? y - (h - r) + 1 : 0
        if (dx && dy) d = r - Math.hypot(dx, dy)
      }
      if (d < b) {
        const i = (y * w + x) * 4
        const k = Math.min(1, b - d) // anti-aliased inner edge
        rgba[i] += (color[0] - rgba[i]) * k
        rgba[i + 1] += (color[1] - rgba[i + 1]) * k
        rgba[i + 2] += (color[2] - rgba[i + 2]) * k
      }
    }
  }
  return rgba
}

/**
 * Drop shadow: returns a bigger buffer with the shadow behind the image.
 * pad/offsets in px. Returns {rgba, w, h, ox, oy} where (ox,oy) is where the
 * original image's top-left now sits inside the padded buffer.
 */
function shadowRGBA({ rgba, w, h }, { blur, dx, dy, color = [0, 0, 0], opacity = 50 }) {
  const pad = Math.ceil(blur * 2 + Math.max(Math.abs(dx), Math.abs(dy)))
  const W = w + 2 * pad, H = h + 2 * pad
  const sh = new Uint8ClampedArray(W * H * 4)
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const tx = x + pad + Math.round(dx), ty = y + pad + Math.round(dy)
      if (tx < 0 || ty < 0 || tx >= W || ty >= H) continue
      const o = (ty * W + tx) * 4
      sh[o] = color[0]; sh[o + 1] = color[1]; sh[o + 2] = color[2]
      sh[o + 3] = rgba[(y * w + x) * 4 + 3] * (opacity / 100)
    }
  }
  blurRGBA(sh, W, H, blur)
  // composite the image over the shadow (source-over)
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const s = (y * w + x) * 4, d = ((y + pad) * W + x + pad) * 4
      const sa = rgba[s + 3] / 255, da = sh[d + 3] / 255
      const oa = sa + da * (1 - sa)
      if (oa <= 0) continue
      for (let c = 0; c < 3; c++) sh[d + c] = (rgba[s + c] * sa + sh[d + c] * da * (1 - sa)) / oa
      sh[d + 3] = oa * 255
    }
  }
  return { rgba: sh, w: W, h: H, ox: pad, oy: pad }
}

/**
 * Run the whole pipeline. src = {rgba, w, h}; geo = {crop:{x,y,w,h} (source px), flipH, flipV};
 * fx = adjustments. Returns {rgba, w, h, ox, oy} (ox/oy > 0 when a shadow padded it).
 * `scale` lets the preview run on a downscaled source with identical look
 * (pixel-size effects — blur, border, radius, shadow — are relative to the short side).
 */
function processImage(src, geo = {}, fx = {}) {
  let img = { rgba: Uint8ClampedArray.from(src.rgba), w: src.w, h: src.h }
  if (geo.crop) {
    const k = src.w / (geo.srcW ?? src.w) // crop is stored in full-res px; preview sources are smaller
    img = cropRGBA(img, { x: geo.crop.x * k, y: geo.crop.y * k, w: geo.crop.w * k, h: geo.crop.h * k })
  }
  img = flipRGBA(img, geo.flipH, geo.flipV)
  const short = Math.min(img.w, img.h)
  const f = { ...FX_DEFAULTS, ...fx }
  adjustRGBA(img.rgba, img.w, img.h, f)
  if (f.blur) blurRGBA(img.rgba, img.w, img.h, (f.blur / 100) * short * 0.04)
  if (f.sharpen) sharpenRGBA(img.rgba, img.w, img.h, f.sharpen)
  if (f.removeBg) removeBgRGBA(img.rgba, img.w, img.h, f.removeBg)
  const rad = (f.radius / 100) * short * 0.5
  if (rad) roundRGBA(img.rgba, img.w, img.h, rad)
  if (f.border?.width) borderRGBA(img.rgba, img.w, img.h, (f.border.width / 100) * short * 0.1, hexRgb8(f.border.color ?? '#ffffff'), rad)
  let ox = 0, oy = 0
  if (f.shadow?.opacity) {
    const s = shadowRGBA(img, {
      blur: (f.shadow.blur / 100) * short * 0.08, dx: (f.shadow.dx / 100) * short * 0.1, dy: (f.shadow.dy / 100) * short * 0.1,
      color: hexRgb8(f.shadow.color ?? '#000000'), opacity: f.shadow.opacity,
    })
    img = { rgba: s.rgba, w: s.w, h: s.h }
    ox = s.ox; oy = s.oy
  }
  return { ...img, ox, oy, innerW: img.w - 2 * ox, innerH: img.h - 2 * oy }
}

function hexRgb8(hx) {
  const m = String(hx).match(/^#?([0-9a-f]{6})$/i)
  const n = m ? parseInt(m[1], 16) : 0
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255]
}

// ---- src/editor/annots.js ----
// Editor object model — pure geometry + canvas drawing.
// Every object lives in the DISPLAY space of its page (pt, top-left origin,
// y down, after any page rotation), exactly what the exporter consumes.
// Box objects may carry `rot` (degrees, clockwise, about the box centre).

const FAMILY_CSS = {
  helv: 'Helvetica, Arial, "Liberation Sans", sans-serif',
  times: '"Times New Roman", Times, "Liberation Serif", serif',
  courier: '"Courier New", Courier, "Liberation Mono", monospace',
}
const fontCssOf = (a, px) => `${a.italic ? 'italic ' : ''}${a.bold ? '700 ' : ''}${px}px ${FAMILY_CSS[a.font] ?? FAMILY_CSS.helv}`
const LINE_H = 1.2
const lineH = (a) => a.lineHeight ?? LINE_H

/** Types that are a box (x,y,w,h) and can rotate freely. */
const BOX_ROT = new Set(['text', 'image', 'rect', 'ellipse', 'whiteout', 'stamp', 'mark', 'poly'])
const rotatable = (a) => BOX_ROT.has(a.t)

let measureCtx = null
/**
 * Width of one line in pt. Text the standard fonts can encode uses their real
 * metrics (exactly what the export writes); anything else (CJK, Arabic,
 * emoji — exported as an image) uses the browser's own measurement.
 */
function lineWidth(a, line) {
  const sp = (a.spacing ?? 0) * Math.max(0, [...line].length - 1)
  if (toWinAnsi(line) !== null) return textWidth(stdFont(a.font, a.bold, a.italic), line, a.size) + sp
  measureCtx ??= document.createElement('canvas').getContext('2d')
  measureCtx.font = fontCssOf(a, 100)
  return (measureCtx.measureText(line).width / 100) * a.size + sp
}

/** Wrap text to a box width (pt) using the same metrics the export uses. */
function layoutText(a) {
  const paras = String(a.text ?? '').split('\n')
  if (!a.w) return paras
  const out = []
  for (const para of paras) {
    let line = ''
    for (const word of para.split(/(\s+)/)) {
      if (!word) continue
      const t = line + word
      if (line && lineWidth(a, t.trimEnd()) > a.w) { out.push(line.trimEnd()); line = word.trimStart() } else line = t
    }
    out.push(line)
  }
  return out
}

function textBox(a) {
  const lines = layoutText(a)
  const w = a.w || Math.max(4, ...lines.map((l) => lineWidth(a, l)))
  return { x: a.x, y: a.y, w, h: Math.max(a.size * lineH(a), lines.length * a.size * lineH(a)), lines }
}

/** Axis-aligned box BEFORE rotation. */
function annBox(a) {
  switch (a.t) {
    case 'stroke': case 'highlight': {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity
      for (const p of a.pts) {
        const r = (p[2] ?? a.width ?? 2) / 2 + 1
        x0 = Math.min(x0, p[0] - r); y0 = Math.min(y0, p[1] - r); x1 = Math.max(x1, p[0] + r); y1 = Math.max(y1, p[1] + r)
      }
      return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 }
    }
    case 'line': {
      const r = (a.width ?? 2) / 2 + 3
      return { x: Math.min(a.x1, a.x2) - r, y: Math.min(a.y1, a.y2) - r, w: Math.abs(a.x2 - a.x1) + 2 * r, h: Math.abs(a.y2 - a.y1) + 2 * r }
    }
    case 'hlrects': {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity
      for (const r of a.rects) { x0 = Math.min(x0, r.x); y0 = Math.min(y0, r.y); x1 = Math.max(x1, r.x + r.w); y1 = Math.max(y1, r.y + r.h) }
      return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 }
    }
    case 'text': { const b = textBox(a); return { x: b.x, y: b.y, w: b.w, h: b.h } }
    case 'textedit': {
      const b = textBox(a)
      return { x: Math.min(b.x, a.region.x), y: Math.min(b.y, a.region.y), w: Math.max(b.x + b.w, a.region.x + a.region.w) - Math.min(b.x, a.region.x), h: Math.max(b.y + b.h, a.region.y + a.region.h) - Math.min(b.y, a.region.y) }
    }
    case 'imgremove': return { ...a.region }
    case 'note': return { x: a.x, y: a.y, w: 22, h: 22 }
    default: return { x: a.x, y: a.y, w: a.w, h: a.h }
  }
}

/** World-space axis-aligned bounds including rotation (for marquee, snapping, align). */
function annBounds(a) {
  const b = annBox(a)
  if (!a.rot || !rotatable(a)) return b
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2
  const pts = [[b.x, b.y], [b.x + b.w, b.y], [b.x, b.y + b.h], [b.x + b.w, b.y + b.h]].map(([x, y]) => rotAbout(x, y, cx, cy, a.rot))
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1])
  return { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) }
}

function rotAbout(x, y, cx, cy, deg) {
  const t = (deg * Math.PI) / 180, c = Math.cos(t), s = Math.sin(t)
  return [cx + (x - cx) * c - (y - cy) * s, cy + (x - cx) * s + (y - cy) * c]
}
/** World point → the object's unrotated local frame. */
const toLocal = (a, x, y) => {
  if (!a.rot || !rotatable(a)) return [x, y]
  const b = annBox(a)
  return rotAbout(x, y, b.x + b.w / 2, b.y + b.h / 2, -a.rot)
}

/** Which objects can be resized with handles. */
const resizable = (a) => ['image', 'rect', 'ellipse', 'whiteout', 'redact', 'text', 'mark', 'stamp', 'link', 'poly', 'textedit'].includes(a.t)
const keepsAspect = (a) => a.t === 'image' || a.t === 'mark' || a.t === 'stamp'

const distSeg = (px, py, x1, y1, x2, y2) => {
  const dx = x2 - x1, dy = y2 - y1
  const l2 = dx * dx + dy * dy
  const t = l2 ? Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / l2)) : 0
  return Math.hypot(x1 + t * dx - px, y1 + t * dy - py)
}

/** Point hit test (tol in pt). Hidden/locked/removal markers are never hit. */
function annHit(a, x0, y0, tol = 5) {
  if (a.hidden || a.locked || a.t === 'imgremove') return false
  const [x, y] = toLocal(a, x0, y0)
  if (a.t === 'stroke' || a.t === 'highlight') {
    const w = a.width ?? 2
    if (a.pts.length === 1) return Math.hypot(x - a.pts[0][0], y - a.pts[0][1]) < Math.max(tol, w / 2 + 2)
    for (let i = 1; i < a.pts.length; i++) {
      const ww = (a.pts[i][2] ?? w) / 2 + tol
      if (distSeg(x, y, a.pts[i - 1][0], a.pts[i - 1][1], a.pts[i][0], a.pts[i][1]) < ww) return true
    }
    return false
  }
  if (a.t === 'line') return distSeg(x, y, a.x1, a.y1, a.x2, a.y2) < Math.max(tol, (a.width ?? 2) / 2 + 3)
  if (a.t === 'hlrects') return a.rects.some((r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h)
  const b = annBox(a)
  if ((a.t === 'rect' || a.t === 'ellipse' || a.t === 'poly') && !a.fill) {
    const band = (a.lw ?? 2) / 2 + tol
    const outer = x >= b.x - band && x <= b.x + b.w + band && y >= b.y - band && y <= b.y + b.h + band
    const inner = x > b.x + band && x < b.x + b.w - band && y > b.y + band && y < b.y + b.h - band
    return outer && !inner
  }
  return x >= b.x - 2 && x <= b.x + b.w + 2 && y >= b.y - 2 && y <= b.y + b.h + 2
}

/** Deep-ish copy (image bytes shared — never mutated). */
function annClone(a) {
  const o = { ...a }
  if (a.pts) o.pts = a.pts.map((p) => [...p])
  if (a.rects) o.rects = a.rects.map((r) => ({ ...r }))
  if (a.region) o.region = { ...a.region }
  if (a.segs) o.segs = a.segs.map((s) => [...s])
  if (a.fx) o.fx = JSON.parse(JSON.stringify(a.fx))
  if (a.crop) o.crop = { ...a.crop }
  if (a.outline) o.outline = { ...a.outline }
  if (a.shadow) o.shadow = { ...a.shadow }
  return o
}

function annMove(a, o, dx, dy) {
  if (o.pts) a.pts = o.pts.map((p) => [p[0] + dx, p[1] + dy, ...p.slice(2)])
  if (o.rects) a.rects = o.rects.map((r) => ({ ...r, x: r.x + dx, y: r.y + dy }))
  if (o.x1 !== undefined) { a.x1 = o.x1 + dx; a.y1 = o.y1 + dy; a.x2 = o.x2 + dx; a.y2 = o.y2 + dy }
  if (o.x !== undefined) { a.x = o.x + dx; a.y = o.y + dy }
  // a text edit's erase region stays put: only the replacement text moves
}

/**
 * Resize from a handle ('nw','n','ne','e','se','s','sw','w') to world (x,y).
 * Works in the object's local frame for rotated objects and keeps the opposite
 * corner fixed in world space.
 */
function annResize(a, o, handle, xw, yw, { aspect = false } = {}) {
  const rot = rotatable(o) ? o.rot ?? 0 : 0
  const ob = annBox(o)
  const ocx = ob.x + ob.w / 2, ocy = ob.y + ob.h / 2
  const [x, y] = rot ? rotAbout(xw, yw, ocx, ocy, -rot) : [xw, yw]
  // anchor = opposite handle, local coords
  const ax = handle.includes('w') ? ob.x + ob.w : handle.includes('e') ? ob.x : ocx
  const ay = handle.includes('n') ? ob.y + ob.h : handle.includes('s') ? ob.y : ocy
  const anchorWorld = rot ? rotAbout(ax, ay, ocx, ocy, rot) : [ax, ay]
  resizeLocal(a, o, handle, x, y, aspect)
  if (rot) {
    const nb = annBox(a)
    const ncx = nb.x + nb.w / 2, ncy = nb.y + nb.h / 2
    const nax = handle.includes('w') ? nb.x + nb.w : handle.includes('e') ? nb.x : ncx
    const nay = handle.includes('n') ? nb.y + nb.h : handle.includes('s') ? nb.y : ncy
    const now = rotAbout(nax, nay, ncx, ncy, rot)
    const dx = anchorWorld[0] - now[0], dy = anchorWorld[1] - now[1]
    a.x += dx
    a.y += dy
    if (a.t === 'textedit') { /* region stays */ }
  }
}

function resizeLocal(a, o, handle, x, y, aspect) {
  if (a.t === 'text' || a.t === 'textedit') {
    const ob = textBox(o)
    if (handle === 'e' || handle === 'w') {
      if (handle === 'e') a.w = Math.max(o.size, x - o.x)
      else { const right = o.x + ob.w; a.x = Math.min(x, right - o.size); a.w = right - a.x }
      return
    }
    const ax = handle.includes('w') ? o.x + ob.w : o.x
    const ay = handle.includes('n') ? o.y + ob.h : o.y
    const f = Math.max(0.15, Math.min(12, Math.max(Math.abs(x - ax) / (ob.w || 1), Math.abs(y - ay) / (ob.h || 1))))
    a.size = Math.max(4, Math.round(o.size * f * 2) / 2)
    if (o.w) a.w = o.w * (a.size / o.size)
    const nb = textBox(a)
    a.x = handle.includes('w') ? ax - nb.w : ax
    a.y = handle.includes('n') ? ay - nb.h : ay
    return
  }
  let x0 = o.x, y0 = o.y, x1 = o.x + o.w, y1 = o.y + o.h
  if (handle.includes('w')) x0 = Math.min(x, x1 - 4)
  if (handle.includes('e')) x1 = Math.max(x, x0 + 4)
  if (handle.includes('n')) y0 = Math.min(y, y1 - 4)
  if (handle.includes('s')) y1 = Math.max(y, y0 + 4)
  if (aspect && o.w && o.h) {
    const r = o.w / o.h
    let w = x1 - x0, h = y1 - y0
    if (handle.length === 2) { if (w / h > r) w = h * r; else h = w / r } else if (handle === 'e' || handle === 'w') h = w / r; else w = h * r
    if (handle.includes('w')) x0 = x1 - w; else x1 = x0 + w
    if (handle.includes('n')) y0 = y1 - h; else y1 = y0 + h
  }
  a.x = x0; a.y = y0; a.w = x1 - x0; a.h = y1 - y0
}

/** Rotate an object 90° clockwise with its page (page W×H before rotation). */
function annRotate90(a, W, H) {
  const P = (x, y) => [H - y, x]
  const rectR = (r) => { const [x, y] = P(r.x, r.y + r.h); return { x, y, w: r.h, h: r.w } }
  if (a.pts) a.pts = a.pts.map((p) => [...P(p[0], p[1]), ...p.slice(2)])
  if (a.rects) a.rects = a.rects.map(rectR)
  if (a.x1 !== undefined) { [a.x1, a.y1] = P(a.x1, a.y1); [a.x2, a.y2] = P(a.x2, a.y2) }
  if (a.region) a.region = rectR(a.region)
  if (a.t === 'note') { [a.x, a.y] = P(a.x, a.y + 22); return }
  if (a.t === 'imgremove') return
  if (a.x !== undefined && a.pts === undefined && a.x1 === undefined) {
    const b = annBox(a)
    const nb = rectR(b)
    if (['text', 'textedit', 'image', 'stamp', 'mark', 'poly'].includes(a.t)) {
      a.rot = ((a.rot ?? 0) + 90) % 360
      const cx = nb.x + nb.w / 2, cy = nb.y + nb.h / 2
      a.x = cx - b.w / 2
      a.y = cy - b.h / 2
    } else { a.x = nb.x; a.y = nb.y; a.w = nb.w; a.h = nb.h }
  }
}

// ---------- shapes ----------

/** Polygon / star outline points for a 'poly' object (box space). */
function polyPoints(a) {
  const cx = a.x + a.w / 2, cy = a.y + a.h / 2, rx = a.w / 2, ry = a.h / 2
  const n = Math.max(3, Math.min(24, a.sides ?? (a.kind === 'triangle' ? 3 : 5)))
  if (a.kind === 'triangle') return [[cx, a.y], [a.x + a.w, a.y + a.h], [a.x, a.y + a.h]]
  if (a.kind === 'star') {
    const inner = a.inner ?? 0.45
    const pts = []
    for (let i = 0; i < n * 2; i++) {
      const ang = -Math.PI / 2 + (i * Math.PI) / n
      const k = i % 2 ? inner : 1
      pts.push([cx + Math.cos(ang) * rx * k, cy + Math.sin(ang) * ry * k])
    }
    return pts
  }
  return Array.from({ length: n }, (_, i) => { const ang = -Math.PI / 2 + (i * 2 * Math.PI) / n; return [cx + Math.cos(ang) * rx, cy + Math.sin(ang) * ry] })
}

const MARK_PATHS = {
  check: (x, y, w, h) => [['M', x + w * 0.12, y + h * 0.55], ['L', x + w * 0.4, y + h * 0.82], ['L', x + w * 0.9, y + h * 0.2]],
  cross: (x, y, w, h) => [['M', x + w * 0.18, y + h * 0.18], ['L', x + w * 0.82, y + h * 0.82], ['M', x + w * 0.82, y + h * 0.18], ['L', x + w * 0.18, y + h * 0.82]],
}
const markSegs = (a) => (MARK_PATHS[a.kind] ?? MARK_PATHS.check)(a.x, a.y, a.w, a.h)

// ---------- eraser ----------

/**
 * Erase the parts of a freehand stroke/highlight within radius r of (x, y).
 * Returns the surviving pieces (0, 1 or more new objects) — or null when the
 * object wasn't touched.
 */
function eraseFrom(a, x, y, r) {
  if (a.t !== 'stroke' && a.t !== 'highlight') return null
  const reach = r + (a.width ?? 2) / 2
  let touched = false
  const pieces = []
  let cur = []
  const pts = a.pts
  // densify long segments so a small eraser can split them
  const dense = []
  for (let i = 0; i < pts.length; i++) {
    if (i) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]
      const n = Math.floor(Math.hypot(x1 - x0, y1 - y0) / Math.max(1, r / 2))
      for (let k = 1; k < n; k++) dense.push([x0 + ((x1 - x0) * k) / n, y0 + ((y1 - y0) * k) / n, ...pts[i].slice(2)])
    }
    dense.push(pts[i])
  }
  for (const p of dense) {
    if (Math.hypot(p[0] - x, p[1] - y) <= reach) {
      touched = true
      if (cur.length) { pieces.push(cur); cur = [] }
    } else cur.push(p)
  }
  if (cur.length) pieces.push(cur)
  if (!touched) return null
  return pieces.filter((pc) => pc.length > 1).map((pc) => ({ ...a, pts: pc, id: undefined }))
}

// ---------- drawing ----------

/** Fill a line glyph-by-glyph with the export font's advance widths (WYSIWYG). */
function drawLine(c, a, ln, lx, by, S, method = 'fillText') {
  const sp = a.spacing ?? 0
  const bytes = toWinAnsi(ln)
  if (!bytes) { // non-WinAnsi text: natural layout (exported as an image)
    if ('letterSpacing' in c) c.letterSpacing = `${sp * S}px`
    c[method](ln, lx * S, by * S)
    if ('letterSpacing' in c) c.letterSpacing = '0px'
    return
  }
  const base = stdFont(a.font, a.bold, a.italic)
  let x = lx
  const chars = [...ln]
  for (let i = 0; i < chars.length; i++) {
    if (chars[i] !== ' ') c[method](chars[i], x * S, by * S)
    x += stdWidth(base, [bytes[i]], a.size) + sp
  }
}

/**
 * Draw one object. S = canvas px per pt.
 * opts.bmp(a) → processed image source {src, ox, oy, innerW, innerH} or a plain drawable.
 */
function annDraw(c, a, S, { bmp, editingId } = {}) {
  if (a.hidden || a.t === 'imgremove') return
  c.save()
  c.globalAlpha = a.alpha ?? 1
  if (a.blend && a.blend !== 'normal') c.globalCompositeOperation = a.blend
  c.lineJoin = 'round'
  c.lineCap = 'round'
  if (a.rot && rotatable(a)) {
    const b = annBox(a)

    off.height = bh

  // ---------- image crop mode ----------

  // ---------- text runs (edit text / snap redaction / text highlight) ----------
  v.getRuns = async () => {
    if (page.src === null) return []

      const { W0, H0 } = origDims()
      v.runs = raw.map((r) => {
        if (!page.rot) return r
        const [x1, y1] = rotPt(r.x, r.y, page.rot, W0, H0), [x2, y2] = rotPt(r.x + r.w, r.y + r.h, page.rot, W0, H0)

  // ---------- form fields ----------
  function layoutFields() {
    fieldLayer.replaceChildren()

    const z = ed.zoom

      for (const w of f.widgets) {
        if (w.page !== page.src || w.hidden) continue
        const r = w.rect
        const st = { left: `${r.x * z}px`, top: `${r.y * z}px`, width: `${r.w * z}px`, height: `${r.h * z}px`, pointerEvents: 'auto' }
        const fs = `${Math.max(8, Math.min((f.da.size || Math.min(12, r.h * 0.7)) * z, r.h * z * 0.8))}px`
        let input
        const val = ed.values[f.name] ?? f.value
        if (f.type === 'checkbox') input = h('input', { type: 'checkbox', class: 'ed-field', checked: !!val, onchange: (e) => ed.setField(f.name, e.target.checked) })
        else if (f.type === 'radio') input = h('input', { type: 'radio', class: 'ed-field', name: `rf-${f.name}`, checked: val === w.onState, onchange: () => ed.setField(f.name, w.onState) })

        color: rgbHex(r.color), align: 'left',
      }, { select: true })
      hoverRun = null
      v.render()
      v.editText(a)
      return
    }
    if (tool === 'text') {
      capture(e.pointerId)
      drag = { kind: 'textbox', sx: x, sy: y, pid: e.pointerId }
      return
    }
    if (tool === 'stamp') {
      const k = ed.sub.stamp
      const size = st.stampSize
      let a
      if (k === 'check' || k === 'cross' || k === 'dot') a = { t: 'mark', kind: k, x: x - size / 2, y: y - size / 2, w: size, h: size, color: st.markColor }
      else if (k === 'date') a = { t: 'text', x, y: y - st.textSize * 0.6, text: new Date().toLocaleDateString(), size: st.textSize, font: st.font, color: st.textColor, w: 0 }
      else {
        const hh = size * 1.3, ww = Math.max(hh * 2.4, hh * 0.62 * k.length)
        a = { t: 'stamp', label: k, x: x - ww / 2, y: y - hh / 2, w: ww, h: hh, color: st.stampColor }
      }
      ed.add(page, a, { select: true })
      return
    }
    if (tool === 'note') {
      const a = ed.add(page, { t: 'note', x: x - 11, y: y - 11, text: '', color: st.noteColor }, { select: true })
      ed.editNote(page, a, true)
      return
    }
    if (tool === 'redact' && !v.runs) await v.getRuns()
    capture(e.pointerId)
    drag = { kind: 'shape', sx: x, sy: y, pid: e.pointerId, moved: false }
    draft = null
    e.preventDefault()
  })

  over.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId)
    if (p) { p.x = e.clientX; p.y = e.clientY }
    if (pinch && pointers.size >= 2) {
      const [a, b] = [...pointers.values()]
      const d = Math.hypot(a.x - b.x, a.y - b.y)
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2
      ed.panBy(pinch.mx - mx, pinch.my - my)
      pinch.mx = mx
      pinch.my = my
      if (pinch.d > 0 && Math.abs(d / pinch.d - ed.zoom / pinch.z) > 0.01) ed.setZoom(pinch.z * (d / pinch.d), { cx: mx, cy: my, live: true })
      return
    }
    const [x, y] = toPt(e.clientX, e.clientY)
    if (!drag) {
      if ((ed.tool === 'edittext' || ed.tool === 'redact') && v.runs) {
        const r = runAt(x, y)
        if (r !== hoverRun) { hoverRun = r; v.redraw() }
        over.style.cursor = r ? (ed.tool === 'edittext' ? 'text' : 'pointer') : ed.tool === 'redact' ? 'crosshair' : 'default'
      } else if (ed.tool === 'edittext' || ed.tool === 'redact') v.getRuns().then(() => v.redraw())
      if (ed.tool === 'erase' && e.pointerType !== 'touch') { eraserAt = [x, y]; v.redraw() }
      const cropA = ed.cropping?.page === page ? ed.cropping.a : null
      if (cropA) {
        const hc = cropHandleAt(cropA, x, y)
        over.style.cursor = !hc ? 'default' : hc === 'move' ? 'move' : cursorFor({ rot: 0 }, hc)
        return
      }
      if (ed.tool === 'select' && e.pointerType !== 'touch') {
        const sel = ed.sel?.page === page && ed.selSet.size === 1 ? ed.sel.a : null
        const hnd = sel ? handleAt(sel, x, y, tolPt(), cssPerPt()) : null
        const hit = hnd ? null : hitTop(x, y)
        const img = hnd || hit ? null : pdfImageAt(x, y)
        const ib = img ? boxOf(img) : null
        if ((ib?.x ?? -1) !== (hoverImg?.x ?? -1) || (ib?.y ?? -1) !== (hoverImg?.y ?? -1)) { hoverImg = ib; v.redraw() }
        over.style.cursor = hnd ? cursorFor(sel, hnd) : hit ? 'move' : img ? 'pointer' : 'default'
      }
      return
    }
    if (drag.pid !== undefined && e.pointerId !== drag.pid) return
    const shift = e.shiftKey
    switch (drag.kind) {
      case 'pan':
        ed.panBy(drag.lx - e.clientX, drag.ly - e.clientY)
        drag.lx = e.clientX
        drag.ly = e.clientY
        break
      case 'move': {
        let dx = x - drag.sx, dy = y - drag.sy
        if (!drag.moved && Math.hypot(dx, dy) * cssPerPt() < (e.pointerType === 'touch' ? 8 : 3)) return
        clearTimeout(longPress)
        drag.moved = true
        ;[dx, dy] = snapMove(dx, dy, drag.bounds, e.altKey)
        for (const [a, o] of drag.items) annMove(a, o, dx, dy)
        v.redraw()
        ed.refreshProps?.(true)
        break
      }
      case 'resize':
        drag.moved = true
        annResize(drag.a, drag.o, drag.handle, x, y, { aspect: keepsAspect(drag.a) !== shift })
        v.redraw()
        break
      case 'rotate': {
        drag.moved = true
        let deg = (drag.o.rot ?? 0) + ((Math.atan2(y - drag.cy, x - drag.cx) - drag.a0) * 180) / Math.PI
        deg = ((deg % 360) + 360) % 360
        if (shift) deg = Math.round(deg / 15) * 15
        else for (const sn of [0, 90, 180, 270, 360]) if (Math.abs(deg - sn) < 3) deg = sn
        drag.a.rot = Math.round((deg % 360) * 10) / 10
        v.redraw()
        ed.refreshProps?.(true)
        break
      }
      case 'p1': case 'p2': {
        drag.moved = true
        let [nx, ny] = [x, y]
        if (shift) [nx, ny] = snap45(drag.kind === 'p1' ? drag.o.x2 : drag.o.x1, drag.kind === 'p1' ? drag.o.y2 : drag.o.y1, x, y)
        if (drag.kind === 'p1') { drag.a.x1 = nx; drag.a.y1 = ny } else { drag.a.x2 = nx; drag.a.y2 = ny }
        v.redraw()
        break
      }
      case 'crop':
        applyCropDrag(drag.a, drag.o, drag.handle, x, y, drag.sx, drag.sy)
        v.redraw()
        break
      case 'erase':
        for (const ev of coalesced(e)) { const [ex, ey] = toPt(ev.clientX, ev.clientY); eraseAt(ex, ey) }
        break
      case 'free': {
        for (const ev of coalesced(e)) {
          const [ex, ey] = toPt(ev.clientX, ev.clientY)
          const last = draft.pts[draft.pts.length - 1]
          if (Math.hypot(ex - last[0], ey - last[1]) * cssPerPt() < 1.2) continue
          if (draft.t === 'stroke') {
            const target = ed.style.penWidth * (ev.pointerType === 'pen' ? 0.4 + 1.2 * (ev.pressure || 0.5) : 1)
            draft.pts.push([ex, ey, last[2] * 0.5 + target * 0.5])
          } else draft.pts.push([ex, ey])
        }
        if (draft.t === 'highlight' && shift && draft.pts.length > 1) draft.pts = [draft.pts[0], [x, draft.pts[0][1]]]
        v.redraw()
        break
      }
      case 'hl':
        draft.rects = selectionRects(v.runs ?? [], drag.sx, drag.sy, x, y)
        v.redraw()
        break
      case 'shape': {
        const dx = x - drag.sx, dy = y - drag.sy
        if (!drag.moved && Math.hypot(dx, dy) * cssPerPt() < 3) return
        drag.moved = true
        draft = shapeFor(ed, drag.sx, drag.sy, x, y, shift)
        v.redraw()
        break
      }
      case 'textbox': {
        const dx = x - drag.sx
        if (Math.abs(dx) * cssPerPt() > 8) { marquee = { x: Math.min(drag.sx, x), y: drag.sy, w: Math.abs(dx), h: ed.style.textSize * LINE_H }; v.redraw() }
        break
      }
      case 'deselect':
        if (!drag.touch && Math.hypot(x - drag.sx, y - drag.sy) * cssPerPt() > 4) {
          marquee = { x: Math.min(drag.sx, x), y: Math.min(drag.sy, y), w: Math.abs(x - drag.sx), h: Math.abs(y - drag.sy) }
          v.redraw()
        }
        break
    }
  })

  const finish = (e) => {
    pointers.delete(e.pointerId)
    clearTimeout(longPress)
    if (pinch) { if (pointers.size < 2) { pinch = null; ed.setZoom(ed.zoom, { commit: true }) } return }
    if (!drag) return
    const d = drag
    drag = null
    guides = []
    const [x, y] = toPt(e.clientX, e.clientY)
    switch (d.kind) {
      case 'move': case 'resize': case 'p1': case 'p2': case 'rotate':
        if (d.moved) ed.commit('Move')
        else if (d.kind === 'move' && e.detail >= 2) ed.dblClick(page, d.hit)
        ed.refreshProps?.()
        break
      case 'crop':
        ed.refreshProps?.()
        break
      case 'erase':
        if (e.pointerType === 'touch') eraserAt = null
        if (d.changed) ed.commit('Erase')
        break
      case 'deselect': {
        const tap = Math.hypot(x - d.sx, y - d.sy) * cssPerPt() < 8
        if (marquee) {
          const m = marquee
          marquee = null
          const inside = page.annots.filter((a) => {
            if (a.hidden || a.locked || a.t === 'imgremove') return false
            const b = annBounds(a)
            return b.x >= m.x && b.y >= m.y && b.x + b.w <= m.x + m.w && b.y + b.h <= m.y + m.h
          })
          if (inside.length) ed.selectMany(page, inside); else ed.select(null)
        } else if (tap && d.img) ed.selectPdfImage(page, d.img, boxOf(d.img))
        else if (tap) ed.select(null)
        break
      }
      case 'free': {
        const a = draft
        draft = null
        if (a.t === 'stroke' && a.pts.length > 2) a.pts = smooth(a.pts)
        ed.add(page, a, { select: false })
        break
      }
      case 'hl': {
        const a = draft
        draft = null
        if (a.rects.length) ed.add(page, a, { select: false })
        else { ed.hint('Drag across text to highlight it — or switch to freehand'); v.redraw() }
        break
      }
      case 'shape': {
        let a = draft
        draft = null
        if (!d.moved) {
          const r = (ed.tool === 'redact' || ed.tool === 'whiteout') ? runAt(x, y) : null
          if (r) a = ed.tool === 'redact' ? { t: 'redact', x: r.x - 1, y: r.y - 1, w: r.w + 2, h: r.h + 2, fill: ed.style.redactColor } : { t: 'whiteout', x: r.x - 1, y: r.y - 1, w: r.w + 2, h: r.h + 2, fill: '#ffffff' }
          else if (ed.tool === 'shape') { // a tap drops a default-size shape
            const sz = 80
            const line = ed.sub.shape === 'line' || ed.sub.shape === 'arrow'
            a = shapeFor(ed, x - sz / 2, y + (line ? 0 : -sz / 2), x + sz / 2, y + (line ? 0 : sz / 2), false)
          } else { v.redraw(); break }
        }
        if (!a) break
        if (a.t === 'link') { ed.add(page, a, { select: true }); ed.editLink(page, a, true); break }
        ed.add(page, a, { select: ed.tool !== 'redact' && ed.tool !== 'whiteout' })
        break
      }
      case 'textbox': {
        const w = marquee ? marquee.w : 0
        marquee = null
        const st = ed.style
        const a = ed.add(page, { t: 'text', x: w ? Math.min(d.sx, x) : d.sx, y: d.sy - st.textSize * 0.6, w, text: '', size: st.textSize, font: st.font, bold: st.bold, italic: st.italic, underline: st.underline, color: st.textColor, align: st.align }, { select: true, silent: true })
        v.editText(a)
        break
      }
    }
    v.redraw()
  }
  const cancel = () => {
    clearTimeout(longPress)
    if (drag?.kind === 'move' && drag.moved) for (const [a, o] of drag.items) Object.assign(a, o)
    if (drag && (drag.kind === 'resize' || drag.kind === 'rotate') && drag.moved) Object.assign(drag.a, drag.o)
    drag = null
    draft = null
    marquee = null
    guides = []
    v.redraw()
  }
  over.addEventListener('pointerup', finish)
  over.addEventListener('pointercancel', (e) => { pointers.delete(e.pointerId); pinch = null; cancel() })
  over.addEventListener('pointerleave', () => {
    if (!drag && (hoverRun || hoverImg || eraserAt)) { hoverRun = null; hoverImg = null; eraserAt = null; v.redraw() }
  })
  over.addEventListener('dblclick', (e) => {
    if (ed.tool !== 'select') return
    const [x, y] = toPt(e.clientX, e.clientY)
    const hit = hitTop(x, y)
    if (hit) ed.dblClick(page, hit)
  })
  over.addEventListener('contextmenu', (e) => {
    const [x, y] = toPt(e.clientX, e.clientY)
    const hit = hitTop(x, y)
    if (!hit) return
    e.preventDefault()
    if (!ed.selSet.has(hit)) ed.select(page, hit)
    ed.contextMenu(e, page, hit)
  })
  // touch: one finger on empty space scrolls natively in Select; anything else is ours
  over.addEventListener('touchstart', (e) => {
    if (e.touches.length > 1) { e.preventDefault(); return }
    if (ed.cropping?.page === page) { e.preventDefault(); return }
    if (ed.tool !== 'select') { e.preventDefault(); return }
    const t = e.touches[0]
    const [x, y] = toPt(t.clientX, t.clientY)
    const sel = ed.sel?.page === page && ed.selSet.size === 1 ? ed.sel.a : null
    if ((sel && handleAt(sel, x, y, tolPt(), cssPerPt())) || hitTop(x, y)) e.preventDefault()
  }, { passive: false })

  v.cancel = cancel
  v.layout()
  return v
}

// ---------- helpers ----------

const coalesced = (e) => { const l = e.getCoalescedEvents?.(); return l && l.length ? l : [e] }
const rgbHex = (c) => '#' + (c ?? [0, 0, 0]).map((v) => Math.round(Math.min(1, Math.max(0, v)) * 255).toString(16).padStart(2, '0')).join('')

function snap45(ox, oy, x, y) {
  const ang = Math.round(Math.atan2(y - oy, x - ox) / (Math.PI / 4)) * (Math.PI / 4)
  const len = Math.hypot(x - ox, y - oy)
  return [ox + len * Math.cos(ang), oy + len * Math.sin(ang)]
}

/** Draft object for rectangle-ish tools. */
function shapeFor(ed, x0, y0, x1, y1, shift) {
  const st = ed.style
  const sub = ed.sub.shape
  if (ed.tool === 'shape' && (sub === 'line' || sub === 'arrow')) {
    const [x2, y2] = shift ? snap45(x0, y0, x1, y1) : [x1, y1]
    return { t: 'line', x1: x0, y1: y0, x2, y2, color: st.shapeStroke ?? '#e03131', width: st.shapeWidth, arrow: sub === 'arrow', alpha: st.shapeAlpha, dash: st.shapeDash ? [st.shapeWidth * 3, st.shapeWidth * 2] : null }
  }
  let w = x1 - x0, hh = y1 - y0
  if (shift) { const m = Math.max(Math.abs(w), Math.abs(hh)); w = Math.sign(w || 1) * m; hh = Math.sign(hh || 1) * m }
  const box = { x: Math.min(x0, x0 + w), y: Math.min(y0, y0 + hh), w: Math.abs(w), h: Math.abs(hh) }
  if (ed.tool === 'whiteout') return { t: 'whiteout', ...box, fill: '#ffffff' }
  if (ed.tool === 'redact') return { t: 'redact', ...box, fill: st.redactColor }
  if (ed.tool === 'link') return { t: 'link', ...box, url: '' }
  const common = { ...box, stroke: st.shapeStroke, fill: st.shapeFill, fillAlpha: st.shapeFillAlpha ?? 1, lw: st.shapeWidth, alpha: st.shapeAlpha, dash: st.shapeDash ? [st.shapeWidth * 3, st.shapeWidth * 2] : null }
  if (sub === 'triangle' || sub === 'star' || sub === 'polygon') return { t: 'poly', kind: sub, sides: sub === 'star' ? (st.starPoints ?? 5) : sub === 'polygon' ? (st.polySides ?? 6) : 3, ...common }
  return { t: sub === 'ellipse' ? 'ellipse' : 'rect', ...common, radius: sub === 'rrect' ? Math.min(box.w, box.h) * 0.15 : 0 }
}

/**
 * Text-selection style highlight rects between two points: runs in reading
 * order from the run under the start to the run under the end, clipped at the
 * start/end x on the first/last line.
 */
function selectionRects(runs, x0, y0, x1, y1) {
  if (!runs.length) return []
  const ordered = [...runs].filter((r) => !r.rotated).sort((a, b) => (Math.abs(a.base - b.base) < a.size * 0.4 ? a.x - b.x : a.base - b.base))
  const idxAt = (x, y) => {
    let best = -1, bd = Infinity
    ordered.forEach((r, i) => {
      const dy = y < r.y ? r.y - y : y > r.y + r.h ? y - r.y - r.h : 0
      const dx = x < r.x ? r.x - x : x > r.x + r.w ? x - r.x - r.w : 0
      const d = dy * 4 + dx
      if (d < bd) { bd = d; best = i }
    })
    return bd < 30 ? best : -1
  }
  let a = idxAt(x0, y0), b = idxAt(x1, y1)
  if (a < 0 || b < 0) return []
  let sx = x0, ex = x1
  if (a > b) { [a, b] = [b, a]; [sx, ex] = [x1, x0] }
  const rects = []
  for (let i = a; i <= b; i++) {
    const r = ordered[i]
    let left = r.x, right = r.x + r.w
    if (i === a) left = Math.max(left, Math.min(sx, right))
    if (i === b) right = Math.min(right, Math.max(ex, left))
    if (a === b && left > right) [left, right] = [right, left]
    if (right - left > 0.5) rects.push({ x: left, y: r.y + r.h * 0.04, w: right - left, h: r.h * 0.92 })
  }
  return rects
}

// ---- src/editor/signature.js ----
// Signature dialog: draw / type / upload → trimmed transparent image.
// Saved signatures live only in this browser (localStorage).

const KEY = 'pdfsuite-signatures'
function savedSignatures() {
  try { return JSON.parse(localStorage.getItem(KEY) ?? '[]').filter((s) => typeof s === 'string' && s.startsWith('data:image/png')) } catch { return [] }
}
function storeSignatures(list) {
  try { localStorage.setItem(KEY, JSON.stringify(list.slice(0, 8))) } catch { toast('Couldn’t save the signature in this browser', { type: 'error' }) }
}
function forgetSignature(url) { storeSignatures(savedSignatures().filter((s) => s !== url)) }

const SCRIPT_FONTS = ['"Segoe Script", "Brush Script MT", cursive', '"Lucida Handwriting", "Apple Chancery", cursive', '"Brush Script MT", "Snell Roundhand", cursive', '"Ink Free", "Bradley Hand", cursive', 'Georgia, "Times New Roman", serif']

/** Crop transparent margins; returns a new canvas (or null if empty). */
function trim(src, pad = 6) {
  const x = src.getContext('2d')
  const { width: w, height: hh } = src
  const d = x.getImageData(0, 0, w, hh).data
  let x0 = w, y0 = hh, x1 = -1, y1 = -1
  for (let y = 0; y < hh; y++) for (let xx = 0; xx < w; xx++) {
    if (d[(y * w + xx) * 4 + 3] > 12) { if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (y < y0) y0 = y; if (y > y1) y1 = y }
  }
  if (x1 < 0) return null
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(hh - 1, y1 + pad)
  const c = document.createElement('canvas')
  c.width = x1 - x0 + 1
  c.height = y1 - y0 + 1
  c.getContext('2d').drawImage(src, x0, y0, c.width, c.height, 0, 0, c.width, c.height)
  return c
}

/** Canvas → {rgba, iw, ih, url}. */
function sigFromCanvas(c) {
  const d = c.getContext('2d').getImageData(0, 0, c.width, c.height)
  return { rgba: d.data, iw: c.width, ih: c.height, url: c.toDataURL('image/png') }
}

/** data URL → signature object (async). */
async function sigFromUrl(url) {
  const img = new Image()
  img.src = url
  await img.decode()
  const c = document.createElement('canvas')
  c.width = img.naturalWidth
  c.height = img.naturalHeight
  c.getContext('2d').drawImage(img, 0, 0)
  return sigFromCanvas(c)
}

/** Open the dialog → Promise<signature | null>. */
function signatureDialog() {
  return new Promise((resolve) => {
    let mode = 'draw'
    let color = '#111111'
    let width = 2.6
    let typed = ''
    let fontIdx = 0
    let upload = null // canvas
    let removeBg = true
    let save = true
    let done = false
    const body = h('div', { class: 'stack' })
    const strokes = []
    let pad = null

    const finish = (v) => { if (!done) { done = true; resolve(v) } }

    function drawPad() {
      const c = h('canvas', { class: 'sigpad' })
      const ctx = c.getContext('2d')
      const fit = () => {
        const r = c.getBoundingClientRect()
        const dpr = Math.min(2, devicePixelRatio || 1)
        c.width = Math.max(10, Math.round(r.width * dpr))
        c.height = Math.max(10, Math.round(r.height * dpr))
        repaint()
      }
      const repaint = () => {
        ctx.clearRect(0, 0, c.width, c.height)
        const k = c.width / 600
        ctx.lineCap = 'round'
        ctx.lineJoin = 'round'
        // guide line
        ctx.strokeStyle = '#d0d4da'
        ctx.lineWidth = 1
        ctx.setLineDash([6, 6])
        ctx.beginPath(); ctx.moveTo(30 * k, c.height * 0.74); ctx.lineTo(c.width - 30 * k, c.height * 0.74); ctx.stroke()
        ctx.setLineDash([])
        ctx.strokeStyle = color
        for (const s of strokes) {
          for (let i = 1; i < s.length; i++) {
            ctx.lineWidth = s[i][2] * k
            ctx.beginPath()
            ctx.moveTo(s[i - 1][0] * k, s[i - 1][1] * k)
            ctx.lineTo(s[i][0] * k, s[i][1] * k)
            ctx.stroke()
          }
          if (s.length === 1) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(s[0][0] * k, s[0][1] * k, s[0][2] * k / 2, 0, 7); ctx.fill() }
        }
      }
      let cur = null
      const pt = (e) => { const r = c.getBoundingClientRect(); return [((e.clientX - r.left) / r.width) * 600, ((e.clientY - r.top) / r.width) * 600] }
      c.addEventListener('pointerdown', (e) => {
        c.setPointerCapture(e.pointerId)
        const [x, y] = pt(e)
        cur = [[x, y, width * (e.pointerType === 'pen' ? 0.5 + e.pressure : 1)]]
        strokes.push(cur)
        repaint()
      })
      c.addEventListener('pointermove', (e) => {
        if (!cur) return
        for (const ev of (e.getCoalescedEvents?.()?.length ? e.getCoalescedEvents() : [e])) {
          const [x, y] = pt(ev)
          const last = cur[cur.length - 1]
          const dist = Math.hypot(x - last[0], y - last[1])
          if (dist < 1) continue
          // faster strokes get thinner, like real ink
          const target = width * (ev.pointerType === 'pen' ? 0.5 + ev.pressure : Math.max(0.55, Math.min(1.25, 1.35 - dist / 30)))
          cur.push([x, y, last[2] * 0.6 + target * 0.4])
        }
        repaint()
      })
      const end = () => { cur = null }
      c.addEventListener('pointerup', end)
      c.addEventListener('pointercancel', end)
      requestAnimationFrame(fit)
      pad = { c, repaint }
      return c
    }

    function typedCanvas(fi = fontIdx, text = typed, col = color) {
      const c = document.createElement('canvas')
      c.width = 1400
      c.height = 360
      const x = c.getContext('2d')
      x.fillStyle = col
      let size = 190
      x.font = `${size}px ${SCRIPT_FONTS[fi]}`
      while (size > 40 && x.measureText(text).width > c.width - 80) { size -= 10; x.font = `${size}px ${SCRIPT_FONTS[fi]}` }
      x.textBaseline = 'middle'
      x.fillText(text, 40, c.height / 2)
      return c
    }

    function uploadCanvas() {
      if (!upload) return null
      const c = document.createElement('canvas')
      c.width = upload.width
      c.height = upload.height
      const x = c.getContext('2d')
      x.drawImage(upload, 0, 0)
      if (removeBg) {
        const id = x.getImageData(0, 0, c.width, c.height)
        const d = id.data
        for (let i = 0; i < d.length; i += 4) {
          const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]
          // paper → transparent, ink keeps its colour with soft edges
          d[i + 3] = Math.max(0, Math.min(255, (225 - lum) * 3.2))
        }
        x.putImageData(id, 0, 0)
      }
      return c
    }

    function paint() {
      body.replaceChildren(
        Seg([['draw', 'Draw', 'pencil'], ['type', 'Type', 'type'], ['upload', 'Upload', 'upload']], mode, (v) => { mode = v; paint() }, { block: true }),
        ...(mode === 'draw' ? [
          drawPad(),
          h('div', { class: 'row between' },
            h('div', { class: 'row' },
              Swatches(color, (v) => { color = v; pad?.repaint() }, { colors: ['#111111', '#1c3faa', '#0b6e4f'] }),
              Seg([[1.6, 'Fine'], [2.6, 'Medium'], [4, 'Bold']], width, (v) => (width = v))),
            Button({ label: 'Clear', icon: 'trash', size: 'sm', onClick: () => { strokes.length = 0; pad?.repaint() } })),
        ] : mode === 'type' ? [
          TextInput(typed, (v) => { typed = v; paintTiles() }, { placeholder: 'Type your name' }),
          h('div', { class: 'sig-typed', id: 'sig-tiles' }),
          Swatches(color, (v) => { color = v; paintTiles() }, { colors: ['#111111', '#1c3faa', '#0b6e4f'] }),
        ] : [
          upload
            ? h('div', { style: { background: 'repeating-conic-gradient(var(--checker) 0% 25%, var(--surface) 0% 50%) 0 0 / 14px 14px', borderRadius: '10px', padding: '8px', display: 'grid', placeItems: 'center' } },
              (() => { const c = uploadCanvas(); c.style.maxWidth = '100%'; c.style.maxHeight = '180px'; return c })())
            : null,
          Button({ label: upload ? 'Choose another image' : 'Choose an image of your signature', icon: 'image', block: true, onClick: async () => {
            const [f] = await pickFiles({ accept: 'image/*' })
            if (!f) return
            try {
              const bmp = await createImageBitmap(f)
              const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height))
              const c = document.createElement('canvas')
              c.width = Math.round(bmp.width * k)
              c.height = Math.round(bmp.height * k)
              c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height)
              upload = c
              paint()
            } catch { toast('Couldn’t read that image', { type: 'error' }) }
          } }),
          upload ? Switch('Remove paper background', removeBg, (v) => { removeBg = v; paint() }, { hint: 'Makes white paper transparent' }) : null,
        ]),
        Switch('Save for next time', save, (v) => (save = v), { hint: 'Stored only in this browser' }),
      )
      if (mode === 'type') paintTiles()
    }
    function paintTiles() {
      const tiles = body.querySelector('#sig-tiles')
      if (!tiles) return
      tiles.replaceChildren(...SCRIPT_FONTS.map((f, i) => h('button', {
        type: 'button', class: i === fontIdx ? 'on' : '', style: { fontFamily: f, color },
        onclick: () => { fontIdx = i; paintTiles() },
      }, typed || 'Your name')))
    }

    modal({
      title: 'Add your signature', body,
      onClose: () => finish(null),
      actions: [
        { label: 'Cancel', onClick: () => finish(null) },
        { label: 'Use signature', variant: 'primary', icon: 'check', onClick: () => {
          let src = null
          if (mode === 'draw') {
            if (!strokes.length) { toast('Draw your signature first', { type: 'error' }); return false }
            const c = document.createElement('canvas')
            c.width = 1200
            c.height = 400
            const x = c.getContext('2d')
            x.lineCap = 'round'
            x.lineJoin = 'round'
            x.strokeStyle = color
            x.fillStyle = color
            for (const s of strokes) {
              for (let i = 1; i < s.length; i++) { x.lineWidth = s[i][2] * 2; x.beginPath(); x.moveTo(s[i - 1][0] * 2, s[i - 1][1] * 2); x.lineTo(s[i][0] * 2, s[i][1] * 2); x.stroke() }
              if (s.length === 1) { x.beginPath(); x.arc(s[0][0] * 2, s[0][1] * 2, s[0][2], 0, 7); x.fill() }
            }
            src = c
          } else if (mode === 'type') {
            if (!typed.trim()) { toast('Type your name first', { type: 'error' }); return false }
            src = typedCanvas()
          } else {
            src = uploadCanvas()
            if (!src) { toast('Choose an image first', { type: 'error' }); return false }
          }
          const t = trim(src)
          if (!t) { toast('The signature is empty', { type: 'error' }); return false }
          const sig = sigFromCanvas(t)
          if (save) storeSignatures([sig.url, ...savedSignatures().filter((s) => s !== sig.url)])
          finish(sig)
          return true
        } },
      ],
    })
    paint()
  })
}

            [['rect', '▭', 'Rectangle'], ['rrect', '▢', 'Rounded rectangle'], ['ellipse', '◯', 'Ellipse'], ['triangle', '△', 'Triangle'], ['star', '☆', 'Star'], ['polygon', '⬡', 'Polygon'], ['line', '╱', 'Line'], ['arrow', '➚', 'Arrow']]
              .map(([k, g, tip]) => h('button', { type: 'button', class: ed.sub.shape === k ? 'on' : '', 'data-tip': tip, 'aria-label': tip, onclick: () => { ed.sub.shape = k; ed.refreshProps() } }, g)))),

function layersPanel(ed, page) {

  const n = list.length
  const rows = list.slice().reverse().map((a) => {
    const name = h('span', { class: 'lname', title: 'Double-click to rename' }, a.name || TYPE_NAMES[a.t] || a.t,
      (a.t === 'text' || a.t === 'textedit') && !a.name ? h('small', {}, ` ${(a.text || '').slice(0, 24)}`) : null)
    name.addEventListener('dblclick', (e) => {
      e.stopPropagation()
      if (a.t === 'imgremove') return
      const inp = h('input', { class: 'input', value: a.name || TYPE_NAMES[a.t] || '' })
      inp.addEventListener('keydown', (ev) => { ev.stopPropagation(); if (ev.key === 'Enter') inp.blur(); if (ev.key === 'Escape') { inp.value = a.name || TYPE_NAMES[a.t] || ''; inp.blur() } })
      inp.addEventListener('blur', () => {

        const nv = v && v !== TYPE_NAMES[a.t] ? v : undefined
        if (nv !== a.name) { a.name = nv; ed.commit('Rename') }
        ed.refreshProps()
      })
      name.replaceWith(inp)
      inp.focus()
      inp.select()
    })
    const flag = (ic, icOn, key, tip) => h('button', {
      type: 'button', class: 'btn btn-ghost btn-icon btn-sm' + (a[key] ? ' on' : ''), 'data-tip': tip, 'aria-label': tip,
      onclick: (e) => { e.stopPropagation(); ed.setFlag(page, a, key, !a[key]) },
    }, icon(a[key] ? icOn : ic, 'icon-sm'))
    return h('div', {
      class: 'layer' + (ed.selSet.has(a) ? ' on' : '') + (a.hidden ? ' off' : ''), role: 'button', tabindex: '0',
      onclick: (e) => {

      : [flag('eye', 'eyeOff', 'hidden', a.hidden ? 'Show' : 'Hide'), flag('unlock', 'lock', 'locked', a.locked ? 'Unlock' : 'Lock')])
  })

  sortable(box, '.layer', (from, to) => ed.moveLayer(page, list[n - 1 - from], n - 1 - to), { horizontal: false, handle: '.lgrip' })
  return [box, h('div', { class: 'tip' }, 'Drag the grip to reorder · double-click a name to rename · the top of the list is in front.')]

// ---------- images ----------
const thumbCache = new WeakMap()
/** Small previews of every preset look, made once per image source. */
function presetThumbs(ed, a) {
  const key = a.srcKey
  if (!key) return null
  if (thumbCache.has(key)) return thumbCache.get(key)
  const src = ed.imageSrc(a)
  if (!src) return null
  const k = 72 / Math.max(src.w, src.h)
  const c = document.createElement('canvas')
  c.width = Math.max(1, Math.round(src.w * k))
  c.height = Math.max(1, Math.round(src.h * k))
  const x = c.getContext('2d')
  x.drawImage(src.canvas, 0, 0, c.width, c.height)
  const small = { rgba: x.getImageData(0, 0, c.width, c.height).data, w: c.width, h: c.height }
  const out = {}
  for (const [name, fx] of Object.entries(PRESETS)) {
    const r = processImage(small, {}, fx)
    const t = document.createElement('canvas')
    t.width = r.w
    t.height = r.h
    t.getContext('2d').putImageData(new ImageData(r.rgba, r.w, r.h), 0, 0)
    out[name] = t.toDataURL()
  }
  thumbCache.set(key, out)
  return out
}

  ]
}
/** Undo a crop that was applied before the current crop session. */
function uncrop(a, before) {
  const c = before.crop
  if (!c) return
  const kx = a.w / c.w, ky = a.h / c.h
  a.x -= c.x * kx
  a.y -= c.y * ky
  a.w = a.iw * kx
  a.h = a.ih * ky
  delete a.crop
}

// ---- src/editor/export.js ----
// Editor → PDF. Pipeline (each step works in the FINAL page display space):
//   1. page structure (order / rotation / deletes / blank inserts)
//   2. text removal under "edit text" regions, true redaction, and removal of
//      embedded images the user deleted or replaced with an edited copy
//   3. form field values (optionally flattened)
//   4. everything else baked in as real PDF content / annotations (images run
//      through the same fx pipeline as the on-screen preview, at full size)

/** Browser JPEG decoder for the redaction engine. */
async function decodeJpeg(bytes) {
  const bmp = await createImageBitmap(new Blob([bytes], { type: 'image/jpeg' }))
  const c = document.createElement('canvas')
  c.width = bmp.width
  c.height = bmp.height
  const x = c.getContext('2d')
  x.drawImage(bmp, 0, 0)
  bmp.close?.()
  const d = x.getImageData(0, 0, c.width, c.height)
  return { w: c.width, h: c.height, rgba: d.data }
}

/** Render text the standard fonts can't encode (CJK, Arabic, emoji…) to a transparent image. */
function rasterText(a, b) {
  const k = 4 // px per pt — crisp when printed
  const c = document.createElement('canvas')
  c.width = Math.max(1, Math.ceil((b.w + 4) * k))
  c.height = Math.max(1, Math.ceil((b.h + 2) * k))
  const x = c.getContext('2d')
  if (a.bg) { x.fillStyle = a.bg; x.fillRect(0, 0, c.width, c.height) }
  x.fillStyle = a.color
  x.font = fontCssOf(a, a.size * k)
  x.textBaseline = 'alphabetic'
  x.direction = 'inherit'
  b.lines.forEach((ln, i) => {
    const lw = x.measureText(ln).width
    const lx = a.align === 'center' ? (c.width - lw) / 2 : a.align === 'right' ? c.width - lw - 2 * k : 2 * k
    // (b.w comes from lineWidth(), i.e. the same browser measurement — nothing clips)
    x.fillText(ln, lx, (1 + a.size * 0.8 + i * a.size * (a.lineHeight ?? LINE_H)) * k)
  })
  const d = x.getImageData(0, 0, c.width, c.height)
  return { t: 'image', x: b.x - 2, y: b.y - 1, w: b.w + 4, h: b.h + 2, rgba: d.data, iw: c.width, ih: c.height, alpha: a.alpha ?? 1, rot: a.rot ? (a.rot * Math.PI) / 180 : 0 }
}

/**
 * Bake an image object's crop / flip / adjustments into pixels.
 * Returns a plain {rgba, iw, ih, x, y, w, h} (the box grows when a shadow pads it),
 * or null when nothing needs processing (the original bytes are kept).
 */
async function bakeImage(a, decode = decodeJpeg) {
  const geo = { crop: a.crop, srcW: a.iw, flipH: a.flipH, flipV: a.flipV }
  if (fxIsIdentity(a.fx ?? {}, geo)) return null
  const src = a.rgba ? { rgba: a.rgba, w: a.iw, h: a.ih } : await decode(a.jpeg)
  const r = processImage(src, geo, a.fx ?? {})
  const sx = a.w / (r.innerW || 1), sy = a.h / (r.innerH || 1)
  return { rgba: r.rgba, iw: r.w, ih: r.h, x: a.x - r.ox * sx, y: a.y - r.oy * sy, w: r.w * sx, h: r.h * sy }
}

/** One editor object → engine annotations (array). */
function toEngine(a) {
  const rot = a.rot ? (a.rot * Math.PI) / 180 : 0
  if (a.hidden || a.t === 'imgremove') return []
  const out = toEngine1(a, rot)
  if (a.blend && a.blend !== 'normal') for (const o of out) o.blend = a.blend
  return out
}

/** Shapes with a separately-transparent fill become fill + outline objects. */
function splitFill(o, fillAlpha) {
  if (!o.fill || !(fillAlpha < 1)) return [o]
  const alpha = o.alpha ?? 1
  return [{ ...o, stroke: null, alpha: alpha * fillAlpha }, ...(o.stroke && o.lw > 0 ? [{ ...o, fill: null, alpha }] : [])]
}

function toEngine1(a, rot) {
  switch (a.t) {
    case 'stroke': return [{ t: 'vstroke', pts: a.pts.map((p) => [p[0], p[1], p[2] ?? a.width]), color: a.color, alpha: a.alpha }]
    case 'highlight': return [{ t: 'highlight', pts: a.pts, color: a.color, width: a.width, alpha: a.alpha ?? 0.4 }]
    case 'hlrects': return a.rects.map((r) => ({ t: 'highlight', pts: [[r.x, r.y + r.h / 2], [r.x + r.w, r.y + r.h / 2]], width: r.h, color: a.color, alpha: a.alpha ?? 0.4 }))
    case 'line': return [{ ...a }]
    case 'rect': case 'ellipse': return splitFill({ t: a.t, x: a.x, y: a.y, w: a.w, h: a.h, stroke: a.stroke, fill: a.fill, lw: a.lw, alpha: a.alpha, dash: a.dash, radius: a.radius, rot }, a.fillAlpha)
    case 'poly': {
      const pts = polyPoints(a)
      const segs = [...pts.map((p, i) => [i ? 'L' : 'M', p[0], p[1]]), ['Z']]
      return splitFill({ t: 'path', segs, stroke: a.stroke, fill: a.fill, lw: a.stroke ? a.lw : 0, alpha: a.alpha, dash: a.dash, x: a.x, y: a.y, w: a.w, h: a.h, rot }, a.fillAlpha)
    }
    case 'whiteout': return [{ t: 'rect', x: a.x, y: a.y, w: a.w, h: a.h, fill: a.fill ?? '#ffffff', stroke: null, lw: 0, alpha: 1, rot }]
    case 'text': case 'textedit': {
      if (!a.text.trim()) return []
      const b = textBox(a)
      const text = b.lines.join('\n')
      if (toWinAnsi(text.replace(/\n/g, '')) === null) return [rasterText(a, b)]
      return [{
        t: 'text', x: b.x, y: b.y, w: b.w, h: b.h, text, size: a.size, font: a.font, bold: a.bold, italic: a.italic, underline: a.underline, strike: a.strike,
        color: a.color, align: a.align, bg: a.bg, alpha: a.alpha, lineHeight: a.lineHeight ?? LINE_H, spacing: a.spacing || 0, outline: a.outline, shadow: a.shadow, rot,
      }]
    }
    case 'image': {
      const b = a.baked // set by exportEdited when fx/crop/flip apply
      if (b) return [{ t: 'image', x: b.x, y: b.y, w: b.w, h: b.h, rgba: b.rgba, iw: b.iw, ih: b.ih, alpha: a.alpha, rot }]
      return [{ t: 'image', x: a.x, y: a.y, w: a.w, h: a.h, jpeg: a.jpeg, rgba: a.rgba, iw: a.iw, ih: a.ih, alpha: a.alpha, rot }]
    }
    case 'mark':
      if (a.kind === 'dot') return [{ t: 'ellipse', x: a.x + a.w * 0.12, y: a.y + a.h * 0.12, w: a.w * 0.76, h: a.h * 0.76, fill: a.color, alpha: a.alpha, rot }]
      return [{ t: 'path', segs: markSegs(a), stroke: a.color, lw: Math.max(1, Math.min(a.w, a.h) * 0.12), alpha: a.alpha, x: a.x, y: a.y, w: a.w, h: a.h, rot }]
    case 'stamp': {
      const size = a.h * 0.5
      return [
        { t: 'rect', x: a.x, y: a.y, w: a.w, h: a.h, stroke: a.color, lw: Math.max(1, a.h * 0.06), radius: a.h * 0.18, alpha: a.alpha, rot },
        // h = 0.9·size puts the text box centre on the stamp centre, so both rotate about the same point
        { t: 'text', x: a.x, y: a.y + a.h / 2 - size * 0.45, w: a.w, h: size * 0.9, align: 'center', text: a.label, size, font: 'helv', bold: true, color: a.color, alpha: a.alpha, rot },
      ]
    }
    case 'note': return [{ t: 'note', x: a.x, y: a.y, text: a.text, color: a.color }]
    case 'link': return [{ t: 'link', x: a.x, y: a.y, w: a.w, h: a.h, url: a.url }]
    default: return []
  }
}

/**
 * Build the edited PDF.
 * info: opened source; pages: [{src|null, rot, w, h, annots}];
 * forms: {values: {name: value}, flatten} | null. Returns Uint8Array.
 */
async function exportEdited(info, pages, { forms = null, onStep = () => {}, decode = decodeJpeg } = {}) {
  // 1. structure
  const identity = pages.length === info.leaves.length && pages.every((p, i) => p.src === i && !p.rot)
  let bytes = info.bytes
  if (!identity) {
    onStep('Arranging pages')
    bytes = await organizePages(info.bytes, pages.map((p) => (p.src === null ? { blank: [p.w, p.h] } : { page: p.src + 1, rotation: p.rot })))
  }
  let doc = await parsePdf(bytes)
  if (pageLeaves(doc).length !== pages.length) throw new Error('page structure mismatch')
  // 2. removals
  const erase = pages.map((p) => p.annots.filter((a) => a.t === 'textedit').map((a) => a.region))
  const redact = pages.map((p) => p.annots.filter((a) => a.t === 'redact').map((a) => ({ x: a.x, y: a.y, w: a.w, h: a.h, fill: a.fill })))
  if (erase.some((r) => r.length)) { onStep('Editing text'); await applyRemovals(doc, erase, { mode: 'erase' }) }
  if (redact.some((r) => r.length)) {
    onStep('Redacting')
    const fill = pages.flatMap((p) => p.annots).find((a) => a.t === 'redact')?.fill ?? '#000000'
    await applyRemovals(doc, redact, { mode: 'redact', fill, decodeJpeg })
  }
  const dropped = pages.map((p) => p.annots.filter((a) => a.t === 'imgremove').map((a) => a.region))
  if (dropped.some((r) => r.length)) { onStep('Replacing images'); await applyRemovals(doc, dropped, { mode: 'dropimg' }) }
  // 3. forms
  let src = doc
  if (forms && (Object.keys(forms.values).length || forms.flatten)) {
    onStep('Filling form')
    src = await fillForm(doc, forms.values, { flatten: forms.flatten })
  }
  // 4. annotations
  const edited = pages.flatMap((p) => p.annots).filter((a) => a.t === 'image' && !a.hidden)
  const baked = new Map()
  for (const a of edited) {
    const b = await bakeImage(a, decode)
    if (b) { if (!baked.size) onStep('Processing images'); baked.set(a, b) }
  }
  onStep('Saving')
  const engineAnnots = pages.map((p) => p.annots.filter((a) => a.t !== 'redact').flatMap((a) => toEngine(baked.has(a) ? { ...a, baked: baked.get(a) } : a)))
  return annotatePdf(src, engineAnnots)
}


// ---- src/tools/merge.js ----

function Merge() {
  const { root, render } = mount()
  let files = [] // {id, file, info|null, err, thumb, range, rangeOk}
  let outName = 'merged'
  let bookmarks = true
  let busy = false
  let result = null
  let uid = 0

  const add = async (incoming) => {
    result = null
    for (const f of incoming) {
      const entry = { id: ++uid, file: f, info: null, err: null, thumb: null, range: '', rangeOk: true, loading: true }
      files.push(entry)
      paint()
      try {
        entry.info = await openPdf(f)
        if (!entry.info) { files = files.filter((x) => x !== entry); paint(); continue }
        const cv = await renderPage(entry.info.doc, entry.info.leaves[0], { width: 96 }).catch(() => null)
        entry.thumb = cv
      } catch (e) {
        entry.err = friendly(e, f.name)
      }
      entry.loading = false
      paint()
    }
  }

  const pagesOf = (e) => {
    if (!e.info) return []
    const n = e.info.leaves.length
    if (!e.range.trim()) return Array.from({ length: n }, (_, i) => i + 1)
