<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PDFSuite — free PDF tools, no uploads</title>
    <meta name="description" content="Edit, sign, merge, split, compress, redact and convert PDFs for free — right in your browser. Files never leave your device. No account, no limits, works offline." />
    <meta name="theme-color" content="#0e9f6e" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
/* PDFSuite design system — light + dark themes, one accent, calm surfaces.
   Theme: follows the OS unless the user picked one ([data-theme] on <html>). */

:root {
  color-scheme: light;
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --surface-3: #eef0f3;
  --hover: #eceef2;
  --border: #e2e5ea;
  --border-strong: #c9ced6;
  --text: #14171b;
  --text-2: #4b525c;
  --text-3: #7b828d;
  --accent: #0e9f6e;
  --accent-hover: #0b8a5f;
  --accent-soft: rgba(14, 159, 110, 0.1);
  --accent-ring: rgba(14, 159, 110, 0.35);
  --on-accent: #ffffff;
  --danger: #d6334a;
  --danger-soft: rgba(214, 51, 74, 0.1);
  --warn: #c77700;
  --warn-soft: rgba(245, 159, 0, 0.14);
  --info: #2563eb;
  --page-shadow: 0 1px 2px rgba(16, 24, 40, 0.08), 0 4px 14px rgba(16, 24, 40, 0.08);
  --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06);
  --shadow-md: 0 4px 16px rgba(16, 24, 40, 0.08), 0 1px 3px rgba(16, 24, 40, 0.06);
  --shadow-lg: 0 18px 50px rgba(16, 24, 40, 0.18), 0 4px 12px rgba(16, 24, 40, 0.08);
  --canvas-bg: #e7e9ee;
  --checker: #e9ebef;
  --radius-sm: 7px;
  --radius: 10px;
  --radius-lg: 14px;
  --c-organize: #3b82f6;
  --c-edit: #8b5cf6;
  --c-convert: #f59e0b;
  --c-secure: #ef4444;
  --c-optimize: #10b981;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0c0d10;
    --surface: #15171b;
    --surface-2: #1a1c21;
    --surface-3: #22252b;
    --hover: #262930;
    --border: #2a2d34;
    --border-strong: #3a3e47;
    --text: #eef0f3;
    --text-2: #b1b6bf;
    --text-3: #7f858f;
    --accent: #34d399;
    --accent-hover: #6ee7b7;
    --accent-soft: rgba(52, 211, 153, 0.12);
    --accent-ring: rgba(52, 211, 153, 0.4);
    --on-accent: #04261a;
    --danger: #f87171;
    --danger-soft: rgba(248, 113, 113, 0.12);
    --warn: #fbbf24;
    --warn-soft: rgba(251, 191, 36, 0.12);
    --info: #60a5fa;
    --page-shadow: 0 1px 3px rgba(0, 0, 0, 0.5), 0 6px 20px rgba(0, 0, 0, 0.35);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.6);
    --canvas-bg: #0f1013;
    --checker: #1e2026;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c0d10;
  --surface: #15171b;
  --surface-2: #1a1c21;
  --surface-3: #22252b;
  --hover: #262930;
  --border: #2a2d34;
  --border-strong: #3a3e47;
  --text: #eef0f3;
  --text-2: #b1b6bf;
  --text-3: #7f858f;
  --accent: #34d399;
  --accent-hover: #6ee7b7;
  --accent-soft: rgba(52, 211, 153, 0.12);
  --accent-ring: rgba(52, 211, 153, 0.4);
  --on-accent: #04261a;
  --danger: #f87171;
  --danger-soft: rgba(248, 113, 113, 0.12);
  --warn: #fbbf24;
  --warn-soft: rgba(251, 191, 36, 0.12);
  --info: #60a5fa;
  --page-shadow: 0 1px 3px rgba(0, 0, 0, 0.5), 0 6px 20px rgba(0, 0, 0, 0.35);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.6);
  --canvas-bg: #0f1013;
  --checker: #1e2026;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent-soft); }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hidden-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* icons */
.icon { width: 18px; height: 18px; flex: none; }
.icon-sm { width: 15px; height: 15px; flex: none; }
.icon-lg { width: 24px; height: 24px; flex: none; }
.icon-xl { width: 34px; height: 34px; flex: none; }

/* ---------- app shell ---------- */
.shell { min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 12px;
  height: 58px; padding: 0 max(16px, calc((100vw - 1200px) / 2));
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--text); font-weight: 700; letter-spacing: -0.02em; font-size: 17px; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.brand .accent { color: var(--accent); }
.topbar .spacer { flex: 1; }
.topbar-tag { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
.content { flex: 1; width: 100%; max-width: 1232px; margin: 0 auto; padding: 0 16px 80px; }
.footer { border-top: 1px solid var(--border); padding: 28px max(16px, calc((100vw - 1200px) / 2)); color: var(--text-3); font-size: 13px; display: grid; gap: 6px; }
.footer p { margin: 0; max-width: 760px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 38px; padding: 0 16px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font-weight: 550; font-size: 14px; cursor: pointer; white-space: nowrap;
  transition: background 0.12s, border-color 0.12s, color 0.12s, box-shadow 0.12s, transform 0.06s;
  text-decoration: none; user-select: none;
}
.btn:hover { background: var(--hover); border-color: var(--border-strong); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-danger { color: var(--danger); }
.btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--hover); border-color: transparent; }
.btn-sm { height: 32px; padding: 0 11px; font-size: 13px; gap: 6px; }
.btn-lg { height: 46px; padding: 0 22px; font-size: 15px; border-radius: var(--radius); }
.btn-block { width: 100%; }
.btn-icon { width: 36px; padding: 0; }
.btn-icon.btn-sm { width: 32px; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn .kbd { margin-left: 2px; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin 0.7s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.kbd { font: 11px/1 var(--mono); padding: 3px 5px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-3); }

/* ---------- form controls ---------- */
.field { display: grid; gap: 6px; }
.field > label, .field-label { font-size: 13px; font-weight: 550; color: var(--text-2); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.field .hint { font-size: 12px; color: var(--text-3); font-weight: 400; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.input, .select, .textarea {
  width: 100%; height: 38px; padding: 0 11px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px;
  transition: border-color 0.12s, box-shadow 0.12s;
}
.textarea { height: auto; min-height: 90px; padding: 9px 11px; resize: vertical; line-height: 1.45; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
.input.bad { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
.select { appearance: none; padding-right: 32px; background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%); background-position: calc(100% - 17px) 16px, calc(100% - 12px) 16px; background-size: 5px 5px; background-repeat: no-repeat; cursor: pointer; }
.input-group { display: flex; align-items: center; gap: 8px; }
.input-suffix { position: relative; }
.input-suffix .input { padding-right: 40px; }
.input-suffix > button { position: absolute; right: 3px; top: 3px; height: 32px; width: 32px; border: 0; background: transparent; border-radius: 6px; color: var(--text-3); cursor: pointer; display: grid; place-items: center; }
.input-suffix > button:hover { background: var(--hover); color: var(--text); }

/* segmented control */
.seg { display: inline-flex; background: var(--surface-3); border-radius: var(--radius-sm); padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg.block { display: flex; width: 100%; }
.seg.block > button { flex: 1; }
.seg > button {
  border: 0; background: transparent; color: var(--text-2); font-size: 13px; font-weight: 550;
  height: 30px; padding: 0 11px; border-radius: 5px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
}
.seg > button:hover { color: var(--text); }
.seg > button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.seg > button:disabled { opacity: 0.4; cursor: default; }

/* switch */
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; font-size: 14px; color: var(--text); user-select: none; }
.switch .sw-text { display: grid; gap: 1px; }
.switch .sw-text small { color: var(--text-3); font-size: 12px; }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch .track { flex: none; width: 36px; height: 21px; border-radius: 999px; background: var(--border-strong); position: relative; transition: background 0.15s; }
.switch .track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform 0.15s; }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(15px); }
.switch input:focus-visible + .track { box-shadow: 0 0 0 3px var(--accent-ring); }

/* range */
.range { display: flex; align-items: center; gap: 10px; }
.range input[type=range] { flex: 1; accent-color: var(--accent); height: 22px; cursor: pointer; min-width: 0; }
.range .val { min-width: 46px; text-align: right; font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }

/* colour picker */
.swatches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--border-strong); cursor: pointer; padding: 0; }
.swatch.on { box-shadow: 0 0 0 2px var(--accent); }
.swatch.none { background: linear-gradient(135deg, transparent 45%, var(--danger) 45%, var(--danger) 55%, transparent 55%), var(--surface); }
.swatch-custom { position: relative; overflow: hidden; background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red); }
.swatch-custom input { position: absolute; inset: -6px; opacity: 0; cursor: pointer; width: 40px; height: 40px; }

/* number stepper */
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); height: 38px; overflow: hidden; }
.stepper button { width: 32px; height: 100%; border: 0; background: transparent; cursor: pointer; color: var(--text-2); font-size: 16px; }
.stepper button:hover { background: var(--hover); color: var(--text); }
.stepper input { width: 52px; border: 0; background: transparent; text-align: center; height: 100%; font-variant-numeric: tabular-nums; }
.stepper input:focus { outline: none; }

/* ---------- surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
.card-pad { padding: 18px; }
.card-title { font-size: 13px; font-weight: 650; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 12px; }
.stack { display: grid; gap: 16px; }
.stack-sm { display: grid; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.muted { color: var(--text-3); }
.small { font-size: 13px; }
.divider { height: 1px; background: var(--border); margin: 4px 0; }
.badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-3); color: var(--text-2); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }
.badge.danger { background: var(--danger-soft); color: var(--danger); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.callout { display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--border); font-size: 13px; color: var(--text-2); }
.callout.warn { background: var(--warn-soft); border-color: transparent; color: var(--text); }
.callout.danger { background: var(--danger-soft); border-color: transparent; color: var(--text); }
.callout.ok { background: var(--accent-soft); border-color: transparent; color: var(--text); }
.callout .icon-sm { margin-top: 2px; }

/* ---------- home ---------- */
.hero { padding: 54px 0 30px; text-align: center; display: grid; justify-items: center; gap: 14px; }
.hero h1 { font-size: clamp(28px, 4.6vw, 46px); line-height: 1.08; letter-spacing: -0.035em; margin: 0; max-width: 820px; }
.hero h1 .accent { color: var(--accent); }
.hero p { margin: 0; color: var(--text-2); font-size: 17px; max-width: 640px; }
.trust { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; color: var(--text-3); font-size: 13px; }
.trust span { display: inline-flex; align-items: center; gap: 6px; }
.trust .icon-sm { color: var(--accent); }
.search { position: relative; width: 100%; max-width: 520px; margin-top: 6px; }
.search .input { height: 48px; padding-left: 44px; font-size: 15px; border-radius: 999px; box-shadow: var(--shadow-sm); }
.search > .icon { position: absolute; left: 16px; top: 15px; color: var(--text-3); }
.search .kbd { position: absolute; right: 14px; top: 14px; }
.cat { margin-top: 30px; }
.cat h2 { font-size: 14px; font-weight: 650; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.cat h2 i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.toolcard {
  display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: var(--radius-lg);
  background: var(--surface); border: 1px solid var(--border); text-decoration: none; color: var(--text);
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
}
.toolcard:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); transform: translateY(-1px); }
.toolcard .ticon { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; flex: none; color: var(--tc); background: color-mix(in srgb, var(--tc) 13%, transparent); }
.toolcard h3 { font-size: 15px; margin: 1px 0 3px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 7px; }
.toolcard p { font-size: 13px; color: var(--text-2); margin: 0; line-height: 1.4; }
.toolcard .new { font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); }
.empty-search { text-align: center; color: var(--text-3); padding: 40px 0; }
.compare { margin-top: 56px; display: grid; gap: 14px; }
.compare h2 { font-size: 22px; margin: 0; letter-spacing: -0.02em; text-align: center; }
.ctable { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.ctable th, .ctable td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--border); }
.ctable tr:last-child td { border-bottom: 0; }
.ctable th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-3); background: var(--surface-2); }
.ctable td:last-child { color: var(--accent); font-weight: 600; }

/* ---------- tool page ---------- */
.tool-head { display: flex; align-items: center; gap: 14px; padding: 22px 0 18px; }
.tool-head .ticon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; color: var(--tc); background: color-mix(in srgb, var(--tc) 13%, transparent); }
.tool-head h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
.tool-head p { margin: 2px 0 0; color: var(--text-2); font-size: 14px; }
.tool-head .back { margin-right: 2px; }
.workspace { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.workspace.single { grid-template-columns: minmax(0, 1fr); }
.ws-main { min-width: 0; display: grid; gap: 14px; }
.ws-side { position: sticky; top: 74px; display: grid; gap: 14px; max-height: calc(100vh - 90px); overflow: auto; padding-bottom: 4px; }
.ws-side .card { padding: 16px; }
.action-bar { display: grid; gap: 8px; }
.action-bar .summary { font-size: 13px; color: var(--text-3); text-align: center; }

/* dropzone */
.dz {
  display: grid; justify-items: center; gap: 12px; text-align: center; cursor: pointer;
  padding: 56px 24px; border: 2px dashed var(--border-strong); border-radius: var(--radius-lg);
  background: var(--surface); transition: border-color 0.15s, background 0.15s, transform 0.15s;
}
.dz:hover { border-color: var(--accent); }
.dz.over { border-color: var(--accent); background: var(--accent-soft); transform: scale(1.005); }
.dz .dz-icon { width: 62px; height: 62px; border-radius: 18px; display: grid; place-items: center; color: var(--tc, var(--accent)); background: color-mix(in srgb, var(--tc, var(--accent)) 12%, transparent); }
.dz h2 { margin: 0; font-size: 19px; letter-spacing: -0.01em; }
.dz p { margin: 0; color: var(--text-3); font-size: 14px; }
.dz .btn { pointer-events: none; }
.dz.compact { padding: 14px 16px; grid-auto-flow: column; justify-content: center; align-items: center; gap: 10px; border-width: 1.5px; }
.dz.compact .dz-icon { width: 34px; height: 34px; border-radius: 10px; }
.dz.compact h2 { font-size: 14px; font-weight: 600; }
.privacy { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); }
.privacy .icon-sm { color: var(--accent); }

/* file chip */
.filechip { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
.filechip .fc-icon { width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; background: var(--danger-soft); color: var(--danger); flex: none; font: 700 10px/1 var(--font); letter-spacing: 0.03em; }
.filechip .fc-thumb { width: 38px; height: 46px; object-fit: contain; border-radius: 4px; background: #fff; box-shadow: 0 0 0 1px var(--border); flex: none; }
.filechip .fc-main { flex: 1; min-width: 0; }
.filechip .fc-name { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filechip .fc-meta { font-size: 12px; color: var(--text-3); }

/* result card */
.result { display: grid; gap: 14px; padding: 20px; border-radius: var(--radius-lg); background: var(--surface); border: 1px solid var(--border); }
.result .r-head { display: flex; gap: 12px; align-items: center; }
.result .r-ok { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.result h3 { margin: 0; font-size: 16px; }
.result .r-sub { font-size: 13px; color: var(--text-3); }
.result .r-next { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--text-3); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 13px; cursor: pointer; text-decoration: none; }
.chip:hover { border-color: var(--accent); color: var(--accent); }

/* page grids */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 14px; }
.pgrid.dense { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
.pcard { position: relative; display: grid; gap: 7px; justify-items: center; padding: 8px 8px 7px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); user-select: none; -webkit-user-select: none; transition: border-color 0.12s, box-shadow 0.12s, transform 0.12s; }
.pcard:hover { border-color: var(--border-strong); }
.pcard .pthumbw { width: 100%; aspect-ratio: var(--ar, 0.77); display: grid; place-items: center; }
.pcard canvas, .pcard img.pthumb { max-width: 100%; max-height: 100%; background: #fff; box-shadow: var(--page-shadow); border-radius: 2px; display: block; transition: transform 0.2s; pointer-events: none; }
.pcard .pskel { width: 100%; height: 100%; background: var(--surface-3); border-radius: 3px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.55; } }
.pcard .plabel { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; display: flex; gap: 6px; align-items: center; }
.pcard .plabel b { color: var(--text-2); font-weight: 600; }
.pcard.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--accent-soft); }
.pcard.off { opacity: 0.42; }
.pcard.off canvas { filter: grayscale(1); }
.pcard .pcheck { position: absolute; top: 7px; left: 7px; width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--border-strong); background: var(--surface); display: grid; place-items: center; color: transparent; z-index: 2; }
.pcard.sel .pcheck { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.pcard .pops { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; opacity: 0; transition: opacity 0.12s; z-index: 2; }
.pcard:hover .pops, .pcard:focus-within .pops { opacity: 1; }
@media (hover: none) { .pcard .pops { opacity: 1; } }
.pops button { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow-sm); padding: 0; }
.pops button:hover { color: var(--text); border-color: var(--border-strong); }
.pops button.danger:hover { color: var(--danger); border-color: var(--danger); }
.pcard.drag-src { opacity: 0.3; }
.pcard.drop-before::before, .pcard.drop-after::after { content: ''; position: absolute; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: var(--accent); }
.pcard.drop-before::before { left: -9px; }
.pcard.drop-after::after { right: -9px; }
.drag-ghost { position: fixed; z-index: 1000; pointer-events: none; opacity: 0.95; box-shadow: var(--shadow-lg); border-color: var(--accent) !important; }
.pgrid .pcard.clickable { cursor: pointer; }
.pgrid .pcard.draggable { cursor: grab; touch-action: pan-y; }

/* file list (merge / images) */
.flist { display: grid; gap: 10px; }
.fitem { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); user-select: none; }
.fitem .grip { color: var(--text-3); cursor: grab; display: grid; place-items: center; touch-action: none; padding: 4px 0; }
.fitem .fthumb { width: 40px; height: 52px; display: grid; place-items: center; flex: none; }
.fitem .fthumb canvas, .fitem .fthumb img { max-width: 40px; max-height: 52px; background: #fff; box-shadow: var(--page-shadow); border-radius: 2px; object-fit: contain; }
.fitem .fmain { flex: 1; min-width: 0; display: grid; gap: 2px; }
.fitem .fname { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fitem .fmeta { font-size: 12px; color: var(--text-3); }
.fitem .ferr { font-size: 12px; color: var(--danger); }
.fitem .facts { display: flex; gap: 2px; }
.fitem.drag-src { opacity: 0.35; }
.fitem.drop-before { box-shadow: 0 -3px 0 var(--accent); }
.fitem.drop-after { box-shadow: 0 3px 0 var(--accent); }
.fitem .fstrip { grid-column: 1 / -1; }

/* image results */
.igrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.icard { position: relative; display: grid; gap: 8px; padding: 8px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); cursor: pointer; }
.icard.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.icard .iprev { aspect-ratio: 1; display: grid; place-items: center; border-radius: 6px; background: repeating-conic-gradient(var(--checker) 0% 25%, var(--surface) 0% 50%) 0 0 / 14px 14px; overflow: hidden; }
.icard img { max-width: 100%; max-height: 100%; object-fit: contain; }
.icard .iname { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icard .idim { font-size: 11px; color: var(--text-3); }
.icard .pcheck { position: absolute; top: 12px; left: 12px; width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--border-strong); background: var(--surface); display: grid; place-items: center; color: transparent; }
.icard.sel .pcheck { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.icard .isave { position: absolute; top: 12px; right: 12px; }

/* text output */
.textout { width: 100%; min-height: 420px; padding: 16px; border-radius: var(--radius-lg); border: 1px solid var(--border); background: var(--surface); font: 13px/1.6 var(--mono); color: var(--text); resize: vertical; white-space: pre-wrap; }
.textout:focus { outline: none; border-color: var(--accent); }

/* metadata table */
.mtable { width: 100%; border-collapse: collapse; font-size: 13px; }
.mtable td { padding: 8px 10px; border-top: 1px solid var(--border); vertical-align: top; }
.mtable tr:first-child td { border-top: 0; }
.mtable .mkey { color: var(--text-3); width: 34%; font-family: var(--mono); font-size: 12px; }
.mtable .mval { word-break: break-word; }
.mtable .mval.leak { color: var(--danger); }

/* stat tiles */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { padding: 12px 14px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--border); }
.stat .sv { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat .sl { font-size: 12px; color: var(--text-3); }
.stat.good .sv { color: var(--accent); }

/* progress */
.progress { height: 6px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width 0.2s; }
.progress.indet > i { width: 35% !important; animation: indet 1.2s ease-in-out infinite; }
@keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(300%); } }

/* ---------- overlays ---------- */
.toasts { position: fixed; z-index: 3000; bottom: 18px; left: 50%; transform: translateX(-50%); display: grid; gap: 8px; width: min(440px, calc(100vw - 32px)); pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: var(--radius); background: var(--text); color: var(--bg); box-shadow: var(--shadow-lg); font-size: 14px; animation: toastIn 0.22s ease-out; }
.toast.error { background: var(--danger); color: #fff; }
.toast .icon-sm { flex: none; }
.toast .t-msg { flex: 1; }
.toast button { border: 0; background: transparent; color: inherit; opacity: 0.75; cursor: pointer; font-weight: 600; font-size: 13px; padding: 4px 6px; border-radius: 5px; }
.toast button:hover { opacity: 1; }
.toast.out { animation: toastOut 0.18s ease-in forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px) scale(0.98); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(6px); } }

.modal-back { position: fixed; inset: 0; z-index: 2000; background: rgba(8, 10, 14, 0.5); display: grid; place-items: center; padding: 16px; animation: fadeIn 0.15s ease-out; }
@keyframes fadeIn { from { opacity: 0; } }
.modal { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); display: grid; animation: popIn 0.18s ease-out; }
.modal.wide { width: min(880px, 100%); }
@keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(0.98); } }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 0; }
.modal-head h2 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
.modal-body { padding: 16px 18px; display: grid; gap: 14px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 0 18px 18px; flex-wrap: wrap; }
.lightbox-img { max-width: 100%; max-height: 72vh; margin: 0 auto; display: block; background: #fff; box-shadow: var(--page-shadow); }

.menu { position: fixed; z-index: 2500; min-width: 200px; padding: 5px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); display: grid; animation: popIn 0.12s ease-out; }
.menu button { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border: 0; background: transparent; border-radius: 6px; cursor: pointer; font-size: 14px; color: var(--text); text-align: left; white-space: nowrap; }
.menu button:hover { background: var(--hover); }
.menu button .kbd { margin-left: auto; }
.menu button.danger { color: var(--danger); }
.menu .sep { height: 1px; background: var(--border); margin: 4px 2px; }

[data-tip] { position: relative; }
@media (hover: hover) {
  [data-tip]:hover::after {
    content: attr(data-tip); position: absolute; z-index: 60; left: 50%; top: calc(100% + 6px); transform: translateX(-50%);
    padding: 5px 8px; border-radius: 6px; background: var(--text); color: var(--bg); font-size: 12px; font-weight: 500;
    white-space: nowrap; pointer-events: none; animation: fadeIn 0.12s 0.35s both;
  }
  [data-tip-side="right"]:hover::after { left: calc(100% + 8px); top: 50%; transform: translateY(-50%); }
}

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .workspace { grid-template-columns: minmax(0, 1fr); }
  .ws-side { position: static; max-height: none; overflow: visible; }
  .ws-side .action-bar.sticky-m { position: sticky; bottom: 0; z-index: 30; margin: 0 -16px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--border); }
  .topbar-tag { display: none; }
}
@media (max-width: 560px) {
  .hero { padding-top: 34px; }
  .hero p { font-size: 15px; }
  .tgrid { grid-template-columns: 1fr; }
  .pgrid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
  .field-row { grid-template-columns: 1fr; }
  .tool-head h1 { font-size: 19px; }
  .dz { padding: 40px 18px; }
  .search .kbd { display: none; }
}

/* =================== EDITOR =================== */
.ed-root { position: fixed; inset: 0; z-index: 100; display: grid; grid-template-rows: 54px minmax(0, 1fr); background: var(--canvas-bg); color: var(--text); }
.ed-top { display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--surface); border-bottom: 1px solid var(--border); min-width: 0; }
.ed-top .ed-title { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 0 1 auto; }
.ed-top .ed-name { font-weight: 650; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; border: 1px solid transparent; border-radius: 6px; padding: 4px 6px; background: transparent; }
.ed-top .ed-name:hover { border-color: var(--border); }
.ed-top .ed-name:focus { outline: none; border-color: var(--accent); background: var(--surface-2); }
.ed-top .ed-mid { flex: 1; display: flex; justify-content: center; align-items: center; gap: 4px; min-width: 0; }
.ed-top .ed-zoom { display: inline-flex; align-items: center; gap: 2px; background: var(--surface-3); border-radius: 8px; padding: 2px; }
.ed-top .ed-zoom button { height: 30px; min-width: 30px; border: 0; background: transparent; border-radius: 6px; cursor: pointer; color: var(--text-2); display: grid; place-items: center; font-size: 13px; font-variant-numeric: tabular-nums; padding: 0 6px; }
.ed-top .ed-zoom button:hover { background: var(--surface); color: var(--text); }
.ed-top .ed-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }
.ed-top .ed-pageind { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.ed-top .ed-pageind input { width: 42px; height: 28px; text-align: center; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
.ed-body { display: grid; grid-template-columns: 58px 188px minmax(0, 1fr) 268px; min-height: 0; }
.ed-body.no-thumbs { grid-template-columns: 58px 0 minmax(0, 1fr) 268px; }
.ed-body.no-thumbs .ed-thumbs { display: none; }

/* tool rail */
.ed-rail { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: hidden; }
.ed-rail .sep { width: 28px; height: 1px; background: var(--border); margin: 4px 0; flex: none; }
.ed-tool { position: relative; width: 44px; height: 44px; flex: none; border: 0; border-radius: 10px; background: transparent; color: var(--text-2); cursor: pointer; display: grid; place-items: center; transition: background 0.1s, color 0.1s; }
.ed-tool:hover { background: var(--hover); color: var(--text); }
.ed-tool.on { background: var(--accent-soft); color: var(--accent); }
.ed-tool .ed-key { position: absolute; right: 3px; bottom: 2px; font: 600 9px/1 var(--mono); color: var(--text-3); opacity: 0.8; }
.ed-tool.on .ed-key { color: var(--accent); }

/* thumbnails */
.ed-thumbs { background: var(--surface-2); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px 12px 30px; display: grid; gap: 14px; align-content: start; }
.ed-thumb { position: relative; display: grid; gap: 5px; justify-items: center; cursor: pointer; border: 0; background: transparent; padding: 0; color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.ed-thumb .tw { width: 100%; display: grid; place-items: center; padding: 4px; border-radius: 8px; border: 2px solid transparent; }
.ed-thumb canvas { max-width: 100%; background: #fff; box-shadow: var(--page-shadow); display: block; }
.ed-thumb .tskel { width: 100%; aspect-ratio: var(--ar, 0.77); background: var(--surface-3); border-radius: 3px; }
.ed-thumb.cur .tw { border-color: var(--accent); }
.ed-thumb.cur { color: var(--accent); font-weight: 600; }
.ed-thumb .tops { position: absolute; top: 8px; right: 8px; display: none; gap: 3px; }
.ed-thumb:hover .tops { display: flex; }
.ed-thumb .tops span { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); color: var(--text-2); box-shadow: var(--shadow-sm); }
.ed-thumb .tops span:hover { color: var(--text); }
.ed-thumb .tops span.danger:hover { color: var(--danger); border-color: var(--danger); }
.ed-thumb.drop-before .tw { box-shadow: 0 -4px 0 var(--accent); }
.ed-thumb.drop-after .tw { box-shadow: 0 4px 0 var(--accent); }
.ed-addpage { border: 1.5px dashed var(--border-strong); background: transparent; border-radius: 8px; height: 40px; color: var(--text-3); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; }
.ed-addpage:hover { border-color: var(--accent); color: var(--accent); }

/* canvas area */
.ed-scroll { overflow: auto; position: relative; overscroll-behavior: contain; }
.ed-pages { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 26px 24px 120px; min-width: max-content; margin: 0 auto; }
.ed-page { position: relative; background: #fff; box-shadow: var(--page-shadow); flex: none; }
.ed-page canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ed-page .ed-base { pointer-events: none; }
.ed-page .ed-over { touch-action: none; }
.ed-page .ed-plabel { position: absolute; left: 0; top: -19px; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; user-select: none; }
.ed-page .ed-loading { position: absolute; inset: 0; display: grid; place-items: center; color: #9aa0a6; }
.ed-page.cur { box-shadow: var(--page-shadow), 0 0 0 2px var(--accent-ring); }
.ed-page .ed-field { position: absolute; z-index: 3; border: 1px solid rgba(37, 99, 235, 0.45); background: rgba(219, 234, 254, 0.55); color: #111; border-radius: 2px; padding: 0 3px; font: 12px/1.2 Helvetica, Arial, sans-serif; }
.ed-page .ed-field:focus { outline: 2px solid #2563eb; background: rgba(219, 234, 254, 0.85); }
.ed-page textarea.ed-field { resize: none; padding: 2px 3px; }
.ed-page .ed-field[type=checkbox], .ed-page .ed-field[type=radio] { padding: 0; margin: 0; accent-color: #2563eb; }
.ed-page .ed-field.sig { display: grid; place-items: center; cursor: pointer; font-size: 11px; color: #2563eb; }
.ed-txt { position: absolute; z-index: 5; margin: 0; padding: 0; border: 0; outline: 1.5px dashed var(--accent); outline-offset: 2px; background: rgba(255, 255, 255, 0.6); resize: none; overflow: hidden; white-space: pre; line-height: 1.2; min-width: 20px; }
.ed-hint { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 10; background: var(--text); color: var(--bg); font-size: 13px; padding: 7px 12px; border-radius: 999px; box-shadow: var(--shadow-md); pointer-events: none; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }

/* properties panel */
.ed-props { background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 14px 40px; display: grid; gap: 16px; align-content: start; }
.ed-props h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); font-weight: 650; display: flex; align-items: center; justify-content: space-between; }
.ed-props .grp { display: grid; gap: 8px; }
.ed-props .grp > label { font-size: 12px; color: var(--text-2); font-weight: 550; }
.ed-props .btnrow { display: flex; gap: 6px; flex-wrap: wrap; }
.ed-props .tip { font-size: 12px; color: var(--text-3); line-height: 1.45; }
.ed-props .seg > button { padding: 0 8px; }
.ed-props .sigs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ed-props .sigs button { position: relative; height: 54px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; padding: 4px; display: grid; place-items: center; }
.ed-props .sigs button img { max-width: 100%; max-height: 100%; }
.ed-props .sigs button:hover { border-color: var(--accent); }
.ed-props .sigs .x { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); display: none; place-items: center; color: var(--text-3); }
.ed-props .sigs button:hover .x { display: grid; }
.ed-props .stamp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.ed-props .stamp-grid button { height: 40px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); cursor: pointer; display: grid; place-items: center; color: var(--text); font-size: 12px; font-weight: 600; }
.ed-props .stamp-grid button.on, .ed-props .stamp-grid button:hover { border-color: var(--accent); color: var(--accent); }
.ed-results { display: grid; gap: 4px; max-height: 220px; overflow: auto; }
.ed-results button { text-align: left; border: 0; background: var(--surface-2); border-radius: 6px; padding: 6px 8px; font-size: 12px; cursor: pointer; color: var(--text-2); }
.ed-results button:hover { background: var(--hover); color: var(--text); }
.ed-results b { color: var(--text); }

/* signature pad */
.sigpad { width: 100%; aspect-ratio: 3 / 1; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); touch-action: none; cursor: crosshair; display: block; }
.sig-typed { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.sig-typed button { height: 70px; border-radius: 8px; border: 1px solid var(--border); background: #fff; color: #111; cursor: pointer; font-size: 28px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 0 8px; }
.sig-typed button.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-ring); }

/* shortcuts sheet */
.kbgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 18px; font-size: 13px; }
.kbgrid div { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--border); }

/* editor responsive: rail → bottom bar, props → bottom sheet */
@media (max-width: 1100px) {
  .ed-body { grid-template-columns: 58px 0 minmax(0, 1fr) 268px; }
  .ed-body .ed-thumbs { display: none; }
  .ed-body.thumbs-open { grid-template-columns: 58px 160px minmax(0, 1fr) 268px; }
  .ed-body.thumbs-open .ed-thumbs { display: grid; }
}
@media (max-width: 760px) {
  .ed-root { grid-template-rows: 52px minmax(0, 1fr) auto; }

    <script>

// ---- src/pdf/types.js ----
// PDF value model — tagged constructors + predicates.
// dict = Map<string, value>, array = Array<value>, number/bool/null = raw JS.

const name = (v) => ({ k: 'n', v })
const ref = (n, g = 0) => ({ k: 'r', n, g })
const str = (bytes) => ({ k: 's', bytes }) // literal string, raw bytes
const hex = (bytes) => ({ k: 'x', bytes }) // hex string
const stream = (dict, data) => ({ k: 't', dict, data }) // dict: Map

const isName = (v) => v?.k === 'n'
const isRef = (v) => v?.k === 'r'
const isStr = (v) => v?.k === 's'
const isHex = (v) => v?.k === 'x'
const isStream = (v) => v?.k === 't'
const isDict = (v) => v instanceof Map

const te = new TextEncoder()
const td = new TextDecoder('latin1')
const enc = (s) => te.encode(s)
const dec = (b) => td.decode(b)

/** Get dict value by key name (with or without leading slash). */
function get(dict, key) {
  if (!(dict instanceof Map)) return undefined
  return dict.get(key.replace(/^\//, ''))
}

/** Set dict value; returns the dict for chaining. */
function set(dict, key, value) {
  dict.set(key.replace(/^\//, ''), value)
  return dict
}

/** Type check helper: dict entry /Type matches name. */
function typeIs(dict, typeName) {
  const t = get(dict, 'Type')
  return isName(t) && t.v === typeName
}

// ---------- serialization ----------

const NAME_SPECIAL = /[^A-Za-z0-9_+\-.]/
function serName(s) {
  let out = '/'
  for (const ch of s) {
    const c = ch.codePointAt(0)
    out += NAME_SPECIAL.test(ch) ? '#' + c.toString(16).toUpperCase().padStart(2, '0') : ch
  }
  return out
}

function serStr(bytes) {
  const parts = []
  for (const b of bytes) {
    if (b === 0x28 || b === 0x29 || b === 0x5c) parts.push(0x5c, b) // ( ) \
    else parts.push(b)
  }
  const out = new Uint8Array(parts.length + 2)
  out[0] = 0x28
  out.set(parts, 1)
  out[out.length - 1] = 0x29
  return out
}

const toHex = (bytes) => [...bytes].map((b) => b.toString(16).padStart(2, '0')).join('')

function serNum(n) {
  if (Number.isInteger(n)) return String(n)
  let s = n.toFixed(6)
  s = s.replace(/\.?0+$/, '')
  return s === '-0' || s === '' ? '0' : s
}

/** Serialize a value to PDF syntax. Returns Uint8Array[] chunks. */
function serialize(v) {
  if (v === null || v === undefined) return [enc('null')]
  if (typeof v === 'boolean') return [enc(v ? 'true' : 'false')]
  if (typeof v === 'number') return [enc(serNum(v))]
  if (v instanceof Map) {
    const parts = [enc('<<')]
    for (const [k, val] of v) parts.push(enc(' ' + serName(k) + ' '), ...serialize(val))
    parts.push(enc('>>'))
    return parts
  }
  if (Array.isArray(v)) {
    const parts = [enc('[')]
    v.forEach((item, i) => parts.push(enc(i ? ' ' : ''), ...serialize(item)))
    parts.push(enc(']'))
    return parts
  }
  switch (v.k) {
    case 'n': return [enc(serName(v.v))]
    case 'r': return [enc(`${v.n} ${v.g} R`)]
    case 's': return [serStr(v.bytes)]
    case 'x': return [enc('<' + toHex(v.bytes) + '>')]
    case 't': {
      v.dict.set('Length', v.data.length)
      return [...serialize(v.dict), enc('\nstream\n'), v.data, enc('\nendstream')]
    }
    default:
      throw new Error('cannot serialize value: ' + JSON.stringify(v).slice(0, 80))
  }
}

function concat(parts) {
  const total = parts.reduce((n, p) => n + p.length, 0)
  const out = new Uint8Array(total)
  let o = 0
  for (const p of parts) {
    out.set(p, o)
    o += p.length
  }
  return out
}

// ---- src/pdf/env.js ----
// Environment-neutral inflate (FlateDecode). Node → zlib; browser → DecompressionStream.

async function inflate(data) {
  if (typeof process !== 'undefined' && process.versions?.node) {
    const { inflateSync } = await import('node:zlib')
    return new Uint8Array(inflateSync(data))
  }
  const out = await inflateRaw(data, 'deflate').catch(() => inflateRaw(data, 'deflate-raw'))
  if (!out) throw new Error('inflate failed')
  return out
}

async function inflateRaw(data, format) {
  const ds = new DecompressionStream(format)
  const stream = new Blob([data]).stream().pipeThrough(ds)
  return new Uint8Array(await new Response(stream).arrayBuffer())
}

// Environment-neutral deflate (FlateEncode). Node → zlib; browser → CompressionStream.
async function deflate(data) {
  if (typeof process !== 'undefined' && process.versions?.node) {
    const { deflateSync } = await import('node:zlib')
    return new Uint8Array(deflateSync(data))
  }
  const cs = new CompressionStream('deflate')
  const stream = new Blob([data]).stream().pipeThrough(cs)
  return new Uint8Array(await new Response(stream).arrayBuffer())
}

// ---- src/pdf/crypto.js ----
// Zero-dep crypto primitives for the PDF Standard Security Handler.
// md5: RFC 1321. rc4: RC4 stream cipher. Both on Uint8Array.

const S8 = [7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22,
  5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20,
  4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23,
  6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21]
const K32 = []
for (let i = 0; i < 64; i++) K32.push(Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296))

const rotl = (x, n) => ((x << n) | (x >>> (32 - n))) >>> 0

/** MD5 digest of bytes → 16-byte Uint8Array. */
function md5(data) {
  const bitLen = data.length * 8
  const padZeros = (56 - ((data.length + 1) % 64) + 64) % 64
  const padLen = data.length + 1 + padZeros + 8
  const buf = new Uint8Array(padLen)
  buf.set(data)
  buf[data.length] = 0x80
  const dv = new DataView(buf.buffer)
  // 64-bit length little-endian at the tail
  for (let i = 0; i < 8; i++) dv.setUint8(padLen - 8 + i, (bitLen / 2 ** (8 * i)) & 0xff)

  let a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476
  for (let off = 0; off < padLen; off += 64) {
    const M = []
    for (let i = 0; i < 16; i++) M.push(dv.getUint32(off + i * 4, true))
    let [A, B, C, D] = [a0, b0, c0, d0]
    for (let i = 0; i < 64; i++) {
      let F, g
      if (i < 16) { F = (B & C) | (~B & D); g = i }
      else if (i < 32) { F = (D & B) | (~D & C); g = (5 * i + 1) % 16 }
      else if (i < 48) { F = B ^ C ^ D; g = (3 * i + 5) % 16 }
      else { F = C ^ (B | ~D); g = (7 * i) % 16 }
      F = (F + A + K32[i] + M[g]) >>> 0
      A = D; D = C; C = B
      B = (B + rotl(F, S8[i])) >>> 0
    }
    a0 = (a0 + A) >>> 0; b0 = (b0 + B) >>> 0; c0 = (c0 + C) >>> 0; d0 = (d0 + D) >>> 0
  }
  const out = new Uint8Array(16)
  const ov = new DataView(out.buffer)
  ov.setUint32(0, a0, true); ov.setUint32(4, b0, true)
  ov.setUint32(8, c0, true); ov.setUint32(12, d0, true)
  return out
}

/** RC4 keystream applied to data (in-place-safe copy returned). */
function rc4(key, data) {
  const S = new Uint8Array(256)
  for (let i = 0; i < 256; i++) S[i] = i
  let j = 0
  for (let i = 0; i < 256; i++) {
    j = (j + S[i] + key[i % key.length]) & 0xff
    ;[S[i], S[j]] = [S[j], S[i]]
  }
  const out = new Uint8Array(data.length)
  let i = 0
  j = 0
  for (let n = 0; n < data.length; n++) {
    i = (i + 1) & 0xff
    j = (j + S[i]) & 0xff
    ;[S[i], S[j]] = [S[j], S[i]]
    out[n] = data[n] ^ S[(S[i] + S[j]) & 0xff]
  }
  return out
}

// ---------- AES (FIPS-197) — 128/256-bit keys, CBC mode ----------

const SBOX = new Uint8Array(256)
const INV_SBOX = new Uint8Array(256)
const xt = (b) => ((b << 1) ^ (b & 0x80 ? 0x1b : 0)) & 0xff
const gmul = (a, b) => {
  let r = 0
  while (b) { if (b & 1) r ^= a; a = xt(a); b >>= 1 }
  return r
}
{
  // S-box = affine transform of the GF(2^8) multiplicative inverse
  for (let i = 0; i < 256; i++) {
    let inv = 0
    if (i) for (let j = 1; j < 256; j++) if (gmul(i, j) === 1) { inv = j; break }
    let x = inv
    let s = inv
    for (let k = 0; k < 4; k++) { x = ((x << 1) | (x >> 7)) & 0xff; s ^= x }
    SBOX[i] = s ^ 0x63
  }
  for (let i = 0; i < 256; i++) INV_SBOX[SBOX[i]] = i
}

/** Expand a 16/32-byte key → round keys (Uint8Array of 16*(rounds+1)). */
function aesExpand(key) {
  const nk = key.length / 4
  const rounds = nk + 6
  const w = new Uint8Array(16 * (rounds + 1))
  w.set(key)
  let rcon = 1
  for (let i = nk; i < 4 * (rounds + 1); i++) {
    let t = w.slice(4 * (i - 1), 4 * i)
    if (i % nk === 0) {
      t = Uint8Array.of(SBOX[t[1]] ^ rcon, SBOX[t[2]], SBOX[t[3]], SBOX[t[0]])
      rcon = xt(rcon)
    } else if (nk > 6 && i % nk === 4) t = t.map((b) => SBOX[b])
    for (let k = 0; k < 4; k++) w[4 * i + k] = w[4 * (i - nk) + k] ^ t[k]
  }
  return { w, rounds }
}

function aesEncBlock({ w, rounds }, inp, out) {
  const s = inp.slice(0, 16)
  for (let i = 0; i < 16; i++) s[i] ^= w[i]
  for (let r = 1; r <= rounds; r++) {
    for (let i = 0; i < 16; i++) s[i] = SBOX[s[i]]
    // shift rows (column-major state)
    let t = s[1]; s[1] = s[5]; s[5] = s[9]; s[9] = s[13]; s[13] = t
    t = s[2]; s[2] = s[10]; s[10] = t; t = s[6]; s[6] = s[14]; s[14] = t
    t = s[15]; s[15] = s[11]; s[11] = s[7]; s[7] = s[3]; s[3] = t
    if (r !== rounds) {
      for (let c = 0; c < 16; c += 4) {
        const a0 = s[c], a1 = s[c + 1], a2 = s[c + 2], a3 = s[c + 3]
        s[c] = xt(a0) ^ xt(a1) ^ a1 ^ a2 ^ a3
        s[c + 1] = a0 ^ xt(a1) ^ xt(a2) ^ a2 ^ a3
        s[c + 2] = a0 ^ a1 ^ xt(a2) ^ xt(a3) ^ a3
        s[c + 3] = xt(a0) ^ a0 ^ a1 ^ a2 ^ xt(a3)
      }
    }
    for (let i = 0; i < 16; i++) s[i] ^= w[16 * r + i]
  }
  out.set(s)
}

function aesDecBlock({ w, rounds }, inp, out) {
  const s = inp.slice(0, 16)

    let t = s[13]; s[13] = s[9]; s[9] = s[5]; s[5] = s[1]; s[1] = t
    t = s[2]; s[2] = s[10]; s[10] = t; t = s[6]; s[6] = s[14]; s[14] = t
    t = s[3]; s[3] = s[7]; s[7] = s[11]; s[11] = s[15]; s[15] = t
    for (let i = 0; i < 16; i++) s[i] = INV_SBOX[s[i]]
    for (let i = 0; i < 16; i++) s[i] ^= w[16 * r + i]
    if (r !== 0) {
      for (let c = 0; c < 16; c += 4) {
        const a0 = s[c], a1 = s[c + 1], a2 = s[c + 2], a3 = s[c + 3]
        s[c] = gmul(a0, 14) ^ gmul(a1, 11) ^ gmul(a2, 13) ^ gmul(a3, 9)
        s[c + 1] = gmul(a0, 9) ^ gmul(a1, 14) ^ gmul(a2, 11) ^ gmul(a3, 13)
        s[c + 2] = gmul(a0, 13) ^ gmul(a1, 9) ^ gmul(a2, 14) ^ gmul(a3, 11)
        s[c + 3] = gmul(a0, 11) ^ gmul(a1, 13) ^ gmul(a2, 9) ^ gmul(a3, 14)

/** AES-CBC encrypt. pad=true adds PKCS#5 padding; otherwise data must be ×16. */
function aesCbcEncrypt(key, iv, data, pad = true) {

  const buf = new Uint8Array(data.length + n)
  buf.set(data)
  buf.fill(n, data.length)
  if (buf.length % 16) throw new Error('aes: data not block-aligned')
  const out = new Uint8Array(buf.length)
  let prev = iv
  const blk = new Uint8Array(16)
  for (let o = 0; o < buf.length; o += 16) {
    for (let i = 0; i < 16; i++) blk[i] = buf[o + i] ^ prev[i]
    aesEncBlock(ks, blk, out.subarray(o, o + 16))
    prev = out.subarray(o, o + 16)
  }
  return out
}

/** AES-CBC decrypt. unpad strips PKCS#5 padding when valid (lenient when not). */
function aesCbcDecrypt(key, iv, data, unpad = true) {
  const ks = aesExpand(key)
  const len = data.length - (data.length % 16)
  const out = new Uint8Array(len)
  let prev = iv
  const blk = new Uint8Array(16)
  for (let o = 0; o < len; o += 16) {
    aesDecBlock(ks, data.subarray(o, o + 16), blk)
    for (let i = 0; i < 16; i++) out[o + i] = blk[i] ^ prev[i]
    prev = data.subarray(o, o + 16)
  }
  if (!unpad || !len) return out
  const p = out[len - 1]
  if (p >= 1 && p <= 16 && out.subarray(len - p).every((b) => b === p)) return out.slice(0, len - p)
  return out
}

  buf.set(data)
  buf[data.length] = 0x80
  const bits = data.length * 8
  const dv = new DataView(buf.buffer)
  dv.setUint32(total - 4, bits >>> 0)
  dv.setUint32(total - 8, Math.floor(bits / 2 ** 32))

  const rr = (x, n) => (x >>> n) | (x << (32 - n))
  for (let o = 0; o < buf.length; o += 64) {
    for (let i = 0; i < 16; i++) W[i] = dv.getUint32(o + 4 * i)
    for (let i = 16; i < 64; i++) {
      const s0 = rr(W[i - 15], 7) ^ rr(W[i - 15], 18) ^ (W[i - 15] >>> 3)
      const s1 = rr(W[i - 2], 17) ^ rr(W[i - 2], 19) ^ (W[i - 2] >>> 10)
      W[i] = (W[i - 16] + s0 + W[i - 7] + s1) >>> 0

    let [a, b, c, d, e, f, g, h] = H
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g)) + K256[i] + W[i]) >>> 0

  const out = new Uint8Array(32)
  const ov = new DataView(out.buffer)
  H.forEach((v, i) => ov.setUint32(4 * i, v))
  return out

// Stream filter decoders — everything a PDF can wrap a stream in, except the
// image codecs (DCT/JPX/JBIG2/CCITT), which callers handle or skip.

/** ASCII85Decode — 4 bytes per 5 chars, 'z' = four zero bytes, '~>' ends. */
function ascii85(data) {
  const out = []
  let tuple = 0
  let n = 0
  for (let i = 0; i < data.length; i++) {
    const c = data[i]
    if (c === 0x7e) break // '~>' EOD
    if (c <= 0x20) continue // whitespace
    if (c === 0x7a && n === 0) { out.push(0, 0, 0, 0); continue } // 'z'
    if (c < 0x21 || c > 0x75) throw new Error('bad ASCII85 data')
    tuple = tuple * 85 + (c - 0x21)
    if (++n === 5) {
      out.push((tuple >>> 24) & 255, (tuple >>> 16) & 255, (tuple >>> 8) & 255, tuple & 255)
      tuple = 0
      n = 0
    }
  }
  if (n > 1) { // partial group: pad with 'u', keep n-1 bytes
    for (let k = n; k < 5; k++) tuple = tuple * 85 + 84
    const b = [(tuple >>> 24) & 255, (tuple >>> 16) & 255, (tuple >>> 8) & 255, tuple & 255]
    out.push(...b.slice(0, n - 1))
  }
  return new Uint8Array(out)
}

/** ASCIIHexDecode — hex pairs, whitespace ignored, '>' ends, odd tail pads 0. */
function asciiHex(data) {
  const out = []
  let hi = -1
  for (let i = 0; i < data.length; i++) {
    const c = data[i]
    if (c === 0x3e) break
    const v = c >= 0x30 && c <= 0x39 ? c - 0x30 : c >= 0x41 && c <= 0x46 ? c - 55 : c >= 0x61 && c <= 0x66 ? c - 87 : -1
    if (v < 0) continue
    if (hi < 0) hi = v
    else { out.push(hi * 16 + v); hi = -1 }
  }
  if (hi >= 0) out.push(hi * 16)
  return new Uint8Array(out)
}

/** RunLengthDecode — len byte 0-127 copies len+1 literals, 129-255 repeats next byte 257-len times. */
function runLength(data) {
  const out = []
  for (let i = 0; i < data.length;) {
    const len = data[i++]
    if (len === 128) break
    if (len < 128) { for (let k = 0; k <= len && i < data.length; k++) out.push(data[i++]) }
    else { const b = data[i++]; for (let k = 0; k < 257 - len; k++) out.push(b) }
  }
  return new Uint8Array(out)
}

/** LZWDecode — 9..12-bit codes, 256 clear, 257 EOD; earlyChange per spec default 1. */
function lzw(data, earlyChange = 1) {
  const out = []
  let dict = []
  const reset = () => {
    dict = []
    for (let i = 0; i < 256; i++) dict.push([i])
    dict.push(null, null) // 256 clear, 257 eod
  }
  reset()
  let bits = 9
  let buf = 0
  let nbuf = 0
  let prev = null
  for (let i = 0; i < data.length; i++) {
    buf = (buf << 8) | data[i]
    nbuf += 8
    while (nbuf >= bits) {
      const code = (buf >>> (nbuf - bits)) & ((1 << bits) - 1)
      nbuf -= bits
      buf &= (1 << nbuf) - 1
      if (code === 256) { reset(); bits = 9; prev = null; continue }
      if (code === 257) return new Uint8Array(out)
      let entry
      if (code < dict.length && dict[code]) entry = dict[code]
      else if (prev && code === dict.length) entry = [...prev, prev[0]]
      else throw new Error('bad LZW code')
      for (const b of entry) out.push(b)
      if (prev) dict.push([...prev, entry[0]])
      prev = entry
      if (dict.length + earlyChange >= 1 << bits && bits < 12) bits++
    }
  }
  return new Uint8Array(out)
}

/** Undo PNG/TIFF predictors (DecodeParms /Predictor). */
function unPredict(data, { predictor = 1, columns = 1, colors = 1, bpc = 8 }) {
  if (predictor === 1) return data
  const bpp = Math.max(1, Math.ceil((colors * bpc) / 8))
  const rowBytes = Math.ceil((columns * colors * bpc) / 8)
  if (predictor === 2) {
    const out = new Uint8Array(data.length)
    for (let y = 0; y * rowBytes < data.length; y++) {
      const row = y * rowBytes
      for (let x = 0; x < rowBytes; x++) {
        const left = x >= bpp ? out[row + x - bpp] : 0
        out[row + x] = (data[row + x] + left) & 0xff
      }
    }
    return out
  }
  if (predictor < 10 || predictor > 15) throw new Error(`unsupported predictor ${predictor}`)
  const rowStride = rowBytes + 1
  const rows = Math.floor(data.length / rowStride)
  const out = new Uint8Array(rows * rowBytes)
  const paeth = (a, b, c) => {
    const p = a + b - c
    const pa = Math.abs(p - a), pb = Math.abs(p - b), pc = Math.abs(p - c)
    return pa <= pb && pa <= pc ? a : pb <= pc ? b : c
  }
  for (let y = 0; y < rows; y++) {
    const src = y * rowStride + 1
    const f = data[y * rowStride]
    const prev = y > 0 ? (y - 1) * rowBytes : -1
    for (let x = 0; x < rowBytes; x++) {
      const a = x >= bpp ? out[y * rowBytes + x - bpp] : 0
      const b = prev >= 0 ? out[prev + x] : 0
      const c = x >= bpp && prev >= 0 ? out[prev + x - bpp] : 0
      let v = data[src + x]
      if (f === 1) v += a
      else if (f === 2) v += b
      else if (f === 3) v += (a + b) >> 1
      else if (f === 4) v += paeth(a, b, c)
      out[y * rowBytes + x] = v & 0xff
    }
  }
  return out
}

const FILTER_ALIAS = { AHx: 'ASCIIHexDecode', A85: 'ASCII85Decode', LZW: 'LZWDecode', Fl: 'FlateDecode', RL: 'RunLengthDecode', DCT: 'DCTDecode', CCF: 'CCITTFaxDecode' }
const IMAGE_CODECS = new Set(['DCTDecode', 'JPXDecode', 'JBIG2Decode', 'CCITTFaxDecode'])

/** Normalised [{name, parms: Map|null}] chain for a stream dict. */
function filterChain(dict) {
  const g = (k) => (dict instanceof Map ? dict.get(k) : undefined)
  const f = g('Filter') ?? g('F')
  const p = g('DecodeParms') ?? g('DP')
  const names = Array.isArray(f) ? f : f ? [f] : []
  const parms = Array.isArray(p) ? p : [p]
  return names.map((n, i) => {
    const nm = n?.k === 'n' ? n.v : null
    return { name: FILTER_ALIAS[nm] ?? nm, parms: parms[i] instanceof Map ? parms[i] : null }
  })
}

const predictParms = (parms) => {
  if (!parms) return null
  const pr = parms.get('Predictor') ?? 1
  if (pr === 1) return null
  return {
    predictor: pr,
    columns: parms.get('Columns') ?? 1,
    colors: parms.get('Colors') ?? 1,
    bpc: parms.get('BitsPerComponent') ?? 8,
  }
}

/** Apply one non-image filter. */
async function applyFilter(name, parms, d) {
  if (name === 'FlateDecode') {
    d = await inflate(d)
  } else if (name === 'LZWDecode') {
    d = lzw(d, parms?.get('EarlyChange') ?? 1)
  } else if (name === 'ASCII85Decode') return ascii85(d)
  else if (name === 'ASCIIHexDecode') return asciiHex(d)
  else if (name === 'RunLengthDecode') return runLength(d)
  else if (name === 'Crypt') return d // Identity crypt filter
  else throw new Error(`unsupported filter ${name}`)
  const pp = predictParms(parms)
  return pp ? unPredict(d, pp) : d
}

/**
 * Decode a stream's data through its filter chain.
 * stopAtImage: stop (without error) at a trailing image codec and report it.
 * Returns {data, codec, parms} — codec null when fully decoded.
 */
async function decodeChain(dict, data, { stopAtImage = false } = {}) {
  const chain = filterChain(dict)
  let d = data
  for (let i = 0; i < chain.length; i++) {
    const { name, parms } = chain[i]
    if (IMAGE_CODECS.has(name)) {
      if (stopAtImage) return { data: d, codec: name, parms }
      throw new Error(`image codec ${name}`)
    }
    d = await applyFilter(name, parms, d)
  }
  return { data: d, codec: null, parms: null }
}

const WS = new Set([0x00, 0x09, 0x0a, 0x0c, 0x0d, 0x20])
const DELIM = new Set([0x28, 0x29, 0x3c, 0x3e, 0x5b, 0x5d, 0x7b, 0x7d, 0x2f, 0x25])
const isWs = (b) => WS.has(b)
const isDelim = (b) => isWs(b) || DELIM.has(b)
const isDigit = (b) => b >= 0x30 && b <= 0x39

function skipWs(buf, i) {
  while (i < buf.length) {
    if (isWs(buf[i])) i++
    else if (buf[i] === 0x25) {
      while (i < buf.length && buf[i] !== 0x0a && buf[i] !== 0x0d) i++ // % comment → EOL
    } else break
  }
  return i
}

function matchKeyword(buf, i, kw) {
  for (let j = 0; j < kw.length; j++) if (buf[i + j] !== kw.charCodeAt(j)) return false
  return true
}

/** Parse one PDF value at buf[i]. Returns [value, nextIndex]. */
function parseValue(buf, i, allowStream = false) {
  i = skipWs(buf, i)
  const b = buf[i]

  if (b === 0x3c) {
    // << dict >> or <hex>
    if (buf[i + 1] === 0x3c) {
      const dict = new Map()
      i += 2
      while (true) {
        i = skipWs(buf, i)
        if (buf[i] === 0x3e && buf[i + 1] === 0x3e) {
          i += 2
          break
        }
        if (buf[i] !== 0x2f) throw new Error(`dict: expected /key @${i}`)
        let keyEnd = i + 1
        while (keyEnd < buf.length && !isDelim(buf[keyEnd])) keyEnd++
        const key = decodeName(buf, i + 1, keyEnd)
        const [val, next] = parseValue(buf, keyEnd)
        dict.set(key, val)
        i = next
      }
      // top-level only: stream data may follow a dict
      if (allowStream) {
        const j = skipWs(buf, i)
        if (matchKeyword(buf, j, 'stream') && isDelim(buf[j + 6])) {
          let d = j + 6
          if (buf[d] === 0x0d && buf[d + 1] === 0x0a) d += 2
          else if (buf[d] === 0x0d || buf[d] === 0x0a) d += 1
          const len = get(dict, 'Length')
          let data
          if (typeof len === 'number' && len >= 0 && d + len <= buf.length) {
            data = buf.slice(d, d + len)
            i = d + len
            const e = skipWs(buf, i)
            if (matchKeyword(buf, e, 'endstream')) i = e + 9
          } else {
            const { end, at } = findMarker(buf, d, 'endstream')
            data = buf.slice(d, end)
            i = at + 9
          }
          return [stream(dict, data), i]
        }
      }
      return [dict, i]
    }
    // hex string
    let j = i + 1
    const nib = []
    while (j < buf.length && buf[j] !== 0x3e) {
      const c = buf[j]
      if (!isWs(c)) nib.push(c)
      j++
    }
    if (nib.length % 2) nib.push(0x30)
    const out = new Uint8Array(nib.length / 2)
    for (let k = 0; k < out.length; k++)
      out[k] = parseInt(String.fromCharCode(nib[2 * k], nib[2 * k + 1]), 16)
    return [hex(out), j + 1]
  }

  if (b === 0x5b) {
    const arr = []
    i++
    while (true) {
      i = skipWs(buf, i)
      if (buf[i] === 0x5d) return [arr, i + 1]
      const [v, next] = parseValue(buf, i)
      arr.push(v)
      i = next
    }
  }

  if (b === 0x2f) {
    let j = i + 1
    while (j < buf.length && !isDelim(buf[j])) j++
    return [name(decodeName(buf, i + 1, j)), j]
  }

  if (b === 0x28) {
    // literal string — escapes + balanced parens
    const out = []
    let j = i + 1
    let depth = 1
    while (j < buf.length && depth > 0) {
      const c = buf[j]
      if (c === 0x5c) {
        const e = buf[j + 1]
        j += 2
        switch (e) {
          case 0x6e: out.push(0x0a); break
          case 0x72: out.push(0x0d); break
          case 0x74: out.push(0x09); break
          case 0x62: out.push(0x08); break
          case 0x66: out.push(0x0c); break
          case 0x28: case 0x29: case 0x5c: out.push(e); break
          case 0x0d: if (buf[j] === 0x0a) j++; break
          case 0x0a: break
          default:
            if (isDigit(e)) {
              let oct = e - 0x30, cnt = 1
              while (cnt < 3 && isDigit(buf[j])) { oct = oct * 8 + (buf[j] - 0x30); j++; cnt++ }
              out.push(oct & 0xff)
            } else if (e !== undefined) out.push(e)
        }
      } else if (c === 0x28) { depth++; out.push(c); j++ }
      else if (c === 0x29) { if (--depth > 0) out.push(c); j++ }
      else { out.push(c); j++ }
    }
    return [str(new Uint8Array(out)), j]
  }

  // number / ref / keyword
  const start = i
  let j = i
  if (buf[j] === 0x2b || buf[j] === 0x2d) j++
  let sawDot = false
  while (j < buf.length && (isDigit(buf[j]) || (buf[j] === 0x2e && !sawDot))) {
    if (buf[j] === 0x2e) sawDot = true
    j++
  }
  if (j > start && (isDigit(buf[j - 1]) || isDigit(buf[start]))) {
    const numStr = dec(buf.slice(start, j))
    const num = parseFloat(numStr)
    if (Number.isInteger(num) && !numStr.includes('.')) {
      // maybe "n g R"
      let k = skipWs(buf, j)
      const s2 = k
      while (k < buf.length && isDigit(buf[k])) k++
      if (k > s2) {
        const g = parseInt(dec(buf.slice(s2, k)), 10)
        const k2 = skipWs(buf, k)
        if (buf[k2] === 0x52 && isDelim(buf[k2 + 1])) return [ref(num, g), k2 + 1]
      }
    }
    return [num, j]
  }

  // keyword
  let k = i
  while (k < buf.length && !isDelim(buf[k])) k++
  const word = dec(buf.slice(i, k))
  if (word === 'true') return [true, k]
  if (word === 'false') return [false, k]
  if (word === 'null') return [null, k]
  throw new Error(`unexpected token "${word}" @${i}`)
}

function decodeName(buf, i, j) {
  let s = ''
  while (i < j) {
    if (buf[i] === 0x23 && i + 2 < j) {
      // #XX
      const hv = parseInt(dec(buf.slice(i + 1, i + 3)), 16)
      if (!Number.isNaN(hv)) { s += String.fromCharCode(hv); i += 3; continue }
    }
    s += String.fromCharCode(buf[i++])
  }
  return s
}

function findMarker(buf, from, marker) {
  const m = marker
  outer: for (let i = from; i <= buf.length - m.length; i++) {
    for (let j = 0; j < m.length; j++) if (buf[i + j] !== m.charCodeAt(j)) continue outer
    // strip the EOL that precedes the marker (not part of stream data)
    let end = i
    if (buf[end - 1] === 0x0a) end--
    if (buf[end - 1] === 0x0d) end--
    return { end, at: i }
  }
  return { end: buf.length, at: buf.length }
}

const OBJ_RE = /(\d+)\s+(\d+)\s+obj\b/g

/**
 * Parse a PDF by scanning for indirect objects — ignores xref tables entirely,
 * so linearized / damaged / xref-stream files all parse the same.
 */
async function parsePdf(bytes, warnings = [], allowEncrypted = false) {
  const text = dec(bytes)
  const objects = new Map()

  for (const m of text.matchAll(OBJ_RE)) {
    const n = +m[1]
    const g = +m[2]
    const start = m.index + m[0].length
    try {
      const [v, next] = parseValue(bytes, start, true)
      const e = skipWs(bytes, next)
      if (!matchKeyword(bytes, e, 'endobj')) continue // not a real object boundary
      objects.set(`${n} ${g}`, { n, g, v })
    } catch {
      // false-positive match inside stream data — skip
    }
  }

  // objects hidden inside /ObjStm compressed streams
  for (const { v } of objects.values()) {
    if (!isStream(v) || !typeIs(v.dict, 'ObjStm')) continue
    const N = get(v.dict, 'N')
    const first = get(v.dict, 'First')
    if (typeof N !== 'number' || typeof first !== 'number') continue
    try {
      const { data } = await decodeChain(v.dict, v.data)
      const headerEnd = first
      const header = dec(data.slice(0, headerEnd)).trim().split(/\s+/).map(Number)
      for (let i = 0; i < N; i++) {
        const num = header[i * 2]
        const off = header[i * 2 + 1]
        try {
          const [v2] = parseValue(data, first + off)
          if (!objects.has(`${num} 0`)) objects.set(`${num} 0`, { n: num, g: 0, v: v2 })
        } catch { warnings.push(`ObjStm: bad object ${num}`) }
      }
    } catch { warnings.push('ObjStm: inflate failed — document may be incomplete') }
  }

  // trailer: classic `trailer` dict, or an /XRef stream dict
  let trailer = null
  const tIdx = text.lastIndexOf('trailer')
  if (tIdx !== -1) {
    try { const [t] = parseValue(bytes, skipWs(bytes, tIdx + 7)); trailer = t } catch { /* fall through */ }
  }
  if (!(trailer instanceof Map)) {
    for (const { v } of objects.values()) {
      const dict = isStream(v) ? v.dict : v
      if (typeIs(dict, 'XRef')) { trailer = dict; break }
    }
  }
  if (!(trailer instanceof Map)) {
    // last resort: synthesize a trailer pointing at the catalog
    for (const { n, g, v } of objects.values()) {
      const dict = isStream(v) ? v.dict : v
      if (typeIs(dict, 'Catalog')) {
        trailer = new Map([['Root', ref(n, g)]])
        break
      }
    }
  }
  if (!trailer) throw new Error('not a PDF (no trailer/catalog found)')
  if (get(trailer, 'Encrypt') && !allowEncrypted)
    throw new Error('this PDF is password-protected — unlock it in the Protect tool first')

  return { objects, trailer, warnings, encrypted: !!get(trailer, 'Encrypt') }
}

/** Resolve a value: refs are dereferenced, everything else returned as-is. */
function deref(doc, v) {
  if (v?.k === 'r') return doc.objects.get(`${v.n} ${v.g}`)?.v
  return v
}

// ---- src/pdf/write.js ----

/** A document under construction: numbered objects + allocator. */
function newDoc() {
  return {
    objects: new Map(), // num → value
    _next: 1,
    alloc() {
      return this._next++
    },
    set(num, v) {
      this.objects.set(num, v)
    },
  }
}

/** Serialize a built doc to PDF bytes: header, objects, classic xref, trailer.
 *  trailerExtra: Map merged into the trailer dict (/Encrypt, /ID, ...). */
function writeDoc(doc, rootNum, trailerExtra) {
  const parts = [enc('%PDF-1.7\n%\xe2\xe3\xcf\xd3\n')]
  const offsets = new Map()
  let pos = parts[0].length // running byte offset (re-summing parts per object was O(n²))

  const nums = [...doc.objects.keys()].sort((a, b) => a - b)
  for (const n of nums) {
    offsets.set(n, pos)
    for (const p of [enc(`${n} 0 obj\n`), ...serialize(doc.objects.get(n)), enc('\nendobj\n')]) {
      parts.push(p)
      pos += p.length
    }
  }

  const xrefAt = pos
  const count = nums.length ? nums[nums.length - 1] + 1 : 1
  let xref = 'xref\n0 ' + count + '\n0000000000 65535 f \r\n'
  for (let n = 1; n < count; n++) {
    const off = offsets.get(n)
    xref += off === undefined ? '0000000000 65535 f \r\n' : String(off).padStart(10, '0') + ' 00000 n \r\n'
  }
  const trailer = new Map([
    ['Size', count],
    ['Root', ref(rootNum, 0)],
  ])
  if (trailerExtra instanceof Map) for (const [k, v] of trailerExtra) trailer.set(k, v)
  parts.push(
    enc(xref),
    enc('trailer\n'),
    ...serialize(trailer),
    enc(`\nstartxref\n${xrefAt}\n%%EOF\n`),
  )
  return concat(parts)
}
