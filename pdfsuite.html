<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Merge, split, organize and convert PDFs — free, open source, zero dependencies, 100% client-side. Your files never leave your browser." />
    <style>
:root {
  color-scheme: dark;
  --bg: #09090b;
  --card: #131316;
  --border: #27272a;
  --text: #f4f4f5;
  --dim: #a1a1aa;
  --faint: #71717b;
  --accent: #34d399;
  --accent-hover: #6ee7b7;
  --danger: #f87171;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
::selection { background: rgba(52, 211, 153, 0.3); }

#app { max-width: 960px; margin: 0 auto; padding: 0 16px 64px; min-height: 100vh; display: flex; flex-direction: column; }

/* header */
header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--border); }
.brand { text-decoration: none; color: var(--text); display: flex; align-items: baseline; gap: 10px; }
.brand b { font-size: 20px; letter-spacing: -0.02em; font-weight: 700; }
.accent { color: var(--accent); }
.tagline { font-size: 12px; color: var(--faint); }
.gh { color: var(--dim); }
.gh:hover { color: var(--text); }
.icon { width: 20px; height: 20px; }
.icon-lg { width: 28px; height: 28px; }
.icon-sm { width: 14px; height: 14px; }
.dim { color: var(--faint); }

/* home */
main { padding-top: 36px; }
h1 { font-size: 30px; line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 10px; max-width: 640px; }
.sub { color: var(--dim); display: flex; align-items: center; gap: 8px; margin: 0 0 30px; font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.toolcard {
  display: block; padding: 20px; border: 1px solid var(--border); border-radius: 12px;
  background: var(--card); text-decoration: none; color: var(--text); transition: border-color 0.15s;
}
.toolcard:hover { border-color: var(--accent); }
.toolcard h2 { font-size: 16px; margin: 12px 0 4px; }
.toolcard p { font-size: 13px; color: var(--dim); margin: 0; }

/* tool view */
.back { color: var(--dim); font-size: 13px; text-decoration: none; }
.back:hover { color: var(--text); }
main h1 { font-size: 24px; margin-top: 14px; }
.tool { display: flex; flex-direction: column; gap: 14px; }

/* dropzone */
.dropzone {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 36px; border: 2px dashed var(--border); border-radius: 12px;
  background: rgba(19, 19, 22, 0.5); color: var(--dim); cursor: pointer; transition: all 0.15s;
  text-align: center;
}
.dropzone:hover { border-color: var(--faint); }
.dropzone:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dropzone.over { border-color: var(--accent); background: rgba(52, 211, 153, 0.08); }
.dz-text em { color: var(--accent); font-style: normal; }
.hidden-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* cards + lists */
.card { border: 1px solid var(--border); border-radius: 12px; background: var(--card); padding: 14px 16px; }
.filelist { list-style: none; margin: 0; padding: 0; }
.filelist li { display: flex; align-items: center; gap: 8px; padding: 7px 4px; border-bottom: 1px solid var(--border); }
.filelist li:last-child { border-bottom: 0; }
.idx { width: 20px; text-align: center; color: var(--faint); font-size: 12px; }
.fname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.fsize { color: var(--faint); font-size: 12px; }
.iconbtn { background: none; border: 0; color: var(--dim); padding: 4px; border-radius: 6px; cursor: pointer; }
.iconbtn:hover { background: #2e2e33; color: var(--text); }
.iconbtn:disabled { opacity: 0.3; cursor: default; }

/* inputs */
.lbl { display: block; font-size: 12px; color: var(--faint); margin-bottom: 4px; }
.textin {
  width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); font: inherit; outline: none; margin-bottom: 10px;
}
.textin:focus { border-color: var(--accent); }
.radio-row { display: flex; gap: 18px; font-size: 14px; }
.radio { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.meta { color: var(--dim); font-size: 14px; margin: 0; }
.meta b { color: var(--text); }

/* buttons */
.btn {
  align-self: flex-start; padding: 10px 18px; border: 0; border-radius: 10px;
  background: var(--accent); color: #052e22; font-weight: 600; font-size: 14px; cursor: pointer;
}
.btn:hover { background: var(--accent-hover); }
.btn:disabled { opacity: 0.4; cursor: default; }
.error { color: var(--danger); font-size: 14px; margin: 0; }

/* page grids (organize + split picker) — cards proportioned to real MediaBox */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.pcard {
  position: relative; display: flex; flex-direction: column;
  border: 1px solid var(--border); border-radius: 10px; background: var(--card);
  padding: 8px; text-align: center; cursor: grab; transition: all 0.12s; user-select: none;
  touch-action: none; -webkit-touch-callout: none;
  max-height: 220px;
}
.pbody { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; }
.pcard.target { border-color: var(--accent); transform: scale(1.03); }
.pcard.deleted { opacity: 0.35; }
.pnum { font-size: 15px; font-weight: 600; }
.pdim { font-size: 11px; color: var(--faint); margin-top: 2px; }
.prot { font-size: 11px; color: var(--accent); margin-top: 2px; }
.pthumb { flex: 1; width: 100%; min-height: 0; object-fit: cover; border-radius: 6px; pointer-events: none; }
.ptext {
  flex: 1; min-height: 0; overflow: hidden; padding: 3px;
  font-size: 6.5px; line-height: 1.5; color: var(--faint); text-align: left;
  word-break: break-word; user-select: none;
}
.pops { display: flex; justify-content: center; gap: 4px; margin-top: 6px; opacity: 0; transition: opacity 0.15s; }
.pcard:hover .pops, .pcard.deleted .pops { opacity: 1; }

/* selectable cards (split) */
.pcard.pick { cursor: pointer; touch-action: pan-y; } /* picker has no drag — keep native scroll */
.pcard.pick:hover { border-color: var(--faint); }
.pcard.sel { border-color: var(--accent); background: rgba(52, 211, 153, 0.07); }
.pchk {
  position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border); color: transparent; background: var(--bg);
}
.pcard.sel .pchk { background: var(--accent); border-color: var(--accent); color: #052e22; }

/* toolbar */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.tbtn {
  padding: 5px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
  color: var(--dim); font-size: 12px; cursor: pointer;
}
.tbtn:hover { color: var(--text); border-color: var(--faint); }
.tbtn:disabled { opacity: 0.35; cursor: default; }

/* file list extras */
.filelist li { cursor: grab; touch-action: none; -webkit-touch-callout: none; user-select: none; }
.filelist li.target { background: rgba(52, 211, 153, 0.08); border-radius: 6px; }
.fmeta { color: var(--faint); font-size: 11px; margin-left: 8px; }
.ferr { color: var(--danger); font-size: 12px; }
.filelist.thumbs li { gap: 12px; }
.thumb { width: 34px; height: 34px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }

/* extracted image grid */
.igrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.icard { border: 1px solid var(--border); border-radius: 10px; background: var(--card); padding: 8px; position: relative; }
.icard img { width: 100%; max-height: 140px; object-fit: contain; border-radius: 6px; background: repeating-conic-gradient(#1a1a1e 0% 25%, #131316 0% 50%) 0 0 / 16px 16px; }
.imeta { display: flex; flex-direction: column; margin-top: 6px; }
.iname { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.idim { font-size: 11px; color: var(--faint); }
.isave {
  position: absolute; top: 12px; right: 12px; border: 1px solid var(--border); border-radius: 8px;
  background: rgba(9, 9, 11, 0.85); color: var(--dim); padding: 5px; cursor: pointer; opacity: 0; transition: opacity 0.15s;
}
.icard:hover .isave { opacity: 1; }
.isave:hover { color: var(--accent); border-color: var(--accent); }

/* metadata table (scrub) */
.mtable { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
.mtable td { padding: 5px 8px; border-top: 1px solid var(--border); vertical-align: top; }
.mtable tr:first-child td { border-top: 0; }
.mkey { color: var(--faint); width: 130px; font-family: ui-monospace, monospace; font-size: 12px; }
.mval { color: var(--danger); word-break: break-all; }

/* option rows (pagenum) */
.optrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 10px 0; align-items: end; }
.textin.sel, .textin.num { margin-bottom: 0; }
.optrow .lbl { margin-bottom: 4px; }
.slider { width: 100%; accent-color: var(--accent); }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }

/* rendered canvas thumbnails */
.pcanvas { flex: 1; width: 100%; min-height: 0; object-fit: contain; border-radius: 6px; background: #fff; pointer-events: none; }
.pcanvas-sm { width: 100%; height: auto; border-radius: 4px; background: #fff; display: block; }

/* pointer drag — ghost + source slot + swap target */
.drag-ghost { position: fixed; pointer-events: none; z-index: 1000; opacity: 0.92; transform: scale(1.04); box-shadow: 0 12px 32px rgba(0,0,0,.55); border-color: var(--accent) !important; margin: 0; }
.drag-ghost > * { border-color: var(--accent) !important; margin: 0; }
.pcard.drag-src { opacity: 0.35; outline: 2px dashed var(--accent); outline-offset: -2px; }
.pcard.swap-target { outline: 2px solid var(--accent); outline-offset: -2px; transform: scale(1.03); }
.filelist li.drag-src { opacity: 0.4; }

/* zoom button on selectable cards */
.pzoom {
  position: absolute; top: 6px; left: 6px; width: 24px; height: 24px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border); background: rgba(9,9,11,0.8); color: var(--dim);
  cursor: zoom-in; opacity: 0; transition: opacity 0.15s; padding: 0;
}
.pcard:hover .pzoom { opacity: 1; }
.pzoom:hover { color: var(--accent); border-color: var(--accent); }

/* lightbox */
.lightbox {
  position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.75); backdrop-filter: blur(3px); padding: 24px;
}
.lb-box { max-width: 92vw; max-height: 92vh; display: flex; flex-direction: column; gap: 8px; }
.lb-box canvas { max-width: 92vw; max-height: 86vh; width: auto; height: auto; border-radius: 8px; background: #fff; box-shadow: 0 12px 48px rgba(0,0,0,0.6); }
.lb-cap { text-align: center; color: var(--dim); font-size: 12px; }

/* merge expandable page strip */
.fdetail { flex-basis: 100%; margin-top: 6px; }
.pstrip { display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 2px 2px; }
.pstrip-cell { width: 64px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.pstrip-n { font-size: 10px; color: var(--faint); }

/* extract selection */
.icard { cursor: pointer; transition: border-color 0.12s; }
.icard.sel { border-color: var(--accent); background: rgba(52, 211, 153, 0.07); }
.icard .pchk { background: var(--bg); }
.icard.sel .pchk { background: var(--accent); border-color: var(--accent); color: #052e22; }
.toolbar .lbl input[type='checkbox'] { accent-color: var(--accent); margin-right: 5px; vertical-align: -2px; }

/* footer */
footer { margin-top: auto; padding-top: 60px; }
footer p { border-top: 1px solid var(--border); padding-top: 20px; color: var(--faint); font-size: 12px; }
footer p + p { border-top: 0; padding-top: 6px; }
footer a { color: var(--accent); }
footer em { color: var(--dim); }

/* v3 tools */
.textpreview {
  font: 11px/1.5 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word;
  max-height: 220px; overflow: auto; margin: 8px 0; padding: 10px;
  background: rgba(0,0,0,0.25); border: 1px solid var(--line); border-radius: 8px;
  color: var(--dim);
}
.chk { display: flex; gap: 8px; align-items: center; margin: 8px 0; cursor: pointer; }
.chk input { accent-color: var(--accent); }
.meta.ok { color: var(--accent); }

/* ---------- edit pdf (annotation editor) ---------- */
.ed { display: flex; flex-direction: column; gap: 10px; }

/* tool + nav button rows — always visible, wrap on narrow screens */
.edtools { display: flex; gap: 6px; flex-wrap: wrap; }
.ednav { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.edt {
  min-height: 34px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--dim); font-size: 12.5px; cursor: pointer; user-select: none;
}
.edt:hover { color: var(--text); border-color: var(--faint); }
.edt.on { border-color: var(--accent); color: var(--accent); background: rgba(52, 211, 153, 0.08); }
.edt:disabled { opacity: 0.35; cursor: default; }
.edpgl { color: var(--dim); font-size: 12.5px; min-width: 58px; text-align: center; }
.edsep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
.edacts { display: inline-flex; }
.edacts .toolbar { margin-top: 0; }

/* options row — swatches, stroke/opacity sliders, font controls */
.edopts { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.edsws { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.edsw {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--border);
  cursor: pointer; padding: 0;
}
.edsw.on { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(52, 211, 153, 0.3); }
.edpick {
  width: 34px; height: 30px; padding: 0; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); cursor: pointer;
}
.edopt { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--faint); }
.edslider { width: 110px; }
.edrangev { min-width: 36px; color: var(--dim); font-size: 12px; }
.edtext { display: flex; gap: 8px; align-items: center; }
.edfont { width: auto; margin: 0; padding: 6px 8px; font-size: 13px; }
.ednum { width: 64px; margin: 0; padding: 6px 8px; }

/* stage: scrollable pan container > page (base raster + vector overlay) */
.edwrap {
  overflow: auto; max-height: 72vh; padding: 18px;
  border: 1px solid var(--border); border-radius: 12px;
  background:
    repeating-conic-gradient(#151518 0% 25%, #101013 0% 50%) 0 0 / 22px 22px;
}
.edpage { position: relative; margin: 0 auto; box-shadow: 0 6px 32px rgba(0, 0, 0, 0.55); }
.edbase { display: block; width: 100%; height: 100%; }
.edover {
  position: absolute; inset: 0; width: 100%; height: 100%;
  touch-action: pan-x pan-y; cursor: crosshair;
}

/* floating delete chip for the current selection */
.edsel {
  position: absolute; z-index: 6; width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--border); background: rgba(9, 9, 11, 0.92); color: var(--danger);
  display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
}
.edsel:hover { border-color: var(--danger); color: var(--danger); }
.edsel .icon-sm { width: 12px; height: 12px; }

/* floating text input (.edtxtin) — positioned in page pt×zoom space */
.edtxtin {
  position: absolute; z-index: 5; min-width: 80px; min-height: 1.4em;
  background: rgba(9, 9, 11, 0.88); border: 1px dashed var(--accent); border-radius: 4px;
  color: var(--text); font-family: inherit; line-height: 1.2;
  padding: 2px 5px; outline: none; resize: both; overflow: hidden; white-space: pre;
}

/* thumbnail strip */
.edthumbs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; }
.edthumb {
  position: relative; flex: 0 0 auto; width: 90px; min-height: 40px;
  border: 2px solid var(--border); border-radius: 8px; background: var(--card);
  cursor: pointer; padding: 3px; display: flex; align-items: center; justify-content: center;
}
.edthumb.cur { border-color: var(--accent); }
.edthumbc { width: 100%; height: 100%; object-fit: contain; border-radius: 4px; background: #fff; pointer-events: none; }
.edthumbn {
  position: absolute; bottom: 3px; right: 4px; font-size: 10px; color: var(--faint);
  background: rgba(9, 9, 11, 0.8); border-radius: 4px; padding: 0 5px;
}

/* download button contents */
.edbtnin { display: inline-flex; align-items: center; gap: 8px; }

    <script>

// ---- src/pdf/types.js ----
// PDF value model — tagged constructors + predicates.
// dict = Map<string, value>, array = Array<value>, number/bool/null = raw JS.

const name = (v) => ({ k: 'n', v })
const ref = (n, g = 0) => ({ k: 'r', n, g })
const str = (bytes) => ({ k: 's', bytes }) // literal string, raw bytes
const hex = (bytes) => ({ k: 'x', bytes }) // hex string
const stream = (dict, data) => ({ k: 't', dict, data }) // dict: Map

const isName = (v) => v?.k === 'n'
const isRef = (v) => v?.k === 'r'
const isStr = (v) => v?.k === 's'
const isHex = (v) => v?.k === 'x'
const isStream = (v) => v?.k === 't'
const isDict = (v) => v instanceof Map

const te = new TextEncoder()
const td = new TextDecoder('latin1')
const enc = (s) => te.encode(s)
const dec = (b) => td.decode(b)

/** Get dict value by key name (with or without leading slash). */
function get(dict, key) {
  if (!(dict instanceof Map)) return undefined
  return dict.get(key.replace(/^\//, ''))
}

/** Set dict value; returns the dict for chaining. */
function set(dict, key, value) {
  dict.set(key.replace(/^\//, ''), value)
  return dict
}

/** Type check helper: dict entry /Type matches name. */
function typeIs(dict, typeName) {
  const t = get(dict, 'Type')
  return isName(t) && t.v === typeName
}

// ---------- serialization ----------

const NAME_SPECIAL = /[^A-Za-z0-9_+\-.]/
function serName(s) {
  let out = '/'
  for (const ch of s) {
    const c = ch.codePointAt(0)
    out += NAME_SPECIAL.test(ch) ? '#' + c.toString(16).toUpperCase().padStart(2, '0') : ch
  }
  return out
}

function serStr(bytes) {
  const parts = []
  for (const b of bytes) {
    if (b === 0x28 || b === 0x29 || b === 0x5c) parts.push(0x5c, b) // ( ) \
    else parts.push(b)
  }
  const out = new Uint8Array(parts.length + 2)
  out[0] = 0x28
  out.set(parts, 1)
  out[out.length - 1] = 0x29
  return out
}

const toHex = (bytes) => [...bytes].map((b) => b.toString(16).padStart(2, '0')).join('')

function serNum(n) {
  if (Number.isInteger(n)) return String(n)
  let s = n.toFixed(6)
  s = s.replace(/\.?0+$/, '')
  return s === '-0' || s === '' ? '0' : s
}

/** Serialize a value to PDF syntax. Returns Uint8Array[] chunks. */
function serialize(v) {
  if (v === null || v === undefined) return [enc('null')]
  if (typeof v === 'boolean') return [enc(v ? 'true' : 'false')]
  if (typeof v === 'number') return [enc(serNum(v))]
  if (v instanceof Map) {
    const parts = [enc('<<')]
    for (const [k, val] of v) parts.push(enc(' ' + serName(k) + ' '), ...serialize(val))
    parts.push(enc('>>'))
    return parts
  }
  if (Array.isArray(v)) {
    const parts = [enc('[')]
    v.forEach((item, i) => parts.push(enc(i ? ' ' : ''), ...serialize(item)))
    parts.push(enc(']'))
    return parts
  }
  switch (v.k) {
    case 'n': return [enc(serName(v.v))]
    case 'r': return [enc(`${v.n} ${v.g} R`)]
    case 's': return [serStr(v.bytes)]
    case 'x': return [enc('<' + toHex(v.bytes) + '>')]
    case 't': {
      v.dict.set('Length', v.data.length)
      return [...serialize(v.dict), enc('\nstream\n'), v.data, enc('\nendstream')]
    }
    default:
      throw new Error('cannot serialize value: ' + JSON.stringify(v).slice(0, 80))
  }
}

function concat(parts) {
  const total = parts.reduce((n, p) => n + p.length, 0)
  const out = new Uint8Array(total)
  let o = 0
  for (const p of parts) {
    out.set(p, o)
    o += p.length
  }
  return out
}

// ---- src/pdf/env.js ----
// Environment-neutral inflate (FlateDecode). Node → zlib; browser → DecompressionStream.

async function inflate(data) {
  if (typeof process !== 'undefined' && process.versions?.node) {
    const { inflateSync } = await import('node:zlib')
    return new Uint8Array(inflateSync(data))
  }
  const out = await inflateRaw(data, 'deflate').catch(() => inflateRaw(data, 'deflate-raw'))
  if (!out) throw new Error('inflate failed')
  return out
}

async function inflateRaw(data, format) {
  const ds = new DecompressionStream(format)
  const stream = new Blob([data]).stream().pipeThrough(ds)
  return new Uint8Array(await new Response(stream).arrayBuffer())
}

// Environment-neutral deflate (FlateEncode). Node → zlib; browser → CompressionStream.
async function deflate(data) {
  if (typeof process !== 'undefined' && process.versions?.node) {
    const { deflateSync } = await import('node:zlib')
    return new Uint8Array(deflateSync(data))
  }
  const cs = new CompressionStream('deflate')
  const stream = new Blob([data]).stream().pipeThrough(cs)
  return new Uint8Array(await new Response(stream).arrayBuffer())
}

  const blk = new Uint8Array(16)

    for (let i = 0; i < 16; i++) out[o + i] = blk[i] ^ prev[i]

  if (p >= 1 && p <= 16 && out.subarray(len - p).every((b) => b === p)) return out.slice(0, len - p)

/** ASCII85Decode — 4 bytes per 5 chars, 'z' = four zero bytes, '~>' ends. */
function ascii85(data) {
  const out = []
  let tuple = 0
  let n = 0
  for (let i = 0; i < data.length; i++) {
    const c = data[i]
    if (c === 0x7e) break // '~>' EOD
    if (c <= 0x20) continue // whitespace
    if (c === 0x7a && n === 0) { out.push(0, 0, 0, 0); continue } // 'z'
    if (c < 0x21 || c > 0x75) throw new Error('bad ASCII85 data')
    tuple = tuple * 85 + (c - 0x21)
    if (++n === 5) {
      out.push((tuple >>> 24) & 255, (tuple >>> 16) & 255, (tuple >>> 8) & 255, tuple & 255)
      tuple = 0
      n = 0
    }
  }
  if (n > 1) { // partial group: pad with 'u', keep n-1 bytes
    for (let k = n; k < 5; k++) tuple = tuple * 85 + 84
    const b = [(tuple >>> 24) & 255, (tuple >>> 16) & 255, (tuple >>> 8) & 255, tuple & 255]
    out.push(...b.slice(0, n - 1))
  }
  return new Uint8Array(out)
}

    const len = data[i++]
    if (len === 128) break
    if (len < 128) { for (let k = 0; k <= len && i < data.length; k++) out.push(data[i++]) }
    else { const b = data[i++]; for (let k = 0; k < 257 - len; k++) out.push(b) }
  }
  return new Uint8Array(out)
}

/** LZWDecode — 9..12-bit codes, 256 clear, 257 EOD; earlyChange per spec default 1. */
function lzw(data, earlyChange = 1) {
  const out = []
  let dict = []
  const reset = () => {
    dict = []
    for (let i = 0; i < 256; i++) dict.push([i])
    dict.push(null, null) // 256 clear, 257 eod
  }
  reset()
  let bits = 9
  let buf = 0
  let nbuf = 0
  let prev = null
  for (let i = 0; i < data.length; i++) {
    buf = (buf << 8) | data[i]
    nbuf += 8
    while (nbuf >= bits) {
      const code = (buf >>> (nbuf - bits)) & ((1 << bits) - 1)
      nbuf -= bits
      buf &= (1 << nbuf) - 1
      if (code === 256) { reset(); bits = 9; prev = null; continue }
      if (code === 257) return new Uint8Array(out)
      let entry
      if (code < dict.length && dict[code]) entry = dict[code]
      else if (prev && code === dict.length) entry = [...prev, prev[0]]
      else throw new Error('bad LZW code')
      for (const b of entry) out.push(b)
      if (prev) dict.push([...prev, entry[0]])
      prev = entry
      if (dict.length + earlyChange >= 1 << bits && bits < 12) bits++
    }
  }
  return new Uint8Array(out)
}

/** Undo PNG/TIFF predictors (DecodeParms /Predictor). */
function unPredict(data, { predictor = 1, columns = 1, colors = 1, bpc = 8 }) {
  if (predictor === 1) return data
  const bpp = Math.max(1, Math.ceil((colors * bpc) / 8))
  const rowBytes = Math.ceil((columns * colors * bpc) / 8)
  if (predictor === 2) {
    const out = new Uint8Array(data.length)
    for (let y = 0; y * rowBytes < data.length; y++) {
      const row = y * rowBytes
      for (let x = 0; x < rowBytes; x++) {
        const left = x >= bpp ? out[row + x - bpp] : 0
        out[row + x] = (data[row + x] + left) & 0xff
      }
    }
    return out
  }
  if (predictor < 10 || predictor > 15) throw new Error(`unsupported predictor ${predictor}`)
  const rowStride = rowBytes + 1
  const rows = Math.floor(data.length / rowStride)
  const out = new Uint8Array(rows * rowBytes)
  const paeth = (a, b, c) => {
    const p = a + b - c
    const pa = Math.abs(p - a), pb = Math.abs(p - b), pc = Math.abs(p - c)
    return pa <= pb && pa <= pc ? a : pb <= pc ? b : c
  }
  for (let y = 0; y < rows; y++) {
    const src = y * rowStride + 1
    const f = data[y * rowStride]
    const prev = y > 0 ? (y - 1) * rowBytes : -1
    for (let x = 0; x < rowBytes; x++) {
      const a = x >= bpp ? out[y * rowBytes + x - bpp] : 0
      const b = prev >= 0 ? out[prev + x] : 0
      const c = x >= bpp && prev >= 0 ? out[prev + x - bpp] : 0
      let v = data[src + x]
      if (f === 1) v += a
      else if (f === 2) v += b
      else if (f === 3) v += (a + b) >> 1
      else if (f === 4) v += paeth(a, b, c)
      out[y * rowBytes + x] = v & 0xff
    }
  }
  return out
}

const FILTER_ALIAS = { AHx: 'ASCIIHexDecode', A85: 'ASCII85Decode', LZW: 'LZWDecode', Fl: 'FlateDecode', RL: 'RunLengthDecode', DCT: 'DCTDecode', CCF: 'CCITTFaxDecode' }
const IMAGE_CODECS = new Set(['DCTDecode', 'JPXDecode', 'JBIG2Decode', 'CCITTFaxDecode'])

/** Normalised [{name, parms: Map|null}] chain for a stream dict. */
function filterChain(dict) {
  const g = (k) => (dict instanceof Map ? dict.get(k) : undefined)
  const f = g('Filter') ?? g('F')
  const p = g('DecodeParms') ?? g('DP')
  const names = Array.isArray(f) ? f : f ? [f] : []
  const parms = Array.isArray(p) ? p : [p]
  return names.map((n, i) => {
    const nm = n?.k === 'n' ? n.v : null
    return { name: FILTER_ALIAS[nm] ?? nm, parms: parms[i] instanceof Map ? parms[i] : null }
  })
}

const predictParms = (parms) => {
  if (!parms) return null
  const pr = parms.get('Predictor') ?? 1
  if (pr === 1) return null
  return {
    predictor: pr,
    columns: parms.get('Columns') ?? 1,
    colors: parms.get('Colors') ?? 1,
    bpc: parms.get('BitsPerComponent') ?? 8,
  }
}

/** Apply one non-image filter. */
async function applyFilter(name, parms, d) {
  if (name === 'FlateDecode') {
    d = await inflate(d)
  } else if (name === 'LZWDecode') {
    d = lzw(d, parms?.get('EarlyChange') ?? 1)
  } else if (name === 'ASCII85Decode') return ascii85(d)
  else if (name === 'ASCIIHexDecode') return asciiHex(d)
  else if (name === 'RunLengthDecode') return runLength(d)
  else if (name === 'Crypt') return d // Identity crypt filter
  else throw new Error(`unsupported filter ${name}`)
  const pp = predictParms(parms)
  return pp ? unPredict(d, pp) : d
}

/**
 * Decode a stream's data through its filter chain.
 * stopAtImage: stop (without error) at a trailing image codec and report it.
 * Returns {data, codec, parms} — codec null when fully decoded.
 */
async function decodeChain(dict, data, { stopAtImage = false } = {}) {
  const chain = filterChain(dict)
  let d = data
  for (let i = 0; i < chain.length; i++) {
    const { name, parms } = chain[i]
    if (IMAGE_CODECS.has(name)) {
      if (stopAtImage) return { data: d, codec: name, parms }
      throw new Error(`image codec ${name}`)
    }
    d = await applyFilter(name, parms, d)
  }
  return { data: d, codec: null, parms: null }
}

// ---- src/pdf/parse.js ----

const WS = new Set([0x00, 0x09, 0x0a, 0x0c, 0x0d, 0x20])
const DELIM = new Set([0x28, 0x29, 0x3c, 0x3e, 0x5b, 0x5d, 0x7b, 0x7d, 0x2f, 0x25])
const isWs = (b) => WS.has(b)
const isDelim = (b) => isWs(b) || DELIM.has(b)
const isDigit = (b) => b >= 0x30 && b <= 0x39

function skipWs(buf, i) {
  while (i < buf.length) {
    if (isWs(buf[i])) i++
    else if (buf[i] === 0x25) {
      while (i < buf.length && buf[i] !== 0x0a && buf[i] !== 0x0d) i++ // % comment → EOL
    } else break
  }
  return i
}

function matchKeyword(buf, i, kw) {
  for (let j = 0; j < kw.length; j++) if (buf[i + j] !== kw.charCodeAt(j)) return false
  return true
}

/** Parse one PDF value at buf[i]. Returns [value, nextIndex]. */
function parseValue(buf, i, allowStream = false) {
  i = skipWs(buf, i)
  const b = buf[i]

  if (b === 0x3c) {
    // << dict >> or <hex>
    if (buf[i + 1] === 0x3c) {
      const dict = new Map()
      i += 2
      while (true) {
        i = skipWs(buf, i)
        if (buf[i] === 0x3e && buf[i + 1] === 0x3e) {
          i += 2
          break
        }
        if (buf[i] !== 0x2f) throw new Error(`dict: expected /key @${i}`)
        let keyEnd = i + 1
        while (keyEnd < buf.length && !isDelim(buf[keyEnd])) keyEnd++
        const key = decodeName(buf, i + 1, keyEnd)
        const [val, next] = parseValue(buf, keyEnd)
        dict.set(key, val)
        i = next
      }
      // top-level only: stream data may follow a dict
      if (allowStream) {
        const j = skipWs(buf, i)
        if (matchKeyword(buf, j, 'stream') && isDelim(buf[j + 6])) {
          let d = j + 6
          if (buf[d] === 0x0d && buf[d + 1] === 0x0a) d += 2
          else if (buf[d] === 0x0d || buf[d] === 0x0a) d += 1
          const len = get(dict, 'Length')
          let data
          if (typeof len === 'number' && len >= 0 && d + len <= buf.length) {
            data = buf.slice(d, d + len)
            i = d + len
            const e = skipWs(buf, i)
            if (matchKeyword(buf, e, 'endstream')) i = e + 9
          } else {
            const { end, at } = findMarker(buf, d, 'endstream')
            data = buf.slice(d, end)
            i = at + 9
          }
          return [stream(dict, data), i]
        }
      }
      return [dict, i]
    }
    // hex string
    let j = i + 1
    const nib = []
    while (j < buf.length && buf[j] !== 0x3e) {
      const c = buf[j]
      if (!isWs(c)) nib.push(c)
      j++
    }
    if (nib.length % 2) nib.push(0x30)
    const out = new Uint8Array(nib.length / 2)
    for (let k = 0; k < out.length; k++)
      out[k] = parseInt(String.fromCharCode(nib[2 * k], nib[2 * k + 1]), 16)
    return [hex(out), j + 1]
  }

  if (b === 0x5b) {
    const arr = []
    i++
    while (true) {
      i = skipWs(buf, i)
      if (buf[i] === 0x5d) return [arr, i + 1]
      const [v, next] = parseValue(buf, i)
      arr.push(v)
      i = next
    }
  }

  if (b === 0x2f) {
    let j = i + 1
    while (j < buf.length && !isDelim(buf[j])) j++
    return [name(decodeName(buf, i + 1, j)), j]
  }

  if (b === 0x28) {
    // literal string — escapes + balanced parens
    const out = []
    let j = i + 1
    let depth = 1
    while (j < buf.length && depth > 0) {
      const c = buf[j]
      if (c === 0x5c) {
        const e = buf[j + 1]
        j += 2
        switch (e) {
          case 0x6e: out.push(0x0a); break
          case 0x72: out.push(0x0d); break
          case 0x74: out.push(0x09); break
          case 0x62: out.push(0x08); break
          case 0x66: out.push(0x0c); break
          case 0x28: case 0x29: case 0x5c: out.push(e); break
          case 0x0d: if (buf[j] === 0x0a) j++; break
          case 0x0a: break
          default:
            if (isDigit(e)) {
              let oct = e - 0x30, cnt = 1
              while (cnt < 3 && isDigit(buf[j])) { oct = oct * 8 + (buf[j] - 0x30); j++; cnt++ }
              out.push(oct & 0xff)
            } else if (e !== undefined) out.push(e)
        }
      } else if (c === 0x28) { depth++; out.push(c); j++ }
      else if (c === 0x29) { if (--depth > 0) out.push(c); j++ }
      else { out.push(c); j++ }
    }
    return [str(new Uint8Array(out)), j]
  }

  // number / ref / keyword
  const start = i
  let j = i
  if (buf[j] === 0x2b || buf[j] === 0x2d) j++
  let sawDot = false
  while (j < buf.length && (isDigit(buf[j]) || (buf[j] === 0x2e && !sawDot))) {
    if (buf[j] === 0x2e) sawDot = true
    j++
  }
  if (j > start && (isDigit(buf[j - 1]) || isDigit(buf[start]))) {
    const numStr = dec(buf.slice(start, j))
    const num = parseFloat(numStr)
    if (Number.isInteger(num) && !numStr.includes('.')) {
      // maybe "n g R"
      let k = skipWs(buf, j)
      const s2 = k
      while (k < buf.length && isDigit(buf[k])) k++
      if (k > s2) {
        const g = parseInt(dec(buf.slice(s2, k)), 10)
        const k2 = skipWs(buf, k)
        if (buf[k2] === 0x52 && isDelim(buf[k2 + 1])) return [ref(num, g), k2 + 1]
      }
    }
    return [num, j]
  }

  // keyword
  let k = i
  while (k < buf.length && !isDelim(buf[k])) k++
  const word = dec(buf.slice(i, k))
  if (word === 'true') return [true, k]
  if (word === 'false') return [false, k]
  if (word === 'null') return [null, k]
  throw new Error(`unexpected token "${word}" @${i}`)
}

function decodeName(buf, i, j) {
  let s = ''
  while (i < j) {
    if (buf[i] === 0x23 && i + 2 < j) {
      // #XX
      const hv = parseInt(dec(buf.slice(i + 1, i + 3)), 16)
      if (!Number.isNaN(hv)) { s += String.fromCharCode(hv); i += 3; continue }
    }
    s += String.fromCharCode(buf[i++])
  }
  return s
}

function findMarker(buf, from, marker) {
  const m = marker
  outer: for (let i = from; i <= buf.length - m.length; i++) {
    for (let j = 0; j < m.length; j++) if (buf[i + j] !== m.charCodeAt(j)) continue outer
    // strip the EOL that precedes the marker (not part of stream data)
    let end = i
    if (buf[end - 1] === 0x0a) end--
    if (buf[end - 1] === 0x0d) end--
    return { end, at: i }
  }
  return { end: buf.length, at: buf.length }
}

const OBJ_RE = /(\d+)\s+(\d+)\s+obj\b/g

/**
 * Parse a PDF by scanning for indirect objects — ignores xref tables entirely,
 * so linearized / damaged / xref-stream files all parse the same.
 */
async function parsePdf(bytes, warnings = [], allowEncrypted = false) {
  const text = dec(bytes)
  const objects = new Map()

  for (const m of text.matchAll(OBJ_RE)) {
    const n = +m[1]
    const g = +m[2]
    const start = m.index + m[0].length
    try {
      const [v, next] = parseValue(bytes, start, true)
      const e = skipWs(bytes, next)
      if (!matchKeyword(bytes, e, 'endobj')) continue // not a real object boundary
      objects.set(`${n} ${g}`, { n, g, v })
    } catch {
      // false-positive match inside stream data — skip
    }
  }

  // objects hidden inside /ObjStm compressed streams
  for (const { v } of objects.values()) {
    if (!isStream(v) || !typeIs(v.dict, 'ObjStm')) continue
    const N = get(v.dict, 'N')
    const first = get(v.dict, 'First')
    if (typeof N !== 'number' || typeof first !== 'number') continue
    try {
      const { data } = await decodeChain(v.dict, v.data)
      const headerEnd = first
      const header = dec(data.slice(0, headerEnd)).trim().split(/\s+/).map(Number)
      for (let i = 0; i < N; i++) {
        const num = header[i * 2]
        const off = header[i * 2 + 1]
        try {
          const [v2] = parseValue(data, first + off)
          if (!objects.has(`${num} 0`)) objects.set(`${num} 0`, { n: num, g: 0, v: v2 })
        } catch { warnings.push(`ObjStm: bad object ${num}`) }
      }
    } catch { warnings.push('ObjStm: inflate failed — document may be incomplete') }
  }

  // trailer: classic `trailer` dict, or an /XRef stream dict
  let trailer = null
  const tIdx = text.lastIndexOf('trailer')
  if (tIdx !== -1) {
    try { const [t] = parseValue(bytes, skipWs(bytes, tIdx + 7)); trailer = t } catch { /* fall through */ }
  }
  if (!(trailer instanceof Map)) {
    for (const { v } of objects.values()) {
      const dict = isStream(v) ? v.dict : v
      if (typeIs(dict, 'XRef')) { trailer = dict; break }
    }
  }
  if (!(trailer instanceof Map)) {
    // last resort: synthesize a trailer pointing at the catalog
    for (const { n, g, v } of objects.values()) {
      const dict = isStream(v) ? v.dict : v
      if (typeIs(dict, 'Catalog')) {
        trailer = new Map([['Root', ref(n, g)]])
        break
      }
    }
  }
  if (!trailer) throw new Error('not a PDF (no trailer/catalog found)')
  if (get(trailer, 'Encrypt') && !allowEncrypted)
    throw new Error('this PDF is password-protected — unlock it in the Protect tool first')

  return { objects, trailer, warnings, encrypted: !!get(trailer, 'Encrypt') }
}

/** Resolve a value: refs are dereferenced, everything else returned as-is. */
function deref(doc, v) {
  if (v?.k === 'r') return doc.objects.get(`${v.n} ${v.g}`)?.v
  return v
}

// ---- src/pdf/write.js ----

/** A document under construction: numbered objects + allocator. */
function newDoc() {
  return {
    objects: new Map(), // num → value
    _next: 1,
    alloc() {
      return this._next++
    },
    set(num, v) {
      this.objects.set(num, v)
    },
  }
}

/** Serialize a built doc to PDF bytes: header, objects, classic xref, trailer.
 *  trailerExtra: Map merged into the trailer dict (/Encrypt, /ID, ...). */
function writeDoc(doc, rootNum, trailerExtra) {
  const parts = [enc('%PDF-1.7\n%\xe2\xe3\xcf\xd3\n')]
  const offsets = new Map()

  const nums = [...doc.objects.keys()].sort((a, b) => a - b)
  for (const n of nums) {
    offsets.set(n, parts.reduce((s, p) => s + p.length, 0))
    parts.push(enc(`${n} 0 obj\n`), ...serialize(doc.objects.get(n)), enc('\nendobj\n'))
  }

  const xrefAt = parts.reduce((s, p) => s + p.length, 0)
  const count = nums.length ? nums[nums.length - 1] + 1 : 1
  let xref = 'xref\n0 ' + count + '\n0000000000 65535 f \r\n'
  for (let n = 1; n < count; n++) {
    const off = offsets.get(n)
    xref += off === undefined ? '0000000000 65535 f \r\n' : String(off).padStart(10, '0') + ' 00000 n \r\n'
  }
  const trailer = new Map([
    ['Size', count],
    ['Root', ref(rootNum, 0)],
  ])
  if (trailerExtra instanceof Map) for (const [k, v] of trailerExtra) trailer.set(k, v)
  parts.push(
    enc(xref),
    enc('trailer\n'),
    ...serialize(trailer),
    enc(`\nstartxref\n${xrefAt}\n%%EOF\n`),
  )
  return concat(parts)
}

// Adobe Glyph List subset — names that actually show up in /Differences

// accented Latin letters: base letter + accent name → precomposed code point
const ACCENTS = { grave: 0x300, acute: 0x301, circumflex: 0x302, tilde: 0x303, dieresis: 0x308, ring: 0x30a, cedilla: 0x327, caron: 0x30c }
const RE_UNI = /^uni([0-9A-Fa-f]{4,})$/
const RE_U = /^u([0-9A-Fa-f]{4,6})$/
const RE_ACC = /^([A-Za-z])(grave|acute|circumflex|tilde|dieresis|ring|cedilla|caron)$/

/** Glyph name → Unicode string ('' when unknown). */
function glyphToUnicode(gname) {
  if (!gname) return ''
  if (AGL[gname] !== undefined) return String.fromCodePoint(AGL[gname])
  if (gname.length === 1 && /[A-Za-z]/.test(gname)) return gname
  let m = gname.match(RE_UNI)
  if (m) {
    let s = ''
    for (let i = 0; i + 4 <= m[1].length; i += 4) s += String.fromCodePoint(parseInt(m[1].slice(i, i + 4), 16))
    return s
  }
  m = gname.match(RE_U)
  if (m) return String.fromCodePoint(parseInt(m[1], 16))
  m = gname.match(RE_ACC)
  if (m) return (m[1] + String.fromCodePoint(ACCENTS[m[2]])).normalize('NFC')
  const dot = gname.indexOf('.') // "a.sc", "one.oldstyle" → base glyph
  if (dot > 0) return glyphToUnicode(gname.slice(0, dot))
  const us = gname.indexOf('_') // "f_i" ligature names
  if (us > 0) return gname.split('_').map(glyphToUnicode).join('')
  return ''
}

/**
 * Build a 256-entry code → string table for a simple font's /Encoding.
 * enc: Name | Dict (BaseEncoding + Differences) | undefined. Symbolic fonts
 * without a base encoding keep identity bytes.
 */
function simpleEncodingTable(enc, { symbolic = false } = {}) {
  const nm = (v) => (v?.k === 'n' ? v.v : null)
  let baseName = nm(enc)
  let diffs = null
  if (enc instanceof Map) {
    baseName = nm(enc.get('BaseEncoding'))
    diffs = enc.get('Differences')
  }
  const base = baseName === 'MacRomanEncoding' ? MAC_ROMAN
    : baseName === 'WinAnsiEncoding' ? WIN_ANSI
    : baseName === 'StandardEncoding' ? STANDARD
    : symbolic ? null : WIN_ANSI // spec says Standard, but WinAnsi ⊇ ASCII and matches real files better
  const table = Array.from({ length: 256 }, (_, i) => (base ? (base[i] ? String.fromCodePoint(base[i]) : '') : String.fromCharCode(i)))
  if (Array.isArray(diffs)) {
    let code = 0
    for (const d of diffs) {
      if (typeof d === 'number') code = d
      else if (d?.k === 'n') {
        if (code < 256) {
          const u = glyphToUnicode(d.v)
          if (u) table[code] = u
        }
        code++
      }
    }
  }
  return table
}

/** Unicode string → WinAnsi bytes for the standard-14 fonts (null if any char is unmappable). */
function toWinAnsi(s) {
  const out = []
  for (const ch of s) {
    const b = UNI_TO_WIN.get(ch.codePointAt(0))
    if (b === undefined) return null
    out.push(b)
  }
  return new Uint8Array(out)
}

// ---- src/pdf/functions.js ----
// PDF function objects (types 0, 2, 3, 4) → plain JS (inputs[]) => outputs[].
// Used by Separation/DeviceN tint transforms and shadings.

const clampTo = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v)
const dictOf = (v) => (v?.k === 't' ? v.dict : v)

/** Compile a function object. Returns null when it can't be understood. */
async function compileFunction(doc, fnObj) {
  if (Array.isArray(fnObj)) { // array of 1-out functions → one n-out function
    const fs = []
    for (const f of fnObj) fs.push(await compileFunction(doc, deref(doc, f)))
    if (fs.some((f) => !f)) return null
    return (x) => fs.map((f) => f(x)[0])
  }
  fnObj = deref(doc, fnObj)
  const d = dictOf(fnObj)
  if (!(d instanceof Map)) return null
  const type = d.get('FunctionType')
  const domain = d.get('Domain') ?? [0, 1]
  const range = d.get('Range') ?? null
  const clampIn = (x) => x.map((v, i) => clampTo(v, domain[2 * i] ?? 0, domain[2 * i + 1] ?? 1))
  const clampOut = (y) => (range ? y.map((v, i) => clampTo(v, range[2 * i], range[2 * i + 1])) : y)

  if (type === 2) {
    const c0 = d.get('C0') ?? [0]
    const c1 = d.get('C1') ?? [1]
    const N = d.get('N') ?? 1
    return (x) => {
      const t = clampIn(x)[0] ** N
      return clampOut(c0.map((a, i) => a + t * ((c1[i] ?? 1) - a)))
    }
  }
  if (type === 3) {
    const fns = []
    for (const f of d.get('Functions') ?? []) fns.push(await compileFunction(doc, deref(doc, f)))
    if (fns.some((f) => !f)) return null
    const bounds = d.get('Bounds') ?? []
    const encode = d.get('Encode') ?? []
    return (x) => {
      const v = clampIn(x)[0]
      let k = 0
      while (k < bounds.length && v >= bounds[k]) k++
      const lo = k === 0 ? domain[0] : bounds[k - 1]
      const hi = k === bounds.length ? domain[1] : bounds[k]
      const e0 = encode[2 * k] ?? 0, e1 = encode[2 * k + 1] ?? 1
      const t = hi === lo ? e0 : e0 + ((v - lo) * (e1 - e0)) / (hi - lo)
      return clampOut(fns[k]([t]))
    }
  }
  if (type === 0 && fnObj.k === 't') {
    const { data } = await decodeChain(d, fnObj.data)
    const size = d.get('Size') ?? [2]
    const bps = d.get('BitsPerSample') ?? 8
    const nOut = (range?.length ?? 2) / 2
    const encode = d.get('Encode') ?? size.flatMap((s) => [0, s - 1])
    const decode = d.get('Decode') ?? range
    const max = 2 ** bps - 1
    const sample = (idx) => { // idx = flat sample index
      const out = []
      for (let o = 0; o < nOut; o++) {
        const bit = (idx * nOut + o) * bps
        let v = 0
        if (bps === 8) v = data[bit >> 3]
        else if (bps === 16) v = (data[bit >> 3] << 8) | data[(bit >> 3) + 1]
        else if (bps === 32) v = ((data[bit >> 3] << 24) | (data[(bit >> 3) + 1] << 16) | (data[(bit >> 3) + 2] << 8) | data[(bit >> 3) + 3]) >>> 0
        else { for (let b = 0; b < bps; b++) v = (v << 1) | ((data[(bit + b) >> 3] >> (7 - ((bit + b) & 7))) & 1) }
        out.push((decode[2 * o] ?? 0) + ((v ?? 0) * ((decode[2 * o + 1] ?? 1) - (decode[2 * o] ?? 0))) / max)
      }
      return out
    }
    return (x) => {
      x = clampIn(x)
      // multilinear would be nicer; nearest-sample is plenty for tints/shading
      let idx = 0, stride = 1
      for (let i = 0; i < size.length; i++) {
        const e = (encode[2 * i] ?? 0) + ((x[i] - (domain[2 * i] ?? 0)) * ((encode[2 * i + 1] ?? size[i] - 1) - (encode[2 * i] ?? 0))) / (((domain[2 * i + 1] ?? 1) - (domain[2 * i] ?? 0)) || 1)
        idx += clampTo(Math.round(e), 0, size[i] - 1) * stride
        stride *= size[i]
      }
      return clampOut(sample(idx))
    }
  }
  if (type === 4 && fnObj.k === 't') {
    const { data } = await decodeChain(d, fnObj.data)
    const prog = parsePostScript(new TextDecoder('latin1').decode(data))
    if (!prog) return null
    return (x) => {
      const st = [...clampIn(x)]
      try { runPS(prog, st) } catch { return range ? range.filter((_, i) => i % 2 === 0) : [0] }
      const n = range ? range.length / 2 : st.length
      return clampOut(st.slice(st.length - n))
    }
  }
  return null
}

/** Tokenise a type-4 calculator program → nested arrays (procs) of tokens. */
function parsePostScript(src) {
  const toks = src.match(/[{}]|[^\s{}]+/g) ?? []
  let i = 0
  const proc = () => {
    const out = []
    while (i < toks.length) {
      const t = toks[i++]
      if (t === '{') out.push(proc())
      else if (t === '}') return out
      else out.push(/^[-+.\d]/.test(t) ? Number(t) : t)
    }
    return out
  }
  if (toks[i] !== '{') return null
  i++
  return proc()
}

function runPS(prog, s) {
  for (let i = 0; i < prog.length; i++) {
    const t = prog[i]
    if (typeof t === 'number' || Array.isArray(t)) { s.push(t); continue }
    let a, b
    switch (t) {
      case 'add': b = s.pop(); a = s.pop(); s.push(a + b); break
      case 'sub': b = s.pop(); a = s.pop(); s.push(a - b); break
      case 'mul': b = s.pop(); a = s.pop(); s.push(a * b); break
      case 'div': b = s.pop(); a = s.pop(); s.push(b ? a / b : 0); break
      case 'idiv': b = s.pop(); a = s.pop(); s.push(b ? Math.trunc(a / b) : 0); break
      case 'mod': b = s.pop(); a = s.pop(); s.push(b ? a % b : 0); break
      case 'neg': s.push(-s.pop()); break
      case 'abs': s.push(Math.abs(s.pop())); break
      case 'sqrt': s.push(Math.sqrt(Math.max(0, s.pop()))); break
      case 'sin': s.push(Math.sin((s.pop() * Math.PI) / 180)); break
      case 'cos': s.push(Math.cos((s.pop() * Math.PI) / 180)); break
      case 'atan': b = s.pop(); a = s.pop(); s.push(((Math.atan2(a, b) * 180) / Math.PI + 360) % 360); break
      case 'exp': b = s.pop(); a = s.pop(); s.push(a ** b); break
      case 'ln': s.push(Math.log(s.pop())); break
      case 'log': s.push(Math.log10(s.pop())); break
      case 'floor': s.push(Math.floor(s.pop())); break
      case 'ceiling': s.push(Math.ceil(s.pop())); break
      case 'round': s.push(Math.round(s.pop())); break
      case 'truncate': s.push(Math.trunc(s.pop())); break
      case 'cvi': s.push(Math.trunc(s.pop())); break
      case 'cvr': break
      case 'dup': s.push(s[s.length - 1]); break
      case 'pop': s.pop(); break
      case 'exch': b = s.pop(); a = s.pop(); s.push(b, a); break
      case 'copy': { const n = s.pop(); s.push(...s.slice(s.length - n)); break }
      case 'index': { const n = s.pop(); s.push(s[s.length - 1 - n]); break }
      case 'roll': {
        let j = s.pop(); const n = s.pop()
        if (n <= 0) break
        const seg = s.splice(s.length - n, n)
        j = ((j % n) + n) % n
        s.push(...seg.slice(n - j), ...seg.slice(0, n - j))
        break
      }
      case 'eq': b = s.pop(); a = s.pop(); s.push(a === b); break
      case 'ne': b = s.pop(); a = s.pop(); s.push(a !== b); break
      case 'gt': b = s.pop(); a = s.pop(); s.push(a > b); break
      case 'ge': b = s.pop(); a = s.pop(); s.push(a >= b); break
      case 'lt': b = s.pop(); a = s.pop(); s.push(a < b); break
      case 'le': b = s.pop(); a = s.pop(); s.push(a <= b); break
      case 'and': b = s.pop(); a = s.pop(); s.push(typeof a === 'boolean' ? a && b : a & b); break
      case 'or': b = s.pop(); a = s.pop(); s.push(typeof a === 'boolean' ? a || b : a | b); break
      case 'xor': b = s.pop(); a = s.pop(); s.push(typeof a === 'boolean' ? a !== b : a ^ b); break
      case 'not': a = s.pop(); s.push(typeof a === 'boolean' ? !a : ~a); break
      case 'bitshift': b = s.pop(); a = s.pop(); s.push(b >= 0 ? a << b : a >> -b); break
      case 'true': s.push(true); break
      case 'false': s.push(false); break
      case 'if': { const p = s.pop(); if (s.pop()) runPS(p, s); break }
      case 'ifelse': { const p2 = s.pop(); const p1 = s.pop(); runPS(s.pop() ? p1 : p2, s); break }
      default: throw new Error(`ps op ${t}`)
    }
  }
}

// ---- src/pdf/image.js ----
// Colour spaces + image XObject decoding to RGBA, pure JS (runs in node too).
// DCT/JPX payloads are handed back undecoded — the browser owns those codecs.

const nameOf = (v) => (v?.k === 'n' ? v.v : null)
const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v)

const cmykToRgb = (c, m, y, k) => [
  (1 - c) * (1 - k), (1 - m) * (1 - k), (1 - y) * (1 - k),
]
const labToRgb = (L, a, b) => { // D65, sRGB gamma
  let y = (L + 16) / 116, x = a / 500 + y, z = y - b / 200
  const f = (t) => (t ** 3 > 0.008856 ? t ** 3 : (t - 16 / 116) / 7.787)
  x = 0.95047 * f(x); y = f(y); z = 1.08883 * f(z)
  const g = (c) => (c > 0.0031308 ? 1.055 * c ** (1 / 2.4) - 0.055 : 12.92 * c)
  return [g(x * 3.2406 + y * -1.5372 + z * -0.4986), g(x * -0.9689 + y * 1.8758 + z * 0.0415), g(x * 0.0557 + y * -0.204 + z * 1.057)].map(clamp01)
}

/**
 * Resolve a colour space → {n, name, toRGB(comps[0..1]) → [r,g,b] 0..1, indexed?, hival?}.
 * Unknown spaces fall back by component count so something sensible paints.
 */
async function resolveColorSpace(doc, cs, res = null) {
  cs = deref(doc, cs)
  // named resource (/CS0) → look up in Resources /ColorSpace
  const nm = nameOf(cs)
  if (nm && !/^Device|^Pattern$/.test(nm) && res instanceof Map) {
    let csd = deref(doc, res.get('ColorSpace'))
    const inner = csd instanceof Map ? csd.get(nm) : undefined
    if (inner !== undefined) return resolveColorSpace(doc, inner, null)
  }
  const fam = nm ?? (Array.isArray(cs) ? nameOf(deref(doc, cs[0])) : null)
  const gray = { n: 1, name: 'DeviceGray', toRGB: (c) => [c[0], c[0], c[0]] }
  const rgb = { n: 3, name: 'DeviceRGB', toRGB: (c) => [c[0], c[1], c[2]] }
  const cmyk = { n: 4, name: 'DeviceCMYK', toRGB: (c) => cmykToRgb(c[0], c[1], c[2], c[3]) }
  switch (fam) {
    case 'DeviceGray': case 'G': case 'CalGray': return gray
    case 'DeviceRGB': case 'RGB': case 'CalRGB': return rgb
    case 'DeviceCMYK': case 'CMYK': return cmyk
    case 'Lab': {
      const d = deref(doc, cs[1])
      const r = (d instanceof Map && d.get('Range')) || [-100, 100, -100, 100]
      // components arrive normalised 0..1 over [0,100],[amin,amax],[bmin,bmax]
      return { n: 3, name: 'Lab', toRGB: (c) => labToRgb(c[0] * 100, r[0] + c[1] * (r[1] - r[0]), r[2] + c[2] * (r[3] - r[2])), lab: r }
    }
    case 'ICCBased': {
      const s = deref(doc, cs[1])
      const d = s?.dict
      const n = d?.get('N') ?? 3
      const alt = d?.get('Alternate')
      if (alt) {
        const a = await resolveColorSpace(doc, alt).catch(() => null)
        if (a && a.n === n) return { ...a, name: 'ICCBased' }
      }
      return { ...(n === 1 ? gray : n === 4 ? cmyk : rgb), name: 'ICCBased' }
    }
    case 'Indexed': case 'I': {
      const base = await resolveColorSpace(doc, cs[1])
      const hival = deref(doc, cs[2]) ?? 255
      let lk = deref(doc, cs[3])
      let bytes
      if (lk?.k === 't') bytes = (await decodeChain(lk.dict, lk.data)).data
      else if (lk?.bytes) bytes = lk.bytes
      else bytes = new Uint8Array(0)
      const palette = []
      for (let i = 0; i <= hival; i++) {
        const comps = []
        for (let k = 0; k < base.n; k++) comps.push((bytes[i * base.n + k] ?? 0) / 255)
        palette.push(base.toRGB(comps))
      }
      return { n: 1, name: 'Indexed', indexed: true, hival, toRGB: (c) => palette[Math.max(0, Math.min(hival, Math.round(c[0])))] ?? [0, 0, 0] }
    }
    case 'Separation': case 'DeviceN': {
      const nIn = fam === 'Separation' ? 1 : (deref(doc, cs[1])?.length ?? 1)
      const alt = await resolveColorSpace(doc, cs[2]).catch(() => gray)
      const fn = await compileFunction(doc, cs[3]).catch(() => null)
      const sepName = fam === 'Separation' ? nameOf(cs[1]) : null
      if (sepName === 'None') return { n: 1, name: fam, none: true, toRGB: () => [1, 1, 1] }
      return {
        n: nIn, name: fam,
        toRGB: fn ? (c) => alt.toRGB(fn(c)) : (c) => { const v = 1 - clamp01(c[0]); return [v, v, v] },
      }
    }
    case 'Pattern': return { n: 0, name: 'Pattern', pattern: true, toRGB: () => [0.5, 0.5, 0.5] }
    default:
      return rgb
  }
}

/** Read N samples of `bpc` bits from a row starting at byte `off`. */
function readSamples(data, off, count, bpc, out) {
  if (bpc === 8) { for (let i = 0; i < count; i++) out[i] = data[off + i] ?? 0; return }
  if (bpc === 16) { for (let i = 0; i < count; i++) out[i] = ((data[off + 2 * i] ?? 0) << 8) | (data[off + 2 * i + 1] ?? 0); return }
  const mask = (1 << bpc) - 1
  for (let i = 0; i < count; i++) {
    const bit = i * bpc
    const byte = data[off + (bit >> 3)] ?? 0
    out[i] = (byte >> (8 - bpc - (bit & 7))) & mask
  }
}

/**
 * Decode an image XObject (stream) → result:
 *   {kind:'rgba', w, h, rgba: Uint8ClampedArray}           raw samples, fully decoded
 *   {kind:'jpeg'|'jpx', w, h, data, smask?: rgba-alpha-plane|null, cmyk?: bool}
 *   null when unsupported (JBIG2/CCITT, broken data)
 * opts.fill = [r,g,b] 0..1 for stencil masks (ImageMask true).
 */
async function decodeImage(doc, v, { fill = [0, 0, 0], res = null, inline = false } = {}) {
  const d = v.dict
  const g = (k, k2) => { const x = d.get(k) ?? (k2 ? d.get(k2) : undefined); return deref(doc, x) }
  const w = g('Width', 'W') ?? 0
  const h = g('Height', 'H') ?? 0
  if (!w || !h || w * h > 40e6) return null
  const isMask = g('ImageMask', 'IM') === true
  const bpc = isMask ? 1 : g('BitsPerComponent', 'BPC') ?? 8
  const decodeArr = g('Decode', 'D')
  const chain = await decodeChain(d, v.data, { stopAtImage: true })
  const smaskAlpha = !isMask && !inline ? await softMask(doc, d) : null

  if (chain.codec === 'DCTDecode' || chain.codec === 'JPXDecode') {
    let cmyk = false
    const csv = g('ColorSpace', 'CS')
    if (csv) { const cs = await resolveColorSpace(doc, csv, res).catch(() => null); cmyk = cs?.n === 4 }
    return { kind: chain.codec === 'DCTDecode' ? 'jpeg' : 'jpx', w, h, data: chain.data, smask: smaskAlpha, cmyk, invert: Array.isArray(decodeArr) && decodeArr[0] === 1 }
  }
  if (chain.codec) return null // JBIG2 / CCITT

  const data = chain.data
  const rgba = new Uint8ClampedArray(w * h * 4)
  if (isMask) {
    const paintOn = Array.isArray(decodeArr) && decodeArr[0] === 1 ? 1 : 0
    const rowBytes = Math.ceil(w / 8)
    const [r, gg, b] = fill.map((c) => Math.round(c * 255))
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const bit = (data[y * rowBytes + (x >> 3)] >> (7 - (x & 7))) & 1
        const o = (y * w + x) * 4
        if (bit === paintOn) { rgba[o] = r; rgba[o + 1] = gg; rgba[o + 2] = b; rgba[o + 3] = 255 }
      }
    }
    return { kind: 'rgba', w, h, rgba, stencil: true }
  }

  const cs = await resolveColorSpace(doc, g('ColorSpace', 'CS') ?? { k: 'n', v: 'DeviceGray' }, res)
  const n = cs.n || 1
  const rowBytes = Math.ceil((w * n * bpc) / 8)
  const maxV = (1 << bpc) - 1
  const dec = Array.isArray(decodeArr) ? decodeArr : cs.lab ? [0, 100, ...cs.lab] : null
  const samples = new Array(w * n)
  const comps = new Array(n)
  // colour-key masking: /Mask [min0 max0 min1 max1 …] on raw sample values
  const maskV = g('Mask')
  const keyRanges = Array.isArray(maskV) ? maskV.map((x) => deref(doc, x)) : null
  // cache for 8-bit single-channel / indexed (cheap and very common)
  const lut = n === 1 && bpc <= 8 ? new Map() : null
  for (let y = 0; y < h; y++) {
    readSamples(data, y * rowBytes, w * n, bpc, samples)
    for (let x = 0; x < w; x++) {
      const o = (y * w + x) * 4
      let rgb
      if (lut) {
        const s = samples[x]
        rgb = lut.get(s)
        if (!rgb) {
          let c = cs.indexed ? (dec ? dec[0] + (s * (dec[1] - dec[0])) / maxV : s) : dec ? dec[0] + (s * (dec[1] - dec[0])) / maxV : s / maxV
          rgb = cs.toRGB([c])
          lut.set(s, rgb)
        }
      } else {
        for (let k = 0; k < n; k++) {
          const s = samples[x * n + k]
          comps[k] = dec ? dec[2 * k] + (s * (dec[2 * k + 1] - dec[2 * k])) / maxV : s / maxV
        }
        if (cs.lab) { // Lab components decode over their own ranges already
          rgb = labToRgb(comps[0], comps[1], comps[2])
        } else rgb = cs.toRGB(comps)
      }
      rgba[o] = rgb[0] * 255
      rgba[o + 1] = rgb[1] * 255
      rgba[o + 2] = rgb[2] * 255
      let a = 255
      if (keyRanges) {
        let inside = true
        for (let k = 0; k < n; k++) {
          const s = samples[x * n + k]
          if (s < keyRanges[2 * k] || s > keyRanges[2 * k + 1]) { inside = false; break }
        }
        if (inside) a = 0
      }
      rgba[o + 3] = a
    }

    const m = await decodeImage(doc, { dict: new Map([...maskV.dict, ['ImageMask', true]]), data: maskV.data }, { fill: [0, 0, 0] }).catch(() => null)

}

/** /SMask → {w,h,a} alpha plane (gray decoded). */
async function softMask(doc, d) {
  const sm = deref(doc, d.get('SMask'))
  if (sm?.k !== 't') return null
  const m = await decodeImage(doc, { dict: new Map([...sm.dict, ['ColorSpace', { k: 'n', v: 'DeviceGray' }]]).set('SMask', undefined), data: sm.data }).catch(() => null)
  if (!m || m.kind !== 'rgba') return null
  const a = new Uint8ClampedArray(m.w * m.h)
  for (let i = 0; i < a.length; i++) a[i] = m.rgba[i * 4]
  return { w: m.w, h: m.h, a }
}

/** Multiply an alpha plane (any size — nearest resample) into rgba. */
function applyAlpha(rgba, w, h, { w: mw, h: mh, a }) {
  for (let y = 0; y < h; y++) {
    const my = Math.min(mh - 1, Math.floor((y * mh) / h))
    for (let x = 0; x < w; x++) {
      const mx = Math.min(mw - 1, Math.floor((x * mw) / w))
      const o = (y * w + x) * 4 + 3
      rgba[o] = (rgba[o] * a[my * mw + mx]) / 255
    }
  }
}

// Bookmarks (document outline): read into a plain tree, write back against a
// new page numbering. Lets merge / split / organize keep navigation intact.

const MAX_NODES = 20000

/** PDF text string → JS string (UTF-16BE BOM or PDFDocEncoding≈Latin-1). */
function pdfString(v) {
  const b = v?.bytes
  if (!b) return ''
  if (b[0] === 0xfe && b[1] === 0xff) {
    let s = ''
    for (let i = 2; i + 1 < b.length; i += 2) s += String.fromCharCode((b[i] << 8) | b[i + 1])
    return s
  }
  if (b[0] === 0xef && b[1] === 0xbb && b[2] === 0xbf) return new TextDecoder().decode(b.subarray(3))
  let s = ''
  for (const c of b) s += String.fromCharCode(c)
  return s
}

/** JS string → PDF text string (Latin-1 when possible, else UTF-16BE). */
function textString(s) {
  if (/^[\x20-\x7e\xa0-\xff]*$/.test(s)) return str(Uint8Array.from(s, (c) => c.charCodeAt(0)))
  const out = [0xfe, 0xff]
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); out.push(c >> 8, c & 255) }
  return str(new Uint8Array(out))
}

/** Look up a named destination (catalog /Dests dict or /Names /Dests tree). */
function namedDest(doc, cat, key) {
  const dd = (v) => deref(doc, v)
  const old = dd(get(cat, 'Dests'))
  if (old instanceof Map && old.has(key)) return dd(old.get(key))
  const tree = dd(get(dd(get(cat, 'Names')), 'Dests'))
  let guard = 0
  const search = (node) => {
    if (!(node instanceof Map) || guard++ > 5000) return undefined
    const names = dd(get(node, 'Names'))
    if (Array.isArray(names)) {
      for (let i = 0; i + 1 < names.length; i += 2) if (pdfString(dd(names[i])) === key) return dd(names[i + 1])
    }
    const kids = dd(get(node, 'Kids'))
    if (Array.isArray(kids)) for (const k of kids) { const r = search(dd(k)); if (r !== undefined) return r }
    return undefined
  }
  return search(tree)
}

/** Destination value → {page: srcPageKey, view: [...rest]} or null. */
function resolveDest(doc, cat, d) {
  d = deref(doc, d)
  if (d?.k === 'n') d = namedDest(doc, cat, d.v)
  else if (d?.bytes) d = namedDest(doc, cat, pdfString(d))
  if (d instanceof Map) d = deref(doc, get(d, 'D')) // dest dict form
  if (!Array.isArray(d) || !d.length) return null
  const p = d[0]
  if (isRef(p)) return { page: `${p.n} ${p.g}`, view: d.slice(1) }
  if (typeof p === 'number') return { pageIndex: p, view: d.slice(1) } // remote-style index
  return null
}

/**
 * Read the outline → [{title, page: srcPageKey|null, view, open, children}].
 * Entries whose action isn't an internal GoTo keep page:null (title-only).
 */
function readOutline(doc) {
  const dd = (v) => deref(doc, v)
  const root = dd(get(doc.trailer, 'Root'))
  const cat = isStream(root) ? root.dict : root
  const outlines = dd(get(cat, 'Outlines'))
  if (!(outlines instanceof Map)) return []
  let count = 0
  const seen = new Set()
  const walk = (firstRef) => {
    const out = []
    let cur = firstRef
    while (cur && count < MAX_NODES) {
      const key = isRef(cur) ? `${cur.n} ${cur.g}` : null
      if (key && seen.has(key)) break // cycle guard
      if (key) seen.add(key)
      const node = dd(cur)
      if (!(node instanceof Map)) break
      count++
      let dest = get(node, 'Dest')
      if (dest === undefined) {
        const a = dd(get(node, 'A'))
        if (a instanceof Map && get(a, 'S')?.v === 'GoTo') dest = get(a, 'D')
      }
      const r = dest !== undefined ? resolveDest(doc, cat, dest) : null
      const c = get(node, 'Count')
      out.push({
        title: pdfString(dd(get(node, 'Title'))),
        page: r?.page ?? null,
        pageIndex: r?.pageIndex,
        view: r?.view ?? [name('Fit')],
        open: typeof c === 'number' ? c > 0 : false,
        children: walk(get(node, 'First')),
      })
      cur = get(node, 'Next')
    }
    return out
  }
  return walk(get(outlines, 'First'))
}

/**
 * Re-target a tree: mapPage(srcPageKey) → new page ref | null. Entries whose
 * page vanished are dropped, but their surviving children are promoted.
 */
function remapOutline(tree, mapPage) {
  const out = []
  for (const n of tree) {
    const kids = remapOutline(n.children, mapPage)
    const target = n.page ? mapPage(n.page) : null
    if (target || (!n.page && kids.length)) out.push({ ...n, target, children: kids })
    else out.push(...kids)
  }
  return out
}

/**
 * Write a remapped tree (nodes carry .target page ref or null) into dst →
 * ref to the /Outlines dict, or null for an empty tree.
 */
function writeOutline(dst, tree) {
  if (!tree.length) return null
  const rootNum = dst.alloc()
  const level = (nodes, parentNum) => {
    const nums = nodes.map(() => dst.alloc())
    let visible = 0
    nodes.forEach((n, i) => {
      const d = new Map([['Title', textString(n.title || 'Untitled')], ['Parent', ref(parentNum, 0)]])
      if (i > 0) d.set('Prev', ref(nums[i - 1], 0))
      if (i < nodes.length - 1) d.set('Next', ref(nums[i + 1], 0))
      if (n.target) d.set('Dest', [n.target, ...(n.view?.length ? n.view.map(cloneView) : [name('Fit')])])
      if (n.children?.length) {
        const sub = level(n.children, nums[i])
        d.set('First', ref(sub.first, 0))
        d.set('Last', ref(sub.last, 0))
        d.set('Count', n.open ? sub.visible : -sub.visible)
        if (n.open) visible += sub.visible
      }
      visible++
      dst.set(nums[i], d)
    })
    return { first: nums[0], last: nums[nums.length - 1], visible }
  }
  const top = level(tree, rootNum)
  dst.set(rootNum, new Map([['Type', name('Outlines')], ['First', ref(top.first, 0)], ['Last', ref(top.last, 0)], ['Count', top.visible]]))
  return ref(rootNum, 0)
}

// view operands are plain values (names/numbers/null) — copy defensively
const cloneView = (v) => (v && typeof v === 'object' && !isRef(v) ? { ...v } : isRef(v) ? null : v)

// Minimal ZIP writer — STORE method (no compression), enough for download bundles.

const CRC_TABLE = (() => {
  const t = new Uint32Array(256)
  for (let n = 0; n < 256; n++) {
    let c = n
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1
    t[n] = c >>> 0
  }
  return t
})()

function crc32(data, crc = 0xffffffff) {
  for (let i = 0; i < data.length; i++) crc = CRC_TABLE[(crc ^ data[i]) & 0xff] ^ (crc >>> 8)
  return (crc ^ 0xffffffff) >>> 0
}

const zte = new TextEncoder() // named uniquely — single-file build shares one scope

/** files: [{name: string, data: Uint8Array}] → zip bytes */
function zipStore(files) {
  const chunks = []
  const central = []
  let offset = 0

  const u16 = (n) => new Uint8Array([n & 0xff, (n >> 8) & 0xff])
  const u32 = (n) => new Uint8Array([n & 0xff, (n >> 8) & 0xff, (n >> 16) & 0xff, (n >>> 24) & 0xff])

  for (const f of files) {
    const nameBytes = zte.encode(f.name)
    const crc = crc32(f.data)
    const local = [
      u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(0), u16(0), // sig, ver, utf8 flag, method, time, date
      u32(crc), u32(f.data.length), u32(f.data.length),
      u16(nameBytes.length), u16(0), nameBytes,
    ]
    chunks.push(...local, f.data)
    central.push({ nameBytes, crc, size: f.data.length, offset })
    offset += local.reduce((n, c) => n + c.length, 0) + f.data.length
  }

  const cdStart = offset
  for (const c of central) {
    const rec = [
      u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(c.crc), u32(c.size), u32(c.size),
      u16(c.nameBytes.length), u16(0), u16(0), u16(0), u16(0),
      u32(0), u32(c.offset), c.nameBytes,
    ]
    chunks.push(...rec)
    offset += rec.reduce((n, x) => n + x.length, 0)
  }
  const cdSize = offset - cdStart

  chunks.push(
    u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
    u32(cdSize), u32(cdStart), u16(0),
  )

  const out = new Uint8Array(chunks.reduce((n, c) => n + c.length, 0))
  let o = 0
  for (const c of chunks) { out.set(c, o); o += c.length }
  return out
}

// Minimal PNG encoder — truecolor/gray 8-bit, zlib stream with STORED deflate
// blocks (no compression, but valid). Enough to export decoded PDF rasters.

function adler32(data) {
  let a = 1, b = 0
  for (let i = 0; i < data.length; i++) {
    a = (a + data[i]) % 65521
    b = (b + a) % 65521
  }
  return ((b << 16) | a) >>> 0
}

/** Wrap raw bytes in a zlib stream using uncompressed deflate blocks. */
function zlibStore(data) {
  const nBlocks = Math.max(1, Math.ceil(data.length / 65535))
  const out = new Uint8Array(2 + data.length + nBlocks * 5 + 4)
  let o = 0
  out[o++] = 0x78
  out[o++] = 0x01
  for (let i = 0; i < nBlocks; i++) {
    const chunk = data.subarray(i * 65535, (i + 1) * 65535)
    const last = i === nBlocks - 1
    out[o++] = last ? 1 : 0
    out[o++] = chunk.length & 0xff
    out[o++] = (chunk.length >> 8) & 0xff
    out[o++] = ~chunk.length & 0xff
    out[o++] = (~chunk.length >> 8) & 0xff
    out.set(chunk, o)
    o += chunk.length
  }
  const adler = adler32(data)
  out[o++] = (adler >>> 24) & 0xff
  out[o++] = (adler >>> 16) & 0xff
  out[o++] = (adler >>> 8) & 0xff
  out[o++] = adler & 0xff
  return out.subarray(0, o)
}

/**
 * pixels: Uint8Array of samples. channels: true → gray (1), false → RGB (3),
 * or a number: 1 gray, 2 gray+alpha, 3 RGB, 4 RGBA.
 */
function pngEncode(width, height, pixels, channels = false) {
  const bpp = channels === true ? 1 : channels === false ? 3 : channels
  const stride = width * bpp
  if (pixels.length !== stride * height) throw new Error('pixel buffer size mismatch')

  const scan = new Uint8Array((stride + 1) * height)
  for (let y = 0; y < height; y++) {
    scan[y * (stride + 1)] = 0 // filter: none
    scan.set(pixels.subarray(y * stride, (y + 1) * stride), y * (stride + 1) + 1)
  }

  const chunk = (type, data) => {
    const t = new TextEncoder().encode(type)
    const len = new Uint8Array(4)
    new DataView(len.buffer).setUint32(0, data.length)
    const body = new Uint8Array(t.length + data.length)
    body.set(t)
    body.set(data, t.length)
    const crc = new Uint8Array(4)
    new DataView(crc.buffer).setUint32(0, crc32(body))
    const out = new Uint8Array(4 + body.length + 4)
    out.set(len, 0)
    out.set(body, 4)
    out.set(crc, 4 + body.length)
    return out
  }

  const ihdr = new Uint8Array(13)
  const dv = new DataView(ihdr.buffer)
  dv.setUint32(0, width)
  dv.setUint32(4, height)
  ihdr[8] = 8 // bit depth
  ihdr[9] = { 1: 0, 2: 4, 3: 2, 4: 6 }[bpp] // color type
  // compression/filter/interlace = 0

  const sig = new Uint8Array([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a])
  const parts = [sig, chunk('IHDR', ihdr), chunk('IDAT', zlibStore(scan)), chunk('IEND', new Uint8Array(0))]
  const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0))
  let o = 0
  for (const p of parts) { out.set(p, o); o += p.length }
  return out
}

// Page content interpreter: tokenizer (with byte offsets + inline images),
// fonts / text decoding, and the walker that turns a page's operators into
// positioned display-space draw ops for the renderer, text extraction,
// redaction and text editing.

// ---------- content bytes + tokenizer ----------

/** Decode a stream through its whole filter chain → bytes (null for image codecs / unsupported). */
async function streamData(s) {
  try {
    const { data, codec } = await decodeChain(s.dict, s.data, { stopAtImage: true })
    return codec ? null : data
  } catch {
    return null
  }
}

/**
 * A page's decoded Contents, concatenated with a newline between streams
 * (streams may split mid-object but tokens must never fuse: "ET"+"BT").
 * Returns null when nothing decodes.
 */
async function contentBytes(doc, leaf) {
  let c = get(leaf.dict, 'Contents')
  if (isRef(c)) c = deref(doc, c)
  const streams = isStream(c) ? [c]
    : Array.isArray(c) ? c.map((x) => deref(doc, x)).filter(isStream)
    : []
  const parts = []
  for (const s of streams) {
    const d = await streamData(s)
    if (d === null) continue // one broken stream shouldn't blank the whole page
    if (parts.length) parts.push(NL)
    parts.push(d)
  }
  return parts.length ? concat(parts) : null
}
const NL = new Uint8Array([10])

/**
 * Content-stream tokenizer → [{op, operands, start, end}] where start/end are
 * byte offsets covering the operands + operator (for in-place rewriting).
 * Operands: numbers, booleans, null, {t:'name',v}, {t:'str',bytes,hex?},
 * {t:'arr',items}, {t:'dict',v:Map} (inline dicts e.g. BDC properties).
 * Inline images arrive as one op: {op:'BI', dict: Map, data: Uint8Array}.
 */
function tokenizeContent(data) {
  const ops = []
  let operands = []
  let opStart = -1
  let i = 0
  const n = data.length
  const isWS = (c) => c === 0 || c === 9 || c === 10 || c === 12 || c === 13 || c === 32
  const isDelim = (c) => isWS(c) || c === 0x5b || c === 0x5d || c === 0x3c || c === 0x3e || c === 0x28 || c === 0x29 || c === 0x2f || c === 0x25 || c === 0x7b || c === 0x7d
  const stack = [] // open arrays / dicts: {kind, at: operands length}
  const mark = () => { if (opStart < 0) opStart = i }
  const readName = () => {
    let j = i + 1
    while (j < n && !isDelim(data[j])) j++
    let nm = ''
    for (let k = i + 1; k < j; k++) {
      if (data[k] === 0x23 && k + 2 < j) {
        const hv = parseInt(String.fromCharCode(data[k + 1], data[k + 2]), 16)
        if (!Number.isNaN(hv)) { nm += String.fromCharCode(hv); k += 2; continue }
      }
      nm += String.fromCharCode(data[k])
    }
    i = j
    return { t: 'name', v: nm }
  }
  while (i < n) {
    const c = data[i]
    if (isWS(c)) { i++; continue }
    if (c === 0x25) { while (i < n && data[i] !== 0x0a && data[i] !== 0x0d) i++; continue }
    mark()
    if (c === 0x2f) { operands.push(readName()); continue }
    if (c === 0x28) {
      let j = i + 1, depth = 1
      const bytes = []
      while (j < n && depth) {
        const b = data[j]
        if (b === 0x5c) {
          const e = data[j + 1]
          if (e === 0x0a) { j += 2; continue }
          if (e === 0x0d) { j += data[j + 2] === 0x0a ? 3 : 2; continue }
          const esc = { 0x6e: 0x0a, 0x72: 0x0d, 0x74: 0x09, 0x62: 0x08, 0x66: 0x0c }[e]
          if (esc !== undefined) { bytes.push(esc); j += 2; continue }
          if (e >= 0x30 && e <= 0x37) {
            let oct = 0, k = 0
            while (k < 3 && data[j + 1 + k] >= 0x30 && data[j + 1 + k] <= 0x37) { oct = oct * 8 + (data[j + 1 + k] - 0x30); k++ }
            bytes.push(oct & 0xff); j += 1 + k; continue
          }
          bytes.push(e); j += 2; continue
        }
        if (b === 0x28) depth++
        else if (b === 0x29) { depth--; if (!depth) { j++; break } }
        bytes.push(b)
        j++
      }
      operands.push({ t: 'str', bytes: Uint8Array.from(bytes) })
      i = j
      continue
    }
    if (c === 0x3c) {
      if (data[i + 1] === 0x3c) { stack.push({ kind: 'dict', at: operands.length }); i += 2; continue }
      let j = i + 1, hexs = ''
      while (j < n && data[j] !== 0x3e) { if (!isWS(data[j])) hexs += String.fromCharCode(data[j]); j++ }
      const bytes = new Uint8Array(Math.ceil(hexs.length / 2))
      for (let k = 0; k < bytes.length; k++) bytes[k] = parseInt(hexs.slice(k * 2, k * 2 + 2).padEnd(2, '0'), 16)
      operands.push({ t: 'str', bytes, hex: true })
      i = j + 1
      continue
    }
    if (c === 0x3e && data[i + 1] === 0x3e) {
      const top = stack.pop()
      i += 2
      if (top?.kind === 'dict') {
        const items = operands.splice(top.at)
        const m = new Map()
        for (let k = 0; k + 1 < items.length; k += 2) if (items[k]?.t === 'name') m.set(items[k].v, items[k + 1])
        operands.push({ t: 'dict', v: m })
      }
      continue
    }
    if (c === 0x5b) { stack.push({ kind: 'arr', at: operands.length }); i++; continue }
    if (c === 0x5d) {
      const top = stack.pop()
      i++
      if (top?.kind === 'arr') operands.push({ t: 'arr', items: operands.splice(top.at) })
      continue
    }
    if (c === 0x7b || c === 0x7d) { i++; continue } // PostScript braces (type-4 leakage) — ignore
    let j = i
    while (j < n && !isDelim(data[j])) j++
    const tok = dec(data.subarray(i, j))
    i = j
    if (/^[+-]?(\d+\.?\d*|\.\d+)$/.test(tok)) { operands.push(parseFloat(tok)); continue }
    if (/^[+-]?\d*\.\d*\.\d*$|^--?\d/.test(tok)) { operands.push(parseFloat(tok.replace(/^--/, '-')) || 0); continue } // malformed numbers seen in the wild
    if (tok === 'true' || tok === 'false' || tok === 'null') { operands.push(tok === 'true' ? true : tok === 'false' ? false : null); continue }
    if (stack.length) { // an operator inside an unclosed array/dict: treat as junk name
      operands.push({ t: 'name', v: tok })
      continue
    }
    if (tok === 'BI') {
      // inline image: key/value pairs until ID, one whitespace byte, raw data until EI
      const start = opStart
      const pairs = []
      while (i < n) {
        while (i < n && isWS(data[i])) i++
        if (data[i] === 0x2f) { pairs.push(readName()); continue }
        let k = i
        while (k < n && !isDelim(data[k])) k++
        const word = dec(data.subarray(i, k))
        if (word === 'ID') { i = k; break }
        // a value: reuse the value tokenizer on a tiny slice
        if (data[i] === 0x5b) {
          let depth = 0, e = i
          do { if (data[e] === 0x5b) depth++; else if (data[e] === 0x5d) depth--; e++ } while (e < n && depth)
          const sub = tokenizeContent(concat([data.subarray(i, e), new Uint8Array([32, 0x6e])]))
          pairs.push(sub[0]?.operands[0] ?? null)
          i = e
        } else if (data[i] === 0x3c || data[i] === 0x28) {
          const sub = tokenizeContent(concat([data.subarray(i, Math.min(n, i + 4096)), new Uint8Array([32, 0x6e])]))
          pairs.push(sub[0]?.operands[0] ?? null)
          // advance past the string/hex
          if (data[i] === 0x3c) { while (i < n && data[i] !== 0x3e) i++; i++ } else {
            let depth = 0
            do { if (data[i] === 0x5c) i++; else if (data[i] === 0x28) depth++; else if (data[i] === 0x29) depth--; i++ } while (i < n && depth)
          }
        } else {
          pairs.push(/^[+-]?(\d+\.?\d*|\.\d+)$/.test(word) ? parseFloat(word) : word === 'true' ? true : word === 'false' ? false : { t: 'name', v: word })
          i = k
        }
      }
      if (i < n && isWS(data[i])) i++
      const dict = new Map()
      for (let k = 0; k + 1 < pairs.length; k += 2) if (pairs[k]?.t === 'name') dict.set(pairs[k].v, contentToPdfVal(pairs[k + 1]))
      // EI must be preceded by whitespace and followed by a delimiter; for
      // uncompressed images the byte count is known and checked first
      const ds = i
      let de = -1
      const w = dict.get('W') ?? dict.get('Width'), h = dict.get('H') ?? dict.get('Height')
      const filt = dict.get('F') ?? dict.get('Filter')
      if (!filt && typeof w === 'number' && typeof h === 'number') {
        const im = dict.get('IM') ?? dict.get('ImageMask')
        const bpc = im === true ? 1 : dict.get('BPC') ?? dict.get('BitsPerComponent') ?? 8
        const cs = dict.get('CS') ?? dict.get('ColorSpace')
        const csn = cs?.k === 'n' ? cs.v : ''
        const comps = im === true ? 1 : /RGB/.test(csn) ? 3 : /CMYK/.test(csn) ? 4 : 1
        const len = Math.ceil((w * comps * bpc) / 8) * h
        let e = ds + len
        while (e < n && isWS(data[e])) e++
        if (data[e] === 0x45 && data[e + 1] === 0x49) { de = ds + len; i = e + 2 }
      }
      if (de < 0) {
        while (i < n) {
          if (isWS(data[i]) && data[i + 1] === 0x45 && data[i + 2] === 0x49 && (i + 3 >= n || isDelim(data[i + 3]))) { de = i; i += 3; break }
          i++
        }
        if (de < 0) { de = n; i = n }
      }
      ops.push({ op: 'BI', operands: [], dict, data: data.slice(ds, de), start, end: i })
      operands = []
      opStart = -1
      continue
    }
    ops.push({ op: tok, operands, start: opStart, end: i })
    operands = []
    opStart = -1
  }
  return ops
}

/** Content-tokenizer operand → parser-style PDF value (for inline image dicts). */
function contentToPdfVal(v) {
  if (v?.t === 'name') return { k: 'n', v: v.v }
  if (v?.t === 'str') return { k: v.hex ? 'x' : 's', bytes: v.bytes }
  if (v?.t === 'arr') return v.items.map(contentToPdfVal)
  if (v?.t === 'dict') { const m = new Map(); for (const [k, x] of v.v) m.set(k, contentToPdfVal(x)); return m }
  return v
}

// ---------- fonts ----------

/** Parse a /ToUnicode CMap stream → {map: Map<code,string>, codeLen}. */
function parseToUnicode(data) {
  const src = dec(data)
  const hex = (s) => parseInt(s, 16)
  const uni = (s) => {
    let out = ''
    for (let i = 0; i + 4 <= s.length; i += 4) out += String.fromCharCode(parseInt(s.slice(i, i + 4), 16))
    if (s.length === 2) out = String.fromCharCode(parseInt(s, 16))
    return out
  }
  const map = new Map()
  let codeLen = 1
  const cs = src.match(/begincodespacerange\s*<([0-9A-Fa-f]+)>/)
  if (cs) codeLen = Math.max(1, cs[1].length / 2)
  for (const b of src.matchAll(/beginbf(char|range)([\s\S]*?)endbf\1/g)) {
    const [, kind, body] = b
    if (kind === 'char') {
      for (const m of body.matchAll(/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]*)>/g)) {
        codeLen = Math.max(codeLen, m[1].length / 2)
        map.set(hex(m[1]), uni(m[2]))
      }
    } else {
